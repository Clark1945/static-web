<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ES Modules demo</title>
  <style>
    body { font: 16px/1.6 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
    pre { background: #0f172a; color: #e2e8f0; padding: .75rem 1rem; border-radius: 6px; white-space: pre-wrap; }
    button { padding: .4rem 1rem; }
  </style>
</head>
<body>
  <h1>ES Modules demo</h1>
  <p>Open the browser Console as well. This page must be served over HTTP, not opened with <code>file://</code>.</p>
  <button id="inc" type="button">counter.inc()</button>
  <button id="lazy" type="button">Lazy-load chart.js</button>
  <pre id="out"></pre>

  <!-- type="module" is deferred automatically and has its own scope -->
  <script type="module" src="./main.js"></script>
</body>
</html>
