- id: self-match
  title: 最も似ている商品はどれ？
  question: 商品 806 に最も似た 3 件の商品を探すと、1 位はどれになりますか？
  options:
    - 別の Sony のワイヤレスイヤホン
    - 806 自身、距離 0
    - ランダムな 1 件。距離がどれも同じくらいなので
  sqls:
    - label: 自分自身を除外していない
  explanation: |
    自分自身との距離は 0 なので、必ず 1 位になります。「類似商品」「関連記事」では WHERE id <> 806 を忘れずに。
    しかも自分を除くだけでは不十分です：同じ商品の重複データ（別の id で再出品）も距離がほぼ 0 なので、距離のしきい値で除外することもよくあります。

- id: negative-inner-product
  title: <#> を大きい順に並べる
  question: 「内積が最大」（最も似ている）3 件が欲しくて ORDER BY embedding <#> x DESC と書きました。結果は最も似ているものですか？
  options:
    - はい、<#> は内積なので、大きいほど似ている
    - いいえ、<#> は「負の」内積を返すので、DESC だと逆に最も似ていないものが見つかる
    - エラー：<#> では並べ替えられない
  sqls:
    - label: A：<#> … DESC
    - label: B：<#> の小さい順
  explanation: |
    pgvector の <#> は負の内積を返します：似ているほど値が小さくなります（-1 が最も似ている）。A で見つかるのは飲料やフィットネス器具など、イヤホンとはまったく関係のない商品です。
    理由：PostgreSQL のインデックスは「小さい順」の距離の並べ替えにしか対応していないので、内積の符号を反転して、すべての演算子を「小さいほど近い」にしています。
    ★ 3 つの演算子はどれも同じです：ORDER BY 演算子 の小さい順 LIMIT k で、最も似た k 件になります。内積を表示したいときは自分で -1 を掛けます。

- id: opclass-mismatch
  title: L2 距離で cosine インデックスは使える？
  question: passages のベクトルはすべて長さ 1 で、L2 距離と cosine 距離の順位はまったく同じです。インデックスは vector_cosine_ops です。<->（L2）を使う B はインデックスを使いますか？
  options:
    - 使う。順位が同じなので、プランナーは使えると分かっている
    - 使わない。B はテーブル全体をスキャンしてから並べ替える
    - 使うが、変換に少し余分な時間がかかる
  sqls:
    - label: A：<=>（cosine）
    - label: B：<->（L2）
  explanation: |
    ベクトルインデックスは作成時の演算子クラス（operator class）に結び付いています：vector_cosine_ops は <=> だけ、vector_l2_ops は <-> だけ、vector_ip_ops は <#> だけに対応します。
    プランナーは「ベクトルがすべて長さ 1 なので順位が同じ」ことを知らないので、B は Parallel Seq Scan で 10 万回の距離計算をするしかありません。
    ★ インデックスを作る前にどの距離を使うかを決め（通常は埋め込みモデルのドキュメントの推奨に従う）、アプリケーションのクエリでは常に同じ演算子を使いましょう。

- id: similarity-expression
  title: ORDER BY 類似度 DESC
  question: A と B の結果はまったく同じです。HNSW インデックスを使えるのはどちらですか？
  options:
    - どちらも使える
    - A だけ
    - B だけ。インデックスに保存されているのは類似度だから
  sqls:
    - label: A：ORDER BY 距離
    - label: B：ORDER BY 1 - 距離 DESC（類似度の高い順）
  explanation: |
    インデックスが認識するのは「列 演算子 値」の小さい順という形だけです。外側に演算（1 - …、-1 を掛ける、型変換）を 1 枚かぶせると認識できなくなり、B はテーブル全体のスキャンになります。
    ★ ORDER BY には常に元の距離を書き、類似度は人が見るために SELECT で計算するだけにします。

- id: missing-limit
  title: LIMIT がない
  question: すべてを距離順に並べたいので LIMIT を書きませんでした。HNSW インデックスは使われますか？
  options:
    - 使われる。インデックスはもともと並んでいるから
    - 使われない。テーブル全体をスキャンしてから並べ替える
  sqls:
    - label: LIMIT なし
  explanation: |
    HNSW や IVFFlat は「最も近い k 件を探す」ために設計されていて、しかも結果は近似です。返すのは最大でも ef_search（既定 40）か probes がカバーする範囲のデータだけです。
    LIMIT がないとプランナーはこれらを使わず（使うとデータが漏れるため）、テーブル全体で距離を計算してから並べ替えます。ベクトル検索には必ず LIMIT を書きましょう。

- id: filter-fewer-rows
  title: 絞り込み条件を付けると何件返る？
  question: テナント 7 は全データの 2%（約 2000 件）しかありません。WHERE tenant_id = 7 を付けて最も近い 10 件を取ると、何件返りますか？
  options:
    - 10 件。テナント 7 には 2000 件あるので必ず足りる
    - 10 件に満たない
    - 0 件。WHERE とベクトルインデックスは併用できない
  sqls:
    - label: HNSW + WHERE
  explanation: |
    HNSW はまず ef_search（既定 40）個の最も近い候補を探し、それから WHERE を適用します。40 件のうちテナント 7 に属するのは平均 1 件未満なので、返る件数が足りません（この文は 2 件しか返しません）。
    これは「絞り込んでから k 件取る」（post-filtering）の典型的な問題で、マルチテナントの RAG で最もよくはまるポイントです。解決策：
    1. pgvector 0.8：SET hnsw.iterative_scan = relaxed_order とすると、候補が足りないときに自動でさらに探し続けます。
    2. hnsw.ef_search を上げる（例えば 1000）。代償は遅くなること。
    3. 部分インデックス（WHERE tenant_id = 7）やテナントごとのパーティション分割。絞り込み後のデータが少ないなら、正確な検索を直接行う（練習問題「マルチテナント」）。
    実験室の「フィルタ」で、絞り込みの割合ややり方の違いを計測しています。

- id: unknown-words
  title: モデルが認識しないテキスト
  question: 語彙には「iPhone」も「15」もありません。embed('iPhone 15') で検索すると何が得られますか？
  options:
    - Apple のスマートフォン
    - エラー：ベクトルが NULL
    - 適当な 3 件の商品：距離がすべて NULL なので、並べ替えに意味がない
  sqls:
    - label: A：embed('iPhone 15')
    - label: B：それで検索する
  explanation: |
    embed() は 1 語も認識できないとき NULL を返し、すべての距離が NULL になり、ORDER BY が効かず、テーブルで「たまたま先頭にある」商品が返ります。しかもエラーになりません。
    本物の埋め込みモデルは NULL を返しませんが、見たことのない固有名詞（型番、新商品名、社内コード）には同様に不正確なベクトルを返し、結果は「答えがある」ように見えて間違っています。
    ★ 型番、ブランド、品番のような完全一致が必要なものはキーワード検索（またはハイブリッド検索）で。ベクトル検索は「意味が近い」ものを担当します。

- id: avg-not-normalized
  title: 平均ベクトルの長さ
  question: products の各ベクトルの長さはすべて 1 です。「イヤホン」関連カテゴリ全体の平均ベクトルの長さはいくつですか？
  options:
    - 1。平均しても長さは変わらない
    - 1 より小さく、ばらばらなほど短い
    - 1 より大きい。たくさんのベクトルを足したから
  sqls:
    - label: 平均ベクトルの長さ
  explanation: |
    向きの異なるベクトルを平均すると一部が打ち消し合い、長さは 1 より小さくなります。ばらばらなほど（2 つのカテゴリを合わせると）短くなります。
    それで最も近い k 件を探すときの順位には影響しません（cosine は向きしか見ず、長さ 1 のデータに対しては、クエリベクトルを等倍に拡大縮小しても内積や L2 の順位は変わらない）。
    しかし「距離の数値」は変わります：内積や L2 距離はクエリベクトルの長さに依存するので、固定のしきい値（例：内積 > 0.8 なら関連あり）で絞り込むと、除外しすぎてしまいます。
    平均ベクトルをしきい値と比べるときは、先に l2_normalize(avg(…)) します。
    「ユーザーの好みベクトル = 購入した商品の平均」も同じ状況です：興味がばらばらなほど、平均ベクトルは短く、特徴のないものになります。
