# Redis 練習環境設定（docker-compose 的 redis 服務會掛載這個檔案）
# 注意：redis.conf 不支援行尾註解，註解一定要獨立一行

# 練習資料都是從 PostgreSQL 轉進來的，關閉持久化；容器重啟後展示台會自動重新載入
save ""
appendonly no

# 記憶體上限；滿了就拒絕寫入（練習時比較容易看出問題）
maxmemory 512mb
maxmemory-policy noeviction

# 超過 10 ms 的指令記到 SLOWLOG
slowlog-log-slower-than 10000

# ---------------------------------------------------------------- ACL 使用者
# default：展示台後端用來載入資料、重置、跑實驗室（全部權限）
user default on >admin-lab ~* &* +@all

# learner：執行「使用者輸入的指令」（最小權限，比照 PostgreSQL 的 learner 角色）
#   -@dangerous：FLUSHALL、FLUSHDB、KEYS、CONFIG、SHUTDOWN、DEBUG、MONITOR…
#   -@admin    ：管理類指令
#   -@blocking ：BLPOP、XREAD BLOCK 這類會卡住連線的指令
#   -@scripting：EVAL（無窮迴圈的 Lua 會讓整台 Redis 停住）
#   -@pubsub   ：SUBSCRIBE 會把連線切成訂閱模式
user learner on >learner-lab ~* &* +@all -@dangerous -@admin -@blocking -@scripting -@pubsub
