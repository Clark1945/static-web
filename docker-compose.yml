# 資料庫練習環境（與 anime-tagger 的資料庫完全分開）
# 啟動：docker compose up -d（之後 Docker Desktop 啟動時，這些容器會自動跟著啟動）
# 重建 PostgreSQL 資料：docker compose down -v && docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16   # 本機已有的 PostgreSQL 16 映像，免下載
    container_name: pg-lab
    restart: unless-stopped        # Docker 啟動時自動跟著啟動（手動 stop 的除外）
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: shop
      TZ: Asia/Taipei
      PGTZ: Asia/Taipei
    ports:
      - "5434:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: redis-lab
    restart: unless-stopped        # Docker 啟動時自動跟著啟動（手動 stop 的除外）
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6380:6379"                  # 6379 留給本機可能另外安裝的 Redis
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

  mongo:
    image: mongo:8.0
    container_name: mongo-lab
    restart: unless-stopped        # Docker 啟動時自動跟著啟動（手動 stop 的除外）
    # --noscripting：關閉伺服器端 JavaScript（$where、$function、$accumulator 都不能用）
    command: ["mongod", "--noscripting"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin-lab
      TZ: Asia/Taipei
    ports:
      - "27018:27017"                # 27017 留給本機可能另外安裝的 MongoDB
    volumes:
      - ./mongo/init-users.js:/docker-entrypoint-initdb.d/init-users.js:ro

  cassandra:
    image: cassandra:5.0
    container_name: cassandra-lab
    restart: unless-stopped        # Docker 啟動時自動跟著啟動（手動 stop 的除外）
    # 啟動前改設定檔：開啟帳號密碼與權限（預設是誰都能做任何事）、TRUNCATE / DROP 不留快照
    entrypoint: ["bash", "-c"]
    command:
      - |
        sed -i -e 's/^authenticator:.*/authenticator: PasswordAuthenticator/' \
               -e 's/^authorizer:.*/authorizer: CassandraAuthorizer/' \
               -e 's/^auto_snapshot:.*/auto_snapshot: false/' /etc/cassandra/cassandra.yaml
        exec docker-entrypoint.sh cassandra -f
    environment:
      CASSANDRA_CLUSTER_NAME: lab
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G              # 預設會吃掉主機記憶體的 1/4，練習用不需要那麼多
      HEAP_NEWSIZE: 200M
      TZ: Asia/Taipei
    ports:
      - "9043:9042"                  # 9042 留給本機可能另外安裝的 Cassandra
    volumes:
      - cassandradata:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-u", "cassandra", "-p", "cassandra", "-e", "SELECT now() FROM system.local"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j-lab
    restart: unless-stopped        # Docker 啟動時自動跟著啟動（手動 stop 的除外）
    environment:
      NEO4J_AUTH: neo4j/neo4j-lab
      # 社群版沒有角色權限，所以展示台把使用者的 Cypher 一律放在交易裡執行後 ROLLBACK；
      # 這裡再限制單一交易的時間與記憶體，並關掉從檔案匯入 CSV
      NEO4J_db_transaction_timeout: 30s
      NEO4J_db_memory_transaction_max: 512m
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "false"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
      TZ: Asia/Taipei
    ports:
      - "7475:7474"                  # Neo4j Browser（http://localhost:7475）
      - "7688:7687"                  # Bolt；7474 / 7687 留給本機可能另外安裝的 Neo4j
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4j-lab 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  cassandradata:
  pgdata:
  neo4jdata:
