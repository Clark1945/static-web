# PostgreSQL 練習環境（與 anime-tagger 的資料庫完全分開）
# 啟動：docker compose up -d
# 重建資料：docker compose down -v && docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16   # 本機已有的 PostgreSQL 16 映像，免下載
    container_name: pg-lab
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: shop
      TZ: Asia/Taipei
      PGTZ: Asia/Taipei
    ports:
      - "5434:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
