- id: idf
  title: 珍しい語ほどスコアが高い（IDF）
  question: どちらのクエリのスコアが高いですか？それはなぜですか？
  goal: どちらも 1 語だけで検索します：「降噪」（ノイズキャンセリング）は一部のレビューにしか出てこず、「很好」（とても良い）はほぼどこにでもあります。2 つのクエリの 1 位のスコアを比較します。
  takeaway: |
    BM25 のスコア ≈ IDF × TF の部分 × フィールド長による調整。
    IDF（inverse document frequency）：出現するドキュメントが少ない語ほど識別力があり、スコアが高くなります。「降噪」は数百件のレビューにしか出てこず、「很好」は数千件に出てくるので、「降噪」のスコアの方がずっと高くなります。
    複数の語のクエリでは、珍しい語がスコアの大部分を担います。「的、很、了」のようにどこにでもある語は順位にほとんど影響しません（以前はストップワードを設定していましたが、BM25 は自然にそれらを抑えます）。

- id: field-length
  title: フィールドが短いほどスコアが高い
  question: 同じく「音質」が 1 回出てくるのに、なぜスコアが違うのでしょう？
  goal: 「音質」で検索します：A はスコアが最も高い 3 件、B はスコアの低い順に並べた、スコアが最も低い 3 件です。どれも「音質」を 1 回だけ含んでいます。
  takeaway: |
    BM25 はフィールドの長さで調整します（パラメータ b、既定 0.75）：短いレビューに「音質」が出てくるなら、それがレビューの要点なのでスコアが高くなります。
    長いレビューに 1 回だけ出てくるなら、ついでに触れただけかもしれないので、スコアが低くなります。
    もう 1 つのパラメータ k1（既定 1.2）は語の頻度（TF）の飽和を制御します：同じ語が 1 回と 2 回では大きく違いますが、10 回と 11 回ではほとんど違わないので、キーワードの詰め込みを防げます。
    A で「1 位のスコアの計算方法」を押すと、idf、tf、dl（このドキュメントの長さ、語数）、avgdl（平均の長さ）の実際の数値を見られます。

- id: boost
  title: フィールドの重み（boost）
  question: 上位 5 件とスコアはどう変わりましたか？
  goal: 「Sony 耳機」（Sony イヤホン）で検索します：A は name と description が同じ重要度、B は name を 3 倍にします。
  takeaway: |
    multi_match の既定は best_fields です：フィールドごとにスコアを計算し、最も高いものを取ります。
    A：上位は Sony の「有線」イヤホンです。それらの description はとても短く（色とケーブル長だけ）、BM25 の長さ調整によって description のスコアが高くなります。
    B：name のスコアを 3 倍にすると name が支配的になり、name に Sony と 耳機 の両方がある商品（ワイヤレスも有線も）が同じスコアになって並びます。
    ★ フィールドの重み（boost）は関連度を調整する最もよく使う道具です：名称やタイトルは通常、本文より重要です。
    ★ スコアは同じクエリ内で順位を比べることにしか使えず、異なるクエリのスコアの大小には意味がありません（「スコア > 5 なら関連あり」のようなしきい値には使えません）。

- id: function-score
  title: 関連度にビジネスルールを加える：function_score
  question: B の上位 5 件は何で並んでいますか？
  goal: 説明に「降噪」があるイヤホンはどれもスコアが同じです（説明が同じテンプレートだから）。A は関連度だけを見て、B はさらに評価（rating）を掛けます。
  takeaway: |
    EC の検索がテキストの関連度だけを見ることはまれです：評価、販売数、在庫、出品日、広告も考慮します。function_score は関数でスコアを調整します：
    field_value_factor（フィールドの値による）、gauss / exp / linear（ある値から遠いほどスコアが下がる。例：価格、時刻、場所）、script_score、random_score（ランダムだが安定した並び順）。
    modifier: log1p で評価 5 と 4 の差が大げさになりすぎないようにし、boost_mode で元のスコアと関数のスコアの組み合わせ方を決めます（multiply、sum、replace…）。

- id: filter-no-score
  title: filter はスコアを計算しない
  question: 2 つのクエリが見つけたドキュメントは同じですか？スコアはどうですか？
  goal: 同じ条件を、A は must に、B は filter に入れます。スコアを見てください。
  takeaway: |
    見つかるドキュメントはまったく同じですが、must はスコアを計算し（term にも IDF がある）、filter のスコアはすべて 0 です。
    filter はスコアを計算する必要がなく、よく使う filter の結果は bitset としてキャッシュされ、次回はそのまま再利用されます。
    ★「はい／いいえ」の条件（カテゴリ、価格帯、ステータス、権限、時刻）は filter に、順位に影響させたい全文の条件だけを must / should に入れます。

- id: should-bonus
  title: should を加点として使う
  question: B が見つけた総数は変わりましたか？上位 5 件はどうですか？
  goal: 説明に「降噪」がある商品を検索します。B はさらに should で「熱銷」（人気）タグのある商品に加点します。
  takeaway: |
    must があると should は必須条件ではなくなり、「一致すれば加点」になるだけです：総数は変わりませんが、人気タグのある商品が上位に来ます。
    これが「ソフトな条件」の標準的な書き方です：あるブランド、ある地域、在庫のあるものを優先しつつ、それ以外も除外しません。
