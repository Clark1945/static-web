- id: partition-key
  title: パーティションキーあり vs なし
  question: どちらも 6 行を返します。トレースの「読み取り行数」を見てください：B はこの 6 行のために何行読みましたか？
  goal: 同じ「会員 4242 の注文」を、customer_id をパーティションキーにしたテーブルと、ALLOW FILTERING で無理やり検索する方法で比べます。
  takeaway: |
    A は「Executing single-partition query」：パーティションキーから token を計算し、その 1 つのパーティションを直接読むので、6 行しか読みません。
    B は「Submitting range requests」+「seq scan」：テーブル全体の 8 万行を読み、条件に合わないものを捨てます。
    ここではノードが 1 つでデータもすべてメモリにあるので、B でも数百ミリ秒で済みます。本番環境でデータが複数のマシンに数百 GB あれば、B はタイムアウトし、クラスタ全体も遅くします。
    これが Cassandra の第一のルールです：すべてのクエリに完全なパーティションキーが必要です。そのために、同じデータを複数のテーブルに保存することがよくあります。
  queries:
    - label: A：orders_by_customer（customer_id がパーティションキー）
    - label: B：orders + ALLOW FILTERING

- id: clustering-slice
  title: クラスタリングキー：必要な区間だけを読む
  question: B と C はそれぞれ何行読みましたか？A の 152 行と比べるとどうですか？
  goal: 会員 1 には 152 件の注文があります（最大のパーティション）。パーティション全体の読み取り、LIMIT、クラスタリングキーで期間を切り出す方法を比較します。
  takeaway: |
    パーティション内のデータはクラスタリングキーで並んだ状態でまとめて保存されているので、LIMIT 3 は先頭 3 行だけ、期間指定もその区間だけを読み、パーティション全体を読んでから絞り込む必要はありません。
    クラスタリングキーを設計するときは「最もよく必要になるのはどの区間か」を考えます。新しい順（DESC）、期間、価格帯はどれもクラスタリングキーの典型的な使い方です。
  queries:
    - label: A：パーティション全体
    - label: B：最新 3 件（LIMIT 3）
    - label: C：2025 年（クラスタリングキーの範囲）

- id: time-bucket
  title: 時間バケット vs 時間範囲スキャン
  question: A と B が読んだ行数は実は同じ（どちらも 87 行）です。では何が違うのでしょう？「読み取り方法」を見てください。C はいくつのパーティションを読みましたか？
  goal: 「2026-09-01 の注文」を検索します：1 日 1 パーティションの orders_by_day を使う方法と、orders_by_day でパーティションキーを指定せず時間範囲だけを使う方法です。
  takeaway: |
    A は「単一パーティション」：order_day から token を計算し、その日のパーティションを直接見つけます。
    B は「範囲スキャン」：order_time はクラスタリングキーですが、クラスタリングキーは同じパーティション内でしか並んでいません。パーティションキーがないと、Cassandra は 1,728 個すべてのパーティション（1 日 1 つ）をたどり、
    各パーティションで該当する区間を切り出す必要があります。読んだ行数は同じでも、「すべてのパーティションをたどる」コストが加わります。
    ここではノードが 1 つでデータ量も少ないので 1〜2 ミリ秒遅いだけですが、複数ノードのクラスタでは範囲スキャンは「すべてのノード」に問い合わせる必要があり、データが多いほど遅くなり、他のクエリにも影響します。
    C は IN で 7 つのパーティションを読みます。これがある期間を検索する正しい方法です（またはアプリケーションから 7 つのクエリを並行して送ります）。
    バケットの粒度はトレードオフです：パーティションが大きすぎる（例えば 1 か月）とホットスポットになり読み取りが遅くなり、小さすぎる（例えば 1 分）とある期間を検索するのに多くのパーティションを読む必要があります。
    一般的には、1 つのパーティションは 100 MB 以下、10 万行以内が推奨されています。
  queries:
    - label: A：パーティションキー order_day
    - label: B：order_time の範囲だけ（ALLOW FILTERING）
    - label: C：1 週間（IN で 7 パーティション）

- id: sai-index
  title: SAI インデックス：新しいテーブルを作らずに他の列で検索
  question: インデックスがあると、A は何行読みましたか？所要時間は B と比べてどうですか？
  goal: Cassandra 5.0 の SAI（Storage-Attached Index）を使うと、orders も customer_id で検索できます。まず 1 回実行し（拒否されます）、インデックスを作成してからもう一度実行します。
  takeaway: |
    SAI は各 SSTable の隣にインデックスを作り、検索時はまずインデックスで該当する主キーを見つけてからその行を読むので、全表スキャンは不要です。
    しかしそれでも「各ノードのローカルインデックス」です：複数ノードのクラスタでは、コーディネーターがすべてのノードに問い合わせる必要があり（scatter-gather）、ノードが多いほど高くつきます。
    そのため SAI に向いているのは：頻度の低いクエリ、パーティションキーと組み合わせた検索、データ量の多くないテーブルです。頻度の高い主要なクエリには、やはり専用のテーブル（B）を作ります。
    旧来のセカンダリインデックス（2i）や SASI には多くの制限があり、Cassandra 5.0 以降は SAI が推奨されています。
  queries:
    - label: A：orders を customer_id で検索（ALLOW FILTERING なし）
    - label: B：orders_by_customer（比較用）

- id: sai-multi
  title: SAI：コレクションと複数の条件
  question: インデックスがないとき、この 2 つのクエリはどうなりますか？インデックス作成後はそれぞれ何行返しますか？
  goal: 商品テーブルは 1,500 件だけなので、SAI に向いています。tags と price のインデックスを作り、「熱銷（人気）タグがあり、1,000 元以下」の商品を検索します。
  takeaway: |
    SAI はコレクション（CONTAINS / CONTAINS KEY）と範囲（< >）に対応しており、複数の SAI 条件を AND で組み合わせると、Cassandra は積集合を取ります。
    比較：インデックスがないときは ALLOW FILTERING を付けないと検索できず、しかも全表スキャンになります。
    面接でよく聞く「Cassandra のクエリの柔軟性はとても低い」という話は 5.0 以降改善されましたが、核心の原則は変わりません：主要なクエリはテーブル設計に頼り、インデックスは補助です。
  queries:
    - label: A：tags CONTAINS（set の要素）
    - label: B：tags + price の範囲（2 つのインデックスを併用）

- id: filter-in-partition
  title: ALLOW FILTERING が高くないこともある
  question: A、B、C はそれぞれ何行読みましたか？
  goal: 同じく status = 'returned' で絞り込みますが、一方は会員 4242 のパーティション内に限定し、もう一方はパーティションを限定しません（LIMIT 5 付き）。
  takeaway: |
    ALLOW FILTERING のコスト = 結果を見つけるために読んだ行数です。
    A は 1 つのパーティション内で絞り込むだけで 6 行を読みます。B はパーティションキーがありませんが 5 件見つかった時点で止まるので、読む行数は条件に合うデータがどれだけ「密」かで決まります。C はテーブル全体をスキャンする必要があります。
    つまり大事なのは「ALLOW FILTERING を書いてはいけない」ではなく、それがどれだけのデータを読むかを知っておくことです。
  queries:
    - label: A：パーティション内で絞り込み
    - label: B：パーティションキーなし、ただし 5 件だけ
    - label: C：パーティションキーなし、すべて
