er": "Bitmap / HyperLogLog", "title": "9/1 和 9/2 都有下單的會員", "prompt": "9 月 1 日和 9 月 2 日「兩天都有下單」的會員有幾位？最後一個指令要回傳這個數字。\n", "hints": ["BITOP AND 目的key 來源1 來源2：兩個 Bitmap 逐位元 AND，結果存到目的 key。", "再用 BITCOUNT 數結果。"], "answer": "BITOP AND tmp:both active:2026-09-01 active:2026-09-02\nBITCOUNT tmp:both\n", "explanation": "BITOP 支援 AND、OR、XOR、NOT。「連續 7 天都簽到」就是 7 個 Bitmap 做 AND。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "BITOP AND tmp:both active:2026-09-01 active:2026-09-02", "text": "(integer) 2370", "error": false}, {"cmd": "BITCOUNT tmp:both", "text": "(integer) 1", "error": false}]}, {"id": "hll-week", "chapter": "Bitmap / HyperLogLog", "title": "9/1 ~ 9/7 不重複下單人數（HyperLogLog）", "prompt": "uv:{日期} 是每天下單會員的 HyperLogLog。估算 9 月 1 日到 9 月 7 日「不重複」的下單人數。\n", "hints": ["PFCOUNT 可以一次給好幾個 key，算的是它們「合併後」的不重複數。"], "answer": "PFCOUNT uv:2026-09-01 uv:2026-09-02 uv:2026-09-03 uv:2026-09-04 uv:2026-09-05 uv:2026-09-06 uv:2026-09-07\n", "explanation": "★ HyperLogLog 用固定最多 12 KB 估算不重複數量，標準誤差約 0.81%。不能列出有哪些人，只能算有幾個。\n適合 UV（不重複訪客）這種「量很大、允許一點誤差」的統計。要精確就用 Bitmap 或 Set。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "PFCOUNT uv:2026-09-01 uv:2026-09-02 uv:2026-09-03 uv:2026-09-04 uv:2026-09-05 uv:2026-09-06 uv:2026-09-07", "text": "(integer) 626", "error": false}]}, {"id": "geo-dist", "chapter": "Geo", "title": "台北到高雄的距離", "prompt": "store:locations 存了各縣市門市的座標。台北市門市到高雄市門市的直線距離是幾公里？\n", "hints": ["GEODIST key 成員1 成員2 km"], "answer": "GEODIST store:locations 台北市 高雄市 km\n", "explanation": "Geo 底層就是 Sorted Set：經緯度被編碼成 geohash 當作分數，所以 ZRANGE、ZREM 也能用在 Geo 的 key 上。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GEODIST store:locations 台北市 高雄市 km", "text": "\"296.8716\"", "error": false}]}, {"id": "geo-search", "chapter": "Geo", "title": "台北 60 公里內的門市", "prompt": "找出距離台北市門市 60 公里以內的所有門市（包含台北市自己），由近到遠排列。只要門市名稱。\n", "hints": ["GEOSEARCH key FROMMEMBER 台北市 BYRADIUS 60 km ASC"], "answer": "GEOSEARCH store:locations FROMMEMBER 台北 nSET\nSET b 3\nEXEC\nGET a\nGET b\n"}], "results": [[{"cmd": "MULTI", "text": "\"OK\"", "error": false}, {"cmd": "SET a 2", "text": "\"QUEUED\"", "error": false}, {"cmd": "HSET a field value", "text": "\"QUEUED\"", "error": false}, {"cmd": "SET b 3", "text": "\"QUEUED\"", "error": false}, {"cmd": "EXEC", "text": "1) \"OK\"\n2) (error) WRONGTYPE Operation against a key holding the wrong kind of value\n3) \"OK\"", "error": false}, {"cmd": "GET a", "text": "\"2\"", "error": false}, {"cmd": "GET b", "text": "\"3\"", "error": false}], [{"cmd": "MULTI", "text": "\"OK\"", "error": false}, {"cmd": "SET a 2", "text": "\"QUEUED\"", "error": false}, {"cmd": "SET", "text": "(error) ERR wrong number of arguments for 'set' command", "error": true}, {"cmd": "SET b 3", "text": "\"QUEUED\"", "error": false}, {"cmd": "EXEC", "text": "(error) EXECABORT Transaction discarded because of previous errors.", "error": true}, {"cmd": "GET a", "text": "\"1\"", "error": false}, {"cmd": "GET b", "text": "(nil)", "error": false}]]}, {"id": "set-drops-ttl", "title": "SET 會把過期時間清掉", "question": "A 先 SET 一個 100 秒後過期的 key，再 SET 一次新的值。最後的 TTL 是多少？", "options": ["大約 100", "-1（沒有過期時間）", "-2（key 不存在）"], "answer": 1, "explanation": "★ SET 會覆蓋整個 key，連原本的過期時間也一起清掉。快取更新時很容易踩到：\n原本 30 分鐘後過期的快取，被一次「SET 新值」變成永遠不會過期，最後吃光記憶體。\n更新時要重新給 EX，或用 KEEPTTL（Redis 6.0+）保留原本的過期時間。\nINCR、HSET、LPUSH 這類「修改」指令不會影響 TTL；只有覆蓋整個值的 SET、GETSET 會。\n", "setup": null, "scripts": [{"label": "A：直接再 SET 一次", "code": "SET k v1 EX 100\nSET k v2\nTTL k\n"}, {"label": "B：加上 KEEPTTL", "code": "SET k v1 EX 100\nSET k v2 KEEPTTL\nTTL k\n"}], "results": [[{"cmd": "SET k v1 EX 100", "text": "\"OK\"", "error": false}, {"cmd": "SET k v2", "text": "\"OK\"", "error": false}, {"cmd": "TTL k", "text": "(integer) -1", "error": false}], [{"cmd": "SET k v1 EX 100", "text": "\"OK\"", "error": false}, {"cmd": "SET k v2 KEEPTTL", "text": "\"OK\"", "error": false}, {"cmd": "TTL k", "text": "(integer) 100", "error": false}]]}, {"id": "ttl-codes", "title": "TTL 的 -1 和 -2", "question": "對一個「不存在」的 key 執行 TTL，會回傳什麼？", "options": ["-1", "-2", "0", "nil"], "answer": 1, "explanation": "-2：key 不存在（或已經過期被刪掉）。\n-1：key 存在，但沒有過期時間。\n正數：還剩幾秒。PTTL 是毫秒版本，規則一樣。\n", "setup": null, "scripts": [{"label": "A：不存在的 key", "code": "TTL no-such-key\n"}, {"label": "B：存在、但沒有設定過期時間", "code": "SET k v\nTTL k\n"}], "results": [[{"cmd": "TTL no-such-key", "text": "(integer) -2", "error": false}], [{"cmd": "SET k v", "text": "\"OK\"", "error": false}, {"cmd": "TTL k", "text": "(integer) -1", "error": false}]]}, {"id": "list-range-inclusive", "title": "LRANGE 的結尾包含在內", "question": "List 裡有 12 個元素。LRANGE list 0 10 會回傳幾個？", "options": ["10", "11", "12"], "answer": 1, "explanation": "LRANGE、ZRANGE、GETRANGE 的結尾都是「包含在內」，0 10 是 11 個。\n跟 Java 的 subList(0, 10)、Python 的 list[0:10]（不包含結尾）剛好相反，分頁時最容易差一。\n-1 代表最後一個，0 -1 就是全部。\n", "setup": "RPUSH list a b c d e f g h i j k l\n", "scripts": [{"label": "A：LRANGE list 0 10", "code": "LRANGE list 0 10\n"}, {"label": "B：LRANGE list 0 -1", "code": "LRANGE list 0 -1\n"}], "results": [[{"cmd": "LRANGE list 0 10", "text": " 1) \"a\"\n 2) \"b\"\n 3) \"c\"\n 4) \"d\"\n 5) \"e\"\n 6) \"f\"\n 7) \"g\"\n 8) \"h\"\n 9) \"i\"\n10) \"j\"\n11) \"k\"", "error": false}], [{"cmd": "LRANGE list 0 -1", "text": " 1) \"a\"\n 2) \"b\"\n 3) \"c\"\n 4) \"d\"\n 5) \"e\"\n 6) \"f\"\n 7) \"g\"\n 8) \"h\"\n 9) \"i\"\n10) \"j\"\n11) \"k\"\n12) \"l\"", "error": false}]]}, {"id": "zset-tie-order", "title": "同分時的排序", "question": "alice、bob、carol 都是 100 分。A 由高到低排序（REV），同分的三個人順序是？", "options": ["依加入順序：alice、bob、carol", "依名稱倒序：carol、bob、alice", "每次執行都不一樣"], "answer": 1, "explanation": "Sorted Set 同分時依 member 的字典順序排列；加上 REV 時整個反過來，所以變成 carol、bob、alice。\n排行榜想要「同分時先達到的人排前面」，常見做法是把時間編進分數：分數 = 積分 × 10^10 + (很大的數 − 時間戳)。\n", "setup": "ZADD board 100 alice 100 bob 100 carol 90 dave\n", "scripts": [{"label": "A：由高到低（REV）", "code": "ZRANGE board 0 -1 REV WITHSCORES\n"}, {"label": "B：由低到高", "code": "ZRANGE board 0 -1 WITHSCORES\n"}], "results": [[{"cmd": "ZRANGE board 0 -1 REV WITHSCORES", "text": "1) \"carol\"\n2) \"100\"\n3) \"bob\"\n4) \"100\"\n5) \"alice\"\n6) \"100\"\n7) \"dave\"\n8) \"90\"", "error": false}], [{"cmd": "ZRANGE board 0 -1 WITHSCORES", "text": "1) \"dave\"\n2) \"90\"\n3) \"alice\"\n4) \"100\"\n5) \"bob\"\n6) \"100\"\n7) \"carol\"\n8) \"100\"", "error": false}]]}, {"id": "get-wrong-type", "title": "用錯指令讀錯型別", "question": "product:540 是 Hash。對它執行 GET 會得到什麼？", "options": ["nil", "WRONGTYPE 錯誤", "整個 Hash 的內容"], "answer": 1, "explanation": "每個 key 都有固定的型別，用錯型別的指令會得到 WRONGTYPE 錯誤。不確定時先用 TYPE key 查。\nJava 端最常見的情況：同一個 key 一下用 opsForValue()、一下用 opsForHash() 操作。\n", "setup": null, "scripts": [{"label": "A：GET", "code": "GET product:540\nTYPE product:540\n"}, {"label": "B：HGETALL", "code": "HGETALL product:540\n"}], "results": [[{"cmd": "GET product:540", "text": "(error) WRONGTYPE Operation against a key holding the wrong kind of value", "error": true}, {"cmd": "TYPE product:540", "text": "\"hash\"", "error": false}], [{"cmd": "HGETALL product:540", "text": "1) \"name\"\n2) \"Sony 手機 I447\"\n3) \"price\"\n4) \"29949.00\"\n5) \"stock\"\n6) \"11\"\n7) \"category\"\n8) \"手機\"", "error": false}]]}, {"id": "hll-is-estimate", "title": "HyperLogLog 是估計值", "question": "用 HyperLogLog 合併 9 月 30 天的資料，估算「9 月不重複下單人數」。跟用 Bitmap 算出來的精確值一樣嗎？", "options": ["完全一樣", "很接近，但有一點誤差", "差很多"], "answer": 1, "explanation": "HyperLogLog 是機率演算法，標準誤差約 0.81%；資料量小的時候常常剛好相等，量越大越看得出誤差。\n換來的好處是記憶體固定：不管統計 1 千人還是 1 億人，一個 HyperLogLog 最多 12 KB。\nBitmap 精確，但大小跟「最大的 id」成正比：id 到 1 億就要 12 MB。\n面試常問「怎麼統計每日 UV」：量小用 Set，id 連續用 Bitmap，量很大又允許誤差用 HyperLogLog。\n", "setup": null, "scripts": [{"label": "A：HyperLogLog 估計", "code": "PFMERGE uv:2026-09 uv:2026-09-01 uv:2026-09-02 uv:2026-09-03 uv:2026-09-04 uv:2026-09-05 uv:2026-09-06 uv:2026-09-07 uv:2026-09-08 uv:2026-09-09 uv:2026-09-10 uv:2026-09-11 uv:2026-09-12 uv:2026-09-13 uv:2026-09-14 uv:2026-09-15 uv:2026-09-16 uv:2026-09-17 uv:2026-09-18 uv:2026-09-19 uv:2026-09-20 uv:2026-09-21 uv:2026-09-22 uv:2026-09-23 uv:2026-09-24 uv:2026-09-25 uv:2026-09-26 uv:2026-09-27 uv:2026-09-28 uv:2026-09-29 uv:2026-09-30\nPFCOUNT uv:2026-09\nMEMORY USAGE uv:2026-09\n"}, {"label": "B：Bitmap 精確計算", "code": "BITOP OR active:2026-09 active:2026-09-01 active:2026-09-02 active:2026-09-03 active:2026-09-04 active:2026-09-05 active:2026-09-06 active:2026-09-07 active:2026-09-08 active:2026-09-09 active:2026-09-10 active:2026-09-11 active:2026-09-12 active:2026-09-13 active:2026-09-14 active:2026-09-15 active:2026-09-16 active:2026-09-17 active:2026-09-18 active:2026-09-19 active:2026-09-20 active:2026-09-21 active:2026-09-22 active:2026-09-23 active:2026-09-24 active:2026-09-25 active:2026-09-26 active:2026-09-27 active:2026-09-28 active:2026-09-29 active:2026-09-30\nBITCOUNT active:2026-09\nMEMORY USAGE active:2026-09\n"}], "results": [[{"cmd": "PFMERGE uv:2026-09 uv:2026-09-01 uv:2026-09-02 uv:2026-09-03 uv:2026-09-04 uv:2026-09-05 uv:2026-09-06 uv:2026-09-07 uv:2026-09-08 uv:2026-09-09 uv:2026-09-10 uv:2026-09-11 uv:2026-09-12 uv:2026-09-13 uv:2026-09-14 uv:2026-09-15 uv:2026-09-16 uv:2026-09-17 uv:2026-09-18 uv:2026-09-19 uv:2026-09-20 uv:2026-09-21 uv:2026-09-22 uv:2026-09-23 uv:2026-09-24 uv:2026-09-25 uv:2026-09-26 uv:2026-09-27 uv:2026-09-28 uv:2026-09-29 uv:2026-09-30", "text": "\"OK\"", "error": false}, {"cmd": "PFCOUNT uv:2026-09", "text": "(integer) 2658", "error": false}, {"cmd": "MEMORY USAGE uv:2026-09", "text": "(integer) 14392", "error": false}], [{"cmd": "BITOP OR active:2026-09 active:2026-09-01 active:2026-09-02 active:2026-09-03 active:2026-09-04 active:2026-09-05 active:2026-09-06 active:2026-09-07 active:2026-09-08 active:2026-09-09 active:2026-09-10 active:2026-09-11 active:2026-09-12 active:2026-09-13 active:2026-09-14 active:2026-09-15 active:2026-09-16 active:2026-09-17 active:2026-09-18 active:2026-09-19 active:2026-09-20 active:2026-09-21 active:2026-09-22 active:2026-09-23 active:2026-09-24 active:2026-09-25 active:2026-09-26 active:2026-09-27 active:2026-09-28 active:2026-09-29 active:2026-09-30", "text": "(integer) 2375", "error": false}, {"cmd": "BITCOUNT active:2026-09", "text": "(integer) 2660", "error": false}, {"cmd": "MEMORY USAGE active:2026-09", "text": "(integer) 2616", "error": false}]]}, {"id": "keys-vs-scan", "title": "KEYS 與 SCAN", "question": "A 和 B 都在找 product:99 開頭的 key。B 的 SCAN 一次就會回傳全部符合的 key 嗎？", "options": ["會，結果跟 KEYS 一樣", "不一定，要拿回傳的游標繼續掃，直到游標回到 0", "會報錯"], "answer": 1, "explanation": "★ KEYS 會一次掃過全部 key（這裡約 4 萬個）。Redis 執行指令是單執行緒的，KEYS 執行期間其他請求全部要排隊；\n正式環境有幾百萬個 key 時，一個 KEYS 就能讓服務卡住好幾秒，所以展示台的 learner 帳號根本不能用 KEYS。\nSCAN 每次只看一小批（COUNT 是「大約看幾個」，不是回傳幾筆），回傳 [下一個游標, 這批符合的 key]。\n這一批可能完全沒有符合的 key，要一直用新游標呼叫，直到游標回到 0 才算掃完。\nSCAN 可能回傳重複的 key，程式要自己去重。\n", "setup": null, "scripts": [{"label": "A：KEYS（掃過整個資料庫）", "code": "KEYS product:99*\nDBSIZE\n"}, {"label": "B：SCAN（從游標 0 開始，一次看 100 個）", "code": "SCAN 0 MATCH product:99* COUNT 100\n"}], "results": [[{"cmd": "KEYS product:99*", "text": " 1) \"product:996\"\n 2) \"product:992\"\n 3) \"product:997\"\n 4) \"product:99\"\n 5) \"product:998\"\n 6) \"product:994\"\n 7) \"product:991\"\n 8) \"product:993\"\n 9) \"product:990\"\n10) \"product:995\"\n11) \"product:999\"", "error": false}, {"cmd": "DBSIZE", "text": "(integer) 39969", "error": false}], [{"cmd": "SCAN 0 MATCH product:99* COUNT 100", "text": "1) \"17152\"\n2) 1) \"product:997\"", "error": false}]]}], "steps": []}, {"id": "mongodb", "name": "MongoDB", "lang": "mongo", "labName": "索引實驗", "labNote": "實驗對象是 shop.orders（8 萬份訂單）。每一步先看沒有索引時的 explain(\"executionStats\")，再建立建議的索引重跑，比較 COLLSCAN / IXSCAN、docsExamined 與 SORT。", "hasResults": true, "exercises": [{"id": "find-pending", "chapter": "查詢基礎", "title": "待處理的訂單", "prompt": "找出狀態（status）是 pending 的訂單，只顯示 _id、customerId、total。\n依 _id 由小到大，取前 5 筆。\n", "hints": ["db.orders.find(篩選, 投影)：投影寫 { customerId: 1, total: 1 }，_id 預設就會顯示。", "再串 .sort({ _id: 1 }).limit(5)"], "answer": "db.orders.find({ status: \"pending\" }, { customerId: 1, total: 1 }).sort({ _id: 1 }).limit(5)\n", "explanation": "find 的第二個參數是「投影」（projection），決定要回傳哪些欄位，相當於 SQL 的 SELECT 欄位。\n1 是要、0 是不要；_id 預設會回傳，不要的話寫 _id: 0。除了 _id，同一個投影裡不能混用 1 和 0。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.find({ status: \"pending\" }, { customerId: 1, total: 1 }).sort({ _id: 1 }).limit(5)", "text": "// 共 5 份，以下只列前 3 份\n{\n  _id: 78907,\n  customerId: 17631,\n  total: 38\n}\n{\n  _id: 78911,\n  customerId: 18042,\n  total: 4317\n}\n{\n  _id: 78912,\n  customerId: 18476,\n  total: 38580\n}"}]}, {"id": "count-gold", "chapter": "查詢基礎", "title": "金卡會員有幾位", "prompt": "vipLevel 是 gold 的會員有幾位？\n", "hints": ["db.customers.countDocuments(篩選條件)"], "answer": "db.customers.countDocuments({ vipLevel: \"gold\" })\n", "explanation": "countDocuments 會真的依條件計數；estimatedDocumentCount() 不能加條件，但直接讀集合的統計資料，非常快。\n舊版的 count() 已經不建議使用。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.customers.countDocuments({ vipLevel: \"gold\" })", "text": "891"}]}, {"id": "distinct-city", "chapter": "查詢基礎", "title": "有哪些出貨城市", "prompt": "列出所有訂單出現過的出貨城市（shipping.city），不重複。\n", "hints": ["db.orders.distinct(\"欄位\")；內嵌欄位用點號：\"shipping.city\""], "answer": "db.orders.distinct(\"shipping.city\")\n", "explanation": "存取內嵌文件的欄位用「點號」：shipping.city。在 find 的條件、投影、排序裡都一樣，記得要加引號。\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "db.orders.distinct(\"shipping.city\")", "text": "// 共 15 份，以下只列前 3 份\n'台中市'\n'台北市'\n'台南市'"}]}, {"id": "find-nested-projection", "chapter": "查詢基礎", "title": "商品的分類路徑", "prompt": "查商品 540 的名稱（name）和分類路徑（category.path），不要顯示 _id。\n", "hints": ["findOne({ _id: 540 }, { _id: 0, name: 1, \"category.path\": 1 })"], "answer": "db.products.findOne({ _id: 540 }, { _id: 0, name: 1, \"category.path\": 1 })\n", "explanation": "商品文件裡直接存了分類名稱與完整路徑（反正規化），所以不需要再去查 categories。\n代價是：分類改名時，所有商品都要跟著更新（updateMany）。讀多寫少的資料很適合這樣做。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.findOne({ _id: 540 }, { _id: 0, name: 1, \"category.path\": 1 })", "text": "{\n  name: 'Sony 手機 I447',\n  category: {\n    path: [ '3C電子', '手機' ]\n  }\n}"}]}, {"id": "price-range", "chapter": "查詢運算子", "title": "價格 1000 ~ 2000 的商品數", "prompt": "價格（price）介於 1000 到 2000 之間（包含 1000 和 2000）的商品有幾件？\n", "hints": ["{ price: { $gte: 1000, $lte: 2000 } }"], "answer": "db.products.countDocuments({ price: { $gte: 1000, $lte: 2000 } })\n", "explanation": "比較運算子：$eq、$ne、$gt、$gte、$lt、$lte、$in、$nin。同一個欄位的多個條件寫在同一個物件裡就是 AND。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.countDocuments({ price: { $gte: 1000, $lte: 2000 } })", "text": "349"}]}, {"id": "status-in", "chapter": "查詢運算子", "title": "取消或退貨的訂單數", "prompt": "狀態是 cancelled 或 returned 的訂單有幾筆？\n", "hints": ["{ status: { $in: [\"cancelled\", \"returned\"] } }"], "answer": "db.orders.countDocuments({ status: { $in: [\"cancelled\", \"returned\"] } })\n", "explanation": "同一個欄位比對多個值，用 $in 比 $or 簡潔，也更容易用到索引。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.countDocuments({ status: { $in: [\"cancelled\", \"returned\"] } })", "text": "14448"}]}, {"id": "or-condition", "chapter": "查詢運算子", "title": "東部的金卡會員", "prompt": "住在花蓮縣或台東縣、而且是 gold 等級的會員。\n只顯示 name、city（含 _id），依 _id 排序。\n", "hints": ["可以用 city: { $in: [...] }，也可以用 $or: [ {…}, {…} ]。"], "answer": "db.customers.find({ vipLevel: \"gold\", city: { $in: [\"花蓮縣\", \"台東縣\"] } }, { name: 1, city: 1 }).sort({ _id: 1 })\n", "explanation": "$or 用在「不同欄位」的或：{ $or: [ { city: \"花蓮縣\" }, { vipLevel: \"gold\" } ] }。\n同一個欄位的或，用 $in 就好。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.customers.find({ vipLevel: \"gold\", city: { $in: [\"花蓮縣\", \"台東縣\"] } }, { name: 1, city: 1 }).sort({ _id: 1 })", "text": "// 共 59 份，以下只列前 3 份\n{\n  _id: 14,\n  name: '劉怡傑',\n  city: '台東縣'\n}\n{\n  _id: 15,\n  name: '羅書廷',\n  city: '花蓮縣'\n}\n{\n  _id: 18,\n  name: '何佳誠',\n  city: '台東縣'\n}"}]}, {"id": "exists", "chapter": "查詢運算子", "title": "沒有填生日的會員", "prompt": "沒有 birthDate 欄位的會員有幾位？\n", "hints": ["{ birthDate: { $exists: false } }"], "answer": "db.customers.countDocuments({ birthDate: { $exists: false } })\n", "explanation": "文件式資料庫的欄位可以「不存在」，跟「值是 null」不一樣。\n★ 但 { birthDate: null } 會同時找到「值是 null」和「沒有這個欄位」的文件（陷阱題有示範）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.customers.countDocuments({ birthDate: { $exists: false } })", "text": "1141"}]}, {"id": "regex", "chapter": "查詢運算子", "title": "Apple 的商品", "prompt": "名稱（name）以「Apple」開頭的商品有幾件？\n", "hints": ["可以直接寫正規表示式：{ name: /^Apple/ }"], "answer": "db.products.countDocuments({ name: /^Apple/ })\n", "explanation": "以 ^ 開頭、大小寫有分的正規表示式可以用索引（類似 SQL 的 LIKE 'Apple%'）；\n/apple/i 或 /Pro/ 這種不固定開頭的寫法只能全部掃過。需要全文搜尋時用 text 索引或 Atlas Search。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.countDocuments({ name: /^Apple/ })", "text": "47"}]}, {"id": "array-contains", "chapter": "陣列與內嵌文件", "title": "限量商品有幾件", "prompt": "tags 陣列裡有「限量」的商品有幾件？\n", "hints": ["直接寫 { tags: \"限量\" } 就會比對陣列裡的每一個元素。"], "answer": "db.products.countDocuments({ tags: \"限量\" })\n", "explanation": "★ 對陣列欄位下等號條件，只要「任何一個元素」相等就成立，不用特別寫 $in。\n但 { tags: [\"限量\"] } 是「整個陣列完全等於 [\"限量\"]」，意思完全不同（陷阱題有示範）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.countDocuments({ tags: \"限量\" })", "text": "109"}]}, {"id": "array-all", "chapter": "陣列與內嵌文件", "title": "熱銷又限量（$all）", "prompt": "同時有「熱銷」和「限量」兩個標籤的商品，只顯示 _id，依 _id 排序。\n", "hints": ["{ tags: { $all: [\"熱銷\", \"限量\"] } }"], "answer": "db.products.find({ tags: { $all: [\"熱銷\", \"限量\"] } }, { _id: 1 }).sort({ _id: 1 })\n", "explanation": "$all：陣列要包含全部指定的元素，順序不拘。{ tags: [\"熱銷\", \"限量\"] } 則要求陣列「剛好就是」這兩個、而且順序一樣。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.find({ tags: { $all: [\"熱銷\", \"限量\"] } }, { _id: 1 }).sort({ _id: 1 })", "text": "// 共 21 份，以下只列前 3 份\n{\n  _id: 77\n}\n{\n  _id: 84\n}\n{\n  _id: 100\n}"}]}, {"id": "array-size", "chapter": "陣列與內嵌文件", "title": "剛好 3 個標籤的商品", "prompt": "tags 剛好有 3 個元素的商品有幾件？\n", "hints": ["{ tags: { $size: 3 } }"], "answer": "db.products.countDocuments({ tags: { $size: 3 } })\n", "explanation": "$size 只能比對「剛好等於」，不能寫 { $size: { $gt: 2 } }。\n要比大小可以用 { \"tags.2\": { $exists: true } }（第 3 個元素存在 = 至少 3 個），或用 $expr 搭配 { $size: \"$tags\" }。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.countDocuments({ tags: { $size: 3 } })", "text": "52"}]}, {"id": "array-dot", "chapter": "陣列與內嵌文件", "title": "買過商品 540 的訂單", "prompt": "明細（items）裡有商品 540 的訂單有幾筆？\n", "hints": ["{ \"items.productId\": 540 }"], "answer": "db.orders.countDocuments({ \"items.productId\": 540 })\n", "explanation": "點號也能穿過陣列：items.productId 會比對 items 陣列裡每一項的 productId。\n這個欄位建索引時會變成「多鍵索引」（multikey），每一項明細各產生一個索引項目。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.countDocuments({ \"items.productId\": 540 })", "text": "156"}]}, {"id": "elem-match", "chapter": "陣列與內嵌文件", "title": "同一項明細同時符合兩個條件（$elemMatch）", "prompt": "有任何「一項」明細同時符合「qty 大於等於 3」而且「unitPrice 大於等於 10000」的訂單有幾筆？\n兩個條件要成立在「同一項」明細上。\n", "hints": ["{ items: { $elemMatch: { qty: { $gte: 3 }, unitPrice: { $gte: 10000 } } } }"], "answer": "db.orders.countDocuments({ items: { $elemMatch: { qty: { $gte: 3 }, unitPrice: { $gte: 10000 } } } })\n", "explanation": "★ 面試常考：寫成 { \"items.qty\": { $gte: 3 }, \"items.unitPrice\": { $gte: 10000 } } 的話，\n兩個條件可以由「不同的明細」分別滿足（一項買了 3 個便宜貨、另一項買了 1 個貴的），結果會比較多。\n要求同一個元素同時符合多個條件，一定要用 $elemMatch。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.countDocuments({ items: { $elemMatch: { qty: { $gte: 3 }, unitPrice: { $gte: 10000 } } } })", "text": "2074"}]}, {"id": "nested-specs", "chapter": "陣列與內嵌文件", "title": "512GB 的手機", "prompt": "規格 specs.storage_gb 是 512 的商品，只顯示 name（含 _id），依 _id 排序。\n", "hints": ["{ \"specs.storage_gb\": 512 }"], "answer": "db.products.find({ \"specs.storage_gb\": 512 }, { name: 1 }).sort({ _id: 1 })\n", "explanation": "每個分類的 specs 欄位都不一樣，這就是文件式資料庫「彈性 schema」的好處：不用為每種規格開欄位。\n對照 PostgreSQL 的 JSONB：specs->>'storage_gb'，MongoDB 直接用點號就好。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.find({ \"specs.storage_gb\": 512 }, { name: 1 }).sort({ _id: 1 })", "text": "// 共 41 份，以下只列前 3 份\n{\n  _id: 3,\n  name: 'Samsung 手機 I187'\n}\n{\n  _id: 16,\n  name: 'Sony 手機 D738'\n}\n{\n  _id: 17,\n  name: 'MSI 筆電 S469'\n}"}]}, {"id": "agg-status", "chapter": "聚合管線", "title": "各狀態的訂單數", "prompt": "用 aggregate 統計各狀態的訂單數，依數量由多到少。\n輸出：_id 是狀態、count 是數量。\n", "hints": ["[ { $group: { _id: \"$status\", count: { $sum: 1 } } }, { $sort: { count: -1 } } ]"], "answer": "db.orders.aggregate([\n  { $group: { _id: \"$status\", count: { $sum: 1 } } },\n  { $sort: { count: -1 } }\n])\n", "explanation": "$group 相當於 SQL 的 GROUP BY：_id 是分組依據，\"$欄位\" 代表取欄位的值，$sum: 1 就是 count(*)。\n聚合管線的資料由上往下流過每一個 stage，每個 stage 的輸出是下一個 stage 的輸入。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.aggregate([\n  { $group: { _id: \"$status\", count: { $sum: 1 } } },\n  { $sort: { count: -1 } }\n])", "text": "// 共 6 份，以下只列前 3 份\n{\n  _id: 'delivered',\n  count: 64554\n}\n{\n  _id: 'cancelled',\n  count: 8108\n}\n{\n  _id: 'returned',\n  count: 6340\n}"}]}, {"id": "agg-city-revenue", "chapter": "聚合管線", "title": "各城市的營收前 5 名", "prompt": "只看已送達（delivered）的訂單，統計各出貨城市的營收（total 加總），取前 5 名。\n輸出：_id 是城市、revenue 是營收，依營收由高到低。\n", "hints": ["$match 篩選 → $group 加總 → $sort → $limit", "城市在內嵌欄位：\"$shipping.city\""], "answer": "db.orders.aggregate([\n  { $match: { status: \"delivered\" } },\n  { $group: { _id: \"$shipping.city\", revenue: { $sum: \"$total\" } } },\n  { $sort: { revenue: -1 } },\n  { $limit: 5 }\n])\n", "explanation": "★ $match 要盡量放在最前面：先把資料量減少，後面的 stage 才會快，而且開頭的 $match 可以用索引。\n（其實優化器會自動把能往前搬的 $match 往前搬，但自己寫好比較保險。）\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.aggregate([\n  { $match: { status: \"delivered\" } },\n  { $group: { _id: \"$shipping.city\", revenue: { $sum: \"$total\" } } },\n  { $sort: { revenue: -1 } },\n  { $limit: 5 }\n])", "text": "// 共 5 份，以下只列前 3 份\n{\n  _id: '台北市',\n  revenue: 206971417\n}\n{\n  _id: '新北市',\n  revenue: 107267944\n}\n{\n  _id: '台中市',\n  revenue: 90333790\n}"}]}, {"id": "agg-unwind", "chapter": "聚合管線", "title": "銷量最高的 5 件商品（$unwind）", "prompt": "統計每件商品賣出的總件數（items 裡的 qty 加總，所有狀態都算），取前 5 名。\n輸出：_id 是商品 id、name 是商品名稱、qty 是件數，依件數由高到低；件數相同依 _id 由小到大。\n", "hints": ["$unwind 會把 items 陣列拆開：一張有 3 項明細的訂單變成 3 份文件。", "$group 用 \"$items.productId\" 分組，名稱用 { $first: \"$items.name\" }。"], "answer": "db.orders.aggregate([\n  { $unwind: \"$items\" },\n  { $group: { _id: \"$items.productId\", name: { $first: \"$items.name\" }, qty: { $sum: \"$items.qty\" } } },\n  { $sort: { qty: -1, _id: 1 } },\n  { $limit: 5 }\n])\n", "explanation": "$unwind 是處理內嵌陣列的關鍵：把陣列攤平成多份文件，才能對每一項明細做統計。\n相當於 PostgreSQL 的 unnest()，或是把 orders JOIN order_items。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.aggregate([\n  { $unwind: \"$items\" },\n  { $group: { _id: \"$items.productId\", name: { $first: \"$items.name\" }, qty: { $sum: \"$items.qty\" } } },\n  { $sort: { qty: -1, _id: 1 } },\n  { $limit: 5 }\n])", "text": "// 共 5 份，以下只列前 3 份\n{\n  _id: 1,\n  name: '雅漾 保養 C693',\n  qty: 1710\n}\n{\n  _id: 2,\n  name: '金車 飲料 F922',\n  qty: 1065\n}\n{\n  _id: 3,\n  name: 'Samsung 手機 I187',\n  qty: 884\n}"}]}, {"id": "agg-monthly", "chapter": "聚合管線", "title": "2026 年每月訂單數（時區）", "prompt": "統計 2026 年（以台灣時間計算）每個月的訂單數。\n輸出：_id 是 \"2026-01\" 這樣的月份字串、count 是數量，依月份排序。\n", "hints": ["篩選：orderDate 在 ISODate(\"2026-01-01T00:00:00+08:00\") 與 ISODate(\"2027-01-01T00:00:00+08:00\") 之間。", "分組：{ $dateToString: { format: \"%Y-%m\", date: \"$orderDate\", timezone: \"Asia/Taipei\" } }"], "answer": "db.orders.aggregate([\n  { $match: { orderDate: { $gte: ISODate(\"2026-01-01T00:00:00+08:00\"), $lt: ISODate(\"2027-01-01T00:00:00+08:00\") } } },\n  { $group: { _id: { $dateToString: { format: \"%Y-%m\", date: \"$orderDate\", timezone: \"Asia/Taipei\" } }, count: { $sum: 1 } } },\n  { $sort: { _id: 1 } }\n])\n", "explanation": "★ MongoDB 的日期一律以 UTC 儲存。台灣時間 9/1 凌晨 2 點的訂單，在 UTC 是 8/31 下午 6 點。\n篩選時要寫出時區（+08:00），分組時也要給 timezone，不然每個月的邊界會差 8 小時（陷阱題有示範）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.aggregate([\n  { $match: { orderDate: { $gte: ISODate(\"2026-01-01T00:00:00+08:00\"), $lt: ISODate(\"2027-01-01T00:00:00+08:00\") } } },\n  { $group: { _id: { $dateToString: { format: \"%Y-%m\", date: \"$orderDate\", timezone: \"Asia/Taipei\" } }, count: { $sum: 1 } } },\n  { $sort: { _id: 1 } }\n])", "text": "// 共 9 份，以下只列前 3 份\n{\n  _id: '2026-01',\n  count: 2668\n}\n{\n  _id: '2026-02',\n  count: 2471\n}\n{\n  _id: '2026-03',\n  count: 2902\n}"}]}, {"id": "agg-lookup", "chapter": "聚合管線", "title": "訂單加上會員姓名（$lookup）", "prompt": "會員 1 最新的 3 筆訂單，加上會員姓名。\n輸出：_id、total、customerName，依下單時間由新到舊。\n", "hints": ["$match → $sort → $limit → $lookup 到 customers → $project", "$lookup 的結果是陣列，用 { $first: \"$customer.name\" } 取出名字。"], "answer": "db.orders.aggregate([\n  { $match: { customerId: 1 } },\n  { $sort: { orderDate: -1 } },\n  { $limit: 3 },\n  { $lookup: { from: \"customers\", localField: \"customerId\", foreignField: \"_id\", as: \"customer\" } },\n  { $project: { total: 1, customerName: { $first: \"$customer.name\" } } }\n])\n", "explanation": "$lookup 相當於 LEFT OUTER JOIN，結果放進一個陣列欄位。\n★ 先 $limit 再 $lookup：只對 3 筆做 JOIN，而不是對全部訂單 JOIN 完再取 3 筆。\n$lookup 的 foreignField 要有索引，不然每一筆都要掃整個集合（實驗室有示範差多少）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.aggregate([\n  { $match: { customerId: 1 } },\n  { $sort: { orderDate: -1 } },\n  { $limit: 3 },\n  { $lookup: { from: \"customers\", localField: \"customerId\", foreignField: \"_id\", as: \"customer\" } },\n  { $project: { total: 1, customerName: { $first: \"$customer.name\" } } }\n])", "text": "// 共 3 份\n{\n  _id: 77621,\n  total: 1519,\n  customerName: '葉承文'\n}\n{\n  _id: 75279,\n  total: 1909,\n  customerName: '葉承文'\n}\n{\n  _id: 72474,\n  total: 21018,\n  customerName: '葉承文'\n}"}]}, {"id": "update-set", "chapter": "寫入", "title": "更新庫存（$set）", "prompt": "把商品 540 的庫存（stock）改成 20，其他欄位不變。\n", "hints": ["db.products.updateOne({ _id: 540 }, { $set: { stock: 20 } })"], "answer": "db.products.updateOne({ _id: 540 }, { $set: { stock: 20 } })\n", "explanation": "★ 更新一定要用更新運算子（$set、$inc、$push…）。用 replaceOne 的話整份文件會被換掉，其他欄位全部消失（陷阱題有示範）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.products.updateOne({ _id: 540 }, { $set: { stock: 20 } })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}], "checks": [{"cmd": "db.products.findOne({ _id: 540 })", "text": "{\n  _id: 540,\n  name: 'Sony 手機 I447',\n  category: {\n    _id: 2,\n    name: '手機',\n    path: [ '3C電子', '手機' ]\n  },\n  price: 29949,\n  cost: 15756,\n  stock: 20,\n  isActive: true,\n  createdAt: ISODate('2021-03-01T00:00:00Z'),\n  tags: [ '特價' ],\n  specs: {\n    '5g': false,\n    color: '白',\n    warranty: {\n      type: '原廠',\n      years: 2\n    },\n    storage_gb: 128,\n    screen_inch: 6.3\n  }\n}"}]}, {"id": "update-inc", "chapter": "寫入", "title": "飲料全部漲 5 元（$inc）", "prompt": "分類名稱（category.name）是「飲料」的商品，價格全部加 5 元。\n", "hints": ["updateMany 加上 { $inc: { price: 5 } }"], "answer": "db.products.updateMany({ \"category.name\": \"飲料\" }, { $inc: { price: 5 } })\n", "explanation": "$inc 是原子操作，適合計數器、庫存、按讚數。updateOne 只更新第一份符合的文件，updateMany 才會全部更新。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.products.updateMany({ \"category.name\": \"飲料\" }, { $inc: { price: 5 } })", "text": "{\n  acknowledged: true,\n  matchedCount: 83,\n  modifiedCount: 83,\n  upsertedId: null\n}"}], "checks": [{"cmd": "db.products.find({}, { price: 1 }).sort({ _id: 1 })", "text": "// 共 83 份，以下只列前 3 份\n{\n  _id: 2,\n  price: 24\n}\n{\n  _id: 30,\n  price: 64\n}\n{\n  _id: 34,\n  price: 74\n}"}]}, {"id": "update-push", "chapter": "寫入", "title": "訂單加一項明細（$push）", "prompt": "在訂單 77621 的 items 陣列最後面加一項明細：\n{ productId: 1, name: \"測試商品\", qty: 1, unitPrice: 100, discount: 0 }\n", "hints": ["{ $push: { items: { … } } }"], "answer": "db.orders.updateOne({ _id: 77621 }, { $push: { items: { productId: 1, name: \"測試商品\", qty: 1, unitPrice: 100, discount: 0 } } })\n", "explanation": "陣列的更新運算子：$push 加到最後、$addToSet 不重複才加、$pull 依條件移除、$pop 移除頭或尾。\n要一次加多項用 $push: { items: { $each: [ … ] } }，還能搭配 $slice 只保留最新 N 項。\n注意：items 加了明細，total 不會自動更新，要自己用 $inc 一起改（文件式資料庫沒有觸發器幫你算）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.orders.updateOne({ _id: 77621 }, { $push: { items: { productId: 1, name: \"測試商品\", qty: 1, unitPrice: 100, discount: 0 } } })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}], "checks": [{"cmd": "db.orders.findOne({ _id: 77621 }, { items: 1 })", "text": "{\n  _id: 77621,\n  items: [\n    {\n      productId: 237,\n      name: 'UNIQLO 男裝 P863',\n      qty: 1,\n      unitPrice: 1519,\n      discount: 0.0\n    },\n    {\n      productId: 1,\n      name: '測試商品',\n      qty: 1,\n      unitPrice: 100,\n      discount: 0\n    }\n  ]\n}"}]}, {"id": "update-addtoset", "chapter": "寫入", "title": "加標籤但不重複（$addToSet）", "prompt": "幫商品 540 加上「熱銷」標籤；如果已經有了就不要重複加。\n", "hints": ["{ $addToSet: { tags: \"熱銷\" } }"], "answer": "db.products.updateOne({ _id: 540 }, { $addToSet: { tags: \"熱銷\" } })\n", "explanation": "$addToSet 把陣列當成集合使用。跑兩次結果也一樣，這種「重複執行不會出錯」的特性叫冪等（idempotent）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.products.updateOne({ _id: 540 }, { $addToSet: { tags: \"熱銷\" } })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}], "checks": [{"cmd": "db.products.findOne({ _id: 540 }, { tags: 1 })", "text": "{\n  _id: 540,\n  tags: [ '特價', '熱銷' ]\n}"}]}, {"id": "upsert", "chapter": "寫入", "title": "有就更新、沒有就新增（upsert）", "prompt": "以 email \"new@example.com\" 為條件更新會員：把 name 設成「新會員」、vipLevel 設成 \"normal\"。\n如果這個 email 不存在，就新增一份。\n", "hints": ["updateOne(條件, { $set: { … } }, { upsert: true })"], "answer": "db.customers.updateOne({ email: \"new@example.com\" }, { $set: { name: \"新會員\", vipLevel: \"normal\" } }, { upsert: true })\n", "explanation": "upsert 新增時，會把「查詢條件裡的等值欄位」（email）和 $set 的欄位合併成新文件。\n只想在「新增時」才設定的欄位用 $setOnInsert（例如建立時間）。\n★ 高並發下同時 upsert 同一個 email 可能新增出兩份，所以條件欄位要有唯一索引（customers.email 有）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.customers.updateOne({ email: \"new@example.com\" }, { $set: { name: \"新會員\", vipLevel: \"normal\" } }, { upsert: true })", "text": "{\n  acknowledged: true,\n  matchedCount: 0,\n  modifiedCount: 0,\n  upsertedId: 'BsonObjectId{value=6ac6e44141ec0fd50633b5a1}'\n}"}], "checks": [{"cmd": "db.customers.find({ email: \"new@example.com\" }, { _id: 0, email: 1, name: 1, vipLevel: 1 })", "text": "// 共 1 份\n{\n  email: 'new@example.com',\n  name: '新會員',\n  vipLevel: 'normal'\n}"}]}, {"id": "delete-many", "chapter": "寫入", "title": "刪除舊的取消訂單", "prompt": "刪除所有「狀態是 cancelled、而且下單時間早於台灣時間 2023-01-01」的訂單。\n", "hints": ["deleteMany({ status: \"cancelled\", orderDate: { $lt: ISODate(\"2023-01-01T00:00:00+08:00\") } })"], "answer": "db.orders.deleteMany({ status: \"cancelled\", orderDate: { $lt: ISODate(\"2023-01-01T00:00:00+08:00\") } })\n", "explanation": "deleteMany({}) 會刪除全部文件但保留集合與索引；drop() 連集合和索引一起刪掉。\n要自動刪除過期資料，可以建 TTL 索引：createIndex({ createdAt: 1 }, { expireAfterSeconds: 86400 })。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.orders.deleteMany({ status: \"cancelled\", orderDate: { $lt: ISODate(\"2023-01-01T00:00:00+08:00\") } })", "text": "{\n  acknowledged: true,\n  deletedCount: 418\n}"}], "checks": [{"cmd": "db.orders.countDocuments({})", "text": "7690"}, {"cmd": "db.orders.countDocuments({ orderDate: { $lt: ISODate(\"2023-01-01T00:00:00+08:00\") } })", "text": "0"}]}, {"id": "find-one-and-update", "chapter": "寫入", "title": "更新並拿回新的值（findOneAndUpdate）", "prompt": "把商品 540 的庫存減 1，並在同一個操作裡拿回「更新後」的文件（只要 name 和 stock）。\n", "hints": ["findOneAndUpdate(條件, { $inc: { stock: -1 } }, { returnDocument: \"after\", projection: { name: 1, stock: 1 } })"], "answer": "db.products.findOneAndUpdate({ _id: 540 }, { $inc: { stock: -1 } }, { returnDocument: \"after\", projection: { name: 1, stock: 1 } })\n", "explanation": "findOneAndUpdate 是原子的「更新並讀取」，預設回傳更新「前」的文件，要加 returnDocument: \"after\"。\n搭配條件 { _id: 540, stock: { $gt: 0 } } 就是不會超賣的扣庫存寫法（對照 Redis 實驗室的 Lua 腳本）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.products.findOneAndUpdate({ _id: 540 }, { $inc: { stock: -1 } }, { returnDocument: \"after\", projection: { name: 1, stock: 1 } })", "text": "{\n  _id: 540,\n  name: 'Sony 手機 I447',\n  stock: 10\n}"}]}], "traps": [{"id": "array-equality", "title": "陣列的等號", "question": "A 和 B 算出來的商品數一樣嗎？", "options": ["一樣", "A 比較多", "B 比較多"], "answer": 1, "explanation": "A：條件是單一值，MongoDB 會拿它跟陣列裡的「每一個元素」比，有任何一個相等就成立。\nB：條件本身是陣列，變成「整個陣列完全相等」，只有標籤剛好就是 [\"特價\"]、沒有其他標籤的商品才符合。\n要「包含這幾個」用 $all，要「包含其中任一個」用 $in。\n", "setup": null, "scripts": [{"label": "A：{ tags: \"特價\" }", "code": "db.products.countDocuments({ tags: \"特價\" })\n"}, {"label": "B：{ tags: [\"特價\"] }", "code": "db.products.countDocuments({ tags: [\"特價\"] })\n"}], "results": [[{"cmd": "db.products.countDocuments({ tags: \"特價\" })", "text": "303"}], [{"cmd": "db.products.countDocuments({ tags: [\"特價\"] })", "text": "140"}]]}, {"id": "elem-match", "title": "陣列裡的多個條件", "question": "A 是「同一項明細」同時符合 qty ≥ 3 和 unitPrice ≥ 10000 嗎？", "options": ["是，跟 B 一樣", "不是，A 比較多", "不是，A 比較少"], "answer": 1, "explanation": "A 的兩個條件是各自獨立比對整個 items 陣列：只要「有某一項」qty ≥ 3、而且「有某一項」unitPrice ≥ 10000 就成立，兩項可以是不同的明細。\nB 的 $elemMatch 要求「同一項」明細同時符合。所以 A 會多算進「一項買很多便宜貨、另一項買一個貴的」的訂單。\n", "setup": null, "scripts": [{"label": "A：兩個點號條件", "code": "db.orders.countDocuments({ \"items.qty\": { $gte: 3 }, \"items.unitPrice\": { $gte: 10000 } })\n"}, {"label": "B：$elemMatch", "code": "db.orders.countDocuments({ items: { $elemMatch: { qty: { $gte: 3 }, unitPrice: { $gte: 10000 } } } })\n"}], "results": [[{"cmd": "db.orders.countDocuments({ \"items.qty\": { $gte: 3 }, \"items.unitPrice\": { $gte: 10000 } })", "text": "4876"}], [{"cmd": "db.orders.countDocuments({ items: { $elemMatch: { qty: { $gte: 3 }, unitPrice: { $gte: 10000 } } } })", "text": "2074"}]]}, {"id": "null-matches-missing", "title": "null 也會找到沒有欄位的文件", "question": "有些會員沒有 city 欄位（不是 null，是整個欄位不存在）。A 的 { city: null } 會找到他們嗎？", "options": ["會，跟 B 一樣", "不會，只找值是 null 的，結果是 0", "執行錯誤"], "answer": 0, "explanation": "{ 欄位: null } 會同時找到「值是 null」和「沒有這個欄位」的文件。\n只想要其中一種：沒有欄位用 { $exists: false }；值剛好是 null 用 { $type: \"null\" }。\n對照 SQL：PostgreSQL 的 city = NULL 永遠不成立，要寫 IS NULL；MongoDB 的行為剛好相反，很容易搞混。\n", "setup": null, "scripts": [{"label": "A：{ city: null }", "code": "db.customers.countDocuments({ city: null })\n"}, {"label": "B：{ city: { $exists: false } }", "code": "db.customers.countDocuments({ city: { $exists: false } })\n"}], "results": [[{"cmd": "db.customers.countDocuments({ city: null })", "text": "616"}], [{"cmd": "db.customers.countDocuments({ city: { $exists: false } })", "text": "616"}]]}, {"id": "type-mismatch", "title": "型別不同就找不到", "question": "商品的 _id 是數字 540。A 用字串 \"540\" 查得到嗎？", "options": ["查得到，MongoDB 會自動轉型", "查不到，結果是 0", "執行錯誤"], "answer": 1, "explanation": "MongoDB 比對時型別也要一樣，字串 \"540\" 和數字 540 是不同的值，不會自動轉型，也不會報錯。\nJava 最常踩到：前端傳來的 id 是 String，直接拿去查數字型別的欄位，永遠查不到。\n同理，ObjectId(\"…\") 和字串 \"…\" 也不相等。\n", "setup": null, "scripts": [{"label": "A：字串 \"540\"", "code": "db.products.countDocuments({ _id: \"540\" })\n"}, {"label": "B：數字 540", "code": "db.products.countDocuments({ _id: 540 })\n"}], "results": [[{"cmd": "db.products.countDocuments({ _id: \"540\" })", "text": "0"}], [{"cmd": "db.products.countDocuments({ _id: 540 })", "text": "1"}]]}, {"id": "replace-drops-fields", "title": "replaceOne 會換掉整份文件", "question": "A 用 replaceOne 把商品 540 的庫存改成 20。執行後這份文件還剩哪些欄位？", "options": ["所有欄位都在，只有 stock 變成 20", "只剩 _id 和 stock", "執行錯誤"], "answer": 1, "explanation": "replaceOne 會用新文件「整份取代」舊文件（_id 保留），名稱、價格、分類全部消失。\n只想改部分欄位一定要用 updateOne / updateMany 搭配 $set。\nSpring Data MongoDB 的 repository.save(entity) 也是整份取代：如果 entity 是只載入部分欄位的物件，存回去就會把其他欄位清掉。\n", "setup": null, "scripts": [{"label": "A：replaceOne", "code": "db.products.replaceOne({ _id: 540 }, { stock: 20 })\ndb.products.findOne({ _id: 540 })\n"}, {"label": "B：updateOne + $set", "code": "db.products.updateOne({ _id: 540 }, { $set: { stock: 20 } })\ndb.products.findOne({ _id: 540 })\n"}], "results": [[{"cmd": "db.products.replaceOne({ _id: 540 }, { stock: 20 })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}, {"cmd": "db.products.findOne({ _id: 540 })", "text": "{\n  _id: 540,\n  stock: 20\n}"}], [{"cmd": "db.products.updateOne({ _id: 540 }, { $set: { stock: 20 } })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}, {"cmd": "db.products.findOne({ _id: 540 })", "text": "{\n  _id: 540,\n  name: 'Sony 手機 I447',\n  category: {\n    _id: 2,\n    name: '手機',\n    path: [ '3C電子', '手機' ]\n  },\n  price: 29949,\n  cost: 15756,\n  stock: 20,\n  isActive: true,\n  createdAt: ISODate('2021-03-01T00:00:00Z'),\n  tags: [ '特價' ],\n  specs: {\n    '5g': false,\n    color: '白',\n    warranty: {\n      type: '原廠',\n      years: 2\n    },\n    storage_gb: 128,\n    screen_inch: 6.3\n  }\n}"}]]}, {"id": "sort-limit-order", "title": "先 limit 再 sort？", "question": "A 把 .limit(3) 寫在 .sort() 前面。A 會先隨便取 3 筆再排序嗎？", "options": ["會，結果跟 B 不同", "不會，結果跟 B 一樣", "執行錯誤"], "answer": 1, "explanation": "find 的 sort、skip、limit 不管怎麼串，MongoDB 都固定依「sort → skip → limit」的順序執行，所以 A 和 B 一樣。\n但聚合管線不一樣：[ { $limit: 3 }, { $sort: … } ] 真的會先取 3 筆再排序，因為管線是照 stage 的順序執行的。\n", "setup": null, "scripts": [{"label": "A：.limit(3).sort(…)", "code": "db.orders.find({ status: \"paid\" }, { total: 1 }).limit(3).sort({ total: -1 })\n"}, {"label": "B：.sort(…).limit(3)", "code": "db.orders.find({ status: \"paid\" }, { total: 1 }).sort({ total: -1 }).limit(3)\n"}], "results": [[{"cmd": "db.orders.find({ status: \"paid\" }, { total: 1 }).limit(3).sort({ total: -1 })", "text": "// 共 3 份\n{\n  _id: 79042,\n  total: 194734\n}\n{\n  _id: 78975,\n  total: 147588\n}\n{\n  _id: 79676,\n  total: 143543\n}"}], [{"cmd": "db.orders.find({ status: \"paid\" }, { total: 1 }).sort({ total: -1 }).limit(3)", "text": "// 共 3 份\n{\n  _id: 79042,\n  total: 194734\n}\n{\n  _id: 78975,\n  total: 147588\n}\n{\n  _id: 79676,\n  total: 143543\n}"}]]}, {"id": "timezone", "title": "日期與時區", "question": "想查「台灣時間 2026 年 9 月」的訂單。A 和 B 的筆數一樣嗎？", "options": ["一樣", "不一樣"], "answer": 1, "explanation": "MongoDB 的日期一律以 UTC 儲存。ISODate(\"2026-09-01\") 是 UTC 的午夜，等於台灣時間 9/1 早上 8 點。\nA 少了 9/1 凌晨 0 ~ 8 點的訂單，又多了 10/1 凌晨 0 ~ 8 點的訂單。\nJava 端的 LocalDate、LocalDateTime 沒有時區，轉成 Date 時一定要明確指定 ZoneId.of(\"Asia/Taipei\")。\n", "setup": null, "scripts": [{"label": "A：沒寫時區（UTC）", "code": "db.orders.countDocuments({ orderDate: { $gte: ISODate(\"2026-09-01\"), $lt: ISODate(\"2026-10-01\") } })\n"}, {"label": "B：寫出 +08:00", "code": "db.orders.countDocuments({ orderDate: { $gte: ISODate(\"2026-09-01T00:00:00+08:00\"), $lt: ISODate(\"2026-10-01T00:00:00+08:00\") } })\n"}], "results": [[{"cmd": "db.orders.countDocuments({ orderDate: { $gte: ISODate(\"2026-09-01\"), $lt: ISODate(\"2026-10-01\") } })", "text": "2889"}], [{"cmd": "db.orders.countDocuments({ orderDate: { $gte: ISODate(\"2026-09-01T00:00:00+08:00\"), $lt: ISODate(\"2026-10-01T00:00:00+08:00\") } })", "text": "2919"}]]}, {"id": "update-one-only", "title": "updateOne 只更新一份", "question": "有 300 多筆 pending 訂單。A 的 updateOne 會更新幾份？", "options": ["1 份", "全部 pending 的訂單"], "answer": 0, "explanation": "updateOne、deleteOne、replaceOne 只處理「第一份」符合條件的文件；哪一份是第一份並不保證。\n要全部處理用 updateMany、deleteMany。看回傳值的 matchedCount 和 modifiedCount 就能確認影響了幾份。\n", "setup": null, "scripts": [{"label": "A：updateOne", "code": "db.orders.updateOne({ status: \"pending\" }, { $set: { status: \"paid\" } })\ndb.orders.countDocuments({ status: \"pending\" })\n"}, {"label": "B：updateMany", "code": "db.orders.updateMany({ status: \"pending\" }, { $set: { status: \"paid\" } })\ndb.orders.countDocuments({ status: \"pending\" })\n"}], "results": [[{"cmd": "db.orders.updateOne({ status: \"pending\" }, { $set: { status: \"paid\" } })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}, {"cmd": "db.orders.countDocuments({ status: \"pending\" })", "text": "328"}], [{"cmd": "db.orders.updateMany({ status: \"pending\" }, { $set: { status: \"paid\" } })", "text": "{\n  acknowledged: true,\n  matchedCount: 329,\n  modifiedCount: 329,\n  upsertedId: null\n}"}, {"cmd": "db.orders.countDocuments({ status: \"pending\" })", "text": "0"}]]}], "steps": [{"id": "collscan", "title": "沒有索引：COLLSCAN", "goal": "orders 只有 _id 的索引。查會員 4242 的訂單，依下單時間由新到舊。\n", "question": "回傳幾份文件？為了找到它們，MongoDB 看了幾份文件（docsExamined）？", "takeaway": "COLLSCAN = 整個集合從頭掃到尾，相當於 PostgreSQL 的 Seq Scan。\n看 explain 最重要的三個數字：nReturned（回傳幾份）、totalKeysExamined（看了幾個索引項目）、totalDocsExamined（讀了幾份文件）。\n理想狀況是三個數字差不多；docsExamined 遠大於 nReturned，就代表缺索引。\n另外計畫裡還有一個 SORT：沒有索引可以提供順序，只好在記憶體裡排序（超過 100 MB 會失敗，除非允許使用磁碟）。\n", "setup": [], "queries": [{"label": "會員 4242 的訂單", "code": "db.orders.find({ customerId: 4242 }).sort({ orderDate: -1 })"}]}, {"id": "single-field", "title": "單欄索引：IXSCAN，但還要排序", "goal": "在 customerId 建一個索引，再跑一次同樣的查詢。\n", "question": "計畫變成什麼？docsExamined 剩多少？還有沒有 SORT？", "takeaway": "變成 IXSCAN → FETCH：先在索引找到符合的位置，再去讀文件。docsExamined 從 8 萬變成跟 nReturned 一樣。\n但還是有 SORT：這個索引只依 customerId 排，同一位會員的訂單沒有依時間排好。\n", "setup": ["db.orders.createIndex({ customerId: 1 })"], "queries": [{"label": "會員 4242 的訂單", "code": "db.orders.find({ customerId: 4242 }).sort({ orderDate: -1 })"}]}, {"id": "compound", "title": "複合索引把排序也省掉", "goal": "建 { customerId: 1, orderDate: -1 } 的複合索引（可以先刪掉上一步的 customerId_1，看得比較清楚）。\n", "question": "SORT 還在嗎？", "takeaway": "複合索引先依 customerId、再依 orderDate 排序，找到 4242 之後資料本來就是照時間排好的，SORT 消失了。\n排序方向：單欄索引正反都能用；複合索引要「全部同向」或「全部反向」才能用，{ customerId: 1, orderDate: -1 } 可以支援\nsort({ customerId: 1, orderDate: -1 }) 和 sort({ customerId: -1, orderDate: 1 })，但不支援 sort({ customerId: 1, orderDate: 1 })。\n", "setup": ["db.orders.dropIndex(\"customerId_1\")", "db.orders.createIndex({ customerId: 1, orderDate: -1 })"], "queries": [{"label": "會員 4242 的訂單", "code": "db.orders.find({ customerId: 4242 }).sort({ orderDate: -1 })"}]}, {"id": "esr", "title": "★ ESR 規則：等值、排序、範圍", "goal": "查已送達、金額 5 萬以上的訂單，依時間由新到舊取最新 10 筆（典型的分頁查詢）。這個查詢有三種條件：\n等值（Equality）status、範圍（Range）total、排序（Sort）orderDate。\n建兩個欄位順序不同的索引，用 hint 指定索引，比較兩者。\n", "question": "A 和 B 哪一個有 SORT？各看了幾個索引項目（keysExamined）？優化器選了哪一個？", "takeaway": "★ ESR 規則（MongoDB 官方建議的複合索引欄位順序）：Equality → Sort → Range。\nA（E-R-S）：範圍之後的 orderDate 不再有順序，必須把符合範圍的「全部」找出來（約 5 千筆）再排序，才知道最新 10 筆是哪些。\nB（E-S-R）：等值之後的資料已經依時間排好，從最新的開始往下看，一邊用 total 過濾，湊滿 10 筆就停，只看了一百多個索引項目，也沒有 SORT。\n範圍條件越寬鬆，差距越大（試著把 50000 改成 1000）。\n但如果不加 limit、而且範圍條件非常嚴格，A 有可能比較快，因為它直接跳到範圍裡、看的項目最少。\n所以 ESR 是「預設的好選擇」，特別適合分頁和排序查詢；不確定時就用 explain 比較。PostgreSQL 的複合索引也是一樣的道理。\n", "setup": ["db.orders.createIndex({ status: 1, total: 1, orderDate: -1 }, { name: \"idx_ERS\" })", "db.orders.createIndex({ status: 1, orderDate: -1, total: 1 }, { name: \"idx_ESR\" })"], "queries": [{"label": "A：索引順序 E-R-S", "code": "db.orders.find({ status: \"delivered\", total: { $gte: 50000 } }).sort({ orderDate: -1 }).limit(10).hint(\"idx_ERS\")"}, {"label": "B：索引順序 E-S-R", "code": "db.orders.find({ status: \"delivered\", total: { $gte: 50000 } }).sort({ orderDate: -1 }).limit(10).hint(\"idx_ESR\")"}, {"label": "C：不指定索引，讓優化器自己選", "code": "db.orders.find({ status: \"delivered\", total: { $gte: 50000 } }).sort({ orderDate: -1 }).limit(10)"}]}, {"id": "multikey", "title": "陣列欄位的索引：多鍵索引", "goal": "查買過商品 540 的訂單。items 是陣列，對 items.productId 建索引。\n", "question": "建索引前後 docsExamined 差多少？explain 裡的 isMultiKey 是什麼？", "takeaway": "對陣列欄位建的索引叫多鍵索引（multikey index）：每一個陣列元素各產生一個索引項目，一張有 4 項明細的訂單就有 4 個項目。\n限制：一個複合索引裡最多只能有一個陣列欄位；陣列很大時索引也會很大。\n", "setup": ["db.orders.createIndex({ \"items.productId\": 1 })"], "queries": [{"label": "買過商品 540 的訂單", "code": "db.orders.find({ \"items.productId\": 540 })"}]}, {"id": "covered", "title": "覆蓋查詢：連文件都不用讀", "goal": "確認有 { customerId: 1, orderDate: -1 } 的索引（第 3 步）。比較「只要索引裡有的欄位」和「多要一個欄位」。\n", "question": "A 的 docsExamined 是多少？計畫裡有沒有 FETCH？", "takeaway": "A 需要的欄位全在索引裡，直接從索引回傳，叫覆蓋查詢（covered query）：docsExamined = 0、沒有 FETCH。\n★ 一定要寫 _id: 0，因為 _id 不在這個索引裡，預設又會回傳。\nB 多要了 total，只好回去讀文件。對照 PostgreSQL 的 Index Only Scan。\n", "setup": ["db.orders.createIndex({ customerId: 1, orderDate: -1 })"], "queries": [{"label": "A：只要 customerId、orderDate（排除 _id）", "code": "db.orders.find({ customerId: 4242 }, { _id: 0, customerId: 1, orderDate: 1 })"}, {"label": "B：多要 total", "code": "db.orders.find({ customerId: 4242 }, { _id: 0, customerId: 1, orderDate: 1, total: 1 })"}]}]}, {"id": "cassandra", "name": "Cassandra", "lang": "cql", "labName": "表設計實驗", "labNote": "每一句查詢都開啟查詢追蹤（TRACING），比較「讀取方式」（單一分區、範圍掃描、SAI 索引）與伺服器實際讀了幾列。", "hasResults": true, "exercises": [{"id": "by-order-id", "chapter": "主鍵查詢", "title": "用訂單編號查訂單", "prompt": "查訂單 77621 的狀態（status）與總金額（total）。\n", "hints": ["orders 的主鍵是 order_id，WHERE order_id = … 就是一次「單一分區」的讀取。"], "answer": "SELECT status, total FROM orders WHERE order_id = 77621;\n", "explanation": "Cassandra 依分區鍵的雜湊值（token）決定資料放在哪個節點，WHERE 給了完整的分區鍵，協調節點就能直接找到負責的節點，\n不管叢集有幾台機器都只讀一個地方。這是 Cassandra 最快、也最「正確」的查法。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT status, total FROM orders WHERE order_id = 77621", "table": {"columns": ["status", "total"], "rows": [["cancelled", 1519]], "total": 1}}]}, {"id": "customer-orders", "chapter": "主鍵查詢", "title": "會員的訂單（新的在前）", "prompt": "列出會員 4242 的所有訂單，新的在前。\n回傳 order_time、order_id、status、total 四個欄位。\n", "hints": ["orders 沒辦法用 customer_id 查（它不是主鍵），要找「依會員存放」的那張表。", "orders_by_customer 的叢集鍵是 order_time DESC，資料在分區裡已經排好了，不用寫 ORDER BY。"], "answer": "SELECT order_time, order_id, status, total\nFROM orders_by_customer\nWHERE customer_id = 4242;\n", "explanation": "同一個分區裡的資料列依叢集鍵排序後存放在一起。建表時寫了 CLUSTERING ORDER BY (order_time DESC)，\n所以讀出來就是新的在前，不需要排序。這就是 Cassandra 的「查詢先行」設計：先決定要怎麼查，再決定表的主鍵。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_time, order_id, status, total\nFROM orders_by_customer\nWHERE customer_id = 4242", "table": {"columns": ["order_time", "order_id", "status", "total"], "rows": [["2026-03-06T23:54:08.827Z", 59901, "delivered", 3098], ["2025-07-30T06:01:00.168Z", 42762, "delivered", 7517], ["2025-06-05T16:00:05.487Z", 39226, "returned", 36391], ["2024-03-12T20:25:37.131Z", 16901, "delivered", 4596], ["2024-02-15T13:15:50.591Z", 15943, "delivered", 1647], ["2023-03-26T00:04:57.275Z", 6116, "delivered", 4784]], "total": 6}}]}, {"id": "latest-three", "chapter": "主鍵查詢", "title": "最近 3 筆訂單", "prompt": "會員 1 最近的 3 筆訂單，回傳 order_id、total，新的在前。\n", "hints": ["LIMIT 在分區內一樣有效，而且資料已經依時間排好，讀到第 3 列就停。"], "answer": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 1 LIMIT 3;\n", "explanation": "因為分區內已經依 order_time DESC 排好，LIMIT 3 只要讀分區開頭的 3 列，不用像 SQL 一樣先排序全部再取前 3。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 1 LIMIT 3", "table": {"columns": ["order_id", "total"], "rows": [[77621, 1519], [75279, 1909], [72474, 21018]], "total": 3}}]}, {"id": "oldest-first", "chapter": "主鍵查詢", "title": "由舊到新", "prompt": "會員 4242 的訂單改成由舊到新，回傳 order_time、order_id。\n", "hints": ["ORDER BY 只能用叢集鍵，而且只能是建表時的順序或完全相反的順序。"], "answer": "SELECT order_time, order_id FROM orders_by_customer\nWHERE customer_id = 4242\nORDER BY order_time ASC;\n", "explanation": "ORDER BY 只能寫叢集鍵：要嘛跟建表時的順序一樣，要嘛全部反過來（反向讀取分區）。\nORDER BY order_time ASC 等於把整個叢集順序反過來，order_id 也會跟著反向。想依 total 排序是不行的，只能拿回應用程式排序，或另外建一張以 total 為叢集鍵的表。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_time, order_id FROM orders_by_customer\nWHERE customer_id = 4242\nORDER BY order_time ASC", "table": {"columns": ["order_time", "order_id"], "rows": [["2023-03-26T00:04:57.275Z", 6116], ["2024-02-15T13:15:50.591Z", 15943], ["2024-03-12T20:25:37.131Z", 16901], ["2025-06-05T16:00:05.487Z", 39226], ["2025-07-30T06:01:00.168Z", 42762], ["2026-03-06T23:54:08.827Z", 59901]], "total": 6}}]}, {"id": "year-count", "chapter": "主鍵查詢", "title": "某一年的訂單數", "prompt": "會員 1 在 2025 年（台灣時間）下了幾筆訂單？回傳一個數字。\n", "hints": ["分區鍵用等號，叢集鍵 order_time 可以用範圍。", "時間字串加上時區，例如 '2025-01-01 00:00:00+0800'，才不會受伺服器時區影響。"], "answer": "SELECT COUNT(*) FROM orders_by_customer\nWHERE customer_id = 1\n  AND order_time >= '2025-01-01 00:00:00+0800'\n  AND order_time <  '2026-01-01 00:00:00+0800';\n", "explanation": "分區鍵等號 + 叢集鍵範圍，是 Cassandra 最典型的查法：找到分區後，在排好序的資料裡切一段出來。\nCOUNT(*) 限定在單一分區內很便宜；不加分區鍵的 COUNT(*) 會掃整張表（陷阱題有示範）。\n時間字串沒寫時區時，Cassandra 用伺服器的時區解讀，這個容器剛好設成 Asia/Taipei，換一台機器結果就可能不同，寫清楚最保險。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT COUNT(*) FROM orders_by_customer\nWHERE customer_id = 1\n  AND order_time >= '2025-01-01 00:00:00+0800'\n  AND order_time <  '2026-01-01 00:00:00+0800'", "table": {"columns": ["count"], "rows": [[24]], "total": 1}}]}, {"id": "login-by-email", "chapter": "主鍵查詢", "title": "用 email 登入", "prompt": "用 email 'user04242@example.com' 查會員編號（customer_id）與姓名（name）。\n", "hints": ["customers 的主鍵是 customer_id，用 email 查要找另一張表。"], "answer": "SELECT customer_id, name FROM customers_by_email WHERE email = 'user04242@example.com';\n", "explanation": "同一份會員資料以不同的分區鍵存兩次（customers、customers_by_email），每一種查法都是單一分區讀取。\n代價是寫入變成兩次，email 變更時兩張表都要改（通常用 logged BATCH 確保兩張表最終都寫成功）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT customer_id, name FROM customers_by_email WHERE email = 'user04242@example.com'", "table": {"columns": ["customer_id", "name"], "rows": [[4242, "蘇建恩"]], "total": 1}}]}, {"id": "multi-get", "chapter": "主鍵查詢", "title": "一次查多件商品", "prompt": "一次查出商品 540、541、542 的 product_id、name、price。順序不拘。\n", "hints": ["分區鍵可以用 IN。"], "answer": "SELECT product_id, name, price FROM products WHERE product_id IN (540, 541, 542);\n", "explanation": "分區鍵用 IN 時，協調節點要分別去找每個分區（可能在不同節點），IN 的值一多，協調節點的壓力就很大。\n實務上幾個到幾十個還好；更多時，改成在應用程式裡平行送出多個單一分區查詢，通常比較快也比較穩定。\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "SELECT product_id, name, price FROM products WHERE product_id IN (540, 541, 542)", "table": {"columns": ["product_id", "name", "price"], "rows": [[540, "Sony 手機 I447", 29949], [541, "MAC 彩妝 M983", 309], [542, "Coleman 露營用品 C299", 3069]], "total": 3}}]}, {"id": "category-top", "chapter": "叢集鍵與時間分桶", "title": "分類裡最貴的 5 件", "prompt": "「手機」分類最貴的 5 件商品，回傳 name、price，價格由高到低。\n", "hints": ["products_by_category 的分區鍵是 category，叢集鍵是 price DESC。"], "answer": "SELECT name, price FROM products_by_category WHERE category = '手機' LIMIT 5;\n", "explanation": "叢集鍵 (price DESC, product_id) 讓分區裡的商品已經依價格由高到低排好；\nproduct_id 也放進叢集鍵，是為了讓「同價的兩件商品」主鍵不同，不會互相覆蓋。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT name, price FROM products_by_category WHERE category = '手機' LIMIT 5", "table": {"columns": ["name", "price"], "rows": [["Sony 手機 I447", 29949], ["小米 手機 O256", 28769], ["ASUS 手機 H620", 28659], ["Samsung 手機 D707", 28649], ["Apple 手機 Q137", 28229]], "total": 5}}]}, {"id": "price-range", "chapter": "叢集鍵與時間分桶", "title": "價格區間", "prompt": "「筆電」分類裡，價格在 20,000 到 30,000 之間（含兩端）的商品，\n回傳 product_id、name、price，價格由低到高。\n", "hints": ["叢集鍵可以用 >=、<= 切範圍。", "由低到高跟建表的順序相反，要寫 ORDER BY。"], "answer": "SELECT product_id, name, price FROM products_by_category\nWHERE category = '筆電' AND price >= 20000 AND price <= 30000\nORDER BY price ASC;\n", "explanation": "範圍條件只能放在叢集鍵上，而且要依叢集鍵的順序：先限定 price，才能再限定 product_id。\nORDER BY price ASC 是把分區反向讀取，不需要額外排序。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT product_id, name, price FROM products_by_category\nWHERE category = '筆電' AND price >= 20000 AND price <= 30000\nORDER BY price ASC", "table": {"columns": ["product_id", "name", "price"], "rows": [[417, "MSI 筆電 F301", 20539], [551, "Lenovo 筆電 O625", 21209], [1053, "ASUS 筆電 C956", 21579], [1268, "Lenovo 筆電 J333", 22209], [619, "Lenovo 筆電 U495", 22939], [1086, "MSI 筆電 Z112", 23229], [113, "Apple 筆電 Q541", 24549], [555, "Lenovo 筆電 I383", 24879], [1306, "Lenovo 筆電 Q986", 27049], [1065, "MSI 筆電 E394", 27209]], "total": 13}}]}, {"id": "day-count", "chapter": "叢集鍵與時間分桶", "title": "某一天的訂單數", "prompt": "2026-09-01（台灣時間）有幾筆訂單？回傳一個數字。\n", "hints": ["orders_by_day 一天一個分區，order_day 是台灣時間的日期。"], "answer": "SELECT COUNT(*) FROM orders_by_day WHERE order_day = '2026-09-01';\n", "explanation": "這叫「時間分桶」（bucketing）：如果分區鍵只用「全部訂單」或「年份」，分區會無限長大；\n用日期當分區鍵，每個分區大小固定（一天幾十到幾百筆），查詢某段時間就查那幾天的分區。\n分桶的粒度依寫入量決定：寫入很大的系統可能用小時，甚至 (日期, 0~9 的雜湊) 再拆開。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT COUNT(*) FROM orders_by_day WHERE order_day = '2026-09-01'", "table": {"columns": ["count"], "rows": [[87]], "total": 1}}]}, {"id": "week-by-day", "chapter": "叢集鍵與時間分桶", "title": "一週每天的訂單數", "prompt": "2026-09-01 到 2026-09-07（台灣時間）每天各有幾筆訂單？\n回傳 order_day 與筆數，日期由早到晚。\n", "hints": ["分區鍵可以用 IN 列出 7 天。", "GROUP BY 只能用主鍵欄位，這裡用分區鍵 order_day。"], "answer": "SELECT order_day, COUNT(*) FROM orders_by_day\nWHERE order_day IN ('2026-09-01', '2026-09-02', '2026-09-03', '2026-09-04',\n                    '2026-09-05', '2026-09-06', '2026-09-07')\nGROUP BY order_day;\n", "explanation": "GROUP BY 只能用主鍵欄位，而且要依主鍵順序（分區鍵 → 叢集鍵的前綴）。\n執行時會看到警告「Aggregation query used on multiple partition keys」：IN 跨了好幾個分區，協調節點要把它們都讀回來再彙總。\n七天還好，資料量大的報表通常用 Spark 之類的工具，或在寫入時就另外累計（例如計數器表）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_day, COUNT(*) FROM orders_by_day\nWHERE order_day IN ('2026-09-01', '2026-09-02', '2026-09-03', '2026-09-04',\n                    '2026-09-05', '2026-09-06', '2026-09-07')\nGROUP BY order_day", "table": {"columns": ["order_day", "count"], "rows": [["2026-09-01", 87], ["2026-09-02", 102], ["2026-09-03", 95], ["2026-09-04", 87], ["2026-09-05", 98], ["2026-09-06", 82], ["2026-09-07", 90]], "total": 7}, "warn": ["Aggregation query used on multiple partition keys (IN restriction)"]}]}, {"id": "evening-orders", "chapter": "叢集鍵與時間分桶", "title": "某天晚上的訂單", "prompt": "2026-09-01 晚上 8 點到 10 點（台灣時間，含 8 點、不含 10 點）的訂單，\n回傳 order_time、order_id、total，時間由早到晚。\n", "hints": ["先用分區鍵選出那一天，再用叢集鍵 order_time 切範圍。"], "answer": "SELECT order_time, order_id, total FROM orders_by_day\nWHERE order_day = '2026-09-01'\n  AND order_time >= '2026-09-01 20:00:00+0800'\n  AND order_time <  '2026-09-01 22:00:00+0800';\n", "explanation": "orders_by_day 的叢集鍵 order_time 是預設的 ASC，所以讀出來就是由早到晚。\n回傳的時間是 UTC（2026-09-01T12:00:00Z 就是台灣時間晚上 8 點），Cassandra 一律以 UTC 儲存 timestamp。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_time, order_id, total FROM orders_by_day\nWHERE order_day = '2026-09-01'\n  AND order_time >= '2026-09-01 20:00:00+0800'\n  AND order_time <  '2026-09-01 22:00:00+0800'", "table": {"columns": ["order_time", "order_id", "total"], "rows": [["2026-09-01T12:27:40.014Z", 77153, 3207], ["2026-09-01T12:37:18.848Z", 77154, 34664], ["2026-09-01T13:08:33.180Z", 77155, 539], ["2026-09-01T13:21:05.119Z", 77156, 4158], ["2026-09-01T13:24:10.128Z", 77157, 4746], ["2026-09-01T13:27:39.826Z", 77158, 4644]], "total": 6}}]}, {"id": "first-of-each-day", "chapter": "叢集鍵與時間分桶", "title": "每天的第一筆訂單", "prompt": "2026-09-01、09-02、09-03 這三天，每天最早的那一筆訂單，\n回傳 order_day、order_time、order_id。\n", "hints": ["LIMIT 是整個結果的上限；有一個語法可以限制「每個分區」最多幾列。"], "answer": "SELECT order_day, order_time, order_id FROM orders_by_day\nWHERE order_day IN ('2026-09-01', '2026-09-02', '2026-09-03')\nPER PARTITION LIMIT 1;\n", "explanation": "PER PARTITION LIMIT n 讓每個分區只回傳前 n 列（依叢集鍵順序），是 Cassandra 版的「每組取前 n 名」。\n在 SQL 裡要用 ROW_NUMBER() OVER (PARTITION BY …) 才做得到。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_day, order_time, order_id FROM orders_by_day\nWHERE order_day IN ('2026-09-01', '2026-09-02', '2026-09-03')\nPER PARTITION LIMIT 1", "table": {"columns": ["order_day", "order_time", "order_id"], "rows": [["2026-09-01", "2026-08-31T16:02:36.344Z", 77082], ["2026-09-02", "2026-09-01T16:21:32.455Z", 77169], ["2026-09-03", "2026-09-02T16:14:54.562Z", 77271]], "total": 3}}]}, {"id": "latest-buyers", "chapter": "叢集鍵與時間分桶", "title": "最近買了這件商品的人", "prompt": "商品 540 最近被買的 5 次，回傳 customer_id、order_time，新的在前。\n", "hints": ["訂單明細依商品再存了一份。"], "answer": "SELECT customer_id, order_time FROM items_by_product WHERE product_id = 540 LIMIT 5;\n", "explanation": "同一筆明細存在 orders（依訂單）與 items_by_product（依商品）兩個地方。\nCassandra 的寫入很便宜，讀取時跨分區才貴，所以「多寫幾份，讓每種查詢都只讀一個分區」是常態。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT customer_id, order_time FROM items_by_product WHERE product_id = 540 LIMIT 5", "table": {"columns": ["customer_id", "order_time"], "rows": [[9323, "2026-09-10T15:16:18.484Z"], [14300, "2026-09-07T13:01:08.203Z"], [873, "2026-08-16T17:17:27.003Z"], [1421, "2026-08-07T20:29:41.004Z"], [1746, "2026-08-02T13:08:22.507Z"]], "total": 5}}]}, {"id": "filter-in-partition", "chapter": "叢集鍵與時間分桶", "title": "分區內再篩選", "prompt": "會員 4242 的訂單裡，狀態是 returned（退貨）的有哪些？回傳 order_id、total。\n", "hints": ["status 不是主鍵，直接寫會被拒絕。", "已經限定在單一分區裡，篩選的成本只跟這個分區的大小有關。"], "answer": "SELECT order_id, total FROM orders_by_customer\nWHERE customer_id = 4242 AND status = 'returned'\nALLOW FILTERING;\n", "explanation": "ALLOW FILTERING 本身不是壞事，壞的是「沒有限定分區」的 ALLOW FILTERING，那會掃整張表。\n限定了分區鍵之後，只是在一個分區（這位會員的幾筆訂單）裡逐列過濾，成本很小。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_id, total FROM orders_by_customer\nWHERE customer_id = 4242 AND status = 'returned'\nALLOW FILTERING", "table": {"columns": ["order_id", "total"], "rows": [[39226, 36391]], "total": 1}}]}, {"id": "distinct-partitions", "chapter": "叢集鍵與時間分桶", "title": "列出所有分類", "prompt": "products_by_category 裡有哪些分類？每個分類一列，只回傳 category。順序不拘。\n", "hints": ["DISTINCT 只能用在分區鍵上。"], "answer": "SELECT DISTINCT category FROM products_by_category;\n", "explanation": "DISTINCT 只能用在分區鍵（以及 static 欄位），它只讀每個分區的開頭，不讀分區裡的資料列。\n但它還是要走過所有分區，分區很多時一樣是全表掃描。順序是依分區鍵的 token（雜湊值），看起來是亂的。\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "SELECT DISTINCT category FROM products_by_category", "table": {"columns": ["category"], "rows": [["運動鞋"], ["有線耳機"], ["彩妝"], ["飲料"], ["筆電"], ["保養"], ["廚房用品"], ["收納"], ["男裝"], ["女裝"]], "total": 19}}]}, {"id": "collections", "chapter": "集合與函式", "title": "set 與 map", "prompt": "查商品 540 的 tags（set）以及 specs 裡 color 這個 key 的值。回傳兩個欄位。\n", "hints": ["map 可以用 欄位['key'] 取單一個值。"], "answer": "SELECT tags, specs['color'] FROM products WHERE product_id = 540;\n", "explanation": "set、list、map 適合存「少量、跟著這一列一起讀」的資料（幾十個以內）。\n非 frozen 的集合可以只更新其中一個元素；frozen 的集合（例如 orders.items 的 list<frozen<order_item>> 裡的每一項）只能整個換掉。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT tags, specs['color'] FROM products WHERE product_id = 540", "table": {"columns": ["tags", "specs['color']"], "rows": [["['特價']", "白"]], "total": 1}}]}, {"id": "avg-decimal", "chapter": "集合與函式", "title": "平均訂單金額", "prompt": "會員 4242 的訂單筆數、總金額、平均金額（要有小數）、最大金額。回傳 4 個數字。\n", "hints": ["aggregate 函式：COUNT、SUM、AVG、MIN、MAX。", "total 是 int，AVG(int) 的結果也是 int（小數會被捨去）。"], "answer": "SELECT COUNT(*), SUM(total), AVG(CAST(total AS double)), MAX(total)\nFROM orders_by_customer WHERE customer_id = 4242;\n", "explanation": "CQL 的 AVG 回傳跟欄位一樣的型別：int 欄位的平均會直接捨去小數（9672.17 變成 9672）。\n要小數就先 CAST 成 double 或 decimal。aggregate 也只建議用在單一分區內。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT COUNT(*), SUM(total), AVG(CAST(total AS double)), MAX(total)\nFROM orders_by_customer WHERE customer_id = 4242", "table": {"columns": ["count", "system.sum(total)", "system.avg(cast(total as double))", "system.max(total)"], "rows": [[6, 58033, 9672.166666666666, 36391]], "total": 1}}]}, {"id": "writetime", "chapter": "集合與函式", "title": "寫入時間", "prompt": "查會員 4242 的 name，以及這個欄位的寫入時間 WRITETIME（微秒）。回傳兩個欄位。\n", "hints": ["WRITETIME(欄位) 回傳該欄位最後一次寫入的時間戳記。"], "answer": "SELECT name, WRITETIME(name) FROM customers WHERE customer_id = 4242;\n", "explanation": "Cassandra 的每一個欄位值（cell）都帶著自己的寫入時間戳記與 TTL。同一個欄位被寫了好幾次時，時間戳記最大的勝出（last write wins），\n這也是它不需要鎖、也能在多個複本之間合併資料的原因。主鍵欄位沒有 WRITETIME。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT name, WRITETIME(name) FROM customers WHERE customer_id = 4242", "table": {"columns": ["name", "writetime(name)"], "rows": [["蘇建恩", 1791299097900541]], "total": 1}}]}, {"id": "batch-two-tables", "chapter": "寫入", "title": "新會員寫兩張表", "prompt": "新增一位會員：customer_id 99999、name '測試會員'、email 'test99999@example.com'、\nsignup_date '2026-10-06'、vip_level 'normal'。\n會員資料要同時寫進 customers 與 customers_by_email（email、customer_id、name）。\n", "hints": ["兩張表都要寫，而且要確保兩邊最終都會寫成功。", "BEGIN BATCH … APPLY BATCH 可以把多句包在一起。"], "answer": "BEGIN BATCH\n  INSERT INTO customers (customer_id, name, email, signup_date, vip_level)\n  VALUES (99999, '測試會員', 'test99999@example.com', '2026-10-06', 'normal');\n  INSERT INTO customers_by_email (email, customer_id, name)\n  VALUES ('test99999@example.com', 99999, '測試會員');\nAPPLY BATCH;\n", "explanation": "logged BATCH（預設）先把整批寫進 batchlog，保證「全部最終都會套用」，用來維持反正規化的多張表一致。\n它不是交易：沒有隔離性，別人可能讀到只寫了一半的狀態，也不能 ROLLBACK。\nBATCH 也不是加速用的：跨很多分區的 batch 反而會拖慢協調節點。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "BEGIN BATCH\n  INSERT INTO customers (customer_id, name, email, signup_date, vip_level)\n  VALUES (99999, '測試會員', 'test99999@example.com', '2026-10-06', 'normal');\nINSERT INTO customers_by_email (email, customer_id, name)\n  VALUES ('test99999@example.com', 99999, '測試會員');\nAPPLY BATCH", "text": "完成（沒有回傳資料）"}], "checks": [{"cmd": "SELECT customer_id, name, email, signup_date, vip_level, city FROM customers WHERE customer_id = 99999", "table": {"columns": ["customer_id", "name", "email", "signup_date", "vip_level", "city"], "rows": [[99999, "測試會員", "test99999@example.com", "2026-10-06", "normal", null]], "total": 1}}, {"cmd": "SELECT email, customer_id, name FROM customers_by_email WHERE email = 'test99999@example.com'", "table": {"columns": ["email", "customer_id", "name"], "rows": [["test99999@example.com", 99999, "測試會員"]], "total": 1}}]}, {"id": "update-set", "chapter": "寫入", "title": "改庫存、加標籤", "prompt": "商品 540 賣完了：庫存（stock）改成 0，tags 加上 '缺貨'（保留原本的標籤）。\n", "hints": ["set 可以用 tags = tags + {'…'} 加元素。"], "answer": "UPDATE products SET stock = 0, tags = tags + {'缺貨'} WHERE product_id = 540;\n", "explanation": "tags = tags + {…} 只寫入新的元素，不需要先讀出整個 set。如果寫成 tags = {'缺貨'} 會把整個 set 換掉，\n原本的「特價」就不見了，而且整個換掉還會產生一個墓碑（tombstone）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UPDATE products SET stock = 0, tags = tags + {'缺貨'} WHERE product_id = 540", "text": "完成（沒有回傳資料）"}], "checks": [{"cmd": "SELECT product_id, stock, tags FROM products WHERE product_id = 540", "table": {"columns": ["product_id", "stock", "tags"], "rows": [[540, 0, "['特價', '缺貨']"]], "total": 1}}]}, {"id": "map-update", "chapter": "寫入", "title": "改 map 的一個 key", "prompt": "商品 540 的規格：把 specs 的 color 改成 '黑'，並刪掉 '5g' 這個 key，其他規格不變。\n", "hints": ["map 可以 SET specs['key'] = 值。", "刪除一個 key：DELETE specs['key'] FROM …，或 SET specs = specs - {'key'}。"], "answer": "UPDATE products SET specs['color'] = '黑' WHERE product_id = 540;\nDELETE specs['5g'] FROM products WHERE product_id = 540;\n", "explanation": "非 frozen 的 map 每個 key 都是獨立的 cell，可以單獨更新或刪除，不必讀出整個 map 再寫回去。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UPDATE products SET specs['color'] = '黑' WHERE product_id = 540", "text": "完成（沒有回傳資料）"}, {"cmd": "DELETE specs['5g'] FROM products WHERE product_id = 540", "text": "完成（沒有回傳資料）"}], "checks": [{"cmd": "SELECT specs FROM products WHERE product_id = 540", "table": {"columns": ["specs"], "rows": [["{color: '黑', screen_inch: '6.3', storage_gb: '128', warranty.type: '原廠', warranty.years: '2'}"]], "total": 1}}]}, {"id": "counter", "chapter": "寫入", "title": "計數器", "prompt": "商品 540 又被一張訂單買走 2 件：product_sales 的 units 加 2、orders 加 1。\n", "hints": ["計數器只能用 UPDATE … SET 欄位 = 欄位 + n。"], "answer": "UPDATE product_sales SET units = units + 2, orders = orders + 1 WHERE product_id = 540;\n", "explanation": "counter 是分散式的加減，不用先讀再寫。但它不是冪等的：寫入逾時後重試，可能會加兩次。\n所以計數器適合統計（瀏覽數、銷售量），不適合需要精確的金額或庫存。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UPDATE product_sales SET units = units + 2, orders = orders + 1 WHERE product_id = 540", "text": "完成（沒有回傳資料）"}], "checks": [{"cmd": "SELECT product_id, units, orders FROM product_sales WHERE product_id = 540", "table": {"columns": ["product_id", "units", "orders"], "rows": [[540, 217, 141]], "total": 1}}]}, {"id": "lwt-insert", "chapter": "寫入", "title": "email 不能重複註冊", "prompt": "有人想用 email 'user04242@example.com' 註冊新會員（customer_id 99999、name '冒用者'）。\n寫進 customers_by_email，但 email 已經存在時不能覆蓋原本的資料。\n", "hints": ["Cassandra 的 INSERT 預設會直接覆蓋（upsert），不會報主鍵重複。", "INSERT … IF NOT EXISTS 是輕量交易（LWT）。"], "answer": "INSERT INTO customers_by_email (email, customer_id, name)\nVALUES ('user04242@example.com', 99999, '冒用者')\nIF NOT EXISTS;\n", "explanation": "IF NOT EXISTS 會用 Paxos 先確認這個主鍵還不存在，才寫入；回傳的 [applied] 告訴你有沒有寫成功，\n沒寫成功時還會附上目前的值。代價是多好幾次節點間的來回（大約是一般寫入的 4 倍延遲），只用在真的需要「先檢查再寫」的地方。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "INSERT INTO customers_by_email (email, customer_id, name)\nVALUES ('user04242@example.com', 99999, '冒用者')\nIF NOT EXISTS", "table": {"columns": ["[applied]", "email", "customer_id", "name"], "rows": [[false, "user04242@example.com", 4242, "蘇建恩"]], "total": 1}}], "checks": [{"cmd": "SELECT email, customer_id, name FROM customers_by_email WHERE email = 'user04242@example.com'", "table": {"columns": ["email", "customer_id", "name"], "rows": [["user04242@example.com", 4242, "蘇建恩"]], "total": 1}}]}, {"id": "lwt-update", "chapter": "寫入", "title": "樂觀鎖", "prompt": "你打算把商品 540 的價格改成 27999，但只有在價格「還是 30000」的時候才改\n（你之前讀到的是 30000，可能已經被別人改掉了）。\n", "hints": ["UPDATE … IF 欄位 = 值，條件不成立時不會寫入。"], "answer": "UPDATE products SET price = 27999 WHERE product_id = 540 IF price = 30000;\n", "explanation": "目前的價格是 29949，條件不成立，所以 [applied] = false，價格不變，回傳的 price 欄位就是目前的值。\n這就是 compare-and-set（樂觀鎖）：不用鎖住資料，靠條件寫入偵測別人有沒有先改過。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UPDATE products SET price = 27999 WHERE product_id = 540 IF price = 30000", "table": {"columns": ["[applied]", "price"], "rows": [[false, 29949]], "total": 1}}], "checks": [{"cmd": "SELECT product_id, price FROM products WHERE product_id = 540", "table": {"columns": ["product_id", "price"], "rows": [[540, 29949]], "total": 1}}]}, {"id": "ttl-update", "chapter": "寫入", "title": "會自動消失的欄位", "prompt": "會員 4242 參加活動，vip_level 暫時升級成 'gold'，24 小時（86400 秒）後自動失效。\n", "hints": ["USING TTL 秒數，寫在 UPDATE 表名之後。"], "answer": "UPDATE customers USING TTL 86400 SET vip_level = 'gold' WHERE customer_id = 4242;\n", "explanation": "TTL 是設在「這次寫入的欄位」上，不是整列：時間到了只有 vip_level 會消失（變成墓碑），name、city 都還在。\n要整列一起過期，就要用 INSERT … USING TTL 把整列重新寫一次，或在建表時設 default_time_to_live。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UPDATE customers USING TTL 86400 SET vip_level = 'gold' WHERE customer_id = 4242", "text": "完成（沒有回傳資料）"}], "checks": [{"cmd": "SELECT customer_id, vip_level, (TTL(vip_level) + 60) / 3600 AS hours_left, city FROM customers WHERE customer_id = 4242", "table": {"columns": ["customer_id", "vip_level", "hours_left", "city"], "rows": [[4242, "gold", 24, "台北市"]], "total": 1}}]}, {"id": "range-delete", "chapter": "寫入", "title": "刪掉一段時間的資料", "prompt": "會員 1 要求刪除 2023 年以前（台灣時間 2023-01-01 之前）的訂單紀錄。\n從 orders_by_customer 刪掉這些資料列，用一句 CQL 完成。\n", "hints": ["DELETE 的 WHERE 可以在叢集鍵上用範圍。"], "answer": "DELETE FROM orders_by_customer\nWHERE customer_id = 1 AND order_time < '2023-01-01 00:00:00+0800';\n", "explanation": "範圍刪除只會寫入「一個」範圍墓碑（range tombstone），不管範圍裡有幾列。\n如果先查出 39 筆再一筆一筆刪，會產生 39 個墓碑，之後讀這個分區時都要跳過它們（實驗室有示範墓碑的影響）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "DELETE FROM orders_by_customer\nWHERE customer_id = 1 AND order_time < '2023-01-01 00:00:00+0800'", "text": "完成（沒有回傳資料）"}], "checks": [{"cmd": "SELECT COUNT(*) FROM orders_by_customer WHERE customer_id = 1", "table": {"columns": ["count"], "rows": [[113]], "total": 1}}, {"cmd": "SELECT order_time, order_id FROM orders_by_customer WHERE customer_id = 1 ORDER BY order_time ASC LIMIT 1", "table": {"columns": ["order_time", "order_id"], "rows": [["2023-01-02T04:21:15.006Z", 4358]], "total": 1}}]}, {"id": "delete-column", "chapter": "寫入", "title": "刪除一個欄位", "prompt": "會員 4242 要求刪除生日資料：只刪 birth_date，其他欄位保留。\n", "hints": ["DELETE 欄位名稱 FROM 表 WHERE …"], "answer": "DELETE birth_date FROM customers WHERE customer_id = 4242;\n", "explanation": "在 Cassandra 裡，DELETE 欄位和 UPDATE … SET birth_date = null 的效果一樣：都是寫入一個墓碑。\n資料不會馬上從硬碟消失，要等 gc_grace_seconds（預設 10 天）過後、compaction 時才真正清掉。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "DELETE birth_date FROM customers WHERE customer_id = 4242", "text": "完成（沒有回傳資料）"}], "checks": [{"cmd": "SELECT customer_id, name, birth_date, city FROM customers WHERE customer_id = 4242", "table": {"columns": ["customer_id", "name", "birth_date", "city"], "rows": [[4242, "蘇建恩", null, "台北市"]], "total": 1}}]}], "traps": [{"id": "insert-is-upsert", "title": "INSERT 一個已經存在的主鍵", "question": "customers_by_email 已經有 user04242@example.com 這一列（customer_id 4242）。再 INSERT 一次同樣的 email，會發生什麼事？", "options": ["報錯：主鍵重複", "成功，原本那一列被覆蓋成 99999", "成功，同一個 email 變成兩列"], "answer": 1, "explanation": "Cassandra 寫入前不會先讀，所以不知道這個主鍵「已經存在」。INSERT 和 UPDATE 都是 upsert：寫入一份新版本，讀取時時間戳記新的勝出。\n要「不存在才寫入」得用 IF NOT EXISTS（輕量交易），代價是好幾次節點間的來回。\n面試常問：為什麼 Cassandra 寫入這麼快？其中一個原因就是「寫入前不讀」。\n", "setup": null, "scripts": [{"label": "INSERT 同一個主鍵", "code": "INSERT INTO customers_by_email (email, customer_id, name)\nVALUES ('user04242@example.com', 99999, '冒用者');\nSELECT * FROM customers_by_email WHERE email = 'user04242@example.com';\n"}], "results": [[{"cmd": "INSERT INTO customers_by_email (email, customer_id, name)\nVALUES ('user04242@example.com', 99999, '冒用者')", "text": "完成（沒有回傳資料）"}, {"cmd": "SELECT * FROM customers_by_email WHERE email = 'user04242@example.com'", "table": {"columns": ["email", "customer_id", "name"], "rows": [["user04242@example.com", 99999, "冒用者"]], "total": 1}}]]}, {"id": "update-creates-row", "title": "UPDATE 一個不存在的商品", "question": "products 裡沒有商品 99999。執行 UPDATE products SET stock = 5 WHERE product_id = 99999 之後，查得到這件商品嗎？", "options": ["查得到：多了一列，只有 stock 有值", "查不到：UPDATE 找不到資料列，影響 0 列", "報錯：資料列不存在"], "answer": 0, "explanation": "UPDATE 也是 upsert，不會先檢查資料列存不存在，所以會「長出」一列只有 stock 的商品。\n要避免可以寫 UPDATE … IF EXISTS（輕量交易）。\n小差異：INSERT 會寫入一個「列標記」（row marker），UPDATE 不會；所以用 UPDATE 建出來的列，如果把 stock 刪掉，整列就消失了。\n", "setup": null, "scripts": [{"label": "UPDATE 不存在的主鍵", "code": "UPDATE products SET stock = 5 WHERE product_id = 99999;\nSELECT product_id, name, price, stock FROM products WHERE product_id = 99999;\n"}], "results": [[{"cmd": "UPDATE products SET stock = 5 WHERE product_id = 99999", "text": "完成（沒有回傳資料）"}, {"cmd": "SELECT product_id, name, price, stock FROM products WHERE product_id = 99999", "table": {"columns": ["product_id", "name", "price", "stock"], "rows": [[99999, null, null, 5]], "total": 1}}]]}, {"id": "filter-needs-key", "title": "用非主鍵欄位查詢", "question": "orders 表的主鍵是 order_id。直接查 WHERE customer_id = 4242（不加 ALLOW FILTERING），結果是？", "options": ["兩段都回傳 6 筆，只是第一段比較慢", "第一段回傳 0 筆", "第一段被拒絕，要加 ALLOW FILTERING"], "answer": 2, "explanation": "沒有分區鍵，Cassandra 不知道資料在哪個節點，只能問遍所有節點、掃過整張表。它不會默默幫你掃，而是直接拒絕。\n加上 ALLOW FILTERING 就會執行（實驗室有量給你看：讀了 8 萬列只為了拿 6 列）。\n正確的解法是建一張以 customer_id 為分區鍵的表（orders_by_customer），或在小量資料上用 SAI 索引。\n", "setup": null, "scripts": [{"label": "orders：customer_id 不是主鍵", "code": "SELECT order_id, total FROM orders WHERE customer_id = 4242;\n"}, {"label": "orders_by_customer：customer_id 是分區鍵", "code": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 4242;\n"}], "results": [[{"cmd": "SELECT order_id, total FROM orders WHERE customer_id = 4242", "text": "InvalidQueryException：Cannot execute this query as it might involve data filtering and thus may have unpredictable performance. If you want to execute this query despite the performance unpredictability, use ALLOW FILTERING", "error": true}], [{"cmd": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 4242", "table": {"columns": ["order_id", "total"], "rows": [[59901, 3098], [42762, 7517], [39226, 36391], [16901, 4596], [15943, 1647], [6116, 4784]], "total": 6}}]]}, {"id": "order-by-non-clustering", "title": "依金額排序", "question": "想看會員 4242 的訂單依金額由高到低：SELECT … FROM orders_by_customer WHERE customer_id = 4242 ORDER BY total DESC。結果是？", "options": ["報錯：ORDER BY 只能用叢集鍵", "依金額由高到低排好", "成功，但順序沒變（ORDER BY 被忽略）"], "answer": 0, "explanation": "Cassandra 不在查詢時排序，它只能「依照資料存放的順序」或「完全反過來」讀取。\n分區內的順序由叢集鍵決定，所以 ORDER BY 只能寫叢集鍵。\n需要依金額排序：取回這位會員的訂單後在應用程式排序（一個分區通常不大），或另外建一張叢集鍵是 total 的表。\n", "setup": null, "scripts": [{"label": "ORDER BY 非叢集鍵", "code": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 4242 ORDER BY total DESC;\n"}], "results": [[{"cmd": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 4242 ORDER BY total DESC", "text": "InvalidQueryException：Order by is currently only supported on the clustered columns of the PRIMARY KEY, got total", "error": true}]]}, {"id": "skip-clustering", "title": "跳過前面的叢集鍵", "question": "orders_by_day 的主鍵是 ((order_day), order_time, order_id)。WHERE order_day = '2026-09-01' AND order_id = 77082（沒有限定 order_time），結果是？", "options": ["回傳訂單 77082", "報錯：order_id 前面的 order_time 沒有限定", "回傳 0 筆"], "answer": 1, "explanation": "分區內的資料列依 (order_time, order_id) 排序，就像電話簿依「姓、名」排序：只知道「名」沒辦法翻到正確的位置。\n叢集鍵只能從左邊開始限定；而且前面的欄位用了範圍（>、<）之後，後面的欄位就不能再限定了。\n這跟 SQL 複合索引的「最左前綴」是同一個道理。\n", "setup": null, "scripts": [{"label": "跳過 order_time 直接限定 order_id", "code": "SELECT order_time, order_id FROM orders_by_day\nWHERE order_day = '2026-09-01' AND order_id = 77082;\n"}], "results": [[{"cmd": "SELECT order_time, order_id FROM orders_by_day\nWHERE order_day = '2026-09-01' AND order_id = 77082", "text": "InvalidQueryException：PRIMARY KEY column \"order_id\" cannot be restricted as preceding column \"order_time\" is not restricted", "error": true}]]}, {"id": "count-star", "title": "COUNT(*) 整張表", "question": "SELECT COUNT(*) FROM orders（沒有 WHERE）會怎樣？", "options": ["報錯：需要 ALLOW FILTERING", "立刻回傳 80000（Cassandra 有記錄筆數）", "回傳 80000，但讀過整張表，還附上一個警告"], "answer": 2, "explanation": "Cassandra 沒有記錄「表裡有幾列」，COUNT(*) 只能真的把每一列讀出來數（看耗時：幾百毫秒 vs 幾毫秒）。\n伺服器還會回傳警告「Aggregation query used without partition key」。資料量大時會逾時。\n要知道筆數：用計數器表在寫入時累計、用 nodetool tablestats 看估計值，或用 Spark 之類的工具。\n", "setup": null, "scripts": [{"label": "沒有分區鍵的 COUNT(*)", "code": "SELECT COUNT(*) FROM orders;\n"}, {"label": "單一分區的 COUNT(*)", "code": "SELECT COUNT(*) FROM orders_by_customer WHERE customer_id = 4242;\n"}], "results": [[{"cmd": "SELECT COUNT(*) FROM orders", "table": {"columns": ["count"], "rows": [[80000]], "total": 1}, "warn": ["Aggregation query used without partition key"]}], [{"cmd": "SELECT COUNT(*) FROM orders_by_customer WHERE customer_id = 4242", "table": {"columns": ["count"], "rows": [[6]], "total": 1}}]]}, {"id": "avg-int", "title": "AVG 一個 int 欄位", "question": "會員 4242 的 6 筆訂單總額是 58033，平均是 9672.17。SELECT AVG(total)（total 是 int）會回傳？", "options": ["9672（小數被捨去）", "9672.17", "報錯：AVG 不能用在 int"], "answer": 0, "explanation": "CQL 的 AVG 回傳跟輸入一樣的型別，int 的平均就是 int，小數直接捨去（SQL 的 PostgreSQL 會回傳 numeric）。\n要小數就先 CAST 成 double 或 decimal。SUM(int) 也一樣是 int，金額很大時可能溢位，可以先 CAST 成 bigint / varint。\n", "setup": null, "scripts": [{"label": "AVG(int)", "code": "SELECT AVG(total) FROM orders_by_customer WHERE customer_id = 4242;\n"}, {"label": "先 CAST 成 double", "code": "SELECT AVG(CAST(total AS double)) FROM orders_by_customer WHERE customer_id = 4242;\n"}], "results": [[{"cmd": "SELECT AVG(total) FROM orders_by_customer WHERE customer_id = 4242", "table": {"columns": ["system.avg(total)"], "rows": [[9672]], "total": 1}}], [{"cmd": "SELECT AVG(CAST(total AS double)) FROM orders_by_customer WHERE customer_id = 4242", "table": {"columns": ["system.avg(cast(total as double))"], "rows": [[9672.166666666666]], "total": 1}}]]}, {"id": "older-timestamp", "title": "用比較舊的時間戳記寫入", "question": "先 UPDATE products USING TIMESTAMP 1000 SET stock = 999（時間戳記 1000 微秒，也就是 1970 年），再查 stock，會是多少？目前 stock 是 11。", "options": ["999：最後執行的那一句勝出", "11：時間戳記比較舊，被當成過期的寫入", "報錯：時間戳記不能早於現有資料"], "answer": 1, "explanation": "Cassandra 用「每個欄位的時間戳記」決定誰勝出（last write wins），不是用執行的先後順序。\n這次寫入成功了，但讀取時遇到兩個版本，時間戳記較新的 11 勝出，999 等於被忽略。\n實務上的影響：各台應用程式伺服器的時鐘如果不同步，後寫的資料可能「輸給」先寫的資料。\n", "setup": null, "scripts": [{"label": "用很舊的時間戳記寫入", "code": "UPDATE products USING TIMESTAMP 1000 SET stock = 999 WHERE product_id = 540;\nSELECT stock, WRITETIME(stock) FROM products WHERE product_id = 540;\n"}], "results": [[{"cmd": "UPDATE products USING TIMESTAMP 1000 SET stock = 999 WHERE product_id = 540", "text": "完成（沒有回傳資料）"}, {"cmd": "SELECT stock, WRITETIME(stock) FROM products WHERE product_id = 540", "table": {"columns": ["stock", "writetime(stock)"], "rows": [[11, 1791419465368464]], "total": 1}}]]}, {"id": "ttl-per-cell", "title": "TTL 是設在誰身上？", "question": "UPDATE customers USING TTL 86400 SET city = '台南市' WHERE customer_id = 4242。一天後，這位會員的資料會變成？", "options": ["整列消失", "什麼都沒變，TTL 只對 INSERT 有效", "只有 city 消失，其他欄位都還在"], "answer": 2, "explanation": "TTL 屬於每一個欄位值（cell），只有這次寫入的 city 帶著 86400 秒的 TTL，name 的 TTL 是 null（永不過期）。\n時間到了 city 會變成墓碑，整列還在。要整列一起過期，就要把整列用 INSERT … USING TTL 重新寫一次，\n或是建表時設定 default_time_to_live。\n", "setup": null, "scripts": [{"label": "只對 city 設 TTL", "code": "UPDATE customers USING TTL 86400 SET city = '台南市' WHERE customer_id = 4242;\nSELECT name, TTL(name), city, TTL(city) FROM customers WHERE customer_id = 4242;\n"}], "results": [[{"cmd": "UPDATE customers USING TTL 86400 SET city = '台南市' WHERE customer_id = 4242", "text": "完成（沒有回傳資料）"}, {"cmd": "SELECT name, TTL(name), city, TTL(city) FROM customers WHERE customer_id = 4242", "table": {"columns": ["name", "ttl(name)", "city", "ttl(city)"], "rows": [["蘇建恩", null, "台南市", 86400]], "total": 1}}]]}, {"id": "null-is-tombstone", "title": "寫入 null", "question": "INSERT 一位會員時，city 欄位明確寫成 null。Cassandra 會怎麼處理？（看查詢追蹤的 tombstone cells）", "options": ["寫 null 會存一個墓碑（tombstone）", "兩者一樣：null 就是沒有值，什麼都不存", "報錯：不能寫入 null"], "answer": 0, "explanation": "在 Cassandra 裡，「把欄位設成 null」等於「刪除這個欄位」，會寫入一個墓碑，讀取時要讀到它、再把它跳過。\n看追蹤：寫 null 的那一段是「Read 1 live rows and 1 tombstone cells」，沒寫的那一段是 0。\n用 ORM 或 prepared statement 時特別容易踩到（把所有欄位都綁上去，沒值的就綁 null）。\ndriver 4 可以不綁定那個參數（unset），本專案載入資料時就是這樣做的。\n", "setup": null, "scripts": [{"label": "city 寫 null", "code": "INSERT INTO customers (customer_id, name, city) VALUES (99999, '測試', null);\nTRACING ON;\nSELECT * FROM customers WHERE customer_id = 99999;\n"}, {"label": "city 不寫（不要放進 INSERT）", "code": "INSERT INTO customers (customer_id, name) VALUES (99998, '測試');\nTRACING ON;\nSELECT * FROM customers WHERE customer_id = 99998;\n"}], "results": [[{"cmd": "INSERT INTO customers (customer_id, name, city) VALUES (99999, '測試', null)", "text": "完成（沒有回傳資料）"}, {"cmd": "TRACING ON", "text": "Tracing is enabled."}, {"cmd": "SELECT * FROM customers WHERE customer_id = 99999", "table": {"columns": ["customer_id", "birth_date", "city", "email", "gender", "name", "signup_date", "vip_level"], "rows": [[99999, null, null, null, null, "測試", null, null]], "total": 1}}], [{"cmd": "INSERT INTO customers (customer_id, name) VALUES (99998, '測試')", "text": "完成（沒有回傳資料）"}, {"cmd": "TRACING ON", "text": "Tracing is enabled."}, {"cmd": "SELECT * FROM customers WHERE customer_id = 99998", "table": {"columns": ["customer_id", "birth_date", "city", "email", "gender", "name", "signup_date",
