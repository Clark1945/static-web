 "vip_level"], "rows": [[99998, null, null, null, null, "測試", null, null]], "total": 1}}]]}, {"id": "counter-insert", "title": "INSERT 到計數器表", "question": "product_sales 是計數器表。INSERT INTO product_sales (product_id, units, orders) VALUES (99999, 1, 1) 會怎樣？", "options": ["成功，跟 UPDATE 一樣", "報錯：計數器表只能用 UPDATE", "成功，但 units 和 orders 都是 0"], "answer": 1, "explanation": "counter 只能加減，不能直接設定成某個值，所以不能 INSERT，也不能 UPDATE … SET units = 5。\n不存在的 counter 從 0 開始加。計數器表裡除了主鍵以外只能放 counter 欄位，也不能設 TTL。\n", "setup": null, "scripts": [{"label": "INSERT 計數器", "code": "INSERT INTO product_sales (product_id, units, orders) VALUES (99999, 1, 1);\n"}, {"label": "UPDATE 計數器", "code": "UPDATE product_sales SET units = units + 1, orders = orders + 1 WHERE product_id = 99999;\nSELECT * FROM product_sales WHERE product_id = 99999;\n"}], "results": [[{"cmd": "INSERT INTO product_sales (product_id, units, orders) VALUES (99999, 1, 1)", "text": "InvalidQueryException：INSERT statements are not allowed on counter tables, use UPDATE instead", "error": true}], [{"cmd": "UPDATE product_sales SET units = units + 1, orders = orders + 1 WHERE product_id = 99999", "text": "完成（沒有回傳資料）"}, {"cmd": "SELECT * FROM product_sales WHERE product_id = 99999", "table": {"columns": ["product_id", "orders", "units"], "rows": [[99999, 1, 1]], "total": 1}}]]}], "steps": [{"id": "partition-key", "title": "有分區鍵 vs 沒有分區鍵", "goal": "同樣是「會員 4242 的訂單」，一個用以 customer_id 為分區鍵的表，一個用 ALLOW FILTERING 硬查。", "question": "兩句都回傳 6 列。看追蹤裡的「讀取列數」：B 為了這 6 列讀了幾列？", "takeaway": "A 是「Executing single-partition query」：用分區鍵算出 token，直接讀那一個分區，只讀 6 列。\nB 是「Submitting range requests」+「seq scan」：把整張表 8 萬列讀過一遍，再丟掉不符合的。\n這裡只有一個節點、資料也都在記憶體裡，B 才幾百毫秒；正式環境資料在好幾台機器、好幾百 GB，B 會逾時，還會拖慢整個叢集。\n這就是 Cassandra 的第一條規則：每一個查詢都要有完整的分區鍵。為了做到這點，同一份資料常常要存好幾張表。\n", "setup": [], "queries": [{"label": "A：orders_by_customer（customer_id 是分區鍵）", "code": "SELECT order_id, order_time, total FROM orders_by_customer WHERE customer_id = 4242"}, {"label": "B：orders + ALLOW FILTERING", "code": "SELECT order_id, order_time, total FROM orders WHERE customer_id = 4242 ALLOW FILTERING"}]}, {"id": "clustering-slice", "title": "叢集鍵：只讀需要的那一段", "goal": "會員 1 有 152 筆訂單（最大的分區）。比較讀整個分區、LIMIT、以及用叢集鍵切一段時間。", "question": "B 和 C 各讀了幾列？跟 A 的 152 列比起來呢？", "takeaway": "分區內的資料依叢集鍵排好存在一起，所以 LIMIT 3 只讀開頭 3 列，時間範圍也只讀那一段，不必把整個分區讀出來再過濾。\n設計叢集鍵時要想：「我最常要哪一段？」最新的在前（DESC）、時間範圍、價格範圍，都是叢集鍵的典型用法。\n", "setup": [], "queries": [{"label": "A：整個分區", "code": "SELECT order_id, order_time FROM orders_by_customer WHERE customer_id = 1"}, {"label": "B：最新 3 筆（LIMIT 3）", "code": "SELECT order_id, order_time FROM orders_by_customer WHERE customer_id = 1 LIMIT 3"}, {"label": "C：2025 年（叢集鍵範圍）", "code": "SELECT order_id, order_time FROM orders_by_customer\nWHERE customer_id = 1\n  AND order_time >= '2025-01-01 00:00:00+0800'\n  AND order_time <  '2026-01-01 00:00:00+0800'\n"}]}, {"id": "time-bucket", "title": "時間分桶 vs 時間範圍掃描", "goal": "查「2026-09-01 這一天的訂單」：用一天一個分區的 orders_by_day，或是在 orders_by_day 上不給分區鍵、只用時間範圍。", "question": "A 和 B 讀的列數其實一樣（都是 87 列），那差在哪裡？看「讀取方式」。C 讀了幾個分區？", "takeaway": "A 是「單一分區」：用 order_day 算出 token，直接找到那一天的分區。\nB 是「範圍掃描」：order_time 雖然是叢集鍵，但叢集鍵只在同一個分區裡有排序；沒有分區鍵時，Cassandra 要走過全部 1,728 個分區（每一天一個），\n在每個分區裡切出符合的那一段。讀到的列數一樣，但多了「走過每一個分區」的成本。\n這裡只有一個節點、資料量也小，所以只慢了一兩毫秒；在多節點的叢集裡，範圍掃描要問遍「每一個節點」，資料越多越慢，而且會影響其他查詢。\nC 用 IN 讀 7 個分區，是查一段時間的正確做法（或在應用程式裡平行送出 7 個查詢）。\n分桶的粒度是取捨：分區太大（例如一個月）會變成熱點、讀取變慢；太小（例如一分鐘）則查一段時間要讀很多分區。\n一般建議單一分區不超過 100 MB、10 萬列以內。\n", "setup": [], "queries": [{"label": "A：分區鍵 order_day", "code": "SELECT COUNT(*) FROM orders_by_day WHERE order_day = '2026-09-01'"}, {"label": "B：只用 order_time 範圍（ALLOW FILTERING）", "code": "SELECT COUNT(*) FROM orders_by_day\nWHERE order_time >= '2026-09-01 00:00:00+0800' AND order_time < '2026-09-02 00:00:00+0800'\nALLOW FILTERING\n"}, {"label": "C：一週（IN 7 個分區）", "code": "SELECT COUNT(*) FROM orders_by_day\nWHERE order_day IN ('2026-09-01', '2026-09-02', '2026-09-03', '2026-09-04', '2026-09-05', '2026-09-06', '2026-09-07')\n"}]}, {"id": "sai-index", "title": "SAI 索引：不建新表也能用其他欄位查", "goal": "Cassandra 5.0 的 SAI（Storage-Attached Index）讓 orders 也能用 customer_id 查。先執行一次（會被拒絕），建立索引後再執行一次。", "question": "有了索引，A 讀了幾列？耗時跟 B 比呢？", "takeaway": "SAI 把索引建在每個 SSTable 旁邊，查詢時先在索引裡找到符合的主鍵，再去讀那幾列，不用全表掃描。\n但它還是「每個節點各自的本地索引」：在多節點的叢集裡，協調節點要問遍所有節點（scatter-gather），節點越多越貴。\n所以 SAI 適合：低頻的查詢、搭配分區鍵一起用、或資料量不大的表；高頻的主要查詢還是建一張專用的表（B）。\n舊版的二級索引（2i）與 SASI 都有很多限制，Cassandra 5.0 之後建議用 SAI。\n", "setup": ["CREATE INDEX IF NOT EXISTS orders_customer_idx ON orders (customer_id) USING 'sai'"], "queries": [{"label": "A：orders 用 customer_id 查（沒有 ALLOW FILTERING）", "code": "SELECT order_id, order_time, total FROM orders WHERE customer_id = 4242"}, {"label": "B：orders_by_customer（對照）", "code": "SELECT order_id, order_time, total FROM orders_by_customer WHERE customer_id = 4242"}]}, {"id": "sai-multi", "title": "SAI：集合與多個條件", "goal": "商品表只有 1,500 件，很適合用 SAI。建立 tags 與 price 的索引，查「有熱銷標籤、而且 1,000 元以下」的商品。", "question": "沒有索引時這兩句會怎樣？建了索引之後各回傳幾列？", "takeaway": "SAI 支援集合（CONTAINS / CONTAINS KEY）、範圍（< >），多個 SAI 條件可以用 AND 一起查，Cassandra 會取交集。\n對照：沒有索引時要加 ALLOW FILTERING 才能查，而且是全表掃描。\n面試常見說法：「Cassandra 的查詢彈性很低」在 5.0 之後有改善，但核心原則不變：主要查詢靠表設計，索引是輔助。\n", "setup": ["CREATE INDEX IF NOT EXISTS products_tags_idx ON products (tags) USING 'sai'", "CREATE INDEX IF NOT EXISTS products_price_idx ON products (price) USING 'sai'"], "queries": [{"label": "A：tags CONTAINS（set 的元素）", "code": "SELECT product_id, name, price, tags FROM products WHERE tags CONTAINS '熱銷'"}, {"label": "B：tags + price 範圍（兩個索引一起用）", "code": "SELECT product_id, name, price FROM products WHERE tags CONTAINS '熱銷' AND price < 1000"}]}, {"id": "filter-in-partition", "title": "ALLOW FILTERING 也有不貴的時候", "goal": "同樣是篩選 status = 'returned'，一個限定在會員 4242 的分區裡，一個沒有限定分區（加了 LIMIT 5）。", "question": "A、B、C 各讀了幾列？", "takeaway": "ALLOW FILTERING 的成本 = 為了找到結果要讀過的列數。\nA 只在一個分區裡過濾，讀 6 列；B 沒有分區鍵，但找到 5 筆就停了，讀的列數取決於符合條件的資料有多「密」；C 要掃完整張表。\n所以重點不是「不准寫 ALLOW FILTERING」，而是要知道它會讀多少資料。\n", "setup": [], "queries": [{"label": "A：分區內篩選", "code": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 4242 AND status = 'returned' ALLOW FILTERING"}, {"label": "B：沒有分區鍵，但只要 5 筆", "code": "SELECT order_id, total FROM orders WHERE status = 'returned' LIMIT 5 ALLOW FILTERING"}, {"label": "C：沒有分區鍵，要全部", "code": "SELECT COUNT(*) FROM orders WHERE status = 'returned' ALLOW FILTERING"}]}]}, {"id": "neo4j", "name": "Neo4j", "lang": "cypher", "labName": "PROFILE 實驗", "labNote": "每一句查詢前面加上 PROFILE，比較執行計畫的第一步（NodeByLabelScan 或 IndexSeek）與總 db hits（存取儲存層的次數）。", "hasResults": true, "exercises": [{"id": "find-customer", "chapter": "基本 MATCH", "title": "找一位會員", "prompt": "查會員 4242 的姓名（name）與會員等級（vipLevel）。\n", "hints": ["MATCH (變數:標籤 {屬性: 值}) RETURN 變數.屬性"], "answer": "MATCH (c:Customer {id: 4242})\nRETURN c.name, c.vipLevel\n", "explanation": "MATCH 用「圖樣」描述要找的東西：(c:Customer {id: 4242}) 是一個標籤為 Customer、id 是 4242 的節點。\nCustomer.id 有唯一約束（自帶索引），所以這是一次索引查找（NodeUniqueIndexSeek），不用掃過所有會員。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (c:Customer {id: 4242})\nRETURN c.name, c.vipLevel", "table": {"columns": ["c.name", "c.vipLevel"], "rows": [["蘇建恩", "normal"]], "total": 1}}]}, {"id": "customer-city", "chapter": "基本 MATCH", "title": "沿著關係走一步", "prompt": "會員 4242 住在哪個城市？回傳城市名稱。\n", "hints": ["城市不是會員的屬性，而是 (:Customer)-[:LIVES_IN]->(:City) 這條關係指向的節點。"], "answer": "MATCH (:Customer {id: 4242})-[:LIVES_IN]->(city:City)\nRETURN city.name\n", "explanation": "在圖資料庫裡，「關聯」是存起來的關係，不是查詢時才用外鍵比對出來的。\n從會員節點出發，直接沿著 LIVES_IN 關係走到城市節點（index-free adjacency），成本只跟這個會員有幾條關係有關，跟會員總數無關。\n沒有用到的節點可以不給變數名稱，例如這裡的 (:Customer {id: 4242})。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Customer {id: 4242})-[:LIVES_IN]->(city:City)\nRETURN city.name", "table": {"columns": ["city.name"], "rows": [["台北市"]], "total": 1}}]}, {"id": "customer-orders", "chapter": "基本 MATCH", "title": "會員的訂單", "prompt": "列出會員 4242 的訂單：訂單 id 與總金額（total），新的在前。\n", "hints": ["(:Customer)-[:PLACED]->(:Order)", "排序用 ORDER BY o.orderDate DESC。"], "answer": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order)\nRETURN o.id, o.total\nORDER BY o.orderDate DESC\n", "explanation": "ORDER BY 可以用沒有 RETURN 的屬性排序。orderDate 是含時區的 datetime，比較與排序都依實際的時間點。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order)\nRETURN o.id, o.total\nORDER BY o.orderDate DESC", "table": {"columns": ["o.id", "o.total"], "rows": [[59901, 3098], [42762, 7517], [39226, 36391], [16901, 4596], [15943, 1647], [6116, 4784]], "total": 6}}]}, {"id": "order-items", "chapter": "基本 MATCH", "title": "關係上的屬性", "prompt": "訂單 77621 買了哪些商品？回傳商品名稱與數量（qty）。順序不拘。\n", "hints": ["數量不在商品節點上，而是在 CONTAINS 關係上：-[r:CONTAINS]->"], "answer": "MATCH (:Order {id: 77621})-[r:CONTAINS]->(p:Product)\nRETURN p.name, r.qty\n", "explanation": "關係也可以有屬性。訂單明細的數量、單價、折扣描述的是「這張訂單和這件商品之間」的事，所以放在關係上，\n對應到關聯式資料庫的中間表（order_items）。\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Order {id: 77621})-[r:CONTAINS]->(p:Product)\nRETURN p.name, r.qty", "table": {"columns": ["p.name", "r.qty"], "rows": [["UNIQLO 男裝 P863", 1]], "total": 1}}]}, {"id": "gold-in-taipei", "chapter": "基本 MATCH", "title": "條件組合", "prompt": "住在台北市、會員等級是 gold 的會員有幾位？回傳一個數字。\n", "hints": ["會員的條件寫在節點上，城市寫在另一個節點上，兩個用 LIVES_IN 連起來。"], "answer": "MATCH (c:Customer {vipLevel: 'gold'})-[:LIVES_IN]->(:City {name: '台北市'})\nRETURN count(c)\n", "explanation": "圖樣裡的 {屬性: 值} 等於 WHERE 裡的等號條件；比較複雜的條件（範圍、OR、字串比對）寫在 WHERE。\n等價寫法：MATCH (c:Customer)-[:LIVES_IN]->(city:City) WHERE c.vipLevel = 'gold' AND city.name = '台北市'。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (c:Customer {vipLevel: 'gold'})-[:LIVES_IN]->(:City {name: '台北市'})\nRETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[196]], "total": 1}}]}, {"id": "followers", "chapter": "方向與聚合", "title": "粉絲數（反方向）", "prompt": "有幾位會員追蹤了會員 4242？回傳一個數字。\n", "hints": ["(a)-[:FOLLOWS]->(b) 是 a 追蹤 b。要找追蹤 4242 的人，箭頭要指向 4242。"], "answer": "MATCH (:Customer {id: 4242})<-[:FOLLOWS]-(fan:Customer)\nRETURN count(fan)\n", "explanation": "關係一定有方向，查詢時可以指定 ->、<-，或不寫方向（-），不寫方向就兩邊都算。\n追蹤是有方向的關係：4242 追蹤了 6 個人，但只有 4 個人追蹤他。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Customer {id: 4242})<-[:FOLLOWS]-(fan:Customer)\nRETURN count(fan)", "table": {"columns": ["count(fan)"], "rows": [[4]], "total": 1}}]}, {"id": "top-followed", "chapter": "方向與聚合", "title": "最多粉絲的會員", "prompt": "粉絲最多的 5 位會員：回傳會員 id、姓名、粉絲數，粉絲數由多到少。\n", "hints": ["Cypher 沒有 GROUP BY：RETURN 裡不是聚合函式的欄位，就是分組的依據。"], "answer": "MATCH (c:Customer)<-[:FOLLOWS]-(fan:Customer)\nRETURN c.id, c.name, count(fan) AS followers\nORDER BY followers DESC\nLIMIT 5\n", "explanation": "RETURN c.id, c.name, count(fan) 的分組依據就是 c.id、c.name（隱含的 GROUP BY）。\n會員 1 有 895 位粉絲，是「超級節點」（supernode）：從它出發的走訪要經過非常多關係，這是圖資料庫設計時要注意的地方。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (c:Customer)<-[:FOLLOWS]-(fan:Customer)\nRETURN c.id, c.name, count(fan) AS followers\nORDER BY followers DESC\nLIMIT 5", "table": {"columns": ["c.id", "c.name", "followers"], "rows": [[1, "葉承文", 895], [2, "廖品玲", 248], [3, "楊書君", 138], [4, "高書文", 114], [5, "蔡承翰", 107]], "total": 5}}]}, {"id": "brand-products", "chapter": "方向與聚合", "title": "品牌的商品數", "prompt": "商品數最多的 5 個品牌：回傳品牌名稱與商品數，商品數由多到少，同數量依品牌名稱排序。\n", "hints": ["(:Product)-[:MADE_BY]->(:Brand)"], "answer": "MATCH (b:Brand)<-[:MADE_BY]-(p:Product)\nRETURN b.name, count(p) AS products\nORDER BY products DESC, b.name\nLIMIT 5\n", "explanation": "同數量時加上第二個排序欄位，結果才會固定；只寫 ORDER BY products DESC 時，同數量的順序不保證。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (b:Brand)<-[:MADE_BY]-(p:Product)\nRETURN b.name, count(p) AS products\nORDER BY products DESC, b.name\nLIMIT 5", "table": {"columns": ["b.name", "products"], "rows": [["IKEA", 69], ["Sony", 59], ["宜得利", 54], ["Adidas", 51], ["Decathlon", 51]], "total": 5}}]}, {"id": "city-revenue", "chapter": "方向與聚合", "title": "各城市營收", "prompt": "2026 年（台灣時間）已送達（status = 'delivered'）的訂單，依寄送城市加總 total，\n回傳營收前 3 名的城市名稱與營收。\n", "hints": ["(:Order)-[:SHIPPED_TO]->(:City)", "datetime('2026-01-01T00:00:00+08:00') 可以建立一個時間點來比較。"], "answer": "MATCH (o:Order {status: 'delivered'})-[:SHIPPED_TO]->(city:City)\nWHERE o.orderDate >= datetime('2026-01-01T00:00:00+08:00')\nRETURN city.name, sum(o.total) AS revenue\nORDER BY revenue DESC\nLIMIT 3\n", "explanation": "datetime() 建立含時區的時間點；也可以用 date('2026-01-01') 跟 date(o.orderDate) 比較日期。\n這種「整張表彙總」的報表其實不是圖資料庫的強項（要走過所有訂單），關聯式資料庫一樣做得很好。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (o:Order {status: 'delivered'})-[:SHIPPED_TO]->(city:City)\nWHERE o.orderDate >= datetime('2026-01-01T00:00:00+08:00')\nRETURN city.name, sum(o.total) AS revenue\nORDER BY revenue DESC\nLIMIT 3", "table": {"columns": ["city.name", "revenue"], "rows": [["台北市", 63759988], ["新北市", 34266319], ["台中市", 27197265]], "total": 3}}]}, {"id": "no-orders", "chapter": "方向與聚合", "title": "從沒下過單的會員", "prompt": "有幾位會員從來沒有下過訂單？回傳一個數字。\n", "hints": ["WHERE NOT (c)-[:PLACED]->() 是「不存在這樣的關係」。"], "answer": "MATCH (c:Customer)\nWHERE NOT (c)-[:PLACED]->()\nRETURN count(c)\n", "explanation": "圖樣可以直接當成條件：(c)-[:PLACED]->() 存在就是 true。Cypher 5 也可以寫成 WHERE NOT EXISTS { (c)-[:PLACED]->() }。\n對照 SQL：LEFT JOIN … WHERE o.id IS NULL，或 NOT EXISTS 子查詢。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (c:Customer)\nWHERE NOT (c)-[:PLACED]->()\nRETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[1629]], "total": 1}}]}, {"id": "collect-names", "chapter": "方向與聚合", "title": "收集成清單", "prompt": "會員 4242 追蹤的人，依會員 id 由小到大，把姓名收集成「一個清單」回傳（只有一列、一個欄位）。\n", "hints": ["collect() 把多列收集成一個 list。", "要先排序再收集：MATCH … WITH f ORDER BY f.id RETURN collect(f.name)"], "answer": "MATCH (:Customer {id: 4242})-[:FOLLOWS]->(f:Customer)\nWITH f ORDER BY f.id\nRETURN collect(f.name)\n", "explanation": "WITH 像是查詢中間的 RETURN：把結果交給下一段，可以在這裡排序、過濾、聚合。\ncollect() 收集的順序就是資料流進來的順序，所以要在 WITH 先排好。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Customer {id: 4242})-[:FOLLOWS]->(f:Customer)\nWITH f ORDER BY f.id\nRETURN collect(f.name)", "table": {"columns": ["collect(f.name)"], "rows": [["['邱柏婷', '曾柏樺', '鄭冠廷', '許建萱', '林建廷', '廖宜文']"]], "total": 1}}]}, {"id": "friends-of-friends", "chapter": "路徑與走訪", "title": "朋友的朋友", "prompt": "會員 224 追蹤的人「再追蹤的人」，排除 224 自己、也排除 224 已經追蹤的人，有幾位不同的會員？\n", "hints": ["(me)-[:FOLLOWS]->()-[:FOLLOWS]->(fof)", "同一個人可能被好幾個朋友追蹤，要用 count(DISTINCT fof)。", "有人跟 224 互相追蹤時，224 自己也會出現在結果裡。"], "answer": "MATCH (me:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof:Customer)\nWHERE fof <> me AND NOT (me)-[:FOLLOWS]->(fof)\nRETURN count(DISTINCT fof)\n", "explanation": "這是「你可能認識的人」的基本做法，每一個條件都會改變答案：\n不加 DISTINCT 是 44（同一個人經由兩個朋友到達，算兩次）、加了 DISTINCT 是 42、排除自己是 41、再排除已經追蹤的人是 40。\n在關聯式資料庫要把 follows 表 JOIN 自己兩次；在圖資料庫就是走兩步。步數越多，差別越明顯（實驗室有比較）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (me:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof:Customer)\nWHERE fof <> me AND NOT (me)-[:FOLLOWS]->(fof)\nRETURN count(DISTINCT fof)", "table": {"columns": ["count(DISTINCT fof)"], "rows": [[40]], "total": 1}}]}, {"id": "reach-in-three", "chapter": "路徑與走訪", "title": "三步之內", "prompt": "沿著追蹤的方向，會員 4242 在 1 到 3 步之內可以到達幾位不同的會員（不含 4242 自己）？\n", "hints": ["可變長度關係：-[:FOLLOWS*1..3]->"], "answer": "MATCH (me:Customer {id: 4242})-[:FOLLOWS*1..3]->(x:Customer)\nWHERE x <> me\nRETURN count(DISTINCT x)\n", "explanation": "*1..3 代表 1 到 3 條關係。一定要給上限：沒有上限的 * 在大圖上可能走到幾百萬條路徑。\n比對：同一個人可能有好幾條路徑可以到達，所以要 DISTINCT。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (me:Customer {id: 4242})-[:FOLLOWS*1..3]->(x:Customer)\nWHERE x <> me\nRETURN count(DISTINCT x)", "table": {"columns": ["count(DISTINCT x)"], "rows": [[122]], "total": 1}}]}, {"id": "shortest-path", "chapter": "路徑與走訪", "title": "最短路徑", "prompt": "沿著追蹤的方向，會員 4242 到會員 1 最少要經過幾步？回傳一個數字。\n", "hints": ["shortestPath((a)-[:FOLLOWS*..10]->(b)) 找一條最短路徑；length(p) 是路徑的關係數。"], "answer": "MATCH p = shortestPath((:Customer {id: 4242})-[:FOLLOWS*..10]->(:Customer {id: 1}))\nRETURN length(p)\n", "explanation": "shortestPath 用雙向的廣度優先搜尋，找到就停，不會列舉所有路徑。allShortestPaths 則回傳所有一樣短的路徑。\n這就是「六度分隔」：社群網路裡，大多數人之間只隔幾步。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH p = shortestPath((:Customer {id: 4242})-[:FOLLOWS*..10]->(:Customer {id: 1}))\nRETURN length(p)", "table": {"columns": ["length(p)"], "rows": [[4]], "total": 1}}]}, {"id": "category-tree", "chapter": "路徑與走訪", "title": "整棵分類子樹", "prompt": "「3C電子」底下的所有分類（子分類、子分類的子分類…，不含 3C電子 自己），回傳分類名稱。順序不拘。\n", "hints": ["(:Category)-[:SUBCATEGORY_OF]->(:Category) 是子分類指向上層。", "不知道有幾層時用 *1..（或給一個合理的上限）。"], "answer": "MATCH (c:Category)-[:SUBCATEGORY_OF*1..]->(:Category {name: '3C電子'})\nRETURN c.name\n", "explanation": "對照 PostgreSQL：要用 WITH RECURSIVE 才能查整棵樹。在圖資料庫，可變長度關係就是遞迴。\n分類樹很小（27 個節點），不給上限也沒問題；社群關係這種大圖就一定要給上限。\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "MATCH (c:Category)-[:SUBCATEGORY_OF*1..]->(:Category {name: '3C電子'})\nRETURN c.name", "table": {"columns": ["c.name"], "rows": [["手機"], ["筆電"], ["耳機"], ["無線耳機"], ["有線耳機"], ["手機配件"]], "total": 6}}]}, {"id": "path-nodes", "chapter": "路徑與走訪", "title": "路徑上的節點", "prompt": "商品 540 所在的分類，一路往上到最上層分類的「完整路徑」：\n回傳一個清單，依序是商品所在的分類名稱、上層分類名稱…到最上層。\n", "hints": ["MATCH p = (:Product {id: 540})-[:IN_CATEGORY]->(:Category)-[:SUBCATEGORY_OF*0..]->(top:Category)", "最上層分類沒有再往上的 SUBCATEGORY_OF：WHERE NOT (top)-[:SUBCATEGORY_OF]->()", "nodes(p) 取出路徑上的節點，[n IN 清單 WHERE … | n.name] 是 list comprehension。"], "answer": "MATCH p = (:Product {id: 540})-[:IN_CATEGORY]->(:Category)-[:SUBCATEGORY_OF*0..]->(top:Category)\nWHERE NOT (top)-[:SUBCATEGORY_OF]->()\nRETURN [n IN nodes(p) WHERE n:Category | n.name]\n", "explanation": "*0.. 允許 0 步（商品直接掛在最上層分類時也找得到）。nodes(p)、relationships(p) 取出路徑上的節點與關係；\nlist comprehension [x IN list WHERE 條件 | 運算式] 類似程式語言的 filter + map。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH p = (:Product {id: 540})-[:IN_CATEGORY]->(:Category)-[:SUBCATEGORY_OF*0..]->(top:Category)\nWHERE NOT (top)-[:SUBCATEGORY_OF]->()\nRETURN [n IN nodes(p) WHERE n:Category | n.name]", "table": {"columns": ["[n IN nodes(p) WHERE n:Category | n.name]"], "rows": [["['手機', '3C電子']"]], "total": 1}}]}, {"id": "also-bought", "chapter": "推薦", "title": "買了這件的人也買了", "prompt": "買過商品 540 的會員，還買了哪些其他商品？（同一張訂單一起買的也算）\n回傳商品名稱與「買過的會員數」（同一位會員只算一次），依會員數由多到少、同數量依商品名稱排序，取前 5 名。\n", "hints": ["先找出買過 540 的會員：MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)", "再找這些會員買過的所有商品：MATCH (c)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product)", "★ 為什麼要分成兩個 MATCH？寫成一條長路徑時，同一條關係不會走兩次，兩個 PLACED 就必須是不同的訂單。"], "answer": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)\nMATCH (c)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product)\nWHERE other.id <> 540\nRETURN other.name, count(DISTINCT c) AS buyers\nORDER BY buyers DESC, other.name\nLIMIT 5\n", "explanation": "這就是協同過濾（collaborative filtering）最簡單的版本：商品 → 買過的人 → 這些人買的其他商品。\n★ 在「同一個 MATCH 圖樣」裡，同一條關係不會被走兩次（relationship isomorphism）。\n寫成一條路徑 (:Product)<-[:CONTAINS]-(:Order)<-[:PLACED]-(c)-[:PLACED]->(:Order)-[:CONTAINS]->(other) 時，\n兩個 PLACED 必須是不同的關係，也就是不同的訂單，「同一張訂單一起買」的會員就被漏掉了（雅漾那件會從 16 人變 14 人）。\n分成兩個 MATCH，唯一性只在各自的圖樣裡檢查，就不會漏。在 SQL 要 order_items、orders、orders、order_items、products 五張表 JOIN。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)\nMATCH (c)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product)\nWHERE other.id <> 540\nRETURN other.name, count(DISTINCT c) AS buyers\nORDER BY buyers DESC, other.name\nLIMIT 5", "table": {"columns": ["other.name", "buyers"], "rows": [["雅漾 保養 C693", 16], ["Samsung 手機 I187", 8], ["Sony 手機 D738", 8], ["Adidas 運動鞋 U237", 7], ["Nike 運動鞋 W498", 7]], "total": 5}}]}, {"id": "friends-bought", "chapter": "推薦", "title": "朋友買過、你還沒買過", "prompt": "會員 4242 追蹤的人買過、但 4242 自己沒買過的商品，\n回傳商品 id 與「買過的朋友人數」，依人數由多到少、同人數依商品 id 由小到大，取前 5 名。\n", "hints": ["先找朋友買的商品，再用 WHERE NOT (me)-[:PLACED]->(:Order)-[:CONTAINS]->(p) 排除自己買過的。"], "answer": "MATCH (me:Customer {id: 4242})-[:FOLLOWS]->(f:Customer)-[:PLACED]->(:Order)-[:CONTAINS]->(p:Product)\nWHERE NOT (me)-[:PLACED]->(:Order)-[:CONTAINS]->(p)\nRETURN p.id, count(DISTINCT f) AS friends\nORDER BY friends DESC, p.id\nLIMIT 5\n", "explanation": "社群推薦：結合「關係」（追蹤）與「行為」（購買）兩種資料，正是圖資料庫最擅長的查詢。\nWHERE NOT (圖樣) 對每一件候選商品檢查一次，只沿著 4242 自己的訂單走，所以很快。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (me:Customer {id: 4242})-[:FOLLOWS]->(f:Customer)-[:PLACED]->(:Order)-[:CONTAINS]->(p:Product)\nWHERE NOT (me)-[:PLACED]->(:Order)-[:CONTAINS]->(p)\nRETURN p.id, count(DISTINCT f) AS friends\nORDER BY friends DESC, p.id\nLIMIT 5", "table": {"columns": ["p.id", "friends"], "rows": [[173, 2], [1306, 2], [3, 1], [4, 1], [6, 1]], "total": 5}}]}, {"id": "create-customer", "chapter": "寫入", "title": "建立節點與關係", "prompt": "新增一位會員：id 99999、name '測試會員'、vipLevel 'normal'，\n並讓他住在已經存在的「台北市」（建立 LIVES_IN 關係）。\n", "hints": ["先 MATCH 找到城市，再 CREATE 會員和關係：MATCH (city:City {name: '台北市'}) CREATE (c:Customer {…})-[:LIVES_IN]->(city)"], "answer": "MATCH (city:City {name: '台北市'})\nCREATE (:Customer {id: 99999, name: '測試會員', vipLevel: 'normal'})-[:LIVES_IN]->(city)\n", "explanation": "CREATE (c)-[:LIVES_IN]->(city) 時，city 是前面 MATCH 到的既有節點。\n如果寫成 CREATE (:Customer {…})-[:LIVES_IN]->(:City {name: '台北市'})，會多建一個新的「台北市」節點（這裡有唯一約束，會直接報錯）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MATCH (city:City {name: '台北市'})\nCREATE (:Customer {id: 99999, name: '測試會員', vipLevel: 'normal'})-[:LIVES_IN]->(city)", "text": "建立節點 1、建立關係 1、設定屬性 3、加上標籤 1"}], "checks": [{"cmd": "MATCH (c:Customer {id: 99999})-[:LIVES_IN]->(city:City) RETURN c.name, c.vipLevel, city.name", "table": {"columns": ["c.name", "c.vipLevel", "city.name"], "rows": [["測試會員", "normal", "台北市"]], "total": 1}}, {"cmd": "MATCH (city:City {name: '台北市'}) RETURN count(city)", "table": {"columns": ["count(city)"], "rows": [[1]], "total": 1}}]}, {"id": "merge-follow", "chapter": "寫入", "title": "不重複建立關係（MERGE）", "prompt": "讓會員 4242 追蹤會員 15084 和會員 1。\n4242 其實已經追蹤 15084 了，不能因此多出一條重複的關係。\n", "hints": ["MERGE 會先找，找不到才建立。", "先 MATCH 兩端的節點，再 MERGE 關係：MATCH (a …), (b …) MERGE (a)-[:FOLLOWS]->(b)"], "answer": "MATCH (me:Customer {id: 4242}), (other:Customer)\nWHERE other.id IN [15084, 1]\nMERGE (me)-[:FOLLOWS]->(other)\n", "explanation": "MERGE = 「有就用，沒有就建立」。用 CREATE 會在 4242 和 15084 之間再建一條 FOLLOWS（關係沒有唯一約束），\n之後計算粉絲數就會重複計算。\n★ MERGE 一定要先 MATCH 兩端，只 MERGE 關係；陷阱題會示範直接 MERGE 整個圖樣的後果。\n執行時會看到「cartesian product」的伺服器提示：(me), (other) 兩個沒有連在一起的圖樣會產生所有組合，\n這裡只有 1 × 2 = 2 種，正是我們要的，可以忽略；組合數很大時才要小心（陷阱題有示範）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MATCH (me:Customer {id: 4242}), (other:Customer)\nWHERE other.id IN [15084, 1]\nMERGE (me)-[:FOLLOWS]->(other)", "text": "建立關係 1", "warn": ["This query builds a cartesian product between disconnected patterns.：If a part of a query contains multiple disconnected patterns, this will build a cartesian product between all those parts. This may produce a large amount of data and slow down query processing. While occasionally intended, it may often be possible to reformulate the query that avoids the use of this cross product, perhaps by adding a relationship between the different parts or by using OPTIONAL MATCH (identifier is: (other))"]}], "checks": [{"cmd": "MATCH (:Customer {id: 4242})-[r:FOLLOWS]->(other:Customer) WHERE other.id IN [15084, 1]\nRETURN other.id, count(r) ORDER BY other.id", "table": {"columns": ["other.id", "count(r)"], "rows": [[1, 1], [15084, 1]], "total": 2}}]}, {"id": "set-props", "chapter": "寫入", "title": "修改屬性與清單", "prompt": "商品 540 賣完了：stock 改成 0，tags 清單加上 '缺貨'（保留原本的標籤）。\n", "hints": ["SET p.屬性 = 值；清單可以用 + 串接：p.tags + '缺貨'"], "answer": "MATCH (p:Product {id: 540})\nSET p.stock = 0, p.tags = p.tags + '缺貨'\n", "explanation": "list + 元素會在清單後面加上一個元素。SET p.tags = ['缺貨'] 會把整個清單換掉。\nSET p += {stock: 0} 可以一次更新多個屬性、保留其他屬性；SET p = {…} 則會把所有屬性換掉（小心）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MATCH (p:Product {id: 540})\nSET p.stock = 0, p.tags = p.tags + '缺貨'", "text": "設定屬性 2"}], "checks": [{"cmd": "MATCH (p:Product {id: 540}) RETURN p.stock, p.tags", "table": {"columns": ["p.stock", "p.tags"], "rows": [[0, "['特價', '缺貨']"]], "total": 1}}]}, {"id": "merge-on-create", "chapter": "寫入", "title": "MERGE 的 ON CREATE / ON MATCH", "prompt": "記錄會員登入：對會員 4242 與會員 99999 各執行一次「登入」：\n會員已存在就設定 lastLogin = date('2026-10-07')；不存在就建立會員，name 設成 '新會員'，lastLogin 也設成同一天。\n", "hints": ["MERGE (c:Customer {id: …}) ON CREATE SET … ON MATCH SET …", "兩位會員可以用 UNWIND [4242, 99999] AS id 一次處理。"], "answer": "UNWIND [4242, 99999] AS id\nMERGE (c:Customer {id: id})\nON CREATE SET c.name = '新會員', c.lastLogin = date('2026-10-07')\nON MATCH SET c.lastLogin = date('2026-10-07')\n", "explanation": "ON CREATE SET 只在這次 MERGE 建立新節點時執行，ON MATCH SET 只在找到既有節點時執行，\n所以 4242 的姓名不會被改成「新會員」。UNWIND 把清單展開成多列，常用來批次寫入（載入資料時也是這樣做）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UNWIND [4242, 99999] AS id\nMERGE (c:Customer {id: id})\nON CREATE SET c.name = '新會員', c.lastLogin = date('2026-10-07')\nON MATCH SET c.lastLogin = date('2026-10-07')", "text": "建立節點 1、設定屬性 4、加上標籤 1"}], "checks": [{"cmd": "MATCH (c:Customer) WHERE c.id IN [4242, 99999] RETURN c.id, c.name, c.lastLogin ORDER BY c.id", "table": {"columns": ["c.id", "c.name", "c.lastLogin"], "rows": [[4242, "蘇建恩", "2026-10-07"], [99999, "新會員", "2026-10-07"]], "total": 2}}]}, {"id": "unfollow", "chapter": "寫入", "title": "刪除關係", "prompt": "會員 4242 取消追蹤會員 15084（只刪掉這條關係，兩位會員都要留著）。\n", "hints": ["給關係一個變數，再 DELETE 它：MATCH (…)-[r:FOLLOWS]->(…) DELETE r"], "answer": "MATCH (:Customer {id: 4242})-[r:FOLLOWS]->(:Customer {id: 15084})\nDELETE r\n", "explanation": "DELETE 可以刪節點或關係。刪節點之前必須先刪掉它所有的關係，或用 DETACH DELETE 一起刪（下一題）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MATCH (:Customer {id: 4242})-[r:FOLLOWS]->(:Customer {id: 15084})\nDELETE r", "text": "刪除關係 1"}], "checks": [{"cmd": "MATCH (:Customer {id: 4242})-[:FOLLOWS]->(f:Customer) RETURN f.id ORDER BY f.id", "table": {"columns": ["f.id"], "rows": [[4428], [4477], [5514], [6339], [12218]], "total": 5}}, {"cmd": "MATCH (c:Customer) WHERE c.id IN [4242, 15084] RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[2]], "total": 1}}]}, {"id": "detach-delete", "chapter": "寫入", "title": "刪除節點（DETACH DELETE）", "prompt": "清理資料：刪除所有「從來沒有下過訂單」的會員。\n這些會員可能還有追蹤、被追蹤、住在哪個城市的關係。\n", "hints": ["有關係的節點不能直接 DELETE。", "DETACH DELETE 會先刪掉節點的所有關係，再刪節點。"], "answer": "MATCH (c:Customer)\nWHERE NOT (c)-[:PLACED]->()\nDETACH DELETE c\n", "explanation": "DETACH DELETE 一次刪掉 1,629 位會員和他們的所有關係（追蹤、被追蹤、LIVES_IN）。\n只寫 DELETE c 的話，在交易裡看起來成功了，但那些會員的關係還留著（第三個檢查查詢的 LIVES_IN 數量沒有變少），\ncommit 時 Neo4j 會報錯拒絕，因為不允許「懸空的關係」。展示台一律 ROLLBACK，所以由檢查查詢抓出這個差別。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MATCH (c:Customer)\nWHERE NOT (c)-[:PLACED]->()\nDETACH DELETE c", "text": "刪除節點 1629、刪除關係 13032"}], "checks": [{"cmd": "MATCH (c:Customer) RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[18371]], "total": 1}}, {"cmd": "MATCH (c:Customer) WHERE NOT (c)-[:PLACED]->() RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[0]], "total": 1}}, {"cmd": "MATCH ()-[r:LIVES_IN]->(:City) RETURN count(r)", "table": {"columns": ["count(r)"], "rows": [[17805]], "total": 1}}]}], "traps": [{"id": "merge-whole-pattern", "title": "MERGE 整個圖樣", "question": "A 和 B 兩個節點都已經存在，但它們之間沒有關係。直接 MERGE (a:Person {name: 'A'})-[:KNOWS]->(b:Person {name: 'B'}) 之後，總共有幾個 Person 節點？", "options": ["2 個：MERGE 會用既有的 A 和 B", "4 個：整個圖樣找不到，就把整個圖樣（含兩個節點）都建立一次", "報錯：A 和 B 已經存在"], "answer": 1, "explanation": "MERGE 是「整個圖樣」要嘛全部找到、要嘛全部建立。A 和 B 存在，但 A-[:KNOWS]->B 這個完整圖樣不存在，\n所以 MERGE 把兩個節點和關係全部重新建立，多出一個 A、一個 B。\n正確寫法：先 MATCH（或各自 MERGE）兩端的節點，再 MERGE 關係。如果有唯一約束，A 會直接報錯，反而比較容易發現。\n", "setup": null, "scripts": [{"label": "A：直接 MERGE 整個圖樣", "code": "CREATE (:Person {name: 'A'}), (:Person {name: 'B'});\nMERGE (a:Person {name: 'A'})-[:KNOWS]->(b:Person {name: 'B'});\nMATCH (p:Person) RETURN p.name, count(*) AS nodes ORDER BY p.name\n"}, {"label": "B：先 MATCH 兩端，再 MERGE 關係", "code": "CREATE (:Person {name: 'A'}), (:Person {name: 'B'});\nMATCH (a:Person {name: 'A'}), (b:Person {name: 'B'})\nMERGE (a)-[:KNOWS]->(b);\nMATCH (p:Person) RETURN p.name, count(*) AS nodes ORDER BY p.name\n"}], "results": [[{"cmd": "CREATE (:Person {name: 'A'}), (:Person {name: 'B'})", "text": "建立節點 2、設定屬性 2、加上標籤 2"}, {"cmd": "MERGE (a:Person {name: 'A'})-[:KNOWS]->(b:Person {name: 'B'})", "text": "建立節點 2、建立關係 1、設定屬性 2、加上標籤 2"}, {"cmd": "MATCH (p:Person) RETURN p.name, count(*) AS nodes ORDER BY p.name", "table": {"columns": ["p.name", "nodes"], "rows": [["A", 2], ["B", 2]], "total": 2}}], [{"cmd": "CREATE (:Person {name: 'A'}), (:Person {name: 'B'})", "text": "建立節點 2、設定屬性 2、加上標籤 2"}, {"cmd": "MATCH (a:Person {name: 'A'}), (b:Person {name: 'B'})\nMERGE (a)-[:KNOWS]->(b)", "text": "建立關係 1", "warn": ["This query builds a cartesian product between disconnected patterns.：If a part of a query contains multiple disconnected patterns, this will build a cartesian product between all those parts. This may produce a large amount of data and slow down query processing. While occasionally intended, it may often be possible to reformulate the query that avoids the use of this cross product, perhaps by adding a relationship between the different parts or by using OPTIONAL MATCH (identifier is: (b))"]}, {"cmd": "MATCH (p:Person) RETURN p.name, count(*) AS nodes ORDER BY p.name", "table": {"columns": ["p.name", "nodes"], "rows": [["A", 1], ["B", 1]], "total": 2}}]]}, {"id": "direction", "title": "不寫方向", "question": "會員 4242 追蹤了 6 個人、有 4 位粉絲（沒有互相追蹤的）。MATCH (:Customer {id: 4242})-[:FOLLOWS]-(x) 不寫箭頭，會回傳幾列？", "options": ["10：兩個方向都算", "6：預設是往外的方向", "報錯：關係一定要寫方向"], "answer": 0, "explanation": "關係存的時候一定有方向，但查詢時可以不寫方向，兩個方向的關係都會配對到。\n「追蹤」是有方向的，不寫方向等於把「我追蹤的人」和「追蹤我的人」混在一起；「認識」「朋友」這類對稱的關係，才常用不寫方向的查法。\n", "setup": null, "scripts": [{"label": "A：不寫方向", "code": "MATCH (:Customer {id: 4242})-[:FOLLOWS]-(x) RETURN count(x)\n"}, {"label": "B：只看追蹤的人", "code": "MATCH (:Customer {id: 4242})-[:FOLLOWS]->(x) RETURN count(x)\n"}], "results": [[{"cmd": "MATCH (:Customer {id: 4242})-[:FOLLOWS]-(x) RETURN count(x)", "table": {"columns": ["count(x)"], "rows": [[10]], "total": 1}}], [{"cmd": "MATCH (:Customer {id: 4242})-[:FOLLOWS]->(x) RETURN count(x)", "table": {"columns": ["count(x)"], "rows": [[6]], "total": 1}}]]}, {"id": "null-equals", "title": "用 = null 找沒有生日的會員", "question": "有 1,141 位會員沒有填生日（沒有 birthDate 屬性）。WHERE c.birthDate = null 會找到幾位？", "options": ["1,141", "20,000（全部）", "0"], "answer": 2, "explanation": "跟 SQL 一樣，任何值和 null 比較的結果都是 null（不是 true），所以 = null 永遠找不到東西。要用 IS NULL / IS NOT NULL。\n在 Neo4j 裡，「屬性是 null」就是「沒有這個屬性」：SET c.birthDate = null 等於刪掉這個屬性。\n", "setup": null, "scripts": [{"label": "A：= null", "code": "MATCH (c:Customer) WHERE c.birthDate = null RETURN count(c)\n"}, {"label": "B：IS NULL", "code": "MATCH (c:Customer) WHERE c.birthDate IS NULL RETURN count(c)\n"}], "results": [[{"cmd": "MATCH (c:Customer) WHERE c.birthDate = null RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[0]], "total": 1}}], [{"cmd": "MATCH (c:Customer) WHERE c.birthDate IS NULL RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[1141]], "total": 1}}]]}, {"id": "optional-match-where", "title": "OPTIONAL MATCH 的 WHERE", "question": "會員 1、2、4242 各有幾筆 5 萬元以上的訂單？（4242 沒有）A 把條件寫在 OPTIONAL MATCH 的 WHERE，B 用 MATCH。A 會回傳幾列？", "options": ["3 列：沒有大訂單的會員也會出現，數量是 0", "比 3 列少：沒有大訂單的會員被過濾掉", "報錯：OPTIONAL MATCH 不能有 WHERE"], "answer": 0, "explanation": "OPTIONAL MATCH 的 WHERE 是「配對條件」的一部分，配對不到時那個變數是 null，但會員那一列還在（count(null) = 0），\n就像 SQL 的 LEFT JOIN … ON o.total >= 50000。\n如果把條件寫在後面的 WITH … WHERE o.total >= 50000，就會把 null 那幾列過濾掉，等於變回一般的 MATCH（INNER JOIN）。\n", "setup": null, "scripts": [{"label": "A：OPTIONAL MATCH … WHERE", "code": "MATCH (c:Customer) WHERE c.id IN [1, 2, 4242]\nOPTIONAL MATCH (c)-[:PLACED]->(o:Order) WHERE o.total >= 50000\nRETURN c.id, count(o) AS bigOrders ORDER BY c.id\n"}, {"label": "B：MATCH … WHERE", "code": "MATCH (c:Customer)-[:PLACED]->(o:Order) WHERE c.id IN [1, 2, 4242] AND o.total >= 50000\nRETURN c.id, count(o) AS bigOrders ORDER BY c.id\n"}], "results": [[{"cmd": "MATCH (c:Customer) WHERE c.id IN [1, 2, 4242]\nOPTIONAL MATCH (c)-[:PLACED]->(o:Order) WHERE o.total >= 50000\nRETURN c.id, count(o) AS bigOrders ORDER BY c.id", "table": {"columns": ["c.id", "bigOrders"], "rows": [[1, 14], [2, 5], [4242, 0]], "total": 3}}], [{"cmd": "MATCH (c:Customer)-[:PLACED]->(o:Order) WHERE c.id IN [1, 2, 4242] AND o.total >= 50000\nRETURN c.id, count(o) AS bigOrders ORDER BY c.id", "table": {"columns": ["c.id", "bigOrders"], "rows": [[1, 14], [2, 5]], "total": 2}}]]}, {"id": "cartesian", "title": "用逗號連接兩個沒有關係的圖樣", "question": "gold 會員有 891 位，下架商品有 83 件。MATCH (c:Customer {vipLevel: 'gold'}), (p:Product {isActive: false}) RETURN count(*) 是多少？", "options": ["73,953（891 × 83），而且會有笛卡兒積的警告", "974（891 + 83）", "0：它們之間沒有關係"], "answer": 0, "explanation": "逗號分開、彼此沒有關係連接的圖樣，結果是兩邊的所有組合（笛卡兒積），就像 SQL 的 CROSS JOIN。\n伺服器會回傳提示「This query builds a cartesian product between disconnected patterns」。\n寫查詢時不小心漏了一段關係（例如 (c), (o) 之間忘了寫 -[:PLACED]->）就會發生，資料量大時會跑不完。\n", "setup": null, "scripts": [{"label": "兩個沒有連在一起的圖樣", "code": "MATCH (c:Customer {vipLevel: 'gold'}), (p:Product {isActive: false})\nRETURN count(*)\n"}], "results": [[{"cmd": "MATCH (c:Customer {vipLevel: 'gold'}), (p:Product {isActive: false})\nRETURN count(*)", "table": {"columns": ["count(*)"], "rows": [[73953]], "total": 1}, "warn": ["This query builds a cartesian product between disconnected patterns.：If a part of a query contains multiple disconnected patterns, this will build a cartesian product between all those parts. This may produce a large amount of data and slow down query processing. While occasionally intended, it may often be possible to reformulate the query that avoids the use of this cross product, perhaps by adding a relationship between the different parts or by using OPTIONAL MATCH (identifier is: (p))"]}]]}, {"id": "duplicate-paths", "title": "朋友的朋友要不要 DISTINCT", "question": "會員 224 的「朋友的朋友」：count(fof) 和 count(DISTINCT fof) 的結果一樣嗎？", "options": ["一樣：MATCH 不會回傳重複的節點", "B 比較多", "A 比較多：同一個人可以經由不同的朋友到達，每一條路徑算一列"], "answer": 2, "explanation": "MATCH 回傳的是「每一種配對方式」，也就是每一條路徑。兩個朋友都追蹤同一個人，這個人就會出現兩次（44 vs 42）。\n算「人數」要 DISTINCT；算「有幾條路徑可以到達」（例如推薦的強度）才用不加 DISTINCT 的 count。\n", "setup": null, "scripts": [{"label": "A：count(fof)", "code": "MATCH (:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof) RETURN count(fof)\n"}, {"label": "B：count(DISTINCT fof)", "code": "MATCH (:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof) RETURN count(DISTINCT fof)\n"}], "results": [[{"cmd": "MATCH (:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof) RETURN count(fof)", "table": {"columns": ["count(fof)"], "rows": [[44]], "total": 1}}], [{"cmd": "MATCH (:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof) RETURN count(DISTINCT fof)", "table": {"columns": ["count(DISTINCT fof)"], "rows": [[42]], "total": 1}}]]}, {"id": "fof-includes-me", "title": "朋友的朋友會不會是自己", "question": "會員 6 和會員 10127 互相追蹤。(me {id: 6})-[:FOLLOWS]->()-[:FOLLOWS]->(fof) 的結果裡，會不會出現 6 自己？", "options": ["會：6 → 10127 → 6，兩條關係不同，所以是合法的路徑", "不會：Cypher 不會走回起點"], "answer": 0, "explanation": "Cypher 在一個圖樣裡「同一條關係不會走兩次」（relationship isomorphism），但「同一個節點」可以出現多次。\n6 → 10127 和 10127 → 6 是兩條不同的關係，所以 6 自己也是「朋友的朋友」。\n寫推薦查詢時記得 WHERE fof <> me，以及排除已經追蹤的人。\n", "setup": null, "scripts": [{"label": "A：沒有排除自己", "code": "MATCH (me:Customer {id: 6})-[:FOLLOWS]->()-[:FOLLOWS]->(fof)\nRETURN count(fof) AS total, sum(CASE WHEN fof = me THEN 1 ELSE 0 END) AS includesMe\n"}, {"label": "B：WHERE fof <> me", "code": "MATCH (me:Customer {id: 6})-[:FOLLOWS]->()-[:FOLLOWS]->(fof)\nWHERE fof <> me\nRETURN count(fof) AS total\n"}], "results": [[{"cmd": "MATCH (me:Customer {id: 6})-[:FOLLOWS]->()-[:FOLLOWS]->(fof)\nRETURN count(fof) AS total, sum(CASE WHEN fof = me THEN 1 ELSE 0 END) AS includesMe", "table": {"columns": ["total", "includesMe"], "rows": [[30, 1]], "total": 1}}], [{"cmd": "MATCH (me:Customer {id: 6})-[:FOLLOWS]->()-[:FOLLOWS]->(fof)\nWHERE fof <> me\nRETURN count(fof) AS total", "table": {"columns": ["total"], "rows": [[29]], "total": 1}}]]}, {"id": "delete-with-relationships", "title": "DELETE 一個還有關係的節點", "question": "4242 有訂單、追蹤關係。在交易裡執行 MATCH (c:Customer {id: 4242}) DELETE c，什麼時候會出錯？", "options": ["DELETE 那一句就立刻報錯", "DELETE 看起來成功，關係還留著；要到 commit 時才報錯", "永遠不會報錯，留下沒有起點的關係"], "answer": 1, "explanation": "Neo4j 不允許「懸空的關係」，但這個檢查是在 commit 時才做：交易裡的 DELETE c 看起來成功（nodesDeleted: 1），\n指向訂單的 PLACED 關係也還在，等到 commit 才會報錯 Neo.ClientError.Schema.ConstraintValidationFailed（\nCannot delete node … because it still has relationships），整個交易失敗。展示台一律 ROLLBACK，所以這裡看不到那個錯誤。\nDETACH DELETE 會先刪掉節點的所有關係，再刪節點。注意它不會刪掉另一端的節點：4242 的訂單還在，只是變成沒有人 PLACED 的孤兒。\n", "setup": null, "scripts": [{"label": "A：DELETE（交易裡）", "code": "MATCH (c:Customer {id: 4242}) DELETE c;\nMATCH ()-[r:PLACED]->(:Order {id: 59901}) RETURN count(r) AS placedStillThere\n"}, {"label": "B：DETACH DELETE", "code": "MATCH (c:Customer {id: 4242}) DETACH DELETE c;\nMATCH ()-[r:PLACED]->(:Order {id: 59901}) RETURN count(r) AS placedStillThere;\nMATCH (o:Order {id: 59901}) RETURN count(o) AS orderStillThere\n"}], "results": [[{"cmd": "MATCH (c:Customer {id: 4242}) DELETE c", "text": "刪除節點 1"}, {"cmd": "MATCH ()-[r:PLACED]->(:Order {id: 59901}) RETURN count(r) AS placedStillThere", "table": {"columns": ["placedStillThere"], "rows": [[1]], "total": 1}}], [{"cmd": "MATCH (c:Customer {id: 4242}) DETACH DELETE c", "text": "刪除節點 1、刪除關係 17"}, {"cmd": "MATCH ()-[r:PLACED]->(:Order {id: 59901}) RETURN count(r) AS placedStillThere", "table": {"columns": ["placedStillThere"], "rows": [[0]], "total": 1}}, {"cmd": "MATCH (o:Order {id: 59901}) RETURN count(o) AS orderStillThere", "table": {"columns": ["orderStillThere"], "rows": [[1]], "total": 1}}]]}, {"id": "match-nothing-create", "title": "MATCH 找不到，後面的 CREATE 呢？", "question": "會員 999999 不存在。MATCH (c:Customer {id: 999999}) CREATE (c)-[:PLACED]->(:Order {id: 900001}) 會怎樣？", "options": ["報錯：會員不存在", "建立一筆沒有會員的訂單", "什麼都沒發生，也不會報錯"], "answer": 2, "explanation": "Cypher 是一列一列處理的：MATCH 找到 0 列，後面的 CREATE 就執行 0 次，不會報錯，也沒有任何提示。\n程式裡常見的 bug：用了錯的 id（例如字串 '999'）呼叫「新增訂單」，結果什麼都沒寫入卻回傳成功。\n要確認有寫入，看回傳的資料列或寫入統計（nodesCreated）；或改用 MERGE、OPTIONAL MATCH 加上檢查。\n", "setup": null, "scripts": [{"label": "MATCH 找不到之後 CREATE", "code": "MATCH (c:Customer {id: 999999})\nCREATE (c)-[:PLACED]->(o:Order {id: 900001})\nRETURN o;\nMATCH (o:Order {id: 900001}) RETURN count(o) AS created\n"}], "results": [[{"cmd": "MATCH (c:Customer {id: 999999})\nCREATE (c)-[:PLACED]->(o:Order {id: 900001})\nRETURN o", "table": {"columns": ["o"], "rows": [], "total": 0}}, {"cmd": "MATCH (o:Order {id: 900001}) RETURN count(o) AS created", "table": {"columns": ["created"], "rows": [[0]], "total": 1}}]]}, {"id": "integer-division", "title": "整數相除", "question": "會員 4242 的 6 筆訂單總額是 58,033。sum(o.total) / count(o) 會回傳？", "options": ["9672（整數相除，小數被捨去）", "9672.17", "報錯：型別不同"], "answer": 0, "explanation": "兩個整數相除的結果還是整數（跟 Java 一樣），小數直接捨去。avg() 一律回傳浮點數。\n要小數可以寫 toFloat(sum(o.total)) / count(o)。\n", "setup": null, "scripts": [{"label": "A：sum / count", "code": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order) RETURN sum(o.total) / count(o)\n"}, {"label": "B：avg()", "code": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order) RETURN avg(o.total)\n"}], "results": [[{"cmd": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order) RETURN sum(o.total) / count(o)", "table": {"columns": ["sum(o.total) / count(o)"], "rows": [[9672]], "total": 1}}], [{"cmd": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order) RETURN avg(o.total)", "table": {"columns": ["avg(o.total)"], "rows": [[9672.166666666666]], "total": 1}}]]}, {"id": "type-mismatch", "title": "id 用字串查", "question": "會員的 id 存的是整數。MATCH (c:Customer {id: '4242'})（字串）會找到幾位？", "options": ["0：字串和整數不相等，也不會報錯", "1：Cypher 會自動轉型", "報錯：型別不符"], "answer": 0, "explanation": "Neo4j 沒有 schema 強制屬性型別（社群版也沒有型別約束），比較時不會自動轉型：'4242' 和 4242 不相等，所以找不到，而且不會報錯。\n常見來源：從網址參數或 JSON 拿到的是字串，直接帶進查詢參數。可以用 toInteger($id) 轉換，或在寫入時統一型別。\n", "setup": null, "scripts": [{"label": "A：字串 '4242'", "code": "MATCH (c:Customer {id: '4242'}) RETURN count(c)\n"}, {"label": "B：整數 4242", "code": "MATCH (c:Customer {id: 4242}) RETURN count(c)\n"}], "results": [[{"cmd": "MATCH (c:Customer {id: '4242'}) RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[0]], "total": 1}}], [{"cmd": "MATCH (c:Customer {id: 4242}) RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[1]], "total": 1}}]]}, {"id": "same-order-missing", "title": "一條長路徑漏掉了同一張訂單", "question": "「買了商品 540 的人也買了雅漾 保養 C693」有幾人？A 寫成一條長路徑，B 拆成兩個 MATCH。A 的數字會比較少嗎？", "options": ["一樣：兩種寫法意思相同", "A 比較少：一條路徑裡兩個 PLACED 不能是同一條關係，同一張訂單一起買的人被排除了", "A 比較多：一條路徑會重複計算"], "answer": 1, "explanation": "Cypher 在同一個 MATCH 圖樣裡，同一條關係只會用一次（relationship isomorphism），這是為了避免在圖上繞圈造成無限多的路徑。\n副作用：A 的兩個 -[:PLACED]-> 必須是兩條不同的關係，也就是兩張不同的訂單；\n有人在同一張訂單裡同時買了 540 和雅漾（有 3 張這樣的訂單），在 A 裡就配對不到，所以是 14 人而不是 16 人。\n拆成兩個 MATCH 時，唯一性只在各自的圖樣裡檢查，兩邊可以用到同一條 PLACED。\n", "setup": null, "scripts": [{"label": "A：一條路徑", "code": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product {name: '雅漾 保養 C693'})\nRETURN count(DISTINCT c) AS buyers\n"}, {"label": "B：兩個 MATCH", "code": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)\nMATCH (c)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product {name: '雅漾 保養 C693'})\nRETURN count(DISTINCT c) AS buyers\n"}], "results": [[{"cmd": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product {name: '雅漾 保養 C693'})\nRETURN count(DISTINCT c) AS buyers", "table": {"columns": ["buyers"], "rows": [[14]], "total": 1}}], [{"cmd": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)\nMATCH (c)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product {name: '雅漾 保養 C693'})\nRETURN count(DISTINCT c) AS buyers", "table": {"columns": ["buyers"], "rows": [[16]], "total": 1}}]]}], "steps": [{"id": "label-scan", "title": "沒有索引：NodeByLabelScan", "goal": "用 email 找會員。Customer 只有 id 的唯一約束（附帶索引），email 沒有索引。先執行一次，再建立索引後重跑。", "question": "沒有索引時計畫是什麼？db hits 大約多少？建立索引之後呢？", "takeaway": "沒有索引：NodeByLabelScan 把 20,000 位會員全部讀一遍（20,001 db hits），再用 Filter 一個一個比對 email（再 20,000），總共約 40,000 db hits。\n建立索引後：NodeIndexSeek 直接找到那一位，總共 4 db hits。\ndb hits 是 Neo4j 存取儲存層的次數（讀節點、讀屬性、讀關係），是比較查詢成本最穩定的指標；毫秒數會受快取影響。\n★ 圖資料庫的索引只用來找「起點」，找到起點之後沿著關係走，不需要索引（index-free adjacency）。\n", "setup": ["CREATE INDEX customer_email IF NOT EXISTS FOR (c:Customer) ON (c.email)"], "queries": [{"label": "用 email 找會員", "code": "MATCH (c:Customer) WHERE c.email = 'user04242@example.com' RETURN c.id, c.name"}]}, {"id": "index-defeated", "title": "在屬性上做運算，索引就用不到", "goal": "id 有唯一約束的索引。比較 c.id = 4242 和 c.id + 0 = 4242（結果一樣）。", "question": "三句的結果一樣，計畫一樣嗎？", "takeaway": "A：NodeUniqueIndexSeek，3 db hits。B、C：NodeByLabelScan + Filter，約 40,000 db hits。\n在屬性上做運算（c.id + 0、toString(c.id)），查詢規劃器就不能用索引，只能把每個節點的屬性算出來再比較。\n跟 SQL 的道理一樣：WHERE id + 0 = 4242、WHERE lower(email) = … 都會讓索引失效。\n正確做法是把運算放在「值」那一邊：WHERE c.id = toInteger($id)。\n", "setup": [], "queries": [{"label": "A：c.id = 4242", "code": "MATCH (c:Customer) WHERE c.id = 4242 RETURN c.name"}, {"label": "B：c.id + 0 = 4242", "code": "MATCH (c:Customer) WHERE c.id + 0 = 4242 RETURN c.name"}, {"label": "C：toString(c.id) = '4242'", "code": "MATCH (c:Customer) WHERE toString(c.id) = '4242' RETURN c.name"}]}, {"id": "range-index", "title": "範圍查詢：時間區間", "goal": "2026 年 9 月的訂單有幾筆？先在沒有索引的情況下執行，再替 Order.orderDate 建立 RANGE 索引。", "question": "索引建立前後，計畫的第一步分別是什麼？db hits 差多少？", "takeaway": "沒有索引：NodeByLabelScan 讀過 8 萬筆訂單，再 Filter 比較時間，約 160,000 db hits。\n有了 RANGE 索引：NodeIndexSeekByRange 直接在索引裡切出 9 月那一段，2,919 筆、約 2,900 db hits。\nRANGE 索引（Neo4j 5 的預設）支援等號、範圍（< > >= <=）、STARTS WITH、IS NOT NULL。\n", "setup": ["CREATE INDEX order_date IF NOT EXISTS FOR (o:Order) ON (o.orderDate)"], "queries": [{"label": "2026 年 9 月的訂單", "code": "MATCH (o:Order)\nWHERE o.orderDate >= datetime('2026-09-01T00:00:00+08:00') AND o.orderDate < datetime('2026-10-01T00:00:00+08:00')\nRETURN count(o)\n"}]}, {"id": "text-index", "title": "字串包含：TEXT 索引", "goal": "商品名稱包含「Sony」的商品。RANGE 索引只能用在等號、範圍、STARTS WITH；CONTAINS / ENDS WITH 要用 TEXT 索引。", "question": "建立 TEXT 索引之後，A 和 B 的計畫各是什麼？", "takeaway": "沒有索引：兩句都是 NodeByLabelScan + Filter，約 3,000 db hits。\n建立 TEXT 索引之後：A 變成 NodeIndexContainsScan、B 變成 NodeIndexSeekByRange，都只要 60 db hits。\nRANGE 索引不能用在 CONTAINS / ENDS WITH，要用 TEXT 索引。真正的全文搜尋（分詞、相關性分數）則用 FULLTEXT 索引：\nCREATE FULLTEXT INDEX … 再用 db.index.fulltext.queryNodes() 查詢。\n", "setup": ["CREATE TEXT INDEX product_name_text IF NOT EXISTS FOR (p:Product) ON (p.name)"], "queries": [{"label": "A：CONTAINS 'Sony'", "code": "MATCH (p:Product) WHERE p.name CONTAINS 'Sony' RETURN count(p)"}, {"label": "B：STARTS WITH 'Sony'", "code": "MATCH (p:Product) WHERE p.name STARTS WITH 'Sony' RETURN count(p)"}]}, {"id": "supernode", "title": "從超級節點出發", "goal": "「我的粉絲下過幾筆訂單」：會員 4242 有 4 位粉絲，會員 1 有 895 位。同一句查詢，換一個起點。", "question": "兩句的計畫一樣，db hits 差多少倍？", "takeaway": "兩句的計畫一模一樣：用唯一索引找到起點 → Expand 粉絲 → Expand 訂單。\n差別在資料：4242 有 4 位粉絲，總共 106 db hits；會員 1 有 895 位粉絲，總共約 18,700 db hits，多了 170 多倍。\n圖的走訪成本取決於「走過幾條關係」，跟整個資料庫有多大無關；但遇到超級節點（supernode，例如名人帳號、熱門標籤）時，\n從它出發或經過它的查詢就會很貴。常見對策：加上方向與關係型別的限制、依時間拆分關係（例如 FOLLOWED_2026）、\n或在超級節點上預先算好統計值。\n", "setup": [], "queries": [{"label": "A：從會員 4242 出發", "code": "MATCH (:Customer {id: 4242})<-[:FOLLOWS]-(fan:Customer)-[:PLACED]->(o:Order) RETURN count(o)"}, {"label": "B：從會員 1 出發", "code": "MATCH (:Customer {id: 1})<-[:FOLLOWS]-(fan:Customer)-[:PLACED]->(o:Order) RETURN count(o)"}]}]}, {"id": "timescaledb", "name": "TimescaleDB", "lang": "sql", "labName": "chunk 實驗", "labNote": "每一句查詢都用 EXPLAIN ANALYZE 執行，比較讀了幾個 chunk（page_views 共 27 個，每個 7 天）與執行時間。壓縮、連續聚合的實驗需要互動操作，請到展示台的「實驗室」。", "hasResults": true, "exercises": [{"id": "daily-views", "chapter": "time_bucket 基礎", "title": "每天的瀏覽數（台灣時間）", "prompt": "2026-09-08 到 2026-09-10（台灣時間，三天）每天各有幾筆瀏覽？\n回傳「當天的開始時間」與筆數，依日期排序。\n", "hints": ["time_bucket('1 day', view_time, 'Asia/Taipei') 依台灣時間切成一天一段。", "不加第三個參數時，time_bucket 依 UTC 切，一天會從台灣時間早上 8 點開始。"], "answer": "SELECT time_bucket('1 day', view_time, 'Asia/Taipei') AS day, count(*) AS views\nFROM page_views\nWHERE view_time >= '2026-09-08 00:00+08' AND view_time < '2026-09-11 00:00+08'\nGROUP BY day\nORDER BY day;\n", "explanation": "time_bucket 是 TimescaleDB 最常用的函式：把時間切成固定長度的區間（類似 date_trunc，但可以是任意長度，例如 5 分鐘、15 分鐘）。\n★ timestamptz 預設依 UTC 切；台灣的「一天」要加上時區參數。9/9 是購物節，瀏覽數是平常的 3 倍。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["day", "views"], "rows": [["2026-09-08 00:00:00", 9550], ["2026-09-09 00:00:00", 28650], ["2026-09-10 00:00:00", 9550]], "total": 3}}]}, {"id": "peak-hours", "chapter": "time_bucket 基礎", "title": "一天裡最熱門的時段", "prompt": "2026-09-01（台灣時間）這一天，瀏覽數最多的 3 個小時：\n回傳該小時的開始時間與瀏覽數，瀏覽數由多到少。\n", "hints": ["time_bucket('1 hour', view_time)：一小時一段，整點在 UTC 和台灣時間是一樣的。"], "answer": "SELECT time_bucket('1 hour', view_time) AS hour, count(*) AS views\nFROM page_views\nWHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-09-02 00:00+08'\nGROUP BY hour\nORDER BY views DESC\nLIMIT 3;\n", "explanation": "晚上 8～10 點是電商的流量高峰。一小時、一分鐘這種「不跨日」的區間，UTC 與台灣時間的邊界一樣，不需要時區參數；\n一天、一週、一個月這種會跨日的區間才要。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["hour", "views"], "rows": [["2026-09-01 20:00:00", 900], ["2026-09-01 21:00:00", 860], ["2026-09-01 19:00:00", 820]], "total": 3}}]}, {"id": "monthly-views", "chapter": "time_bucket 基礎", "title": "每個月的瀏覽數", "prompt": "page_views 每個月（台灣時間）各有幾筆？回傳月份開始時間與筆數，依月份排序。\n", "hints": ["time_bucket 也接受 '1 month'（依日曆月份切）。"], "answer": "SELECT time_bucket('1 month', view_time, 'Asia/Taipei') AS month, count(*) AS views\nFROM page_views\nGROUP BY month\nORDER BY month;\n", "explanation": "'1 month' 會依日曆月份切（每段長度不同）；'30 days' 則是固定 30 天，跟月份對不齊（陷阱題有示範）。\n這句要讀過全部 190 萬筆，連續聚合（後面的題目）就是為了讓這種報表不必每次都重算。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["month", "views"], "rows": [["2026-04-01 00:00:00", 309420], ["2026-05-01 00:00:00", 324700], ["2026-06-01 00:00:00", 309420], ["2026-07-01 00:00:00", 318970], ["2026-08-01 00:00:00", 324700], ["2026-09-01 00:00:00", 328520]], "total": 6}}]}, {"id": "device-share", "chapter": "time_bucket 基礎", "title": "各裝置的瀏覽佔比", "prompt": "2026 年 9 月（台灣時間）各裝置（device）的瀏覽數，以及佔當月總瀏覽數的百分比（四捨五入到小數 1 位），\n依瀏覽數由多到少。\n", "hints": ["佔比可以用視窗函數：count(*) * 100.0 / sum(count(*)) OVER ()"], "answer": "SELECT device, count(*) AS views,\n       round(count(*) * 100.0 / sum(count(*)) OVER (), 1) AS pct\nFROM page_views\nWHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-10-01 00:00+08'\nGROUP BY device\nORDER BY views DESC;\n", "explanation": "TimescaleDB 完全是 PostgreSQL：視窗函數、JOIN、CTE 都照常使用。hypertable 對使用者來說就是一張普通的表。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["device", "views", "pct"], "rows": [["mobile", 197237, 60.0], ["desktop", 98701, 30.0], ["tablet", 32582, 9.9]], "total": 3}}]}, {"id": "weekly-orders", "chapter": "time_bucket 基礎", "title": "每週訂單數與營收", "prompt": "2026 年第三季（7/1 ～ 9/30，台灣時間）每週的訂單數與營收（total 加總），依週排序。\n一週從星期一開始。\n", "hints": ["time_bucket('1 week', …) 預設就是從星期一開始。"], "answer": "SELECT time_bucket('1 week', order_time, 'Asia/Taipei') AS week, count(*) AS orders, sum(total) AS revenue\nFROM orders\nWHERE order_time >= '2026-07-01 00:00+08' AND order_time < '2026-10-01 00:00+08'\nGROUP BY week\nORDER BY week;\n", "explanation": "time_bucket 的起點（origin）預設是 2000-01-03（星期一），所以週的區間從星期一開始。\n第一週的開始時間是 6/29：7/1 是星期三，那一週只有 7/1 之後的訂單（被 WHERE 篩掉了前兩天）。\n要從星期日開始可以指定 origin：time_bucket('1 week', order_time, 'Asia/Taipei', origin => '2000-01-02')。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["week", "orders", "revenue"], "rows": [["2026-06-29 00:00:00", 497, 7037900], ["2026-07-06 00:00:00", 660, 10048032], ["2026-07-13 00:00:00", 687, 10374992], ["2026-07-20 00:00:00", 665, 9827545], ["2026-07-27 00:00:00", 647, 10090420], ["2026-08-03 00:00:00", 613, 9751145], ["2026-08-10 00:00:00", 684, 10624697], ["2026-08-17 00:00:00", 734, 10048670], ["2026-08-24 00:00:00", 691, 9484081], ["2026-08-31 00:00:00", 651, 10521553]], "total": 14}}]}, {"id": "last-reading", "chapter": "時間序列分析", "title": "每個感測器的最後一筆讀數", "prompt": "每個感測器在 2026-09-30（台灣時間）這一天的最後一筆溫度。\n回傳 sensor_id 與溫度，依 sensor_id 排序。\n", "hints": ["last(值, 時間)：依時間排序後取最後一筆的值；first() 則是第一筆。"], "answer": "SELECT sensor_id, last(temperature, time) AS temperature\nFROM sensor_readings\nWHERE time >= '2026-09-30 00:00+08' AND time < '2026-10-01 00:00+08'\nGROUP BY sensor_id\nORDER BY sensor_id;\n", "explanation": "first() / last() 是 TimescaleDB 的聚合函式，「每個裝置最新的值」這種查詢一句就寫完。\n純 PostgreSQL 的寫法是 DISTINCT ON (sensor_id) … ORDER BY sensor_id, time DESC，或視窗函數 ROW_NUMBER()。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["sensor_id", "temperature"], "rows": [[1, 4.81], [2, 4.93], [3, 27.06], [4, 27.14], [5, 5.04], [6, 4.91], [7, 26.98], [8, 26.84], [9, 4.67], [10, 4.9]], "total": 12}}]}, {"id": "cold-alarm", "chapter": "時間序列分析", "title": "冷藏室溫度異常", "prompt": "冷藏區（sensors.kind = '冷藏'）的感測器，溫度超過 8°C 的讀數：\n依感測器分組，回傳 sensor_id、倉庫、第一次超標的時間、最後一次超標的時間、超標的筆數、最高溫度。\n", "hints": ["sensor_readings JOIN sensors USING (sensor_id)", "min(time)、max(time)、count(*)、max(temperature)"], "answer": "SELECT r.sensor_id, s.warehouse, min(r.time) AS first_alarm, max(r.time) AS last_alarm,\n       count(*) AS readings, max(r.temperature) AS max_temp\nFROM sensor_readings r\nJOIN sensors s USING (sensor_id)\nWHERE s.kind = '冷藏' AND r.temperature > 8\nGROUP BY r.sensor_id, s.warehouse\nORDER BY r.sensor_id;\n", "explanation": "hypertable 可以跟一般的表 JOIN（感測器的基本資料放在一般表 sensors）。\n9/18 凌晨 2:10～2:30，桃園倉 B 區冷藏溫度一度到 12.5°C，大概是門沒關好。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["sensor_id", "warehouse", "first_alarm", "last_alarm", "readings", "max_temp"], "rows": [[2, "桃園倉", "2026-09-18 02:10:00", "2026-09-18 02:30:00", 21, 12.53]], "total": 1}}]}, {"id": "gapfill", "chapter": "時間序列分析", "title": "補上沒有資料的時段", "prompt": "感測器 7 在 2026-09-10 08:00 ～ 16:00（台灣時間）每小時的平均溫度。\n沒有資料的小時也要列出來（平均溫度是 NULL），依時間排序，共 8 列。\n", "hints": ["一般的 time_bucket 只會列出「有資料」的區間。", "time_bucket_gapfill 會把範圍內每一個區間都列出來；範圍從 WHERE 條件推算。"], "answer": "SELECT time_bucket_gapfill('1 hour', time) AS hour, avg(temperature) AS avg_temp\nFROM sensor_readings\nWHERE sensor_id = 7\n  AND time >= '2026-09-10 08:00+08' AND time < '2026-09-10 16:00+08'\nGROUP BY hour\nORDER BY hour;\n", "explanation": "感測器 7 在 10:00～14:00 離線，一般的 time_bucket 只會回傳 4 列，畫成圖表時中間的空白就「消失」了。\ntime_bucket_gapfill 把空的區間補成 NULL，前端畫圖、或後續計算才不會被誤導。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["hour", "avg_temp"], "rows": [["2026-09-10 08:00:00", 21.637333333333338], ["2026-09-10 09:00:00", 21.26016666666668], ["2026-09-10 10:00:00", null], ["2026-09-10 11:00:00", null], ["2026-09-10 12:00:00", null], ["2026-09-10 13:00:00", null], ["2026-09-10 14:00:00", 22.157000000000004], ["2026-09-10 15:00:00", 22.87932203389831]], "total": 8}}]}, {"id": "locf", "chapter": "時間序列分析", "title": "用前一個值補空缺（LOCF）", "prompt": "同上一題（感測器 7，9/10 08:00 ～ 16:00 每小時平均溫度），\n但沒有資料的小時用「前一個有資料的值」補上。回傳時間與補好的溫度，共 8 列。\n", "hints": ["locf(avg(temperature))：Last Observation Carried Forward。"], "answer": "SELECT time_bucket_gapfill('1 hour', time) AS hour, locf(avg(temperature)) AS avg_temp\nFROM sensor_readings\nWHERE sensor_id = 7\n  AND time >= '2026-09-10 08:00+08' AND time < '2026-09-10 16:00+08'\nGROUP BY hour\nORDER BY hour;\n", "explanation": "locf() 用最後一個觀測值往後補，適合「狀態」類的資料（溫度設定、庫存量、開關狀態）。\n另一個選擇是 interpolate()：用前後兩個值做線性內插，適合連續變化的量。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["hour", "avg_temp"], "rows": [["2026-09-10 08:00:00", 21.637333333333338], ["2026-09-10 09:00:00", 21.26016666666668], ["2026-09-10 10:00:00", 21.26016666666668], ["2026-09-10 11:00:00", 21.26016666666668], ["2026-09-10 12:00:00", 21.26016666666668], ["2026-09-10 13:00:00", 21.26016666666668], ["2026-09-10 14:00:00", 22.157000000000004], ["2026-09-10 15:00:00", 22.87932203389831]], "total": 8}}]}, {"id": "moving-average", "chapter": "時間序列分析", "title": "3 日移動平均", "prompt": "2026-09-01 到 2026-09-14（台灣時間）每天的瀏覽數，以及「含當天在內的前 3 天」平均瀏覽數（四捨五入到整數）。\n回傳日期開始時間、當天瀏覽數、3 日平均，依日期排序。\n", "hints": ["先用 time_bucket 算出每天的數量，再用視窗函數 avg(…) OVER (ORDER BY day ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)。"], "answer": "SELECT day, views,\n       round(avg(views) OVER (ORDER BY day ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)) AS avg_3d\nFROM (\n  SELECT time_bucket('1 day', view_time, 'Asia/Taipei') AS day, count(*) AS views\n  FROM page_views\n  WHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-09-15 00:00+08'\n  GROUP BY day\n) d\nORDER BY day;\n", "explanation": "移動平均可以把單日的尖峰（9/9 購物節）平滑掉，看出趨勢。前兩天因為不滿 3 天，平均的是 1 天、2 天。\n視窗函數加 time_bucket 是時間序列分析最常見的組合。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["day", "views", "avg_3d"], "rows": [["2026-09-01 00:00:00", 9550, 9550], ["2026-09-02 00:00:00", 9550, 9550], ["2026-09-03 00:00:00", 9550, 9550], ["2026-09-04 00:00:00", 9550, 9550], ["2026-09-05 00:00:00", 12415, 10505], ["2026-09-06 00:00:00", 12415, 11460], ["2026-09-07 00:00:00", 9550, 11460], ["2026-09-08 00:00:00", 9550, 10505], ["2026-09-09 00:00:00", 28650, 15917], ["2026-09-10 00:00:00", 9550, 15917]], "total": 14}}]}, {"id": "day-over-day", "chapter": "時間序列分析", "title": "跟前一天比", "prompt": "2026-09-08 到 2026-09-11（台灣時間）每天的瀏覽數，以及跟前一天相比增加多少（第一天是 NULL）。\n回傳日期開始時間、瀏覽數、差額，依日期排序。\n", "hints": ["lag(views) OVER (ORDER BY day)"], "answer": "SELECT day, views, views - lag(views) OVER (ORDER BY day) AS diff\nFROM (\n  SELECT time_bucket('1 day', view_time, 'Asia/Taipei') AS day, count(*) AS views\n  FROM page_views\n  WHERE view_time >= '2026-09-08 00:00+08' AND view_time < '2026-09-12 00:00+08'\n  GROUP BY day\n) d\nORDER BY day;\n", "explanation": "lag() 取前一列的值。注意第一天沒有「前一天」所以是 NULL；如果要跟範圍外的 9/7 比，查詢範圍就要多抓一天再篩掉。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["day", "views", "diff"], "rows": [["2026-09-08 00:00:00", 9550, null], ["2026-09-09 00:00:00", 28650, 19100], ["2026-09-10 00:00:00", 9550, -19100], ["2026-09-11 00:00:00", 9550, 0]], "total": 4}}]}, {"id": "cagg-hourly", "chapter": "連續聚合", "title": "從連續聚合查每小時統計", "prompt": "連續聚合 sensor_hourly 已經算好每個感測器每小時的平均、最低、最高溫度。\n用它查感測器 2 在 2026-09-18 00:00 ～ 06:00（台灣時間）每小時的最高溫度，依時間排序。\n", "hints": ["連續聚合用起來就是一個 view：SELECT hour, max_temp FROM sensor_hourly WHERE …"], "answer": "SELECT hour, max_temp\nFROM sensor_hourly\nWHERE sensor_id = 2 AND hour >= '2026-09-18 00:00+08' AND hour < '2026-09-18 06:00+08'\nORDER BY hour;\n", "explanation": "連續聚合（continuous aggregate）是「會自動增量更新的物化視圖」：原始資料每分鐘一筆，聚合後每小時一筆，\n查詢只要讀 6 列，不必掃 360 筆原始資料。資料量越大、報表越常查，差距越明顯（實驗室有比較）。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["hour", "max_temp"], "rows": [["2026-09-18 00:00:00", 5.04], ["2026-09-18 01:00:00", 4.91], ["2026-09-18 02:00:00", 12.53], ["2026-09-18 03:00:00", 4.69], ["2026-09-18 04:00:00", 4.49], ["2026-09-18 05:00:00", 4.24]], "total": 6}}]}, {"id": "cagg-top-products", "chapter": "連續聚合", "title": "熱門商品（從每日聚合）", "prompt": "用連續聚合 page_views_daily，查 2026-09-01 到 2026-09-22（台灣時間，含）瀏覽次數最多的 5 件商品：\n回傳 product_id 與總瀏覽數，瀏覽數由多到少。\n", "hints": ["page_views_daily 是「每天 × 每件商品」一列，要再 sum(views)。"], "answer": "SELECT product_id, sum(views) AS views\nFROM page_views_daily\nWHERE day >= '2026-09-01 00:00+08' AND day < '2026-09-23 00:00+08'\nGROUP BY product_id\nORDER BY views DESC\nLIMIT 5;\n", "explanation": "從每日聚合再往上彙總（每日 → 每月、每件商品 → 每個分類）很便宜。\n★ 可以 sum 的是 count、sum；平均值不能直接再平均（每天的筆數不同），要存 sum 和 count，最後再相除。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["product_id", "views"], "rows": [[1, 6378], [2, 2676], [3, 1995], [4, 1668], [5, 1516]], "total": 5}}]}, {"id": "chunk-count", "chapter": "hypertable 與 chunk", "title": "有幾個 chunk", "prompt": "page_views 這個 hypertable 被切成幾個 chunk？回傳一個數字。\n", "hints": ["show_chunks('page_views') 列出所有 chunk；或查 timescaledb_information.chunks。"], "answer": "SELECT count(*) FROM show_chunks('page_views');\n", "explanation": "hypertable 在底層是很多張小表（chunk），每個 chunk 存一段時間的資料（這裡是 7 天）。\n查詢時只會讀到時間範圍相關的 chunk（chunk exclusion）；刪除舊資料時直接丟掉整個 chunk（drop_chunks），不必一筆一筆 DELETE。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["count"], "rows": [[27]], "total": 1}}]}, {"id": "chunk-range", "chapter": "hypertable 與 chunk", "title": "某個時間點在哪個 chunk", "prompt": "2026-09-01 12:00（台灣時間）的瀏覽紀錄，存在 page_views 的哪一個 chunk？\n回傳那個 chunk 的時間範圍（range_start、range_end）。\n", "hints": ["timescaledb_information.chunks 有每個 chunk 的 hypertable_name、range_start、range_end。"], "answer": "SELECT range_start, range_end\nFROM timescaledb_information.chunks\nWHERE hypertable_name = 'page_views'\n  AND range_start <= '2026-09-01 12:00+08' AND range_end > '2026-09-01 12:00+08';\n", "explanation": "chunk 的邊界是依「UTC 的固定間隔」對齊的，所以範圍是 8/27 08:00 ～ 9/3 08:00（台灣時間，星期四早上 8 點），\n不是從月初或星期一開始。chunk 的大小建議：最近的資料（正在寫入的 chunk 與它的索引）能放進記憶體的 25% 左右。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["range_start", "range_end"], "rows": [["2026-08-27 08:00:00", "2026-09-03 08:00:00"]], "total": 1}}]}, {"id": "insert-reading", "chapter": "寫入", "title": "寫入一筆新的讀數", "prompt": "感測器 2 在 2026-10-01 00:00（台灣時間）回報：溫度 4.2、濕度 85.0。\n寫入 sensor_readings，並用 RETURNING 回傳 time、sensor_id、temperature、humidity。\n", "hints": ["INSERT INTO sensor_readings (time, sensor_id, temperature, humidity) VALUES (…) RETURNING …"], "answer": "INSERT INTO sensor_readings (time, sensor_id, temperature, humidity)\nVALUES ('2026-10-01 00:00+08', 2, 4.2, 85.0)\nRETURNING time, sensor_id, temperature, humidity;\n", "explanation": "寫入 hypertable 跟寫入一般的表一模一樣。這筆資料的時間超出現有的 chunk 範圍，TimescaleDB 會自動建立新的 chunk\n（在這個交易裡；沙盒最後會 ROLLBACK）。時間序列的寫入大多是「附加在最後面」，正在寫入的 chunk 很小、索引在記憶體裡，所以寫入很快。\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["time", "sensor_id", "temperature", "humidity"], "rows": [["2026-10-01 00:00:00", 2, 4.2, 85.0]], "total": 1}}]}, {"id": "late-data", "chapter": "寫入", "title": "補寫遲到的資料", "prompt": "感測器 7 恢復連線後，補傳了一筆 2026-09-10 11:00（台灣時間）的讀數：溫度 21.5、濕度 61.0。\n寫入之後，查詢感測器 7 在 9/10（台灣時間）一共有幾筆讀數。\n", "hints": ["先 INSERT，再 SELECT count(*) …（沙盒可以一次執行多句）"], "answer": "INSERT INTO sensor_readings (time, sensor_id, temperature, humidity)\nVALUES ('2026-09-10 11:00+08', 7, 21.5, 61.0);\n\nSELECT count(*)\nFROM sensor_readings\nWHERE sensor_id = 7 AND time >= '2026-09-10 00:00+08' AND time < '2026-09-11 00:00+08';\n", "explanation": "遲到的資料（late data）會寫進舊的 chunk。如果那個時段已經被連續聚合物化過，聚合不會自動知道：\n要等下一次 refresh（refresh 會重算「有資料變動的區間」，TimescaleDB 會記錄被修改過的時間範圍）。\n如果舊 chunk 已經壓縮，寫入的成本也比較高。\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["count"], "rows": [[1194]], "total": 1}}]}, {"id": "retention-delete", "chapter": "寫入", "title": "刪除舊資料", "prompt": "最舊的一週資料不要了：刪除 2026-04-08（台灣時間）以前的 page_views，\n並回傳刪掉了幾筆（一列、一個數字）。\n", "hints": ["WITH removed AS (DELETE … RETURNING 1) SELECT count(*) FROM removed"], "answer": "WITH removed AS (\n  DELETE FROM page_views\n  WHERE view_time < '2026-04-08 00:00+08'\n  RETURNING 1\n)\nSELECT count(*) FROM removed;\n", "explanation": "這題要好幾秒：DELETE 要一筆一筆刪、更新索引、寫 WAL，之後還要 VACUUM。實測刪 7 萬筆約 5 秒，\n刪一個月（30 萬筆）就超過展示台的 15 秒上限。\n★ TimescaleDB 的做法是直接丟掉整個 chunk：SELECT drop_chunks('page_views', older_than => '2026-05-01'::timestamptz)，\n實測丟掉 5 個 chunk 只要幾毫秒（就像 DROP TABLE），也不會留下要 VACUUM 的死資料。\n也可以設定自動保留政策：add_retention_policy('page_views', INTERVAL '5 months')。\n注意 drop_chunks 只會丟「整個範圍都早於條件」的 chunk，邊界那個 chunk 會留著。\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["count"], "rows": [[72580]], "total": 1}}]}], "traps": [{"id": "utc-bucket", "title": "time_bucket 的「一天」從幾點開始", "question": "查 9/8 ～ 9/10（台灣時間）三天的每日瀏覽數。A 沒有給時區參數，會回傳幾列？", "options": ["3 列，跟 B 一樣", "4 列：依 UTC 切，每一天從台灣時間早上 8 點開始，頭尾各切出一段", "報錯：timestamptz 一定要給時區"], "answer": 1, "explanation": "timestamptz 的 time_bucket 預設依 UTC 切：台灣時間的「一天」被切成兩段（00:00～08:00 屬於前一個 UTC 日）。\n結果多出一列，而且每一天的數字都不對（9/9 購物節的 3 倍流量被分到兩天）。\n只要區間是「天、週、月」，就一定要加時區參數；資料庫的 timezone 設定不會影響 time_bucket。\n", "setup": null, "scripts": [{"label": "A：time_bucket('1 day', view_time)", "code": "SELECT time_bucket('1 day', view_time) AS day, count(*)\nFROM page_views\nWHERE view_time >= '2026-09-08 00:00+08' AND view_time < '2026-09-11 00:00+08'\nGROUP BY day ORDER BY day;\n"}, {"label": "B：加上 'Asia/Taipei'", "code": "SELECT time_bucket('1 day', view_time, 'Asia/Taipei') AS day, count(*)\nFROM page_views\nWHERE view_time >= '2026-09-08 00:00+08' AND view_time < '2026-09-11 00:00+08'\nGROUP BY day ORDER BY day;\n"}], "results": [[{"table": {"columns": ["day", "count"], "rows": [["2026-09-07 08:00:00", 670], ["2026-09-08 08:00:00", 10890], ["2026-09-09 08:00:00", 27310], ["2026-09-10 08:00:00", 8880]], "total": 4}}], [{"table": {"columns": ["day", "count"], "rows": [["2026-09-08 00:00:00", 9550], ["2026-09-09 00:00:00", 28650], ["2026-09-10 00:00:00", 9550]], "total": 3}}]]}, {"id": "thirty-days", "title": "'30 days' 等於一個月嗎", "question": "time_bucket('30 days', view_time, 'Asia/Taipei') 每段的開始日期是每個月 1 號嗎？", "options": ["不是：從固定的起點每 30 天切一段，開始日期是 3/17、4/16…，而且分成 7 段", "是，30 days 會自動對齊每個月"], "answer": 0, "explanation": "固定長度的區間（'30 days'）從起點（origin，預設 2000-01-03）開始每 30 天切一段，跟日曆月份對不齊，\n頭尾還會各多出半段。要依月份統計就用 '1 month'（time_bucket 支援以月、年為單位的區間）。\n", "setup": null, "scripts": [{"label": "A：'30 days'", "code": "SELECT time_bucket('30 days', view_time, 'Asia/Taipei') AS bucket, count(*)\nFROM page_views GROUP BY bucket ORDER BY bucket;\n"}, {"label": "B：'1 month'", "code": "SELECT time_bucket('1 month', view_time, 'Asia/Taipei') AS bucket, count(*)\nFROM page_views GROUP BY bucket ORDER BY bucket;\n"}], "results": [[{"table": {"columns": ["bucket", "count"], "rows": [["2026-03-17 00:00:00", 154710], ["2026-04-16 00:00:00", 309420], ["2026-05-16 00:00:00", 315150], ["2026-06-15 00:00:00", 309420], ["2026-07-15 00:00:00", 309420], ["2026-08-14 00:00:00", 331385], ["2026-09-13 00:00:00", 186225]], "total": 7}}], [{"table": {"columns": ["bucket", "count"], "rows": [["2026-04-01 00:00:00", 309420], ["2026-05-01 00:00:00", 324700], ["2026-06-01 00:00:00", 309420], ["2026-07-01 00:00:00", 318970], ["2026-08-01 00:00:00", 324700], ["2026-09-01 00:00:00", 328520]], "total": 6}}]]}, {"id": "chunk-exclusion", "title": "在時間欄位上做轉型", "question": "兩句都只要 9/1 那一天的資料。B 在 view_time 上做了 ::date 轉型，B 的執行計畫會讀幾個 chunk？", "options": ["1 個，跟 A 一樣", "2 個（跨了兩個 chunk）", "全部 27 個：轉型之後無法判斷 chunk 的範圍，每個 chunk 都要讀"], "answer": 2, "explanation": "chunk exclusion（只讀相關的 chunk）靠的是「時間欄位本身」的範圍條件。在欄位上做轉型或函式（::date、date_trunc(…)、AT TIME ZONE）\n之後，規劃器就沒辦法用 chunk 的時間範圍排除，只好每個 chunk 都讀一遍。跟一般索引失效的道理一樣。\n★ 一律寫成 time >= 開始 AND time < 結束 的半開區間。\n", "setup": null, "scripts": [{"label": "A：時間範圍", "code": "EXPLAIN (COSTS OFF)\nSELECT count(*) FROM page_views\nWHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-09-02 00:00+08';\n"}, {"label": "B：view_time::date =", "code": "EXPLAIN (COSTS OFF)\nSELECT count(*) FROM page_views\nWHERE view_time::date = '2026-09-01';\n"}], "results": [[{"table": {"columns": ["QUERY PLAN"], "rows": [["Aggregate"], ["  ->  Index Only Scan using _hyper_2_262_chunk_page_views_view_time_idx on _hyper_2_262_chunk"], ["        Index Cond: ((view_time >= '2026-09-01 00:00:00+08'::timestamp with time zone) AND (view_time < '2026-09-02 00:00:00+08'::timestamp with time zone))"]], "total": 3}}], [{"table": {"columns": ["QUERY PLAN"], "rows": [["Finalize Aggregate"], ["  ->  Gather"], ["        Workers Planned: 5"], ["        ->  Parallel Custom Scan (ChunkAppend) on page_views"], ["              Chunks excluded during startup: 0"], ["              ->  Partial Aggregate"], ["                    ->  Parallel Index Only Scan using _hyper_2_263_chunk_page_views_view_time_idx on _hyper_2_263_chunk"], ["                          Filter: ((view_time)::date = '2026-09-01'::date)"], ["              ->  Partial Aggregate"], ["                    ->  Parallel Index Only Scan using _hyper_2_254_chunk_page_views_view_time_idx on _hyper_2_254_chunk"]], "total": 86}}]]}, {"id": "gapfill-range", "title": "time_bucket_gapfill 沒有給範圍", "question": "WHERE 裡沒有時間範圍，time_bucket_gapfill 會怎樣？", "options": ["自動用資料的最早、最晚時間當範圍", "只回傳有資料的時段，跟 time_bucket 一樣", "報錯：要從 WHERE 推算開始與結束，推算不出來就失敗"], "answer": 2, "explanation": "gapfill 要知道「從哪裡補到哪裡」，所以 WHERE 一定要有時間欄位的開始與結束條件（或在函式參數直接給 start、finish）。\n錯誤訊息：missing time_bucket_gapfill argument: could not infer start from WHERE clause。\n", "setup": null, "scripts": [{"label": "沒有時間範圍的 gapfill", "code": "SELECT time_bucket_gapfill('1 hour', time) AS hour, avg(temperature)\nFROM sensor_readings\nWHERE sensor_id = 7\nGROUP BY hour;\n"}], "results": [[{"table": {"columns": ["錯誤"], "rows": [["ERROR: missing time_bucket_gapfill argument: could not infer start from WHERE clause\n  建議：Specify start and finish as arguments or in the WHERE clause."]], "total": 1}}]]}, {"id": "cagg-stale", "title": "連續聚合沒有最新的資料", "question": "page_views 在 9/24 之後還有 7 萬多筆瀏覽。從連續聚合 page_views_daily 查 9/24 之後的瀏覽數，會得到多少？", "options": ["跟 B 一樣：連續聚合會自動包含最新的資料", "0：還沒 refresh 的區間不在連續聚合裡", "報錯"], "answer": 1, "explanation": "page_views_daily 只 refresh 到 9/24。TimescaleDB 2.13 起，新建的連續聚合預設 materialized_only = true：只回傳已經物化的資料。\n實務上會加上 refresh 政策：add_continuous_aggregate_policy('page_views_daily', start_offset => …, end_offset => …, schedule_interval => …)，\ <script>
// 兩份靜態頁共用：SQL 上色、複製按鈕、HTML 跳脫
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const SQL_KEYWORDS = new Set(`
  select from where group by having order limit offset join left right full inner outer cross on using as and or not
  in is null exists distinct union all intersect except case when then else end with recursive insert into values
  update set delete returning conflict do nothing create index unique table drop alter add column primary key
  references foreign check default constraint cascade begin commit rollback over partition window rows range
  between preceding following current row asc desc nulls first last filter lateral explain analyze true false
  interval date timestamp timestamptz int integer bigint numeric text boolean jsonb serial unbound include brin
  gin btree hash concurrently if only like ilike any array for share zone at time cast varchar char smallint
  identity generated always schema role grant usage to owner vacuum`.trim().split(/\s+/));

// CQL：SQL 的關鍵字再加上 Cassandra 特有的
const CQL_KEYWORDS = new Set([...SQL_KEYWORDS, ...`
  keyspace keyspaces allow filtering ttl writetime token clustering frozen counter batch apply logged unlogged
  static list map type contains key per describe consistency tracing materialized view custom timeuuid uuid
  double float decimal varint tinyint blob inet replication quorum serial truncate expand copy`.trim().split(/\s+/)]);

const SQL_TOKEN = /(--[^\n]*)|(\/\*[\s\S]*?\*\/)|('(?:[^']|'')*')|("(?:[^"]|"")*")|(->>|->|#>>|#>|@>|<@|&&|\|\||::|\?\||\?&)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)/g;

function highlightSQL(text, keywords = SQL_KEYWORDS) {
  let out = "", last = 0, m;
  SQL_TOKEN.lastIndex = 0;
  while ((m = SQL_TOKEN.exec(text))) {
    out += esc(text.slice(last, m.index));
    const [tok, cmt1, cmt2, str, ident, op, num, word] = m;
    if (cmt1 || cmt2) out += `<span class="hl-cmt">${esc(tok)}</span>`;
    else if (str) out += `<span class="hl-str">${esc(tok)}</span>`;
    else if (ident) out += esc(tok);
    else if (op) out += `<span class="hl-op">${esc(tok)}</span>`;
    else if (num) out += `<span class="hl-num">${esc(tok)}</span>`;
    else if (word) {
      const isCall = /^\s*\(/.test(text.slice(m.index + tok.length));
      if (keywords.has(word.toLowerCase()) && !(isCall && !/^(in|exists|any|values|over|filter|on|using|as|array|interval)$/i.test(word))) {
        out += `<span class="hl-kw">${esc(tok)}</span>`;
      } else if (isCall) out += `<span class="hl-fn">${esc(tok)}</span>`;
      else out += esc(tok);
    }
    last = m.index + tok.length;
  }
  return out + esc(text.slice(last));
}

/** Redis 指令：每行第一個字是指令（上色），-- 之後是註解。 */
function highlightRedis(text) {
  return text.split("\n").map((line) => {
    const c = line.indexOf("--");
    const body = c >= 0 ? line.slice(0, c) : line;
    const comment = c >= 0 ? `<span class="hl-cmt">${esc(line.slice(c))}</span>` : "";
    const html = esc(body)
      .replace(/^(\s*)([A-Za-z][A-Za-z.]*)/, '$1<span class="hl-kw">$2</span>')
      .replace(/(&quot;[^&]*&quot;|'[^']*')/g, '<span class="hl-str">$1</span>')
      .replace(/(\s)(-?\d+(?:\.\d+)?)(?=\s|$)/g, '$1<span class="hl-num">$2</span>');
    return html + comment;
  }).join("\n");
}

/** mongosh：字串、數字、$運算子、// 註解、db.集合.方法。 */
function highlightMongo(text) {
  const TOKEN = /(\/\/[^\n]*)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|(\$[A-Za-z]+)|(\b(?:db|ISODate|ObjectId|NumberDecimal|true|false|null)\b)|(\b\d+(?:\.\d+)?\b)|(\.[a-zA-Z]+(?=\())/g;
  let out = "", last = 0, m;
  while ((m = TOKEN.exec(text))) {
    out += esc(text.slice(last, m.index));
    const [tok, cmt, str, op, word, num, method] = m;
    const cls = cmt ? "hl-cmt" : str ? "hl-str" : op ? "hl-op" : word ? "hl-kw" : num ? "hl-num" : method ? "hl-fn" : "";
    out += `<span class="${cls}">${esc(tok)}</span>`;
    last = m.index + tok.length;
  }
  return out + esc(text.slice(last));
}

/** Cypher：關鍵字、// 註解、字串、:標籤 / :關係型別、$參數。 */
const CYPHER_KEYWORDS = new Set(`
  match optional where return with order by skip limit create merge set remove delete detach on unwind as and or not
  xor in is null exists count call yield distinct case when then else end asc desc union all profile explain index
  constraint for require unique drop if show indexes constraints transactions true false starts ends contains
  shortestpath allshortestpaths collect`.trim().split(/\s+/));

function highlightCypher(text) {
  const TOKEN = /(\/\/[^\n]*)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|(:[A-Za-z_][A-Za-z0-9_]*)|(\$[A-Za-z_][A-Za-z0-9_]*)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
  let out = "", last = 0, m;
  while ((m = TOKEN.exec(text))) {
    out += esc(text.slice(last, m.index));
    const [tok, cmt, str, label, param, num, word] = m;
    if (cmt) out += `<span class="hl-cmt">${esc(tok)}</span>`;
    else if (str) out += `<span class="hl-str">${esc(tok)}</span>`;
    else if (label) out += `<span class="hl-fn">${esc(tok)}</span>`;
    else if (param) out += `<span class="hl-op">${esc(tok)}</span>`;
    else if (num) out += `<span class="hl-num">${esc(tok)}</span>`;
    else if (CYPHER_KEYWORDS.has(word.toLowerCase())) out += `<span class="hl-kw">${esc(tok)}</span>`;
    else out += esc(tok);
    last = m.index + tok.length;
  }
  return out + esc(text.slice(last));
}

/** 把 root 底下的 pre.code 上色並加上「複製」按鈕。 */
function enhanceCode(root) {
  root.querySelectorAll("pre.code").forEach((pre) => {
    if (pre.dataset.ready) return;
    pre.dataset.ready = "1";
    const code = pre.querySelector("code") ?? pre;
    const raw = code.textContent;
    if (pre.dataset.lang === "redis") code.innerHTML = highlightRedis(raw);
    else if (pre.dataset.lang === "mongo") code.innerHTML = highlightMongo(raw);
    else if (pre.dataset.lang === "cql") code.innerHTML = highlightSQL(raw, CQL_KEYWORDS);
    else if (pre.dataset.lang === "cypher") code.innerHTML = highlightCypher(raw);
    else if (pre.dataset.lang === "sql" || pre.dataset.lang === undefined && !pre.closest(".doc")) code.innerHTML = highlightSQL(raw);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "copy";
    btn.textContent = "複製";
    btn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(raw);
        btn.textContent = "已複製";
      } catch {
        const sel = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(code);
        sel.removeAllRanges();
        sel.addRange(range);
        btn.textContent = "已選取，按 Ctrl+C";
      }
      setTimeout(() => (btn.textContent = "複製"), 1600);
    });
    pre.appendChild(btn);
  });
}

const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* 無法儲存就算了 */ } },
};

// 題庫：上方一個資料庫一個分頁，分頁裡再分「練習題 / 陷阱題 / 實驗」；資料來自頁面裡嵌入的 JSON
(() => {

  const input = document.getElementById("q");
