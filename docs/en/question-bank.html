<title>Question Bank</title>
<link rel="alternate" hreflang="zh-Hant" href="../question-bank.html"><link rel="alternate" hreflang="en" href="../en/question-bank.html"><link rel="alternate" hreflang="ja" href="../ja/question-bank.html">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 兩份靜態頁共用：上方固定標題列 + 內容區；色彩沿用展示台的 PostgreSQL 藍 */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #16202B;
  --muted: #5B6878;
  --line: #D9DFE7;
  --accent: #336791;
  --accent-soft: #E3ECF4;
  --accent-ink: #FFFFFF;
  --code-bg: #F6F8FA;
  --star: #B86E00;
  --ok: #2F7D5B;
  --ok-soft: #DDF1E7;
  --bad: #B3261E;
  --bad-soft: #FBE4E2;
  --warn-soft: #FBF0D9;
  --mark: #FFE58A;
  --hl-kw: #1F5FA8;
  --hl-fn: #8A3FB0;
  --hl-str: #2F7D5B;
  --hl-num: #A85A00;
  --hl-cmt: #7A8694;
  --hl-op: #B3261E;
  --font-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141B; --surface: #161F29; --ink: #E3E9F0; --muted: #94A3B4; --line: #26323F;
    --accent: #6FA3D3; --accent-soft: #1B2C3D; --accent-ink: #0E141B; --code-bg: #111921;
    --star: #E9B14F; --ok: #6CCB9E; --ok-soft: #12301F; --bad: #FF8A80; --bad-soft: #3A1715;
    --warn-soft: #33280F; --mark: #6B5A12;
    --hl-kw: #79B8FF; --hl-fn: #D2A8FF; --hl-str: #7EE2B8; --hl-num: #FFAB70; --hl-cmt: #7D8B99; --hl-op: #FF9E9E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141B; --surface: #161F29; --ink: #E3E9F0; --muted: #94A3B4; --line: #26323F;
  --accent: #6FA3D3; --accent-soft: #1B2C3D; --accent-ink: #0E141B; --code-bg: #111921;
  --star: #E9B14F; --ok: #6CCB9E; --ok-soft: #12301F; --bad: #FF8A80; --bad-soft: #3A1715;
  --warn-soft: #33280F; --mark: #6B5A12;
  --hl-kw: #79B8FF; --hl-fn: #D2A8FF; --hl-str: #7EE2B8; --hl-num: #FFAB70; --hl-cmt: #7D8B99; --hl-op: #FF9E9E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 84px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
h1, h2, h3 { text-wrap: balance; line-height: 1.35; }
code, pre { font-family: var(--font-mono); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
mark { background: var(--mark); color: inherit; border-radius: 2px; }

.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
.brand { font-size: 1.1rem; margin-right: 10px; }
.sub { color: var(--muted); font-size: .82rem; }
.search input {
  width: min(340px, 80vw); font: inherit; font-size: .9rem; padding: 7px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.top-tools { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.lang-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.lang-switch a { padding: 5px 10px; font-size: .8rem; font-weight: 600; color: var(--muted); text-decoration: none; line-height: 1.4; }
.lang-switch a + a { border-left: 1px solid var(--line); }
.lang-switch a:hover { color: var(--ink); background: var(--bg); }
.lang-switch a[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
.lang-switch a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
@media (max-width: 600px) { .top-tools { width: 100%; } .top-tools .search { flex: 1; } .top-tools .search input { width: 100%; } }
:root:lang(ja) { --font-body: "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif; }
:root:lang(en) { --font-body: "Noto Sans TC", system-ui, "Segoe UI", sans-serif; }

/* 程式碼區塊 */
pre.code { position: relative; margin: 10px 0; padding: 12px 14px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; font-size: .82rem; line-height: 1.6; }
pre.code code { white-space: pre; }
.copy {
  position: absolute; top: 6px; right: 6px; font: inherit; font-family: var(--font-body); font-size: .72rem;
  padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  cursor: pointer; opacity: 0; transition: opacity .15s;
}
pre.code:hover .copy, .copy:focus-visible { opacity: 1; }
.copy:focus-visible { outline: 2px solid var(--accent); }
@media (hover: none) { .copy { opacity: 1; } }
.hl-kw { color: var(--hl-kw); font-weight: 600; }
.hl-fn { color: var(--hl-fn); }
.hl-str { color: var(--hl-str); }
.hl-num { color: var(--hl-num); }
.hl-cmt { color: var(--hl-cmt); font-style: italic; }
.hl-op { color: var(--hl-op); font-weight: 600; }

/* 表格 */
.table-wrap { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.table-wrap table { border-collapse: collapse; width: 100%; font-size: .86rem; }
.table-wrap th, .table-wrap td { padding: 7px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.table-wrap th { background: var(--code-bg); font-weight: 600; white-space: nowrap; }
.table-wrap tr:last-child td { border-bottom: 0; }
.table-wrap td.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap code, .doc p code, .doc li code, blockquote code { background: var(--accent-soft); padding: 0 4px; border-radius: 4px; font-size: .85em; }
.star { color: var(--star); font-weight: 700; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* CheatSheet 與題庫共用：大標題 ＋ 每個資料庫一個分頁（顏色是各資料庫的品牌色） */
.title-block { display: grid; gap: 2px; }
.page-title { margin: 0; font-size: 1.9rem; letter-spacing: .01em; line-height: 1.15; }
.db-tabs { max-width: 1240px; margin: 0 auto; padding: 0 20px; display: flex; gap: 6px; overflow-x: auto; }
.db-tabs a {
  --db: var(--accent);
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px 10px; white-space: nowrap;
  color: var(--muted); text-decoration: none; font-weight: 500; border-bottom: 3px solid transparent;
}
.db-tabs a::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--db); opacity: .45; }
.db-tabs a[data-tab="postgresql"] { --db: #336791; }
.db-tabs a[data-tab="redis"] { --db: #D82C20; }
.db-tabs a[data-tab="mongodb"] { --db: #13AA52; }
.db-tabs a[data-tab="cassandra"] { --db: #1287B1; }
.db-tabs a[data-tab="neo4j"] { --db: #018BFF; }
.db-tabs a[data-tab="timescaledb"] { --db: #F5B800; }
.db-tabs a[data-tab="pgvector"] { --db: #5B4FC4; }
.db-tabs a[data-tab="elasticsearch"] { --db: #00BFB3; }
.db-tabs a[data-tab="influxdb"] { --db: #7A65F2; }
.db-tabs a:hover { color: var(--ink); }
.db-tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--db); }
.db-tabs a[aria-current="page"]::before { opacity: 1; }
.db-tabs a.no-hit { opacity: .45; }
.db-tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.db-tabs .n:not(:empty) { font-size: .72rem; font-weight: 600; padding: 0 7px; border-radius: 999px; background: var(--mark); color: var(--ink); }
@media (prefers-color-scheme: dark) {
  .db-tabs a[data-tab="postgresql"] { --db: #6FA3D3; }
  .db-tabs a[data-tab="redis"] { --db: #FF7B6E; }
  .db-tabs a[data-tab="mongodb"] { --db: #4FD18A; }
  .db-tabs a[data-tab="cassandra"] { --db: #5CC3E8; }
  .db-tabs a[data-tab="neo4j"] { --db: #5AA9F5; }
  .db-tabs a[data-tab="timescaledb"] { --db: #F5C842; }
  .db-tabs a[data-tab="pgvector"] { --db: #A89CFF; }
  .db-tabs a[data-tab="elasticsearch"] { --db: #3FD6CB; }
  .db-tabs a[data-tab="influxdb"] { --db: #A898FF; }
}

@media (max-width: 900px) {
  .page-title { font-size: 1.5rem; }
  .db-tabs { padding-inline: 16px; }
}
/* 題庫：上方資料庫分頁（db_tabs.css）→ 題型切換 → 篩選列 → 一題一張卡片；答案、提示預設收起來 */

/* 每個資料庫用自己的主色 */
.bank[data-db="redis"] { --accent: #B4261B; --accent-soft: #FBE7E4; }
.bank[data-db="mongodb"] { --accent: #0F7A3C; --accent-soft: #E1F3E8; }
.bank[data-db="cassandra"] { --accent: #0F6E93; --accent-soft: #E0F0F6; }
.bank[data-db="neo4j"] { --accent: #0A6BC2; --accent-soft: #E1EEFA; }
.bank[data-db="timescaledb"] { --accent: #946B00; --accent-soft: #FBF1D6; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .bank[data-db="redis"] { --accent: #FF7B6E; --accent-soft: #3A1A17; }
  :root:not([data-theme="light"]) .bank[data-db="mongodb"] { --accent: #4FD18A; --accent-soft: #123222; }
  :root:not([data-theme="light"]) .bank[data-db="cassandra"] { --accent: #5CC3E8; --accent-soft: #10303D; }
  :root:not([data-theme="light"]) .bank[data-db="neo4j"] { --accent: #5AA9F5; --accent-soft: #10273D; }
  :root:not([data-theme="light"]) .bank[data-db="timescaledb"] { --accent: #F5C842; --accent-soft: #33290A; }
}
:root[data-theme="dark"] .bank[data-db="redis"] { --accent: #FF7B6E; --accent-soft: #3A1A17; }
:root[data-theme="dark"] .bank[data-db="mongodb"] { --accent: #4FD18A; --accent-soft: #123222; }
:root[data-theme="dark"] .bank[data-db="cassandra"] { --accent: #5CC3E8; --accent-soft: #10303D; }
:root[data-theme="dark"] .bank[data-db="neo4j"] { --accent: #5AA9F5; --accent-soft: #10273D; }
:root[data-theme="dark"] .bank[data-db="timescaledb"] { --accent: #F5C842; --accent-soft: #33290A; }

/* 題型切換（練習題 / 陷阱題 / 實驗） */
.kinds { display: inline-flex; gap: 4px; padding: 4px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); justify-self: start; max-width: 100%; overflow-x: auto; }
.kinds button {
  font: inherit; font-size: .9rem; border: 0; background: none; color: var(--muted); cursor: pointer;
  padding: 6px 14px; border-radius: 7px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: baseline;
}
.kinds button span { font-size: .75rem; font-variant-numeric: tabular-nums; }
.kinds button:hover { color: var(--ink); }
.kinds button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 500; }
.kinds button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bank { max-width: 980px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 120px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.note { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: .86rem; }
.note a { color: var(--accent); }

.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn {
  font: inherit; font-size: .82rem; padding: 3px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.chip-btn:hover { border-color: var(--accent); }
.chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 14px; font-size: .86rem; color: var(--muted); margin-left: auto; }
.toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.progress { font-size: .86rem; color: var(--muted); }
.progress b { color: var(--ok); }

.chapter-head { margin: 18px 0 0; font-size: 1.05rem; color: var(--accent); display: flex; gap: 8px; align-items: baseline; }
.chapter-head span { font-size: .8rem; color: var(--muted); font-weight: 400; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.card[hidden] { display: none; }
.card.known { border-color: var(--ok); }
.card-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.card-head h3 { margin: 0; font-size: 1.02rem; flex: 1 1 auto; min-width: 12em; }
.num { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.tag { font-size: .72rem; padding: 1px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.write { background: var(--warn-soft); color: var(--star); }
.known-box { font-size: .82rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; white-space: nowrap; }
.card.known .known-box { color: var(--ok); font-weight: 500; }
.prompt { white-space: pre-wrap; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 0; }

details > summary { cursor: pointer; color: var(--accent); font-weight: 500; font-size: .9rem; width: fit-content; }
details > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
details[open] > summary { margin-bottom: 6px; }
details.hint ol { margin: 0; padding: 8px 14px 8px 32px; background: var(--warn-soft); border-radius: 8px; font-size: .9rem; }
.explain { white-space: pre-wrap; background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; font-size: .9rem; margin: 8px 0; }
.result-head { font-size: .82rem; color: var(--muted); margin: 10px 0 4px; }
.table-wrap td.nul { color: var(--muted); font-style: italic; }
.table-wrap td { white-space: pre; font-variant-numeric: tabular-nums; }

/* 執行結果：每一句一塊 */
.run { display: grid; gap: 8px; margin-top: 10px; min-width: 0; }
.run-title { font-size: .82rem; color: var(--muted); font-weight: 500; }
.blk { display: grid; gap: 4px; min-width: 0; }
.blk-cmd { font-family: var(--font-mono); font-size: .8rem; display: flex; gap: 6px; min-width: 0; }
.blk-cmd code { white-space: pre-wrap; overflow-wrap: anywhere; }
.prompt-mark { color: var(--accent); font-weight: 700; }
.blk .result-head { margin: 2px 0; }
.blk-out {
  margin: 0; font-family: var(--font-mono); font-size: .8rem; white-space: pre; overflow-x: auto;
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; max-height: 420px; line-height: 1.5;
}
.blk-out .tr-cmd { font-weight: 600; }
.blk-out .tr-err { color: var(--bad); }
.blk-warn { margin: 0; font-size: .8rem; color: var(--star); background: var(--warn-soft); border-radius: 6px; padding: 4px 10px; overflow-wrap: anywhere; }

/* 陷阱題 */
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pair.single { grid-template-columns: minmax(0, 1fr); }
.pair > div { min-width: 0; }
.pair-label { font-size: .85rem; font-weight: 500; }
.question { margin: 0; font-weight: 500; }
.options { display: flex; flex-wrap: wrap; gap: 8px; }
.option {
  font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line);
  border-radius: 8px; padding: 6px 16px; cursor: pointer;
}
.option:hover:not(:disabled) { border-color: var(--accent); }
.option:disabled { cursor: default; }
.option.correct { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); font-weight: 500; }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.option:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.verdict { font-weight: 600; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.retry { font: inherit; font-size: .82rem; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }

/* 索引實驗 */
.step-label { font-size: .82rem; color: var(--muted); margin-top: 4px; }
.goal { white-space: pre-wrap; margin: 0; }

.empty { color: var(--muted); text-align: center; padding: 40px; border: 1px dashed var(--line); border-radius: 12px; }

@media (max-width: 760px) {
  .pair { grid-template-columns: minmax(0, 1fr); }
  .bank, .top-in { padding-inline: 16px; }
  .toggles { margin-left: 0; }
}

</style>
</head>

<script type="application/json" id="data">{"dbs": [{"id": "postgresql", "name": "PostgreSQL", "lang": "sql", "labName": "Index lab", "labNote": "The lab uses two 2-million-row tables in the perf schema: perf.orders_big (inserted in random order) and perf.order_events (inserted in time order). Each step runs EXPLAIN ANALYZE without an index, then creates the index and runs it again, comparing the plans and timings.", "hasResults": true, "exercises": [{"id": "status-count", "chapter": "Basic aggregation", "title": "Orders per status", "prompt": "Count how many orders there are for each order status.\nShow: status, number of orders.\nSort: number of orders, highest first.\n", "hints": ["GROUP BY status puts orders with the same status into one group.", "count(*) counts the rows in each group; ORDER BY can use the alias defined in SELECT."], "answer": "SELECT status, count(*) AS orders\nFROM orders\nGROUP BY status\nORDER BY orders DESC;\n", "explanation": "The most basic grouped aggregation. Note that ORDER BY can use the SELECT alias orders, but WHERE can't:\nwhen WHERE runs, SELECT hasn't run yet, so the alias doesn't exist.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["status", "orders"], "rows": [["delivered", 64554], ["cancelled", 8108], ["returned", 6340], ["shipped", 351], ["pending", 329], ["paid", 318]], "total": 6}}]}, {"id": "having", "chapter": "Basic aggregation", "title": "Customers with more than 50 orders", "prompt": "Find the customers who have placed more than 50 orders.\nShow: customer id, number of orders.\nSort: number of orders, highest first; ties by customer id ascending.\n", "hints": ["First GROUP BY customer_id to count each customer's orders.", "Conditions that apply \"after grouping\" go in HAVING, not WHERE."], "answer": "SELECT customer_id, count(*) AS orders\nFROM orders\nGROUP BY customer_id\nHAVING count(*) > 50\nORDER BY orders DESC, customer_id;\n", "explanation": "★ Interview favorite: WHERE filters rows \"before\" grouping; HAVING filters groups \"after\" grouping.\nAggregate functions (count, sum…) can only appear in HAVING; putting them in WHERE is an error.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["customer_id", "orders"], "rows": [[1, 152], [2, 94], [3, 73], [4, 62], [5, 62], [8, 57], [10, 52]], "total": 7}}]}, {"id": "distinct-city", "chapter": "Basic aggregation", "title": "Distinct shipping cities", "prompt": "List every shipping city (shipping_city) that appears in any order, without duplicates.\nShow: city.\nSort: city name.\n", "hints": ["SELECT DISTINCT merges identical rows into one."], "answer": "SELECT DISTINCT shipping_city\nFROM orders\nORDER BY shipping_city;\n", "explanation": "DISTINCT gives the same result as GROUP BY shipping_city. For plain de-duplication DISTINCT reads better;\nuse GROUP BY when you also need counts.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["shipping_city"], "rows": [["台中市"], ["台北市"], ["台南市"], ["台東縣"], ["嘉義市"], ["基隆市"], ["宜蘭縣"], ["屏東縣"], ["彰化縣"], ["新北市"]], "total": 15}}]}, {"id": "vip-count", "chapter": "Basic aggregation", "title": "Customers per VIP level", "prompt": "Count how many customers there are at each VIP level (vip_level).\nShow: vip_level, number of customers.\nSort: any order.\n", "hints": ["Same as the first exercise, on the customers table."], "answer": "SELECT vip_level, count(*) AS members\nFROM customers\nGROUP BY vip_level;\n", "explanation": "This one doesn't require an order, so it's correct without ORDER BY.\nBut remember: without ORDER BY the database does \"not guarantee\" any order; it can differ between runs.\n", "ordered": false, "write": false, "setup": null, "result": [{"table": {"columns": ["vip_level", "members"], "rows": [["silver", 2670], ["gold", 891], ["normal", 16439]], "total": 3}}]}, {"id": "never-ordered", "chapter": "JOIN", "title": "Customers who never ordered", "prompt": "List the customers who have never placed an order.\nShow: customer id, name, signup date.\nSort: signup date, earliest first; same day by id ascending. Only the first 10 rows.\n", "hints": ["INNER JOIN drops customers without orders; use LEFT JOIN to keep every customer.", "When LEFT JOIN finds no order, all order columns are NULL; pick those rows with WHERE o.id IS NULL."], "answer": "SELECT c.id, c.name, c.signup_date\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.id IS NULL\nORDER BY c.signup_date, c.id\nLIMIT 10;\n", "explanation": "There are two standard ways to \"find rows with no matching data\":\nLEFT JOIN … WHERE right_table.id IS NULL, or WHERE NOT EXISTS (subquery).\nBoth give the same result, and PostgreSQL usually optimizes them into the same plan (Anti Join).\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "signup_date"], "rows": [[2469, "鄭子廷", "2022-07-22"], [2941, "徐子婷", "2022-08-30"], [2961, "蕭欣萱", "2022-08-31"], [2987, "莊家涵", "2022-09-03"], [3215, "吳宇瑋", "2022-09-21"], [3751, "呂書瑋", "2022-11-04"], [3887, "林俊樺", "2022-11-15"], [3964, "王宜文", "2022-11-22"], [4451, "周明安", "2023-01-01"], [4473, "郭詩廷", "2023-01-02"]], "total": 10}}]}, {"id": "products-per-category", "chapter": "JOIN", "title": "Products per category (including 0)", "prompt": "Count the products in each category. Categories without products must be listed too, with 0.\nShow: category id, category name, number of products.\nSort: category id.\n", "hints": ["Use categories as the driving table and LEFT JOIN products.", "count(*) counts the \"NULL-filled row\" as 1; use count(p.id) instead."], "answer": "SELECT c.id, c.name, count(p.id) AS products\nFROM categories c\nLEFT JOIN products p ON p.category_id = c.id\nGROUP BY c.id, c.name\nORDER BY c.id;\n", "explanation": "★ Trap: with count(*) after a LEFT JOIN, a category with no products gets 1 instead of 0,\nbecause the LEFT JOIN still produces a row (all NULL on the right). count(column) skips NULL, so it gives 0.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "products"], "rows": [[1, "3C電子", 0], [2, "手機", 78], [3, "筆電", 76], [4, "耳機", 0], [5, "無線耳機", 69], [6, "有線耳機", 92], [7, "手機配件", 80], [8, "居家生活", 0], [9, "廚房用品", 71], [10, "寢具", 95]], "total": 27}}]}, {"id": "category-parent", "chapter": "JOIN", "title": "Categories and their parent (SELF JOIN)", "prompt": "List every category with the name of its parent category. Top-level categories have no parent; show 「無」 (\"none\").\nShow: category id, category name, parent category name.\nSort: category id.\n", "hints": ["categories joins to itself, so the same table needs two different aliases, e.g. c and p.", "Top-level categories have parent_id NULL; LEFT JOIN keeps them, then COALESCE turns NULL into 「無」."], "answer": "SELECT c.id, c.name, COALESCE(p.name, '無') AS parent\nFROM categories c\nLEFT JOIN categories p ON p.id = c.parent_id\nORDER BY c.id;\n", "explanation": "A SELF JOIN uses one table as if it were two. Typical cases: employees and managers, categories and parent categories, referrers and referees.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "parent"], "rows": [[1, "3C電子", "無"], [2, "手機", "3C電子"], [3, "筆電", "3C電子"], [4, "耳機", "3C電子"], [5, "無線耳機", "耳機"], [6, "有線耳機", "耳機"], [7, "手機配件", "3C電子"], [8, "居家生活", "無"], [9, "廚房用品", "居家生活"], [10, "寢具", "居家生活"]], "total": 27}}]}, {"id": "top-categories-2026", "chapter": "JOIN", "title": "Best-selling categories of 2026", "prompt": "For orders placed in 2026 with status delivered, count the items sold per category (sum of quantity).\nShow: category name, items sold.\nSort: items sold, highest first; top 5 only.\n", "hints": ["Four tables are chained: orders → order_items → products → categories.", "Write the date range as order_date >= '2026-01-01' AND order_date < '2027-01-01'."], "answer": "SELECT c.name, sum(oi.quantity) AS qty\nFROM orders o\nJOIN order_items oi ON oi.order_id = o.id\nJOIN products p     ON p.id = oi.product_id\nJOIN categories c   ON c.id = p.category_id\nWHERE o.status = 'delivered'\n  AND o.order_date >= '2026-01-01' AND o.order_date < '2027-01-01'\nGROUP BY c.name\nORDER BY qty DESC\nLIMIT 5;\n", "explanation": "\">= start AND < next start\" is the safest date range: it never misses the afternoon of the last day, and it can use an index.\nextract(year FROM order_date) = 2026 gives the same result, but once the column is wrapped in a function a regular index can't be used.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["name", "qty"], "rows": [["寢具", 5126], ["女裝", 4475], ["收納", 4444], ["手機", 4294], ["露營用品", 4157]], "total": 5}}]}, {"id": "profile-completeness", "chapter": "NULL", "title": "Customer profile completeness", "prompt": "Measure how complete customer profiles are. The result is a single row.\nShow: total customers, customers with a birthday, customers with a city.\n", "hints": ["count(*) counts rows; count(column) only counts rows where that column is \"not NULL\"."], "answer": "SELECT count(*)          AS total,\n       count(birth_date) AS has_birth_date,\n       count(city)       AS has_city\nFROM customers;\n", "explanation": "★ count(*) vs count(column) is a classic interview question. sum, avg, max and min also ignore NULL,\nso avg(column) is the average of \"the rows that have a value\", not of everyone.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["total", "has_birth_date", "has_city"], "rows": [[20000, 18859, 19384]], "total": 1}}]}, {"id": "city-with-unknown", "chapter": "NULL", "title": "Customers per city (including missing)", "prompt": "Count customers per city. Customers without a city go into 「未填寫」 (\"not filled in\").\nShow: city, number of customers.\nSort: number of customers, highest first; ties by city name.\n", "hints": ["COALESCE(city, '未填寫') replaces NULL with 「未填寫」.", "GROUP BY must use the same COALESCE expression (or GROUP BY 1)."], "answer": "SELECT COALESCE(city, '未填寫') AS city, count(*) AS members\nFROM customers\nGROUP BY COALESCE(city, '未填寫')\nORDER BY members DESC, city;\n", "explanation": "Actually you don't need COALESCE: GROUP BY city already puts all NULLs in one group.\nCOALESCE just makes the report friendlier.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["city", "members"], "rows": [["台北市", 4330], ["新北市", 2039], ["台中市", 1638], ["高雄市", 1370], ["桃園市", 1216], ["台南市", 1088], ["新竹市", 1028], ["新竹縣", 976], ["基隆市", 905], ["彰化縣", 887]], "total": 16}}]}, {"id": "phones-above-avg", "chapter": "Subqueries", "title": "Phones pricier than the store average", "prompt": "List products in the 「手機」 (phones) category priced above the \"average price of all products\".\nShow: product id, name, price.\nSort: price, highest first; same price by id ascending.\n", "hints": ["The average of all products can come from a subquery: (SELECT avg(price) FROM products).", "JOIN categories to filter by the category name 「手機」."], "answer": "SELECT p.id, p.name, p.price\nFROM products p\nJOIN categories c ON c.id = p.category_id\nWHERE c.name = '手機'\n  AND p.price > (SELECT avg(price) FROM products)\nORDER BY p.price DESC, p.id;\n", "explanation": "A subquery returning a single value is a \"scalar subquery\"; it can go anywhere a value is expected.\nIt doesn't depend on the outer query, so it runs only once.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "price"], "rows": [[540, "Sony 手機 I447", 29949.0], [395, "小米 手機 O256", 28769.0], [1122, "ASUS 手機 H620", 28659.0], [465, "Samsung 手機 D707", 28649.0], [115, "Apple 手機 Q137", 28229.0], [410, "小米 手機 L473", 28119.0], [952, "小米 手機 R209", 27849.0], [876, "ASUS 手機 X745", 27839.0], [844, "Apple 手機 B600", 26799.0], [216, "Samsung 手機 V578", 26739.0]], "total": 78}}]}, {"id": "never-sold", "chapter": "Subqueries", "title": "Products never sold (NOT EXISTS)", "prompt": "Find products that never appear in any order item.\nShow: product id, name, listing date (created_at).\nSort: product id.\n", "hints": ["WHERE NOT EXISTS (SELECT 1 FROM order_items oi WHERE oi.product_id = p.id)"], "answer": "SELECT p.id, p.name, p.created_at\nFROM products p\nWHERE NOT EXISTS (\n    SELECT 1 FROM order_items oi WHERE oi.product_id = p.id\n)\nORDER BY p.id;\n", "explanation": "EXISTS only cares \"whether there is one\" and stops at the first match, so the subquery is usually SELECT 1.\n★ To find what \"doesn't exist\", prefer NOT EXISTS over NOT IN: if the subquery returns a single NULL, NOT IN returns nothing at all (see the traps).\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "created_at"], "rows": [[1401, "ESR 手機配件 B485", "2026-09-14"], [1402, "Kiehls 保養 N117", "2026-09-25"], [1403, "無印良品 寢具 I961", "2026-09-19"], [1404, "黑松 飲料 S360", "2026-08-26"], [1405, "大成 生鮮 R623", "2026-08-26"], [1406, "MAC 彩妝 C382", "2026-07-22"], [1407, "ESR 手機配件 Q355", "2026-07-12"], [1408, "UNIQLO 男裝 N750", "2026-08-27"], [1409, "Coleman 露營用品 M690", "2026-07-09"], [1410, "無印良品 收納 I355", "2026-08-07"]], "total": 100}}]}, {"id": "gold-returned", "chapter": "Subqueries", "title": "Gold customers with returns", "prompt": "How many customers have VIP level gold and have at least one returned order (status = 'returned')?\nThe result is a single number.\n", "hints": ["Use EXISTS to check \"does this customer have a returned order\".", "If you use JOIN, remember a customer can have several returns; use count(DISTINCT c.id)."], "answer": "SELECT count(*) AS members\nFROM customers c\nWHERE c.vip_level = 'gold'\n  AND EXISTS (\n      SELECT 1 FROM orders o\n      WHERE o.customer_id = c.id AND o.status = 'returned'\n  );\n", "explanation": "★ JOIN makes it easy to miscount: a customer with 3 returns becomes 3 rows after the JOIN, and count(*) counts them 3 times.\nEXISTS never duplicates, which is why it fits \"is there any\" better than JOIN.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["members"], "rows": [[344]], "total": 1}}]}, {"id": "price-level", "chapter": "CASE WHEN", "title": "Product price tiers", "prompt": "Split products into three tiers by price: 10000 and up is 「高價」 (high), 1000 and up is 「中價」 (mid), everything else is 「平價」 (budget).\nCount the products in each tier.\nShow: tier, number of products.\nSort: any order.\n", "hints": ["CASE WHEN price >= 10000 THEN '高價' WHEN price >= 1000 THEN '中價' ELSE '平價' END", "GROUP BY 1 means \"group by the first column in SELECT\"."], "answer": "SELECT CASE WHEN price >= 10000 THEN '高價'\n            WHEN price >= 1000  THEN '中價'\n            ELSE '平價' END AS level,\n       count(*) AS products\nFROM products\nGROUP BY 1;\n", "explanation": "CASE WHEN is evaluated top to bottom and stops at the first match, so the order of conditions matters.\nIf price >= 1000 came first, high-priced products would also land in 「中價」.\n", "ordered": false, "write": false, "setup": null, "result": [{"table": {"columns": ["level", "products"], "rows": [["中價", 677], ["高價", 143], ["平價", 680]], "total": 3}}]}, {"id": "cancel-rate-by-year", "chapter": "CASE WHEN", "title": "Cancellation rate per year", "prompt": "For each year (by order time), count orders, cancellations (status = 'cancelled') and the cancellation rate.\nThe rate is a percentage rounded to 1 decimal place (e.g. 9.8).\nShow: year, orders, cancellations, cancellation rate.\nSort: year.\n", "hints": ["extract(year FROM order_date) gives the year.", "Count cancellations with count(*) FILTER (WHERE status = 'cancelled'), or sum(CASE WHEN … THEN 1 ELSE 0 END).", "★ Integer divided by integer is an integer (9 / 100 = 0); write 100.0 * … to get decimals."], "answer": "SELECT extract(year FROM order_date)::int AS year,\n       count(*) AS orders,\n       count(*) FILTER (WHERE status = 'cancelled') AS cancelled,\n       round(100.0 * count(*) FILTER (WHERE status = 'cancelled') / count(*), 1) AS cancel_pct\nFROM orders\nGROUP BY 1\nORDER BY 1;\n", "explanation": "\"Conditional aggregation\" is the most common reporting technique: one scan computes counts for several conditions.\nFILTER is PostgreSQL syntax; sum(CASE WHEN …) works in every database. Know both.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["year", "orders", "cancelled", "cancel_pct"], "rows": [[2022, 4324, 418, 9.7], [2023, 9907, 1000, 10.1], [2024, 15934, 1636, 10.3], [2025, 24005, 2435, 10.1], [2026, 25830, 2619, 10.1]], "total": 5}}]}, {"id": "union-members", "chapter": "Set operations", "title": "Customers who cancelled or returned (UNION)", "prompt": "How many customers have at least one cancelled or returned order?\nThe result is a single number. Try writing it with UNION.\n", "hints": ["Write two queries: customer_ids that cancelled, and customer_ids that returned; combine them with UNION (which removes duplicates).", "Put the combined result in FROM ( … ) t and count(*) outside."], "answer": "SELECT count(*) AS members\nFROM (\n    SELECT customer_id FROM orders WHERE status = 'cancelled'\n    UNION\n    SELECT customer_id FROM orders WHERE status = 'returned'\n) t;\n", "explanation": "★ UNION removes duplicates; UNION ALL doesn't. We count \"customers\", and someone with both kinds should count once, so UNION it is.\nA simpler version: count(DISTINCT customer_id) … WHERE status IN ('cancelled', 'returned').\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["members"], "rows": [[9556]], "total": 1}}]}, {"id": "except-churned", "chapter": "Set operations", "title": "Bought in 2025, not in 2026 (EXCEPT)", "prompt": "How many customers ordered in 2025 but placed no orders at all in 2026?\nThe result is a single number.\n", "hints": ["A EXCEPT B: rows in A that are not in B.", "A = customer_ids that ordered in 2025; B = customer_ids that ordered in 2026."], "answer": "SELECT count(*) AS members\nFROM (\n    SELECT customer_id FROM orders\n    WHERE order_date >= '2025-01-01' AND order_date < '2026-01-01'\n    EXCEPT\n    SELECT customer_id FROM orders\n    WHERE order_date >= '2026-01-01' AND order_date < '2027-01-01'\n) t;\n", "explanation": "This is how \"churned customers\" are counted. EXCEPT also removes duplicates.\nThe same thing can be written with NOT EXISTS, which usually optimizes better on large data.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["members"], "rows": [[3985]], "total": 1}}]}, {"id": "first-order", "chapter": "Window functions", "title": "Each customer's first order (DISTINCT ON)", "prompt": "For customers 1 to 10, each customer's first order (the earliest order time).\nShow: customer id, order id, order time.\nSort: customer id.\n", "hints": ["PostgreSQL-only: SELECT DISTINCT ON (customer_id) … ORDER BY customer_id, order_date", "Portable: number rows with row_number() OVER (PARTITION BY customer_id ORDER BY order_date) and keep number 1 outside."], "answer": "SELECT DISTINCT ON (customer_id)\n       customer_id, id AS order_id, order_date\nFROM orders\nWHERE customer_id BETWEEN 1 AND 10\nORDER BY customer_id, order_date;\n", "explanation": "DISTINCT ON (columns) keeps the first row of each group according to ORDER BY; it's PostgreSQL's most concise \"first row per group\".\nORDER BY must start with the DISTINCT ON columns. If the interviewer isn't using PostgreSQL, use row_number() instead.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["customer_id", "order_id", "order_date"], "rows": [[1, 10, "2022-01-09 01:25:07"], [2, 116, "2022-02-12 16:48:46"], [3, 1, "2022-01-01 04:41:30"], [4, 84, "2022-02-03 18:43:27"], [5, 12, "2022-01-09 03:49:33"], [6, 417, "2022-04-01 17:22:43"], [7, 2, "2022-01-01 23:46:36"], [8, 6, "2022-01-08 08:22:20"], [9, 16, "2022-01-11 07:02:51"], [10, 40, "2022-01-22 05:54:25"]], "total": 10}}]}, {"id": "top-product-per-category", "chapter": "Window functions", "title": "Most expensive product per category", "prompt": "Find the most expensive product in each category (on ties, the smaller product id). Only categories that have products.\nShow: category id, product id, product name, price.\nSort: category id.\n", "hints": ["row_number() OVER (PARTITION BY category_id ORDER BY price DESC, id) numbers the products within each category.", "Window functions can't go directly in WHERE; wrap them in a subquery or CTE and filter rn = 1 outside."], "answer": "SELECT category_id, id, name, price\nFROM (\n    SELECT p.*,\n           row_number() OVER (PARTITION BY category_id ORDER BY price DESC, id) AS rn\n    FROM products p\n) t\nWHERE rn = 1\nORDER BY category_id;\n", "explanation": "★ \"Top N per group\" is the most frequently asked window function question.\nFor the top 3 per group use rn <= 3; to let ties share a place use rank() or dense_rank().\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["category_id", "id", "name", "price"], "rows": [[2, 540, "Sony 手機 I447", 29949.0], [3, 1277, "Apple 筆電 N731", 59249.0], [5, 627, "JBL 無線耳機 V398", 6779.0], [6, 559, "Audio-Technica 有線耳機 C203", 2349.0], [7, 626, "ESR 手機配件 V682", 969.0], [9, 911, "膳魔師 廚房用品 S292", 1579.0], [10, 1294, "IKEA 寢具 Z619", 2999.0], [11, 114, "天馬 收納 H542", 789.0], [13, 118, "UNIQLO 男裝 C928", 1589.0], [14, 1129, "GU 女裝 O406", 1799.0]], "total": 19}}]}, {"id": "monthly-revenue-diff", "chapter": "Window functions", "title": "Monthly revenue and change (LAG)", "prompt": "For January–September 2026, the monthly revenue of delivered orders and how much it changed from the previous month.\nRevenue = sum of quantity × unit_price × (1 − discount), rounded to an integer; the change is the difference of the rounded revenues.\nThe first month has no previous month, so its change is NULL.\nShow: month (a date, e.g. 2026-01-01), revenue, change.\nSort: month.\n", "hints": ["date_trunc('month', order_date)::date truncates a time to the 1st of the month.", "Compute monthly revenue in a CTE first, then use lag(revenue) OVER (ORDER BY month) outside to get the previous month."], "answer": "WITH monthly AS (\n    SELECT date_trunc('month', o.order_date)::date AS month,\n           round(sum(oi.quantity * oi.unit_price * (1 - oi.discount))) AS revenue\n    FROM orders o\n    JOIN order_items oi ON oi.order_id = o.id\n    WHERE o.status = 'delivered'\n      AND o.order_date >= '2026-01-01' AND o.order_date < '2026-10-01'\n    GROUP BY 1\n)\nSELECT month, revenue,\n       revenue - lag(revenue) OVER (ORDER BY month) AS diff\nFROM monthly\nORDER BY month;\n", "explanation": "lag() reads the previous row and lead() the next one; they're the usual tools for month-over-month, year-over-year and days-between.\nPutting monthly revenue in a CTE first makes the outer window function much clearer.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["month", "revenue", "diff"], "rows": [["2026-01-01", 34018789, null], ["2026-02-01", 29021196, -4997593], ["2026-03-01", 33809671, 4788475], ["2026-04-01", 34632714, 823043], ["2026-05-01", 36308874, 1676160], ["2026-06-01", 36198308, -110566], ["2026-07-01", 36746481, 548173], ["2026-08-01", 36347356, -399125], ["2026-09-01", 22410672, -13936684]], "total": 9}}]}, {"id": "cumulative-signups", "chapter": "Window functions", "title": "Cumulative signups", "prompt": "For January–June 2026, the number of new customers each month and the running total from January 2026 to that month.\nShow: month (a date, e.g. 2026-01-01), new customers, running total.\nSort: month.\n", "hints": ["Running total: sum(…) OVER (ORDER BY month).", "Count each month in a CTE first and accumulate outside; it's harder to get wrong."], "answer": "WITH m AS (\n    SELECT date_trunc('month', signup_date)::date AS month, count(*) AS new_members\n    FROM customers\n    WHERE signup_date >= '2026-01-01' AND signup_date < '2026-07-01'\n    GROUP BY 1\n)\nSELECT month, new_members,\n       sum(new_members) OVER (ORDER BY month) AS cumulative\nFROM m\nORDER BY month;\n", "explanation": "sum() with OVER (ORDER BY …) becomes a running total; the default window is \"from the first row to the current row\".\nRemove ORDER BY and every row gets the grand total.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["month", "new_members", "cumulative"], "rows": [["2026-01-01", 378, 378], ["2026-02-01", 341, 719], ["2026-03-01", 378, 1097], ["2026-04-01", 365, 1462], ["2026-05-01", 378, 1840], ["2026-06-01", 353, 2193]], "total": 6}}]}, {"id": "order-gap-days", "chapter": "Window functions", "title": "Days between orders", "prompt": "The first 10 orders of customer 1 by order time, and how many days each is after the \"previous\" one.\nDays between = this order's date − the previous order's date (dates only); the first row shows NULL.\nShow: order id, order date (date), days between.\nSort: order time.\n", "hints": ["order_date::date turns a timestamp into a date; date minus date gives an integer number of days.", "lag(order_date::date) OVER (ORDER BY order_date) gets the previous order's date."], "answer": "SELECT id,\n       order_date::date AS order_day,\n       order_date::date - lag(order_date::date) OVER (ORDER BY order_date) AS gap_days\nFROM orders\nWHERE customer_id = 1\nORDER BY order_date\nLIMIT 10;\n", "explanation": "Mind the execution order: WHERE → window functions → ORDER BY → LIMIT.\nSo lag() sees every row that passed WHERE; LIMIT 10 only truncates the output at the end.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "order_day", "gap_days"], "rows": [[10, "2022-01-09", null], [17, "2022-01-11", 2], [49, "2022-01-26", 15], [55, "2022-01-27", 1], [68, "2022-01-30", 3], [79, "2022-02-02", 3], [148, "2022-02-18", 16], [207, "2022-03-01", 11], [237, "2022-03-07", 6], [333, "2022-03-21", 14]], "total": 10}}]}, {"id": "category-descendants", "chapter": "Recursive CTE", "title": "All categories under 3C電子", "prompt": "List every descendant category under 「3C電子」 (consumer electronics), not including 3C電子 itself.\nDepth: direct children are 1, the next level is 2.\nShow: category id, name, depth.\nSort: category id.\n", "hints": ["WITH RECURSIVE t AS ( anchor UNION ALL recursive part ) SELECT … FROM t", "Anchor: categories whose parent_id is the id of 3C電子, depth 1.", "Recursive part: categories JOIN t ON categories.parent_id = t.id, depth + 1."], "answer": "WITH RECURSIVE t AS (\n    SELECT id, name, 1 AS depth\n    FROM categories\n    WHERE parent_id = (SELECT id FROM categories WHERE name = '3C電子')\n    UNION ALL\n    SELECT c.id, c.name, t.depth + 1\n    FROM categories c\n    JOIN t ON c.parent_id = t.id\n)\nSELECT id, name, depth\nFROM t\nORDER BY id;\n", "explanation": "A recursive CTE has two parts: the anchor runs once; the recursive part takes the previous round's result and keeps going until no new rows appear.\nTypical uses: org charts, category trees, comment threads, bills of materials.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "depth"], "rows": [[2, "手機", 1], [3, "筆電", 1], [4, "耳機", 1], [5, "無線耳機", 2], [6, "有線耳機", 2], [7, "手機配件", 1]], "total": 6}}]}, {"id": "jsonb-storage", "chapter": "JSONB", "title": "256GB phones", "prompt": "products.specs is JSONB. List products in the phones category (category_id = 2) whose spec storage_gb is 256.\nShow: product id, name, color (color inside specs).\nSort: product id.\n", "hints": ["->> extracts text: specs->>'color'; -> extracts JSONB: specs->'warranty'.", "Filter with (specs->>'storage_gb')::int = 256, or with the containment operator specs @> '{\"storage_gb\": 256}'."], "answer": "SELECT id, name, specs->>'color' AS color\nFROM products\nWHERE category_id = 2\n  AND specs @> '{\"storage_gb\": 256}'\nORDER BY id;\n", "explanation": "-> returns JSONB, ->> returns text. To compare numbers, cast the ->> result first: (specs->>'storage_gb')::int.\n@> means \"contains\": does the JSON on the left contain the fragment on the right. Its advantage is that it can use a GIN index (shown in the index lab).\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "color"], "rows": [[62, "ASUS 手機 V121", "黑"], [76, "Apple 手機 B948", "藍"], [126, "Sony 手機 C992", "銀"], [395, "小米 手機 O256", "白"], [665, "小米 手機 S110", "銀"], [688, "ASUS 手機 W417", "黑"], [729, "ASUS 手機 Q952", "銀"], [783, "Sony 手機 K167", "白"], [867, "Samsung 手機 M403", "黑"], [906, "Apple 手機 A113", "白"]], "total": 17}}]}, {"id": "jsonb-color-count", "chapter": "JSONB", "title": "Clothing products per color", "prompt": "Count menswear and womenswear products (category_id 13, 14) per color; products without specs (specs is NULL) don't count.\nShow: color, number of products.\nSort: number of products, highest first; ties by color.\n", "hints": ["GROUP BY specs->>'color' groups by a value inside the JSON."], "answer": "SELECT specs->>'color' AS color, count(*) AS products\nFROM products\nWHERE category_id IN (13, 14) AND specs IS NOT NULL\nGROUP BY 1\nORDER BY products DESC, color;\n", "explanation": "Values inside JSONB can be used in SELECT, WHERE, GROUP BY and ORDER BY just like regular columns.\nFlexible attributes (each category has different specs) suit JSONB well; you don't need a column for every kind of spec.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["color", "products"], "rows": [["黑", 35], ["綠", 34], ["藍", 29], ["白", 25], ["灰", 24], ["紅", 14]], "total": 6}}]}, {"id": "jsonb-noise-cancelling", "chapter": "JSONB", "title": "Average price of noise-cancelling products", "prompt": "What is the average price of products whose spec noise_cancelling is true? Round to an integer.\nThe result is a single number.\n", "hints": ["Write (specs->>'noise_cancelling')::boolean, or specs @> '{\"noise_cancelling\": true}'."], "answer": "SELECT round(avg(price)) AS avg_price\nFROM products\nWHERE specs @> '{\"noise_cancelling\": true}';\n", "explanation": "Note that JSON true is a boolean, not the string \"true\": '{\"noise_cancelling\": \"true\"}' matches nothing.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["avg_price"], "rows": [[3939]], "total": 1}}]}, {"id": "jsonb-nested", "chapter": "JSONB", "title": "Products with a two-year warranty (nested JSON)", "prompt": "Count products whose spec warranty.years equals 2, per category. (warranty is a nested object, e.g. {\"years\": 2, \"type\": \"原廠\"})\nShow: category name, number of products.\nSort: number of products, highest first; ties by category name.\n", "hints": ["Step by step: specs->'warranty'->>'years', or with a path: specs #>> '{warranty,years}'."], "answer": "SELECT c.name, count(*) AS products\nFROM products p\nJOIN categories c ON c.id = p.category_id\nWHERE (p.specs->'warranty'->>'years')::int = 2\nGROUP BY c.name\nORDER BY products DESC, c.name;\n", "explanation": "Use -> for the intermediate levels (it stays JSONB so you can keep going down) and ->> only at the last level to get text.\n#> and #>> take the whole path at once.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["name", "products"], "rows": [["有線耳機", 43], ["無線耳機", 36], ["手機", 35], ["筆電", 34]], "total": 4}}]}, {"id": "jsonb-key-exists", "chapter": "JSONB", "title": "Products with a battery-life spec", "prompt": "How many products have the key battery_hours in their specs?\nThe result is a single number.\n", "hints": ["The ? operator checks whether JSONB has a key: specs ? 'battery_hours'."], "answer": "SELECT count(*) AS products\nFROM products\nWHERE specs ? 'battery_hours';\n", "explanation": "? checks a single key; ?| checks \"any of the keys exists\"; ?& checks \"all of the keys exist\".\n★ In a JDBC PreparedStatement, ? is treated as a parameter placeholder, so Java code must write ?? or use the jsonb_exists() function instead. A common real-world gotcha.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["products"], "rows": [[69]], "total": 1}}]}, {"id": "jsonb-array-elements", "chapter": "JSONB", "title": "Clothing per size (expanding a JSON array)", "prompt": "For menswear and womenswear (category_id 13, 14), specs.sizes is a JSON array, e.g. [\"M\", \"L\", \"XL\"].\nCount how many products are offered in each size.\nShow: size, number of products.\nSort: any order.\n", "hints": ["jsonb_array_elements_text(specs->'sizes') expands the array into rows.", "Put it in FROM: FROM products p, jsonb_array_elements_text(p.specs->'sizes') AS s(size)."], "answer": "SELECT s.size, count(*) AS products\nFROM products p,\n     jsonb_array_elements_text(p.specs->'sizes') AS s(size)\nWHERE p.category_id IN (13, 14)\nGROUP BY s.size;\n", "explanation": "A function in FROM can reference columns of earlier tables (an implicit LATERAL), so each product expands into \"one row per size\".\nProducts with NULL specs expand to no rows, so they're naturally not counted.\n", "ordered": false, "write": false, "setup": null, "result": [{"table": {"columns": ["size", "products"], "rows": [["XXL", 46], ["M", 161], ["XL", 108], ["S", 86], ["L", 161]], "total": 5}}]}, {"id": "array-any", "chapter": "Array", "title": "Products on sale (ANY)", "prompt": "products.tags is text[]. How many products have the tag 「特價」 (on sale)?\nThe result is a single number.\n", "hints": ["'特價' = ANY(tags): true if any element of the array equals 「特價」."], "answer": "SELECT count(*) AS products\nFROM products\nWHERE '特價' = ANY(tags);\n", "explanation": "ANY(array) means \"any one of them\". You can also write tags @> ARRAY['特價'], which can use a GIN index.\nIn Java, = ANY(?) with setArray is the usual way to pass a list of ids, instead of building an IN (…) string yourself.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["products"], "rows": [[303]], "total": 1}}]}, {"id": "array-contains", "chapter": "Array", "title": "Best-selling and limited (@>)", "prompt": "Products that have both tags 「熱銷」 (best seller) and 「限量」 (limited edition).\nShow: product id, name.\nSort: product id.\n", "hints": ["tags @> ARRAY['熱銷', '限量']: the left array \"contains\" every element on the right."], "answer": "SELECT id, name\nFROM products\nWHERE tags @> ARRAY['熱銷', '限量']\nORDER BY id;\n", "explanation": "@> contains (must have all), <@ is contained by, && overlaps (has at least one in common).\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name"], "rows": [[77, "卡迪那 零食 A757"], [84, "ESR 手機配件 I142"], [100, "Belkin 手機配件 Y235"], [112, "華元 零食 I789"], [116, "UNIQLO 男裝 L278"], [215, "宜得利 寢具 Y998"], [251, "Lativ 男裝 N182"], [270, "Skechers 休閒鞋 L248"], [472, "1028 彩妝 S547"], [488, "IKEA 寢具 S227"]], "total": 21}}]}, {"id": "array-overlap", "chapter": "Array", "title": "Eco-friendly or exclusive (&&)", "prompt": "How many products have either the 「環保」 (eco-friendly) or the 「獨家」 (exclusive) tag?\nThe result is a single number.\n", "hints": ["&& means \"overlaps\": true if the two arrays share at least one element."], "answer": "SELECT count(*) AS products\nFROM products\nWHERE tags && ARRAY['環保', '獨家'];\n", "explanation": "Equivalent to '環保' = ANY(tags) OR '獨家' = ANY(tags), but && is more concise and can use a GIN index.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["products"], "rows": [[231]], "total": 1}}]}, {"id": "array-unnest", "chapter": "Array", "title": "Products per tag (unnest)", "prompt": "Count the products for each tag.\nShow: tag, number of products.\nSort: number of products, highest first; ties by tag.\n", "hints": ["unnest(tags) expands an array into rows, one element per row."], "answer": "SELECT tag, count(*) AS products\nFROM products, unnest(tags) AS tag\nGROUP BY tag\nORDER BY products DESC, tag;\n", "explanation": "unnest is the array version of \"expand\", like jsonb_array_elements for JSONB.\nThe reverse, aggregating rows into an array, is array_agg().\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["tag", "products"], "rows": [["熱銷", 381], ["特價", 303], ["團購", 203], ["環保", 142], ["限量", 109], ["新品", 100], ["獨家", 93]], "total": 7}}]}, {"id": "array-empty", "chapter": "Array", "title": "Products with no tags", "prompt": "How many products have no tags at all (an empty array)?\nThe result is a single number.\n", "hints": ["cardinality(tags) returns the number of elements in the array.", "You can also compare directly: tags = '{}'."], "answer": "SELECT count(*) AS products\nFROM products\nWHERE cardinality(tags) = 0;\n", "explanation": "★ Beware array_length(tags, 1): for an empty array it returns NULL, not 0, so array_length(tags, 1) = 0 finds nothing.\ncardinality() returns 0 for an empty array and is less error-prone.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["products"], "rows": [[554]], "total": 1}}]}, {"id": "gs-daily-zero", "chapter": "generate_series", "title": "Orders per day (show 0 for days without orders)", "prompt": "For every day of September 2026, how many orders were shipped to 「台東縣」 (Taitung County)? Days with no orders must be listed too, with 0.\nShow: date (date), number of orders.\nSort: date.\n", "hints": ["If you GROUP BY the order date directly, days without orders simply don't appear. You need to \"generate\" the full list of dates first.", "generate_series('2026-09-01'::date, '2026-09-30'::date, interval '1 day') produces 30 rows.", "Then LEFT JOIN the orders; count(o.id) gives 0 when there are no orders."], "answer": "SELECT d::date AS day, count(o.id) AS orders\nFROM generate_series('2026-09-01'::date, '2026-09-30'::date, interval '1 day') AS d\nLEFT JOIN orders o\n       ON o.shipping_city = '台東縣'\n      AND o.order_date >= d\n      AND o.order_date <  d + interval '1 day'\nGROUP BY d\nORDER BY d;\n", "explanation": "The standard way to \"fill in zeros\" in a report: generate the full timeline with generate_series, then LEFT JOIN the real data.\nNote the city condition must go in ON: in WHERE, days without orders would be filtered out (the lesson of trap #1).\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["day", "orders"], "rows": [["2026-09-01", 4], ["2026-09-02", 5], ["2026-09-03", 0], ["2026-09-04", 2], ["2026-09-05", 2], ["2026-09-06", 1], ["2026-09-07", 5], ["2026-09-08", 4], ["2026-09-09", 5], ["2026-09-10", 7]], "total": 30}}]}, {"id": "gs-monthly-signups", "chapter": "generate_series", "title": "New customers per month in 2026 (including 0)", "prompt": "For each month from January to December 2026, how many new customers signed up? Months with no signups show 0.\nShow: month (date, e.g. 2026-01-01), new customers.\nSort: month.\n", "hints": ["generate_series('2026-01-01'::date, '2026-12-01'::date, interval '1 month')"], "answer": "SELECT m::date AS month, count(c.id) AS new_members\nFROM generate_series('2026-01-01'::date, '2026-12-01'::date, interval '1 month') AS m\nLEFT JOIN customers c\n       ON c.signup_date >= m\n      AND c.signup_date <  m + interval '1 month'\nGROUP BY m\nORDER BY m;\n", "explanation": "The data only goes up to June 2026, so July–December are all 0. A plain GROUP BY on customers would return only 6 rows.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["month", "new_members"], "rows": [["2026-01-01", 378], ["2026-02-01", 341], ["2026-03-01", 378], ["2026-04-01", 365], ["2026-05-01", 378], ["2026-06-01", 353], ["2026-07-01", 0], ["2026-08-01", 0], ["2026-09-01", 0], ["2026-10-01", 0]], "total": 12}}]}, {"id": "write-insert-returning", "chapter": "Writes (RETURNING / UPSERT)", "title": "Insert a customer and get the row back (INSERT … RETURNING)", "prompt": "Add a customer: name 「王小明」, email \"xiaoming@example.com\", signup date 2026-10-01.\nUse RETURNING to return: name, email, vip_level (not specified, so see what the default is).\n", "hints": ["INSERT INTO customers (name, email, signup_date) VALUES (…) RETURNING …"], "answer": "INSERT INTO customers (name, email, signup_date)\nVALUES ('王小明', 'xiaoming@example.com', '2026-10-01')\nRETURNING name, email, vip_level;\n", "explanation": "RETURNING makes INSERT / UPDATE / DELETE return the affected rows directly, saving a second query. The most common use is getting back the generated id.\n★ This exercise deliberately doesn't compare the id: sequences (serial) aren't transactional, so even after ROLLBACK the used numbers aren't given back, and the id differs on every run.\nThat's also why production ids often have \"gaps\"; a good answer if an interviewer asks.\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["name", "email", "vip_level"], "rows": [["王小明", "xiaoming@example.com", "normal"]], "total": 1}}]}, {"id": "write-update-returning", "chapter": "Writes (RETURNING / UPSERT)", "title": "Raise drink prices by 10% (UPDATE … RETURNING)", "prompt": "Raise the price of every product in the 「飲料」 (drinks) category by 10%, rounding the new price to an integer.\nUse RETURNING to return: product id, new price.\nSort: any order.\n", "hints": ["UPDATE products SET price = round(price * 1.1) WHERE … RETURNING id, price", "Find the category with a subquery: category_id = (SELECT id FROM categories WHERE name = '飲料')"], "answer": "UPDATE products\nSET price = round(price * 1.1)\nWHERE category_id = (SELECT id FROM categories WHERE name = '飲料')\nRETURNING id, price;\n", "explanation": "RETURNING returns the values \"after\" the update. Since PostgreSQL 18 you can write RETURNING old.price, new.price to get both.\nThe sandbox can run several statements at once: add a SELECT afterwards to see the data already changed inside the transaction (but grading uses the last result returned, so remove it before submitting).\n", "ordered": false, "write": true, "setup": null, "result": [{"table": {"columns": ["id", "price"], "rows": [[352, 76.0], [484, 65.0], [1133, 76.0], [1142, 43.0], [1257, 76.0], [2, 21.0], [30, 65.0], [34, 76.0], [79, 43.0], [87, 76.0]], "total": 83}}]}, {"id": "write-delete-returning", "chapter": "Writes (RETURNING / UPSERT)", "title": "Delete pending orders (DELETE … RETURNING)", "prompt": "Delete every order with status pending. Use RETURNING to return: order id, customer id.\nSort: any order.\n", "hints": ["The foreign key on order_items has ON DELETE CASCADE, so deleting an order deletes its items too."], "answer": "DELETE FROM orders\nWHERE status = 'pending'\nRETURNING id, customer_id;\n", "explanation": "DELETE … RETURNING is often used to \"move data\": WITH moved AS (DELETE … RETURNING *) INSERT INTO archive SELECT * FROM moved;\nOne statement deletes and archives, inside the same transaction.\n", "ordered": false, "write": true, "setup": null, "result": [{"table": {"columns": ["id", "customer_id"], "rows": [[78907, 17631], [78911, 18042], [78912, 18476], [78915, 17006], [78917, 15373], [78920, 11999], [78923, 15926], [78928, 15820], [78937, 1954], [78938, 16233]], "total": 329}}]}, {"id": "write-upsert-update", "chapter": "Writes (RETURNING / UPSERT)", "title": "Update if it exists, insert if not (UPSERT)", "prompt": "Write two categories in one statement:\n(2, '智慧型手機', parent 1): id 2 already exists; update its name to 「智慧型手機」 (smartphones)\n(28, '寵物用品', no parent): id 28 doesn't exist; insert it\nUse RETURNING to return: id, name, parent_id.\nSort: any order.\n", "hints": ["INSERT … ON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name", "EXCLUDED means \"the row we tried to insert that hit the conflict\"."], "answer": "INSERT INTO categories (id, name, parent_id)\nVALUES (2, '智慧型手機', 1),\n       (28, '寵物用品', NULL)\nON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name\nRETURNING id, name, parent_id;\n", "explanation": "★ UPSERT is atomic: there's no race condition where someone else sneaks in between \"check whether it exists\" and \"decide INSERT or UPDATE\".\nON CONFLICT needs a column with a UNIQUE or primary key constraint. JPA's save() can't do this, so in practice you often write native SQL.\n", "ordered": false, "write": true, "setup": null, "result": [{"table": {"columns": ["id", "name", "parent_id"], "rows": [[2, "智慧型手機", 1], [28, "寵物用品", null]], "total": 2}}]}, {"id": "write-upsert-nothing", "chapter": "Writes (RETURNING / UPSERT)", "title": "Skip duplicates (ON CONFLICT DO NOTHING)", "prompt": "Add two customers in one statement (both with signup date 2026-10-01):\n「舊會員」 (existing member), email user00001@example.com (this email already exists)\n「新會員」 (new member), email new0001@example.com\nSkip rows with a duplicate email without raising an error. Use RETURNING to return: name, email.\n", "hints": ["ON CONFLICT (email) DO NOTHING"], "answer": "INSERT INTO customers (name, email, signup_date)\nVALUES ('舊會員', 'user00001@example.com', '2026-10-01'),\n       ('新會員', 'new0001@example.com', '2026-10-01')\nON CONFLICT (email) DO NOTHING\nRETURNING name, email;\n", "explanation": "A row skipped by DO NOTHING doesn't appear in RETURNING, so only one row comes back.\nThis pattern is very common for data imports and for handling duplicate requests (idempotency).\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["name", "email"], "rows": [["新會員", "new0001@example.com"]], "total": 1}}]}, {"id": "write-update-from", "chapter": "Writes (RETURNING / UPSERT)", "title": "Downgrade gold customers with returns (UPDATE … FROM)", "prompt": "Downgrade gold customers who have \"ever had a returned order\" to silver.\nUse RETURNING to return: customer id.\nSort: any order.\n", "hints": ["UPDATE customers c SET … FROM orders o WHERE o.customer_id = c.id AND …", "You can also use WHERE EXISTS (…)."], "answer": "UPDATE customers c\nSET vip_level = 'silver'\nFROM orders o\nWHERE o.customer_id = c.id\n  AND o.status = 'returned'\n  AND c.vip_level = 'gold'\nRETURNING c.id;\n", "explanation": "UPDATE … FROM is PostgreSQL's way to update using data from other tables (MySQL uses UPDATE … JOIN).\nA customer with several returns is still updated once and returned once.\n★ But if SET uses a column from the FROM table and several rows match, \"which row's value is used\" is undefined. In that case aggregate first, then update.\n", "ordered": false, "write": true, "setup": null, "result": [{"table": {"columns": ["id"], "rows": [[13], [10], [8], [81], [30], [2], [1], [75], [455], [124]], "total": 344}}]}, {"id": "write-jsonb-merge", "chapter": "Writes (RETURNING / UPSERT)", "title": "Add a field inside JSONB", "prompt": "For products tagged 「特價」 (on sale) that have specs (specs is not NULL), add \"on_sale\": true to specs.\nUse RETURNING to return: product id, the value of on_sale in specs (as text).\nSort: any order.\n", "hints": ["Merge JSONB with ||: specs || '{\"on_sale\": true}'; keys on the right overwrite the same keys.", "You can also use jsonb_set(specs, '{on_sale}', 'true')."], "answer": "UPDATE products\nSET specs = specs || '{\"on_sale\": true}'\nWHERE '特價' = ANY(tags) AND specs IS NOT NULL\nRETURNING id, specs->>'on_sale';\n", "explanation": "★ Trap: NULL || '{\"on_sale\": true}' is NULL (shown in the traps).\nTo include products without specs, write COALESCE(specs, '{}') || '{\"on_sale\": true}'.\nRemove a key with minus: specs - 'on_sale'.\n", "ordered": false, "write": true, "setup": null, "result": [{"table": {"columns": ["id", "?column?"], "rows": [[7, "true"], [10, "true"], [24, "true"], [14, "true"], [15, "true"], [26, "true"], [32, "true"], [40, "true"], [43, "true"], [50, "true"]], "total": 288}}]}], "traps": [{"id": "left-join-where", "title": "LEFT JOIN conditions in ON or in WHERE", "question": "Do these two queries count the same number of customers?", "options": ["The same", "Different, A has more", "Different, B has more"], "answer": 1, "explanation": "A puts the condition in ON: rows are matched by the condition, and customers without a match are still kept (order columns filled with NULL), so all 20,000 customers are there.\nB puts the condition in WHERE: it filters after the LEFT JOIN. For customers without returns, o.status is NULL, NULL = 'returned' is not true, and they're all filtered out.\nB's LEFT JOIN effectively becomes an INNER JOIN.\nRule of thumb: to \"keep the left table\", put right-table conditions in ON; put them in WHERE only to \"filter rows out\".\n", "setup": null, "scripts": [{"label": "A: condition in ON", "code": "SELECT count(DISTINCT c.id) AS members\nFROM customers c\nLEFT JOIN orders o\n       ON o.customer_id = c.id\n      AND o.status = 'returned';\n"}, {"label": "B: condition in WHERE", "code": "SELECT count(DISTINCT c.id) AS members\nFROM customers c\nLEFT JOIN orders o\n       ON o.customer_id = c.id\nWHERE o.status = 'returned';\n"}], "results": [[{"table": {"columns": ["members"], "rows": [[20000]], "total": 1}}], [{"table": {"columns": ["members"], "rows": [[5141]], "total": 1}}]]}, {"id": "not-in-null", "title": "NOT IN meets NULL", "question": "We want categories with no child categories (leaf nodes). How many rows does A return?", "options": ["The same as B", "0 rows", "27 rows (every category)", "An error"], "answer": 1, "explanation": "Top-level categories have parent_id NULL, so the subquery result contains NULL.\nid NOT IN (2, 4, NULL) expands to id <> 2 AND id <> 4 AND id <> NULL.\nAny comparison with NULL is \"unknown\", not true, so no row passes: the result is 0 rows, with no error.\n★ Use NOT EXISTS to find what \"doesn't exist\"; if you must use NOT IN, add WHERE parent_id IS NOT NULL to the subquery.\n", "setup": null, "scripts": [{"label": "A: NOT IN", "code": "SELECT id, name\nFROM categories\nWHERE id NOT IN (SELECT parent_id FROM categories);\n"}, {"label": "B: NOT EXISTS", "code": "SELECT id, name\nFROM categories c\nWHERE NOT EXISTS (\n    SELECT 1 FROM categories ch WHERE ch.parent_id = c.id\n);\n"}], "results": [[{"table": {"columns": ["id", "name"], "rows": [], "total": 0}}], [{"table": {"columns": ["id", "name"], "rows": [[20, "飲料"], [26, "健身器材"], [27, "露營用品"], [11, "收納"], [17, "休閒鞋"], [10, "寢具"], [2, "手機"], [13, "男裝"], [21, "生鮮"], [5, "無線耳機"]], "total": 19}}]]}, {"id": "count-star-left-join", "title": "count(*) after a LEFT JOIN", "question": "Customer 19999 has never placed an order. What does A's count(*) return?", "options": ["0", "1", "NULL"], "answer": 1, "explanation": "When a LEFT JOIN finds no order, it still produces \"one row\": customer columns have values and order columns are all NULL.\ncount(*) counts rows, so it's 1; count(o.id) skips NULL and gives the correct 0.\nWatch out for this in any \"how many Y per X, show 0 if none\" report.\n", "setup": null, "scripts": [{"label": "A: count(*)", "code": "SELECT c.id, count(*) AS orders\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE c.id = 19999\nGROUP BY c.id;\n"}, {"label": "B: count(o.id)", "code": "SELECT c.id, count(o.id) AS orders\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE c.id = 19999\nGROUP BY c.id;\n"}], "results": [[{"table": {"columns": ["id", "orders"], "rows": [[19999, 1]], "total": 1}}], [{"table": {"columns": ["id", "orders"], "rows": [[19999, 0]], "total": 1}}]]}, {"id": "count-column-null", "title": "count(*) vs count(column)", "question": "How do count(*) and count(birth_date) compare?", "options": ["The same", "count(birth_date) is smaller", "count(birth_date) is larger"], "answer": 1, "explanation": "count(*) counts \"rows\"; count(column) only counts rows where that column is not NULL.\nSome customers have no birthday (NULL), so B is smaller.\nsum, avg, max and min skip NULL as well.\n", "setup": null, "scripts": [{"label": "A: count(*)", "code": "SELECT count(*) AS cnt FROM customers;\n"}, {"label": "B: count(birth_date)", "code": "SELECT count(birth_date) AS cnt FROM customers;\n"}], "results": [[{"table": {"columns": ["cnt"], "rows": [[20000]], "total": 1}}], [{"table": {"columns": ["cnt"], "rows": [[18859]], "total": 1}}]]}, {"id": "equals-null", "title": "= NULL", "question": "We want customers who didn't fill in a city. What does A return?", "options": ["The same as B", "0", "An error"], "answer": 1, "explanation": "NULL means \"unknown\". Comparing anything with NULL using =, <> or > gives unknown (not true), so no row passes WHERE.\nThe only way to test for NULL is IS NULL / IS NOT NULL.\n", "setup": null, "scripts": [{"label": "A: = NULL", "code": "SELECT count(*) AS members FROM customers WHERE city = NULL;\n"}, {"label": "B: IS NULL", "code": "SELECT count(*) AS members FROM customers WHERE city IS NULL;\n"}], "results": [[{"table": {"columns": ["members"], "rows": [[0]], "total": 1}}], [{"table": {"columns": ["members"], "rows": [[616]], "total": 1}}]]}, {"id": "integer-division", "title": "Integer division", "question": "What cancellation rate does A compute?", "options": ["About 0.1", "0", "About 10", "An error"], "answer": 1, "explanation": "count(*) is an integer (bigint), and integer divided by integer is still an integer, with the fraction dropped: 8000 / 80000 = 0.\nIf either side is a decimal you get a decimal; the usual forms are 100.0 * a / b or a::numeric / b.\nJava's int / int works the same way.\n", "setup": null, "scripts": [{"label": "A: integer division", "code": "SELECT count(*) FILTER (WHERE status = 'cancelled') / count(*) AS cancel_rate\nFROM orders;\n"}, {"label": "B: multiply by 100.0 first", "code": "SELECT round(100.0 * count(*) FILTER (WHERE status = 'cancelled') / count(*), 2) AS cancel_pct\nFROM orders;\n"}], "results": [[{"table": {"columns": ["cancel_rate"], "rows": [[0]], "total": 1}}], [{"table": {"columns": ["cancel_pct"], "rows": [[10.14]], "total": 1}}]]}, {"id": "and-or-precedence", "title": "AND vs OR precedence", "question": "Does A find \"cancelled or returned orders in 台北市 (Taipei)\"?", "options": ["Yes, the same as B", "No, A finds more", "No, A finds fewer"], "answer": 1, "explanation": "AND binds tighter than OR, so A is actually:\nstatus = 'cancelled' OR (status = 'returned' AND shipping_city = '台北市')\nThat is \"cancelled orders in every city\" plus \"returned orders in Taipei\", so it finds more.\nAlways add parentheses when mixing OR and AND. status IN ('cancelled', 'returned') avoids the problem too.\n", "setup": null, "scripts": [{"label": "A: no parentheses", "code": "SELECT count(*) AS orders\nFROM orders\nWHERE status = 'cancelled' OR status = 'returned'\n  AND shipping_city = '台北市';\n"}, {"label": "B: with parentheses", "code": "SELECT count(*) AS orders\nFROM orders\nWHERE (status = 'cancelled' OR status = 'returned')\n  AND shipping_city = '台北市';\n"}], "results": [[{"table": {"columns": ["orders"], "rows": [[9482]], "total": 1}}], [{"table": {"columns": ["orders"], "rows": [[3124]], "total": 1}}]]}, {"id": "between-timestamp", "title": "BETWEEN and timestamps", "question": "We want the orders of January 2026. Does A return the same count as B?", "options": ["The same", "A returns fewer", "A returns more"], "answer": 1, "explanation": "order_date is a timestamp. '2026-01-31' is read as 2026-01-31 00:00:00,\nso every order on Jan 31 after midnight is missed.\nAlways write time ranges as \">= start AND < start of the next period\"; it's correct whether the column is a date or a timestamp.\n", "setup": null, "scripts": [{"label": "A: BETWEEN", "code": "SELECT count(*) AS orders\nFROM orders\nWHERE order_date BETWEEN '2026-01-01' AND '2026-01-31';\n"}, {"label": "B: >= and <", "code": "SELECT count(*) AS orders\nFROM orders\nWHERE order_date >= '2026-01-01' AND order_date < '2026-02-01';\n"}], "results": [[{"table": {"columns": ["orders"], "rows": [[2564]], "total": 1}}], [{"table": {"columns": ["orders"], "rows": [[2668]], "total": 1}}]]}, {"id": "jsonb-text-compare", "title": "Values extracted from JSONB are text", "question": "We want phones with more than 64GB of storage. Does A return the same count as B?", "options": ["The same", "A returns fewer", "A returns more"], "answer": 1, "explanation": "->> extracts text, and text is compared character by character from the first one:\n'128' > '64' compares '1' with '6' first; '1' is smaller, so it's false. '256' and '512' also lose to '6'.\nSo A finds nothing at all, and there's no error message.\nTo compare numbers inside JSONB, always cast first: (specs->>'storage_gb')::int.\n", "setup": null, "scripts": [{"label": "A: compare the ->> result directly", "code": "SELECT count(*) AS phones\nFROM products\nWHERE category_id = 2 AND specs->>'storage_gb' > '64';\n"}, {"label": "B: cast to a number first", "code": "SELECT count(*) AS phones\nFROM products\nWHERE category_id = 2 AND (specs->>'storage_gb')::int > 64;\n"}], "results": [[{"table": {"columns": ["phones"], "rows": [[0]], "total": 1}}], [{"table": {"columns": ["phones"], "rows": [[52]], "total": 1}}]]}, {"id": "jsonb-null-concat", "title": "Merging JSONB into NULL", "question": "Some products have NULL specs. What does A's specs || '{\"on_sale\": true}' give for them?", "options": ["{\"on_sale\": true}", "NULL", "An error"], "answer": 1, "explanation": "In SQL, almost any operation involving NULL yields NULL: NULL || anything = NULL, NULL + 1 = NULL.\nSo with UPDATE … SET specs = specs || '{…}', products whose specs were NULL don't get the new field, and there's no error message.\nFill them with an empty object first using COALESCE(specs, '{}').\n", "setup": null, "scripts": [{"label": "A: merge directly", "code": "SELECT id, specs || '{\"on_sale\": true}' AS merged\nFROM products\nWHERE specs IS NULL\nORDER BY id\nLIMIT 5;\n"}, {"label": "B: COALESCE to an empty object first", "code": "SELECT id, COALESCE(specs, '{}') || '{\"on_sale\": true}' AS merged\nFROM products\nWHERE specs IS NULL\nORDER BY id\nLIMIT 5;\n"}], "results": [[{"table": {"columns": ["id", "merged"], "rows": [[1, null], [5, null], [25, null], [54, null], [60, null]], "total": 5}}], [{"table": {"columns": ["id", "merged"], "rows": [[1, "{\"on_sale\": true}"], [5, "{\"on_sale\": true}"], [25, "{\"on_sale\": true}"], [54, "{\"on_sale\": true}"], [60, "{\"on_sale\": true}"]], "total": 5}}]]}], "steps": [{"id": "seq-scan", "title": "A query without an index", "goal": "perf.orders_big has 2 million orders and no index other than the primary key.\nFind \"customer 4242's 5 most recent orders\" and see how PostgreSQL executes it.\n", "question": "Only 5 rows come back, so why does it take tens of milliseconds? Look at Seq Scan and Rows Removed by Filter in the plan.", "takeaway": "Seq Scan = read from the first row to the last. Without an index the database doesn't know where 4242's orders are, so it reads all 2 million rows and filters.\nRows Removed by Filter is the number of rows read for nothing. Parallel means PostgreSQL used several workers to scan together, but it's still a full table scan.\n", "setup": [], "queries": [{"label": "Customer 4242's 5 most recent orders", "code": "EXPLAIN ANALYZE\nSELECT id, order_date, status, amount\nFROM perf.orders_big\nWHERE customer_id = 4242\nORDER BY order_date DESC\nLIMIT 5;\n"}]}, {"id": "single-index", "title": "Create a single-column index", "goal": "Create a B-tree index on customer_id, run the same query again and compare the execution time.\n", "question": "What does the scan become? Is there still a Sort in the plan?", "takeaway": "It becomes Bitmap Index Scan + Bitmap Heap Scan: first find the matching row locations in the index, then go back to the table to read those rows. Usually hundreds of times faster.\nBut there's still a Sort: the index is ordered only by customer_id, and one customer's orders aren't ordered by order_date inside the index,\nso all of this customer's orders must be read and sorted before we know which 5 are the most recent.\nBuilding an index takes time too; look at the \"build time\" and the index size.\n", "setup": ["CREATE INDEX idx_customer ON perf.orders_big (customer_id);"], "queries": [{"label": "Customer 4242's 5 most recent orders", "code": "EXPLAIN ANALYZE\nSELECT id, order_date, status, amount\nFROM perf.orders_big\nWHERE customer_id = 4242\nORDER BY order_date DESC\nLIMIT 5;\n"}]}, {"id": "composite-index", "title": "A composite index removes the sort too", "goal": "Create a composite index on (customer_id, order_date) and run it again.\nYou can drop idx_customer first, to see more clearly which index is doing the work.\n", "question": "Is the Sort node still there?", "takeaway": "A composite index is ordered by customer_id first, then by order_date when customer_id is equal.\nOnce 4242 is found, the rows are already in time order: read 5 from the end (Index Scan Backward) and stop. No Sort, and no other orders read.\n★ When designing an index, put the equality conditions of WHERE first and the ORDER BY columns after them.\nNote: without LIMIT, and with very few matching rows (this customer has only 6), the optimizer may still pick a Bitmap Scan and sort,\nbecause sorting 6 rows costs almost nothing. The more data there is, or with a LIMIT, the clearer the composite index's advantage.\n", "setup": ["DROP INDEX perf.idx_customer;", "CREATE INDEX idx_customer_date ON perf.orders_big (customer_id, order_date);"], "queries": [{"label": "Customer 4242's 5 most recent orders", "code": "EXPLAIN ANALYZE\nSELECT id, order_date, status, amount\nFROM perf.orders_big\nWHERE customer_id = 4242\nORDER BY order_date DESC\nLIMIT 5;\n"}]}, {"id": "leftmost-prefix", "title": "Column order matters (leftmost prefix)", "goal": "With only the (customer_id, order_date) index, query one day's orders \"by date only\".\n", "question": "Don't create idx_date yet; just run it. order_date is in the composite index, so why can't it be used?", "takeaway": "★ The leftmost prefix rule: a (customer_id, order_
