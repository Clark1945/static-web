date) index is like a phone book sorted \"by last name, then first name\"; knowing only the first name doesn't help you find anyone.\nThe query has no customer_id condition, so it can't use this index's ordering and has to scan the whole table.\nAfter creating idx_date, run it again and it becomes an Index Scan or Bitmap Scan.\n", "setup": ["CREATE INDEX idx_date ON perf.orders_big (order_date);"], "queries": [{"label": "Orders for the whole day of 2026-09-01", "code": "EXPLAIN ANALYZE\nSELECT id, customer_id, amount\nFROM perf.orders_big\nWHERE order_date >= '2026-09-01' AND order_date < '2026-09-02';\n"}]}, {"id": "function-on-column", "title": "Wrap a column in a function and the index stops working", "goal": "Make sure idx_date exists (from the previous step). Compare two ways to \"query one day\".\n", "question": "Both versions query the same day. Are the plans the same?", "takeaway": "The index stores the original values of order_date. A converts the column before comparing, so the database has to compute it for every row and the index is useless (Seq Scan).\nB compares the column with a range directly, so it can seek in the index; and since count(*) only needs the number of rows, it doesn't even read the table (Index Only Scan).\n★ Rule: put functions and arithmetic on \"the constant side\", never around the column. Likewise, WHERE amount * 2 > 1000 should be rewritten as amount > 500.\n", "setup": ["CREATE INDEX idx_date ON perf.orders_big (order_date);"], "queries": [{"label": "A: convert the column to a date, then compare", "code": "EXPLAIN ANALYZE\nSELECT count(*)\nFROM perf.orders_big\nWHERE (order_date AT TIME ZONE 'Asia/Taipei')::date = '2026-09-01';\n"}, {"label": "B: compare with a range", "code": "EXPLAIN ANALYZE\nSELECT count(*)\nFROM perf.orders_big\nWHERE order_date >= '2026-09-01' AND order_date < '2026-09-02';\n"}]}, {"id": "low-selectivity", "title": "Low selectivity, so the index isn't used", "goal": "Create an index on status. status has only 4 values: delivered is 82%, pending only 3%.\n", "question": "Both queries have an index available. Did PostgreSQL use it for both?", "takeaway": "For delivered, 80% of the rows match; going back to the table row by row through the index would be slower, so the optimizer chooses a full table scan.\npending is only 3%, so the index pays off (Bitmap Scan). But 3% is still 60,000 rows, and fetching them from the table takes time, so the speed-up isn't as dramatic as in the earlier steps.\n★ \"Having an index doesn't mean it will be used.\" The optimizer estimates cost from statistics and picks what it thinks is fastest. An index on a low-selectivity column alone (gender, status) is usually not very useful.\n", "setup": ["CREATE INDEX idx_status ON perf.orders_big (status);"], "queries": [{"label": "A: delivered (82%)", "code": "EXPLAIN ANALYZE\nSELECT sum(amount)\nFROM perf.orders_big\nWHERE status = 'delivered';\n"}, {"label": "B: pending (3%)", "code": "EXPLAIN ANALYZE\nSELECT sum(amount)\nFROM perf.orders_big\nWHERE status = 'pending';\n"}]}, {"id": "index-only-scan", "title": "Index Only Scan: no need to read the table", "goal": "Make sure the (customer_id, order_date) composite index exists. Compare \"only columns in the index\" with \"one extra column\".\n", "question": "How do the scans of A and B differ? What is Heap Fetches?", "takeaway": "Every column A needs is in the index, so it can be read straight from the index: an Index Only Scan, with no trip to the table.\nB also wants amount, which isn't in the index, so it has to go back to the table.\nThis is another reason SELECT * is bad: it makes an Index Only Scan nearly impossible.\nSince PostgreSQL 11, INCLUDE can \"carry\" columns in the index: CREATE INDEX … (customer_id, order_date) INCLUDE (amount).\n★ Finally, look at the sizes in the index list: indexes take space, and every INSERT / UPDATE / DELETE has to update them, so writes get slower. That's why you can't index every column.\n", "setup": ["CREATE INDEX idx_customer_date ON perf.orders_big (customer_id, order_date);"], "queries": [{"label": "A: only customer_id, order_date", "code": "EXPLAIN ANALYZE\nSELECT customer_id, order_date\nFROM perf.orders_big\nWHERE customer_id BETWEEN 1000 AND 1200;\n"}, {"label": "B: plus amount", "code": "EXPLAIN ANALYZE\nSELECT customer_id, order_date, amount\nFROM perf.orders_big\nWHERE customer_id BETWEEN 1000 AND 1200;\n"}]}, {"id": "partial-index", "title": "Partial index: index only the rows you need", "goal": "Customer support often looks up \"the newest pending orders\". pending is only 3%; the other 97% of orders are never queried with this condition.\nCompare two indexes: a regular index on status, and a partial index that \"contains only pending orders\".\n", "question": "Run it once without an index, then create each of the two indexes. Which is faster? How different are the two index sizes?", "takeaway": "A partial index contains only the rows matching its WHERE condition. idx_pending has only 60,000 rows, about a tenth of the size of the full index.\nIt's ordered by order_date, so \"the newest 20\" is just 20 rows read from the end (Index Scan Backward), with no sort.\n★ The query's WHERE must \"imply\" the index condition (here status = 'pending') for the optimizer to use it.\nTypical uses: index only non-deleted rows (WHERE deleted_at IS NULL), or only unfinished jobs (WHERE done = false).\n", "setup": ["CREATE INDEX idx_status ON perf.orders_big (status);", "CREATE INDEX idx_pending ON perf.orders_big (order_date) WHERE status = 'pending';"], "queries": [{"label": "The newest 20 pending orders", "code": "EXPLAIN ANALYZE\nSELECT id, customer_id, order_date\nFROM perf.orders_big\nWHERE status = 'pending'\nORDER BY order_date DESC\nLIMIT 20;\n"}]}, {"id": "expression-index", "title": "Expression index: index the result of an expression", "goal": "Step 5 said \"wrap a column in a function and the index stops working\". But if the query can't be rewritten (say, the application always queries this way), there's another trick:\nindex \"the result of the function\" directly.\n", "question": "How does the plan differ before and after creating the expression index?", "takeaway": "An expression index stores the computed value; a query uses it as long as it writes \"exactly the same\" expression.\nThe classic example is case-insensitive email lookup: CREATE INDEX ON users (lower(email)), with WHERE lower(email) = lower(?).\n★ Only IMMUTABLE functions (same input, always the same output) may be used in the expression. now(), or conversions that depend on the time zone setting, are not allowed,\nwhich is why AT TIME ZONE 'Asia/Taipei' has to be spelled out here.\n", "setup": ["CREATE INDEX idx_order_day ON perf.orders_big (((order_date AT TIME ZONE 'Asia/Taipei')::date));"], "queries": [{"label": "Query one day by \"Taiwan date\"", "code": "EXPLAIN ANALYZE\nSELECT count(*)\nFROM perf.orders_big\nWHERE (order_date AT TIME ZONE 'Asia/Taipei')::date = '2026-09-01';\n"}]}, {"id": "brin-index", "title": "BRIN: a tiny index, with a precondition", "goal": "perf.order_events is an event log written in time order (like a log file), so its order on disk matches event_time.\nperf.orders_big's order_date was written in random order. Create a BRIN index on each table and compare.\n", "question": "Both tables have a BRIN index. Do A and B both use it? Then create a B-tree and compare the sizes.", "takeaway": "BRIN (Block Range Index) doesn't record every row, only \"the min and max of each range of disk blocks\", so it's astonishingly small (tens of KB versus tens of MB for a B-tree).\norder_events is written in time order, so each block range covers a narrow time span, and querying one day reads only a few ranges (see the Heap Blocks: lossy line).\norders_big is in random order, so every block range spans several years; BRIN can't skip any block, and the optimizer simply ignores it and scans the whole table.\n★ BRIN suits large tables that are \"append-only and correlated with time\": logs, IoT sensor data, transaction records. TimescaleDB relies heavily on this property too.\n", "setup": ["CREATE INDEX idx_events_brin ON perf.order_events USING brin (event_time);", "CREATE INDEX idx_orders_brin ON perf.orders_big USING brin (order_date);", "CREATE INDEX idx_events_btree ON perf.order_events (event_time);"], "queries": [{"label": "A: one day of order_events", "code": "EXPLAIN ANALYZE\nSELECT count(*)\nFROM perf.order_events\nWHERE event_time >= '2026-01-01' AND event_time < '2026-01-02';\n"}, {"label": "B: one day of orders_big", "code": "EXPLAIN ANALYZE\nSELECT count(*)\nFROM perf.orders_big\nWHERE order_date >= '2026-01-01' AND order_date < '2026-01-02';\n"}]}, {"id": "gin-jsonb", "title": "GIN: indexing JSONB", "goal": "order_events.meta is JSONB, e.g. {\"channel\": \"app\", \"device\": \"ios\", \"coupon\": \"VIP2026\"}.\nOnly about one event in a thousand used the VIP2026 coupon. Compare the two ways of writing the query before and after creating a GIN index.\n", "question": "After creating the GIN index, did both A and B get faster?", "takeaway": "GIN (Generalized Inverted Index) is an \"inverted index\": it splits every key/value in the JSON and every element of an array, and records which rows they appear in.\nIt supports the @>, ?, ?| and ?& operators, so A becomes a Bitmap Index Scan; B's ->> with = isn't supported, so it's still a full table scan.\n★ To use GIN, write @>. If one key is queried very often, you can also give it a B-tree expression index: CREATE INDEX ON … ((meta->>'coupon')).\n@> and && on text[] arrays use GIN as well. Full-text search and pg_trgm fuzzy search are GIN applications too (an inverted index is also the core of Elasticsearch).\n", "setup": ["CREATE INDEX idx_events_meta ON perf.order_events USING gin (meta);"], "queries": [{"label": "A: containment with @>", "code": "EXPLAIN ANALYZE\nSELECT count(*)\nFROM perf.order_events\nWHERE meta @> '{\"coupon\": \"VIP2026\"}';\n"}, {"label": "B: extract with ->> and compare", "code": "EXPLAIN ANALYZE\nSELECT count(*)\nFROM perf.order_events\nWHERE meta->>'coupon' = 'VIP2026';\n"}]}]}, {"id": "redis", "name": "Redis", "lang": "redis", "labName": null, "labNote": null, "hasResults": true, "exercises": [{"id": "str-get", "chapter": "String", "title": "Read the total number of orders", "prompt": "The total number of orders is stored in the String stats:orders:total. Read it.\n", "hints": ["GET key"], "answer": "GET stats:orders:total\n", "explanation": "String is Redis's most basic type. The value can be text, a number, or serialized JSON, up to 512 MB.\nRedis keys are conventionally layered with colons: object-type:id:field, e.g. stats:orders:total, product:540.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET stats:orders:total", "text": "\"80000\"", "error": false}]}, {"id": "str-incr", "chapter": "String", "title": "Increment a counter (INCR)", "prompt": "Another order was placed. Add 1 to stats:orders:total and get the value after the increment.\nUse a single command.\n", "hints": ["INCR key adds 1 to the number and returns the new value."], "answer": "INCR stats:orders:total\n", "explanation": "★ INCR is atomic: even if 1000 requests increment at once, the result is always correct.\nWith GET → +1 in your code → SET, two requests can read the same value and the total only goes up by 1 (the \"stock deduction\" lab demonstrates this).\nRelated commands: INCRBY key 10, DECR, INCRBYFLOAT.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "INCR stats:orders:total", "text": "(integer) 80001", "error": false}]}, {"id": "str-session", "chapter": "String", "title": "Create a session that expires in 30 minutes", "prompt": "A user logged in. Create session:zz9 with the value customer:42, expiring automatically after 30 minutes.\nUse one command (not SET and EXPIRE separately).\n", "hints": ["SET key value EX seconds"], "answer": "SET session:zz9 customer:42 EX 1800\n", "explanation": "SET's EX (seconds) / PX (milliseconds) options set the expiry at the same time as the write, as one atomic operation.\nWith SET + EXPIRE as two commands, if the program crashes in between you're left with a key that never expires.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "SET session:zz9 customer:42 EX 1800", "text": "\"OK\"", "error": false}], "checks": [{"cmd": "GET session:zz9", "text": "\"customer:42\"", "error": false}, {"cmd": "TTL session:zz9", "text": "(integer) 1800", "error": false}]}, {"id": "str-lock", "chapter": "String", "title": "Acquire a lock (SET NX)", "prompt": "The lock for order 1, lock:order:1, is currently held by worker-b (already set up for you, expiring in 30 seconds).\nNow worker-a wants the lock too: write worker-a only if the key doesn't exist, expiring in 10 seconds.\nNote: worker-b's existing lock must not be affected.\n", "hints": ["SET key value NX EX seconds: NX = write only if the key doesn't exist.", "When the lock isn't acquired it returns nil."], "answer": "SET lock:order:1 worker-a NX EX 10\n", "explanation": "★ The basic distributed lock: SET key token NX EX/PX.\nA common mistake is SETNX followed by EXPIRE: SETNX fails, but the EXPIRE that follows changes worker-b's lock to expire in 10 seconds, tampering with someone else's lock.\n(Try submitting SETNX + EXPIRE once and see what the grader says.)\nReleasing a lock has a trap too: you can't just DEL; first check the value is still your own token (shown in the lab).\n", "ordered": true, "write": true, "setup": "SET lock:order:1 worker-b EX 30\n", "result": [{"cmd": "SET lock:order:1 worker-a NX EX 10", "text": "(nil)", "error": false}], "checks": [{"cmd": "GET lock:order:1", "text": "\"worker-b\"", "error": false}, {"cmd": "TTL lock:order:1", "text": "(integer) 30", "error": false}]}, {"id": "hash-getall", "chapter": "Hash", "title": "All fields of product 540", "prompt": "Product data is stored as a Hash in product:{id}. Read every field and value of product:540.\n", "hints": ["HGETALL key"], "answer": "HGETALL product:540\n", "explanation": "HGETALL returns an array alternating \"field, value, field, value…\".\n★ Don't use HGETALL on a huge Hash (tens of thousands of fields): it blocks Redis. Read it in batches with HSCAN, or read only the fields you need.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "HGETALL product:540", "text": "1) \"name\"\n2) \"Sony 手機 I447\"\n3) \"price\"\n4) \"29949.00\"\n5) \"stock\"\n6) \"11\"\n7) \"category\"\n8) \"手機\"", "error": false}]}, {"id": "hash-hmget", "chapter": "Hash", "title": "Read only the fields you need", "prompt": "You only need customer 1's name (name) and city (city). Read these two fields with one command.\n", "hints": ["HMGET key field1 field2"], "answer": "HMGET customer:1 name city\n", "explanation": "HMGET returns values in the order you gave the fields; a missing field gives nil at that position.\nThe advantage of caching objects as a Hash rather than one JSON String: you can read or change just a few fields.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "HMGET customer:1 name city", "text": "1) \"葉承文\"\n2) \"台中市\"", "error": false}]}, {"id": "hash-hincrby", "chapter": "Hash", "title": "Deduct stock (HINCRBY)", "prompt": "Two units of product 540 were sold. Subtract 2 from the stock field and return the new stock.\n", "hints": ["HINCRBY key field increment; the increment can be negative."], "answer": "HINCRBY product:540 stock -2\n", "explanation": "HINCRBY is atomic like INCR, so it suits counter fields (stock, likes, views).\nBut it doesn't check for \"going below zero\"; \"deduct only if there's enough stock\" needs a Lua script or WATCH (shown in the stock deduction lab).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "HINCRBY product:540 stock -2", "text": "(integer) 9", "error": false}], "checks": [{"cmd": "HGET product:540 stock", "text": "\"9\"", "error": false}]}, {"id": "hash-hset-new-field", "chapter": "Hash", "title": "Add a new field", "prompt": "Add a phone field to customer 1, with the value 0912345678.\n", "hints": ["HSET key field value; it returns \"how many fields were added\"."], "answer": "HSET customer:1 phone 0912345678\n", "explanation": "HSET returns the number of new fields: if the field already existed and only its value changed, it returns 0.\nSince Redis 7.4 you can set an expiry on a single field: HEXPIRE key seconds FIELDS 1 field.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "HSET customer:1 phone 0912345678", "text": "(integer) 1", "error": false}], "checks": [{"cmd": "HGET customer:1 phone", "text": "\"0912345678\"", "error": false}, {"cmd": "HLEN customer:1", "text": "(integer) 4", "error": false}]}, {"id": "list-lrange", "chapter": "List", "title": "The 3 most recent orders", "prompt": "customer:1:recent_orders holds customer 1's most recent order ids; index 0 is the newest.\nRead the newest 3.\n", "hints": ["LRANGE key start stop; stop is inclusive."], "answer": "LRANGE customer:1:recent_orders 0 2\n", "explanation": "★ LRANGE's stop is \"inclusive\": 0 2 is 3 items (Java's subList is exclusive).\n-1 means the last element, so LRANGE key 0 -1 is everything.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "LRANGE customer:1:recent_orders 0 2", "text": "1) \"77621\"\n2) \"75279\"\n3) \"72474\"", "error": false}]}, {"id": "list-push-trim", "chapter": "List", "title": "Put the new order first and keep only 10", "prompt": "Customer 1 just placed order 90001. Put it at the front of customer:1:recent_orders,\nand keep only the newest 10 in the whole List.\n", "hints": ["LPUSH pushes from the left (the front).", "LTRIM key 0 9 keeps only indexes 0–9."], "answer": "LPUSH customer:1:recent_orders 90001\nLTRIM customer:1:recent_orders 0 9\n", "explanation": "LPUSH + LTRIM is the standard \"fixed-length latest list\": activity feeds, recently viewed, the last N log lines.\nTo make both commands succeed together, wrap them in MULTI / EXEC, or send them at once in a pipeline.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "LPUSH customer:1:recent_orders 90001", "text": "(integer) 11", "error": false}, {"cmd": "LTRIM customer:1:recent_orders 0 9", "text": "\"OK\"", "error": false}], "checks": [{"cmd": "LLEN customer:1:recent_orders", "text": "(integer) 10", "error": false}, {"cmd": "LRANGE customer:1:recent_orders 0 -1", "text": " 1) \"90001\"\n 2) \"77621\"\n 3) \"75279\"\n 4) \"72474\"\n 5) \"71990\"\n 6) \"69841\"\n 7) \"68384\"\n 8) \"67888\"\n 9) \"67758\"\n10) \"67315\"", "error": false}]}, {"id": "set-scard", "chapter": "Set", "title": "How many products are on sale", "prompt": "tag:特價 is a Set of the ids of products tagged 「特價」 (on sale). How many are there?\n", "hints": ["SCARD key returns the number of elements in a Set."], "answer": "SCARD tag:特價\n", "explanation": "SCARD is O(1); there's no need to read the whole Set and count.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SCARD tag:特價", "text": "(integer) 303", "error": false}]}, {"id": "set-sinter", "chapter": "Set", "title": "Best-selling and limited (SINTER)", "prompt": "Which product ids have both the 「熱銷」 (best seller) and 「限量」 (limited edition) tags?\n", "hints": ["SINTER key1 key2 takes the intersection."], "answer": "SINTER tag:熱銷 tag:限量\n", "explanation": "Sets have no order, so this exercise ignores order. SINTER is intersection, SUNION union, SDIFF difference.\nIf you only need the count, use SINTERCARD 2 key1 key2 so the result isn't sent back.\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "SINTER tag:熱銷 tag:限量", "text": " 1) \"77\"\n 2) \"84\"\n 3) \"100\"\n 4) \"112\"\n 5) \"116\"\n 6) \"215\"\n 7) \"251\"\n 8) \"270\"\n 9) \"472\"\n10) \"488\"\n11) \"588\"\n12) \"681\"\n13) \"696\"\n14) \"705\"\n15) \"980\"\n16) \"1007\"\n17) \"1014\"\n18) \"1038\"\n19) \"1190\"\n20) \"1445\"\n21) \"1457\"", "error": false}]}, {"id": "set-sismember", "chapter": "Set", "title": "Is product 540 a best seller?", "prompt": "Check whether product 540 has the 「熱銷」 (best seller) tag.\n", "hints": ["SISMEMBER key member: 1 if it's there, 0 if not."], "answer": "SISMEMBER tag:熱銷 540\n", "explanation": "SISMEMBER is O(1). Typical uses: whether a user already liked something, already claimed a coupon, or is on a blocklist.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SISMEMBER tag:熱銷 540", "text": "(integer) 0", "error": false}]}, {"id": "set-sdiffstore", "chapter": "Set", "title": "Best sellers that aren't on sale", "prompt": "How many products have the 「熱銷」 (best seller) tag but not the 「特價」 (on sale) tag? The last command must return this number.\n", "hints": ["SDIFF returns the whole list of ids; for the count, SDIFFSTORE stores the result in a new key and returns the number of elements."], "answer": "SDIFFSTORE tmp:hot-not-sale tag:熱銷 tag:特價\n", "explanation": "SDIFF A B = in A but not in B. The *STORE versions (SINTERSTORE, SUNIONSTORE, SDIFFSTORE) store the result and return the count,\nwhich suits \"compute once, reuse later\". Remember to set an expiry on the temporary key.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SDIFFSTORE tmp:hot-not-sale tag:熱銷 tag:特價", "text": "(integer) 307", "error": false}]}, {"id": "zset-top5", "chapter": "Sorted Set", "title": "Top 5 by sales (leaderboard)", "prompt": "leaderboard:products:sales ranks products by sales; score = units sold.\nList the 5 best-selling product ids with their unit counts, highest first.\n", "hints": ["ZRANGE key 0 4 REV WITHSCORES (before Redis 6.2, ZREVRANGE key 0 4 WITHSCORES)"], "answer": "ZRANGE leaderboard:products:sales 0 4 REV WITHSCORES\n", "explanation": "★ Leaderboards are the classic Sorted Set use: updating a score is O(log N), getting the top N is O(log N + N).\nA SQL leaderboard has to ORDER BY the whole table every time; in Redis it's always already sorted.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "ZRANGE leaderboard:products:sales 0 4 REV WITHSCORES", "text": " 1) \"1\"\n 2) \"1371\"\n 3) \"2\"\n 4) \"883\"\n 5) \"3\"\n 6) \"684\"\n 7) \"4\"\n 8) \"683\"\n 9) \"5\"\n10) \"578\"", "error": false}]}, {"id": "zset-rank", "chapter": "Sorted Set", "title": "Customer 1's spending rank", "prompt": "leaderboard:customers:spend ranks customers by total spend. What rank is customer 1 (more spending = higher rank)?\nJust return the rank Redis gives you.\n", "hints": ["ZREVRANK key member: rank by score, highest first."], "answer": "ZREVRANK leaderboard:customers:spend 1\n", "explanation": "★ Ranks start at 0: first place returns 0. Add 1 when displaying it.\nZRANK ranks from lowest to highest; since Redis 7.2 you can add WITHSCORE to get the score too.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "ZREVRANK leaderboard:customers:spend 1", "text": "(integer) 0", "error": false}]}, {"id": "zset-count", "chapter": "Sorted Set", "title": "Customers who spent between 50k and 100k", "prompt": "How many customers have a total spend between 50000 and 100000 (inclusive)?\n", "hints": ["ZCOUNT key min max"], "answer": "ZCOUNT leaderboard:customers:spend 50000 100000\n", "explanation": "ZCOUNT counts by score range in O(log N). For exclusive bounds write (50000 (100000.\nTo fetch members by score range, use ZRANGE key 50000 100000 BYSCORE.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "ZCOUNT leaderboard:customers:spend 50000 100000", "text": "(integer) 3859", "error": false}]}, {"id": "zset-incr", "chapter": "Sorted Set", "title": "Update the leaderboard after a purchase", "prompt": "Customer 1 completed another order worth 1200. Update their score in leaderboard:customers:spend and return the new score.\n", "hints": ["ZINCRBY key increment member"], "answer": "ZINCRBY leaderboard:customers:spend 1200 1\n", "explanation": "ZINCRBY increases the score atomically and the ranking updates automatically. If the member doesn't exist it's added, starting from 0.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "ZINCRBY leaderboard:customers:spend 1200 1", "text": "\"1711502\"", "error": false}], "checks": [{"cmd": "ZSCORE leaderboard:customers:spend 1", "text": "\"1711502\"", "error": false}]}, {"id": "stream-len", "chapter": "Stream", "title": "How many events are in the stream", "prompt": "orders:stream is the order event stream. How many events does it currently have?\n", "hints": ["XLEN key"], "answer": "XLEN orders:stream\n", "explanation": "Stream, added in Redis 5.0, is an \"append-only log\" that can serve as a lightweight message queue (similar to Kafka).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "XLEN orders:stream", "text": "(integer) 1000", "error": false}]}, {"id": "stream-latest", "chapter": "Stream", "title": "The latest 3 events", "prompt": "Read the latest 3 events from orders:stream (newest first).\n", "hints": ["XREVRANGE key + - COUNT 3: + is the largest ID, - the smallest."], "answer": "XREVRANGE orders:stream + - COUNT 3\n", "explanation": "Stream IDs have the format \"millisecond-timestamp-sequence\". The IDs in this data use the order time, so you can query by time range directly.\nConsumer groups (XGROUP, XREADGROUP, XACK) let several workers share the work, with acknowledgements so messages aren't lost.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "XREVRANGE orders:stream + - COUNT 3", "text": "1) 1) \"1790783714815-0\"\n   2)  1) \"order_id\"\n       2) \"80000\"\n       3) \"customer_id\"\n       4) \"16414\"\n       5) \"status\"\n       6) \"pending\"\n       7) \"city\"\n       8) \"嘉義市\"\n       9) \"amount\"\n      10) \"63765\"\n2) 1) \"1790783381158-0\"\n   2)  1) \"order_id\"\n       2) \"79999\"\n       3) \"customer_id\"\n       4) \"18481\"\n       5) \"status\"\n       6) \"shipped\"\n       7) \"city\"\n       8) \"桃園市\"\n       9) \"amount\"\n      10) \"142\"\n3) 1) \"1790783171820-0\"\n   2)  1) \"order_id\"\n       2) \"79998\"\n       3) \"customer_id\"\n       4) \"18397\"\n       5) \"status\"\n       6) \"paid\"\n       7) \"city\"\n       8) \"桃園市\"\n       9) \"amount\"\n      10) \"4559\"", "error": false}]}, {"id": "bitmap-count", "chapter": "Bitmap / HyperLogLog", "title": "How many customers ordered on 9/1 (Bitmap)", "prompt": "active:2026-09-01 is a Bitmap: bit N is 1 if customer N placed an order that day.\nCount how many customers ordered on September 1.\n", "hints": ["BITCOUNT key counts the bits set to 1."], "answer": "BITCOUNT active:2026-09-01\n", "explanation": "20,000 customers need only 20,000 bits ≈ 2.5 KB. A Set of 20,000 ids would take hundreds of KB.\nTypical uses: daily check-ins, daily active users, feature flags.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "BITCOUNT active:2026-09-01", "text": "(integer) 87", "error": false}]}, {"id": "bitmap-and", "chapter": "Bitmap / HyperLogLog", "title": "Customers who ordered on both 9/1 and 9/2", "prompt": "How many customers placed orders on \"both\" September 1 and September 2? The last command must return this number.\n", "hints": ["BITOP AND destkey src1 src2: AND the two Bitmaps bit by bit and store the result in destkey.", "Then count the result with BITCOUNT."], "answer": "BITOP AND tmp:both active:2026-09-01 active:2026-09-02\nBITCOUNT tmp:both\n", "explanation": "BITOP supports AND, OR, XOR and NOT. \"Checked in 7 days in a row\" is an AND of 7 Bitmaps.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "BITOP AND tmp:both active:2026-09-01 active:2026-09-02", "text": "(integer) 2370", "error": false}, {"cmd": "BITCOUNT tmp:both", "text": "(integer) 1", "error": false}]}, {"id": "hll-week", "chapter": "Bitmap / HyperLogLog", "title": "Unique customers who ordered 9/1–9/7 (HyperLogLog)", "prompt": "uv:{date} is a daily HyperLogLog of customers who ordered. Estimate the number of \"unique\" customers who ordered from September 1 to September 7.\n", "hints": ["PFCOUNT accepts several keys at once and counts the unique elements of their \"union\"."], "answer": "PFCOUNT uv:2026-09-01 uv:2026-09-02 uv:2026-09-03 uv:2026-09-04 uv:2026-09-05 uv:2026-09-06 uv:2026-09-07\n", "explanation": "★ HyperLogLog estimates distinct counts with at most 12 KB, with a standard error of about 0.81%. It can't list who, only how many.\nIt suits statistics like UV (unique visitors) that are \"huge and tolerate a small error\". For exact numbers use a Bitmap or a Set.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "PFCOUNT uv:2026-09-01 uv:2026-09-02 uv:2026-09-03 uv:2026-09-04 uv:2026-09-05 uv:2026-09-06 uv:2026-09-07", "text": "(integer) 626", "error": false}]}, {"id": "geo-dist", "chapter": "Geo", "title": "Distance from Taipei to Kaohsiung", "prompt": "store:locations holds the coordinates of the stores in each city. What is the straight-line distance in km from the 台北市 (Taipei) store to the 高雄市 (Kaohsiung) store?\n", "hints": ["GEODIST key member1 member2 km"], "answer": "GEODIST store:locations 台北市 高雄市 km\n", "explanation": "Geo is a Sorted Set underneath: latitude/longitude are encoded as a geohash used as the score, so ZRANGE and ZREM also work on Geo keys.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GEODIST store:locations 台北市 高雄市 km", "text": "\"296.8716\"", "error": false}]}, {"id": "geo-search", "chapter": "Geo", "title": "Stores within 60 km of Taipei", "prompt": "Find every store within 60 km of the 台北市 (Taipei) store (including Taipei itself), nearest first. Store names only.\n", "hints": ["GEOSEARCH key FROMMEMBER 台北市 BYRADIUS 60 km ASC"], "answer": "GEOSEARCH store:locations FROMMEMBER 台北市 BYRADIUS 60 km ASC\n", "explanation": "GEOSEARCH (Redis 6.2+) replaces the old GEORADIUS. You can also search from any coordinates with FROMLONLAT, or within a rectangle with BYBOX.\nAdding WITHDIST returns the distances as well. \"Stores near me\" on delivery apps is queried just like this.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GEOSEARCH store:locations FROMMEMBER 台北市 BYRADIUS 60 km ASC", "text": "1) \"台北市\"\n2) \"新北市\"\n3) \"基隆市\"\n4) \"桃園市\"\n5) \"宜蘭縣\"\n6) \"新竹縣\"", "error": false}]}, {"id": "multi-exec", "chapter": "Transactions", "title": "Do two things together (MULTI / EXEC)", "prompt": "Customer 1 placed order 90001. Use a transaction to run these two things together:\n1. Add 1 to stats:orders:total\n2. Put 90001 at the front of customer:1:recent_orders\n", "hints": ["MULTI starts a transaction; the following commands are queued (returning QUEUED) and only run together at EXEC."], "answer": "MULTI\nINCR stats:orders:total\nLPUSH customer:1:recent_orders 90001\nEXEC\n", "explanation": "★ A Redis transaction guarantees that \"no other client's commands run in between\", but not all-or-nothing:\nif one command fails at EXEC, the others still take effect; there's no ROLLBACK (shown in the traps).\nWhen you need \"run only if a condition holds\", use WATCH (optimistic locking) or a Lua script.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MULTI", "text": "\"OK\"", "error": false}, {"cmd": "INCR stats:orders:total", "text": "\"QUEUED\"", "error": false}, {"cmd": "LPUSH customer:1:recent_orders 90001", "text": "\"QUEUED\"", "error": false}, {"cmd": "EXEC", "text": "1) (integer) 80001\n2) (integer) 11", "error": false}], "checks": [{"cmd": "GET stats:orders:total", "text": "\"80001\"", "error": false}, {"cmd": "LINDEX customer:1:recent_orders 0", "text": "\"90001\"", "error": false}]}], "traps": [{"id": "multi-no-rollback", "title": "Does a failed transaction ROLLBACK?", "question": "In A's transaction the HSET fails (a is a String, not a Hash). What is a after EXEC?", "options": ["1: the whole transaction is rolled back", "2: the other commands still take effect", "The whole EXEC is rejected and nothing happens"], "answer": 1, "explanation": "★ Redis transactions have no ROLLBACK. There are two cases:\nA: the command is well-formed but fails at run time (e.g. wrong type): only that command fails, the others take effect, so a = 2, b = 3.\nB: a syntax error is detected while queuing: EXEC returns EXECABORT, the whole transaction is skipped, and a is still 1.\nThe official reasoning is that \"run-time errors are programming mistakes and should be caught during development\". Use a Lua script when you need all-or-nothing.\n", "setup": "SET a 1\n", "scripts": [{"label": "A: fails at run time (wrong type)", "code": "MULTI\nSET a 2\nHSET a field value\nSET b 3\nEXEC\nGET a\nGET b\n"}, {"label": "B: fails while queuing (syntax error)", "code": "MULTI\nSET a 2\nSET\nSET b 3\nEXEC\nGET a\nGET b\n"}], "results": [[{"cmd": "MULTI", "text": "\"OK\"", "error": false}, {"cmd": "SET a 2", "text": "\"QUEUED\"", "error": false}, {"cmd": "HSET a field value", "text": "\"QUEUED\"", "error": false}, {"cmd": "SET b 3", "text": "\"QUEUED\"", "error": false}, {"cmd": "EXEC", "text": "1) \"OK\"\n2) (error) WRONGTYPE Operation against a key holding the wrong kind of value\n3) \"OK\"", "error": false}, {"cmd": "GET a", "text": "\"2\"", "error": false}, {"cmd": "GET b", "text": "\"3\"", "error": false}], [{"cmd": "MULTI", "text": "\"OK\"", "error": false}, {"cmd": "SET a 2", "text": "\"QUEUED\"", "error": false}, {"cmd": "SET", "text": "(error) ERR wrong number of arguments for 'set' command", "error": true}, {"cmd": "SET b 3", "text": "\"QUEUED\"", "error": false}, {"cmd": "EXEC", "text": "(error) EXECABORT Transaction discarded because of previous errors.", "error": true}, {"cmd": "GET a", "text": "\"1\"", "error": false}, {"cmd": "GET b", "text": "(nil)", "error": false}]]}, {"id": "set-drops-ttl", "title": "SET clears the expiry", "question": "A first SETs a key that expires in 100 seconds, then SETs a new value. What is the final TTL?", "options": ["About 100", "-1 (no expiry)", "-2 (the key doesn't exist)"], "answer": 1, "explanation": "★ SET overwrites the whole key, including its expiry. This bites cache updates easily:\na cache entry that should expire in 30 minutes becomes permanent after one \"SET new value\", and eventually memory runs out.\nWhen updating, pass EX again, or use KEEPTTL (Redis 6.0+) to keep the existing expiry.\n\"Modifying\" commands like INCR, HSET and LPUSH don't touch the TTL; only SET and GETSET, which replace the whole value, do.\n", "setup": null, "scripts": [{"label": "A: SET again", "code": "SET k v1 EX 100\nSET k v2\nTTL k\n"}, {"label": "B: with KEEPTTL", "code": "SET k v1 EX 100\nSET k v2 KEEPTTL\nTTL k\n"}], "results": [[{"cmd": "SET k v1 EX 100", "text": "\"OK\"", "error": false}, {"cmd": "SET k v2", "text": "\"OK\"", "error": false}, {"cmd": "TTL k", "text": "(integer) -1", "error": false}], [{"cmd": "SET k v1 EX 100", "text": "\"OK\"", "error": false}, {"cmd": "SET k v2 KEEPTTL", "text": "\"OK\"", "error": false}, {"cmd": "TTL k", "text": "(integer) 100", "error": false}]]}, {"id": "ttl-codes", "title": "TTL's -1 and -2", "question": "What does TTL return for a key that \"doesn't exist\"?", "options": ["-1", "-2", "0", "nil"], "answer": 1, "explanation": "-2: the key doesn't exist (or already expired and was deleted).\n-1: the key exists but has no expiry.\nA positive number: seconds remaining. PTTL is the millisecond version with the same rules.\n", "setup": null, "scripts": [{"label": "A: a key that doesn't exist", "code": "TTL no-such-key\n"}, {"label": "B: exists, but has no expiry", "code": "SET k v\nTTL k\n"}], "results": [[{"cmd": "TTL no-such-key", "text": "(integer) -2", "error": false}], [{"cmd": "SET k v", "text": "\"OK\"", "error": false}, {"cmd": "TTL k", "text": "(integer) -1", "error": false}]]}, {"id": "list-range-inclusive", "title": "LRANGE's end is inclusive", "question": "A List has 12 elements. How many does LRANGE list 0 10 return?", "options": ["10", "11", "12"], "answer": 1, "explanation": "The end of LRANGE, ZRANGE and GETRANGE is \"inclusive\": 0 10 is 11 elements.\nThat's the opposite of Java's subList(0, 10) and Python's list[0:10] (end exclusive), so pagination is where off-by-one errors happen.\n-1 means the last element, so 0 -1 is everything.\n", "setup": "RPUSH list a b c d e f g h i j k l\n", "scripts": [{"label": "A: LRANGE list 0 10", "code": "LRANGE list 0 10\n"}, {"label": "B: LRANGE list 0 -1", "code": "LRANGE list 0 -1\n"}], "results": [[{"cmd": "LRANGE list 0 10", "text": " 1) \"a\"\n 2) \"b\"\n 3) \"c\"\n 4) \"d\"\n 5) \"e\"\n 6) \"f\"\n 7) \"g\"\n 8) \"h\"\n 9) \"i\"\n10) \"j\"\n11) \"k\"", "error": false}], [{"cmd": "LRANGE list 0 -1", "text": " 1) \"a\"\n 2) \"b\"\n 3) \"c\"\n 4) \"d\"\n 5) \"e\"\n 6) \"f\"\n 7) \"g\"\n 8) \"h\"\n 9) \"i\"\n10) \"j\"\n11) \"k\"\n12) \"l\"", "error": false}]]}, {"id": "zset-tie-order", "title": "Order on equal scores", "question": "alice, bob and carol all have 100 points. In A, sorted highest first (REV), what order are the three tied members in?", "options": ["Insertion order: alice, bob, carol", "Reverse name order: carol, bob, alice", "It differs on every run"], "answer": 1, "explanation": "On equal scores a Sorted Set orders members lexicographically; REV reverses everything, giving carol, bob, alice.\nFor a leaderboard where \"whoever got there first ranks higher on a tie\", the usual trick is to encode time into the score: score = points × 10^10 + (a large number − timestamp).\n", "setup": "ZADD board 100 alice 100 bob 100 carol 90 dave\n", "scripts": [{"label": "A: highest first (REV)", "code": "ZRANGE board 0 -1 REV WITHSCORES\n"}, {"label": "B: lowest first", "code": "ZRANGE board 0 -1 WITHSCORES\n"}], "results": [[{"cmd": "ZRANGE board 0 -1 REV WITHSCORES", "text": "1) \"carol\"\n2) \"100\"\n3) \"bob\"\n4) \"100\"\n5) \"alice\"\n6) \"100\"\n7) \"dave\"\n8) \"90\"", "error": false}], [{"cmd": "ZRANGE board 0 -1 WITHSCORES", "text": "1) \"dave\"\n2) \"90\"\n3) \"alice\"\n4) \"100\"\n5) \"bob\"\n6) \"100\"\n7) \"carol\"\n8) \"100\"", "error": false}]]}, {"id": "get-wrong-type", "title": "Reading a type with the wrong command", "question": "product:540 is a Hash. What does GET on it return?", "options": ["nil", "A WRONGTYPE error", "The contents of the whole Hash"], "answer": 1, "explanation": "Every key has a fixed type, and a command for the wrong type gets a WRONGTYPE error. When unsure, check with TYPE key first.\nThe most common case in Java: using opsForValue() on a key one moment and opsForHash() the next.\n", "setup": null, "scripts": [{"label": "A: GET", "code": "GET product:540\nTYPE product:540\n"}, {"label": "B: HGETALL", "code": "HGETALL product:540\n"}], "results": [[{"cmd": "GET product:540", "text": "(error) WRONGTYPE Operation against a key holding the wrong kind of value", "error": true}, {"cmd": "TYPE product:540", "text": "\"hash\"", "error": false}], [{"cmd": "HGETALL product:540", "text": "1) \"name\"\n2) \"Sony 手機 I447\"\n3) \"price\"\n4) \"29949.00\"\n5) \"stock\"\n6) \"11\"\n7) \"category\"\n8) \"手機\"", "error": false}]]}, {"id": "hll-is-estimate", "title": "HyperLogLog is an estimate", "question": "Merging 30 days of September with HyperLogLog to estimate \"unique customers who ordered in September\". Is it the same as the exact value from a Bitmap?", "options": ["Exactly the same", "Very close, with a small error", "Far off"], "answer": 1, "explanation": "HyperLogLog is a probabilistic algorithm with a standard error of about 0.81%; with little data it's often exactly right, and the error shows as the volume grows.\nIn exchange its memory is fixed: whether counting a thousand people or a hundred million, one HyperLogLog takes at most 12 KB.\nA Bitmap is exact, but its size is proportional to \"the largest id\": ids up to 100 million need 12 MB.\nA common interview question is \"how do you count daily UV\": a Set for small volumes, a Bitmap for sequential ids, HyperLogLog for huge volumes where some error is acceptable.\n", "setup": null, "scripts": [{"label": "A: HyperLogLog estimate", "code": "PFMERGE uv:2026-09 uv:2026-09-01 uv:2026-09-02 uv:2026-09-03 uv:2026-09-04 uv:2026-09-05 uv:2026-09-06 uv:2026-09-07 uv:2026-09-08 uv:2026-09-09 uv:2026-09-10 uv:2026-09-11 uv:2026-09-12 uv:2026-09-13 uv:2026-09-14 uv:2026-09-15 uv:2026-09-16 uv:2026-09-17 uv:2026-09-18 uv:2026-09-19 uv:2026-09-20 uv:2026-09-21 uv:2026-09-22 uv:2026-09-23 uv:2026-09-24 uv:2026-09-25 uv:2026-09-26 uv:2026-09-27 uv:2026-09-28 uv:2026-09-29 uv:2026-09-30\nPFCOUNT uv:2026-09\nMEMORY USAGE uv:2026-09\n"}, {"label": "B: exact Bitmap count", "code": "BITOP OR active:2026-09 active:2026-09-01 active:2026-09-02 active:2026-09-03 active:2026-09-04 active:2026-09-05 active:2026-09-06 active:2026-09-07 active:2026-09-08 active:2026-09-09 active:2026-09-10 active:2026-09-11 active:2026-09-12 active:2026-09-13 active:2026-09-14 active:2026-09-15 active:2026-09-16 active:2026-09-17 active:2026-09-18 active:2026-09-19 active:2026-09-20 active:2026-09-21 active:2026-09-22 active:2026-09-23 active:2026-09-24 active:2026-09-25 active:2026-09-26 active:2026-09-27 active:2026-09-28 active:2026-09-29 active:2026-09-30\nBITCOUNT active:2026-09\nMEMORY USAGE active:2026-09\n"}], "results": [[{"cmd": "PFMERGE uv:2026-09 uv:2026-09-01 uv:2026-09-02 uv:2026-09-03 uv:2026-09-04 uv:2026-09-05 uv:2026-09-06 uv:2026-09-07 uv:2026-09-08 uv:2026-09-09 uv:2026-09-10 uv:2026-09-11 uv:2026-09-12 uv:2026-09-13 uv:2026-09-14 uv:2026-09-15 uv:2026-09-16 uv:2026-09-17 uv:2026-09-18 uv:2026-09-19 uv:2026-09-20 uv:2026-09-21 uv:2026-09-22 uv:2026-09-23 uv:2026-09-24 uv:2026-09-25 uv:2026-09-26 uv:2026-09-27 uv:2026-09-28 uv:2026-09-29 uv:2026-09-30", "text": "\"OK\"", "error": false}, {"cmd": "PFCOUNT uv:2026-09", "text": "(integer) 2658", "error": false}, {"cmd": "MEMORY USAGE uv:2026-09", "text": "(integer) 14392", "error": false}], [{"cmd": "BITOP OR active:2026-09 active:2026-09-01 active:2026-09-02 active:2026-09-03 active:2026-09-04 active:2026-09-05 active:2026-09-06 active:2026-09-07 active:2026-09-08 active:2026-09-09 active:2026-09-10 active:2026-09-11 active:2026-09-12 active:2026-09-13 active:2026-09-14 active:2026-09-15 active:2026-09-16 active:2026-09-17 active:2026-09-18 active:2026-09-19 active:2026-09-20 active:2026-09-21 active:2026-09-22 active:2026-09-23 active:2026-09-24 active:2026-09-25 active:2026-09-26 active:2026-09-27 active:2026-09-28 active:2026-09-29 active:2026-09-30", "text": "(integer) 2375", "error": false}, {"cmd": "BITCOUNT active:2026-09", "text": "(integer) 2660", "error": false}, {"cmd": "MEMORY USAGE active:2026-09", "text": "(integer) 2616", "error": false}]]}, {"id": "keys-vs-scan", "title": "KEYS vs SCAN", "question": "A and B both look for keys starting with product:99. Does B's SCAN return every matching key in one call?", "options": ["Yes, the same as KEYS", "Not necessarily; keep scanning with the returned cursor until it's back to 0", "It raises an error"], "answer": 1, "explanation": "★ KEYS scans every key at once (about 40,000 here). Redis runs commands on a single thread, so every other request waits while KEYS runs;\nin production with millions of keys, one KEYS can freeze the service for seconds, which is why the showcase's learner account can't use KEYS at all.\nSCAN looks at a small batch each time (COUNT is \"roughly how many to look at\", not how many to return) and returns [next cursor, matching keys in this batch].\nA batch may contain no matches at all; keep calling with the new cursor until it returns 0 before you're done.\nSCAN may return duplicate keys, so the program has to de-duplicate.\n", "setup": null, "scripts": [{"label": "A: KEYS (scans the whole database)", "code": "KEYS product:99*\nDBSIZE\n"}, {"label": "B: SCAN (from cursor 0, about 100 at a time)", "code": "SCAN 0 MATCH product:99* COUNT 100\n"}], "results": [[{"cmd": "KEYS product:99*", "text": " 1) \"product:999\"\n 2) \"product:993\"\n 3) \"product:996\"\n 4) \"product:997\"\n 5) \"product:998\"\n 6) \"product:99\"\n 7) \"product:994\"\n 8) \"product:990\"\n 9) \"product:995\"\n10) \"product:992\"\n11) \"product:991\"", "error": false}, {"cmd": "DBSIZE", "text": "(integer) 39964", "error": false}], [{"cmd": "SCAN 0 MATCH product:99* COUNT 100", "text": "1) \"28928\"\n2) (empty array)", "error": false}]]}], "steps": []}, {"id": "mongodb", "name": "MongoDB", "lang": "mongo", "labName": "Index lab", "labNote": "The lab uses shop.orders (80,000 orders). Each step first shows explain(\"executionStats\") without an index, then creates the suggested index and runs it again, comparing COLLSCAN / IXSCAN, docsExamined and SORT.", "hasResults": true, "exercises": [{"id": "find-pending", "chapter": "Query basics", "title": "Pending orders", "prompt": "Find orders whose status is pending, showing only _id, customerId and total.\nSort by _id ascending and take the first 5.\n", "hints": ["db.orders.find(filter, projection): the projection is { customerId: 1, total: 1 }; _id is shown by default.", "Then chain .sort({ _id: 1 }).limit(5)"], "answer": "db.orders.find({ status: \"pending\" }, { customerId: 1, total: 1 }).sort({ _id: 1 }).limit(5)\n", "explanation": "find's second argument is the \"projection\", which decides which fields are returned, like the column list in SQL's SELECT.\n1 means include, 0 means exclude; _id is returned by default, write _id: 0 to drop it. Apart from _id, you can't mix 1 and 0 in one projection.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.find({ status: \"pending\" }, { customerId: 1, total: 1 }).sort({ _id: 1 }).limit(5)", "text": "// 5 documents, showing the first 3\n{\n  _id: 78907,\n  customerId: 17631,\n  total: 38\n}\n{\n  _id: 78911,\n  customerId: 18042,\n  total: 4317\n}\n{\n  _id: 78912,\n  customerId: 18476,\n  total: 38580\n}"}]}, {"id": "count-gold", "chapter": "Query basics", "title": "How many gold customers", "prompt": "How many customers have vipLevel gold?\n", "hints": ["db.customers.countDocuments(filter)"], "answer": "db.customers.countDocuments({ vipLevel: \"gold\" })\n", "explanation": "countDocuments really counts by the filter; estimatedDocumentCount() can't take a filter but reads the collection's metadata directly, so it's very fast.\nThe old count() is no longer recommended.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.customers.countDocuments({ vipLevel: \"gold\" })", "text": "891"}]}, {"id": "distinct-city", "chapter": "Query basics", "title": "Which shipping cities exist", "prompt": "List every shipping city (shipping.city) that appears in any order, without duplicates.\n", "hints": ["db.orders.distinct(\"field\"); use dot notation for embedded fields, \"shipping.city\""], "answer": "db.orders.distinct(\"shipping.city\")\n", "explanation": "Fields of embedded documents are accessed with \"dot notation\": shipping.city. It's the same in find filters, projections and sorts; remember the quotes.\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "db.orders.distinct(\"shipping.city\")", "text": "// 15 documents, showing the first 3\n'台中市'\n'台北市'\n'台南市'"}]}, {"id": "find-nested-projection", "chapter": "Query basics", "title": "A product's category path", "prompt": "Look up product 540's name (name) and category path (category.path), without _id.\n", "hints": ["findOne({ _id: 540 }, { _id: 0, name: 1, \"category.path\": 1 })"], "answer": "db.products.findOne({ _id: 540 }, { _id: 0, name: 1, \"category.path\": 1 })\n", "explanation": "The product document stores the category name and full path directly (denormalized), so there's no need to query categories.\nThe cost: when a category is renamed, every product has to be updated too (updateMany). This suits read-heavy, rarely-written data.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.findOne({ _id: 540 }, { _id: 0, name: 1, \"category.path\": 1 })", "text": "{\n  name: 'Sony 手機 I447',\n  category: {\n    path: [ '3C電子', '手機' ]\n  }\n}"}]}, {"id": "price-range", "chapter": "Query operators", "title": "Products priced 1000–2000", "prompt": "How many products have a price (price) between 1000 and 2000 (including 1000 and 2000)?\n", "hints": ["{ price: { $gte: 1000, $lte: 2000 } }"], "answer": "db.products.countDocuments({ price: { $gte: 1000, $lte: 2000 } })\n", "explanation": "Comparison operators: $eq, $ne, $gt, $gte, $lt, $lte, $in, $nin. Several conditions on one field in the same object are ANDed.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.countDocuments({ price: { $gte: 1000, $lte: 2000 } })", "text": "349"}]}, {"id": "status-in", "chapter": "Query operators", "title": "Cancelled or returned orders", "prompt": "How many orders have status cancelled or returned?\n", "hints": ["{ status: { $in: [\"cancelled\", \"returned\"] } }"], "answer": "db.orders.countDocuments({ status: { $in: [\"cancelled\", \"returned\"] } })\n", "explanation": "To match one field against several values, $in is more concise than $or and more likely to use an index.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.countDocuments({ status: { $in: [\"cancelled\", \"returned\"] } })", "text": "14448"}]}, {"id": "or-condition", "chapter": "Query operators", "title": "Gold customers in eastern Taiwan", "prompt": "Customers who live in 花蓮縣 (Hualien) or 台東縣 (Taitung) and are at the gold level.\nShow only name and city (with _id), sorted by _id.\n", "hints": ["Use city: { $in: [...] }, or $or: [ {…}, {…} ]."], "answer": "db.customers.find({ vipLevel: \"gold\", city: { $in: [\"花蓮縣\", \"台東縣\"] } }, { name: 1, city: 1 }).sort({ _id: 1 })\n", "explanation": "$or is for an \"or\" across different fields: { $or: [ { city: \"花蓮縣\" }, { vipLevel: \"gold\" } ] }.\nFor an \"or\" on one field, just use $in.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.customers.find({ vipLevel: \"gold\", city: { $in: [\"花蓮縣\", \"台東縣\"] } }, { name: 1, city: 1 }).sort({ _id: 1 })", "text": "// 59 documents, showing the first 3\n{\n  _id: 14,\n  name: '劉怡傑',\n  city: '台東縣'\n}\n{\n  _id: 15,\n  name: '羅書廷',\n  city: '花蓮縣'\n}\n{\n  _id: 18,\n  name: '何佳誠',\n  city: '台東縣'\n}"}]}, {"id": "exists", "chapter": "Query operators", "title": "Customers without a birthday", "prompt": "How many customers have no birthDate field?\n", "hints": ["{ birthDate: { $exists: false } }"], "answer": "db.customers.countDocuments({ birthDate: { $exists: false } })\n", "explanation": "In a document database a field can \"not exist\", which is different from \"its value is null\".\n★ But { birthDate: null } finds both documents whose value is null and documents without the field (shown in the traps).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.customers.countDocuments({ birthDate: { $exists: false } })", "text": "1141"}]}, {"id": "regex", "chapter": "Query operators", "title": "Apple products", "prompt": "How many products have a name (name) starting with \"Apple\"?\n", "hints": ["Write a regular expression directly: { name: /^Apple/ }"], "answer": "db.products.countDocuments({ name: /^Apple/ })\n", "explanation": "A case-sensitive regular expression anchored with ^ can use an index (like SQL's LIKE 'Apple%');\npatterns without a fixed prefix, like /apple/i or /Pro/, must scan everything. For full-text search use a text index or Atlas Search.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.countDocuments({ name: /^Apple/ })", "text": "47"}]}, {"id": "array-contains", "chapter": "Arrays and embedded documents", "title": "How many limited-edition products", "prompt": "How many products have 「限量」 (limited edition) in their tags array?\n", "hints": ["Just write { tags: \"限量\" }; it compares against every element of the array."], "answer": "db.products.countDocuments({ tags: \"限量\" })\n", "explanation": "★ An equality condition on an array field matches if \"any element\" is equal; no need for $in.\nBut { tags: [\"限量\"] } means \"the whole array equals [\"限量\"] exactly\", which is entirely different (shown in the traps).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.countDocuments({ tags: \"限量\" })", "text": "109"}]}, {"id": "array-all", "chapter": "Arrays and embedded documents", "title": "Best-selling and limited ($all)", "prompt": "Products that have both the 「熱銷」 (best seller) and 「限量」 (limited edition) tags. Show only _id, sorted by _id.\n", "hints": ["{ tags: { $all: [\"熱銷\", \"限量\"] } }"], "answer": "db.products.find({ tags: { $all: [\"熱銷\", \"限量\"] } }, { _id: 1 }).sort({ _id: 1 })\n", "explanation": "$all: the array must contain every listed element, in any order. { tags: [\"熱銷\", \"限量\"] } instead requires the array to be \"exactly\" these two, in the same order.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.find({ tags: { $all: [\"熱銷\", \"限量\"] } }, { _id: 1 }).sort({ _id: 1 })", "text": "// 21 documents, showing the first 3\n{\n  _id: 77\n}\n{\n  _id: 84\n}\n{\n  _id: 100\n}"}]}, {"id": "array-size", "chapter": "Arrays and embedded documents", "title": "Products with exactly 3 tags", "prompt": "How many products have exactly 3 elements in tags?\n", "hints": ["{ tags: { $size: 3 } }"], "answer": "db.products.countDocuments({ tags: { $size: 3 } })\n", "explanation": "$size can only match \"exactly equal\"; you can't write { $size: { $gt: 2 } }.\nTo compare sizes use { \"tags.2\": { $exists: true } } (a 3rd element exists = at least 3), or $expr with { $size: \"$tags\" }.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.countDocuments({ tags: { $size: 3 } })", "text": "52"}]}, {"id": "array-dot", "chapter": "Arrays and embedded documents", "title": "Orders that bought product 540", "prompt": "How many orders have product 540 among their items (items)?\n", "hints": ["{ \"items.productId\": 540 }"], "answer": "db.orders.countDocuments({ \"items.productId\": 540 })\n", "explanation": "Dot notation also reaches into arrays: items.productId matches the productId of every element in items.\nAn index on this field becomes a \"multikey index\", with one index entry per item.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.countDocuments({ \"items.productId\": 540 })", "text": "156"}]}, {"id": "elem-match", "chapter": "Arrays and embedded documents", "title": "One item meeting two conditions ($elemMatch)", "prompt": "How many orders have any \"one\" item with both \"qty at least 3\" and \"unitPrice at least 10000\"?\nBoth conditions must hold on the \"same\" item.\n", "hints": ["{ items: { $elemMatch: { qty: { $gte: 3 }, unitPrice: { $gte: 10000 } } } }"], "answer": "db.orders.countDocuments({ items: { $elemMatch: { qty: { $gte: 3 }, unitPrice: { $gte: 10000 } } } })\n", "explanation": "★ Interview favorite: with { \"items.qty\": { $gte: 3 }, \"items.unitPrice\": { $gte: 10000 } },\nthe two conditions can be satisfied by \"different items\" (one item with 3 cheap units, another with 1 expensive unit), so you get more results.\nTo require one element to satisfy several conditions at once, you must use $elemMatch.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.countDocuments({ items: { $elemMatch: { qty: { $gte: 3 }, unitPrice: { $gte: 10000 } } } })", "text": "2074"}]}, {"id": "nested-specs", "chapter": "Arrays and embedded documents", "title": "512GB phones", "prompt": "Products whose spec specs.storage_gb is 512. Show only name (with _id), sorted by _id.\n", "hints": ["{ \"specs.storage_gb\": 512 }"], "answer": "db.products.find({ \"specs.storage_gb\": 512 }, { name: 1 }).sort({ _id: 1 })\n", "explanation": "Every category has different specs fields; that's the benefit of a document database's \"flexible schema\": no column per kind of spec.\nCompare PostgreSQL's JSONB: specs->>'storage_gb'; in MongoDB you just use dot notation.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.find({ \"specs.storage_gb\": 512 }, { name: 1 }).sort({ _id: 1 })", "text": "// 41 documents, showing the first 3\n{\n  _id: 3,\n  name: 'Samsung 手機 I187'\n}\n{\n  _id: 16,\n  name: 'Sony 手機 D738'\n}\n{\n  _id: 17,\n  name: 'MSI 筆電 S469'\n}"}]}, {"id": "agg-status", "chapter": "Aggregation pipeline", "title": "Orders per status", "prompt": "Use aggregate to count orders per status, highest count first.\nOutput: _id is the status, count is the number.\n", "hints": ["[ { $group: { _id: \"$status\", count: { $sum: 1 } } }, { $sort: { count: -1 } } ]"], "answer": "db.orders.aggregate([\n  { $group: { _id: \"$status\", count: { $sum: 1 } } },\n  { $sort: { count: -1 } }\n])\n", "explanation": "$group is SQL's GROUP BY: _id is the grouping key, \"$field\" means the field's value, and $sum: 1 is count(*).\nData in an aggregation pipeline flows down through each stage; each stage's output is the next stage's input.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.aggregate([\n  { $group: { _id: \"$status\", count: { $sum: 1 } } },\n  { $sort: { count: -1 } }\n])", "text": "// 6 documents, showing the first 3\n{\n  _id: 'delivered',\n  count: 64554\n}\n{\n  _id: 'cancelled',\n  count: 8108\n}\n{\n  _id: 'returned',\n  count: 6340\n}"}]}, {"id": "agg-city-revenue", "chapter": "Aggregation pipeline", "title": "Top 5 cities by revenue", "prompt": "Considering only delivered orders, compute the revenue (sum of total) per shipping city and take the top 5.\nOutput: _id is the city, revenue is the revenue, highest first.\n", "hints": ["$match to filter → $group to sum → $sort → $limit", "The city is an embedded field: \"$shipping.city\""], "answer": "db.orders.aggregate([\n  { $match: { status: \"delivered\" } },\n  { $group: { _id: \"$shipping.city\", revenue: { $sum: \"$total\" } } },\n  { $sort: { revenue: -1 } },\n  { $limit: 5 }\n])\n", "explanation": "★ Put $match as early as possible: shrinking the data first makes later stages fast, and a leading $match can use an index.\n(The optimizer actually moves $match stages forward when it can, but writing it yourself is safer.)\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.aggregate([\n  { $match: { status: \"delivered\" } },\n  { $group: { _id: \"$shipping.city\", revenue: { $sum: \"$total\" } } },\n  { $sort: { revenue: -1 } },\n  { $limit: 5 }\n])", "text": "// 5 documents, showing the first 3\n{\n  _id: '台北市',\n  revenue: 206971417\n}\n{\n  _id: '新北市',\n  revenue: 107267944\n}\n{\n  _id: '台中市',\n  revenue: 90333790\n}"}]}, {"id": "agg-unwind", "chapter": "Aggregation pipeline", "title": "Top 5 products by units sold ($unwind)", "prompt": "Compute the total units sold per product (sum of qty in items, all statuses) and take the top 5.\nOutput: _id is the product id, name is the product name, qty is the units, highest first; ties by _id ascending.\n", "hints": ["$unwind splits the items array: an order with 3 items becomes 3 documents.", "$group by \"$items.productId\", with the name from { $first: \"$items.name\" }."], "answer": "db.orders.aggregate([\n  { $unwind: \"$items\" },\n  { $group: { _id: \"$items.productId\", name: { $first: \"$items.name\" }, qty: { $sum: \"$items.qty\" } } },\n  { $sort: { qty: -1, _id: 1 } },\n  { $limit: 5 }\n])\n", "explanation": "$unwind is the key to embedded arrays: flatten the array into several documents so each item can be aggregated.\nIt's like PostgreSQL's unnest(), or joining orders with order_items.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.aggregate([\n  { $unwind: \"$items\" },\n  { $group: { _id: \"$items.productId\", name: { $first: \"$items.name\" }, qty: { $sum: \"$items.qty\" } } },\n  { $sort: { qty: -1, _id: 1 } },\n  { $limit: 5 }\n])", "text": "// 5 documents, showing the first 3\n{\n  _id: 1,\n  name: '雅漾 保養 C693',\n  qty: 1710\n}\n{\n  _id: 2,\n  name: '金車 飲料 F922',\n  qty: 1065\n}\n{\n  _id: 3,\n  name: 'Samsung 手機 I187',\n  qty: 884\n}"}]}, {"id": "agg-monthly", "chapter": "Aggregation pipeline", "title": "Orders per month in 2026 (time zones)", "prompt": "Count the orders in each month of 2026 (in Taiwan time).\nOutput: _id is a month string like \"2026-01\", count is the number, sorted by month.\n", "hints": ["Filter: orderDate between ISODate(\"2026-01-01T00:00:00+08:00\") and ISODate(\"2027-01-01T00:00:00+08:00\").", "Group: { $dateToString: { format: \"%Y-%m\", date: \"$orderDate\", timezone: \"Asia/Taipei\" } }"], "answer": "db.orders.aggregate([\n  { $match: { orderDate: { $gte: ISODate(\"2026-01-01T00:00:00+08:00\"), $lt: ISODate(\"2027-01-01T00:00:00+08:00\") } } },\n  { $group: { _id: { $dateToString: { format: \"%Y-%m\", date: \"$orderDate\", timezone: \"Asia/Taipei\" } }, count: { $sum: 1 } } },\n  { $sort: { _id: 1 } }\n])\n", "explanation": "★ MongoDB always stores dates in UTC. An order at 2 a.m. on 9/1 Taiwan time is 6 p.m. on 8/31 in UTC.\nWrite the time zone (+08:00) when filtering, and pass timezone when grouping too, or each month's boundary is off by 8 hours (shown in the traps).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.aggregate([\n  { $match: { orderDate: { $gte: ISODate(\"2026-01-01T00:00:00+08:00\"), $lt: ISODate(\"2027-01-01T00:00:00+08:00\") } } },\n  { $group: { _id: { $dateToString: { format: \"%Y-%m\", date: \"$orderDate\", timezone: \"Asia/Taipei\" } }, count: { $sum: 1 } } },\n  { $sort: { _id: 1 } }\n])", "text": "// 9 documents, showing the first 3\n{\n  _id: '2026-01',\n  count: 2668\n}\n{\n  _id: '2026-02',\n  count: 2471\n}\n{\n  _id: '2026-03',\n  count: 2902\n}"}]}, {"id": "agg-lookup", "chapter": "Aggregation pipeline", "title": "Orders with the customer name ($lookup)", "prompt": "Customer 1's 3 newest orders, with the customer's name.\nOutput: _id, total, customerName, newest order first.\n", "hints": ["$match → $sort → $limit → $lookup into customers → $project", "$lookup returns an array; get the name with { $first: \"$customer.name\" }."], "answer": "db.orders.aggregate([\n  { $match: { customerId: 1 } },\n  { $sort: { orderDate: -1 } },\n  { $limit: 3 },\n  { $lookup: { from: \"customers\", localField: \"customerId\", foreignField: \"_id\", as: \"customer\" } },\n  { $project: { total: 1, customerName: { $first: \"$customer.name\" } } }\n])\n", "explanation": "$lookup is a LEFT OUTER JOIN, with the result placed in an array field.\n★ $limit before $lookup: join only 3 documents, rather than joining every order and then taking 3.\n$lookup's foreignField needs an index, otherwise every document scans the whole collection (the lab shows how big the difference is).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.aggregate([\n  { $match: { customerId: 1 } },\n  { $sort: { orderDate: -1 } },\n  { $limit: 3 },\n  { $lookup: { from: \"customers\", localField: \"customerId\", foreignField: \"_id\", as: \"customer\" } },\n  { $project: { total: 1, customerName: { $first: \"$customer.name\" } } }\n])", "text": "// 3 documents\n{\n  _id: 77621,\n  total: 1519,\n  customerName: '葉承文'\n}\n{\n  _id: 75279,\n  total: 1909,\n  customerName: '葉承文'\n}\n{\n  _id: 72474,\n  total: 21018,\n  customerName: '葉承文'\n}"}]}, {"id": "update-set", "chapter": "Writes", "title": "Update stock ($set)", "prompt": "Set product 540's stock (stock) to 20, leaving the other fields unchanged.\n", "hints": ["db.products.updateOne({ _id: 540 }, { $set: { stock: 20 } })"], "answer": "db.products.updateOne({ _id: 540 }, { $set: { stock: 20 } })\n", "explanation": "★ Updates must use update operators ($set, $inc, $push…). With replaceOne the whole document is replaced and every other field disappears (shown in the traps).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.products.updateOne({ _id: 540 }, { $set: { stock: 20 } })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}], "checks": [{"cmd": "db.products.findOne({ _id: 540 })", "text": "{\n  _id: 540,\n  name: 'Sony 手機 I447',\n  category: {\n    _id: 2,\n    name: '手機',\n    path: [ '3C電子', '手機' ]\n  },\n  price: 29949,\n  cost: 15756,\n  stock: 20,\n  isActive: true,\n  createdAt: ISODate('2021-03-01T00:00:00Z'),\n  tags: [ '特價' ],\n  specs: {\n    '5g': false,\n    color: '白',\n    warranty: {\n      type: '原廠',\n      years: 2\n    },\n    storage_gb: 128,\n    screen_inch: 6.3\n  }\n}"}]}, {"id": "update-inc", "chapter": "Writes", "title": "Raise all drink prices by 5 ($inc)", "prompt": "Add 5 to the price of every product whose category name (category.name) is 「飲料」 (drinks).\n", "hints": ["updateMany with { $inc: { price: 5 } }"], "answer": "db.products.updateMany({ \"category.name\": \"飲料\" }, { $inc: { price: 5 } })\n", "explanation": "$inc is atomic, which suits counters, stock and likes. updateOne updates only the first matching document; updateMany updates them all.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.products.updateMany({ \"category.name\": \"飲料\" }, { $inc: { price: 5 } })", "text": "{\n  acknowledged: true,\n  matchedCount: 83,\n  modifiedCount: 83,\n  upsertedId: null\n}"}], "checks": [{"cmd": "db.products.find({}, { price: 1 }).sort({ _id: 1 })", "text": "// 83 documents, showing the first 3\n{\n  _id: 2,\n  price: 24\n}\n{\n  _id: 30,\n  price: 64\n}\n{\n  _id: 34,\n  price: 74\n}"}]}, {"id": "update-push", "chapter": "Writes", "title": "Add an item to an order ($push)", "prompt": "Append an item to the end of order 77621's items array:\n{ productId: 1, name: \"測試商品\", qty: 1, unitPrice: 100, discount: 0 }\n", "hints": ["{ $push: { items: { … } } }"], "answer": "db.orders.updateOne({ _id: 77621 }, { $push: { items: { productId: 1, name: \"測試商品\", qty: 1, unitPrice: 100, discount: 0 } } })\n", "explanation": "Array update operators: $push appends, $addToSet adds only if absent, $pull removes by condition, $pop removes the first or last.\nTo add several at once use $push: { items: { $each: [ … ] } }, optionally with $slice to keep only the newest N.\nNote: adding an item doesn't update total automatically; change it yourself with $inc in the same update (a document database has no trigger to compute it for you).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.orders.updateOne({ _id: 77621 }, { $push: { items: { productId: 1, name: \"測試商品\", qty: 1, unitPrice: 100, discount: 0 } } })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}], "checks": [{"cmd": "db.orders.findOne({ _id: 77621 }, { items: 1 })", "text": "{\n  _id: 77621,\n  items: [\n    {\n      productId: 237,\n      name: 'UNIQLO 男裝 P863',\n      qty: 1,\n      unitPrice: 1519,\n      discount: 0.0\n    },\n    {\n      productId: 1,\n      name: '測試商品',\n      qty: 1,\n      unitPrice: 100,\n      discount: 0\n    }\n  ]\n}"}]}, {"id": "update-addtoset", "chapter": "Writes", "title": "Add a tag without duplicates ($addToSet)", "prompt": "Add the 「熱銷」 (best seller) tag to product 540; if it's already there, don't add it again.\n", "hints": ["{ $addToSet: { tags: \"熱銷\" } }"], "answer": "db.products.updateOne({ _id: 540 }, { $addToSet: { tags: \"熱銷\" } })\n", "explanation": "$addToSet treats the array as a set. Running it twice gives the same result; this \"safe to repeat\" property is called idempotence.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.products.updateOne({ _id: 540 }, { $addToSet: { tags: \"熱銷\" } })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}], "checks": [{"cmd": "db.products.findOne({ _id: 540 }, { tags: 1 })", "text": "{\n  _id: 540,\n  tags: [ '特價', '熱銷' ]\n}"}]}, {"id": "upsert", "chapter": "Writes", "title": "Update if it exists, insert if not (upsert)", "prompt": "Update the customer with email \"new@example.com\": set name to 「新會員」 (new member) and vipLevel to \"normal\".\nIf this email doesn't exist, insert a new document.\n", "hints": ["updateOne(filter, { $set: { … } }, { upsert: true })"], "answer": "db.customers.updateOne({ email: \"new@example.com\" }, { $set: { name: \"新會員\", vipLevel: \"normal\" } }, { upsert: true })\n", "explanation": "When upsert inserts, it merges \"the equality fields in the filter\" (email) with the $set fields into the new document.\nFields you only want set \"on insert\" go in $setOnInsert (e.g. a creation time).\n★ Under high concurrency, two simultaneous upserts of the same email can insert two documents, so the filter field needs a unique index (customers.email has one).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.customers.updateOne({ email: \"new@example.com\" }, { $set: { name: \"新會員\", vipLevel: \"normal\" } }, { upsert: true })", "text": "{\n  acknowledged: true,\n  matchedCount: 0,\n  modifiedCount: 0,\n  upsertedId: 'BsonObjectId{value=6ac9c4a24a8706423f56cffc}'\n}"}], "checks": [{"cmd": "db.customers.find({ email: \"new@example.com\" }, { _id: 0, email: 1, name: 1, vipLevel: 1 })", "text": "// 1 documents\n{\n  email: 'new@example.com',\n  name: '新會員',\n  vipLevel: 'normal'\n}"}]}, {"id": "delete-many", "chapter": "Writes", "title": "Delete old cancelled orders", "prompt": "Delete every order whose \"status is cancelled and order time is before 2023-01-01 Taiwan time\".\n", "hints": ["deleteMany({ status: \"cancelled\", orderDate: { $lt: ISODate(\"2023-01-01T00:00:00+08:00\") } })"], "answer": "db.orders.deleteMany({ status: \"cancelled\", orderDate: { $lt: ISODate(\"2023-01-01T00:00:00+08:00\") } })\n", "explanation": "deleteMany({}) deletes every document but keeps the collection and its indexes; drop() deletes the collection and indexes too.\nTo delete expired data automatically, create a TTL index: createIndex({ createdAt: 1 }, { expireAfterSeconds: 86400 }).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.orders.deleteMany({ status: \"cancelled\", orderDate: { $lt: ISODate(\"2023-01-01T00:00:00+08:00\") } })", "text": "{\n  acknowledged: true,\n  deletedCount: 418\n}"}], "checks": [{"cmd": "db.orders.countDocuments({})", "text": "7690"}, {"cmd": "db.orders.countDocuments({ orderDate: { $lt: ISODate(\"2023-01-01T00:00:00+08:00\") } })", "text": "0"}]}, {"id": "find-one-and-update", "chapter": "Writes", "title": "Update and get the new value back (findOneAndUpdate)", "prompt": "Decrease product 540's stock by 1 and, in the same operation, get back the document \"after\" the update (only name and stock).\n", "hints": ["findOneAndUpdate(filter, { $inc: { stock: -1 } }, { returnDocument: \"after\", projection: { name: 1, stock: 1 } })"], "answer": "db.products.findOneAndUpdate({ _id: 540 }, { $inc: { stock: -1 } }, { returnDocument: \"after\", projection: { name: 1, stock: 1 } })\n", "explanation": "findOneAndUpdate is an atomic \"update and read\". By default it returns the document \"before\" the update; add returnDocument: \"after\".\nWith the filter { _id: 540, stock: { $gt: 0 } } it becomes a stock deduction that never oversells (compare the Lua script in the Redis lab).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.products.findOneAndUpdate({ _id: 540 }, { $inc: { stock: -1 } }, { returnDocument: \"after\", projection: { name: 1, stock: 1 } })", "text": "{\n  _id: 540,\n  name: 'Sony 手機 I447',\n  stock: 10\n}"}]}], "traps": [{"id": "array-equality", "title": "Equality on arrays", "question": "Do A and B count the same number of products?", "options": ["The same", "A has more", "B has more"], "answer": 1, "explanation": "A: the condition is a single value, so MongoDB compares it with \"every element\" of the array and matches if any is equal.\nB: the condition itself is an array, so it becomes \"the whole array is exactly equal\": only products whose tags are exactly [\"特價\"], with no other tags, match.\nUse $all for \"contains all of these\" and $in for \"contains any of these\".\n", "setup": null, "scripts": [{"label": "A: { tags: \"特價\" }", "code": "db.products.countDocuments({ tags: \"特價\" })\n"}, {"label": "B: { tags: [\"特價\"] }", "code": "db.products.countDocuments({ tags: [\"特價\"] })\n"}], "results": [[{"cmd": "db.products.countDocuments({ tags: \"特價\" })", "text": "303"}], [{"cmd": "db.products.countDocuments({ tags: [\"特價\"] })", "text": "140"}]]}, {"id": "elem-match", "title": "Several conditions on an array", "question": "Does A require the \"same item\" to have both qty ≥ 3 and unitPrice ≥ 10000?", "options": ["Yes, the same as B", "No, A finds more", "No, A finds fewer"], "answer": 1, "explanation": "A's two conditions are each matched against the whole items array independently: it matches if \"some item\" has qty ≥ 3 and \"some item\" has unitPrice ≥ 10000, and they can be different items.\nB's $elemMatch requires the \"same item\" to satisfy both. So A also counts orders where \"one item has many cheap units and another has one expensive unit\".\n", "setup": null, "scripts": [{"label": "A: two dot-notation conditions", "code": "db.orders.countDocuments({ \"items.qty\": { $gte: 3 }, \"items.unitPrice\": { $gte: 10000 } })\n"}, {"label": "B: $elemMatch", "code": "db.orders.countDocuments({ items: { $elemMatch: { qty: { $gte: 3 }, unitPrice: { $gte: 10000 } } } })\n"}], "results": [[{"cmd": "db.orders.countDocuments({ \"items.qty\": { $gte: 3 }, \"items.unitPrice\": { $gte: 10000 } })", "text": "4876"}], [{"cmd": "db.orders.countDocuments({ items: { $elemMatch: { qty: { $gte: 3 }, unitPrice: { $gte: 10000 } } } })", "text": "2074"}]]}, {"id": "null-matches-missing", "title": "null also finds documents without the field", "question": "Some customers have no city field (not null; the field doesn't exist at all). Does A's { city: null } find them?", "options": ["Yes, the same as B", "No, it only finds null values, so the result is 0", "An error"], "answer": 0, "explanation": "{ field: null } finds both documents whose value is null and documents without the field.\nFor just one of them: a missing field is { $exists: false }; a value that is exactly null is { $type: \"null\" }.\nCompare SQL: in PostgreSQL city = NULL is never true and you must write IS NULL; MongoDB behaves the opposite way, which is easy to mix up.\n", "setup": null, "scripts": [{"label": "A: { city: null }", "code": "db.customers.countDocuments({ city: null })\n"}, {"label": "B: { city: { $exists: false } }", "code": "db.customers.countDocuments({ city: { $exists: false } })\n"}], "results": [[{"cmd": "db.customers.countDocuments({ city: null })", "text": "616"}], [{"cmd": "db.customers.countDocuments({ city: { $exists: false } })", "text": "616"}]]}, {"id": "type-mismatch", "title": "A different type finds nothing", "question": "The product's _id is the number 540. Does A find it with the string \"540\"?", "options": ["Yes, MongoDB converts the type automatically", "No, the result is 0", "An error"], "answer": 1, "explanation": "MongoDB comparisons require the same type: the string \"540\" and the number 540 are different values, with no automatic conversion and no error.\nThe classic Java pitfall: an id arrives from the front end as a String and is used to query a numeric field, so it never matches.\nLikewise, ObjectId(\"…\") and the string \"…\" aren't equal.\n", "setup": null, "scripts": [{"label": "A: the string \"540\"", "code": "db.products.countDocuments({ _id: \"540\" })\n"}, {"label": "B: the number 540", "code": "db.products.countDocuments({ _id: 540 })\n"}], "results": [[{"cmd": "db.products.countDocuments({ _id: \"540\" })", "text": "0"}], [{"cmd": "db.products.countDocuments({ _id: 540 })", "text": "1"}]]}, {"id": "replace-drops-fields", "title": "replaceOne replaces the whole document", "question": "A uses replaceOne to set product 540's stock to 20. Which fields are left in the document afterwards?", "options": ["All fields remain; only stock becomes 20", "Only _id and stock", "An error"], "answer": 1, "explanation": "replaceOne \"replaces the whole\" old document with the new one (keeping _id), so name, price and category all disappear.\nTo change only some fields, always use updateOne / updateMany with $set.\nSpring Data MongoDB's repository.save(entity) replaces the whole document too: if the entity was loaded with only some fields, saving it wipes the others.\n", "setup": null, "scripts": [{"label": "A: replaceOne", "code": "db.products.replaceOne({ _id: 540 }, { stock: 20 })\ndb.products.findOne({ _id: 540 })\n"}, {"label": "B: updateOne + $set", "code": "db.products.updateOne({ _id: 540 }, { $set: { stock: 20 } })\ndb.products.findOne({ _id: 540 })\n"}], "results": [[{"cmd": "db.products.replaceOne({ _id: 540 }, { stock: 20 })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}, {"cmd": "db.products.findOne({ _id: 540 })", "text": "{\n  _id: 540,\n  stock: 20\n}"}], [{"cmd": "db.products.updateOne({ _id: 540 }, { $set: { stock: 20 } })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}, {"cmd": "db.products.findOne({ _id: 540 })", "text": "{\n  _id: 540,\n  name: 'Sony 手機 I447',\n  category: {\n    _id: 2,\n    name: '手機',\n    path: [ '3C電子', '手機' ]\n  },\n  price: 29949,\n  cost: 15756,\n  stock: 20,\n  isActive: true,\n  createdAt: ISODate('2021-03-01T00:00:00Z'),\n  tags: [ '特價' ],\n  specs: {\n    '5g': false,\n    color: '白',\n    warranty: {\n      type: '原廠',\n      years: 2\n    },\n    storage_gb: 128,\n    screen_inch: 6.3\n  }\n}"}]]}, {"id": "sort-limit-order", "title": "limit before sort?", "question": "A writes .limit(3) before .sort(). Does A take any 3 documents first and then sort them?", "options": ["Yes, the result differs from B", "No, the result is the same as B", "An error"], "answer": 1, "explanation": "However you chain find's sort, skip and limit, MongoDB always runs them in the order \"sort → skip → limit\", so A and B are the same.\nThe aggregation pipeline is different: [ { $limit: 3 }, { $sort: … } ] really takes 3 documents first and then sorts, because a pipeline runs its stages in order.\n", "setup": null, "scripts": [{"label": "A: .limit(3).sort(…)", "code": "db.orders.find({ status: \"paid\" }, { total: 1 }).limit(3).sort({ total: -1 })\n"}, {"label": "B: .sort(…).limit(3)", "code": "db.orders.find({ status: \"paid\" }, { total: 1 }).sort({ total: -1 }).limit(3)\n"}], "results": [[{"cmd": "db.orders.find({ status: \"paid\" }, { total: 1 }).limit(3).sort({ total: -1 })", "text": "// 3 documents\n{\n  _id: 79042,\n  total: 194734\n}\n{\n  _id: 78975,\n  total: 147588\n}\n{\n  _id: 79676,\n  total: 143543\n}"}], [{"cmd": "db.orders.find({ status: \"paid\" }, { total: 1 }).sort({ total: -1 }).limit(3)", "text": "// 3 documents\n{\n  _id: 79042,\n  total: 194734\n}\n{\n  _id: 78975,\n  total: 147588\n}\n{\n  _id: 79676,\n  total: 143543\n}"}]]}, {"id": "timezone", "title": "Dates and time zones", "question": "We want the orders of \"September 2026 Taiwan time\". Do A and B return the same count?", "options": ["The same", "Different"], "answer": 1, "explanation": "MongoDB always stores dates in UTC. ISODate(\"2026-09-01\") is midnight UTC, which is 8 a.m. on 9/1 Taiwan time.\nA misses orders from midnight to 8 a.m. on 9/1 and includes orders from midnight to 8 a.m. on 10/1.\nJava's LocalDate and LocalDateTime have no time zone; always specify ZoneId.of(\"Asia/Taipei\") explicitly when converting to Date.\n", "setup": null, "scripts": [{"label": "A: no time zone (UTC)", "code": "db.orders.countDocuments({ orderDate: { $gte: ISODate(\"2026-09-01\"), $lt: ISODate(\"2026-10-01\") } })\n"}, {"label": "B: with +08:00", "code": "db.orders.countDocuments({ orderDate: { $gte: ISODate(\"202
