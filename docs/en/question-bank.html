le-length relationship is the recursion.\nThe category tree is tiny (27 nodes), so no upper bound is fine; for a large graph like social relationships you must give one.\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "MATCH (c:Category)-[:SUBCATEGORY_OF*1..]->(:Category {name: '3C電子'})\nRETURN c.name", "table": {"columns": ["c.name"], "rows": [["手機"], ["筆電"], ["耳機"], ["無線耳機"], ["有線耳機"], ["手機配件"]], "total": 6}}]}, {"id": "path-nodes", "chapter": "Paths and traversal", "title": "Nodes along a path", "prompt": "The \"full path\" from product 540's category up to the top-level category:\nreturn a list containing the product's category name, then its parent's name… up to the top level.\n", "hints": ["MATCH p = (:Product {id: 540})-[:IN_CATEGORY]->(:Category)-[:SUBCATEGORY_OF*0..]->(top:Category)", "The top-level category has no further SUBCATEGORY_OF: WHERE NOT (top)-[:SUBCATEGORY_OF]->()", "nodes(p) gets the nodes of the path; [n IN list WHERE … | n.name] is a list comprehension."], "answer": "MATCH p = (:Product {id: 540})-[:IN_CATEGORY]->(:Category)-[:SUBCATEGORY_OF*0..]->(top:Category)\nWHERE NOT (top)-[:SUBCATEGORY_OF]->()\nRETURN [n IN nodes(p) WHERE n:Category | n.name]\n", "explanation": "*0.. allows 0 steps (so it still works when the product is attached directly to a top-level category). nodes(p) and relationships(p) get the nodes and relationships of a path;\nthe list comprehension [x IN list WHERE condition | expression] is like filter + map in a programming language.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH p = (:Product {id: 540})-[:IN_CATEGORY]->(:Category)-[:SUBCATEGORY_OF*0..]->(top:Category)\nWHERE NOT (top)-[:SUBCATEGORY_OF]->()\nRETURN [n IN nodes(p) WHERE n:Category | n.name]", "table": {"columns": ["[n IN nodes(p) WHERE n:Category | n.name]"], "rows": [["['手機', '3C電子']"]], "total": 1}}]}, {"id": "also-bought", "chapter": "Recommendations", "title": "People who bought this also bought", "prompt": "Which other products did the customers who bought product 540 buy? (Products bought in the same order count too.)\nReturn the product name and \"the number of customers who bought it\" (each customer counted once), most customers first, ties by product name; top 5.\n", "hints": ["First find the customers who bought 540: MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)", "Then find every product these customers bought: MATCH (c)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product)", "★ Why two MATCHes? In one long path the same relationship isn't traversed twice, so the two PLACED must be different orders."], "answer": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)\nMATCH (c)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product)\nWHERE other.id <> 540\nRETURN other.name, count(DISTINCT c) AS buyers\nORDER BY buyers DESC, other.name\nLIMIT 5\n", "explanation": "This is the simplest form of collaborative filtering: product → people who bought it → other products those people bought.\n★ Within \"one MATCH pattern\" the same relationship is never traversed twice (relationship isomorphism).\nWritten as a single path (:Product)<-[:CONTAINS]-(:Order)<-[:PLACED]-(c)-[:PLACED]->(:Order)-[:CONTAINS]->(other),\nthe two PLACED must be different relationships, i.e. different orders, so customers who \"bought them together in the same order\" are missed (the Avène item drops from 16 to 14 people).\nWith two MATCHes, uniqueness is checked only within each pattern, so nothing is missed. In SQL it takes a five-table JOIN: order_items, orders, orders, order_items, products.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)\nMATCH (c)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product)\nWHERE other.id <> 540\nRETURN other.name, count(DISTINCT c) AS buyers\nORDER BY buyers DESC, other.name\nLIMIT 5", "table": {"columns": ["other.name", "buyers"], "rows": [["雅漾 保養 C693", 16], ["Samsung 手機 I187", 8], ["Sony 手機 D738", 8], ["Adidas 運動鞋 U237", 7], ["Nike 運動鞋 W498", 7]], "total": 5}}]}, {"id": "friends-bought", "chapter": "Recommendations", "title": "Bought by friends, not yet by you", "prompt": "Products bought by the people customer 4242 follows, but not by 4242 themselves.\nReturn the product id and \"the number of friends who bought it\", most friends first, ties by product id ascending; top 5.\n", "hints": ["Find what friends bought first, then exclude what you bought with WHERE NOT (me)-[:PLACED]->(:Order)-[:CONTAINS]->(p)."], "answer": "MATCH (me:Customer {id: 4242})-[:FOLLOWS]->(f:Customer)-[:PLACED]->(:Order)-[:CONTAINS]->(p:Product)\nWHERE NOT (me)-[:PLACED]->(:Order)-[:CONTAINS]->(p)\nRETURN p.id, count(DISTINCT f) AS friends\nORDER BY friends DESC, p.id\nLIMIT 5\n", "explanation": "Social recommendations combine \"relationships\" (following) and \"behavior\" (purchases), exactly the kind of query graph databases are best at.\nWHERE NOT (pattern) checks each candidate product once, walking only 4242's own orders, so it's fast.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (me:Customer {id: 4242})-[:FOLLOWS]->(f:Customer)-[:PLACED]->(:Order)-[:CONTAINS]->(p:Product)\nWHERE NOT (me)-[:PLACED]->(:Order)-[:CONTAINS]->(p)\nRETURN p.id, count(DISTINCT f) AS friends\nORDER BY friends DESC, p.id\nLIMIT 5", "table": {"columns": ["p.id", "friends"], "rows": [[173, 2], [1306, 2], [3, 1], [4, 1], [6, 1]], "total": 5}}]}, {"id": "create-customer", "chapter": "Writes", "title": "Create a node and a relationship", "prompt": "Add a customer: id 99999, name '測試會員', vipLevel 'normal',\nliving in the existing 「台北市」 (Taipei) (create a LIVES_IN relationship).\n", "hints": ["MATCH the city first, then CREATE the customer and relationship: MATCH (city:City {name: '台北市'}) CREATE (c:Customer {…})-[:LIVES_IN]->(city)"], "answer": "MATCH (city:City {name: '台北市'})\nCREATE (:Customer {id: 99999, name: '測試會員', vipLevel: 'normal'})-[:LIVES_IN]->(city)\n", "explanation": "In CREATE (c)-[:LIVES_IN]->(city), city is the existing node matched earlier.\nWriting CREATE (:Customer {…})-[:LIVES_IN]->(:City {name: '台北市'}) would create another new 「台北市」 node (here a uniqueness constraint makes it fail outright).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MATCH (city:City {name: '台北市'})\nCREATE (:Customer {id: 99999, name: '測試會員', vipLevel: 'normal'})-[:LIVES_IN]->(city)", "text": "Nodes created 1, Relationships created 1, Properties set 3, Labels added 1"}], "checks": [{"cmd": "MATCH (c:Customer {id: 99999})-[:LIVES_IN]->(city:City) RETURN c.name, c.vipLevel, city.name", "table": {"columns": ["c.name", "c.vipLevel", "city.name"], "rows": [["測試會員", "normal", "台北市"]], "total": 1}}, {"cmd": "MATCH (city:City {name: '台北市'}) RETURN count(city)", "table": {"columns": ["count(city)"], "rows": [[1]], "total": 1}}]}, {"id": "merge-follow", "chapter": "Writes", "title": "Create a relationship without duplicates (MERGE)", "prompt": "Make customer 4242 follow customer 15084 and customer 1.\n4242 actually already follows 15084, and that must not create a duplicate relationship.\n", "hints": ["MERGE looks first and creates only if nothing is found.", "MATCH both end nodes first, then MERGE the relationship: MATCH (a …), (b …) MERGE (a)-[:FOLLOWS]->(b)"], "answer": "MATCH (me:Customer {id: 4242}), (other:Customer)\nWHERE other.id IN [15084, 1]\nMERGE (me)-[:FOLLOWS]->(other)\n", "explanation": "MERGE = \"use it if it exists, create it if not\". CREATE would add another FOLLOWS between 4242 and 15084 (relationships have no uniqueness constraint),\nand follower counts would then double-count.\n★ With MERGE, always MATCH both ends first and MERGE only the relationship; a trap shows what happens if you MERGE the whole pattern.\nYou'll see a \"cartesian product\" server notification: the two unconnected patterns (me), (other) produce every combination;\nhere that's only 1 × 2 = 2, exactly what we want, so it can be ignored. Be careful only when the number of combinations is large (shown in the traps).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MATCH (me:Customer {id: 4242}), (other:Customer)\nWHERE other.id IN [15084, 1]\nMERGE (me)-[:FOLLOWS]->(other)", "text": "Relationships created 1", "warn": ["This query builds a cartesian product between disconnected patterns.：If a part of a query contains multiple disconnected patterns, this will build a cartesian product between all those parts. This may produce a large amount of data and slow down query processing. While occasionally intended, it may often be possible to reformulate the query that avoids the use of this cross product, perhaps by adding a relationship between the different parts or by using OPTIONAL MATCH (identifier is: (other))"]}], "checks": [{"cmd": "MATCH (:Customer {id: 4242})-[r:FOLLOWS]->(other:Customer) WHERE other.id IN [15084, 1]\nRETURN other.id, count(r) ORDER BY other.id", "table": {"columns": ["other.id", "count(r)"], "rows": [[1, 1], [15084, 1]], "total": 2}}]}, {"id": "set-props", "chapter": "Writes", "title": "Change properties and lists", "prompt": "Product 540 sold out: set stock to 0 and add '缺貨' (out of stock) to the tags list (keeping the existing tags).\n", "hints": ["SET p.property = value; lists can be concatenated with +: p.tags + '缺貨'"], "answer": "MATCH (p:Product {id: 540})\nSET p.stock = 0, p.tags = p.tags + '缺貨'\n", "explanation": "list + element appends an element to the list. SET p.tags = ['缺貨'] would replace the whole list.\nSET p += {stock: 0} updates several properties at once and keeps the others; SET p = {…} replaces all properties (careful).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MATCH (p:Product {id: 540})\nSET p.stock = 0, p.tags = p.tags + '缺貨'", "text": "Properties set 2"}], "checks": [{"cmd": "MATCH (p:Product {id: 540}) RETURN p.stock, p.tags", "table": {"columns": ["p.stock", "p.tags"], "rows": [[0, "['特價', '缺貨']"]], "total": 1}}]}, {"id": "merge-on-create", "chapter": "Writes", "title": "MERGE with ON CREATE / ON MATCH", "prompt": "Record logins: run one \"login\" each for customer 4242 and customer 99999:\nif the customer exists, set lastLogin = date('2026-10-07'); if not, create the customer with name '新會員' (new member) and the same lastLogin.\n", "hints": ["MERGE (c:Customer {id: …}) ON CREATE SET … ON MATCH SET …", "Both customers can be handled at once with UNWIND [4242, 99999] AS id."], "answer": "UNWIND [4242, 99999] AS id\nMERGE (c:Customer {id: id})\nON CREATE SET c.name = '新會員', c.lastLogin = date('2026-10-07')\nON MATCH SET c.lastLogin = date('2026-10-07')\n", "explanation": "ON CREATE SET runs only when this MERGE creates a new node, and ON MATCH SET only when it finds an existing one,\nso 4242's name isn't changed to 「新會員」. UNWIND expands a list into rows and is often used for batch writes (that's how the data was loaded too).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UNWIND [4242, 99999] AS id\nMERGE (c:Customer {id: id})\nON CREATE SET c.name = '新會員', c.lastLogin = date('2026-10-07')\nON MATCH SET c.lastLogin = date('2026-10-07')", "text": "Nodes created 1, Properties set 4, Labels added 1"}], "checks": [{"cmd": "MATCH (c:Customer) WHERE c.id IN [4242, 99999] RETURN c.id, c.name, c.lastLogin ORDER BY c.id", "table": {"columns": ["c.id", "c.name", "c.lastLogin"], "rows": [[4242, "蘇建恩", "2026-10-07"], [99999, "新會員", "2026-10-07"]], "total": 2}}]}, {"id": "unfollow", "chapter": "Writes", "title": "Delete a relationship", "prompt": "Customer 4242 unfollows customer 15084 (delete only this relationship; both customers stay).\n", "hints": ["Give the relationship a variable, then DELETE it: MATCH (…)-[r:FOLLOWS]->(…) DELETE r"], "answer": "MATCH (:Customer {id: 4242})-[r:FOLLOWS]->(:Customer {id: 15084})\nDELETE r\n", "explanation": "DELETE can delete nodes or relationships. Before deleting a node, all its relationships must be deleted first, or use DETACH DELETE to delete them together (next exercise).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MATCH (:Customer {id: 4242})-[r:FOLLOWS]->(:Customer {id: 15084})\nDELETE r", "text": "Relationships deleted 1"}], "checks": [{"cmd": "MATCH (:Customer {id: 4242})-[:FOLLOWS]->(f:Customer) RETURN f.id ORDER BY f.id", "table": {"columns": ["f.id"], "rows": [[4428], [4477], [5514], [6339], [12218]], "total": 5}}, {"cmd": "MATCH (c:Customer) WHERE c.id IN [4242, 15084] RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[2]], "total": 1}}]}, {"id": "detach-delete", "chapter": "Writes", "title": "Delete nodes (DETACH DELETE)", "prompt": "Clean up: delete every customer who \"never placed an order\".\nThese customers may still have follow, follower and city relationships.\n", "hints": ["A node with relationships can't be DELETEd directly.", "DETACH DELETE deletes all of a node's relationships first, then the node."], "answer": "MATCH (c:Customer)\nWHERE NOT (c)-[:PLACED]->()\nDETACH DELETE c\n", "explanation": "DETACH DELETE removes 1,629 customers and all their relationships (following, followers, LIVES_IN) in one go.\nWith just DELETE c it looks successful inside the transaction, but those customers' relationships are still there (the LIVES_IN count in the third check query doesn't drop),\nand Neo4j would reject it with an error at commit, because \"dangling relationships\" aren't allowed. The showcase always rolls back, so the check queries catch the difference.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MATCH (c:Customer)\nWHERE NOT (c)-[:PLACED]->()\nDETACH DELETE c", "text": "Nodes deleted 1629, Relationships deleted 13032"}], "checks": [{"cmd": "MATCH (c:Customer) RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[18371]], "total": 1}}, {"cmd": "MATCH (c:Customer) WHERE NOT (c)-[:PLACED]->() RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[0]], "total": 1}}, {"cmd": "MATCH ()-[r:LIVES_IN]->(:City) RETURN count(r)", "table": {"columns": ["count(r)"], "rows": [[17805]], "total": 1}}]}], "traps": [{"id": "merge-whole-pattern", "title": "MERGE on a whole pattern", "question": "Nodes A and B both exist, but there's no relationship between them. After MERGE (a:Person {name: 'A'})-[:KNOWS]->(b:Person {name: 'B'}), how many Person nodes are there?", "options": ["2: MERGE uses the existing A and B", "4: the whole pattern isn't found, so the whole pattern (including both nodes) is created", "An error: A and B already exist"], "answer": 1, "explanation": "MERGE treats \"the whole pattern\" as all-or-nothing: either all of it is found or all of it is created. A and B exist, but the complete pattern A-[:KNOWS]->B doesn't,\nso MERGE creates both nodes and the relationship anew, giving an extra A and an extra B.\nThe right way: MATCH (or MERGE separately) both end nodes first, then MERGE the relationship. With a uniqueness constraint, A would fail outright, which is actually easier to notice.\n", "setup": null, "scripts": [{"label": "A: MERGE the whole pattern", "code": "CREATE (:Person {name: 'A'}), (:Person {name: 'B'});\nMERGE (a:Person {name: 'A'})-[:KNOWS]->(b:Person {name: 'B'});\nMATCH (p:Person) RETURN p.name, count(*) AS nodes ORDER BY p.name\n"}, {"label": "B: MATCH both ends, then MERGE the relationship", "code": "CREATE (:Person {name: 'A'}), (:Person {name: 'B'});\nMATCH (a:Person {name: 'A'}), (b:Person {name: 'B'})\nMERGE (a)-[:KNOWS]->(b);\nMATCH (p:Person) RETURN p.name, count(*) AS nodes ORDER BY p.name\n"}], "results": [[{"cmd": "CREATE (:Person {name: 'A'}), (:Person {name: 'B'})", "text": "Nodes created 2, Properties set 2, Labels added 2"}, {"cmd": "MERGE (a:Person {name: 'A'})-[:KNOWS]->(b:Person {name: 'B'})", "text": "Nodes created 2, Relationships created 1, Properties set 2, Labels added 2"}, {"cmd": "MATCH (p:Person) RETURN p.name, count(*) AS nodes ORDER BY p.name", "table": {"columns": ["p.name", "nodes"], "rows": [["A", 2], ["B", 2]], "total": 2}}], [{"cmd": "CREATE (:Person {name: 'A'}), (:Person {name: 'B'})", "text": "Nodes created 2, Properties set 2, Labels added 2"}, {"cmd": "MATCH (a:Person {name: 'A'}), (b:Person {name: 'B'})\nMERGE (a)-[:KNOWS]->(b)", "text": "Relationships created 1", "warn": ["This query builds a cartesian product between disconnected patterns.：If a part of a query contains multiple disconnected patterns, this will build a cartesian product between all those parts. This may produce a large amount of data and slow down query processing. While occasionally intended, it may often be possible to reformulate the query that avoids the use of this cross product, perhaps by adding a relationship between the different parts or by using OPTIONAL MATCH (identifier is: (b))"]}, {"cmd": "MATCH (p:Person) RETURN p.name, count(*) AS nodes ORDER BY p.name", "table": {"columns": ["p.name", "nodes"], "rows": [["A", 1], ["B", 1]], "total": 2}}]]}, {"id": "direction", "title": "Leaving out the direction", "question": "Customer 4242 follows 6 people and has 4 followers (none mutual). How many rows does MATCH (:Customer {id: 4242})-[:FOLLOWS]-(x), without an arrow, return?", "options": ["10: both directions count", "6: outgoing is the default", "An error: relationships must have a direction"], "answer": 0, "explanation": "A stored relationship always has a direction, but a query can leave it out, and then relationships in both directions match.\n\"Follows\" is directional, so leaving out the direction mixes \"people I follow\" with \"people who follow me\". Undirected queries are typical for symmetric relationships like \"knows\" or \"friends\".\n", "setup": null, "scripts": [{"label": "A: no direction", "code": "MATCH (:Customer {id: 4242})-[:FOLLOWS]-(x) RETURN count(x)\n"}, {"label": "B: only people followed", "code": "MATCH (:Customer {id: 4242})-[:FOLLOWS]->(x) RETURN count(x)\n"}], "results": [[{"cmd": "MATCH (:Customer {id: 4242})-[:FOLLOWS]-(x) RETURN count(x)", "table": {"columns": ["count(x)"], "rows": [[10]], "total": 1}}], [{"cmd": "MATCH (:Customer {id: 4242})-[:FOLLOWS]->(x) RETURN count(x)", "table": {"columns": ["count(x)"], "rows": [[6]], "total": 1}}]]}, {"id": "null-equals", "title": "Finding customers without a birthday with = null", "question": "1,141 customers have no birthday (no birthDate property). How many does WHERE c.birthDate = null find?", "options": ["1,141", "20,000 (everyone)", "0"], "answer": 2, "explanation": "As in SQL, comparing anything with null gives null (not true), so = null never finds anything. Use IS NULL / IS NOT NULL.\nIn Neo4j, \"a property that is null\" is \"a property that doesn't exist\": SET c.birthDate = null deletes the property.\n", "setup": null, "scripts": [{"label": "A: = null", "code": "MATCH (c:Customer) WHERE c.birthDate = null RETURN count(c)\n"}, {"label": "B: IS NULL", "code": "MATCH (c:Customer) WHERE c.birthDate IS NULL RETURN count(c)\n"}], "results": [[{"cmd": "MATCH (c:Customer) WHERE c.birthDate = null RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[0]], "total": 1}}], [{"cmd": "MATCH (c:Customer) WHERE c.birthDate IS NULL RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[1141]], "total": 1}}]]}, {"id": "optional-match-where", "title": "WHERE in OPTIONAL MATCH", "question": "How many orders of 50,000 or more do customers 1, 2 and 4242 each have? (4242 has none.) A puts the condition in OPTIONAL MATCH's WHERE, B uses MATCH. How many rows does A return?", "options": ["3 rows: customers without large orders also appear, with 0", "Fewer than 3 rows: customers without large orders are filtered out", "An error: OPTIONAL MATCH can't have WHERE"], "answer": 0, "explanation": "OPTIONAL MATCH's WHERE is part of the \"matching condition\": when nothing matches, the variable is null but the customer's row remains (count(null) = 0),\njust like SQL's LEFT JOIN … ON o.total >= 50000.\nPutting the condition in a later WITH … WHERE o.total >= 50000 would filter out the null rows, turning it back into a plain MATCH (INNER JOIN).\n", "setup": null, "scripts": [{"label": "A: OPTIONAL MATCH … WHERE", "code": "MATCH (c:Customer) WHERE c.id IN [1, 2, 4242]\nOPTIONAL MATCH (c)-[:PLACED]->(o:Order) WHERE o.total >= 50000\nRETURN c.id, count(o) AS bigOrders ORDER BY c.id\n"}, {"label": "B: MATCH … WHERE", "code": "MATCH (c:Customer)-[:PLACED]->(o:Order) WHERE c.id IN [1, 2, 4242] AND o.total >= 50000\nRETURN c.id, count(o) AS bigOrders ORDER BY c.id\n"}], "results": [[{"cmd": "MATCH (c:Customer) WHERE c.id IN [1, 2, 4242]\nOPTIONAL MATCH (c)-[:PLACED]->(o:Order) WHERE o.total >= 50000\nRETURN c.id, count(o) AS bigOrders ORDER BY c.id", "table": {"columns": ["c.id", "bigOrders"], "rows": [[1, 14], [2, 5], [4242, 0]], "total": 3}}], [{"cmd": "MATCH (c:Customer)-[:PLACED]->(o:Order) WHERE c.id IN [1, 2, 4242] AND o.total >= 50000\nRETURN c.id, count(o) AS bigOrders ORDER BY c.id", "table": {"columns": ["c.id", "bigOrders"], "rows": [[1, 14], [2, 5]], "total": 2}}]]}, {"id": "cartesian", "title": "Joining two unrelated patterns with a comma", "question": "There are 891 gold customers and 83 inactive products. What is MATCH (c:Customer {vipLevel: 'gold'}), (p:Product {isActive: false}) RETURN count(*)?", "options": ["73,953 (891 × 83), with a cartesian product warning", "974 (891 + 83)", "0: there's no relationship between them"], "answer": 0, "explanation": "Comma-separated patterns not connected by any relationship produce every combination of both sides (a cartesian product), like SQL's CROSS JOIN.\nThe server returns the notification \"This query builds a cartesian product between disconnected patterns\".\nIt happens when you accidentally leave out a relationship (e.g. forgetting -[:PLACED]-> between (c), (o)), and with large data it never finishes.\n", "setup": null, "scripts": [{"label": "Two unconnected patterns", "code": "MATCH (c:Customer {vipLevel: 'gold'}), (p:Product {isActive: false})\nRETURN count(*)\n"}], "results": [[{"cmd": "MATCH (c:Customer {vipLevel: 'gold'}), (p:Product {isActive: false})\nRETURN count(*)", "table": {"columns": ["count(*)"], "rows": [[73953]], "total": 1}, "warn": ["This query builds a cartesian product between disconnected patterns.：If a part of a query contains multiple disconnected patterns, this will build a cartesian product between all those parts. This may produce a large amount of data and slow down query processing. While occasionally intended, it may often be possible to reformulate the query that avoids the use of this cross product, perhaps by adding a relationship between the different parts or by using OPTIONAL MATCH (identifier is: (p))"]}]]}, {"id": "duplicate-paths", "title": "DISTINCT for friends of friends?", "question": "For customer 224's \"friends of friends\", are count(fof) and count(DISTINCT fof) the same?", "options": ["The same: MATCH never returns duplicate nodes", "B is larger", "A is larger: the same person can be reached via different friends, and each path is a row"], "answer": 2, "explanation": "MATCH returns \"every way of matching\", i.e. every path. If two friends both follow the same person, that person appears twice (44 vs 42).\nUse DISTINCT to count \"people\"; count without DISTINCT only to count \"how many paths reach them\" (e.g. the strength of a recommendation).\n", "setup": null, "scripts": [{"label": "A: count(fof)", "code": "MATCH (:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof) RETURN count(fof)\n"}, {"label": "B: count(DISTINCT fof)", "code": "MATCH (:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof) RETURN count(DISTINCT fof)\n"}], "results": [[{"cmd": "MATCH (:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof) RETURN count(fof)", "table": {"columns": ["count(fof)"], "rows": [[44]], "total": 1}}], [{"cmd": "MATCH (:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof) RETURN count(DISTINCT fof)", "table": {"columns": ["count(DISTINCT fof)"], "rows": [[42]], "total": 1}}]]}, {"id": "fof-includes-me", "title": "Can a friend of a friend be yourself?", "question": "Customers 6 and 10127 follow each other. Does 6 themselves appear in the results of (me {id: 6})-[:FOLLOWS]->()-[:FOLLOWS]->(fof)?", "options": ["Yes: 6 → 10127 → 6 uses two different relationships, so it's a valid path", "No: Cypher never returns to the starting node"], "answer": 0, "explanation": "Within one pattern, Cypher never traverses \"the same relationship\" twice (relationship isomorphism), but \"the same node\" can appear several times.\n6 → 10127 and 10127 → 6 are two different relationships, so 6 is their own \"friend of a friend\".\nIn recommendation queries remember WHERE fof <> me, and exclude people already followed.\n", "setup": null, "scripts": [{"label": "A: yourself not excluded", "code": "MATCH (me:Customer {id: 6})-[:FOLLOWS]->()-[:FOLLOWS]->(fof)\nRETURN count(fof) AS total, sum(CASE WHEN fof = me THEN 1 ELSE 0 END) AS includesMe\n"}, {"label": "B: WHERE fof <> me", "code": "MATCH (me:Customer {id: 6})-[:FOLLOWS]->()-[:FOLLOWS]->(fof)\nWHERE fof <> me\nRETURN count(fof) AS total\n"}], "results": [[{"cmd": "MATCH (me:Customer {id: 6})-[:FOLLOWS]->()-[:FOLLOWS]->(fof)\nRETURN count(fof) AS total, sum(CASE WHEN fof = me THEN 1 ELSE 0 END) AS includesMe", "table": {"columns": ["total", "includesMe"], "rows": [[30, 1]], "total": 1}}], [{"cmd": "MATCH (me:Customer {id: 6})-[:FOLLOWS]->()-[:FOLLOWS]->(fof)\nWHERE fof <> me\nRETURN count(fof) AS total", "table": {"columns": ["total"], "rows": [[29]], "total": 1}}]]}, {"id": "delete-with-relationships", "title": "DELETE a node that still has relationships", "question": "4242 has orders and follow relationships. Running MATCH (c:Customer {id: 4242}) DELETE c in a transaction, when does it fail?", "options": ["The DELETE statement fails immediately", "The DELETE looks successful and the relationships remain; it only fails at commit", "It never fails, leaving relationships without a start node"], "answer": 1, "explanation": "Neo4j doesn't allow \"dangling relationships\", but the check only happens at commit: DELETE c inside the transaction looks successful (nodesDeleted: 1),\nand the PLACED relationships to the orders are still there. Only at commit does it fail with Neo.ClientError.Schema.ConstraintValidationFailed\n(Cannot delete node … because it still has relationships), and the whole transaction fails. The showcase always rolls back, so you don't see that error here.\nDETACH DELETE deletes all of the node's relationships first, then the node. Note it doesn't delete the nodes at the other end: 4242's orders remain, as orphans nobody PLACED.\n", "setup": null, "scripts": [{"label": "A: DELETE (in a transaction)", "code": "MATCH (c:Customer {id: 4242}) DELETE c;\nMATCH ()-[r:PLACED]->(:Order {id: 59901}) RETURN count(r) AS placedStillThere\n"}, {"label": "B: DETACH DELETE", "code": "MATCH (c:Customer {id: 4242}) DETACH DELETE c;\nMATCH ()-[r:PLACED]->(:Order {id: 59901}) RETURN count(r) AS placedStillThere;\nMATCH (o:Order {id: 59901}) RETURN count(o) AS orderStillThere\n"}], "results": [[{"cmd": "MATCH (c:Customer {id: 4242}) DELETE c", "text": "Nodes deleted 1"}, {"cmd": "MATCH ()-[r:PLACED]->(:Order {id: 59901}) RETURN count(r) AS placedStillThere", "table": {"columns": ["placedStillThere"], "rows": [[1]], "total": 1}}], [{"cmd": "MATCH (c:Customer {id: 4242}) DETACH DELETE c", "text": "Nodes deleted 1, Relationships deleted 17"}, {"cmd": "MATCH ()-[r:PLACED]->(:Order {id: 59901}) RETURN count(r) AS placedStillThere", "table": {"columns": ["placedStillThere"], "rows": [[0]], "total": 1}}, {"cmd": "MATCH (o:Order {id: 59901}) RETURN count(o) AS orderStillThere", "table": {"columns": ["orderStillThere"], "rows": [[1]], "total": 1}}]]}, {"id": "match-nothing-create", "title": "When MATCH finds nothing, what about the CREATE after it?", "question": "Customer 999999 doesn't exist. What does MATCH (c:Customer {id: 999999}) CREATE (c)-[:PLACED]->(:Order {id: 900001}) do?", "options": ["An error: the customer doesn't exist", "It creates an order with no customer", "Nothing happens, and there's no error"], "answer": 2, "explanation": "Cypher processes row by row: MATCH finds 0 rows, so the CREATE runs 0 times, with no error and no notification.\nA common application bug: calling \"create order\" with the wrong id (e.g. the string '999') writes nothing yet reports success.\nTo confirm something was written, check the returned rows or the write statistics (nodesCreated), or use MERGE, or OPTIONAL MATCH with a check.\n", "setup": null, "scripts": [{"label": "CREATE after a MATCH that finds nothing", "code": "MATCH (c:Customer {id: 999999})\nCREATE (c)-[:PLACED]->(o:Order {id: 900001})\nRETURN o;\nMATCH (o:Order {id: 900001}) RETURN count(o) AS created\n"}], "results": [[{"cmd": "MATCH (c:Customer {id: 999999})\nCREATE (c)-[:PLACED]->(o:Order {id: 900001})\nRETURN o", "table": {"columns": ["o"], "rows": [], "total": 0}}, {"cmd": "MATCH (o:Order {id: 900001}) RETURN count(o) AS created", "table": {"columns": ["created"], "rows": [[0]], "total": 1}}]]}, {"id": "integer-division", "title": "Integer division", "question": "Customer 4242's 6 orders total 58,033. What does sum(o.total) / count(o) return?", "options": ["9672 (integer division, fraction dropped)", "9672.17", "An error: the types differ"], "answer": 0, "explanation": "Dividing two integers gives an integer (just like Java), with the fraction dropped. avg() always returns a float.\nFor decimals write toFloat(sum(o.total)) / count(o).\n", "setup": null, "scripts": [{"label": "A: sum / count", "code": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order) RETURN sum(o.total) / count(o)\n"}, {"label": "B: avg()", "code": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order) RETURN avg(o.total)\n"}], "results": [[{"cmd": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order) RETURN sum(o.total) / count(o)", "table": {"columns": ["sum(o.total) / count(o)"], "rows": [[9672]], "total": 1}}], [{"cmd": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order) RETURN avg(o.total)", "table": {"columns": ["avg(o.total)"], "rows": [[9672.166666666666]], "total": 1}}]]}, {"id": "type-mismatch", "title": "Querying an id with a string", "question": "Customer ids are stored as integers. How many customers does MATCH (c:Customer {id: '4242'}) (a string) find?", "options": ["0: a string and an integer aren't equal, and there's no error", "1: Cypher converts the type automatically", "An error: type mismatch"], "answer": 0, "explanation": "Neo4j has no schema enforcing property types (and the community edition has no type constraints), and comparisons don't convert types: '4242' and 4242 aren't equal, so nothing is found, with no error.\nA common source: a value from a URL parameter or JSON is a string and goes straight into the query parameters. Convert with toInteger($id), or keep types consistent when writing.\n", "setup": null, "scripts": [{"label": "A: the string '4242'", "code": "MATCH (c:Customer {id: '4242'}) RETURN count(c)\n"}, {"label": "B: the integer 4242", "code": "MATCH (c:Customer {id: 4242}) RETURN count(c)\n"}], "results": [[{"cmd": "MATCH (c:Customer {id: '4242'}) RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[0]], "total": 1}}], [{"cmd": "MATCH (c:Customer {id: 4242}) RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[1]], "total": 1}}]]}, {"id": "same-order-missing", "title": "One long path misses the same order", "question": "How many \"people who bought product 540 also bought 雅漾 保養 C693 (an Avène skincare item)\"? A is one long path, B is split into two MATCHes. Is A's number smaller?", "options": ["The same: both mean the same thing", "A is smaller: the two PLACED in one path can't be the same relationship, so people who bought both in the same order are excluded", "A is larger: one path double-counts"], "answer": 1, "explanation": "Within one MATCH pattern Cypher uses each relationship only once (relationship isomorphism), to avoid infinitely many paths from going round in circles.\nThe side effect: A's two -[:PLACED]-> must be two different relationships, i.e. two different orders;\npeople who bought 540 and the Avène item in the same order (there are 3 such orders) can't be matched in A, so it's 14 people instead of 16.\nSplit into two MATCHes, uniqueness is checked only within each pattern, and both sides can use the same PLACED.\n", "setup": null, "scripts": [{"label": "A: one path", "code": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product {name: '雅漾 保養 C693'})\nRETURN count(DISTINCT c) AS buyers\n"}, {"label": "B: two MATCHes", "code": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)\nMATCH (c)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product {name: '雅漾 保養 C693'})\nRETURN count(DISTINCT c) AS buyers\n"}], "results": [[{"cmd": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product {name: '雅漾 保養 C693'})\nRETURN count(DISTINCT c) AS buyers", "table": {"columns": ["buyers"], "rows": [[14]], "total": 1}}], [{"cmd": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)\nMATCH (c)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product {name: '雅漾 保養 C693'})\nRETURN count(DISTINCT c) AS buyers", "table": {"columns": ["buyers"], "rows": [[16]], "total": 1}}]]}], "steps": [{"id": "label-scan", "title": "No index: NodeByLabelScan", "goal": "Find a customer by email. Customer has only the uniqueness constraint on id (with its index); email has no index. Run it once, then create the index and run it again.", "question": "What is the plan without an index? Roughly how many db hits? And after creating the index?", "takeaway": "Without an index: NodeByLabelScan reads all 20,000 customers (20,001 db hits), then Filter compares email one by one (another 20,000), about 40,000 db hits in total.\nWith the index: NodeIndexSeek finds that one customer directly, 4 db hits in total.\ndb hits count Neo4j's accesses to the storage layer (reading nodes, properties, relationships); they're the most stable measure of query cost, since milliseconds are affected by caching.\n★ In a graph database, indexes are only used to find the \"starting point\"; once found, it follows relationships without any index (index-free adjacency).\n", "setup": ["CREATE INDEX customer_email IF NOT EXISTS FOR (c:Customer) ON (c.email)"], "queries": [{"label": "Find a customer by email", "code": "MATCH (c:Customer) WHERE c.email = 'user04242@example.com' RETURN c.id, c.name"}]}, {"id": "index-defeated", "title": "Compute on a property and the index can't be used", "goal": "id has an index from the uniqueness constraint. Compare c.id = 4242 with c.id + 0 = 4242 (same result).", "question": "All three return the same result. Are the plans the same?", "takeaway": "A: NodeUniqueIndexSeek, 3 db hits. B, C: NodeByLabelScan + Filter, about 40,000 db hits.\nWhen you compute on a property (c.id + 0, toString(c.id)), the planner can't use the index and has to compute every node's property and compare.\nIt's the same as in SQL: WHERE id + 0 = 4242 or WHERE lower(email) = … also defeat the index.\nThe right way is to put the computation on the \"value\" side: WHERE c.id = toInteger($id).\n", "setup": [], "queries": [{"label": "A: c.id = 4242", "code": "MATCH (c:Customer) WHERE c.id = 4242 RETURN c.name"}, {"label": "B: c.id + 0 = 4242", "code": "MATCH (c:Customer) WHERE c.id + 0 = 4242 RETURN c.name"}, {"label": "C: toString(c.id) = '4242'", "code": "MATCH (c:Customer) WHERE toString(c.id) = '4242' RETURN c.name"}]}, {"id": "range-index", "title": "Range queries: a time span", "goal": "How many orders were there in September 2026? Run it first without an index, then create a RANGE index on Order.orderDate.", "question": "What is the first step of the plan before and after the index? How different are the db hits?", "takeaway": "Without an index: NodeByLabelScan reads 80,000 orders, then Filter compares the time, about 160,000 db hits.\nWith a RANGE index: NodeIndexSeekByRange slices September straight out of the index, 2,919 orders, about 2,900 db hits.\nRANGE indexes (the default in Neo4j 5) support equality, ranges (< > >= <=), STARTS WITH and IS NOT NULL.\n", "setup": ["CREATE INDEX order_date IF NOT EXISTS FOR (o:Order) ON (o.orderDate)"], "queries": [{"label": "Orders in September 2026", "code": "MATCH (o:Order)\nWHERE o.orderDate >= datetime('2026-09-01T00:00:00+08:00') AND o.orderDate < datetime('2026-10-01T00:00:00+08:00')\nRETURN count(o)\n"}]}, {"id": "text-index", "title": "String contains: TEXT indexes", "goal": "Products whose name contains \"Sony\". A RANGE index only works for equality, ranges and STARTS WITH; CONTAINS / ENDS WITH need a TEXT index.", "question": "After creating the TEXT index, what are A's and B's plans?", "takeaway": "Without an index: both are NodeByLabelScan + Filter, about 3,000 db hits.\nAfter creating the TEXT index: A becomes NodeIndexContainsScan and B NodeIndexSeekByRange, both only 60 db hits.\nA RANGE index can't be used for CONTAINS / ENDS WITH; use a TEXT index. Real full-text search (tokenizing, relevance scores) uses a FULLTEXT index:\nCREATE FULLTEXT INDEX …, then query with db.index.fulltext.queryNodes().\n", "setup": ["CREATE TEXT INDEX product_name_text IF NOT EXISTS FOR (p:Product) ON (p.name)"], "queries": [{"label": "A: CONTAINS 'Sony'", "code": "MATCH (p:Product) WHERE p.name CONTAINS 'Sony' RETURN count(p)"}, {"label": "B: STARTS WITH 'Sony'", "code": "MATCH (p:Product) WHERE p.name STARTS WITH 'Sony' RETURN count(p)"}]}, {"id": "supernode", "title": "Starting from a supernode", "goal": "\"How many orders have my followers placed\": customer 4242 has 4 followers and customer 1 has 895. The same query from a different starting point.", "question": "Both plans are the same. How many times more db hits does one have?", "takeaway": "Both plans are identical: find the starting point with the unique index → Expand followers → Expand orders.\nThe difference is the data: 4242 has 4 followers, 106 db hits in total; customer 1 has 895 followers, about 18,700 db hits, over 170 times more.\nThe cost of a graph traversal depends on \"how many relationships are walked\", not on how big the whole database is; but with a supernode (a celebrity account, a popular tag),\nqueries that start from it or pass through it become expensive. Common remedies: restrict direction and relationship type, split relationships by time (e.g. FOLLOWED_2026),\nor precompute statistics on the supernode.\n", "setup": [], "queries": [{"label": "A: starting from customer 4242", "code": "MATCH (:Customer {id: 4242})<-[:FOLLOWS]-(fan:Customer)-[:PLACED]->(o:Order) RETURN count(o)"}, {"label": "B: starting from customer 1", "code": "MATCH (:Customer {id: 1})<-[:FOLLOWS]-(fan:Customer)-[:PLACED]->(o:Order) RETURN count(o)"}]}]}, {"id": "timescaledb", "name": "TimescaleDB", "lang": "sql", "labName": "Chunk lab", "labNote": "Every query runs with EXPLAIN ANALYZE, comparing how many chunks were read (page_views has 27, 7 days each) and the execution time. The compression and continuous aggregate labs are interactive; use the Lab page of the showcase app.", "hasResults": true, "exercises": [{"id": "daily-views", "chapter": "time_bucket basics", "title": "Views per day (Taiwan time)", "prompt": "How many page views were there on each day from 2026-09-08 to 2026-09-10 (Taiwan time, three days)?\nReturn \"the start of the day\" and the count, sorted by date.\n", "hints": ["time_bucket('1 day', view_time, 'Asia/Taipei') cuts days in Taiwan time.", "Without the third argument, time_bucket cuts in UTC, so a day starts at 8 a.m. Taiwan time."], "answer": "SELECT time_bucket('1 day', view_time, 'Asia/Taipei') AS day, count(*) AS views\nFROM page_views\nWHERE view_time >= '2026-09-08 00:00+08' AND view_time < '2026-09-11 00:00+08'\nGROUP BY day\nORDER BY day;\n", "explanation": "time_bucket is TimescaleDB's most-used function: it cuts time into fixed-length buckets (like date_trunc, but any length, e.g. 5 or 15 minutes).\n★ timestamptz is cut in UTC by default; a Taiwan \"day\" needs the time zone argument. 9/9 is a shopping festival, with 3 times the usual views.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["day", "views"], "rows": [["2026-09-08 00:00:00", 9550], ["2026-09-09 00:00:00", 28650], ["2026-09-10 00:00:00", 9550]], "total": 3}}]}, {"id": "peak-hours", "chapter": "time_bucket basics", "title": "The busiest hours of a day", "prompt": "On 2026-09-01 (Taiwan time), the 3 hours with the most views:\nreturn the start of the hour and the view count, most views first.\n", "hints": ["time_bucket('1 hour', view_time): one bucket per hour; full hours are the same in UTC and Taiwan time."], "answer": "SELECT time_bucket('1 hour', view_time) AS hour, count(*) AS views\nFROM page_views\nWHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-09-02 00:00+08'\nGROUP BY hour\nORDER BY views DESC\nLIMIT 3;\n", "explanation": "8–10 p.m. is e-commerce's traffic peak. For buckets that \"don't cross a day\", like an hour or a minute, UTC and Taiwan boundaries are the same and no time zone argument is needed;\nonly buckets that span days, like a day, week or month, need it.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["hour", "views"], "rows": [["2026-09-01 20:00:00", 900], ["2026-09-01 21:00:00", 860], ["2026-09-01 19:00:00", 820]], "total": 3}}]}, {"id": "monthly-views", "chapter": "time_bucket basics", "title": "Views per month", "prompt": "How many page_views are there in each month (Taiwan time)? Return the start of the month and the count, sorted by month.\n", "hints": ["time_bucket also accepts '1 month' (calendar months)."], "answer": "SELECT time_bucket('1 month', view_time, 'Asia/Taipei') AS month, count(*) AS views\nFROM page_views\nGROUP BY month\nORDER BY month;\n", "explanation": "'1 month' cuts by calendar month (buckets of different lengths); '30 days' is a fixed 30 days and doesn't line up with months (shown in the traps).\nThis query reads all 1.9 million rows; continuous aggregates (later exercises) exist so that reports like this don't have to be recomputed every time.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["month", "views"], "rows": [["2026-04-01 00:00:00", 309420], ["2026-05-01 00:00:00", 324700], ["2026-06-01 00:00:00", 309420], ["2026-07-01 00:00:00", 318970], ["2026-08-01 00:00:00", 324700], ["2026-09-01 00:00:00", 328520]], "total": 6}}]}, {"id": "device-share", "chapter": "time_bucket basics", "title": "Share of views per device", "prompt": "For September 2026 (Taiwan time), the views per device (device) and their percentage of the month's total views (rounded to 1 decimal),\nmost views first.\n", "hints": ["The share can use a window function: count(*) * 100.0 / sum(count(*)) OVER ()"], "answer": "SELECT device, count(*) AS views,\n       round(count(*) * 100.0 / sum(count(*)) OVER (), 1) AS pct\nFROM page_views\nWHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-10-01 00:00+08'\nGROUP BY device\nORDER BY views DESC;\n", "explanation": "TimescaleDB is entirely PostgreSQL: window functions, JOINs and CTEs all work as usual. To users, a hypertable is just an ordinary table.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["device", "views", "pct"], "rows": [["mobile", 197237, 60.0], ["desktop", 98701, 30.0], ["tablet", 32582, 9.9]], "total": 3}}]}, {"id": "weekly-orders", "chapter": "time_bucket basics", "title": "Orders and revenue per week", "prompt": "For Q3 2026 (7/1–9/30, Taiwan time), the number of orders and revenue (sum of total) per week, sorted by week.\nWeeks start on Monday.\n", "hints": ["time_bucket('1 week', …) starts weeks on Monday by default."], "answer": "SELECT time_bucket('1 week', order_time, 'Asia/Taipei') AS week, count(*) AS orders, sum(total) AS revenue\nFROM orders\nWHERE order_time >= '2026-07-01 00:00+08' AND order_time < '2026-10-01 00:00+08'\nGROUP BY week\nORDER BY week;\n", "explanation": "time_bucket's default origin is 2000-01-03 (a Monday), so week buckets start on Monday.\nThe first week starts on 6/29: 7/1 is a Wednesday, so that week has only orders from 7/1 on (WHERE filtered out the first two days).\nTo start weeks on Sunday, specify the origin: time_bucket('1 week', order_time, 'Asia/Taipei', origin => '2000-01-02').\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["week", "orders", "revenue"], "rows": [["2026-06-29 00:00:00", 497, 7037900], ["2026-07-06 00:00:00", 660, 10048032], ["2026-07-13 00:00:00", 687, 10374992], ["2026-07-20 00:00:00", 665, 9827545], ["2026-07-27 00:00:00", 647, 10090420], ["2026-08-03 00:00:00", 613, 9751145], ["2026-08-10 00:00:00", 684, 10624697], ["2026-08-17 00:00:00", 734, 10048670], ["2026-08-24 00:00:00", 691, 9484081], ["2026-08-31 00:00:00", 651, 10521553]], "total": 14}}]}, {"id": "last-reading", "chapter": "Time series analysis", "title": "The last reading of each sensor", "prompt": "The last temperature of each sensor on 2026-09-30 (Taiwan time).\nReturn sensor_id and the temperature, sorted by sensor_id.\n", "hints": ["last(value, time): the value of the last row ordered by time; first() gives the first."], "answer": "SELECT sensor_id, last(temperature, time) AS temperature\nFROM sensor_readings\nWHERE time >= '2026-09-30 00:00+08' AND time < '2026-10-01 00:00+08'\nGROUP BY sensor_id\nORDER BY sensor_id;\n", "explanation": "first() / last() are TimescaleDB aggregates that turn \"the latest value of each device\" into one line.\nIn plain PostgreSQL you'd write DISTINCT ON (sensor_id) … ORDER BY sensor_id, time DESC, or use the window function ROW_NUMBER().\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["sensor_id", "temperature"], "rows": [[1, 4.81], [2, 4.93], [3, 27.06], [4, 27.14], [5, 5.04], [6, 4.91], [7, 26.98], [8, 26.84], [9, 4.67], [10, 4.9]], "total": 12}}]}, {"id": "cold-alarm", "chapter": "Time series analysis", "title": "Cold room temperature alarms", "prompt": "Readings above 8°C from sensors in cold storage (sensors.kind = '冷藏', \"refrigerated\"):\ngrouped by sensor, return sensor_id, warehouse, the time of the first and last over-limit readings, the number of over-limit readings and the maximum temperature.\n", "hints": ["sensor_readings JOIN sensors USING (sensor_id)", "min(time), max(time), count(*), max(temperature)"], "answer": "SELECT r.sensor_id, s.warehouse, min(r.time) AS first_alarm, max(r.time) AS last_alarm,\n       count(*) AS readings, max(r.temperature) AS max_temp\nFROM sensor_readings r\nJOIN sensors s USING (sensor_id)\nWHERE s.kind = '冷藏' AND r.temperature > 8\nGROUP BY r.sensor_id, s.warehouse\nORDER BY r.sensor_id;\n", "explanation": "A hypertable can be joined with ordinary tables (sensor metadata lives in the ordinary table sensors).\nFrom 2:10 to 2:30 a.m. on 9/18, the cold storage in zone B of the Taoyuan warehouse reached 12.5°C; probably a door left open.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["sensor_id", "warehouse", "first_alarm", "last_alarm", "readings", "max_temp"], "rows": [[2, "桃園倉", "2026-09-18 02:10:00", "2026-09-18 02:30:00", 21, 12.53]], "total": 1}}]}, {"id": "gapfill", "chapter": "Time series analysis", "title": "Fill in periods without data", "prompt": "The hourly average temperature of sensor 7 from 08:00 to 16:00 on 2026-09-10 (Taiwan time).\nHours without data must be listed too (average temperature NULL), sorted by time, 8 rows in total.\n", "hints": ["A plain time_bucket only lists buckets \"that have data\".", "time_bucket_gapfill lists every bucket in the range; the range is inferred from the WHERE condition."], "answer": "SELECT time_bucket_gapfill('1 hour', time) AS hour, avg(temperature) AS avg_temp\nFROM sensor_readings\nWHERE sensor_id = 7\n  AND time >= '2026-09-10 08:00+08' AND time < '2026-09-10 16:00+08'\nGROUP BY hour\nORDER BY hour;\n", "explanation": "Sensor 7 was offline from 10:00 to 14:00, so a plain time_bucket returns only 4 rows and the gap \"disappears\" in a chart.\ntime_bucket_gapfill fills the empty buckets with NULL, so front-end charts and later calculations aren't misled.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["hour", "avg_temp"], "rows": [["2026-09-10 08:00:00", 21.637333333333338], ["2026-09-10 09:00:00", 21.26016666666668], ["2026-09-10 10:00:00", null], ["2026-09-10 11:00:00", null], ["2026-09-10 12:00:00", null], ["2026-09-10 13:00:00", null], ["2026-09-10 14:00:00", 22.157000000000004], ["2026-09-10 15:00:00", 22.87932203389831]], "total": 8}}]}, {"id": "locf", "chapter": "Time series analysis", "title": "Fill gaps with the previous value (LOCF)", "prompt": "Same as the previous exercise (sensor 7, hourly average temperature 08:00–16:00 on 9/10),\nbut fill hours without data with \"the previous value that had data\". Return the time and the filled temperature, 8 rows in total.\n", "hints": ["locf(avg(temperature)): Last Observation Carried Forward."], "answer": "SELECT time_bucket_gapfill('1 hour', time) AS hour, locf(avg(temperature)) AS avg_temp\nFROM sensor_readings\nWHERE sensor_id = 7\n  AND time >= '2026-09-10 08:00+08' AND time < '2026-09-10 16:00+08'\nGROUP BY hour\nORDER BY hour;\n", "explanation": "locf() carries the last observed value forward, which suits \"state\"-type data (temperature settings, stock levels, on/off states).\nAnother option is interpolate(): linear interpolation between the values before and after, suited to continuously changing quantities.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["hour", "avg_temp"], "rows": [["2026-09-10 08:00:00", 21.637333333333338], ["2026-09-10 09:00:00", 21.26016666666668], ["2026-09-10 10:00:00", 21.26016666666668], ["2026-09-10 11:00:00", 21.26016666666668], ["2026-09-10 12:00:00", 21.26016666666668], ["2026-09-10 13:00:00", 21.26016666666668], ["2026-09-10 14:00:00", 22.157000000000004], ["2026-09-10 15:00:00", 22.87932203389831]], "total": 8}}]}, {"id": "moving-average", "chapter": "Time series analysis", "title": "3-day moving average", "prompt": "Views per day from 2026-09-01 to 2026-09-14 (Taiwan time), and the average views over \"the last 3 days including that day\" (rounded to an integer).\nReturn the start of the day, that day's views and the 3-day average, sorted by date.\n", "hints": ["Compute each day's count with time_bucket first, then use the window function avg(…) OVER (ORDER BY day ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)."], "answer": "SELECT day, views,\n       round(avg(views) OVER (ORDER BY day ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)) AS avg_3d\nFROM (\n  SELECT time_bucket('1 day', view_time, 'Asia/Taipei') AS day, count(*) AS views\n  FROM page_views\n  WHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-09-15 00:00+08'\n  GROUP BY day\n) d\nORDER BY day;\n", "explanation": "A moving average smooths out single-day spikes (the 9/9 shopping festival) to reveal the trend. The first two days have fewer than 3 days, so they average 1 and 2 days.\nWindow functions plus time_bucket are the most common combination in time series analysis.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["day", "views", "avg_3d"], "rows": [["2026-09-01 00:00:00", 9550, 9550], ["2026-09-02 00:00:00", 9550, 9550], ["2026-09-03 00:00:00", 9550, 9550], ["2026-09-04 00:00:00", 9550, 9550], ["2026-09-05 00:00:00", 12415, 10505], ["2026-09-06 00:00:00", 12415, 11460], ["2026-09-07 00:00:00", 9550, 11460], ["2026-09-08 00:00:00", 9550, 10505], ["2026-09-09 00:00:00", 28650, 15917], ["2026-09-10 00:00:00", 9550, 15917]], "total": 14}}]}, {"id": "day-over-day", "chapter": "Time series analysis", "title": "Compared with the previous day", "prompt": "Views per day from 2026-09-08 to 2026-09-11 (Taiwan time), and the change from the previous day (NULL for the first day).\nReturn the start of the day, the views and the change, sorted by date.\n", "hints": ["lag(views) OVER (ORDER BY day)"], "answer": "SELECT day, views, views - lag(views) OVER (ORDER BY day) AS diff\nFROM (\n  SELECT time_bucket('1 day', view_time, 'Asia/Taipei') AS day, count(*) AS views\n  FROM page_views\n  WHERE view_time >= '2026-09-08 00:00+08' AND view_time < '2026-09-12 00:00+08'\n  GROUP BY day\n) d\nORDER BY day;\n", "explanation": "lag() takes the previous row's value. The first day has no \"previous day\", so it's NULL; to compare with 9/7 outside the range, query one extra day and filter it out.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["day", "views", "diff"], "rows": [["2026-09-08 00:00:00", 9550, null], ["2026-09-09 00:00:00", 28650, 19100], ["2026-09-10 00:00:00", 9550, -19100], ["2026-09-11 00:00:00", 9550, 0]], "total": 4}}]}, {"id": "cagg-hourly", "chapter": "Continuous aggregates", "title": "Hourly statistics from a continuous aggregate", "prompt": "The continuous aggregate sensor_hourly already holds each sensor's hourly average, minimum and maximum temperature.\nUse it to get sensor 2's maximum temperature per hour from 00:00 to 06:00 on 2026-09-18 (Taiwan time), sorted by time.\n", "hints": ["A continuous aggregate is used just like a view: SELECT hour, max_temp FROM sensor_hourly WHERE …"], "answer": "SELECT hour, max_temp\nFROM sensor_hourly\nWHERE sensor_id = 2 AND hour >= '2026-09-18 00:00+08' AND hour < '2026-09-18 06:00+08'\nORDER BY hour;\n", "explanation": "A continuous aggregate is \"a materialized view that updates incrementally by itself\": raw data has one row per minute, the aggregate one row per hour,\nso the query reads only 6 rows instead of scanning 360 raw rows. The more data and the more often a report runs, the bigger the difference (compared in the lab).\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["hour", "max_temp"], "rows": [["2026-09-18 00:00:00", 5.04], ["2026-09-18 01:00:00", 4.91], ["2026-09-18 02:00:00", 12.53], ["2026-09-18 03:00:00", 4.69], ["2026-09-18 04:00:00", 4.49], ["2026-09-18 05:00:00", 4.24]], "total": 6}}]}, {"id": "cagg-top-products", "chapter": "Continuous aggregates", "title": "Popular products (from the daily aggregate)", "prompt": "Using the continuous aggregate page_views_daily, find the 5 most viewed products from 2026-09-01 to 2026-09-22 (Taiwan time, inclusive):\nreturn product_id and total views, most views first.\n", "hints": ["page_views_daily has one row per \"day × product\", so sum(views) again."], "answer": "SELECT product_id, sum(views) AS views\nFROM page_views_daily\nWHERE day >= '2026-09-01 00:00+08' AND day < '2026-09-23 00:00+08'\nGROUP BY product_id\nORDER BY views DESC\nLIMIT 5;\n", "explanation": "Rolling up further from a daily aggregate (daily → monthly, product → category) is cheap.\n★ Counts and sums can be summed again; averages can't simply be averaged again (each day has a different count). Store sum and count, and divide at the end.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["product_id", "views"], "rows": [[1, 6378], [2, 2676], [3, 1995], [4, 1668], [5, 1516]], "total": 5}}]}, {"id": "chunk-count", "chapter": "Hypertables and chunks", "title": "How many chunks", "prompt": "How many chunks is the page_views hypertable split into? Return a single number.\n", "hints": ["show_chunks('page_views') lists every chunk; or query timescaledb_information.chunks."], "answer": "SELECT count(*) FROM show_chunks('page_views');\n", "explanation": "Underneath, a hypertable is many small tables (chunks), each holding one time span of data (7 days here).\nQueries read only the chunks relevant to their time range (chunk exclusion); deleting old data drops whole chunks (drop_chunks) instead of DELETEing row by row.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["count"], "rows": [[27]], "total": 1}}]}, {"id": "chunk-range", "chapter": "Hypertables and chunks", "title": "Which chunk a point in time is in", "prompt": "Which page_views chunk holds the views from 2026-09-01 12:00 (Taiwan time)?\nReturn that chunk's time range (range_start, range_end).\n", "hints": ["timescaledb_information.chunks has each chunk's hypertable_name, range_start and range_end."], "answer": "SELECT range_start, range_end\nFROM timescaledb_information.chunks\nWHERE hypertable_name = 'page_views'\n  AND range_start <= '2026-09-01 12:00+08' AND range_end > '2026-09-01 12:00+08';\n", "explanation": "Chunk boundaries align to \"fixed intervals in UTC\", so the range is 8/27 08:00 – 9/3 08:00 (Taiwan time, Thursday 8 a.m.),\nnot starting at the beginning of a month or on Monday. A recommended chunk size: the recent data (the chunk being written and its indexes) fits in about 25% of memory.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["range_start", "range_end"], "rows": [["2026-08-27 08:00:00", "2026-09-03 08:00:00"]], "total": 1}}]}, {"id": "insert-reading", "chapter": "Writes", "title": "Write a new reading", "prompt": "Sensor 2 reports at 2026-10-01 00:00 (Taiwan time): temperature 4.2, humidity 85.0.\nWrite it to sensor_readings and use RETURNING to return time, sensor_id, temperature and humidity.\n", "hints": ["INSERT INTO sensor_readings (time, sensor_id, temperature, humidity) VALUES (…) RETURNING …"], "answer": "INSERT INTO sensor_readings (time, sensor_id, temperature, humidity)\nVALUES ('2026-10-01 00:00+08', 2, 4.2, 85.0)\nRETURNING time, sensor_id, temperature, humidity;\n", "explanation": "Writing to a hypertable is exactly like writing to an ordinary table. This row's time is beyond the existing chunks, so TimescaleDB creates a new chunk automatically\n(inside this transaction; the sandbox rolls back at the end). Time series writes are mostly \"appended at the end\"; the chunk being written is small and its indexes are in memory, so writes are fast.\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["time", "sensor_id", "temperature", "humidity"], "rows": [["2026-10-01 00:00:00", 2, 4.2, 85.0]], "total": 1}}]}, {"id": "late-data", "chapter": "Writes", "title": "Write late-arriving data", "prompt": "After sensor 7 came back online, it sent a reading for 2026-09-10 11:00 (Taiwan time): temperature 21.5, humidity 61.0.\nAfter writing it, query how many readings sensor 7 has on 9/10 (Taiwan time) in total.\n", "hints": ["INSERT first, then SELECT count(*) … (the sandbox can run several statements at once)"], "answer": "INSERT INTO sensor_readings (time, sensor_id, temperature, humidity)\nVALUES ('2026-09-10 11:00+08', 7, 21.5, 61.0);\n\nSELECT count(*)\nFROM sensor_readings\nWHERE sensor_id = 7 AND time >= '2026-09-10 00:00+08' AND time < '2026-09-11 00:00+08';\n", "explanation": "Late data is written into old chunks. If that period has already been materialized by a continuous aggregate, the aggregate doesn't know automatically:\nit waits for the next refresh (refresh recomputes \"the ranges where data changed\"; TimescaleDB tracks the modified time ranges).\nIf the old chunk is already compressed, writing to it costs more too.\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["count"], "rows": [[1194]], "total": 1}}]}, {"id": "retention-delete", "chapter": "Writes", "title": "Delete old data", "prompt": "The oldest week of data is no longer needed: delete page_views from before 2026-04-08 (Taiwan time),\nand return how many rows were deleted (one row, one number).\n", "hints": ["WITH removed AS (DELETE … RETURNING 1) SELECT count(*) FROM removed"], "answer": "WITH removed AS (\n  DELETE FROM page_views\n  WHERE view_time < '2026-04-08 00:00+08'\n  RETURNING 1\n)\nSELECT count(*) FROM removed;\n", "explanation": "This takes several seconds: DELETE removes rows one by one, updates indexes, writes WAL, and needs VACUUM afterwards. Deleting 70,000 rows takes about 5 seconds in testing,\nand deleting a month (300,000 rows) exceeds the showcase's 15-second limit.\n★ TimescaleDB's way is to drop whole chunks: SELECT drop_chunks('page_views', older_than => '2026-05-01'::timestamptz).\nDropping 5 chunks takes only a few milliseconds in testing (like DROP TABLE), and leaves no dead rows to VACUUM.\nYou can also set an automatic retention policy: add_retention_policy('page_views', INTERVAL '5 months').\nNote drop_chunks only drops chunks \"entirely older than the condition\"; the chunk on the boundary stays.\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["count"], "rows": [[72580]], "total": 1}}]}], "traps": [{"id": "utc-bucket", "title": "When does time_bucket's \"day\" start?", "question": "Querying daily views for 9/8–9/10 (Taiwan time, three days). A passes no time zone argument. How many rows does it return?", "options": ["3 rows, the same as B", "4 rows: cut in UTC, each day starts at 8 a.m. Taiwan time, so an extra piece is cut at each end", "An error: timestamptz requires a time zone"], "answer": 1, "explanation": "time_bucket on timestamptz cuts in UTC by default: a Taiwan \"day\" is split in two (00:00–08:00 belongs to the previous UTC day).\nThe result has an extra row, and every day's number is wrong (the 3× traffic of the 9/9 shopping festival is split across two days).\nWhenever the bucket is a \"day, week or month\", always pass the time zone argument; the database's timezone setting doesn't affect time_bucket.\n", "setup": null, "scripts": [{"label": "A: time_bucket('1 day', view_time)", "code": "SELECT time_bucket('1 day', view_time) AS day, count(*)\nFROM page_views\nWHERE view_time >= '2026-09-08 00:00+08' AND view_time < '2026-09-11 00:00+08'\nGROUP BY day ORDER BY day;\n"}, {"label": "B: with 'Asia/Taipei'", "code": "SELECT time_bucket('1 day', view_time, 'Asia/Taipei') AS day, count(*)\nFROM page_views\nWHERE view_time >= '2026-09-08 00:00+08' AND view_time < '2026-09-11 00:00+08'\nGROUP BY day ORDER BY day;\n"}], "results": [[{"table": {"columns": ["day", "count"], "rows": [["2026-09-07 08:00:00", 670], ["2026-09-08 08:00:00", 10890], ["2026-09-09 08:00:00", 27310], ["2026-09-10 08:00:00", 8880]], "total": 4}}], [{"table": {"columns": ["day", "count"], "rows": [["2026-09-08 00:00:00", 9550], ["2026-09-09 00:00:00", 28650], ["2026-09-10 00:00:00", 9550]], "total": 3}}]]}, {"id": "thirty-days", "title": "Is '30 days' a month?", "question": "Does each bucket of time_bucket('30 days', view_time, 'Asia/Taipei') start on the 1st of a month?", "options": ["No: it cuts every 30 days from a fixed origin, so buckets start on 3/17, 4/16…, and there are 7 of them", "Yes, 30 days aligns with months automatically"], "answer": 0, "explanation": "A fixed-length bucket ('30 days') is cut every 30 days from the origin (2000-01-03 by default), which doesn't line up with calendar months,\nand leaves partial buckets at both ends. For monthly statistics use '1 month' (time_bucket supports month and year buckets).\n", "setup": null, "scripts": [{"label": "A: '30 days'", "code": "SELECT time_bucket('30 days', view_time, 'Asia/Taipei') AS bucket, count(*)\nFROM page_views GROUP BY bucket ORDER BY bucket;\n"}, {"label": "B: '1 month'", "code": "SELECT time_bucket('1 month', view_time, 'Asia/Taipei') AS bucket, count(*)\nFROM page_views GROUP BY bucket ORDER BY bucket;\n"}], "results": [[{"table": {"columns": ["bucket", "count"], "rows": [["2026-03-17 00:00:00", 154710], ["2026-04-16 00:00:00", 309420], ["2026-05-16 00:00:00", 315150], ["2026-06-15 00:00:00", 309420], ["2026-07-15 00:00:00", 309420], ["2026-08-14 00:00:00", 331385], ["2026-09-13 00:00:00", 186225]], "total": 7}}], [{"table": {"columns": ["bucket", "count"], "rows": [["2026-04-01 00:00:00", 309420], ["2026-05-01 00:00:00", 324700], ["2026-06-01 00:00:00", 309420], ["2026-07-01 00:00:00", 318970], ["2026-08-01 00:00:00", 324700], ["2026-09-01 00:00:00", 328520]], "total": 6}}]]}, {"id": "chunk-exclusion", "title": "Casting the time column", "question": "Both queries only want the data for 9/1. B casts view_time with ::date. How many chunks does B's plan read?", "options": ["1, the same as A", "2 (it spans two chunks)", "All 27: after the cast, chunk ranges can't be used, so every chunk is read"], "answer": 2, "explanation": "Chunk exclusion (reading only the relevant chunks) relies on range conditions on \"the time column itself\". After a cast or function on the column (::date, date_trunc(…), AT TIME ZONE),\nthe planner can't exclude chunks by their time ranges and has to read every chunk. It's the same reason regular indexes stop working.\n★ Always write a half-open range: time >= start AND time < end.\n", "setup": null, "scripts": [{"label": "A: a time range", "code": "EXPLAIN (COSTS OFF)\nSELECT count(*) FROM page_views\nWHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-09-02 00:00+08';\n"}, {"label": "B: view_time::date =", "code": "EXPLAIN (COSTS OFF)\nSELECT count(*) FROM page_views\nWHERE view_time::date = '2026-09-01';\n"}], "results": [[{"table": {"columns": ["QUERY PLAN"], "rows": [["Aggregate"], ["  ->  Index Only Scan using _hyper_2_262_chunk_page_views_view_time_idx on _hyper_2_262_chunk"], ["        Index Cond: ((view_time >= '2026-09-01 00:00:00+08'::timestamp with time zone) AND (view_time < '2026-09-02 00:00:00+08'::timestamp with time zone))"]], "total": 3}}], [{"table": {"columns": ["QUERY PLAN"], "rows": [["Finalize Aggregate"], ["  ->  Gather"], ["        Workers Planned: 5"], ["        ->  Parallel Custom Scan (ChunkAppend) on page_views"], ["              Chunks excluded during startup: 0"], ["              ->  Partial Aggregate"], ["                    ->  Parallel Index Only Scan using _hyper_2_263_chunk_page_views_view_time_idx on _hyper_2_263_chunk"], ["                          Filter: ((view_time)::date = '2026-09-01'::date)"], ["              ->  Partial Aggregate"], ["                    ->  Parallel Index Only Scan using _hyper_2_254_chunk_page_views_view_time_idx on _hyper_2_254_chunk"]], "total": 86}}]]}, {"id": "gapfill-range", "title": "time_bucket_gapfill without a range", "question": "What does time_bucket_gapfill do when WHERE has no time range?", "options": ["It uses the earliest and latest times in the data as the range", "It returns only periods with data, like time_bucket", "An error: it infers start and end from WHERE, and fails if it can't"], "answer": 2, "explanation": "gapfill needs to know \"from where to where\" to fill, so WHERE must have start and end conditions on the time column (or pass start and finish as function arguments).\nThe error message: missing time_bucket_gapfill argument: could not infer start from WHERE clause.\n", "setup": null, "scripts": [{"label": "gapfill without a time range", "code": "SELECT time_bucket_gapfill('1 hour', time) AS hour, avg(temperature)\nFROM sensor_readings\nWHERE sensor_id = 7\nGROUP BY hour;\n"}], "results": [[{"table": {"columns": ["錯誤"], "rows": [["ERROR: missing time_bucket_gapfill argument: could not infer start from WHERE clause\n  建議：Specify start and finish as arguments or in the WHERE clause."]], "total": 1}}]]}, {"id": "cagg-stale", "title": "A continuous aggregate without the latest data", "question": "page_views has 70,000-odd views after 9/24. Querying views after 9/24 from the continuous aggregate page_views_daily, what do you get?", "options": ["The same as B: continuous aggregates include the latest data automatically", "0: ranges not yet refreshed aren't in the continuous aggregate", "An error"], "answer": 1, "explanation": "page_views_daily has only been refreshed up to 9/24. Since TimescaleDB 2.13, new continuous aggregates default to materialized_only = true: they return only materialized data.\nIn practice you add a refresh policy: add_continuous_aggregate_policy('page_views_daily', start_offset => …, end_offset => …, schedule_interval => …),\nor turn on real-time aggregation: ALTER MATERIALIZED VIEW page_views_daily SET (timescaledb.materialized_only = false)\n(at query time \"the part not yet materialized\" is computed from the raw data and merged in; shown in the lab).\n", "setup": null, "scripts": [{"label": "A: from the continuous aggregate", "code": "SELECT coalesce(sum(views), 0) AS views\nFROM page_views_daily\nWHERE day >= '2026-09-24 00:00+08';\n"}, {"label": "B: from the raw data", "code": "SELECT count(*) AS views\nFROM page_views\nWHERE view_time >= '2026-09-24 00:00+08';\n"}], "results": [[{"table": {"columns": ["views"], "rows": [[0]], "total": 1}}], [{"table": {"columns": ["views"], "rows": [[72580]], "total": 1}}]]}, {"id": "cagg-count-rows", "title": "count(*) on a continuous aggregate", "question": "page_views_daily has one row per \"day × product\". For 9/1–9/22, which of count(*) and sum(views) equals the number of views in that period?", "options": ["sum(views)", "count(*)", "Both are the same"], "answer": 0, "explanation": "Each row of an aggregate is already the result of \"one group\", so count(*) counts groups (30,000-odd: days × products that were viewed), not the original views.\nTo roll aggregated numbers up further, use sum(views). Likewise, averages can't be averaged again: store sum and count, and divide at the end.\n", "setup": null, "scripts": [{"label": "From the continuous aggregate", "code": "SELECT count(*) AS rows, sum(views) AS views\nFROM page_views_daily\nWHERE day >= '2026-09-01 00:00+08' AND day < '2026-09-23 00:00+08';\n"}, {"label": "From the raw data (the correct answer)", "code": "SELECT count(*) AS views\nFROM page_views\nWHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-09-23 00:00+08';\n"}], "results": [[{"table": {"columns": ["rows", "views"], "rows": [[32653, 246390]], "total": 1}}], [{"table": {"columns": ["views"], "rows": [[246390]], "total": 1}}]]}], "steps": [{"id": "time-range", "title": "With vs without a time condition", "goal": "page_views has 27 chunks (7 days each). Both count views; one only for 9/1, the other for everything.", "question": "How many chunks did A and B each read?", "takeaway": "A read only 1 chunk (0.6 ms); B read all 27 (about 30 ms).\nA hypertable is cut into chunks by time, and each chunk records its own time range; when a query has a time condition, the planner skips chunks outside it (chunk exclusion),\nwithout even looking at indexes. That's why a time series database \"stays just as fast for recent data as the data keeps growing\".\n", "setup": [], "queries": [{"label": "A: one day, 9/1", "code": "SELECT count(*) FROM page_views WHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-09-02 00:00+08'"}, {"label": "B: everything", "code": "SELECT count(*) FROM page_views"}]}, {"id": "cast-defeats", "title": "Casting the time column", "goal": "Two ways to get the same result: a time range, or casting view_time to a date and comparing.", "question": "All three return the same result. Do they read the same number of chunks?", "takeaway": "A reads 1 chunk (0.6 ms); B and C return the same result but read all 27 chunks (about 60 ms, 100 times slower).\nAfter a cast or function on the time column (::date, date_trunc, AT TIME ZONE), the planner can't compare against chunk time ranges and has to read every chunk.\n★ Always write a half-open range time >= start AND time < end, and put the computation on the \"value\" side.\n", "setup": [], "queries": [{"label": "A: view_time >= … AND view_time < …", "code": "SELECT count(*) FROM page_views WHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-09-02 00:00+08'"}, {"label": "B: view_time::date = '2026-09-01'", "code": "SELECT count(*) FROM page_views WHERE view_time::date = '2026-09-01'"}, {"label": "C: date_trunc('day', view_time) = …", "code": "SELECT count(*) FROM page_views WHERE date_trunc('day', view_time) = '2026-09-01 00:00+08'"}]}, {"id": "now-relative", "title": "Relative time: now() - interval", "goal": "\"The last N days\" is the most common dashboard query. now() isn't a constant; let's see whether TimescaleDB can still exclude chunks.", "question": "B uses now(). Does it read fewer chunks? Expand the plan and see what extra condition appears in Index Cond.", "takeaway": "A's time is a constant, so chunks are excluded at planning time.\nB also reads only the relevant chunks: at planning time TimescaleDB evaluates now() - interval '30 days' into a constant,\nand the plan's Index Cond shows both the original condition and the computed time (e.g. view_time > '2026-09-08 …'), so chunks are excluded as usual.\n(Plain PostgreSQL partitioned tables can only exclude partitions with now() when execution starts; the plan shows \"Subplans Removed\".)\nThe data ends on 9/30, so B's result depends on today's date: if today is more than 30 days after 9/30, every chunk is excluded and it returns 0.\nConclusion: the common dashboard pattern \"the last N days\" is perfectly fine; no need to switch to constants.\n", "setup": [], "queries": [{"label": "A: a fixed time (30 days back from 9/30)", "code": "SELECT count(*) FROM page_views WHERE view_time > '2026-10-01 00:00+08'::timestamptz - interval '30 days'"}, {"label": "B: now() - interval '30 days' (the result depends on today's date)", "code": "SELECT count(*) FROM page_views WHERE view_time > now() - interval '30 days'"}]}, {"id": "other-column", "title": "Only a condition on a non-time column", "goal": "Only product 540's views. page_views has an index on (product_id, view_time DESC), but there's no time condition.", "question": "How many chunks did A read? How does each chunk find product 540?", "takeaway": "A has no time condition, so all 27 chunks are examined, but each chunk has its own (product_id, view_time) index and needs only one index lookup, so it's still fast (under 1 ms).\nB adds a time range and examines only 5 chunks.\nAn index created on a hypertable is automatically created on every chunk; a query does \"one index lookup per chunk\".\nThe more chunks, the more index lookups a query without a time condition needs, so don't make chunks too small (ideally the latest chunk and its indexes fit in 25% of memory).\n", "setup": [], "queries": [{"label": "A: product_id only", "code": "SELECT count(*) FROM page_views WHERE product_id = 540"}, {"label": "B: product_id + a time range", "code": "SELECT count(*) FROM page_views WHERE product_id = 540 AND view_time >= '2026-09-01 00:00+08'"}]}]}, {"id": "pgvector", "name": "pgvector", "lang": "sql", "labName": null, "labNote": null, "hasResults": true, "exercises": [{"id": "dims-norm", "chapter": "Vectors and distance", "title": "A vector's dimensions and length", "prompt": "How many dimensions does product 806's vector have, and what is its length (L2 norm)?\nReturn two columns: dimensions, length (rounded to 3 decimals).\n", "hints": ["vector_dims(embedding) returns the dimensions; vector_norm(embedding) returns the length.", "vector_norm returns double precision; cast to numeric before rounding to 3 decimals."], "answer": "SELECT vector_dims(embedding) AS dims,\n       round(vector_norm(embedding)::numeric, 3) AS norm\nFROM products\nWHERE id = 806;\n", "explanation": "All vectors here are normalized to length 1 (l2_normalize). Vectors from real embedding models (e.g. OpenAI text-embedding-3) usually have length 1 too.\nWhen every length is 1, cosine distance, L2 distance and inner product give exactly the same ranking, so you can pick the fastest, the inner product (<#>).\n★ When a column is declared vector(64), vectors of the wrong dimension can't be written; a column should only hold vectors from one model.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["dims", "norm"], "rows": [[64, 1.0]], "total": 1}}]}, {"id": "operators", "chapter": "Vectors and distance", "title": "The four distance operators", "prompt": "Compute four distances between the vectors '[3,4]' and '[6,8]', returning one row with four columns:\nL2 distance, cosine distance (both rounded to 3 decimals), negative inner product, L1 distance.\n", "hints": ["<-> L2 (Euclidean) distance; <=> cosine distance; <#> negative inner product; <+> L1 (Manhattan) distance.", "Cast the strings first: '[3,4]'::vector"], "answer": "SELECT round(('[3,4]'::vector <-> '[6,8]')::numeric, 3) AS l2,\n       round(('[3,4]'::vector <=> '[6,8]')::numeric, 3) AS cosine,\n       '[3,4]'::vector <#> '[6,8]' AS neg_inner_product,\n       '[3,4]'::vector <+> '[6,8]' AS l1;\n", "explanation": "The two vectors point the same way but one is twice as long: L2 distance 5 (it looks at length), cosine distance 0 (only direction), inner product 50.\n★ <#> returns the \"negative\" inner product (-50), because PostgreSQL indexes only sort \"ascending\"; with the sign flipped, ORDER BY ascending means inner product descending.\nCosine distance = 1 - cosine similarity, ranging 0–2: 0 same direction, 1 perpendicular, 2 opposite.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["l2", "cosine", "neg_inner_product", "l1"], "rows": [[5.0, 0.0, -50.0, 7.0]], "total": 1}}]}, {"id": "similar-products", "chapter": "Vectors and distance", "title": "The products most like a given product", "prompt": "The 5 products most like product 806 (excluding 806 itself), most similar first.\nReturn id, name and cosine similarity (= 1 - cosine distance, rounded to 3 decimals).\n", "hints": ["ORDER BY embedding <=> (SELECT embedding FROM products WHERE id = 806) LIMIT 5", "Don't forget to exclude 806 itself: its distance to itself is 0, so it always ranks first."], "answer": "SELECT id, name,\n       round((1 - (embedding <=> (SELECT embedding FROM products WHERE id = 806)))::numeric, 3) AS similarity\nFROM products\nWHERE id <> 806\nORDER BY embedding <=> (SELECT embedding FROM products WHERE id = 806)\nLIMIT 5;\n", "explanation": "The simplest \"people who viewed this also viewed\": use the product's own vector to find its nearest neighbors.\n★ ORDER BY must be \"distance\" ascending (embedding <=> x), not 1 - distance DESC: same result, but the latter can't use the vector index (shown in the traps).\nCompute the similarity in SELECT only for display.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "similarity"], "rows": [[151, "Sony 無線耳機 N677", 0.984], [627, "JBL 無線耳機 V398", 0.975], [616, "Bose 無線耳機 F988", 0.935], [1168, "Sony 無線耳機 X684", 0.926], [580, "Apple 無線耳機 A375", 0.892]], "total": 5}}]}, {"id": "pairwise", "chapter": "Vectors and distance", "title": "Pairwise similarity", "prompt": "What is the cosine similarity of product 806 (Sony wireless headphones) with each of products 537, 469 and 1132?\nReturn id, name and similarity (rounded to 3 decimals), most similar first.\n", "hints": ["Treat 806 as a and the other three as b: FROM products a, products b WHERE a.id = 806 AND b.id IN (…)"], "answer": "SELECT b.id, b.name,\n       round((1 - (a.embedding <=> b.embedding))::numeric, 3) AS similarity\nFROM products a, products b\nWHERE a.id = 806 AND b.id IN (537, 469, 1132)\nORDER BY similarity DESC;\n", "explanation": "537, also wireless headphones, has similarity 0.66; skincare and a laptop are near 0 or even negative (almost perpendicular).\nIn high-dimensional space unrelated things are \"perpendicular\", with similarity around 0; so when setting a similarity threshold, 0.3 and 0.6 mean very different things, and the real data should decide.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "similarity"], "rows": [[537, "小米 無線耳機 R870", 0.662], [1132, "SK-II 保養 S942", -0.05], [469, "Lenovo 筆電 U846", -0.137]], "total": 3}}]},
