: ["_time", "_value"], "rows": [["2026-09-18 14:00:00", 37.2308], ["2026-09-18 15:00:00", 76.4702]], "total": 2}}]]}, {"id": "same-timestamp", "title": "Two writes in the same second", "question": "The same customer (the same tag set) placed two orders in the same second, each written as a point. How many come back from a query?", "options": ["2", "1: the later one overwrote the earlier one", "The write fails: duplicate timestamp"], "answer": 1, "explanation": "The same measurement + tag set + timestamp is \"the same point\": the field values written later overwrite the earlier ones, the first order is gone, and there's no error at all.\n★ Solutions: a finer timestamp precision (ms, µs, ns), or put a distinguishing value in a tag (but not a high-cardinality one).\nThis is also how InfluxDB corrects data: write the same point in time again.\n", "setup": null, "scripts": [{"label": "Write two points, then query", "code": "# line protocol (written to scratch)\norders,city=台北市,status=paid order_id=1001i,total=500i 1790726400\norders,city=台北市,status=paid order_id=1002i,total=1200i 1790726400\n\n-- InfluxQL\nSELECT * FROM orders"}], "results": [[{"cmd": "寫入 scratch", "text": "寫入 2 行（HTTP 204）", "error": false}, {"cmd": "orders", "table": {"columns": ["time", "city", "order_id", "status", "total"], "rows": [["2026-09-30 08:00:00", "台北市", 1002, "paid", 1200]], "total": 1}}]]}, {"id": "field-type-conflict", "title": "Writing a different type to the same field", "question": "The first write is total=100i (integer), and a minute later total=1.5 (float). What happens to the second write?", "options": ["It succeeds, and total becomes a float automatically", "It fails: field type conflict; only the first point is in the database", "It succeeds, and 1.5 is truncated to 1"], "answer": 1, "explanation": "Within one shard a field can have only one type: the first write was an integer, so later floats are rejected (field type conflict).\nIn one batch (one request), a single conflicting line can get the whole batch rejected, so programs must check the response and log the failed data.\n★ When sending numbers, always decide the type explicitly (integers with i); don't infer it from whether a value \"looks like an integer\" (e.g. 100.0 serialized as 100).\n", "setup": null, "scripts": [{"label": "Two writes, then query", "code": "# line protocol (written to scratch)\norders,city=台北市 total=100i 1790726400\n\n# line protocol (written to scratch)\norders,city=台北市 total=1.5 1790726460\n\n-- InfluxQL\nSELECT * FROM orders"}], "results": [[{"cmd": "寫入 scratch", "text": "寫入 1 行（HTTP 204）", "error": false}, {"cmd": "寫入 scratch", "text": "failure writing points to database: partial write: field type conflict: input field \"total\" on measurement \"orders\" is type float, already exists as type integer dropped=1", "error": true}, {"cmd": "orders", "table": {"columns": ["time", "city", "total"], "rows": [["2026-09-30 08:00:00", "台北市", 100]], "total": 1}}]]}], "steps": [{"id": "raw", "title": "Reading raw data", "goal": "db-01's usage_user from 14:00 to 14:05 on 9/18.", "question": "Do the two results look the same?", "takeaway": "InfluxQL returns a table of \"one series, several columns\" (time, usage_user), much like SQL.\nEvery row Flux returns carries the full information: _start, _stop (the query range), _time, _value, _field, _measurement and every tag.\nFlux's data model is \"one value per row\": to see two fields side by side you have to pivot (see step 4).\n", "setup": [], "queries": [{"label": "InfluxQL", "code": "SELECT usage_user FROM cpu\nWHERE host = 'db-01' AND time >= '2026-09-18T14:00:00+08:00' AND time < '2026-09-18T14:05:00+08:00'\n"}, {"label": "Flux", "code": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-18T14:00:00+08:00, stop: 2026-09-18T14:05:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\" and r.host == \"db-01\")\n"}]}, {"id": "group", "title": "The average per host", "goal": "Each host's average usage_user on 9/18.", "question": "Flux has no GROUP BY host, so why is there still one average per host?", "takeaway": "InfluxQL computes over the whole measurement by default and needs GROUP BY tag to split it.\nFlux is the opposite: from produces one table per series (measurement + tags + field), and mean() computes once per table, so the default is \"one value per series\";\nto compute over everything together, group() first; to group by a tag, use group(columns: [\"role\"]).\n", "setup": [], "queries": [{"label": "InfluxQL", "code": "SELECT mean(usage_user) FROM cpu\nWHERE time >= '2026-09-18T00:00:00+08:00' AND time < '2026-09-19T00:00:00+08:00'\nGROUP BY host\n"}, {"label": "Flux", "code": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-18T00:00:00+08:00, stop: 2026-09-19T00:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\")\n  |> mean()\n  |> keep(columns: [\"host\", \"_value\"])\n"}]}, {"id": "timezone", "title": "Days in Taiwan time", "goal": "db-01's daily maximum on 9/18 and 9/19.", "question": "Are the time columns the same on both sides?", "takeaway": "The values are the same but the times differ: InfluxQL's time is the start of the interval (9/18 00:00), while Flux's aggregateWindow labels the end by default (9/19 00:00).\nTime zones: InfluxQL uses tz() and Flux uses option location; both must be specified explicitly, or the cut is in UTC.\n", "setup": [], "queries": [{"label": "InfluxQL", "code": "SELECT max(usage_user) FROM cpu\nWHERE host = 'db-01' AND time >= '2026-09-18T00:00:00+08:00' AND time < '2026-09-20T00:00:00+08:00'\nGROUP BY time(1d) tz('Asia/Taipei')\n"}, {"label": "Flux", "code": "import \"timezone\"\noption location = timezone.location(name: \"Asia/Taipei\")\n\nfrom(bucket: \"metrics\")\n  |> range(start: 2026-09-18T00:00:00+08:00, stop: 2026-09-20T00:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\" and r.host == \"db-01\")\n  |> aggregateWindow(every: 1d, fn: max)\n  |> keep(columns: [\"_time\", \"_value\"])\n"}]}, {"id": "arithmetic", "title": "Adding two fields", "goal": "db-01's usage_user + usage_system from 14:00 to 14:05 on 9/18.", "question": "Why does Flux need an extra pivot?", "takeaway": "An InfluxQL row has several fields, so they can be added directly. In Flux the two fields are in different tables and rows, so you pivot them into one row first (the _field values become column names), then compute with map.\nmap can produce any new column and is more powerful than InfluxQL's arithmetic (string handling, conditionals, joins across measurements).\n", "setup": [], "queries": [{"label": "InfluxQL", "code": "SELECT usage_user + usage_system AS total FROM cpu\nWHERE host = 'db-01' AND time >= '2026-09-18T14:00:00+08:00' AND time < '2026-09-18T14:05:00+08:00'\n"}, {"label": "Flux", "code": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-18T14:00:00+08:00, stop: 2026-09-18T14:05:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r.host == \"db-01\")\n  |> pivot(rowKey: [\"_time\"], columnKey: [\"_field\"], valueColumn: \"_value\")\n  |> map(fn: (r) => ({ _time: r._time, total: r.usage_user + r.usage_system }))\n"}]}, {"id": "ranking", "title": "Ranking across series", "goal": "The 3 hosts with the highest average usage_user over all of September.", "question": "How do the two approaches differ?", "takeaway": "InfluxQL can't ORDER BY a value; it can only use top(field, tag, N), \"the maximum per tag group, then the top N groups\", and needs a subquery to rank across series.\nFlux merges into one table with group(), then sorts and limits, the same way you'd think in SQL.\ndb-01 ranks first (the database is usually busier, plus the 9/18 incident).\n", "setup": [], "queries": [{"label": "InfluxQL", "code": "SELECT top(mean, host, 3) FROM (\n  SELECT mean(usage_user) FROM cpu\n  WHERE time >= '2026-09-01T00:00:00+08:00' AND time < '2026-10-01T00:00:00+08:00'\n  GROUP BY host\n)\n"}, {"label": "Flux", "code": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-01T00:00:00+08:00, stop: 2026-10-01T00:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\")\n  |> mean()\n  |> group()\n  |> sort(columns: [\"_value\"], desc: true)\n  |> limit(n: 3)\n  |> keep(columns: [\"host\", \"_value\"])\n"}]}, {"id": "join", "title": "Across measurements: CPU and memory", "goal": "Each host's average CPU and average memory usage on 9/30, in the same row.", "question": "Can InfluxQL put two measurements in the same row?", "takeaway": "InfluxQL has no JOIN: you can only run two queries and merge them in the application.\nFlux can join different measurements, different buckets, and even (with the sql package) relational database data; that's one of the main reasons Flux was designed.\nweb-03 went offline on 9/20 and has no data on 9/30, so the result has only 4 hosts.\n(InfluxDB 3 went back to SQL: JOINs, subqueries and window functions are all written in standard SQL.)\n", "setup": [], "queries": [{"label": "InfluxQL", "code": "SELECT mean(usage_user) FROM cpu\nWHERE time >= '2026-09-30T00:00:00+08:00' AND time < '2026-10-01T00:00:00+08:00' GROUP BY host;\nSELECT mean(used_percent) FROM mem\nWHERE time >= '2026-09-30T00:00:00+08:00' AND time < '2026-10-01T00:00:00+08:00' GROUP BY host\n"}, {"label": "Flux", "code": "cpu = from(bucket: \"metrics\")\n  |> range(start: 2026-09-30T00:00:00+08:00, stop: 2026-10-01T00:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\")\n  |> mean()\nmem = from(bucket: \"metrics\")\n  |> range(start: 2026-09-30T00:00:00+08:00, stop: 2026-10-01T00:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"mem\" and r._field == \"used_percent\")\n  |> mean()\njoin(tables: { cpu: cpu, mem: mem }, on: [\"host\"])\n  |> keep(columns: [\"host\", \"_value_cpu\", \"_value_mem\"])\n"}]}]}, {"id": "elasticsearch", "name": "Elasticsearch", "lang": "es", "labName": "Relevance lab", "labNote": "Each step searches the same data with a different query, comparing the top hits and _score: IDF, field length, field boosts, function_score, and filters that don't score. The analyzer and write-behavior labs (near real-time, version conflicts, mappings, synonyms, deep paging) are interactive; use the Lab page of the showcase app.", "hasResults": true, "exercises": [{"id": "get-doc", "chapter": "Query basics", "title": "Get a document by _id", "prompt": "Get the product with _id 806 from the products index.\n", "hints": ["GET /index/_doc/_id"], "answer": "GET /products/_doc/806\n", "explanation": "Getting a document by _id is \"real-time\" (realtime GET): even if it was just written and not yet refreshed, you get it (not necessarily so with _search; see the lab).\n_version, _seq_no and _primary_term in the response are used for optimistic locking (if_seq_no / if_primary_term).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /products/_doc/806  (200)", "text": "{\n  \"_index\": \"products\",\n  \"_id\": \"806\",\n  \"_version\": 1,\n  \"_seq_no\": 805,\n  \"_primary_term\": 1,\n  \"found\": true,\n  \"_source\": {\n    \"name\": \"Sony 無線耳機 F178\",\n    \"brand\": \"Sony\",\n    \"category\": \"無線耳機\",\n    \"category_path\": [\n      \"3C電子\",\n      \"耳機\",\n      \"無線耳機\"\n    ],\n    \"description\": \"Sony 無線耳機：藍色，藍牙無線，主動降噪，續航 10 小時\",\n    \"price\": 3279,\n    \"stock\": 58,\n    \"is_active\": true,\n    \"tags\": [],\n    \"specs\": {\n      \"color\": \"藍\",\n      \"warranty\": {\n        \"type\": \"店家\",\n        \"years\": 2\n      },\n      \"battery_hours\": 10,\n      \"noise_cancelling\": true\n    },\n    \"created_at\": \"2021-09-03\",\n    \"rating\": 3.1,\n    \"review_count\": 13\n  }\n}"}]}, {"id": "match-basic", "chapter": "Query basics", "title": "Full-text search: match", "prompt": "Products whose description (description) mentions 「降噪」 (noise cancelling), sorted by relevance, top 5.\n", "hints": ["GET /products/_search with the body { \"size\": 5, \"query\": { \"match\": { field: text } } }"], "answer": "GET /products/_search\n{\n  \"size\": 5,\n  \"query\": { \"match\": { \"description\": \"降噪\" } }\n}\n", "explanation": "match first runs the text through the field's analyzer (description uses cjk) to turn 「降噪」 into terms, looks up documents containing those terms in the inverted index, and scores relevance (_score) with BM25.\nDocuments with the same score are ordered by their position in the index. hits.total in the response is the number of matches (above 10,000 it reports only \"≥ 10000\" by default).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /products/_search  (200)", "table": {"columns": ["_id", "_score", "name", "description", "price", "rating"], "rows": [["127", 2.989, "小米 無線耳機 W381", "小米 無線耳機：銀色，藍牙無線，主動降噪，續航 8 小時", 4119, 4.2], ["151", 2.989, "Sony 無線耳機 N677", "Sony 無線耳機：藍色，藍牙無線，主動降噪，續航 30 小時", 5439, 4.6], ["192", 2.989, "Bose 無線耳機 H452", "Bose 無線耳機：黑色，藍牙無線，主動降噪，續航 24 小時", 5799, 2.9], ["233", 2.989, "Sony 無線耳機 X216", "Sony 無線耳機：白色，藍牙無線，主動降噪，續航 6 小時", 4699, 3.5], ["252", 2.989, "JBL 無線耳機 O984", "JBL 無線耳機：黑色，藍牙無線，主動降噪，續航 8 小時", 3859, 4.3]], "total": 38}}]}, {"id": "term-keyword", "chapter": "Query basics", "title": "Exact match: term", "prompt": "How many products have the brand (brand) Sony? Return the count with _count.\n", "hints": ["brand is a keyword field: the whole value is stored unchanged as one term, matched exactly with term.", "GET /products/_count { \"query\": { \"term\": { … } } }"], "answer": "GET /products/_count\n{\n  \"query\": { \"term\": { \"brand\": \"Sony\" } }\n}\n", "explanation": "term doesn't analyze the query text; it looks up \"Sony\" in the inverted index as-is. The keyword field also stores the original \"Sony\", so they match.\n★ term on a text field often finds nothing: text fields store analyzed terms (lowercased, split), e.g. name stores \"sony\" (shown in the traps).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /products/_count  (200)", "text": "{\n  \"count\": 59\n}"}]}, {"id": "bool-filter", "chapter": "Query basics", "title": "bool + filter: several conditions", "prompt": "List every product whose category (category) is 「無線耳機」 (wireless headphones), with a price of 3000–6000 (inclusive) and the tag (tags) 「熱銷」 (best seller), sorted by price, lowest first.\n", "hints": ["bool's filter holds yes/no conditions: no scoring, and cacheable.", "Use range for price: { \"range\": { \"price\": { \"gte\": 3000, \"lte\": 6000 } } }", "Sort: \"sort\": [{ \"price\": \"asc\" }]"], "answer": "GET /products/_search\n{\n  \"query\": {\n    \"bool\": {\n      \"filter\": [\n        { \"term\": { \"category\": \"無線耳機\" } },\n        { \"range\": { \"price\": { \"gte\": 3000, \"lte\": 6000 } } },\n        { \"term\": { \"tags\": \"熱銷\" } }\n      ]\n    }\n  },\n  \"sort\": [{ \"price\": \"asc\" }]\n}\n", "explanation": "bool has four clauses: must (must match, scored), filter (must match, not scored), should (adds score; with no must / filter at least one must match), must_not (must not match, not scored).\n★ Conditions that don't need relevance (category, price, status, time) always go in filter: no scoring, and results are cached so repeated queries are faster.\ntags is a keyword array; term matches if any value in the array matches.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /products/_search  (200)", "table": {"columns": ["_id", "_score", "name", "description", "price", "rating"], "rows": [["212", null, "JBL 無線耳機 N850", "JBL 無線耳機：黑色，藍牙無線，主動降噪，續航 8 小時。熱銷", 3359, 3.1], ["859", null, "小米 無線耳機 C633", "小米 無線耳機：白色，藍牙無線，續航 8 小時。熱銷", 3399, 4.6], ["478", null, "Sony 無線耳機 W220", "Sony 無線耳機：白色，藍牙無線，續航 30 小時。熱銷、特價", 3779, 4.0], ["226", null, "Apple 無線耳機 L590", "Apple 無線耳機：白色，藍牙無線，主動降噪，續航 30 小時。熱銷、環保", 3809, 4.5], ["614", null, "Sony 無線耳機 U778", "Sony 無線耳機：白色，藍牙無線，續航 10 小時。熱銷", 4069, 3.3], ["1455", null, "Sony 無線耳機 N905", "Sony 無線耳機：黑色，藍牙無線，主動降噪，續航 6 小時。新品、熱銷、特價", 4329, null], ["1163", null, "Apple 無線耳機 L887", "Apple 無線耳機：藍色，藍牙無線，續航 6 小時。熱銷", 4589, 2.6], ["1222", null, "Bose 無線耳機 Y206", "Bose 無線耳機：銀色，藍牙無線，續航 30 小時。熱銷", 5329, 4.4]], "total": 8}}]}, {"id": "time-range", "chapter": "Query basics", "title": "A time range + a numeric range", "prompt": "In logs, how many records between 14:00 and 14:40 on 2026-09-18 (Taiwan time, excluding 14:40) have a status of 500 or above?\n", "hints": ["Times can be written directly as ISO 8601 with a time zone: \"2026-09-18T14:00:00+08:00\"", "Put both ranges in bool's filter."], "answer": "GET /logs/_count\n{\n  \"query\": {\n    \"bool\": {\n      \"filter\": [\n        { \"range\": { \"@timestamp\": { \"gte\": \"2026-09-18T14:00:00+08:00\", \"lt\": \"2026-09-18T14:40:00+08:00\" } } },\n        { \"range\": { \"status\": { \"gte\": 500 } } }\n      ]\n    }\n  }\n}\n", "explanation": "Date fields are stored in Elasticsearch as UTC milliseconds; write the time zone (+08:00) in queries, or use range's \"time_zone\" parameter.\nThese 40 minutes are the payment incident: payment timeouts (504) and failed orders (500).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /logs/_count  (200)", "text": "{\n  \"count\": 508\n}"}]}, {"id": "sort-source", "chapter": "Query basics", "title": "Sorting and returning only some fields", "prompt": "The 5 products with the highest rating (rating); on equal ratings, more reviews (review_count) first; on equal review counts, lower price first.\nReturn only the three fields name, rating and review_count.\n", "hints": ["\"sort\": [{ \"rating\": \"desc\" }, { \"review_count\": \"desc\" }, …]", "\"_source\": [\"name\", \"rating\", \"review_count\"] returns only these fields."], "answer": "GET /products/_search\n{\n  \"size\": 5,\n  \"_source\": [\"name\", \"rating\", \"review_count\"],\n  \"sort\": [\n    { \"rating\": \"desc\" },\n    { \"review_count\": \"desc\" },\n    { \"price\": \"asc\" }\n  ]\n}\n", "explanation": "With sort, no relevance score is computed (_score is null); documents are sorted by field values (using doc values, a columnar store).\n★ A product rated 5.0 may have only 1 review. Real \"popularity\" sorting also takes the number of reviews into account (e.g. a Bayesian average), or adjusts scores with function_score.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /products/_search  (200)", "table": {"columns": ["_id", "_score", "name", "rating", "review_count"], "rows": [["1339", null, "乖乖 零食 H461", 5.0, 5], ["348", null, "Kiehls 保養 Z504", 4.9, 16], ["1335", null, "UNIQLO 男裝 I287", 4.9, 14], ["850", null, "Coleman 露營用品 I954", 4.9, 12], ["1063", null, "金車 飲料 R547", 4.8, 14]], "total": 1500}}]}, {"id": "analyze-cjk", "chapter": "Full-text search and analyzers", "title": "See which terms an analyzer produces", "prompt": "Analyze 「主動降噪耳機」 (active noise-cancelling headphones) with the cjk analyzer and see which terms it produces.\n", "hints": ["POST /_analyze { \"analyzer\": \"cjk\", \"text\": \"…\" }"], "answer": "POST /_analyze\n{\n  \"analyzer\": \"cjk\",\n  \"text\": \"主動降噪耳機\"\n}\n", "explanation": "The cjk analyzer pairs CJK characters two at a time (bigrams): 主動, 動降, 降噪, 噪耳, 耳機.\nThe standard analyzer makes each character a term (主, 動, 降, 噪, 耳, 機), so 「降噪」 is split apart and searches easily match a pile of unrelated documents.\nNeither does real \"word segmentation\": Chinese segmentation needs a plugin (IK, smartcn, jieba) to produce 主動 / 降噪 / 耳機.\nYou can also name an index field: POST /products/_analyze { \"field\": \"name\", \"text\": \"…\" } uses that field's analyzer.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "POST /_analyze  (200)", "text": "{\n  \"tokens\": [\n    {\n      \"token\": \"主動\",\n      \"start_offset\": 0,\n      \"end_offset\": 2,\n      \"type\": \"<DOUBLE>\",\n      \"position\": 0\n    },\n    {\n      \"token\": \"動降\",\n      \"start_offset\": 1,\n      \"end_offset\": 3,\n      \"type\": \"<DOUBLE>\",\n      \"position\": 1\n    },\n    {\n      \"token\": \"降噪\",\n      \"start_offset\": 2,\n      \"end_offset\": 4,\n      \"type\": \"<DOUBLE>\",\n      \"position\": 2\n    },\n    {\n      \"token\": \"噪耳\",\n      \"start_offset\": 3,\n      \"end_offset\": 5,\n      \"type\": \"<DOUBLE>\",\n      \"position\": 3\n    },\n    {\n      \"token\": \"耳機\",\n      \"start_offset\": 4,\n      \"end_offset\": 6,\n      \"type\": \"<DOUBLE>\",\n      \"position\": 4\n    }\n  ]\n}"}]}, {"id": "match-and", "chapter": "Full-text search and analyzers", "title": "Every term must appear: operator and", "prompt": "How many reviews mention both 「音質」 (sound quality) and 「降噪」 (noise cancelling) in their content (content)?\n", "hints": ["match is OR by default: any matching term counts.", "{ \"match\": { \"content\": { \"query\": \"音質 降噪\", \"operator\": \"and\" } } }"], "answer": "GET /reviews/_count\n{\n  \"query\": {\n    \"match\": { \"content\": { \"query\": \"音質 降噪\", \"operator\": \"and\" } }\n  }\n}\n", "explanation": "match's default operator is or: 「音質 降噪」 matches anything with either 「音質」 or 「降噪」, giving far more results.\noperator and requires every term; for the middle ground use minimum_should_match (e.g. \"75%\", \"2\").\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /reviews/_count  (200)", "text": "{\n  \"count\": 93\n}"}]}, {"id": "match-phrase", "chapter": "Full-text search and analyzers", "title": "Phrases: match_phrase", "prompt": "How many reviews contain the exact phrase 「通勤戴很舒服」 (\"very comfortable to wear while commuting\")?\n", "hints": ["match_phrase: every term must appear, in order and adjacent."], "answer": "GET /reviews/_count\n{\n  \"query\": { \"match_phrase\": { \"content\": \"通勤戴很舒服\" } }\n}\n", "explanation": "match matches if any term (通勤, 勤戴, 戴很, 很舒, 舒服) appears, finding over two thousand; match_phrase requires those terms in order and adjacent, so only reviews that really contain the sentence match.\nBesides \"which documents have this term\", the inverted index also records each term's position in the document, which match_phrase uses.\nThe slop parameter allows a few terms in between.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /reviews/_count  (200)", "text": "{\n  \"count\": 266\n}"}]}, {"id": "multi-match", "chapter": "Full-text search and analyzers", "title": "Several fields + boosts", "prompt": "Search for 「Sony 耳機」 (\"Sony headphones\"): search both name and description, with name weighted 3 times description; top 5.\n", "hints": ["multi_match's fields can be written as \"name^3\" to multiply by 3."], "answer": "GET /products/_search\n{\n  \"size\": 5,\n  \"query\": {\n    \"multi_match\": {\n      \"query\": \"Sony 耳機\",\n      \"fields\": [\"name^3\", \"description\"]\n    }\n  }\n}\n", "explanation": "multi_match defaults to best_fields: each field is scored separately and the highest is taken (plus tie_breaker times the other fields).\nOther types: most_fields (field scores added), cross_fields (several fields treated as one big field, good for first and last names stored separately), phrase.\nBoosting is the most common tool for tuning relevance: titles and names usually matter more than body text.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /products/_search  (200)", "table": {"columns": ["_id", "_score", "name", "description", "price", "rating"], "rows": [["151", 14.75, "Sony 無線耳機 N677", "Sony 無線耳機：藍色，藍牙無線，主動降噪，續航 30 小時", 5439, 4.6], ["159", 14.75, "Sony 無線耳機 U730", "Sony 無線耳機：白色，藍牙無線，續航 24 小時", 3769, 4.3], ["233", 14.75, "Sony 無線耳機 X216", "Sony 無線耳機：白色，藍牙無線，主動降噪，續航 6 小時", 4699, 3.5], ["249", 14.75, "Sony 有線耳機 P576", "Sony 有線耳機：銀色，線長 1.2 公尺", 1579, 3.8], ["274", 14.75, "Sony 有線耳機 J909", "Sony 有線耳機：白色，線長 2.0 公尺", 2279, 3.7]], "total": 178}}]}, {"id": "fuzzy", "chapter": "Full-text search and analyzers", "title": "Find it despite typos: fuzziness", "prompt": "A user typed Samsung as \"Samsng\". How many products does a match with fuzziness (\"AUTO\") on the name field find?\n", "hints": ["{ \"match\": { \"name\": { \"query\": \"Samsng\", \"fuzziness\": \"AUTO\" } } }"], "answer": "GET /products/_count\n{\n  \"query\": {\n    \"match\": { \"name\": { \"query\": \"Samsng\", \"fuzziness\": \"AUTO\" } }\n  }\n}\n", "explanation": "fuzziness finds similar terms by edit distance (Levenshtein): samsng → samsung is one inserted letter (distance 1).\nAUTO: no errors for 1–2 characters, 1 for 3–5 characters, 2 for longer.\n★ It doesn't help much with Chinese bigrams (one wrong character in a two-character term makes a different term); Chinese typos and homophones are usually handled with synonym lists or pinyin plugins.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /products/_count  (200)", "text": "{\n  \"count\": 16\n}"}]}, {"id": "should-minimum", "chapter": "Full-text search and analyzers", "title": "Match at least some of them: minimum_should_match", "prompt": "How many reviews mention \"at least two\" of the three terms 「音質」 (sound quality), 「續航」 (battery life) and 「降噪」 (noise cancelling)?\n", "hints": ["Put three match_phrase clauses in bool's should, then add \"minimum_should_match\": 2"], "answer": "GET /reviews/_count\n{\n  \"query\": {\n    \"bool\": {\n      \"should\": [\n        { \"match_phrase\": { \"content\": \"音質\" } },\n        { \"match_phrase\": { \"content\": \"續航\" } },\n        { \"match_phrase\": { \"content\": \"降噪\" } }\n      ],\n      \"minimum_should_match\": 2\n    }\n  }\n}\n", "explanation": "should is \"extra score\" by default: the more it matches, the higher the score. With no must / filter at least one must match; adding minimum_should_match makes it \"match at least N\".\nmatch works too: 「音質」, 「續航」 and 「降噪」 are each two characters, so cjk analyzes each into exactly one term.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /reviews/_count  (200)", "text": "{\n  \"count\": 244\n}"}]}, {"id": "terms-agg", "chapter": "Aggregations", "title": "Group and count: terms", "prompt": "The 5 brands (brand) with the most products, and each one's product count. Only the aggregation result is needed, no documents (size: 0).\n", "hints": ["\"aggs\": { \"by_brand\": { \"terms\": { \"field\": \"brand\", \"size\": 5 } } }"], "answer": "GET /products/_search\n{\n  \"size\": 0,\n  \"aggs\": {\n    \"by_brand\": { \"terms\": { \"field\": \"brand\", \"size\": 5 } }\n  }\n}\n", "explanation": "A terms aggregation ≈ SQL's GROUP BY … ORDER BY count(*) DESC LIMIT 5. By default it sorts by doc_count descending, ties by key.\n★ With many shards terms counts are approximate: each shard takes its own top shard_size first and then they're merged, which can undercount (doc_count_error_upper_bound is the possible error).\nterms works only on fields with doc values like keyword and numbers; not on text fields (use their .keyword subfield).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /products/_search  (200)", "text": "hits.total = 1500\naggregations = {\n  \"by_brand\": {\n    \"doc_count_error_upper_bound\": 0,\n    \"sum_other_doc_count\": 1216,\n    \"buckets\": [\n      {\n        \"key\": \"IKEA\",\n        \"doc_count\": 69\n      },\n      {\n        \"key\": \"Sony\",\n        \"doc_count\": 59\n      },\n      {\n        \"key\": \"宜得利\",\n        \"doc_count\": 54\n      },\n      {\n        \"key\": \"Adidas\",\n        \"doc_count\": 51\n      },\n      {\n        \"key\": \"Decathlon\",\n        \"doc_count\": 51\n      }\n    ]\n  }\n}"}]}, {"id": "avg-by-category", "chapter": "Aggregations", "title": "Group averages + sorting by a sub-aggregation", "prompt": "The average price of each category (category), sorted by average price, highest first (all 19 categories).\n", "hints": ["Put an avg sub-aggregation inside terms.", "terms' \"order\": { \"sub-aggregation name\": \"desc\" } sorts by the sub-aggregation's value."], "answer": "GET /products/_search\n{\n  \"size\": 0,\n  \"aggs\": {\n    \"by_category\": {\n      \"terms\": { \"field\": \"category\", \"size\": 30, \"order\": { \"avg_price\": \"desc\" } },\n      \"aggs\": {\n        \"avg_price\": { \"avg\": { \"field\": \"price\" } }\n      }\n    }\n  }\n}\n", "explanation": "Aggregations nest level by level: outer grouping (bucket aggregations: terms, date_histogram, range…), inner computation (metric aggregations: avg, sum, max, percentiles, cardinality…).\nSorting by a sub-aggregation has larger errors with many shards (each shard's top few aren't necessarily the overall top few).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /products/_search  (200)", "text": "hits.total = 1500\naggregations = {\n  \"by_category\": {\n    \"doc_count_error_upper_bound\": 0,\n    \"sum_other_doc_count\": 0,\n    \"buckets\": [\n      {\n        \"key\": \"筆電\",\n        \"doc_count\": 76,\n        \"avg_price\": {\n          \"value\": 34454.65789473684\n        }\n      },\n      {\n        \"key\": \"手機\",\n        \"doc_count\": 78,\n        \"avg_price\": {\n          \"value\": 18475.02564102564\n        }\n      },\n      {\n        \"key\": \"無線耳機\",\n        \"doc_count\": 69,\n        \"avg_price\": {\n          \"value\": 3809.7246376811595\n        }\n      },\n      {\n        \"key\": \"運動鞋\",\n        \"doc_count\": 82,\n        \"avg_price\": {\n          \"value\": 3225.4634146341464\n        }\n      },\n      {\n        \"key\": \"露營用品\",\n        \"doc_count\": 86,\n        \"avg_price\": {\n          \"value\": 3116.6744186046512\n        }\n      },\n      {\n        \"key\": \"休閒鞋\",\n        \"doc_count\": 80,\n        \"avg_price\": {\n          \"value\": 2101.625\n        }\n      },\n      {\n        \"key\": \"健身器材\",\n        \"doc_count\": 69,\n        \"avg_price\": {\n          \"value\": 1850.0144927536232\n        }\n      },\n      {\n        \"key\": \"寢具\",\n        \"doc_count\": 95,\n        \"avg_price\": {\n          \"value\": 1801.842105263158\n        }\n      },\n      {\n        \"key\": \"有線耳機\",\n        \"doc_count\": 92,\n        \"avg_price\": {\n          \"value\": 1332.0434782608695\n        }\n      },\n      {\n        \"key\": \"保養\",\n        \"doc_count\": 68,\n        \"avg_price\": {\n          \"value\": 1124.2941176470588\n        }\n      },\n      {\n        \"key\": \"女裝\",\n        \"doc_count\": 91,\n        \"avg_price\": {\n          \"value\": 1074.3846153846155\n        }\n      },\n      {\n        \"key\": \"廚房用品\",\n        \"doc_count\": 71,\n        \"avg_price\": {\n          \"value\": 931.9577464788732\n        }\n      },\n      {\n        \"key\": \"男裝\",\n        \"doc_count\": 79,\n \n… (truncated)"}]}, {"id": "orders-per-day", "chapter": "Aggregations", "title": "Grouping by time: date_histogram", "prompt": "The number of orders per day from September 1 to September 7, 2026 (Taiwan time, 7 days).\n", "hints": ["First filter these 7 days with range, then use date_histogram's calendar_interval: day.", "Add \"time_zone\": \"+08:00\" to date_histogram so days start at midnight Taiwan time."], "answer": "GET /orders/_search\n{\n  \"size\": 0,\n  \"query\": {\n    \"range\": { \"order_date\": { \"gte\": \"2026-09-01T00:00:00+08:00\", \"lt\": \"2026-09-08T00:00:00+08:00\" } }\n  },\n  \"aggs\": {\n    \"per_day\": {\n      \"date_histogram\": { \"field\": \"order_date\", \"calendar_interval\": \"day\", \"time_zone\": \"+08:00\" }\n    }\n  }\n}\n", "explanation": "date_histogram ≈ TimescaleDB's time_bucket: calendar_interval (day, week, month, by calendar) or fixed_interval (1h, 10m, fixed length).\n★ Without time_zone it cuts in UTC, a Taiwan day starts at 8 a.m., and every day's number is wrong (the same trap as time_bucket).\nKibana's bar and line charts are date_histogram underneath.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /orders/_search  (200)", "text": "hits.total = 641\naggregations = {\n  \"per_day\": {\n    \"buckets\": [\n      {\n        \"key_as_string\": \"2026-09-01T00:00:00.000+08:00\",\n        \"key\": 1788192000000,\n        \"doc_count\": 87\n      },\n      {\n        \"key_as_string\": \"2026-09-02T00:00:00.000+08:00\",\n        \"key\": 1788278400000,\n        \"doc_count\": 102\n      },\n      {\n        \"key_as_string\": \"2026-09-03T00:00:00.000+08:00\",\n        \"key\": 1788364800000,\n        \"doc_count\": 95\n      },\n      {\n        \"key_as_string\": \"2026-09-04T00:00:00.000+08:00\",\n        \"key\": 1788451200000,\n        \"doc_count\": 87\n      },\n      {\n        \"key_as_string\": \"2026-09-05T00:00:00.000+08:00\",\n        \"key\": 1788537600000,\n        \"doc_count\": 98\n      },\n      {\n        \"key_as_string\": \"2026-09-06T00:00:00.000+08:00\",\n        \"key\": 1788624000000,\n        \"doc_count\": 82\n      },\n      {\n        \"key_as_string\": \"2026-09-07T00:00:00.000+08:00\",\n        \"key\": 1788710400000,\n        \"doc_count\": 90\n      }\n    ]\n  }\n}"}]}, {"id": "p95-latency", "chapter": "Aggregations", "title": "P95 latency per service", "prompt": "For each service (service) in logs, the number of requests and the 95th percentile (P95) of latency_ms. Services sorted by request count, highest first, all listed (7).\n", "hints": ["Put percentiles as a terms sub-aggregation: { \"percentiles\": { \"field\": \"latency_ms\", \"percents\": [95] } }"], "answer": "GET /logs/_search\n{\n  \"size\": 0,\n  \"aggs\": {\n    \"by_service\": {\n      \"terms\": { \"field\": \"service\", \"size\": 10 },\n      \"aggs\": {\n        \"p95\": { \"percentiles\": { \"field\": \"latency_ms\", \"percents\": [95] } }\n      }\n    }\n  }\n}\n", "explanation": "Monitoring looks at P95 and P99, not the average: the average is dragged down by huge numbers of fast requests and hides \"a few users waiting a long time\".\npayment's P95 is nearly 30 seconds, caused by the timeouts in the 9/18 incident.\npercentiles are approximate (the TDigest algorithm), computing very accurate percentiles with very little memory.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /logs/_search  (200)", "text": "hits.total = 10000+\naggregations = {\n  \"by_service\": {\n    \"doc_count_error_upper_bound\": 0,\n    \"sum_other_doc_count\": 0,\n    \"buckets\": [\n      {\n        \"key\": \"product\",\n        \"doc_count\": 66080,\n        \"p95\": {\n          \"values\": {\n            \"95.0\": 68.51674747896942\n          }\n        }\n      },\n      {\n        \"key\": \"search\",\n        \"doc_count\": 39964,\n        \"p95\": {\n          \"values\": {\n            \"95.0\": 184.49786608483407\n          }\n        }\n      },\n      {\n        \"key\": \"cart\",\n        \"doc_count\": 36287,\n        \"p95\": {\n          \"values\": {\n            \"95.0\": 73.77211210090357\n          }\n        }\n      },\n      {\n        \"key\": \"order\",\n        \"doc_count\": 24549,\n        \"p95\": {\n          \"values\": {\n            \"95.0\": 223.13152161716005\n          }\n        }\n      },\n      {\n        \"key\": \"gateway\",\n        \"doc_count\": 15497,\n        \"p95\": {\n          \"values\": {\n            \"95.0\": 6.927526924877918\n          }\n        }\n      },\n      {\n        \"key\": \"auth\",\n        \"doc_count\": 13938,\n        \"p95\": {\n          \"values\": {\n            \"95.0\": 137.17132031108693\n          }\n        }\n      },\n      {\n        \"key\": \"payment\",\n        \"doc_count\": 6585,\n        \"p95\": {\n          \"values\": {\n            \"95.0\": 28600.13030133928\n          }\n        }\n      }\n    ]\n  }\n}"}]}, {"id": "incident-hours", "chapter": "Aggregations", "title": "Find incidents: 5xx per hour", "prompt": "Records in September with status ≥ 500, grouped by hour (Taiwan time), listing only hours with more than 20 (min_doc_count: 21).\n", "hints": ["Filter status with range in query, and aggregate with date_histogram (fixed_interval: 1h, time_zone: +08:00, min_doc_count: 21)."], "answer": "GET /logs/_search\n{\n  \"size\": 0,\n  \"query\": { \"range\": { \"status\": { \"gte\": 500 } } },\n  \"aggs\": {\n    \"per_hour\": {\n      \"date_histogram\": {\n        \"field\": \"@timestamp\",\n        \"fixed_interval\": \"1h\",\n        \"time_zone\": \"+08:00\",\n        \"min_doc_count\": 21\n      }\n    }\n  }\n}\n", "explanation": "Both incidents stand out at a glance: 2 p.m. on 9/18 (payment timeouts) and 3 a.m. on 9/25 (the cart couldn't reach Redis).\nmin_doc_count defaults to 0 (empty intervals are listed too, so charts don't break); raise it when hunting anomalies to see only \"high-volume\" intervals.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /logs/_search  (200)", "text": "hits.total = 1046\naggregations = {\n  \"per_hour\": {\n    \"buckets\": [\n      {\n        \"key_as_string\": \"2026-09-18T14:00:00.000+08:00\",\n        \"key\": 1789711200000,\n        \"doc_count\": 508\n      },\n      {\n        \"key_as_string\": \"2026-09-25T03:00:00.000+08:00\",\n        \"key\": 1790276400000,\n        \"doc_count\": 400\n      }\n    ]\n  }\n}"}]}, {"id": "top-404-ip", "chapter": "Aggregations", "title": "Who is scanning the site", "prompt": "Among records with status 404, the 3 IPs with the most hits and their counts.\n", "hints": ["The ip field has the ip type, and can be aggregated with terms too."], "answer": "GET /logs/_search\n{\n  \"size\": 0,\n  \"query\": { \"term\": { \"status\": 404 } },\n  \"aggs\": {\n    \"top_ip\": { \"terms\": { \"field\": \"ip\", \"size\": 3 } }\n  }\n}\n", "explanation": "198.51.100.66 alone has over 1,500 404s (in the early hours of 9/12, probing URLs like /.env and /wp-login.php), while normal users have single digits.\nThis is what SIEM (security information and event management) commonly does: use aggregations to find anomalous sources.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /logs/_search  (200)", "text": "hits.total = 2888\naggregations = {\n  \"top_ip\": {\n    \"doc_count_error_upper_bound\": 0,\n    \"sum_other_doc_count\": 1373,\n    \"buckets\": [\n      {\n        \"key\": \"198.51.100.66\",\n        \"doc_count\": 1501\n      },\n      {\n        \"key\": \"192.0.2.194\",\n        \"doc_count\": 7\n      },\n      {\n        \"key\": \"192.0.2.222\",\n        \"doc_count\": 7\n      }\n    ]\n  }\n}"}]}, {"id": "unique-users", "chapter": "Aggregations", "title": "How many distinct users: cardinality", "prompt": "How many distinct user_id values are in logs?\n", "hints": ["{ \"cardinality\": { \"field\": \"user_id\" } }"], "answer": "GET /logs/_search\n{\n  \"size\": 0,\n  \"aggs\": {\n    \"users\": { \"cardinality\": { \"field\": \"user_id\" } }\n  }\n}\n", "explanation": "cardinality ≈ count(DISTINCT …), but approximate (HyperLogLog++): memory use is fixed no matter how many millions of distinct values there are.\nBelow precision_threshold (default 3000) it's nearly exact; above it the error is about 1–2%. For an exact number, page through every value with a composite aggregation.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /logs/_search  (200)", "text": "hits.total = 10000+\naggregations = {\n  \"users\": {\n    \"value\": 19786\n  }\n}"}]}, {"id": "nested-query", "chapter": "Nested documents", "title": "One item meeting both conditions: nested", "prompt": "orders.items has the nested type. How many orders contain a single item whose category is 「手機」 (phones) and whose quantity is ≥ 2?\n", "hints": ["{ \"nested\": { \"path\": \"items\", \"query\": { \"bool\": { \"filter\": [ … ] } } } }", "Fields inside nested use the full path: items.category, items.quantity"], "answer": "GET /orders/_count\n{\n  \"query\": {\n    \"nested\": {\n      \"path\": \"items\",\n      \"query\": {\n        \"bool\": {\n          \"filter\": [\n            { \"term\": { \"items.category\": \"手機\" } },\n            { \"range\": { \"items.quantity\": { \"gte\": 2 } } }\n          ]\n        }\n      }\n    }\n  }\n}\n", "explanation": "With the nested type each item is a separate hidden document, and a nested query matches both conditions within \"the same item\".\n★ If items were a plain object (orders_object), items would be flattened into items.category = [手機, 男裝], items.quantity = [1, 3],\nso 「手機」 and \"quantity 3\" from different items would also match (shown in the traps).\nThe cost: each item is a Lucene document (_cat/indices docs.count is 280,000, not 80,000), and updating an order rewrites the whole thing.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /orders/_count  (200)", "text": "{\n  \"count\": 3465\n}"}]}, {"id": "nested-agg", "chapter": "Nested documents", "title": "Aggregating items: nested aggregation", "prompt": "Group all order items by category (items.category), compute the total quantity sold per category (sum of items.quantity), and take the top 5 categories by quantity.\n", "hints": ["Use a { \"nested\": { \"path\": \"items\" } } aggregation on the outside; only inside it can you group by items.* fields.", "Sort terms by the sub-aggregation: \"order\": { \"qty\": \"desc\" }"], "answer": "GET /orders/_search\n{\n  \"size\": 0,\n  \"aggs\": {\n    \"items\": {\n      \"nested\": { \"path\": \"items\" },\n      \"aggs\": {\n        \"by_category\": {\n          \"terms\": { \"field\": \"items.category\", \"size\": 5, \"order\": { \"qty\": \"desc\" } },\n          \"aggs\": {\n            \"qty\": { \"sum\": { \"field\": \"items.quantity\" } }\n          }\n        }\n      }\n    }\n  }\n}\n", "explanation": "To aggregate nested fields, you must first \"enter\" the items with a nested aggregation; a terms aggregation directly on items.category gives an empty result.\nTo go back from items to the order level (e.g. how many \"orders\" per category), use reverse_nested.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /orders/_search  (200)", "text": "hits.total = 10000+\naggregations = {\n  \"items\": {\n    \"doc_count\": 200115,\n    \"by_category\": {\n      \"doc_count_error_upper_bound\": -1,\n      \"sum_other_doc_count\": 140094,\n      \"buckets\": [\n        {\n          \"key\": \"寢具\",\n          \"doc_count\": 13374,\n          \"qty\": {\n            \"value\": 19440.0\n          }\n        },\n        {\n          \"key\": \"女裝\",\n          \"doc_count\": 12105,\n          \"qty\": {\n            \"value\": 17690.0\n          }\n        },\n        {\n          \"key\": \"收納\",\n          \"doc_count\": 12120,\n          \"qty\": {\n            \"value\": 17544.0\n          }\n        },\n        {\n          \"key\": \"手機\",\n          \"doc_count\": 11421,\n          \"qty\": {\n            \"value\": 16793.0\n          }\n        },\n        {\n          \"key\": \"有線耳機\",\n          \"doc_count\": 11001,\n          \"qty\": {\n            \"value\": 16107.0\n          }\n        }\n      ]\n    }\n  }\n}"}]}, {"id": "index-doc", "chapter": "Writes", "title": "Add a document", "prompt": "Add a review to scratch_reviews with _id review-1:\nproduct_id 806, rating 5, title 「很滿意」 (\"very satisfied\"), content 「降噪效果很棒，通勤戴很舒服」 (\"great noise cancelling, very comfortable while commuting\"), verified true.\n", "hints": ["PUT /scratch_reviews/_doc/review-1 with the JSON document (PUT when you choose the _id; POST /index/_doc to let Elasticsearch generate one)."], "answer": "PUT /scratch_reviews/_doc/review-1\n{\n  \"product_id\": 806,\n  \"rating\": 5,\n  \"title\": \"很滿意\",\n  \"content\": \"降噪效果很棒，通勤戴很舒服\",\n  \"verified\": true\n}\n", "explanation": "PUT with an _id: if it already exists the whole document is overwritten (_version + 1); for \"insert only if absent\" use PUT /index/_create/review-1.\nAfter writing, it's searchable only after a refresh (1 second by default); getting it by _id is real-time. Use _bulk for bulk writes.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "PUT /scratch_reviews/_doc/review-1  (201)", "text": "{\n  \"_index\": \"scratch_reviews\",\n  \"_id\": \"review-1\",\n  \"_version\": 1,\n  \"result\": \"created\",\n  \"_seq_no\": 290,\n  \"_primary_term\": 1\n}"}], "checks": [{"cmd": "GET /scratch_reviews/_doc/review-1  (200)", "text": "{\n  \"_index\": \"scratch_reviews\",\n  \"_id\": \"review-1\",\n  \"_version\": 1,\n  \"_seq_no\": 290,\n  \"_primary_term\": 1,\n  \"found\": true,\n  \"_source\": {\n    \"product_id\": 806,\n    \"rating\": 5,\n    \"title\": \"很滿意\",\n    \"content\": \"降噪效果很棒，通勤戴很舒服\",\n    \"verified\": true\n  }\n}"}]}, {"id": "partial-update", "chapter": "Writes", "title": "Partial update: _update", "prompt": "In scratch_products, change product 806's price to 2990 and its stock to 0, leaving the other fields unchanged.\n", "hints": ["POST /scratch_products/_update/806 { \"doc\": { … } }"], "answer": "POST /scratch_products/_update/806\n{\n  \"doc\": { \"price\": 2990, \"stock\": 0 }\n}\n", "explanation": "Elasticsearch documents can't be modified: _update is really \"read the whole document → merge → rewrite it whole and mark the old one deleted\", costing about as much as a full PUT overwrite, just with less data sent.\nOld versions are only purged when segments merge, so workloads that frequently update the same document (e.g. counters) don't suit Elasticsearch.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "POST /scratch_products/_update/806  (200)", "text": "{\n  \"_index\": \"scratch_products\",\n  \"_id\": \"806\",\n  \"_version\": 2,\n  \"result\": \"updated\",\n  \"_seq_no\": 59,\n  \"_primary_term\": 1\n}"}], "checks": [{"cmd": "GET /scratch_products/_doc/806  (200)", "text": "{\n  \"_index\": \"scratch_products\",\n  \"_id\": \"806\",\n  \"_version\": 2,\n  \"_seq_no\": 59,\n  \"_primary_term\": 1,\n  \"found\": true,\n  \"_source\": {\n    \"name\": \"Sony 無線耳機 F178\",\n    \"brand\": \"Sony\",\n    \"category\": \"無線耳機\",\n    \"category_path\": [\n      \"3C電子\",\n      \"耳機\",\n      \"無線耳機\"\n    ],\n    \"description\": \"Sony 無線耳機：藍色，藍牙無線，主動降噪，續航 10 小時\",\n    \"price\": 2990,\n    \"stock\": 0,\n    \"is_active\": true,\n    \"tags\": [],\n    \"specs\": {\n      \"color\": \"藍\",\n      \"warranty\": {\n        \"type\": \"店家\",\n        \"years\": 2\n      },\n      \"battery_hours\": 10,\n      \"noise_cancelling\": true\n    },\n    \"created_at\": \"2021-09-03\",\n    \"rating\": 3.1,\n    \"review_count\": 13\n  }\n}"}]}, {"id": "update-by-query", "chapter": "Writes", "title": "Bulk update: _update_by_query", "prompt": "In scratch_products, add 「週年慶」 (anniversary sale) to the tags of every product in the 「無線耳機」 (wireless headphones) category.\n", "hints": ["POST /scratch_products/_update_by_query, with query and script in the body.", "\"script\": { \"source\": \"ctx._source.tags.add(params.tag)\", \"params\": { \"tag\": \"週年慶\" } }"], "answer": "POST /scratch_products/_update_by_query\n{\n  \"query\": { \"term\": { \"category\": \"無線耳機\" } },\n  \"script\": {\n    \"source\": \"ctx._source.tags.add(params.tag)\",\n    \"params\": { \"tag\": \"週年慶\" }\n  }\n}\n", "explanation": "_update_by_query runs a painless script on every matching document (ctx._source is the document's content); updated in the response is how many were updated.\n★ Pass values through params; don't concatenate them into the script string: scripts are compiled and cached, and constantly changing content recompiles every time (and may hit the compilation rate limit).\nBy default it aborts on version conflicts (someone else editing at the same time); conflicts=proceed skips conflicting documents and continues.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "POST /scratch_products/_update_by_query  (200)", "text": "{\n  \"total\": 19,\n  \"updated\": 19,\n  \"deleted\": 0,\n  \"batches\": 1,\n  \"version_conflicts\": 0,\n  \"noops\": 0,\n  \"retries\": {\n    \"bulk\": 0,\n    \"search\": 0\n  },\n  \"throttled_millis\": 0,\n  \"requests_per_second\": -1.0,\n  \"throttled_until_millis\": 0,\n  \"failures\": []\n}"}], "checks": [{"cmd": "POST /scratch_products/_refresh  (200)", "text": "{}"}, {"cmd": "GET /scratch_products/_count  (200)", "text": "{\n  \"count\": 19\n}"}]}, {"id": "bulk", "chapter": "Writes", "title": "Write several at once: _bulk", "prompt": "Use \"one\" _bulk request on scratch_reviews to do three things:\nadd a review with _id b1 (rating 5), add a review with _id b2 (rating 1), then update b1's helpful to 10.\nWrite any content you like; use product_id 806.\n", "hints": ["_bulk is NDJSON: one line of action (index / create / update / delete), and the next line is the content (delete has none).", "{\"index\": {\"_id\": \"b1\"}} followed by the document; {\"update\": {\"_id\": \"b1\"}} followed by {\"doc\": {…}}"], "answer": "POST /scratch_reviews/_bulk\n{\"index\": {\"_id\": \"b1\"}}\n{\"product_id\": 806, \"rating\": 5, \"content\": \"音質很好\", \"helpful\": 0}\n{\"index\": {\"_id\": \"b2\"}}\n{\"product_id\": 806, \"rating\": 1, \"content\": \"用沒多久就壞了\", \"helpful\": 0}\n{\"update\": {\"_id\": \"b1\"}}\n{\"doc\": {\"helpful\": 10}}\n", "explanation": "_bulk puts many write actions in one request, saving a network round trip for each; it's the standard way to write in bulk (about 5–15 MB per batch).\n★ _bulk isn't a transaction: each action succeeds or fails on its own; when errors in the response is true, check items one by one to find the failures.\nThis exercise's check looks only at b1's rating and helpful and b2's rating, so the content can be anything.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "POST /scratch_reviews/_bulk  (200)", "text": "{\n  \"errors\": false,\n  \"items\": [\n    {\n      \"index\": {\n        \"_index\": \"scratch_reviews\",\n        \"_id\": \"b1\",\n        \"_version\": 1,\n        \"result\": \"created\",\n        \"_shards\": {\n          \"total\": 1,\n          \"successful\": 1,\n          \"failed\": 0\n        },\n        \"_seq_no\": 290,\n        \"_primary_term\": 1,\n        \"status\": 201\n      }\n    },\n    {\n      \"index\": {\n        \"_index\": \"scratch_reviews\",\n        \"_id\": \"b2\",\n        \"_version\": 1,\n        \"result\": \"created\",\n        \"_shards\": {\n          \"total\": 1,\n          \"successful\": 1,\n          \"failed\": 0\n        },\n        \"_seq_no\": 291,\n        \"_primary_term\": 1,\n        \"status\": 201\n      }\n    },\n    {\n      \"update\": {\n        \"_index\": \"scratch_reviews\",\n        \"_id\": \"b1\",\n        \"_version\": 2,\n        \"result\": \"updated\",\n        \"_shards\": {\n          \"total\": 1,\n          \"successful\": 1,\n          \"failed\": 0\n        },\n        \"_seq_no\": 292,\n        \"_primary_term\": 1,\n        \"status\": 200\n      }\n    }\n  ]\n}"}], "checks": [{"cmd": "GET /scratch_reviews/_doc/b1?_source=rating,helpful  (200)", "text": "{\n  \"_index\": \"scratch_reviews\",\n  \"_id\": \"b1\",\n  \"_version\": 2,\n  \"_seq_no\": 292,\n  \"_primary_term\": 1,\n  \"found\": true,\n  \"_source\": {\n    \"rating\": 5,\n    \"helpful\": 10\n  }\n}"}, {"cmd": "GET /scratch_reviews/_doc/b2?_source=rating  (200)", "text": "{\n  \"_index\": \"scratch_reviews\",\n  \"_id\": \"b2\",\n  \"_version\": 1,\n  \"_seq_no\": 291,\n  \"_primary_term\": 1,\n  \"found\": true,\n  \"_source\": {\n    \"rating\": 1\n  }\n}"}]}, {"id": "delete-by-query", "chapter": "Writes", "title": "Delete by condition: _delete_by_query", "prompt": "Delete every review in scratch_reviews that has 1 star (rating 1) and isn't verified (verified is false).\n", "hints": ["POST /scratch_reviews/_delete_by_query { \"query\": { \"bool\": { \"filter\": [ … ] } } }"], "answer": "POST /scratch_reviews/_delete_by_query\n{\n  \"query\": {\n    \"bool\": {\n      \"filter\": [\n        { \"term\": { \"rating\": 1 } },\n        { \"term\": { \"verified\": false } }\n      ]\n    }\n  }\n}\n", "explanation": "_delete_by_query searches first and then deletes in batches (the documents matching at the snapshot). Deletion only marks documents; space is reclaimed when segments merge.\n★ To delete \"a whole period of old data\" (e.g. logs older than 30 days), don't use delete_by_query: split indices by time (logs-2026.09, or a data stream) and delete whole indices, which is fast and leaves no garbage.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "POST /scratch_reviews/_delete_by_query  (200)", "text": "{\n  \"total\": 2,\n  \"deleted\": 2,\n  \"batches\": 1,\n  \"version_conflicts\": 0,\n  \"noops\": 0,\n  \"retries\": {\n    \"bulk\": 0,\n    \"search\": 0\n  },\n  \"throttled_millis\": 0,\n  \"requests_per_second\": -1.0,\n  \"throttled_until_millis\": 0,\n  \"failures\": []\n}"}], "checks": [{"cmd": "POST /scratch_reviews/_refresh  (200)", "text": "{}"}, {"cmd": "GET /scratch_reviews/_count  (200)", "text": "{\n  \"count\": 288\n}"}]}], "traps": [{"id": "term-on-text", "title": "term on a text field", "question": "name is a text field (cjk analyzer) with content like 「Sony 無線耳機 F178」. How many products does A find with term \"Sony\"?", "options": ["The same as B, 59", "0", "An error: term can't be used on text fields"], "answer": 1, "explanation": "A text field stores analyzed terms: the analyzer lowercases, so the inverted index holds \"sony\", not \"Sony\". term doesn't analyze the query text, so looking up \"Sony\" naturally finds nothing, with no error.\n★ Rule: use match on text fields (the query text goes through the same analyzer as at write time); use term / range on keyword, numbers and dates.\nLikewise, querying \"sony\" (lowercase) on the keyword field brand finds 0: keyword isn't analyzed, so case must match exactly.\n", "setup": null, "scripts": [{"label": "A: term on the text field name", "code": "GET /products/_count\n{ \"query\": { \"term\": { \"name\": \"Sony\" } } }\n"}, {"label": "B: term on the keyword field brand", "code": "GET /products/_count\n{ \"query\": { \"term\": { \"brand\": \"Sony\" } } }\n"}], "results": [[{"cmd": "GET /products/_count  (200)", "text": "{\n  \"count\": 0\n}"}], [{"cmd": "GET /products/_count  (200)", "text": "{\n  \"count\": 59\n}"}]]}, {"id": "match-is-or", "title": "match on a whole sentence", "question": "Only two hundred-odd reviews really contain the sentence 「通勤戴很舒服」 (\"very comfortable to wear while commuting\"). How many does A find with match?", "options": ["About the same as B", "Many times more than B", "Fewer than B: match requires every term"], "answer": 1, "explanation": "The cjk analyzer cuts this sentence into five terms, 通勤, 勤戴, 戴很, 很舒, 舒服, and match is OR by default: any one of them matches.\n「舒服」 and 「很舒」 (\"comfortable\") appear in many reviews (comfortable to wear, comfortable to sleep on), so A finds over two thousand.\nThe most relevant ones still rank first, but \"the total number of matches\" is far off; for precision use match_phrase, or operator and, or minimum_should_match.\n", "setup": null, "scripts": [{"label": "A: match", "code": "GET /reviews/_count\n{ \"query\": { \"match\": { \"content\": \"通勤戴很舒服\" } } }\n"}, {"label": "B: match_phrase", "code": "GET /reviews/_count\n{ \"query\": { \"match_phrase\": { \"content\": \"通勤戴很舒服\" } } }\n"}], "results": [[{"cmd": "GET /reviews/_count  (200)", "text": "{\n  \"count\": 2756\n}"}], [{"cmd": "GET /reviews/_count  (200)", "text": "{\n  \"count\": 266\n}"}]]}, {"id": "standard-on-chinese", "title": "Searching Chinese with the standard analyzer", "question": "content.std uses the default standard analyzer (one Chinese character per term). How many reviews does searching 「音質」 (sound quality) find?", "options": ["The same as B", "Many more than B, mixed with lots of reviews that have nothing to do with sound quality", "0: standard doesn't support Chinese"], "answer": 1, "explanation": "standard splits 「音質」 into the two terms 「音」 and 「質」, and match defaults to OR: reviews with 「質」 (good quality, good meat texture) also match, several times as many as with cjk.\nThe top hit is still about sound quality (documents with both characters score higher), but lots of noise is recalled, and aggregations and counts will be wrong.\n★ Chinese fields need the right analyzer: cjk (bigrams, no plugin), smartcn, IK (real segmentation, plugin required). The analyzer is fixed when the index is created; changing it later needs a reindex.\n", "setup": null, "scripts": [{"label": "A: content.std (standard)", "code": "GET /reviews/_search\n{\n  \"size\": 3, \"_source\": [\"content\"],\n  \"query\": { \"match\": { \"content.std\": \"音質\" } }\n}\n"}, {"label": "B: content (cjk)", "code": "GET /reviews/_search\n{\n  \"size\": 3, \"_source\": [\"content\"],\n  \"query\": { \"match\": { \"content\": \"音質\" } }\n}\n"}], "results": [[{"cmd": "GET /reviews/_search  (200)", "table": {"columns": ["_id", "_score", "content"], "rows": [["361", 6.149, "低音很飽滿，音質很清楚，品質很好。"], ["1636", 6.149, "音質很清楚，低音很飽滿，品質很好。"], ["2880", 6.149, "低音很飽滿，音質很清楚，品質很好。"]], "total": 4509}}], [{"cmd": "GET /reviews/_search  (200)", "table": {"columns": ["_id", "_score", "content"], "rows": [["2013", 4.111, "音質很好，會再回購。"], ["2179", 4.111, "音質很好，品質很好。"], ["2974", 4.111, "音質很好，會再回購。"]], "total": 695}}]]}, {"id": "object-vs-nested", "title": "Cross-matching in object arrays", "question": "Same orders, same condition (one item is a phone with quantity ≥ 2), but orders_object's items is a plain object. How many does A find?", "options": ["The same as B", "More than B", "Fewer than B"], "answer": 1, "explanation": "Object arrays are flattened: an order's items.category = [手機, 男裝], items.quantity = [1, 3], and each condition checks \"whether the array has it\" independently,\nso a phone (quantity 1) and menswear (quantity 3) from different items also match. A finds more, and the extra ones are all wrong.\n★ When objects in an array need \"the fields of the same object matched together\", the mapping must use nested (and queries must use nested queries).\n", "setup": null, "scripts": [{"label": "A: orders_object (object)", "code": "GET /orders_object/_count\n{\n  \"query\": { \"bool\": { \"filter\": [\n    { \"term\": { \"items.category\": \"手機\" } },\n    { \"range\": { \"items.quantity\": { \"gte\": 2 } } }\n  ] } }\n}\n"}, {"label": "B: orders (nested)", "code": "GET /orders/_count\n{\n  \"query\": { \"nested\": { \"path\": \"items\", \"query\": { \"bool\": { \"filter\": [\n    { \"term\": { \"items.category\": \"手機\" } },\n    { \"range\": { \"items.quantity\": { \"gte\": 2 } } }\n  ] } } } }\n}\n"}], "results": [[{"cmd": "GET /orders_object/_count  (200)", "text": "{\n  \"count\": 6884\n}"}], [{"cmd": "GET /orders/_count  (200)", "text": "{\n  \"count\": 3465\n}"}]]}, {"id": "nested-doc-count", "title": "How many documents does orders have?", "question": "orders has 80,000 orders and 200,000 items (nested). What does docs.count in _cat/indices show?", "options": ["80000, the same as _count", "280115", "200115"], "answer": 1, "explanation": "Each nested object is a separate (hidden) document in Lucene, stored with its parent: 80,000 + 200,000 = 280,000.\n_count and _search count only top-level documents (80,000); _cat/indices shows the Lucene-level count.\nnested is handy, but every item is a document: with many items the index grows, and updating any item rewrites the whole order.\n", "setup": null, "scripts": [{"label": "A: _cat/indices", "code": "GET /_cat/indices/orders?v&h=index,docs.count\n"}, {"label": "B: _count", "code": "GET /orders/_count\n"}], "results": [[{"cmd": "GET /_cat/indices/orders?v&h=index,docs.count  (200)", "text": "index  docs.count\norders     280115"}], [{"cmd": "GET /orders/_count  (200)", "text": "{\n  \"count\": 80000\n}"}]]}, {"id": "total-10000", "title": "What is hits.total?", "question": "reviews has over 20,000 reviews. Searching without any condition, what is hits.total.value?", "options": ["21556", "10000, with relation gte", "10, since size defaults to 10"], "answer": 1, "explanation": "For performance, Elasticsearch counts exactly only up to 10,000 by default: beyond that total is { \"value\": 10000, \"relation\": \"gte\" } (at least ten thousand).\nThat way it can stop early once it has found \"the top few\", without counting every matching document.\nFor an exact number: track_total_hits: true, or just use _count. For pagination, \"N pages in total\" is usually shown as \"10,000+\".\n", "setup": null, "scripts": [{"label": "A: the default", "code": "GET /reviews/_search\n{ \"size\": 0 }\n"}, {"label": "B: track_total_hits: true", "code": "GET /reviews/_search\n{ \"size\": 0, \"track_total_hits\": true }\n"}], "results": [[{"cmd": "GET /reviews/_search  (200)", "text": "hits.total = 10000+"}], [{"cmd": "GET /reviews/_search  (200)", "text": "hits.total = 21556"}]]}, {"id": "no-time-zone", "title": "date_histogram without a time zone", "question": "Orders per day for 9/1–9/7 (Taiwan time). A has no time_zone. How many buckets does it return?", "options": ["7, the same as B", "8: cut in UTC, a Taiwan day starts at 8 a.m., leaving an extra piece at each end", "An error"], "answer": 1, "explanation": "Date fields are stored in UTC, and date_histogram also cuts in UTC by default: 00:00–08:00 on 9/1 Taiwan time belongs to 8/31 in UTC, so there's an extra bucket and every day's number is wrong.\nIt's the same trap as TimescaleDB's time_bucket. Kibana automatically passes the browser's time zone; remember to add it in your own queries.\n", "setup": null, "scripts": [{"label": "A: no time_zone", "code": "GET /orders/_search\n{\n  \"size\": 0,\n  \"query\": { \"range\": { \"order_date\": { \"gte\": \"2026-09-01T00:00:00+08:00\", \"lt\": \"2026-09-08T00:00:00+08:00\" } } },\n  \"aggs\": { \"per_day\": { \"date_histogram\": { \"field\": \"order_date\", \"calendar_interval\": \"day\" } } }\n}\n"}, {"label": "B: time_zone +08:00", "code": "GET /orders/_search\n{\n  \"size\": 0,\n  \"query\": { \"range\": { \"order_date\": { \"gte\": \"2026-09-01T00:00:00+08:00\", \"lt\": \"2026-09-08T00:00:00+08:00\" } } },\n  \"aggs\": { \"per_day\": { \"date_histogram\": { \"field\": \"order_date\", \"calendar_interval\": \"day\", \"time_zone\": \"+08:00\" } } }\n}\n"}], "results": [[{"cmd": "GET /orders/_search  (200)", "text": "hits.total = 641\naggregations = {\n  \"per_day\": {\n    \"buckets\": [\n      {\n        \"key_as_string\": \"2026-08-31T00:00:00.000Z\",\n        \"key\": 1788134400000,\n        \"doc_count\": 30\n      },\n      {\n        \"key_as_string\": \"2026-09-01T00:00:00.000Z\",\n        \"key\": 1788220800000,\n        \"doc_count\": 92\n      },\n      {\n        \"key_as_string\": \"2026-09-02T00:00:00.000Z\",\n        \"key\": 1788307200000,\n        \"doc_count\": 98\n      },\n      {\n        \"key_as_string\": \"2026-09-03T00:00:00.000Z\",\n        \"key\": 1788393600000,\n        \"doc_count\": 94\n      },\n      {\n        \"key_as_string\": \"2026-09-04T00:00:00.000Z\",\n        \"key\": 1788480000000,\n        \"doc_count\": 95\n      },\n      {\n        \"key_as_string\": \"2026-09-05T00:00:00.000Z\",\n        \"key\": 1788566400000,\n        \"doc_count\": 93\n      },\n      {\n        \"key_as_string\": \"2026-09-06T00:00:00.000Z\",\n        \"key\": 1788652800000,\n        \"doc_count\": 85\n      },\n      {\n        \"key_as_string\": \"2026-09-07T00:00:00.000Z\",\n        \"key\": 1788739200000,\n        \"doc_count\": 54\n      }\n    ]\n  }\n}"}], [{"cmd": "GET /orders/_search  (200)", "text": "hits.total = 641\naggregations = {\n  \"per_day\": {\n    \"buckets\": [\n      {\n        \"key_as_string\": \"2026-09-01T00:00:00.000+08:00\",\n        \"key\": 1788192000000,\n        \"doc_count\": 87\n      },\n      {\n        \"key_as_string\": \"2026-09-02T00:00:00.000+08:00\",\n        \"key\": 1788278400000,\n        \"doc_count\": 102\n      },\n      {\n        \"key_as_string\": \"2026-09-03T00:00:00.000+08:00\",\n        \"key\": 1788364800000,\n        \"doc_count\": 95\n      },\n      {\n        \"key_as_string\": \"2026-09-04T00:00:00.000+08:00\",\n        \"key\": 1788451200000,\n        \"doc_count\": 87\n      },\n      {\n        \"key_as_string\": \"2026-09-05T00:00:00.000+08:00\",\n        \"key\": 1788537600000,\n        \"doc_count\": 98\n      },\n      {\n        \"key_as_string\": \"2026-09-06T00:00:00.000+08:00\",\n        \"key\": 1788624000000,\n        \"doc_count\": 82\n      },\n      {\n        \"key_as_string\": \"2026-09-07T00:00:00.000+08:00\",\n        \"key\": 1788710400000,\n        \"doc_count\": 90\n      }\n    ]\n  }\n}"}]]}, {"id": "terms-on-text", "title": "A terms aggregation on a text field", "question": "To find the most common review titles, you run a terms aggregation on title (a text field). What's the result?", "options": ["Grouped by title, top 10", "Grouped by analyzed terms (很, 滿意, 不…)", "An error: text fields can't be aggregated by default"], "answer": 2, "explanation": "Aggregations and sorting need doc values (data stored per field), and text fields have no doc values; fielddata can build them in memory, but it's off by default (very heap-hungry).\n★ Use keyword for string fields you aggregate, or add a keyword subfield under the text field (fields: { keyword: { type: keyword } }) and aggregate title.keyword.\nEven with fielddata on, you'd be aggregating analyzed \"terms\", not whole titles.\n", "setup": null, "scripts": [{"label": "terms aggregation on a text field", "code": "GET /reviews/_search\n{\n  \"size\": 0,\n  \"aggs\": { \"titles\": { \"terms\": { \"field\": \"title\" } } }\n}\n"}], "results": [[{"cmd": "GET /reviews/_search  (400)", "text": "Fielddata is disabled on [title] in [reviews]. Text fields are not optimised for operations that require per-document field data like aggregations and sorting, so these operations are disabled by default. Please use a keyword field instead. Alternatively, set fielddata=true on [title] in order to load field data by uninverting the inverted index. Note that this can use significant memory.", "error": true}]]}, {"id": "deep-paging", "title": "Jump to page 1001", "question": "With 10 per page, you want page 1001 — from 10000, size 10. What's the result?", "options": ["Hits 10,001–10,010", "An error: Result window is too large", "An empty result"], "answer": 1, "explanation": "from + size can't exceed index.max_result_window (10,000 by default). The reason: every shard has to rank its top from + size and then merge them, which gets more expensive the deeper you go (the deep paging problem).\n★ Solutions: search_after (use the sort values of the previous page's last hit as a cursor, with a PIT for a fixed snapshot), or scroll (bulk export, no longer recommended).\nUser interfaces usually don't offer \"jump to page 1000\" either, only \"next page\" or narrowing the search.\n", "setup": null, "scripts": [{"label": "from 10000", "code": "GET /logs/_search\n{ \"from\": 10000, \"size\": 10 }\n"}], "results": [[{"cmd": "GET /logs/_search  (400)", "text": "Result window is too large, from + size must be less than or equal to: [10000] but was [10010]. See the scroll api for a more efficient way to request large data sets. This limit can be set by changing the [index.max_result_window] index level setting.", "error": true}]]}, {"id": "dynamic-mapping", "title": "Dynamic mapping decides the type", "question": "A new index has no mapping. The first document's zip is the number 100 and the second's is the string \"10A\". Can the second be written?", "options": ["Yes, Elasticsearch is schemaless", "No: zip has already been inferred as long", "Yes, and zip automatically becomes text"], "answer": 1, "explanation": "A field without a mapping gets its type inferred by dynamic mapping the first time it appears (number → long, string → text + keyword subfield, date-formatted string → date), and then it's fixed.\nThe second document's \"10A\" can't be converted to long, so the whole document is rejected (mapper_parsing_exception). Once decided, a field's type can't change; you can only create a new index and _reindex.\n★ In production always define mappings up front (or use index templates), and if needed set \"dynamic\": \"strict\" to reject undefined fields and avoid a field explosion (mapping explosion).\n", "setup": null, "scripts": [{"label": "Write two documents in turn", "code": "PUT /scratch_dynamic/_doc/1\n{ \"zip\": 100 }\n\nPUT /scratch_dynamic/_doc/2\n{ \"zip\": \"10A\" }\n\nGET /scratch_dynamic/_mapping\n"}], "results": [[{"cmd": "PUT /scratch_dynamic/_doc/1  (201)", "text": "{\n  \"_index\": \"scratch_dynamic\",\n  \"_id\": \"1\",\n  \"_version\": 1,\n  \"result\": \"created\",\n  \"_seq_no\": 0,\n  \"_primary_term\": 1\n}"}, {"cmd": "PUT /scratch_dynamic/_doc/2  (400)", "text": "[1:10] failed to parse field [zip] of type [long] in document with id '2'. Preview of field's value: '10A'", "error": true}, {"cmd": "GET /scratch_dynamic/_mapping  (200)", "text": "{\n  \"scratch_dynamic\": {\n    \"mappings\": {\n      \"properties\": {\n        \"zip\": {\n          \"type\": \"long\"\n        }\n      }\n    }\n  }\n}"}]]}, {"id": "near-real-time", "title": "Searching right after writing", "question": "The index's refresh_interval is 30 seconds. Right after writing a document, can _search find it? What about GET by _id?", "options": ["Both get it", "Search can't find it; GET gets it", "Neither gets it until 30 seconds pass"], "answer": 1, "explanation": "Elasticsearch is \"near real-time\": writes go into an in-memory buffer first (plus the translog so nothing is lost) and become searchable segments only on refresh.\nBy default it refreshes every second (paused when an index hasn't been searched for a while); here it's set to 30 seconds, so an immediate search finds nothing.\nGET /_doc/1 is real-time: before a refresh it reads from the translog / buffer.\nWhen you need \"searchable right after writing\", add ?refresh=wait_for to the write (wait for the next refresh); don't use ?refresh=true every time (it creates lots of small segments).\n", "setup": null, "scripts": [{"label": "Search and GET right after writing", "code": "PUT /scratch_nrt\n{ \"settings\": { \"refresh_interval\": \"30s\" } }\n\nPUT /scratch_nrt/_doc/1\n{ \"content\": \"降噪效果很棒\" }\n\nGET /scratch_nrt/_search\n{ \"query\": { \"match\": { \"content\": \"降噪\" } } }\n\nGET /scratch_nrt/_doc/1\n"}], "results": [[{"cmd": "PUT /scratch_nrt  (200)", "text": "{\n  \"acknowledged\": true,\n  \"shards_acknowledged\": true,\n  \"index\": \"scratch_nrt\"\n}"}, {"cmd": "PUT /scratch_nrt/_doc/1  (201)", "text": "{\n  \"_index\": \"scratch_nrt\",\n  \"_id\": \"1\",\n  \"_version\": 1,\n  \"result\": \"created\",\n  \"_seq_no\": 0,\n  \"_primary_term\": 1\n}"}, {"cmd": "GET /scratch_nrt/_search  (200)", "text": "hits.total = 0"}, {"cmd": "GET /scratch_nrt/_doc/1  (200)", "text": "{\n  \"_index\": \"scratch_nrt\",\n  \"_id\": \"1\",\n  \"_version\": 1,\n  \"_seq_no\": 0,\n  \"_primary_term\": 1,\n  \"found\": true,\n  \"_source\": {\n    \"content\": \"降噪效果很棒\"\n  }\n}"}]]}], "steps": [{"id": "idf", "title": "Rare terms score higher (IDF)", "goal": "Both search for one term: 「降噪」 (noise cancelling) appears in only a few reviews, while 「很好」 (very good) is almost everywhere. Compare the top scores of the two queries.", "question": "Which query scores higher, and why?", "takeaway": "The BM25 score ≈ IDF × a TF part × a field-length adjustment.\nIDF (inverse document frequency): the fewer documents a term appears in, the more discriminating it is and the higher it scores. 「降噪」 appears in a few hundred reviews and 「很好」 in thousands, so 「降噪」 scores much higher.\nIn multi-term queries, rare terms contribute most of the score; terms that are everywhere, like 「的、很、了」, barely affect the ranking (stop words used to be configured for this; BM25 suppresses them naturally).\n", "setup": [], "queries": [{"label": "Request", "code": "GET /reviews/_search\n{ \"size\": 3, \"_source\": [\"content\"], \"query\": { \"match\": { \"content\": \"降噪\" } } }\n\nGET /reviews/_search\n{ \"size\": 3, \"_source\": [\"content\"], \"query\": { \"match\": { \"content\": \"很好\" } } }\n"}]}, {"id": "field-length", "title": "The shorter the field, the higher the score", "goal": "Search 「音質」: A is the 3 highest-scoring hits; B sorts by score ascending, giving the 3 lowest. Each contains 「音質」 only once.", "question": "Both contain 「音質」 (sound quality) once, so why are the scores different?", "takeaway": "BM25 adjusts for field length (parameter b, default 0.75): 「音質」 in a short review means it's the review's main point, so it scores higher;\nappearing once in a long review may be just a passing mention, so it scores lower.\nThe other parameter, k1 (default 1.2), controls term frequency (TF) saturation: 1 vs 2 occurrences differ a lot, 10 vs 11 hardly at all, which prevents keyword stuffing.\nClicking \"how is the top score computed\" on A shows the actual numbers for idf, tf, dl (this document's length in terms) and avgdl (the average length).\n", "setup": [], "queries": [{"label": "Request", "code": "GET /reviews/_search\n{ \"size\": 3, \"_source\": [\"content\"], \"query\": { \"match\": { \"content\": \"音質\" } } }\n\nGET /reviews/_search\n{ \"size\": 3, \"_source\": [\"content\"], \"query\": { \"match\": { \"content\": \"音質\" } },\n  \"sort\": [{ \"_score\": \"asc\" }] }\n"}]}, {"id": "boost", "title": "Field boosts", "goal": "Search 「Sony 耳機」 (\"Sony headphones\"): in A, name and description matter equally; in B, name is multiplied by 3.", "question": "How do the top 5 and the scores change?", "takeaway": "multi_match defaults to best_fields: each field gets its own score and the highest is taken.\nA: the top hits are Sony \"wired\" headphones. Their descriptions are very short (just color and cable length), and BM25's length adjustment gives description a higher score.\nB: once name's score is multiplied by 3 it dominates, and products with both Sony and 耳機 in their name (wireless and wired) score the same and rank together.\n★ Field boosts are the most common tool for tuning relevance: names and titles usually matter more than body text.\n★ Scores can only be compared for ranking within the same query; score magnitudes across queries are meaningless (you can't set a threshold like \"relevant only if score > 5\").\n", "setup": [], "queries": [{"label": "Request", "code": "GET /products/_search\n{ \"size\": 5, \"_source\": [\"name\", \"description\"],\n  \"query\": { \"multi_match\": { \"query\": \"Sony 耳機\", \"fields\": [\"name\", \"description\"] } } }\n\nGET /products/_search\n{ \"size\": 5, \"_source\": [\"name\", \"description\"],\n  \"query\": { \"multi_match\": { \"query\": \"Sony 耳機\", \"fields\": [\"name^3\", \"description\"] } } }\n"}]}, {"id": "function-score", "title": "Relevance plus business rules: function_score", "goal": "Headphones whose description has 「降噪」 all score the same (the descriptions use the same template). A looks only at relevance; B also multiplies by the rating (rating).", "question": "What are B's top 5 sorted by?", "takeaway": "E-commerce search rarely looks at text relevance alone: ratings, sales, stock, listing date and ads also count. function_score adjusts scores with functions:\nfield_value_factor (by a field's value), gauss / exp / linear (lower scores the further from a value, e.g. price, time, location), script_score, random_score (random but stable ordering).\nmodifier: log1p keeps the gap between ratings 5 and 4 from being exaggerated; boost_mode decides how the original score and the function score combine (multiply, sum, replace…).\n", "setup": [], "queries": [{"label": "Request", "code": "GET /products/_search\n{ \"size\": 5, \"_source\": [\"name\", \"rating\", \"review_count\"],\n  \"query\": { \"match\": { \"description\": \"降噪\" } } }\n\nGET /products/_search\n{ \"size\": 5, \"_source\": [\"name\", \"rating\", \"review_count\"],\n  \"query\": {\n    \"function_score\": {\n      \"query\": { \"match\": { \"description\": \"降噪\" } },\n      \"field_value_factor\": { \"field\": \"rating\", \"modifier\": \"log1p\", \"missing\": 3 },\n      \"boost_mode\": \"multiply\"\n    }\n  } }\n"}]}, {"id": "filter-no-score", "title": "filter doesn't score", "goal": "The same conditions, in must for A and in filter for B. Look at the scores.", "question": "Do the two queries find the same documents? And the scores?", "takeaway": "They find exactly the same documents, but must computes scores (term has IDF too), while every filter score is 0.\nfilter doesn't need to compute scores, and frequently used filter results are cached as bitsets and reused next time.\n★ Yes/no conditions (category, price range, status, permissions, time) go in filter; only full-text conditions that should affect ranking go in must / should.\n", "setup": [], "queries": [{"label": "Request", "code": "GET /products/_search\n{ \"size\": 3, \"_source\": [\"name\", \"price\"],\n  \"query\": { \"bool\": { \"must\": [\n    { \"term\": { \"category\": \"無線耳機\" } },\n    { \"range\": { \"price\": { \"lte\": 3000 } } }\n  ] } } }\n\nGET /products/_search\n{ \"size\": 3, \"_source\": [\"name\", \"price\"],\n  \"query\": { \"bool\": { \"filter\": [\n    { \"term\": { \"category\": \"無線耳機\" } },\n    { \"range\": { \"price\": { \"lte\": 3000 } } }\n  ] } } }\n"}]}, {"id": "should-bonus", "title": "should as a bonus", "goal": "Search products whose description has 「降噪」; B also uses should to boost those tagged 「熱銷」 (best seller).", "question": "Does B's total change? What about the top 5?", "takeaway": "With must present, should is no longer required, just \"a bonus if it matches\": the total doesn't change, but best sellers move to the top.\nThis is the standard way to write \"soft conditions\": prefer a brand, a region, or in-stock items, without excluding the rest.\n", "setup": [], "queries": [{"label": "Request", "code": "GET /products/_search\n{ \"size\": 5, \"_source\": [\"name\", \"tags\"],\n  \"query\": { \"bool\": { \"must\": [{ \"match\": { \"description\": \"降噪\" } }] } } }\n\nGET /products/_search\n{ \"size\": 5, \"_source\": [\"name\", \"tags\"],\n  \"query\": { \"bool\": {\n    \"must\": [{ \"match\": { \"description\": \"降噪\" } }],\n    \"should\": [{ \"term\": { \"tags\": { \"value\": \"熱銷\", \"boost\": 2 } } }]\n  } } }\n"}]}]}], "built": "2026-10-10"}</script>
<script>
const LANG = "en";
