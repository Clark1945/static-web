 {"id": "semantic-search", "chapter": "Semantic search", "title": "Find products by text", "prompt": "Use embed() to turn 「通勤 安靜」 (\"commute, quiet\") into a vector and find the 5 best-matching products. Return id and name, best match first.\n", "hints": ["embed('通勤 安靜') returns a vector(64); just compare its distance to embedding.", "SELECT tokens('通勤 安靜') shows which words embed() recognizes."], "answer": "SELECT id, name\nFROM products\nORDER BY embedding <=> embed('通勤 安靜')\nLIMIT 5;\n", "explanation": "The results are all wireless headphones with active noise cancelling, yet their descriptions never contain the words 「通勤」 (commute) or 「安靜」 (quiet):\nin the vocabulary, the vector for 「通勤」 is close to 「降噪」 (noise cancelling) and 「無線」 (wireless), so products with similar meaning rank first. That's the biggest difference between semantic search and keyword search.\nIn a real system embed() calls an embedding model's API (the application computes the vector and passes it into SQL); here a mini model built from a vocabulary stands in.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name"], "rows": [[552, "Bose 無線耳機 V350"], [233, "Sony 無線耳機 X216"], [330, "Sony 無線耳機 E910"], [252, "JBL 無線耳機 O984"], [192, "Bose 無線耳機 H452"]], "total": 5}}]}, {"id": "similar-words", "chapter": "Semantic search", "title": "Near-synonyms in the vocabulary", "prompt": "The 5 words in the vocabulary (vocab) closest to 「露營」 (camping), excluding 「露營」 itself.\nReturn word and cosine distance (rounded to 3 decimals), nearest first.\n", "hints": ["vocab's embedding is a vector too: ORDER BY embedding <=> (SELECT embedding FROM vocab WHERE word = '露營')"], "answer": "SELECT word, round((embedding <=> (SELECT embedding FROM vocab WHERE word = '露營'))::numeric, 3) AS distance\nFROM vocab\nWHERE word <> '露營'\nORDER BY embedding <=> (SELECT embedding FROM vocab WHERE word = '露營')\nLIMIT 5;\n", "explanation": "「戶外」 (outdoors) and 「帳篷」 (tent) are almost identical to 「露營」, and 「登山」 (hiking) and 「野餐」 (picnic) are close too. The recipe column shows why: they all contain the \"outdoors\" topic.\nReal embedding models work the same way, except the \"topics\" are hundreds or thousands of dimensions the model learned by itself from huge amounts of text, and no human can read what each dimension means.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["word", "distance"], "rows": [["戶外", 0.077], ["帳篷", 0.077], ["野餐", 0.246], ["登山", 0.256], ["烤肉", 0.453]], "total": 5}}]}, {"id": "filtered-search", "chapter": "Semantic search", "title": "Semantic search with regular conditions", "prompt": "Among menswear and womenswear within a budget of 1000 (price <= 1000), the 5 best for 「冬天 保暖」 (\"winter, warm\").\nReturn id, name and price, best match first.\n", "hints": ["Write regular WHERE conditions as usual, then ORDER BY vector distance."], "answer": "SELECT id, name, price\nFROM products\nWHERE price <= 1000 AND category IN ('男裝', '女裝')\nORDER BY embedding <=> embed('冬天 保暖')\nLIMIT 5;\n", "explanation": "The biggest benefit of keeping vectors in PostgreSQL: vector search can sit in the same SQL statement as regular conditions like price, category, stock and permissions, and can JOIN.\nDedicated vector databases (Pinecone, Milvus) need a separate copy of these fields (metadata) to filter.\nThe results are all wool clothing: the vector for 「羊毛」 (wool) contains the \"warmth\" topic.\n★ With large data and a vector index, filter conditions can leave fewer than 5 results (shown in the \"filtering\" lab).\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "price"], "rows": [[708, "UNIQLO 女裝 Y562", 639], [1214, "ZARA 女裝 X436", 659], [1314, "GU 女裝 K648", 359], [1149, "UNIQLO 男裝 C650", 819], [1169, "GU 男裝 H730", 639]], "total": 5}}]}, {"id": "threshold", "chapter": "Semantic search", "title": "Filter by a distance threshold", "prompt": "How many products have a cosine distance below 0.35 from 「露營 輕量」 (\"camping, lightweight\")? Return a single number.\n", "hints": ["WHERE embedding <=> embed('露營 輕量') < 0.35"], "answer": "SELECT count(*)\nFROM products\nWHERE embedding <=> embed('露營 輕量') < 0.35;\n", "explanation": "A common RAG practice: give the LLM only data that is \"relevant enough\", and drop anything too far (so the model isn't misled by irrelevant content).\n★ A query with only a distance threshold and no ORDER BY … LIMIT can't use HNSW / IVFFlat indexes (they only \"find the k nearest\") and computes over the whole table.\nOn a large table write \"ORDER BY distance LIMIT k\", then filter out results that are too far.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["count"], "rows": [[10]], "total": 1}}]}, {"id": "keyword-and-semantic", "chapter": "Semantic search", "title": "Semantic search within a brand", "prompt": "Among products whose name starts with \"Sony \", the 3 best matches for 「通勤 安靜」 (\"commute, quiet\"). Return id and name, best match first.\n", "hints": ["WHERE name LIKE 'Sony %'"], "answer": "SELECT id, name\nFROM products\nWHERE name LIKE 'Sony %'\nORDER BY embedding <=> embed('通勤 安靜')\nLIMIT 3;\n", "explanation": "Semantic models usually handle \"proper nouns\" like brands and model numbers poorly (this vocabulary doesn't even know Sony), so keyword conditions are more reliable there;\nfor descriptions of needs like \"commute, quiet\", semantic search is stronger. Combining both is hybrid search; the lab shows merging rankings with RRF.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name"], "rows": [[233, "Sony 無線耳機 X216"], [330, "Sony 無線耳機 E910"], [806, "Sony 無線耳機 F178"]], "total": 3}}]}, {"id": "best-per-category", "chapter": "Semantic search", "title": "The best match in each category", "prompt": "In each category (category), the single product that best matches 「送禮」 (\"gift\").\nReturn category, id and name, sorted by category.\n", "hints": ["DISTINCT ON (category) … ORDER BY category, distance"], "answer": "SELECT DISTINCT ON (category) category, id, name\nFROM products\nORDER BY category, embedding <=> embed('送禮');\n", "explanation": "DISTINCT ON is PostgreSQL's \"first row per group\": after sorting by ORDER BY, only the first row of each category is kept.\nA results page with \"one recommendation per category\", so results aren't all crowded into one category, can be built this way (diversification).\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["category", "id", "name"], "rows": [["休閒鞋", 588, "Skechers 休閒鞋 H408"], ["保養", 833, "SK-II 保養 T770"], ["健身器材", 199, "Reebok 健身器材 J177"], ["女裝", 875, "Lativ 女裝 L594"], ["寢具", 215, "宜得利 寢具 Y998"], ["廚房用品", 185, "Tefal 廚房用品 Q671"], ["彩妝", 1003, "KATE 彩妝 V126"], ["手機", 783, "Sony 手機 K167"], ["手機配件", 131, "小米 手機配件 X318"], ["收納", 1070, "宜得利 收納 I645"]], "total": 19}}]}, {"id": "neighbors-lateral", "chapter": "Recommendations and classification", "title": "2 neighbors for each product", "prompt": "The 2 products most like each of products 806, 469 and 1132 (excluding themselves).\nReturn source_id (the original product), id and name, sorted by source_id, and within each product from most to least similar.\n", "hints": ["FROM products s CROSS JOIN LATERAL (SELECT … ORDER BY p.embedding <=> s.embedding LIMIT 2) n", "A LATERAL subquery can reference columns of the table on its left (s.embedding) and runs once per row."], "answer": "SELECT s.id AS source_id, n.id, n.name\nFROM products s\nCROSS JOIN LATERAL (\n  SELECT p.id, p.name, p.embedding <=> s.embedding AS distance\n  FROM products p\n  WHERE p.id <> s.id\n  ORDER BY p.embedding <=> s.embedding\n  LIMIT 2\n) n\nWHERE s.id IN (806, 469, 1132)\nORDER BY s.id, n.distance;\n", "explanation": "\"The k nearest for each row\" needs LATERAL: a regular subquery can't reference the outer row, and a JOIN can't do \"top k per group\".\nORDER BY … LIMIT inside LATERAL can use the vector index too (one index search per row).\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["source_id", "id", "name"], "rows": [[469, 1127, "Lenovo 筆電 W749"], [469, 95, "Apple 筆電 J562"], [806, 151, "Sony 無線耳機 N677"], [806, 627, "JBL 無線耳機 V398"], [1132, 388, "SK-II 保養 N785"], [1132, 1117, "雅漾 保養 H933"]], "total": 6}}]}, {"id": "knn-classify", "chapter": "Recommendations and classification", "title": "k-NN classification: vote on a category", "prompt": "A new product's description is 「上班 通勤」 (\"work, commute\"). Find the 15 products nearest to embed('上班 通勤') and see which category each belongs to:\nreturn category and vote count, most votes first (ties by category).\n", "hints": ["Take the nearest 15 in a subquery first, then GROUP BY category outside."], "answer": "SELECT category, count(*) AS votes\nFROM (\n  SELECT category FROM products\n  ORDER BY embedding <=> embed('上班 通勤')\n  LIMIT 15\n) nearest\nGROUP BY category\nORDER BY votes DESC, category;\n", "explanation": "k-NN (k nearest neighbors) classification: whichever category most of the k nearest neighbors belong to is the answer.\nNo model training needed; a new category just needs data. Automatic product categorization, support ticket routing and spam detection can all work this way.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["category", "votes"], "rows": [["筆電", 13], ["無線耳機", 2]], "total": 2}}]}, {"id": "customer-taste", "chapter": "Recommendations and classification", "title": "Recommend from purchase history", "prompt": "Average the vectors of every product customer 224 bought (purchases) as their \"taste\";\nrecommend 5 products they haven't bought that are closest to this taste. Return id and name, closest first.\n", "hints": ["avg(embedding) averages vectors (pgvector provides avg and sum aggregates for vector).", "WITH taste AS (SELECT avg(p.embedding) AS v FROM purchases u JOIN products p ON p.id = u.product_id WHERE u.customer_id = 224)", "Exclude what they bought: WHERE id NOT IN (SELECT product_id FROM purchases WHERE customer_id = 224)"], "answer": "WITH taste AS (\n  SELECT avg(p.embedding) AS v\n  FROM purchases u JOIN products p ON p.id = u.product_id\n  WHERE u.customer_id = 224\n)\nSELECT p.id, p.name\nFROM products p, taste\nWHERE p.id NOT IN (SELECT product_id FROM purchases WHERE customer_id = 224)\nORDER BY p.embedding <=> taste.v\nLIMIT 5;\n", "explanation": "The simplest content-based recommendation: user vector = average of the vectors of items they interacted with.\n★ Downside: for someone with scattered interests (this customer bought bedding, fresh food, clothing and electronics), the average lands in a \"bit of everything\" middle, and recommendations are fuzzy.\nIn practice you cluster (one vector per interest), weight by time (recent purchases count more), or switch to collaborative filtering or two-tower models.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name"], "rows": [[1293, "GU 女裝 K527"], [579, "宜得利 寢具 K113"], [294, "NET 男裝 S618"], [732, "GU 女裝 G858"], [893, "Anker 手機配件 L381"]], "total": 5}}]}, {"id": "category-centroid", "chapter": "Recommendations and classification", "title": "A representative product per category", "prompt": "In each category, the product nearest to \"the average vector of all products in that category\" (the most typical product).\nReturn category, id and name, sorted by category.\n", "hints": ["GROUP BY category to compute avg(embedding) first, JOIN back to products, and use DISTINCT ON to take the nearest per category."], "answer": "WITH centroid AS (\n  SELECT category, avg(embedding) AS v\n  FROM products\n  GROUP BY category\n)\nSELECT DISTINCT ON (p.category) p.category, p.id, p.name\nFROM products p\nJOIN centroid c ON c.category = p.category\nORDER BY p.category, p.embedding <=> c.v;\n", "explanation": "Category centers (centroids) are used in clustering, classification and anomaly detection: products unusually far from the center may be misclassified or have bad data.\nIVFFlat indexes use the same idea: k-means splits vectors into lists clusters, and a query only looks at the nearest few clusters (probes).\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["category", "id", "name"], "rows": [["休閒鞋", 751, "Vans 休閒鞋 K575"], ["保養", 1358, "SK-II 保養 C910"], ["健身器材", 527, "Reebok 健身器材 H707"], ["女裝", 350, "Lativ 女裝 O468"], ["寢具", 475, "宜得利 寢具 X178"], ["廚房用品", 35, "虎牌 廚房用品 C958"], ["彩妝", 1043, "Maybelline 彩妝 C708"], ["手機", 173, "Apple 手機 J651"], ["手機配件", 267, "Belkin 手機配件 O285"], ["收納", 840, "天馬 收納 X528"]], "total": 19}}]}, {"id": "near-duplicates", "chapter": "Recommendations and classification", "title": "Find near-identical products", "prompt": "How many product \"pairs\" have a cosine distance below 0.015? (Each pair counted once.) Return a single number.\n", "hints": ["Join the table to itself: products a JOIN products b ON a.id < b.id", "a.id < b.id counts (1, 2) and (2, 1) once and also excludes pairing with yourself."], "answer": "SELECT count(*)\nFROM products a\nJOIN products b ON a.id < b.id\nWHERE a.embedding <=> b.embedding < 0.015;\n", "explanation": "Duplicate products, duplicate articles and plagiarism detection all work this way. Here 1500 × 1499 / 2 ≈ 1.12 million pairs are compared in under a second;\nwith large data, switch to \"use the index to find each row's nearest few\" (LATERAL + LIMIT) instead of comparing every pair (N² explodes).\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["count"], "rows": [[28]], "total": 1}}]}, {"id": "ann-search", "chapter": "Indexes and quantization", "title": "The nearest 5 among 100,000 rows", "prompt": "The 5 passages nearest to the vector of question 1 in questions. Return id and tenant_id, nearest first.\n", "hints": ["passages.embedding has an HNSW index (vector_cosine_ops); use <=> to make use of it.", "Prefix with EXPLAIN to see Index Scan using passages_hnsw."], "answer": "SELECT id, tenant_id\nFROM passages\nORDER BY embedding <=> (SELECT embedding FROM questions WHERE id = 1)\nLIMIT 5;\n", "explanation": "With the HNSW index it takes under 1 ms; without it, 100,000 distances must be computed and sorted (about 15 ms, slower as data grows).\nVector indexes are \"approximate\" nearest neighbor (ANN): they don't guarantee the truly nearest rows, and accuracy is measured by recall (measured in the lab).\n★ Using the index needs all three: ORDER BY distance ascending, a LIMIT, and an operator matching the index's ops (a cosine index with <=>).\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "tenant_id"], "rows": [[27067, 6], [48912, 2], [73913, 4], [46905, 4], [686, 32]], "total": 5}}]}, {"id": "tenant-exact", "chapter": "Indexes and quantization", "title": "Multi-tenancy: search only your own data", "prompt": "In tenant 7's data (tenant_id = 7), the 5 rows nearest to question 1 in questions. Return id, nearest first.\nNote: simply adding WHERE tenant_id = 7 may return fewer than 5; find a way to always return the correct 5.\n", "hints": ["With a plain WHERE, HNSW first finds ef_search (default 40) candidates and then applies the filter; tenant 7 is only 2%, so 0–2 candidates may remain.", "You can only send one query here (no SET). Pull out tenant 7's data first, then sort exactly within that small set:", "WITH mine AS MATERIALIZED (SELECT id, embedding FROM passages WHERE tenant_id = 7) SELECT id FROM mine ORDER BY …"], "answer": "WITH mine AS MATERIALIZED (\n  SELECT id, embedding FROM passages WHERE tenant_id = 7\n)\nSELECT id\nFROM mine\nORDER BY embedding <=> (SELECT embedding FROM questions WHERE id = 1)\nLIMIT 5;\n", "explanation": "MATERIALIZED makes the CTE run first (pulling out tenant 7's ~2,000 rows), and the outer query sorts exactly without HNSW, so it's always the correct 5.\nMulti-tenant vector search is a common interview question. Other approaches:\n1. pgvector 0.8's iterative scan: SET hnsw.iterative_scan = relaxed_order keeps searching when there aren't enough candidates (measured in the lab).\n2. A partial index per large tenant (CREATE INDEX … WHERE tenant_id = 7), or partitioning by tenant_id.\n3. When the filter is very selective (only a few thousand rows left), exact search is fast anyway and no vector index is needed.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id"], "rows": [[26055], [76620], [88174], [2454], [41606]], "total": 5}}]}, {"id": "quantization-size", "chapter": "Indexes and quantization", "title": "How much space a vector takes", "prompt": "How many bytes does product 806's vector take when stored as each of three types? Return one row with three columns:\nvector (the original float4), halfvec (float2), and bit after binary_quantize.\n", "hints": ["pg_column_size(value) returns the bytes a value actually takes.", "embedding::halfvec converts to half precision; binary_quantize(embedding) keeps only the sign of each dimension (1 bit)."], "answer": "SELECT pg_column_size(embedding) AS vector_bytes,\n       pg_column_size(embedding::halfvec) AS halfvec_bytes,\n       pg_column_size(binary_quantize(embedding)) AS bit_bytes\nFROM products\nWHERE id = 806;\n", "explanation": "64 dimensions: vector uses 4 bytes per dimension (256 + 8-byte header = 264), halfvec 2 bytes (136), bit 1 bit per dimension (8 bytes + header = 16).\nAt 1536 dimensions (OpenAI embeddings) one row is 6 KB; 10 million rows take 60 GB for the vectors alone, plus another copy for the HNSW index.\nQuantization trades precision for space: halfvec halves the space with almost no recall loss; bit is 32 times smaller but imprecise, usually paired with \"reranking\".\nThe \"quantization\" lab measures index sizes and recall.\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["vector_bytes", "halfvec_bytes", "bit_bytes"], "rows": [[264, 136, 16]], "total": 1}}]}, {"id": "insert-with-embedding", "chapter": "Writes", "title": "Insert a product and generate its vector", "prompt": "Add a product: id 9001, name 「Bose 無線耳機 Z001」 (Bose wireless headphones Z001), category 「無線耳機」 (wireless headphones), price 8990,\ndescription 「Bose 無線耳機 Z001 黑色 主動降噪 續航24小時」 (black, active noise cancelling, 24-hour battery), with the vector generated by embed(description).\nAfter inserting it, query the ids of the 3 products most like it (excluding itself), most similar first.\n", "hints": ["INSERT INTO products (id, name, category, price, description, embedding) VALUES (…, embed('…'))", "The result of the second SELECT is what gets graded."], "answer": "INSERT INTO products (id, name, category, price, description, embedding)\nVALUES (9001, 'Bose 無線耳機 Z001', '無線耳機', 8990,\n        'Bose 無線耳機 Z001 黑色 主動降噪 續航24小時',\n        embed('Bose 無線耳機 Z001 黑色 主動降噪 續航24小時'));\n\nSELECT id\nFROM products\nWHERE id <> 9001\nORDER BY embedding <=> (SELECT embedding FROM products WHERE id = 9001)\nLIMIT 3;\n", "explanation": "Real systems usually have the application call the embedding model's API for the vector first and INSERT them together (or let a background job fill it in).\nIt's searchable right after insertion: the HNSW index is updated synchronously on INSERT and needs no rebuild (IVFFlat is too, but its cluster centers don't change, so rebuild when the data distribution shifts a lot).\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["id"], "rows": [[717], [1077], [580]], "total": 3}}]}, {"id": "update-reembed", "chapter": "Writes", "title": "Changed the description? Recompute the vector", "prompt": "Append 「 打電動」 (\" gaming\") to the description of product 469 (a laptop) and recompute its vector.\nReturn id, the new description, and the cosine distance between the new vector and embed('打電動') (rounded to 3 decimals).\n", "hints": ["UPDATE … SET description = description || ' 打電動', embedding = embed(description || ' 打電動')", "description referenced in SET is the value \"before the update\", so append the new text on both sides yourself.", "RETURNING can return the updated values."], "answer": "UPDATE products\nSET description = description || ' 打電動',\n    embedding = embed(description || ' 打電動')\nWHERE id = 469\nRETURNING id, description, round((embedding <=> embed('打電動'))::numeric, 3) AS distance;\n", "explanation": "A vector is \"derived data\" computed from text; when the text changes, the vector doesn't update itself, and forgetting to recompute makes search results disagree with the content.\nCommon approaches: the application updates the vector together with the text; or a trigger writes the ids \"needing re-embedding\" to a queue, and a background job calls the model.\n★ When switching embedding models, every vector has to be recomputed (vectors from different models can't be compared), so record which model produced each vector.\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["id", "description", "distance"], "rows": [[469, "Lenovo 筆電 U846 Intel i5 32GB記憶體 1.5公斤 熱銷 打電動", 0.129]], "total": 1}}]}], "traps": [{"id": "self-match", "title": "Which product is the most similar?", "question": "Looking for the 3 products most like product 806, which one ranks first?", "options": ["Another pair of Sony wireless headphones", "806 itself, at distance 0", "A random one, since the distances are all about the same"], "answer": 1, "explanation": "An item's distance to itself is 0, so it always ranks first. \"Similar products\" and \"related articles\" must remember WHERE id <> 806,\nand excluding just itself isn't enough: duplicate data for the same product (relisted under another id) is also at nearly 0 distance and often needs a distance threshold to exclude.\n", "setup": null, "scripts": [{"label": "Without excluding itself", "code": "SELECT id, name, round((embedding <=> (SELECT embedding FROM products WHERE id = 806))::numeric, 3) AS distance\nFROM products\nORDER BY embedding <=> (SELECT embedding FROM products WHERE id = 806)\nLIMIT 3;\n"}], "results": [[{"table": {"columns": ["id", "name", "distance"], "rows": [[806, "Sony 無線耳機 F178", 0.0], [151, "Sony 無線耳機 N677", 0.016], [627, "JBL 無線耳機 V398", 0.025]], "total": 3}}]]}, {"id": "negative-inner-product", "title": "Sorting <#> descending", "question": "Wanting the 3 with \"the largest inner product\" (most similar), you write ORDER BY embedding <#> x DESC. Are the results the most similar?", "options": ["Yes, <#> is the inner product, and larger means more similar", "No, <#> returns the \"negative\" inner product, so DESC finds the least similar", "An error: <#> can't be sorted"], "answer": 1, "explanation": "pgvector's <#> returns the negative inner product: the more similar, the smaller (-1 is the most similar). A finds drinks and fitness equipment, completely unrelated to headphones.\nThe reason: PostgreSQL indexes only support \"ascending\" distance ordering, so the inner product is negated to make every operator \"smaller is closer\".\n★ All three operators work the same: ORDER BY operator ascending LIMIT k gives the k most similar. Multiply by -1 yourself when displaying the inner product.\n", "setup": null, "scripts": [{"label": "A: <#> … DESC", "code": "SELECT id, name, round((embedding <#> (SELECT embedding FROM products WHERE id = 806))::numeric, 3) AS neg_inner\nFROM products\nORDER BY embedding <#> (SELECT embedding FROM products WHERE id = 806) DESC\nLIMIT 3;\n"}, {"label": "B: <#> ascending", "code": "SELECT id, name, round((embedding <#> (SELECT embedding FROM products WHERE id = 806))::numeric, 3) AS neg_inner\nFROM products\nORDER BY embedding <#> (SELECT embedding FROM products WHERE id = 806)\nLIMIT 3;\n"}], "results": [[{"table": {"columns": ["id", "name", "neg_inner"], "rows": [[1412, "統一 飲料 J448", 0.28], [1459, "Reebok 健身器材 N180", 0.27], [1463, "黑松 飲料 Z122", 0.265]], "total": 3}}], [{"table": {"columns": ["id", "name", "neg_inner"], "rows": [[806, "Sony 無線耳機 F178", -1.0], [151, "Sony 無線耳機 N677", -0.984], [627, "JBL 無線耳機 V398", -0.975]], "total": 3}}]]}, {"id": "opclass-mismatch", "title": "Can L2 distance use a cosine index?", "question": "Every passages vector has length 1, so L2 distance and cosine distance give exactly the same ranking. The index is vector_cosine_ops; will B, using <-> (L2), use the index?", "options": ["Yes, the ranking is the same and the planner knows it can", "No, B scans the whole table and sorts", "Yes, but the conversion takes a little extra time"], "answer": 1, "explanation": "A vector index is tied to the operator class it was created with: vector_cosine_ops serves only <=>, vector_l2_ops only <->, vector_ip_ops only <#>.\nThe planner doesn't know \"the vectors all have length 1 so the rankings are the same\", so B falls back to a Parallel Seq Scan computing 100,000 distances.\n★ Decide which distance to use before creating the index (usually as the embedding model's documentation recommends), and always use the same operator in application queries.\n", "setup": null, "scripts": [{"label": "A: <=> (cosine)", "code": "EXPLAIN (COSTS OFF)\nSELECT id FROM passages\nORDER BY embedding <=> (SELECT embedding FROM questions WHERE id = 1)\nLIMIT 5;\n"}, {"label": "B: <-> (L2)", "code": "EXPLAIN (COSTS OFF)\nSELECT id FROM passages\nORDER BY embedding <-> (SELECT embedding FROM questions WHERE id = 1)\nLIMIT 5;\n"}], "results": [[{"table": {"columns": ["QUERY PLAN"], "rows": [["Limit"], ["  InitPlan 1 (returns $0)"], ["    ->  Index Scan using questions_pkey on questions"], ["          Index Cond: (id = 1)"], ["  ->  Index Scan using passages_hnsw on passages"], ["        Order By: (embedding <=> $0)"]], "total": 6}}], [{"table": {"columns": ["QUERY PLAN"], "rows": [["Limit"], ["  InitPlan 1 (returns $0)"], ["    ->  Index Scan using questions_pkey on questions"], ["          Index Cond: (id = 1)"], ["  ->  Gather Merge"], ["        Workers Planned: 2"], ["        Params Evaluated: $0"], ["        ->  Sort"], ["              Sort Key: ((passages.embedding <-> $0))"], ["              ->  Parallel Seq Scan on passages"]], "total": 10}}]]}, {"id": "similarity-expression", "title": "ORDER BY similarity DESC", "question": "A and B return exactly the same result. Which can use the HNSW index?", "options": ["Both", "Only A", "Only B, because similarity is what the index stores"], "answer": 1, "explanation": "The index only recognizes the form \"column operator value\" in ascending order. Wrap it in another operation (1 - …, multiplying by -1, a cast) and it's no longer recognized, so B is a full table scan.\n★ Always ORDER BY the raw distance; compute similarity only in SELECT for display.\n", "setup": null, "scripts": [{"label": "A: ORDER BY distance", "code": "EXPLAIN (COSTS OFF)\nSELECT id FROM passages\nORDER BY embedding <=> (SELECT embedding FROM questions WHERE id = 1)\nLIMIT 5;\n"}, {"label": "B: ORDER BY 1 - distance DESC (similarity, highest first)", "code": "EXPLAIN (COSTS OFF)\nSELECT id FROM passages\nORDER BY 1 - (embedding <=> (SELECT embedding FROM questions WHERE id = 1)) DESC\nLIMIT 5;\n"}], "results": [[{"table": {"columns": ["QUERY PLAN"], "rows": [["Limit"], ["  InitPlan 1 (returns $0)"], ["    ->  Index Scan using questions_pkey on questions"], ["          Index Cond: (id = 1)"], ["  ->  Index Scan using passages_hnsw on passages"], ["        Order By: (embedding <=> $0)"]], "total": 6}}], [{"table": {"columns": ["QUERY PLAN"], "rows": [["Limit"], ["  InitPlan 1 (returns $0)"], ["    ->  Index Scan using questions_pkey on questions"], ["          Index Cond: (id = 1)"], ["  ->  Gather Merge"], ["        Workers Planned: 2"], ["        Params Evaluated: $0"], ["        ->  Sort"], ["              Sort Key: (('1'::double precision - (passages.embedding <=> $0))) DESC"], ["              ->  Parallel Seq Scan on passages"]], "total": 10}}]]}, {"id": "missing-limit", "title": "No LIMIT", "question": "You want everything sorted by distance, so there's no LIMIT. Will the HNSW index be used?", "options": ["Yes, the index is already sorted", "No, it scans the whole table and sorts"], "answer": 1, "explanation": "HNSW and IVFFlat are designed to \"find the k nearest\", and their results are approximate; they return at most what ef_search (default 40) or the probed lists cover.\nWithout a LIMIT the planner won't use them (doing so would miss data) and instead computes distances over the whole table and sorts. Vector searches must always have a LIMIT.\n", "setup": null, "scripts": [{"label": "No LIMIT", "code": "EXPLAIN (COSTS OFF)\nSELECT id FROM passages\nORDER BY embedding <=> (SELECT embedding FROM questions WHERE id = 1);\n"}], "results": [[{"table": {"columns": ["QUERY PLAN"], "rows": [["Sort"], ["  Sort Key: ((passages.embedding <=> $0))"], ["  InitPlan 1 (returns $0)"], ["    ->  Index Scan using questions_pkey on questions"], ["          Index Cond: (id = 1)"], ["  ->  Seq Scan on passages"]], "total": 6}}]]}, {"id": "filter-fewer-rows", "title": "How many rows with a filter?", "question": "Tenant 7 is only 2% of all data (about 2,000 rows). With WHERE tenant_id = 7, taking the nearest 10, how many rows come back?", "options": ["10; tenant 7 has 2,000 rows, so there are plenty", "Fewer than 10", "0; WHERE can't be combined with a vector index"], "answer": 1, "explanation": "HNSW first finds ef_search (default 40) nearest candidates and then applies WHERE; on average fewer than 1 of those 40 belong to tenant 7, so too few rows come back (this query returns only 2).\nThis is the classic \"filter after taking k\" (post-filtering) problem, the most common pitfall in multi-tenant RAG. Solutions:\n1. pgvector 0.8: SET hnsw.iterative_scan = relaxed_order keeps searching automatically when there aren't enough candidates.\n2. Raise hnsw.ef_search (e.g. 1000), at the cost of speed.\n3. A partial index (WHERE tenant_id = 7) or partitioning by tenant; when little data remains after filtering, just search exactly (the \"multi-tenancy\" exercise).\nThe \"filtering\" lab measures different filter ratios and approaches.\n", "setup": null, "scripts": [{"label": "HNSW + WHERE", "code": "SELECT id, tenant_id\nFROM passages\nWHERE tenant_id = 7\nORDER BY embedding <=> (SELECT embedding FROM questions WHERE id = 1)\nLIMIT 10;\n"}], "results": [[{"table": {"columns": ["id", "tenant_id"], "rows": [[26055, 7], [76620, 7]], "total": 2}}]]}, {"id": "unknown-words", "title": "Text the model doesn't recognize", "question": "The vocabulary has neither \"iPhone\" nor \"15\". What does searching with embed('iPhone 15') give?", "options": ["Apple phones", "An error: the vector is NULL", "Any 3 products: every distance is NULL, so the sort is meaningless"], "answer": 2, "explanation": "When embed() recognizes no words it returns NULL, every distance is NULL, ORDER BY has no effect, and you get whichever products \"happen to come first\" in the table, with no error.\nReal embedding models never return NULL, but for unseen proper nouns (model numbers, new product names, internal codes) they also produce inaccurate vectors, and results that look like \"an answer\" are wrong.\n★ For exact matching on model numbers, brands or part numbers, use keyword search (or hybrid search); vector search is for \"similar meaning\".\n", "setup": null, "scripts": [{"label": "A: embed('iPhone 15')", "code": "SELECT embed('iPhone 15') IS NULL AS is_null, tokens('iPhone 15') AS tokens;\n"}, {"label": "B: search with it", "code": "SELECT id, name\nFROM products\nORDER BY embedding <=> embed('iPhone 15')\nLIMIT 3;\n"}], "results": [[{"table": {"columns": ["is_null", "tokens"], "rows": [[true, "{}"]], "total": 1}}], [{"table": {"columns": ["id", "name"], "rows": [[751, "Vans 休閒鞋 K575"], [190, "UNIQLO 男裝 X909"], [1, "雅漾 保養 C693"]], "total": 3}}]]}, {"id": "avg-not-normalized", "title": "The length of an average vector", "question": "Every products vector has length 1. What is the length of the average vector of the headphone categories?", "options": ["1; averaging doesn't change the length", "Less than 1, and shorter the more spread out they are", "More than 1, since many vectors were added"], "answer": 1, "explanation": "Averaging vectors pointing in different directions partly cancels them out, so the length is below 1; the more spread out (both categories combined), the shorter.\nFor finding the nearest k this doesn't change the ranking (cosine only looks at direction; for length-1 data, scaling the query vector doesn't change inner product or L2 rankings either).\nBut \"the distance values\" change: inner product and L2 distance depend on the query vector's length, so a fixed threshold (e.g. relevant only if inner product > 0.8) filters out too much.\nTo compare an average vector against a threshold, l2_normalize(avg(…)) first.\n\"User taste vector = average of purchased products\" is the same situation: the more scattered the interests, the shorter and more featureless the average vector.\n", "setup": null, "scripts": [{"label": "Length of the average vector", "code": "SELECT category, round(vector_norm(avg(embedding))::numeric, 3) AS norm_of_avg\nFROM products\nWHERE category IN ('無線耳機', '有線耳機')\nGROUP BY category\nUNION ALL\nSELECT '兩類合起來', round(vector_norm(avg(embedding))::numeric, 3)\nFROM products\nWHERE category IN ('無線耳機', '有線耳機');\n"}], "results": [[{"table": {"columns": ["category", "norm_of_avg"], "rows": [["有線耳機", 0.689], ["無線耳機", 0.878], ["兩類合起來", 0.716]], "total": 3}}]]}], "steps": []}, {"id": "influxdb", "name": "InfluxDB", "lang": "influx", "labName": "InfluxQL vs Flux", "labNote": "Each step answers the same question two ways: InfluxQL (SQL-like) and Flux (pipelines), comparing the syntax and the shape of the returned data. The series cardinality (tag vs field) and downsampling labs write data; use the Lab page of the showcase app.", "hasResults": true, "exercises": [{"id": "tag-values", "chapter": "Data model and basic queries", "title": "Which hosts exist: SHOW TAG VALUES", "prompt": "What values does the host tag of the cpu measurement have?\n", "hints": ["SHOW TAG VALUES FROM measurement WITH KEY = \"tag name\"", "InfluxQL identifiers (measurement, tag and field names) use double quotes; string values use single quotes."], "answer": "SHOW TAG VALUES FROM cpu WITH KEY = \"host\"\n", "explanation": "A data point in InfluxDB = measurement + tag set + field set + timestamp, for example:\ncpu,host=db-01,region=tpe,role=db usage_user=35.8,usage_system=10.2 1790783940\nTags are indexed (for filtering and grouping) and their values are always strings; fields aren't indexed (they hold the actual measured values: numbers, strings or booleans).\nmeasurement + tag set defines one \"series\" (time series): cpu has 5 (5 hosts), each stored separately in time order.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "cpu", "table": {"columns": ["key", "value"], "rows": [["host", "cache-01"], ["host", "db-01"], ["host", "web-01"], ["host", "web-02"], ["host", "web-03"]], "total": 5}}]}, {"id": "field-keys", "chapter": "Data model and basic queries", "title": "Field types: SHOW FIELD KEYS", "prompt": "What fields does orders have, and what type is each?\n", "hints": ["SHOW FIELD KEYS FROM measurement"], "answer": "SHOW FIELD KEYS FROM orders\n", "explanation": "In orders, customer_id, order_id, items and total are fields (integer); city, status and vip_level are tags.\n★ Data with many distinct values (order numbers, customer numbers, user IDs, trace ids) must not be tags: every distinct tag combination is a new series,\nand a series-count (cardinality) explosion eats memory and slows writes and queries. This is the most important rule of InfluxDB's data model.\nA field's type is fixed by its first write (within a shard); later writes of a different type are rejected.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "orders", "table": {"columns": ["fieldKey", "fieldType"], "rows": [["customer_id", "integer"], ["items", "integer"], ["order_id", "integer"], ["total", "integer"]], "total": 4}}]}, {"id": "raw-range", "chapter": "Data model and basic queries", "title": "Time range + tag condition", "prompt": "db-01's raw usage_user and usage_system from 14:00 to 14:05 on 2026-09-18 (Taiwan time, excluding 14:05).\n", "hints": ["Write the time condition as time >= '2026-09-18T14:00:00+08:00' AND time < '…'", "Tag values are strings, in single quotes: host = 'db-01'"], "answer": "SELECT usage_user, usage_system FROM cpu\nWHERE host = 'db-01'\n  AND time >= '2026-09-18T14:00:00+08:00' AND time < '2026-09-18T14:05:00+08:00'\n", "explanation": "One point per minute, so 5 rows; results are always sorted by time (oldest first by default), and the first column is always time.\n★ Always add a time range: InfluxDB splits data into shards (shard groups) by time, and without a time condition every shard must be scanned.\nInfluxQL has no JOIN; a query operates on \"one or more series within one measurement\".\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "cpu", "table": {"columns": ["time", "usage_user", "usage_system"], "rows": [["2026-09-18 14:00:00", 94.34, 26.89], ["2026-09-18 14:01:00", 95.8, 29.51], ["2026-09-18 14:02:00", 98.58, 28.04], ["2026-09-18 14:03:00", 93.8, 27.91], ["2026-09-18 14:04:00", 94.1, 28.05]], "total": 5}}]}, {"id": "last-per-host", "chapter": "Data model and basic queries", "title": "Each host's last report", "prompt": "The time of each host's (host) last report and its usage_user at that time.\n", "hints": ["last() is a selector: it returns the value of the last point, and the time column is that point's time.", "GROUP BY host computes it once per host."], "answer": "SELECT last(usage_user) FROM cpu GROUP BY host\n", "explanation": "The other hosts' last points are all at 23:59 on 9/30, but web-03 stops at 12:00 on 9/20: it went offline. Monitoring systems use queries like this for \"lost contact\" alerts (deadman checks).\nSelectors (first, last, max, min, top, bottom, percentile) return a real existing point, and time is that point's time;\naggregates (mean, sum, count…) return a computed value, and time is the start of the interval (0, i.e. 1970-01-01, without GROUP BY time).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "cpu  [host=cache-01]", "table": {"columns": ["time", "last"], "rows": [["2026-09-30 23:59:00", 15.65]], "total": 1}}, {"cmd": "cpu  [host=db-01]", "table": {"columns": ["time", "last"], "rows": [["2026-09-30 23:59:00", 35.84]], "total": 1}}, {"cmd": "cpu  [host=web-01]", "table": {"columns": ["time", "last"], "rows": [["2026-09-30 23:59:00", 29.57]], "total": 1}}, {"cmd": "cpu  [host=web-02]", "table": {"columns": ["time", "last"], "rows": [["2026-09-30 23:59:00", 30.26]], "total": 1}}, {"cmd": "cpu  [host=web-03]", "table": {"columns": ["time", "last"], "rows": [["2026-09-20 11:59:00", 33.36]], "total": 1}}]}, {"id": "latest-orders", "chapter": "Data model and basic queries", "title": "The 3 latest orders", "prompt": "The 3 latest orders in 台北市 (city = '台北市', Taipei), returning every column (SELECT *), newest first.\n", "hints": ["ORDER BY time DESC LIMIT 3 (InfluxQL can only sort by time)"], "answer": "SELECT * FROM orders WHERE city = '台北市' ORDER BY time DESC LIMIT 3\n", "explanation": "SELECT * returns every tag and field, with columns sorted by name.\n★ InfluxQL's ORDER BY can only use time; to \"sort by amount\" use top() / bottom(), or sort() in Flux.\nA time series database assumes most of your queries are \"some time range, by time\", so data is stored by time and other orderings aren't its strength.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "orders", "table": {"columns": ["time", "city", "customer_id", "items", "order_id", "status", "total", "vip_level"], "rows": [["2026-09-30 20:32:31", "台北市", 16593, 3, 79991, "pending", 3771, "normal"], ["2026-09-30 20:09:32", "台北市", 16626, 4, 79989, "paid", 14516, "normal"], ["2026-09-30 18:40:33", "台北市", 15707, 3, 79980, "shipped", 85173, "normal"]], "total": 3}}]}, {"id": "hourly-mean", "chapter": "Aggregation and GROUP BY time", "title": "Average CPU per hour", "prompt": "db-01's average usage_user per hour from 12:00 to 17:00 on 2026-09-18 (Taiwan time).\n", "hints": ["GROUP BY time(1h): cut time into one-hour intervals.", "Add tz('Asia/Taipei') at the end so result times align to Taiwan time (hours align anyway, but days and weeks depend on it)."], "answer": "SELECT mean(usage_user) FROM cpu\nWHERE host = 'db-01' AND time >= '2026-09-18T12:00:00+08:00' AND time < '2026-09-18T17:00:00+08:00'\nGROUP BY time(1h) tz('Asia/Taipei')\n", "explanation": "GROUP BY time() ≈ TimescaleDB's time_bucket and Elasticsearch's date_histogram.\nThe 14:00 hour averages 76%: fully loaded from 14:00 to 14:40, back to normal for the last 20 minutes. Hourly averages alone underestimate an incident; look at max or a smaller interval (5m).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "cpu", "table": {"columns": ["time", "mean"], "rows": [["2026-09-18 12:00:00", 40.576], ["2026-09-18 13:00:00", 37.2308], ["2026-09-18 14:00:00", 76.4702], ["2026-09-18 15:00:00", 37.512], ["2026-09-18 16:00:00", 37.3137]], "total": 5}}]}, {"id": "daily-max", "chapter": "Aggregation and GROUP BY time", "title": "Each host's daily maximum CPU", "prompt": "For 2026-09-18 and 09-19 (Taiwan time), the maximum usage_user of each host on each day.\n", "hints": ["GROUP BY time(1d), host tz('Asia/Taipei')"], "answer": "SELECT max(usage_user) FROM cpu\nWHERE time >= '2026-09-18T00:00:00+08:00' AND time < '2026-09-20T00:00:00+08:00'\nGROUP BY time(1d), host tz('Asia/Taipei')\n", "explanation": "GROUP BY can have both time() and tags: one result (series) per host, with one row per day in each.\n★ Intervals of a day or more always need tz(): without it they're cut in UTC, and a Taiwan day starts at 8 a.m. (shown in the traps).\nmax is a selector, and the time column is the interval start (with GROUP BY time, a selector's time also becomes the interval start).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "cpu  [host=cache-01]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 00:00:00", 26.69], ["2026-09-19 00:00:00", 26.8]], "total": 2}}, {"cmd": "cpu  [host=db-01]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 00:00:00", 98.93], ["2026-09-19 00:00:00", 56.72]], "total": 2}}, {"cmd": "cpu  [host=web-01]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 00:00:00", 56.34], ["2026-09-19 00:00:00", 55.59]], "total": 2}}, {"cmd": "cpu  [host=web-02]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 00:00:00", 55.25], ["2026-09-19 00:00:00", 55.37]], "total": 2}}, {"cmd": "cpu  [host=web-03]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 00:00:00", 49.15], ["2026-09-19 00:00:00", 47.22]], "total": 2}}]}, {"id": "sensor-p95", "chapter": "Aggregation and GROUP BY time", "title": "P95 temperature of cold-storage sensors", "prompt": "For cold-storage sensors (kind = 'cold'), the 95th percentile of temperature for each sensor_id over all of September.\n", "hints": ["percentile(temperature, 95), GROUP BY sensor_id"], "answer": "SELECT percentile(temperature, 95) FROM sensors WHERE kind = 'cold' GROUP BY sensor_id\n", "explanation": "Cold storage should be around 4 degrees; sensor 2's P95 is similar to sensors 1 and 4, because the warm-up on 9/18 lasted only 2 hours, 0.3% of the month.\nTo see \"whether anything went wrong\" use max or P99.9; to see \"what's normal\" use the median or P95. percentile is computed exactly in InfluxQL (it sorts every value).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "sensors  [sensor_id=1]", "table": {"columns": ["time", "percentile"], "rows": [["2026-09-01 16:30:00", 4.67]], "total": 1}}, {"cmd": "sensors  [sensor_id=2]", "table": {"columns": ["time", "percentile"], "rows": [["2026-09-15 13:45:00", 4.67]], "total": 1}}, {"cmd": "sensors  [sensor_id=4]", "table": {"columns": ["time", "percentile"], "rows": [["2026-09-04 17:20:00", 4.66]], "total": 1}}]}, {"id": "orders-by-city", "chapter": "Aggregation and GROUP BY time", "title": "Orders and revenue per city in September", "prompt": "For September 2026 (Taiwan time), the number of orders (count) and revenue (sum) per city (city), both computed on the total field.\n", "hints": ["SELECT count(total), sum(total) FROM orders WHERE … GROUP BY city"], "answer": "SELECT count(total), sum(total) FROM orders\nWHERE time >= '2026-09-01T00:00:00+08:00' AND time < '2026-10-01T00:00:00+08:00'\nGROUP BY city\n", "explanation": "GROUP BY can only use tags (or time): city is a tag, so it can be grouped; if city were a field it couldn't (a trap shows the result of GROUP BY on a field).\ncount() must name a field: InfluxQL has no count(*) \"row count\" concept; each field is counted separately.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "orders  [city=台中市]", "table": {"columns": ["time", "count", "sum"], "rows": [["2026-09-01 00:00:00", 283, 4061379]], "total": 1}}, {"cmd": "orders  [city=台北市]", "table": {"columns": ["time", "count", "sum"], "rows": [["2026-09-01 00:00:00", 665, 10243795]], "total": 1}}, {"cmd": "orders  [city=台南市]", "table": {"columns": ["time", "count", "sum"], "rows": [["2026-09-01 00:00:00", 199, 3037168]], "total": 1}}, {"cmd": "orders  [city=台東縣]", "table": {"columns": ["time", "count", "sum"], "rows": [["2026-09-01 00:00:00", 96, 1259087]], "total": 1}}, {"cmd": "orders  [city=嘉義市]", "table": {"columns": ["time", "count", "sum"], "rows": [["2026-09-01 00:00:00", 126, 1800252]], "total": 1}}, {"cmd": "orders  [city=基隆市]", "table": {"columns": ["time", "count", "sum"], "rows": [["2026-09-01 00:00:00", 117, 1522664]], "total": 1}}, {"cmd": "orders  [city=宜蘭縣]", "table": {"columns": ["time", "count", "sum"], "rows": [["2026-09-01 00:00:00", 108, 1269692]], "total": 1}}, {"cmd": "orders  [city=屏東縣]", "table": {"columns": ["time", "count", "sum"], "rows": [["2026-09-01 00:00:00", 110, 1707557]], "total": 1}}, {"cmd": "orders  [city=彰化縣]", "table": {"columns": ["time", "count", "sum"], "rows": [["2026-09-01 00:00:00", 92, 1288676]], "total": 1}}, {"cmd": "orders  [city=新北市]", "table": {"columns": ["time", "count", "sum"], "rows": [["2026-09-01 00:00:00", 319, 4455786]], "total": 1}}, {"cmd": "orders  [city=新竹市]", "table": {"columns": ["time", "count", "sum"], "rows": [["2026-09-01 00:00:00", 128, 2041336]], "total": 1}}, {"cmd": "orders  [city=新竹縣]", "table": {"columns": ["time", "count", "sum"], "rows": [["2026-09-01 00:00:00", 121, 2169276]], "total": 1}}]}, {"id": "fill-gap", "chapter": "Aggregation and GROUP BY time", "title": "An outage: fill()", "prompt": "Sensor 5's average temperature per hour from 09:00 to 15:00 on 2026-09-10 (Taiwan time). It was disconnected from 10:00 to 14:00;\nfill hours without data with \"the previous hour's value\" (fill(previous)).\n", "hints": ["GROUP BY time(1h) fill(previous) tz('Asia/Taipei')", "sensor_id is a tag and its value is a string: sensor_id = '5'"], "answer": "SELECT mean(temperature) FROM sensors\nWHERE sensor_id = '5' AND time >= '2026-09-10T09:00:00+08:00' AND time < '2026-09-10T15:00:00+08:00'\nGROUP BY time(1h) fill(previous) tz('Asia/Taipei')\n", "explanation": "GROUP BY time() lists every interval in the range by default, and intervals without data have null (fill(null)). Other options:\nfill(none) omits them, fill(0) fills 0, fill(previous) uses the previous value, fill(linear) interpolates linearly.\n★ Filling makes charts look nice but also \"hides outages\": alerts and reports must distinguish what was really measured.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "sensors", "table": {"columns": ["time", "mean"], "rows": [["2026-09-10 09:00:00", 24.385], ["2026-09-10 10:00:00", 24.385], ["2026-09-10 11:00:00", 24.385], ["2026-09-10 12:00:00", 24.385], ["2026-09-10 13:00:00", 24.385], ["2026-09-10 14:00:00", 26.8633]], "total": 6}}]}, {"id": "top-orders", "chapter": "Aggregation and GROUP BY time", "title": "The 5 largest orders: top()", "prompt": "The 5 orders with the highest amount (total) in September 2026 (Taiwan time), also returning order_id and city.\n", "hints": ["top(total, 5) is a selector and can be SELECTed together with other fields and tags."], "answer": "SELECT top(total, 5), order_id, city FROM orders\nWHERE time >= '2026-09-01T00:00:00+08:00' AND time < '2026-10-01T00:00:00+08:00'\n", "explanation": "top() returns rows sorted by time (not by amount), and time is that order's time.\nInfluxQL can't ORDER BY total; top / bottom is the only way to \"take the top few by value\". To sort all data by value, use Flux's sort().\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "orders", "table": {"columns": ["time", "top", "order_id", "city"], "rows": [["2026-09-04 12:35:16", 215034, 77409, "桃園市"], ["2026-09-15 03:18:53", 256852, 78417, "台北市"], ["2026-09-21 21:25:42", 221595, 79103, "屏東縣"], ["2026-09-26 05:21:44", 208674, 79519, "台北市"], ["2026-09-26 08:54:21", 329224, 79533, "花蓮縣"]], "total": 5}}]}, {"id": "subquery-peak", "chapter": "Aggregation and GROUP BY time", "title": "Subqueries: each host's busiest hour", "prompt": "On 2026-09-18 (Taiwan time), each host's hour with the highest \"hourly average usage_user\", and that average.\n", "hints": ["Inner query: the average per hour per host. Outer query: max(mean) of the inner result, GROUP BY host.", "SELECT max(mean) FROM (SELECT mean(usage_user) FROM cpu WHERE … GROUP BY time(1h), host tz('Asia/Taipei')) GROUP BY host"], "answer": "SELECT max(mean) FROM (\n  SELECT mean(usage_user) FROM cpu\n  WHERE time >= '2026-09-18T00:00:00+08:00' AND time < '2026-09-19T00:00:00+08:00'\n  GROUP BY time(1h), host tz('Asia/Taipei')\n) GROUP BY host\n", "explanation": "InfluxQL supports subqueries since 1.2: the inner result's column name (mean) is used as a field in the outer query, and the inner GROUP BY tags are available outside too.\nThe web hosts are busiest at 9 p.m. (the traffic peak); db-01 at 2 p.m. (the incident).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "cpu  [host=cache-01]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 21:00:00", 17.9283]], "total": 1}}, {"cmd": "cpu  [host=db-01]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 14:00:00", 76.4702]], "total": 1}}, {"cmd": "cpu  [host=web-01]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 21:00:00", 50.5785]], "total": 1}}, {"cmd": "cpu  [host=web-02]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 21:00:00", 50.2065]], "total": 1}}, {"cmd": "cpu  [host=web-03]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 21:00:00", 42.8668]], "total": 1}}]}, {"id": "request-rate", "chapter": "Rates and counters", "title": "Cumulative counter → requests per minute", "prompt": "http's requests is a \"cumulative\" counter (it only goes up). Compute the api service's requests per minute from 02:57 to 03:03 on 2026-09-15 (Taiwan time).\napi restarted at 03:00 and the counter started over from 0; that minute must not come out negative.\n", "hints": ["non_negative_derivative(last(requests), 1m) … GROUP BY time(1m)"], "answer": "SELECT non_negative_derivative(last(requests), 1m) FROM http\nWHERE service = 'api' AND time >= '2026-09-15T02:57:00+08:00' AND time < '2026-09-15T03:03:00+08:00'\nGROUP BY time(1m)\n", "explanation": "Monitoring systems (Prometheus, Telegraf) mostly collect cumulative counters: they report only \"the total so far\", and the query side computes differences.\nThe benefit is that missed reports don't undercount; the downside is that a restart resets the counter to zero, and a straight subtraction gives a huge negative number (-3.6 million, shown in the traps).\nnon_negative_derivative drops negative values; Prometheus's rate() detects resets and compensates automatically.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "http", "table": {"columns": ["time", "non_negative_derivative"], "rows": [["2026-09-15 02:57:00", 30], ["2026-09-15 02:58:00", 32], ["2026-09-15 02:59:00", 30], ["2026-09-15 03:01:00", 21], ["2026-09-15 03:02:00", 20]], "total": 5}}]}, {"id": "errors-per-10m", "chapter": "Rates and counters", "title": "Errors per 10 minutes", "prompt": "How many new errors did the api service have per 10 minutes from 13:30 to 15:00 on 2026-09-18 (Taiwan time)? (errors is also a cumulative counter.)\n", "hints": ["non_negative_difference(last(errors)) computes the difference between adjacent intervals (not divided by time)."], "answer": "SELECT non_negative_difference(last(errors)) FROM http\nWHERE service = 'api' AND time >= '2026-09-18T13:30:00+08:00' AND time < '2026-09-18T15:00:00+08:00'\nGROUP BY time(10m)\n", "explanation": "difference is \"the next minus the previous\"; derivative also divides by a time unit (giving a rate). From 14:00 to 14:40 there are hundreds of errors per 10 minutes; other periods have single digits.\nNote the first interval has no previous value to subtract from, so the result has one row fewer than the number of intervals.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "http", "table": {"columns": ["time", "non_negative_difference"], "rows": [["2026-09-18 13:30:00", 8], ["2026-09-18 13:40:00", 7], ["2026-09-18 13:50:00", 9], ["2026-09-18 14:00:00", 673], ["2026-09-18 14:10:00", 637], ["2026-09-18 14:20:00", 602], ["2026-09-18 14:30:00", 744], ["2026-09-18 14:40:00", 9], ["2026-09-18 14:50:00", 9]], "total": 9}}]}, {"id": "moving-average", "chapter": "Rates and counters", "title": "Moving average: moving_average()", "prompt": "Sensor 2's average temperature per 30 minutes from 12:00 to 16:00 on 2026-09-18 (Taiwan time), then the moving average over \"the last 3 intervals\".\n", "hints": ["moving_average(mean(temperature), 3) … GROUP BY time(30m) tz('Asia/Taipei')"], "answer": "SELECT moving_average(mean(temperature), 3) FROM sensors\nWHERE sensor_id = '2' AND time >= '2026-09-18T12:00:00+08:00' AND time < '2026-09-18T16:00:00+08:00'\nGROUP BY time(30m) tz('Asia/Taipei')\n", "explanation": "A moving average smooths the curve to show trends and reduce false alarms (no alert for a brief temperature blip, only for a sustained rise); the cost is slower reaction.\nThe first 2 intervals don't have 3 values yet, so they aren't output.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "sensors", "table": {"columns": ["time", "moving_average"], "rows": [["2026-09-18 12:30:00", 4.1072], ["2026-09-18 13:00:00", 4.5839], ["2026-09-18 13:30:00", 6.4628], ["2026-09-18 14:00:00", 9.0744], ["2026-09-18 14:30:00", 11.1656], ["2026-09-18 15:00:00", 9.2694], ["2026-09-18 15:30:00", 6.6244]], "total": 7}}]}, {"id": "memory-leak", "chapter": "Rates and counters", "title": "How much memory grows per day: derivative()", "prompt": "web-02's average used_percent per day from 2026-09-10 to 09-20 (Taiwan time), and the change from the previous day (per day).\n", "hints": ["derivative(mean(used_percent), 1d) … GROUP BY time(1d) tz('Asia/Taipei')"], "answer": "SELECT derivative(mean(used_percent), 1d) FROM mem\nWHERE host = 'web-02' AND time >= '2026-09-10T00:00:00+08:00' AND time < '2026-09-20T00:00:00+08:00'\nGROUP BY time(1d) tz('Asia/Taipei')\n", "explanation": "It grows steadily by about 1.7% a day: a classic memory leak. The big drop on 9/15 is because of a restart at 3 a.m. (the leaked memory was freed).\nUse the rate of change for \"predictive alerts\": at this rate it fills up in a few days, which warns earlier than waiting for 95%.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "mem", "table": {"columns": ["time", "derivative"], "rows": [["2026-09-10 00:00:00", 1.7161], ["2026-09-11 00:00:00", 1.7251], ["2026-09-12 00:00:00", 1.7156], ["2026-09-13 00:00:00", 1.7332], ["2026-09-14 00:00:00", 1.7279], ["2026-09-15 00:00:00", -19.611], ["2026-09-16 00:00:00", -1.3393], ["2026-09-17 00:00:00", 1.7294], ["2026-09-18 00:00:00", 1.7306], ["2026-09-19 00:00:00", 1.7425]], "total": 10}}]}, {"id": "flux-basic", "chapter": "Flux", "title": "A basic Flux pipeline", "prompt": "Use Flux to compute db-01's average usage_user from 14:00 to 15:00 on 2026-09-18 (Taiwan time).\n", "hints": ["from(bucket: \"metrics\") |> range(start: …, stop: …) |> filter(fn: (r) => …) |> mean()", "Flux times can be written directly as 2026-09-18T14:00:00+08:00 (no quotes).", "In filter, match _measurement, _field and host together."], "answer": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-18T14:00:00+08:00, stop: 2026-09-18T15:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\" and r.host == \"db-01\")\n  |> mean()\n", "explanation": "Flux is a pipeline (|>): data flows down as \"tables\", and each function processes them and hands them to the next.\nfrom must be followed by range (no time range is an error); filter takes an anonymous function, where r is a row.\nFlux's data model: each row has only one value (_value), with the field name in _field; one series (measurement + tags + field) is one table.\nFlux is no longer getting new features (InfluxDB 3 went back to SQL / InfluxQL), but 2.x systems use it heavily.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "table 0  [host=db-01, region=tpe, role=db]", "table": {"columns": ["_start", "_stop", "_value", "_field", "_measurement", "host", "region", "role"], "rows": [["2026-09-18 14:00:00", "2026-09-18 15:00:00", 76.4702, "usage_user", "cpu", "db-01", "tpe", "db"]], "total": 1}}]}, {"id": "flux-window", "chapter": "Flux", "title": "aggregateWindow: the daily maximum", "prompt": "Use Flux to compute db-01's maximum usage_user on each of 2026-09-18 and 09-19 (Taiwan time).\n", "hints": ["aggregateWindow(every: 1d, fn: max)", "To cut days in Taiwan time: import \"timezone\", then add option location = timezone.location(name: \"Asia/Taipei\")"], "answer": "import \"timezone\"\noption location = timezone.location(name: \"Asia/Taipei\")\n\nfrom(bucket: \"metrics\")\n  |> range(start: 2026-09-18T00:00:00+08:00, stop: 2026-09-20T00:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\" and r.host == \"db-01\")\n  |> aggregateWindow(every: 1d, fn: max)\n", "explanation": "aggregateWindow ≈ InfluxQL's GROUP BY time(): computed once per window, and _time is the window's \"end\" (InfluxQL uses the start; they differ!).\noption location aligns 1d windows to Taiwan time; without it they're cut in UTC. createEmpty (default true) decides whether windows without data are output.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "table 0  [host=db-01, region=tpe, role=db]", "table": {"columns": ["_start", "_stop", "_time", "_value", "_field", "_measurement", "host", "region", "role"], "rows": [["2026-09-18 00:00:00", "2026-09-20 00:00:00", "2026-09-19 00:00:00", 98.93, "usage_user", "cpu", "db-01", "tpe", "db"], ["2026-09-18 00:00:00", "2026-09-20 00:00:00", "2026-09-20 00:00:00", 56.72, "usage_user", "cpu", "db-01", "tpe", "db"]], "total": 2}}]}, {"id": "flux-pivot", "chapter": "Flux", "title": "pivot + map: add two fields together", "prompt": "db-01's total CPU usage (usage_user + usage_system) per minute from 14:00 to 14:05 on 2026-09-18 (Taiwan time).\nKeep only the two columns _time and total.\n", "hints": ["Each Flux row has only one _value, and the two fields are in different tables. Pivot them into one row first: pivot(rowKey: [\"_time\"], columnKey: [\"_field\"], valueColumn: \"_value\")", "Then add a column with map: map(fn: (r) => ({ r with total: r.usage_user + r.usage_system }))", "Finally keep(columns: [\"_time\", \"total\"])"], "answer": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-18T14:00:00+08:00, stop: 2026-09-18T14:05:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r.host == \"db-01\")\n  |> filter(fn: (r) => r._field == \"usage_user\" or r._field == \"usage_system\")\n  |> pivot(rowKey: [\"_time\"], columnKey: [\"_field\"], valueColumn: \"_value\")\n  |> map(fn: (r) => ({ r with total: r.usage_user + r.usage_system }))\n  |> keep(columns: [\"_time\", \"total\"])\n", "explanation": "InfluxQL can SELECT usage_user + usage_system directly; because of Flux's \"one value per row\" data model, you have to pivot first (like a pivot table) to compute across fields.\nInfluxDB 3's SQL goes back to wide tables with \"several fields per row\", which removes this problem.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "table 0", "table": {"columns": ["_time", "total"], "rows": [["2026-09-18 14:00:00", 121.23], ["2026-09-18 14:01:00", 125.31], ["2026-09-18 14:02:00", 126.62], ["2026-09-18 14:03:00", 121.71], ["2026-09-18 14:04:00", 122.15]], "total": 5}}]}, {"id": "flux-rank-hosts", "chapter": "Flux", "title": "group + sort: rank hosts by average CPU", "prompt": "Each host's average usage_user over all of September (Taiwan time), sorted highest first, keeping only the two columns host and _value.\n", "hints": ["After mean() each host is still its own table; group() them first (merging everything into one table) to sort them together.", "sort(columns: [\"_value\"], desc: true) |> keep(columns: [\"host\", \"_value\"])"], "answer": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-01T00:00:00+08:00, stop: 2026-10-01T00:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\")\n  |> mean()\n  |> group()\n  |> sort(columns: [\"_value\"], desc: true)\n  |> keep(columns: [\"host\", \"_value\"])\n", "explanation": "In Flux, \"groups\" are tables: from produces one table per series; group(columns: […]) regroups by the given columns, and group() merges everything into one.\nAggregates (mean, sum, count) run \"once per table\", and sort and limit also work per table, so group() before ranking across hosts.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "table 0", "table": {"columns": ["_value", "host"], "rows": [[36.2103, "db-01"], [33.3995, "web-01"], [33.3775, "web-02"], [29.0059, "web-03"], [12.4766, "cache-01"]], "total": 5}}]}, {"id": "flux-rate", "chapter": "Flux", "title": "Rates in Flux: derivative(nonNegative: true)", "prompt": "Use Flux to compute the api service's requests per minute from 02:57 to 03:03 on 2026-09-15 (Taiwan time) (requests is a cumulative counter; skip the negative value of the restart minute).\nKeep only _time and _value.\n", "hints": ["derivative(unit: 1m, nonNegative: true)"], "answer": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-15T02:57:00+08:00, stop: 2026-09-15T03:03:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"http\" and r._field == \"requests\" and r.service == \"api\")\n  |> derivative(unit: 1m, nonNegative: true)\n  |> keep(columns: [\"_time\", \"_value\"])\n", "explanation": "Same as InfluxQL's non_negative_derivative: the negative value of the restart minute is skipped. Flux also has increase() (cumulative increase with automatic counter-reset handling)\nand difference(nonNegative: true).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "table 0", "table": {"columns": ["_time", "_value"], "rows": [["2026-09-15 02:58:00", 32.0], ["2026-09-15 02:59:00", 30.0], ["2026-09-15 03:00:00", null], ["2026-09-15 03:01:00", 21.0], ["2026-09-15 03:02:00", 20.0]], "total": 5}}]}, {"id": "write-points", "chapter": "Writes", "title": "line protocol: write three readings", "prompt": "Write three readings for sensor 9 (sensor_id=9, kind=cold) to the scratch bucket, with measurement sensors:\ntimestamps (seconds) 1790726400, 1790726700 and 1790727000, with temperature 4.1, 4.3 and 4.2 respectively.\n", "hints": ["Format: measurement,tag1=value,tag2=value field1=value,field2=value timestamp", "A comma between measurement and tags, one space between tags and fields, one space between fields and the time.", "sensors,kind=cold,sensor_id=9 temperature=4.1 1790726400"], "answer": "sensors,kind=cold,sensor_id=9 temperature=4.1 1790726400\nsensors,kind=cold,sensor_id=9 temperature=4.3 1790726700\nsensors,kind=cold,sensor_id=9 temperature=4.2 1790727000\n", "explanation": "line protocol is InfluxDB's write format: one point per line, and many lines can be sent at once (batched writes; about 5,000 lines per batch is recommended).\nSorting tags by name before writing makes server processing faster; spaces, commas and equals signs must be escaped with a backslash. The timestamp unit is set by the precision parameter (seconds here).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "寫入 scratch", "text": "寫入 3 行（HTTP 204）", "error": false}], "checks": [{"cmd": "sensors", "table": {"columns": ["time", "kind", "sensor_id", "temperature"], "rows": [["2026-09-30 08:00:00", "cold", "9", 4.1], ["2026-09-30 08:05:00", "cold", "9", 4.3], ["2026-09-30 08:10:00", "cold", "9", 4.2]], "total": 3}}]}, {"id": "write-types", "chapter": "Writes", "title": "Field types: integers need an i", "prompt": "Write one order to scratch (measurement orders) at timestamp 1790726400:\ntags city=台北市 (Taipei) and status=paid; fields total (integer 1990), items (integer 2), coupon (string \"WELCOME\") and gift (boolean true).\n", "hints": ["Integers need an i after the number (1990i); a number without i is a float.", "String fields need double quotes; booleans are written true / false (tag values take no quotes)."], "answer": "orders,city=台北市,status=paid total=1990i,items=2i,coupon=\"WELCOME\",gift=true 1790726400\n", "explanation": "Fields have four types: float (the default), integer (ending in i), string (double quotes) and boolean. Tag values are always strings.\nA field's type is fixed by its first write: later writing another type in the same shard (e.g. total=1.5) is rejected (shown in the traps).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "寫入 scratch", "text": "寫入 1 行（HTTP 204）", "error": false}], "checks": [{"cmd": "orders", "table": {"columns": ["fieldKey", "fieldType"], "rows": [["coupon", "string"], ["gift", "boolean"], ["items", "integer"], ["total", "integer"]], "total": 4}}, {"cmd": "orders", "table": {"columns": ["time", "city", "coupon", "gift", "items", "status", "total"], "rows": [["2026-09-30 08:00:00", "台北市", "WELCOME", true, 2, "paid", 1990]], "total": 1}}]}, {"id": "write-overwrite", "chapter": "Writes", "title": "Fix a wrongly written value", "prompt": "The temperature of sensor sensors,kind=cold,sensor_id=9 at timestamp 1790726400 was written wrong.\nFirst write the wrong value temperature=41.0, then \"fix\" it to 4.1. Afterwards this point in time must have exactly one value, 4.1.\n", "hints": ["InfluxDB has no UPDATE: writing the same series (measurement + tag set) at the same timestamp again overwrites the field values."], "answer": "sensors,kind=cold,sensor_id=9 temperature=41.0 1790726400\nsensors,kind=cold,sensor_id=9 temperature=4.1 1790726400\n", "explanation": "Points with the same measurement + tag set + timestamp are \"the same point\"; field values written later overwrite earlier ones (different fields are merged).\n★ This is also a trap: two events in the same second with the same tags (e.g. one customer placing two orders in the same second) means the later overwrites the earlier.\nThe fix is a finer timestamp precision (ms, ns), or an extra tag that tells them apart. To delete data use the delete API (by time range + tag conditions).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "寫入 scratch", "text": "寫入 2 行（HTTP 204）", "error": false}], "checks": [{"cmd": "sensors", "table": {"columns": ["time", "kind", "sensor_id", "temperature"], "rows": [["2026-09-30 08:00:00", "cold", "9", 4.1]], "total": 1}}]}], "traps": [{"id": "double-quotes", "title": "Double quotes around strings", "question": "A writes the tag value in double quotes, \"db-01\". What does it return?", "options": ["The same as B, 3 rows", "No data, and no error", "A syntax error"], "answer": 1, "explanation": "In InfluxQL double quotes mean an \"identifier\" (a measurement, tag or field name); only single quotes are string values.\nhost = \"db-01\" means \"the host tag equals the value of the tag / field named db-01\"; there's no column called db-01, so nothing matches, and there's no error.\n★ Rule: single quotes for values, double quotes for names (required only when a name has special characters or is a reserved word).\n", "setup": null, "scripts": [{"label": "A: host = \"db-01\"", "code": "-- InfluxQL\nSELECT usage_user FROM cpu WHERE host = \"db-01\" LIMIT 3"}, {"label": "B: host = 'db-01'", "code": "-- InfluxQL\nSELECT usage_user FROM cpu WHERE host = 'db-01' LIMIT 3"}], "results": [[{"cmd": "SELECT usage_user FROM cpu WHERE host = \"db-01\" LIMIT 3", "text": "完成，沒有回傳資料", "error": false}], [{"cmd": "cpu", "table": {"columns": ["time", "usage_user"], "rows": [["2026-09-01 00:00:00", 29.5], ["2026-09-01 00:01:00", 29.13], ["2026-09-01 00:02:00", 30.1]], "total": 3}}]]}, {"id": "tag-is-string", "title": "Are tag values numbers?", "question": "sensor_id was written as 2, 3, 4…. Does A, comparing with the number sensor_id = 2, find sensor 2's data?", "options": ["Yes, InfluxDB converts the type automatically", "No: tag values are always strings", "An error: type mismatch"], "answer": 1, "explanation": "Tag values are always strings; \"2\" and the number 2 aren't equal, so A returns nothing (and no error).\nLikewise, tags can't be compared numerically (sensor_id > 3 is a string comparison) and can't be summed or averaged. Numbers you need to compute with should be stored as fields.\n", "setup": null, "scripts": [{"label": "A: sensor_id = 2", "code": "-- InfluxQL\nSELECT temperature FROM sensors WHERE sensor_id = 2 LIMIT 2"}, {"label": "B: sensor_id = '2'", "code": "-- InfluxQL\nSELECT temperature FROM sensors WHERE sensor_id = '2' LIMIT 2"}], "results": [[{"cmd": "SELECT temperature FROM sensors WHERE sensor_id = 2 LIMIT 2", "text": "完成，沒有回傳資料", "error": false}], [{"cmd": "sensors", "table": {"columns": ["time", "temperature"], "rows": [["2026-09-01 00:00:00", 3.89], ["2026-09-01 00:05:00", 3.84]], "total": 2}}]]}, {"id": "no-tz", "title": "GROUP BY time(1d) without tz()", "question": "db-01's daily maximum for 9/18 and 9/19 (Taiwan time). A has no tz(). How many rows does it return?", "options": ["2 rows, the same as B", "3 rows: cut in UTC, a Taiwan day starts at 8 a.m., leaving an extra piece at each end", "An error: the time range has a time zone, so GROUP BY must too"], "answer": 1, "explanation": "InfluxDB stores all times in UTC, and GROUP BY time(1d) cuts at UTC midnight by default. 00:00–08:00 on 9/18 Taiwan time belongs to 9/17 in UTC, so there's an extra row and every day's value is wrong.\nIt's the same trap as TimescaleDB's time_bucket and Elasticsearch's date_histogram; in Flux, set option location.\n", "setup": null, "scripts": [{"label": "A: no tz()", "code": "-- InfluxQL\nSELECT max(usage_user) FROM cpu\nWHERE host = 'db-01' AND time >= '2026-09-18T00:00:00+08:00' AND time < '2026-09-20T00:00:00+08:00'\nGROUP BY time(1d)"}, {"label": "B: tz('Asia/Taipei')", "code": "-- InfluxQL\nSELECT max(usage_user) FROM cpu\nWHERE host = 'db-01' AND time >= '2026-09-18T00:00:00+08:00' AND time < '2026-09-20T00:00:00+08:00'\nGROUP BY time(1d) tz('Asia/Taipei')"}], "results": [[{"cmd": "cpu", "table": {"columns": ["time", "max"], "rows": [["2026-09-17 08:00:00", 36.65], ["2026-09-18 08:00:00", 98.93], ["2026-09-19 08:00:00", 56.72]], "total": 3}}], [{"cmd": "cpu", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 00:00:00", 98.93], ["2026-09-19 00:00:00", 56.72]], "total": 2}}]]}, {"id": "counter-reset", "title": "derivative after a counter reset", "question": "requests is a cumulative counter, and api started over from 0 after restarting at 03:00 on 9/15. A computes requests per minute with derivative. What is the 03:00 row?", "options": ["About 20–30, like the rows around it", "0", "A very large negative number"], "answer": 2, "explanation": "derivative is \"this point minus the previous\": the cumulative value before the restart was 3.6 million, and after the restart counting starts over, so the difference is -3.6 million; dashboards show a strange deep valley, and totals are dragged down.\n★ For cumulative counters always use non_negative_derivative / non_negative_difference (Flux: nonNegative: true, or increase()).\n", "setup": null, "scripts": [{"label": "A: derivative", "code": "-- InfluxQL\nSELECT derivative(last(requests), 1m) FROM http\nWHERE service = 'api' AND time >= '2026-09-15T02:57:00+08:00' AND time < '2026-09-15T03:03:00+08:00'\nGROUP BY time(1m)"}, {"label": "B: non_negative_derivative", "code": "-- InfluxQL\nSELECT non_negative_derivative(last(requests), 1m) FROM http\nWHERE service = 'api' AND time >= '2026-09-15T02:57:00+08:00' AND time < '2026-09-15T03:03:00+08:00'\nGROUP BY time(1m)"}], "results": [[{"cmd": "http", "table": {"columns": ["time", "derivative"], "rows": [["2026-09-15 02:57:00", 30], ["2026-09-15 02:58:00", 32], ["2026-09-15 02:59:00", 30], ["2026-09-15 03:00:00", -3604579], ["2026-09-15 03:01:00", 21], ["2026-09-15 03:02:00", 20]], "total": 6}}], [{"cmd": "http", "table": {"columns": ["time", "non_negative_derivative"], "rows": [["2026-09-15 02:57:00", 30], ["2026-09-15 02:58:00", 32], ["2026-09-15 02:59:00", 30], ["2026-09-15 03:01:00", 21], ["2026-09-15 03:02:00", 20]], "total": 5}}]]}, {"id": "group-by-field", "title": "GROUP BY a field", "question": "customer_id is a field, not a tag. A wants the number of orders per customer. What does it get?", "options": ["One group per customer", "Everything squeezed into one group (customer_id is empty)", "An error: can't GROUP BY a field"], "answer": 1, "explanation": "GROUP BY only knows tags: when there's no tag called customer_id, it treats that tag as empty for every point, so all orders end up in one group, with no error.\n★ Columns you need to group by should be designed as tags; but a column with many values like a customer number makes series explode as a tag.\nThis kind of \"group by a high-cardinality column\" analysis isn't InfluxDB's strength; leave it to PostgreSQL, ClickHouse or Flux's group() (which can group by fields, but slowly).\n", "setup": null, "scripts": [{"label": "A: GROUP BY customer_id", "code": "-- InfluxQL\nSELECT count(total) FROM orders\nWHERE time >= '2026-09-01T00:00:00+08:00' AND time < '2026-10-01T00:00:00+08:00'\nGROUP BY customer_id"}], "results": [[{"cmd": "orders  [customer_id=]", "table": {"columns": ["time", "count"], "rows": [["2026-09-01 00:00:00", 2919]], "total": 1}}]]}, {"id": "select-only-tags", "title": "SELECTing only tags", "question": "A queries only the host tag, to list which host each point belongs to. What's the result?", "options": ["3 rows, one host each", "No data", "Every host name (distinct)"], "answer": 1, "explanation": "InfluxQL's SELECT needs at least one field; with only tags it returns no data (points are made of fields; tags just describe them).\nTo list tag values use SHOW TAG VALUES; to see each point's tags, SELECT them together with a field.\n", "setup": null, "scripts": [{"label": "A: SELECT host", "code": "-- InfluxQL\nSELECT host FROM cpu LIMIT 3"}, {"label": "B: plus a field", "code": "-- InfluxQL\nSELECT host, usage_user FROM cpu LIMIT 3"}], "results": [[{"cmd": "SELECT host FROM cpu LIMIT 3", "text": "完成，沒有回傳資料", "error": false}], [{"cmd": "cpu", "table": {"columns": ["time", "host", "usage_user"], "rows": [["2026-09-01 00:00:00", "cache-01", 10.53], ["2026-09-01 00:00:00", "db-01", 29.5], ["2026-09-01 00:00:00", "web-01", 25.19]], "total": 3}}]]}, {"id": "limit-per-series", "title": "GROUP BY host with LIMIT 1", "question": "How many rows does SELECT * FROM cpu GROUP BY host LIMIT 1 return?", "options": ["1 row", "5 rows: 1 for each host (each series)", "An error"], "answer": 1, "explanation": "With GROUP BY tag, LIMIT / OFFSET limit rows \"per series\"; to limit the number of series use SLIMIT / SOFFSET.\nThis \"split into series first, handle each series separately\" way of thinking runs through all of InfluxDB (Flux's \"each table separately\" is the same).\n", "setup": null, "scripts": [{"label": "LIMIT 1 + GROUP BY host", "code": "-- InfluxQL\nSELECT * FROM cpu GROUP BY host LIMIT 1"}], "results": [[{"cmd": "cpu  [host=cache-01]", "table": {"columns": ["time", "region", "role", "usage_system", "usage_user"], "rows": [["2026-09-01 00:00:00", "tpe", "cache", 3.72, 10.53]], "total": 1}}, {"cmd": "cpu  [host=db-01]", "table": {"columns": ["time", "region", "role", "usage_system", "usage_user"], "rows": [["2026-09-01 00:00:00", "tpe", "db", 10.02, 29.5]], "total": 1}}, {"cmd": "cpu  [host=web-01]", "table": {"columns": ["time", "region", "role", "usage_system", "usage_user"], "rows": [["2026-09-01 00:00:00", "tpe", "web", 6.15, 25.19]], "total": 1}}, {"cmd": "cpu  [host=web-02]", "table": {"columns": ["time", "region", "role", "usage_system", "usage_user"], "rows": [["2026-09-01 00:00:00", "tpe", "web", 7.14, 23.38]], "total": 1}}, {"cmd": "cpu  [host=web-03]", "table": {"columns": ["time", "region", "role", "usage_system", "usage_user"], "rows": [["2026-09-01 00:00:00", "tch", "web", 8.42, 22.63]], "total": 1}}]]}, {"id": "unbounded-flux", "title": "Flux without range", "question": "A's Flux has no range() and wants to read all cpu data. What's the result?", "options": ["It reads all the data (slowly)", "An error: range is required to bound the time", "It reads the last hour by default"], "answer": 1, "explanation": "Flux doesn't allow reads \"without a time range\": from must be followed by range (cannot submit unbounded read).\nThe storage engine splits data into shards by time and needs the time range to decide which shards to read. InfluxQL without a time condition reads everything (from 1677 to now), which is just as slow.\n", "setup": null, "scripts": [{"label": "A: from |> filter", "code": "// Flux\nfrom(bucket: \"metrics\")\n  |> filter(fn: (r) => r._measurement == \"cpu\")\n  |> limit(n: 1)"}], "results": [[{"cmd": "Flux", "text": "error in building plan while starting program: cannot submit unbounded read to \"metrics\"; try bounding 'from' with a call to 'range'", "error": true}]]}, {"id": "flux-window-time", "title": "aggregateWindow's _time", "question": "Both cut by the hour; InfluxQL's (A) time is the start of the interval. What is _time for Flux's aggregateWindow (B)?", "options": ["Also the start of the interval", "The end of the interval", "The time of the last point in the interval"], "answer": 1, "explanation": "aggregateWindow defaults to timeSrc: \"_stop\": _time is the end of the interval (the 13:00–14:00 average is labeled 14:00). InfluxQL labels the start (13:00).\nWhen mixing the two, or rewriting InfluxQL as Flux, charts shift by one interval. To align them set timeSrc: \"_start\".\n", "setup": null, "scripts": [{"label": "A: InfluxQL GROUP BY time(1h)", "code": "-- InfluxQL\nSELECT mean(usage_user) FROM cpu\nWHERE host = 'db-01' AND time >= '2026-09-18T13:00:00+08:00' AND time < '2026-09-18T15:00:00+08:00'\nGROUP BY time(1h)"}, {"label": "B: Flux aggregateWindow(every: 1h)", "code": "// Flux\nfrom(bucket: \"metrics\")\n  |> range(start: 2026-09-18T13:00:00+08:00, stop: 2026-09-18T15:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\" and r.host == \"db-01\")\n  |> aggregateWindow(every: 1h, fn: mean)\n  |> keep(columns: [\"_time\", \"_value\"])"}], "results": [[{"cmd": "cpu", "table": {"columns": ["time", "mean"], "rows": [["2026-09-18 13:00:00", 37.2308], ["2026-09-18 14:00:00", 76.4702]], "total": 2}}], [{"cmd": "table 0", "table": {"columns"
