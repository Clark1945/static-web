6-09-01T00:00:00+08:00\"), $lt: ISODate(\"2026-10-01T00:00:00+08:00\") } })\n"}], "results": [[{"cmd": "db.orders.countDocuments({ orderDate: { $gte: ISODate(\"2026-09-01\"), $lt: ISODate(\"2026-10-01\") } })", "text": "2889"}], [{"cmd": "db.orders.countDocuments({ orderDate: { $gte: ISODate(\"2026-09-01T00:00:00+08:00\"), $lt: ISODate(\"2026-10-01T00:00:00+08:00\") } })", "text": "2919"}]]}, {"id": "update-one-only", "title": "updateOne updates only one", "question": "There are 300-odd pending orders. How many documents does A's updateOne update?", "options": ["One", "Every pending order"], "answer": 0, "explanation": "updateOne, deleteOne and replaceOne only handle the \"first\" matching document, and which one is first isn't guaranteed.\nUse updateMany or deleteMany to handle them all. matchedCount and modifiedCount in the return value tell you how many were affected.\n", "setup": null, "scripts": [{"label": "A: updateOne", "code": "db.orders.updateOne({ status: \"pending\" }, { $set: { status: \"paid\" } })\ndb.orders.countDocuments({ status: \"pending\" })\n"}, {"label": "B: updateMany", "code": "db.orders.updateMany({ status: \"pending\" }, { $set: { status: \"paid\" } })\ndb.orders.countDocuments({ status: \"pending\" })\n"}], "results": [[{"cmd": "db.orders.updateOne({ status: \"pending\" }, { $set: { status: \"paid\" } })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}, {"cmd": "db.orders.countDocuments({ status: \"pending\" })", "text": "328"}], [{"cmd": "db.orders.updateMany({ status: \"pending\" }, { $set: { status: \"paid\" } })", "text": "{\n  acknowledged: true,\n  matchedCount: 329,\n  modifiedCount: 329,\n  upsertedId: null\n}"}, {"cmd": "db.orders.countDocuments({ status: \"pending\" })", "text": "0"}]]}], "steps": [{"id": "collscan", "title": "No index: COLLSCAN", "goal": "orders has only the _id index. Query customer 4242's orders, newest first.\n", "question": "How many documents are returned? How many did MongoDB look at to find them (docsExamined)?", "takeaway": "COLLSCAN = scan the whole collection from start to end, like PostgreSQL's Seq Scan.\nThe three most important numbers in explain: nReturned (documents returned), totalKeysExamined (index entries looked at), totalDocsExamined (documents read).\nIdeally the three are about equal; docsExamined far larger than nReturned means an index is missing.\nThe plan also has a SORT: no index provides the order, so it sorts in memory (which fails above 100 MB unless disk use is allowed).\n", "setup": [], "queries": [{"label": "Customer 4242's orders", "code": "db.orders.find({ customerId: 4242 }).sort({ orderDate: -1 })"}]}, {"id": "single-field", "title": "Single-field index: IXSCAN, but still a sort", "goal": "Create an index on customerId and run the same query again.\n", "question": "What does the plan become? How many documents are examined now? Is there still a SORT?", "takeaway": "It becomes IXSCAN → FETCH: find the matching positions in the index, then read the documents. docsExamined drops from 80,000 to the same as nReturned.\nBut there's still a SORT: this index is ordered only by customerId, and one customer's orders aren't ordered by time.\n", "setup": ["db.orders.createIndex({ customerId: 1 })"], "queries": [{"label": "Customer 4242's orders", "code": "db.orders.find({ customerId: 4242 }).sort({ orderDate: -1 })"}]}, {"id": "compound", "title": "A compound index removes the sort too", "goal": "Create the compound index { customerId: 1, orderDate: -1 } (you can drop customerId_1 from the previous step to see it more clearly).\n", "question": "Is the SORT still there?", "takeaway": "The compound index is ordered by customerId, then orderDate; once 4242 is found the data is already in time order, so the SORT disappears.\nSort direction: a single-field index works either way; a compound index works only when \"all the same direction\" or \"all reversed\". { customerId: 1, orderDate: -1 } supports\nsort({ customerId: 1, orderDate: -1 }) and sort({ customerId: -1, orderDate: 1 }), but not sort({ customerId: 1, orderDate: 1 }).\n", "setup": ["db.orders.dropIndex(\"customerId_1\")", "db.orders.createIndex({ customerId: 1, orderDate: -1 })"], "queries": [{"label": "Customer 4242's orders", "code": "db.orders.find({ customerId: 4242 }).sort({ orderDate: -1 })"}]}, {"id": "esr", "title": "★ The ESR rule: Equality, Sort, Range", "goal": "Query delivered orders of at least 50,000, newest first, taking the newest 10 (a typical paginated query). The query has three kinds of conditions:\nEquality on status, Range on total, Sort on orderDate.\nCreate two indexes with the fields in different orders, force each with hint, and compare.\n", "question": "Which of A and B has a SORT? How many index entries does each examine (keysExamined)? Which one does the optimizer choose?", "takeaway": "★ The ESR rule (MongoDB's recommended field order for compound indexes): Equality → Sort → Range.\nA (E-R-S): after the range, orderDate is no longer in order, so it must find \"all\" documents in the range (about 5,000) and sort them to know which are the newest 10.\nB (E-S-R): after the equality, the data is already in time order; it reads from the newest down, filtering by total, and stops once it has 10. It looks at only a hundred-odd index entries, with no SORT.\nThe looser the range, the bigger the gap (try changing 50000 to 1000).\nBut without a limit and with a very selective range, A can be faster, because it jumps straight into the range and examines the fewest entries.\nSo ESR is \"a good default\", especially for pagination and sorted queries; when unsure, compare with explain. The same reasoning applies to PostgreSQL's composite indexes.\n", "setup": ["db.orders.createIndex({ status: 1, total: 1, orderDate: -1 }, { name: \"idx_ERS\" })", "db.orders.createIndex({ status: 1, orderDate: -1, total: 1 }, { name: \"idx_ESR\" })"], "queries": [{"label": "A: index order E-R-S", "code": "db.orders.find({ status: \"delivered\", total: { $gte: 50000 } }).sort({ orderDate: -1 }).limit(10).hint(\"idx_ERS\")"}, {"label": "B: index order E-S-R", "code": "db.orders.find({ status: \"delivered\", total: { $gte: 50000 } }).sort({ orderDate: -1 }).limit(10).hint(\"idx_ESR\")"}, {"label": "C: no hint, let the optimizer choose", "code": "db.orders.find({ status: \"delivered\", total: { $gte: 50000 } }).sort({ orderDate: -1 }).limit(10)"}]}, {"id": "multikey", "title": "Indexing an array field: multikey index", "goal": "Query the orders that bought product 540. items is an array; create an index on items.productId.\n", "question": "How different is docsExamined before and after the index? What is isMultiKey in explain?", "takeaway": "An index on an array field is a multikey index: every array element gets its own index entry, so an order with 4 items has 4 entries.\nLimits: a compound index can contain at most one array field, and large arrays make large indexes.\n", "setup": ["db.orders.createIndex({ \"items.productId\": 1 })"], "queries": [{"label": "Orders that bought product 540", "code": "db.orders.find({ \"items.productId\": 540 })"}]}, {"id": "covered", "title": "Covered query: no documents read at all", "goal": "Make sure the { customerId: 1, orderDate: -1 } index exists (step 3). Compare \"only fields in the index\" with \"one extra field\".\n", "question": "What is A's docsExamined? Is there a FETCH in the plan?", "takeaway": "Every field A needs is in the index, so it's returned straight from the index: a covered query, with docsExamined = 0 and no FETCH.\n★ You must write _id: 0, because _id isn't in this index and is returned by default.\nB also wants total, so it has to go back and read the documents. Compare PostgreSQL's Index Only Scan.\n", "setup": ["db.orders.createIndex({ customerId: 1, orderDate: -1 })"], "queries": [{"label": "A: only customerId, orderDate (excluding _id)", "code": "db.orders.find({ customerId: 4242 }, { _id: 0, customerId: 1, orderDate: 1 })"}, {"label": "B: plus total", "code": "db.orders.find({ customerId: 4242 }, { _id: 0, customerId: 1, orderDate: 1, total: 1 })"}]}]}, {"id": "cassandra", "name": "Cassandra", "lang": "cql", "labName": "Table design lab", "labNote": "Every query runs with TRACING on, comparing the read path (single partition, range scan, SAI index) and how many rows the server actually read.", "hasResults": true, "exercises": [{"id": "by-order-id", "chapter": "Primary key queries", "title": "Look up an order by its id", "prompt": "Look up order 77621's status (status) and total (total).\n", "hints": ["The primary key of orders is order_id; WHERE order_id = … is a \"single-partition\" read."], "answer": "SELECT status, total FROM orders WHERE order_id = 77621;\n", "explanation": "Cassandra places data on nodes by the hash (token) of the partition key. When WHERE gives the full partition key, the coordinator can go straight to the responsible node,\nreading from one place no matter how many machines the cluster has. This is Cassandra's fastest, and most \"correct\", kind of query.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT status, total FROM orders WHERE order_id = 77621", "table": {"columns": ["status", "total"], "rows": [["cancelled", 1519]], "total": 1}}]}, {"id": "customer-orders", "chapter": "Primary key queries", "title": "A customer's orders (newest first)", "prompt": "List all orders of customer 4242, newest first.\nReturn the four columns order_time, order_id, status and total.\n", "hints": ["orders can't be queried by customer_id (it isn't the primary key); find the table \"stored per customer\".", "orders_by_customer's clustering key is order_time DESC, so the data is already sorted inside the partition; no ORDER BY needed."], "answer": "SELECT order_time, order_id, status, total\nFROM orders_by_customer\nWHERE customer_id = 4242;\n", "explanation": "Rows in one partition are stored together, sorted by the clustering key. The table was created with CLUSTERING ORDER BY (order_time DESC),\nso it reads back newest first with no sorting. This is Cassandra's \"query-first\" design: decide how you'll query first, then design the table's primary key.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_time, order_id, status, total\nFROM orders_by_customer\nWHERE customer_id = 4242", "table": {"columns": ["order_time", "order_id", "status", "total"], "rows": [["2026-03-06T23:54:08.827Z", 59901, "delivered", 3098], ["2025-07-30T06:01:00.168Z", 42762, "delivered", 7517], ["2025-06-05T16:00:05.487Z", 39226, "returned", 36391], ["2024-03-12T20:25:37.131Z", 16901, "delivered", 4596], ["2024-02-15T13:15:50.591Z", 15943, "delivered", 1647], ["2023-03-26T00:04:57.275Z", 6116, "delivered", 4784]], "total": 6}}]}, {"id": "latest-three", "chapter": "Primary key queries", "title": "The 3 most recent orders", "prompt": "Customer 1's 3 most recent orders, returning order_id and total, newest first.\n", "hints": ["LIMIT works within a partition too, and since the data is already in time order it stops after the 3rd row."], "answer": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 1 LIMIT 3;\n", "explanation": "Because the partition is already sorted by order_time DESC, LIMIT 3 reads just the first 3 rows of the partition, instead of sorting everything first as in SQL.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 1 LIMIT 3", "table": {"columns": ["order_id", "total"], "rows": [[77621, 1519], [75279, 1909], [72474, 21018]], "total": 3}}]}, {"id": "oldest-first", "chapter": "Primary key queries", "title": "Oldest first", "prompt": "Customer 4242's orders, oldest first instead, returning order_time and order_id.\n", "hints": ["ORDER BY can only use clustering keys, and only in the table's defined order or exactly the reverse."], "answer": "SELECT order_time, order_id FROM orders_by_customer\nWHERE customer_id = 4242\nORDER BY order_time ASC;\n", "explanation": "ORDER BY can only name clustering keys: either the same order as the table definition, or fully reversed (reading the partition backwards).\nORDER BY order_time ASC reverses the whole clustering order, so order_id is reversed too. Sorting by total isn't possible; sort in the application, or create another table with total as the clustering key.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_time, order_id FROM orders_by_customer\nWHERE customer_id = 4242\nORDER BY order_time ASC", "table": {"columns": ["order_time", "order_id"], "rows": [["2023-03-26T00:04:57.275Z", 6116], ["2024-02-15T13:15:50.591Z", 15943], ["2024-03-12T20:25:37.131Z", 16901], ["2025-06-05T16:00:05.487Z", 39226], ["2025-07-30T06:01:00.168Z", 42762], ["2026-03-06T23:54:08.827Z", 59901]], "total": 6}}]}, {"id": "year-count", "chapter": "Primary key queries", "title": "Orders in one year", "prompt": "How many orders did customer 1 place in 2025 (Taiwan time)? Return a single number.\n", "hints": ["Use equality on the partition key; the clustering key order_time can take a range.", "Add the time zone to the time strings, e.g. '2025-01-01 00:00:00+0800', so the server's time zone doesn't matter."], "answer": "SELECT COUNT(*) FROM orders_by_customer\nWHERE customer_id = 1\n  AND order_time >= '2025-01-01 00:00:00+0800'\n  AND order_time <  '2026-01-01 00:00:00+0800';\n", "explanation": "Equality on the partition key + a range on the clustering key is the most typical Cassandra query: find the partition, then slice a section out of the sorted data.\nCOUNT(*) within a single partition is cheap; COUNT(*) without the partition key scans the whole table (shown in the traps).\nWithout a time zone, Cassandra interprets time strings in the server's time zone. This container happens to be Asia/Taipei, but another machine could give a different result, so spell it out.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT COUNT(*) FROM orders_by_customer\nWHERE customer_id = 1\n  AND order_time >= '2025-01-01 00:00:00+0800'\n  AND order_time <  '2026-01-01 00:00:00+0800'", "table": {"columns": ["count"], "rows": [[24]], "total": 1}}]}, {"id": "login-by-email", "chapter": "Primary key queries", "title": "Log in by email", "prompt": "Look up the customer id (customer_id) and name (name) for the email 'user04242@example.com'.\n", "hints": ["The primary key of customers is customer_id; querying by email needs another table."], "answer": "SELECT customer_id, name FROM customers_by_email WHERE email = 'user04242@example.com';\n", "explanation": "The same customer data is stored twice with different partition keys (customers, customers_by_email), so every kind of lookup is a single-partition read.\nThe cost is two writes, and an email change must update both tables (usually with a logged BATCH to make sure both writes eventually succeed).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT customer_id, name FROM customers_by_email WHERE email = 'user04242@example.com'", "table": {"columns": ["customer_id", "name"], "rows": [[4242, "蘇建恩"]], "total": 1}}]}, {"id": "multi-get", "chapter": "Primary key queries", "title": "Look up several products at once", "prompt": "Look up product_id, name and price for products 540, 541 and 542 in one query. Any order.\n", "hints": ["The partition key can use IN."], "answer": "SELECT product_id, name, price FROM products WHERE product_id IN (540, 541, 542);\n", "explanation": "With IN on the partition key, the coordinator must fetch each partition separately (possibly on different nodes); with many values, the coordinator is under a lot of pressure.\nA few to a few dozen are fine in practice; beyond that, sending several single-partition queries in parallel from the application is usually faster and more stable.\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "SELECT product_id, name, price FROM products WHERE product_id IN (540, 541, 542)", "table": {"columns": ["product_id", "name", "price"], "rows": [[540, "Sony 手機 I447", 29949], [541, "MAC 彩妝 M983", 309], [542, "Coleman 露營用品 C299", 3069]], "total": 3}}]}, {"id": "category-top", "chapter": "Clustering keys and time buckets", "title": "The 5 most expensive in a category", "prompt": "The 5 most expensive products in the 「手機」 (phones) category, returning name and price, highest price first.\n", "hints": ["products_by_category's partition key is category and its clustering key is price DESC."], "answer": "SELECT name, price FROM products_by_category WHERE category = '手機' LIMIT 5;\n", "explanation": "The clustering key (price DESC, product_id) keeps the products in a partition sorted by price, highest first;\nproduct_id is in the clustering key too so that \"two products with the same price\" have different primary keys and don't overwrite each other.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT name, price FROM products_by_category WHERE category = '手機' LIMIT 5", "table": {"columns": ["name", "price"], "rows": [["Sony 手機 I447", 29949], ["小米 手機 O256", 28769], ["ASUS 手機 H620", 28659], ["Samsung 手機 D707", 28649], ["Apple 手機 Q137", 28229]], "total": 5}}]}, {"id": "price-range", "chapter": "Clustering keys and time buckets", "title": "A price range", "prompt": "In the 「筆電」 (laptops) category, products priced between 20,000 and 30,000 (inclusive),\nreturning product_id, name and price, lowest price first.\n", "hints": ["Clustering keys can be sliced with >= and <=.", "Lowest first is the reverse of the table's order, so write ORDER BY."], "answer": "SELECT product_id, name, price FROM products_by_category\nWHERE category = '筆電' AND price >= 20000 AND price <= 30000\nORDER BY price ASC;\n", "explanation": "Range conditions can only go on clustering keys, and in clustering key order: price must be restricted before product_id can be.\nORDER BY price ASC reads the partition backwards, with no extra sort.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT product_id, name, price FROM products_by_category\nWHERE category = '筆電' AND price >= 20000 AND price <= 30000\nORDER BY price ASC", "table": {"columns": ["product_id", "name", "price"], "rows": [[417, "MSI 筆電 F301", 20539], [551, "Lenovo 筆電 O625", 21209], [1053, "ASUS 筆電 C956", 21579], [1268, "Lenovo 筆電 J333", 22209], [619, "Lenovo 筆電 U495", 22939], [1086, "MSI 筆電 Z112", 23229], [113, "Apple 筆電 Q541", 24549], [555, "Lenovo 筆電 I383", 24879], [1306, "Lenovo 筆電 Q986", 27049], [1065, "MSI 筆電 E394", 27209]], "total": 13}}]}, {"id": "day-count", "chapter": "Clustering keys and time buckets", "title": "Orders on one day", "prompt": "How many orders were there on 2026-09-01 (Taiwan time)? Return a single number.\n", "hints": ["orders_by_day has one partition per day; order_day is the date in Taiwan time."], "answer": "SELECT COUNT(*) FROM orders_by_day WHERE order_day = '2026-09-01';\n", "explanation": "This is called \"time bucketing\": if the partition key were just \"all orders\" or \"the year\", partitions would grow without limit;\nwith the date as partition key, each partition has a bounded size (tens to hundreds of orders a day), and a time range query reads just those days' partitions.\nThe bucket size depends on the write volume: very write-heavy systems may use hours, or even split further with (date, a hash from 0–9).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT COUNT(*) FROM orders_by_day WHERE order_day = '2026-09-01'", "table": {"columns": ["count"], "rows": [[87]], "total": 1}}]}, {"id": "week-by-day", "chapter": "Clustering keys and time buckets", "title": "Orders per day for a week", "prompt": "How many orders were there on each day from 2026-09-01 to 2026-09-07 (Taiwan time)?\nReturn order_day and the count, earliest date first.\n", "hints": ["The partition key can list the 7 days with IN.", "GROUP BY can only use primary key columns; here, the partition key order_day."], "answer": "SELECT order_day, COUNT(*) FROM orders_by_day\nWHERE order_day IN ('2026-09-01', '2026-09-02', '2026-09-03', '2026-09-04',\n                    '2026-09-05', '2026-09-06', '2026-09-07')\nGROUP BY order_day;\n", "explanation": "GROUP BY can only use primary key columns, in primary key order (partition key → a prefix of the clustering keys).\nYou'll see the warning \"Aggregation query used on multiple partition keys\": IN spans several partitions, and the coordinator has to read them all back and aggregate.\nSeven days is fine; large reports usually use a tool like Spark, or accumulate separately at write time (e.g. a counter table).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_day, COUNT(*) FROM orders_by_day\nWHERE order_day IN ('2026-09-01', '2026-09-02', '2026-09-03', '2026-09-04',\n                    '2026-09-05', '2026-09-06', '2026-09-07')\nGROUP BY order_day", "table": {"columns": ["order_day", "count"], "rows": [["2026-09-01", 87], ["2026-09-02", 102], ["2026-09-03", 95], ["2026-09-04", 87], ["2026-09-05", 98], ["2026-09-06", 82], ["2026-09-07", 90]], "total": 7}, "warn": ["Aggregation query used on multiple partition keys (IN restriction)"]}]}, {"id": "evening-orders", "chapter": "Clustering keys and time buckets", "title": "Orders on one evening", "prompt": "Orders on 2026-09-01 from 8 p.m. to 10 p.m. (Taiwan time, including 8 p.m., excluding 10 p.m.),\nreturning order_time, order_id and total, earliest first.\n", "hints": ["First select the day with the partition key, then slice a range with the clustering key order_time."], "answer": "SELECT order_time, order_id, total FROM orders_by_day\nWHERE order_day = '2026-09-01'\n  AND order_time >= '2026-09-01 20:00:00+0800'\n  AND order_time <  '2026-09-01 22:00:00+0800';\n", "explanation": "orders_by_day's clustering key order_time uses the default ASC, so it reads back earliest first.\nThe times returned are UTC (2026-09-01T12:00:00Z is 8 p.m. Taiwan time); Cassandra always stores timestamps in UTC.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_time, order_id, total FROM orders_by_day\nWHERE order_day = '2026-09-01'\n  AND order_time >= '2026-09-01 20:00:00+0800'\n  AND order_time <  '2026-09-01 22:00:00+0800'", "table": {"columns": ["order_time", "order_id", "total"], "rows": [["2026-09-01T12:27:40.014Z", 77153, 3207], ["2026-09-01T12:37:18.848Z", 77154, 34664], ["2026-09-01T13:08:33.180Z", 77155, 539], ["2026-09-01T13:21:05.119Z", 77156, 4158], ["2026-09-01T13:24:10.128Z", 77157, 4746], ["2026-09-01T13:27:39.826Z", 77158, 4644]], "total": 6}}]}, {"id": "first-of-each-day", "chapter": "Clustering keys and time buckets", "title": "The first order of each day", "prompt": "For 2026-09-01, 09-02 and 09-03, the earliest order of each day,\nreturning order_day, order_time and order_id.\n", "hints": ["LIMIT caps the whole result; there's a syntax that caps rows \"per partition\"."], "answer": "SELECT order_day, order_time, order_id FROM orders_by_day\nWHERE order_day IN ('2026-09-01', '2026-09-02', '2026-09-03')\nPER PARTITION LIMIT 1;\n", "explanation": "PER PARTITION LIMIT n returns only the first n rows of each partition (in clustering order); it's Cassandra's \"top n per group\".\nIn SQL you'd need ROW_NUMBER() OVER (PARTITION BY …).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_day, order_time, order_id FROM orders_by_day\nWHERE order_day IN ('2026-09-01', '2026-09-02', '2026-09-03')\nPER PARTITION LIMIT 1", "table": {"columns": ["order_day", "order_time", "order_id"], "rows": [["2026-09-01", "2026-08-31T16:02:36.344Z", 77082], ["2026-09-02", "2026-09-01T16:21:32.455Z", 77169], ["2026-09-03", "2026-09-02T16:14:54.562Z", 77271]], "total": 3}}]}, {"id": "latest-buyers", "chapter": "Clustering keys and time buckets", "title": "Who recently bought this product", "prompt": "The 5 most recent purchases of product 540, returning customer_id and order_time, newest first.\n", "hints": ["Order items are stored a second time, per product."], "answer": "SELECT customer_id, order_time FROM items_by_product WHERE product_id = 540 LIMIT 5;\n", "explanation": "The same item is stored in two places: orders (per order) and items_by_product (per product).\nWrites are cheap in Cassandra and cross-partition reads are expensive, so \"write several copies so every query reads one partition\" is the norm.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT customer_id, order_time FROM items_by_product WHERE product_id = 540 LIMIT 5", "table": {"columns": ["customer_id", "order_time"], "rows": [[9323, "2026-09-10T15:16:18.484Z"], [14300, "2026-09-07T13:01:08.203Z"], [873, "2026-08-16T17:17:27.003Z"], [1421, "2026-08-07T20:29:41.004Z"], [1746, "2026-08-02T13:08:22.507Z"]], "total": 5}}]}, {"id": "filter-in-partition", "chapter": "Clustering keys and time buckets", "title": "Filtering within a partition", "prompt": "Among customer 4242's orders, which have status returned? Return order_id and total.\n", "hints": ["status isn't part of the primary key, so filtering on it directly is rejected.", "The query is already restricted to a single partition, so the cost of filtering depends only on that partition's size."], "answer": "SELECT order_id, total FROM orders_by_customer\nWHERE customer_id = 4242 AND status = 'returned'\nALLOW FILTERING;\n", "explanation": "ALLOW FILTERING isn't bad in itself; what's bad is ALLOW FILTERING \"without restricting the partition\", which scans the whole table.\nWith the partition key restricted, it only filters row by row within one partition (this customer's few orders), which is cheap.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_id, total FROM orders_by_customer\nWHERE customer_id = 4242 AND status = 'returned'\nALLOW FILTERING", "table": {"columns": ["order_id", "total"], "rows": [[39226, 36391]], "total": 1}}]}, {"id": "distinct-partitions", "chapter": "Clustering keys and time buckets", "title": "List every category", "prompt": "Which categories are in products_by_category? One row per category, returning only category. Any order.\n", "hints": ["DISTINCT can only be used on partition keys."], "answer": "SELECT DISTINCT category FROM products_by_category;\n", "explanation": "DISTINCT works only on partition keys (and static columns); it reads only the head of each partition, not its rows.\nBut it still walks every partition, so with many partitions it's still a full table scan. The order follows the partition key's token (hash), so it looks random.\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "SELECT DISTINCT category FROM products_by_category", "table": {"columns": ["category"], "rows": [["運動鞋"], ["有線耳機"], ["彩妝"], ["飲料"], ["筆電"], ["保養"], ["廚房用品"], ["收納"], ["男裝"], ["女裝"]], "total": 19}}]}, {"id": "collections", "chapter": "Collections and functions", "title": "set and map", "prompt": "Look up product 540's tags (a set) and the value of the key color in specs. Return two columns.\n", "hints": ["A single map value can be read with column['key']."], "answer": "SELECT tags, specs['color'] FROM products WHERE product_id = 540;\n", "explanation": "set, list and map suit \"small amounts of data read together with the row\" (a few dozen elements at most).\nA non-frozen collection can update individual elements; a frozen one (e.g. each element of orders.items, a list<frozen<order_item>>) can only be replaced as a whole.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT tags, specs['color'] FROM products WHERE product_id = 540", "table": {"columns": ["tags", "specs['color']"], "rows": [["['特價']", "白"]], "total": 1}}]}, {"id": "avg-decimal", "chapter": "Collections and functions", "title": "Average order value", "prompt": "For customer 4242: the number of orders, the total amount, the average amount (with decimals) and the largest amount. Return 4 numbers.\n", "hints": ["Aggregate functions: COUNT, SUM, AVG, MIN, MAX.", "total is an int, and AVG(int) is also an int (the fraction is dropped)."], "answer": "SELECT COUNT(*), SUM(total), AVG(CAST(total AS double)), MAX(total)\nFROM orders_by_customer WHERE customer_id = 4242;\n", "explanation": "CQL's AVG returns the same type as the column: the average of an int column drops the fraction (9672.17 becomes 9672).\nFor decimals, CAST to double or decimal first. Aggregates are also recommended only within a single partition.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT COUNT(*), SUM(total), AVG(CAST(total AS double)), MAX(total)\nFROM orders_by_customer WHERE customer_id = 4242", "table": {"columns": ["count", "system.sum(total)", "system.avg(cast(total as double))", "system.max(total)"], "rows": [[6, 58033, 9672.166666666666, 36391]], "total": 1}}]}, {"id": "writetime", "chapter": "Collections and functions", "title": "Write time", "prompt": "Look up customer 4242's name, and that column's write time WRITETIME (in microseconds). Return two columns.\n", "hints": ["WRITETIME(column) returns the timestamp of the column's last write."], "answer": "SELECT name, WRITETIME(name) FROM customers WHERE customer_id = 4242;\n", "explanation": "Every column value (cell) in Cassandra carries its own write timestamp and TTL. When a column is written several times, the largest timestamp wins (last write wins),\nwhich is why Cassandra needs no locks and can merge data across replicas. Primary key columns have no WRITETIME.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT name, WRITETIME(name) FROM customers WHERE customer_id = 4242", "table": {"columns": ["name", "writetime(name)"], "rows": [["蘇建恩", 1791299097900541]], "total": 1}}]}, {"id": "batch-two-tables", "chapter": "Writes", "title": "Write a new customer into two tables", "prompt": "Add a customer: customer_id 99999, name '測試會員', email 'test99999@example.com',\nsignup_date '2026-10-06', vip_level 'normal'.\nThe customer must be written to both customers and customers_by_email (email, customer_id, name).\n", "hints": ["Both tables must be written, and both writes must be guaranteed to succeed eventually.", "BEGIN BATCH … APPLY BATCH wraps several statements together."], "answer": "BEGIN BATCH\n  INSERT INTO customers (customer_id, name, email, signup_date, vip_level)\n  VALUES (99999, '測試會員', 'test99999@example.com', '2026-10-06', 'normal');\n  INSERT INTO customers_by_email (email, customer_id, name)\n  VALUES ('test99999@example.com', 99999, '測試會員');\nAPPLY BATCH;\n", "explanation": "A logged BATCH (the default) first writes the whole batch to the batchlog, guaranteeing \"everything is eventually applied\"; it keeps denormalized tables consistent.\nIt isn't a transaction: there's no isolation, others may read a half-written state, and there's no ROLLBACK.\nBATCH isn't for speed either: a batch spanning many partitions actually slows the coordinator down.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "BEGIN BATCH\n  INSERT INTO customers (customer_id, name, email, signup_date, vip_level)\n  VALUES (99999, '測試會員', 'test99999@example.com', '2026-10-06', 'normal');\nINSERT INTO customers_by_email (email, customer_id, name)\n  VALUES ('test99999@example.com', 99999, '測試會員');\nAPPLY BATCH", "text": "Done (no rows returned)"}], "checks": [{"cmd": "SELECT customer_id, name, email, signup_date, vip_level, city FROM customers WHERE customer_id = 99999", "table": {"columns": ["customer_id", "name", "email", "signup_date", "vip_level", "city"], "rows": [[99999, "測試會員", "test99999@example.com", "2026-10-06", "normal", null]], "total": 1}}, {"cmd": "SELECT email, customer_id, name FROM customers_by_email WHERE email = 'test99999@example.com'", "table": {"columns": ["email", "customer_id", "name"], "rows": [["test99999@example.com", 99999, "測試會員"]], "total": 1}}]}, {"id": "update-set", "chapter": "Writes", "title": "Change stock and add a tag", "prompt": "Product 540 sold out: set its stock (stock) to 0 and add '缺貨' (out of stock) to tags (keeping the existing tags).\n", "hints": ["Add elements to a set with tags = tags + {'…'}."], "answer": "UPDATE products SET stock = 0, tags = tags + {'缺貨'} WHERE product_id = 540;\n", "explanation": "tags = tags + {…} writes only the new element, with no need to read the whole set first. Writing tags = {'缺貨'} would replace the whole set,\nso the existing 「特價」 tag would be gone, and replacing it whole also creates a tombstone.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UPDATE products SET stock = 0, tags = tags + {'缺貨'} WHERE product_id = 540", "text": "Done (no rows returned)"}], "checks": [{"cmd": "SELECT product_id, stock, tags FROM products WHERE product_id = 540", "table": {"columns": ["product_id", "stock", "tags"], "rows": [[540, 0, "['特價', '缺貨']"]], "total": 1}}]}, {"id": "map-update", "chapter": "Writes", "title": "Change one key of a map", "prompt": "For product 540's specs: change color to '黑' (black) and remove the key '5g', leaving the other specs unchanged.\n", "hints": ["A map key can be set with SET specs['key'] = value.", "Remove a key with DELETE specs['key'] FROM …, or SET specs = specs - {'key'}."], "answer": "UPDATE products SET specs['color'] = '黑' WHERE product_id = 540;\nDELETE specs['5g'] FROM products WHERE product_id = 540;\n", "explanation": "In a non-frozen map every key is a separate cell that can be updated or deleted on its own, without reading the whole map and writing it back.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UPDATE products SET specs['color'] = '黑' WHERE product_id = 540", "text": "Done (no rows returned)"}, {"cmd": "DELETE specs['5g'] FROM products WHERE product_id = 540", "text": "Done (no rows returned)"}], "checks": [{"cmd": "SELECT specs FROM products WHERE product_id = 540", "table": {"columns": ["specs"], "rows": [["{color: '黑', screen_inch: '6.3', storage_gb: '128', warranty.type: '原廠', warranty.years: '2'}"]], "total": 1}}]}, {"id": "counter", "chapter": "Writes", "title": "Counters", "prompt": "Another order bought 2 units of product 540: add 2 to units and 1 to orders in product_sales.\n", "hints": ["Counters can only be changed with UPDATE … SET column = column + n."], "answer": "UPDATE product_sales SET units = units + 2, orders = orders + 1 WHERE product_id = 540;\n", "explanation": "A counter is a distributed increment/decrement with no read-before-write. But it isn't idempotent: retrying after a write timeout may add twice.\nSo counters suit statistics (views, units sold), not amounts or stock that must be exact.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UPDATE product_sales SET units = units + 2, orders = orders + 1 WHERE product_id = 540", "text": "Done (no rows returned)"}], "checks": [{"cmd": "SELECT product_id, units, orders FROM product_sales WHERE product_id = 540", "table": {"columns": ["product_id", "units", "orders"], "rows": [[540, 217, 141]], "total": 1}}]}, {"id": "lwt-insert", "chapter": "Writes", "title": "An email can't be registered twice", "prompt": "Someone tries to register a new customer with the email 'user04242@example.com' (customer_id 99999, name '冒用者', \"impostor\").\nWrite it to customers_by_email, but if the email already exists the original data must not be overwritten.\n", "hints": ["Cassandra's INSERT overwrites by default (upsert) and never reports a duplicate primary key.", "INSERT … IF NOT EXISTS is a lightweight transaction (LWT)."], "answer": "INSERT INTO customers_by_email (email, customer_id, name)\nVALUES ('user04242@example.com', 99999, '冒用者')\nIF NOT EXISTS;\n", "explanation": "IF NOT EXISTS uses Paxos to confirm the primary key doesn't exist yet before writing; the returned [applied] tells you whether it was written,\nand when it wasn't, the current values come back too. The cost is several extra round trips between nodes (about 4 times the latency of a normal write), so use it only where you really need \"check, then write\".\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "INSERT INTO customers_by_email (email, customer_id, name)\nVALUES ('user04242@example.com', 99999, '冒用者')\nIF NOT EXISTS", "table": {"columns": ["[applied]", "email", "customer_id", "name"], "rows": [[false, "user04242@example.com", 4242, "蘇建恩"]], "total": 1}}], "checks": [{"cmd": "SELECT email, customer_id, name FROM customers_by_email WHERE email = 'user04242@example.com'", "table": {"columns": ["email", "customer_id", "name"], "rows": [["user04242@example.com", 4242, "蘇建恩"]], "total": 1}}]}, {"id": "lwt-update", "chapter": "Writes", "title": "Optimistic locking", "prompt": "You want to change product 540's price to 27999, but only if the price is \"still 30000\"\n(you read 30000 earlier, and someone may have changed it since).\n", "hints": ["UPDATE … IF column = value doesn't write when the condition fails."], "answer": "UPDATE products SET price = 27999 WHERE product_id = 540 IF price = 30000;\n", "explanation": "The current price is 29949, so the condition fails: [applied] = false, the price is unchanged, and the returned price column shows the current value.\nThis is compare-and-set (optimistic locking): instead of locking the data, a conditional write detects whether someone changed it first.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UPDATE products SET price = 27999 WHERE product_id = 540 IF price = 30000", "table": {"columns": ["[applied]", "price"], "rows": [[false, 29949]], "total": 1}}], "checks": [{"cmd": "SELECT product_id, price FROM products WHERE product_id = 540", "table": {"columns": ["product_id", "price"], "rows": [[540, 29949]], "total": 1}}]}, {"id": "ttl-update", "chapter": "Writes", "title": "A column that disappears by itself", "prompt": "Customer 4242 joined a promotion: vip_level is temporarily upgraded to 'gold' and expires automatically after 24 hours (86400 seconds).\n", "hints": ["USING TTL seconds, written after UPDATE table."], "answer": "UPDATE customers USING TTL 86400 SET vip_level = 'gold' WHERE customer_id = 4242;\n", "explanation": "The TTL is set on \"the columns written by this write\", not the whole row: when it expires only vip_level disappears (becoming a tombstone), and name and city remain.\nTo expire the whole row, rewrite the whole row with INSERT … USING TTL, or set default_time_to_live when creating the table.\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UPDATE customers USING TTL 86400 SET vip_level = 'gold' WHERE customer_id = 4242", "text": "Done (no rows returned)"}], "checks": [{"cmd": "SELECT customer_id, vip_level, (TTL(vip_level) + 60) / 3600 AS hours_left, city FROM customers WHERE customer_id = 4242", "table": {"columns": ["customer_id", "vip_level", "hours_left", "city"], "rows": [[4242, "gold", 24, "台北市"]], "total": 1}}]}, {"id": "range-delete", "chapter": "Writes", "title": "Delete a time range of data", "prompt": "Customer 1 asks to delete order records from before 2023 (before 2023-01-01 Taiwan time).\nDelete these rows from orders_by_customer with a single CQL statement.\n", "hints": ["DELETE's WHERE can use a range on the clustering key."], "answer": "DELETE FROM orders_by_customer\nWHERE customer_id = 1 AND order_time < '2023-01-01 00:00:00+0800';\n", "explanation": "A range delete writes only \"one\" range tombstone, however many rows are in the range.\nQuerying the 39 rows first and deleting them one by one would create 39 tombstones, which every later read of this partition has to skip (the lab shows the impact of tombstones).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "DELETE FROM orders_by_customer\nWHERE customer_id = 1 AND order_time < '2023-01-01 00:00:00+0800'", "text": "Done (no rows returned)"}], "checks": [{"cmd": "SELECT COUNT(*) FROM orders_by_customer WHERE customer_id = 1", "table": {"columns": ["count"], "rows": [[113]], "total": 1}}, {"cmd": "SELECT order_time, order_id FROM orders_by_customer WHERE customer_id = 1 ORDER BY order_time ASC LIMIT 1", "table": {"columns": ["order_time", "order_id"], "rows": [["2023-01-02T04:21:15.006Z", 4358]], "total": 1}}]}, {"id": "delete-column", "chapter": "Writes", "title": "Delete one column", "prompt": "Customer 4242 asks to delete their birthday: delete only birth_date and keep the other columns.\n", "hints": ["DELETE column FROM table WHERE …"], "answer": "DELETE birth_date FROM customers WHERE customer_id = 4242;\n", "explanation": "In Cassandra, DELETE on a column has the same effect as UPDATE … SET birth_date = null: both write a tombstone.\nThe data doesn't leave the disk right away; it's only purged by compaction after gc_grace_seconds (10 days by default).\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "DELETE birth_date FROM customers WHERE customer_id = 4242", "text": "Done (no rows returned)"}], "checks": [{"cmd": "SELECT customer_id, name, birth_date, city FROM customers WHERE customer_id = 4242", "table": {"columns": ["customer_id", "name", "birth_date", "city"], "rows": [[4242, "蘇建恩", null, "台北市"]], "total": 1}}]}], "traps": [{"id": "insert-is-upsert", "title": "INSERT a primary key that already exists", "question": "customers_by_email already has a row for user04242@example.com (customer_id 4242). What happens if you INSERT the same email again?", "options": ["An error: duplicate primary key", "Success; the existing row is overwritten with 99999", "Success; the same email now has two rows"], "answer": 1, "explanation": "Cassandra doesn't read before writing, so it doesn't know the primary key \"already exists\". INSERT and UPDATE are both upserts: they write a new version, and on read the newer timestamp wins.\nFor \"write only if it doesn't exist\" you need IF NOT EXISTS (a lightweight transaction), at the cost of several round trips between nodes.\nA common interview question: why are Cassandra writes so fast? One reason is exactly this \"no read before write\".\n", "setup": null, "scripts": [{"label": "INSERT the same primary key", "code": "INSERT INTO customers_by_email (email, customer_id, name)\nVALUES ('user04242@example.com', 99999, '冒用者');\nSELECT * FROM customers_by_email WHERE email = 'user04242@example.com';\n"}], "results": [[{"cmd": "INSERT INTO customers_by_email (email, customer_id, name)\nVALUES ('user04242@example.com', 99999, '冒用者')", "text": "Done (no rows returned)"}, {"cmd": "SELECT * FROM customers_by_email WHERE email = 'user04242@example.com'", "table": {"columns": ["email", "customer_id", "name"], "rows": [["user04242@example.com", 99999, "冒用者"]], "total": 1}}]]}, {"id": "update-creates-row", "title": "UPDATE a product that doesn't exist", "question": "products has no product 99999. After UPDATE products SET stock = 5 WHERE product_id = 99999, can you find this product?", "options": ["Yes: there's a new row with only stock set", "No: UPDATE finds no row and affects 0 rows", "An error: the row doesn't exist"], "answer": 0, "explanation": "UPDATE is also an upsert and doesn't check whether the row exists, so it \"grows\" a product row with only stock.\nTo avoid this, write UPDATE … IF EXISTS (a lightweight transaction).\nA subtle difference: INSERT writes a \"row marker\" and UPDATE doesn't, so for a row created by UPDATE, deleting stock makes the whole row disappear.\n", "setup": null, "scripts": [{"label": "UPDATE a primary key that doesn't exist", "code": "UPDATE products SET stock = 5 WHERE product_id = 99999;\nSELECT product_id, name, price, stock FROM products WHERE product_id = 99999;\n"}], "results": [[{"cmd": "UPDATE products SET stock = 5 WHERE product_id = 99999", "text": "Done (no rows returned)"}, {"cmd": "SELECT product_id, name, price, stock FROM products WHERE product_id = 99999", "table": {"columns": ["product_id", "name", "price", "stock"], "rows": [[99999, null, null, 5]], "total": 1}}]]}, {"id": "filter-needs-key", "title": "Querying by a non-key column", "question": "The primary key of orders is order_id. What happens when you query WHERE customer_id = 4242 directly (without ALLOW FILTERING)?", "options": ["Both return 6 rows; the first is just slower", "The first returns 0 rows", "The first is rejected and needs ALLOW FILTERING"], "answer": 2, "explanation": "Without the partition key Cassandra doesn't know which node has the data, so it would have to ask every node and scan the whole table. Rather than silently doing that, it refuses.\nWith ALLOW FILTERING it runs (the lab measures it: 80,000 rows read to get 6).\nThe right fix is a table with customer_id as the partition key (orders_by_customer), or an SAI index for small data.\n", "setup": null, "scripts": [{"label": "orders: customer_id isn't part of the key", "code": "SELECT order_id, total FROM orders WHERE customer_id = 4242;\n"}, {"label": "orders_by_customer: customer_id is the partition key", "code": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 4242;\n"}], "results": [[{"cmd": "SELECT order_id, total FROM orders WHERE customer_id = 4242", "text": "InvalidQueryException：Cannot execute this query as it might involve data filtering and thus may have unpredictable performance. If you want to execute this query despite the performance unpredictability, use ALLOW FILTERING", "error": true}], [{"cmd": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 4242", "table": {"columns": ["order_id", "total"], "rows": [[59901, 3098], [42762, 7517], [39226, 36391], [16901, 4596], [15943, 1647], [6116, 4784]], "total": 6}}]]}, {"id": "order-by-non-clustering", "title": "Sorting by amount", "question": "To see customer 4242's orders by amount, highest first: SELECT … FROM orders_by_customer WHERE customer_id = 4242 ORDER BY total DESC. What happens?", "options": ["An error: ORDER BY can only use clustering keys", "Sorted by amount, highest first", "Success, but the order is unchanged (ORDER BY is ignored)"], "answer": 0, "explanation": "Cassandra doesn't sort at query time; it can only read \"in stored order\" or \"exactly reversed\".\nThe order within a partition is determined by the clustering keys, so ORDER BY can only name clustering keys.\nTo sort by amount: fetch the customer's orders and sort in the application (a partition is usually small), or create another table with total as the clustering key.\n", "setup": null, "scripts": [{"label": "ORDER BY a non-clustering column", "code": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 4242 ORDER BY total DESC;\n"}], "results": [[{"cmd": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 4242 ORDER BY total DESC", "text": "InvalidQueryException：Order by is currently only supported on the clustered columns of the PRIMARY KEY, got total", "error": true}]]}, {"id": "skip-clustering", "title": "Skipping an earlier clustering key", "question": "orders_by_day's primary key is ((order_day), order_time, order_id). With WHERE order_day = '2026-09-01' AND order_id = 77082 (order_time unrestricted), what happens?", "options": ["Order 77082 is returned", "An error: order_time, which comes before order_id, isn't restricted", "0 rows are returned"], "answer": 1, "explanation": "Rows in a partition are sorted by (order_time, order_id), like a phone book sorted by \"last name, first name\": knowing only the \"first name\" doesn't get you to the right page.\nClustering keys can only be restricted from the left; and once an earlier column uses a range (>, <), later columns can't be restricted at all.\nThis is the same idea as the \"leftmost prefix\" of SQL composite indexes.\n", "setup": null, "scripts": [{"label": "Restrict order_id while skipping order_time", "code": "SELECT order_time, order_id FROM orders_by_day\nWHERE order_day = '2026-09-01' AND order_id = 77082;\n"}], "results": [[{"cmd": "SELECT order_time, order_id FROM orders_by_day\nWHERE order_day = '2026-09-01' AND order_id = 77082", "text": "InvalidQueryException：PRIMARY KEY column \"order_id\" cannot be restricted as preceding column \"order_time\" is not restricted", "error": true}]]}, {"id": "count-star", "title": "COUNT(*) over a whole table", "question": "What happens with SELECT COUNT(*) FROM orders (no WHERE)?", "options": ["An error: needs ALLOW FILTERING", "It returns 80000 instantly (Cassandra keeps a row count)", "It returns 80000, but reads the whole table and comes with a warning"], "answer": 2, "explanation": "Cassandra doesn't keep track of \"how many rows a table has\", so COUNT(*) has to actually read every row and count (look at the timing: hundreds of milliseconds vs a few).\nThe server also returns the warning \"Aggregation query used without partition key\". With large data it times out.\nTo know the row count: accumulate it in a counter table at write time, look at the estimate in nodetool tablestats, or use a tool like Spark.\n", "setup": null, "scripts": [{"label": "COUNT(*) without a partition key", "code": "SELECT COUNT(*) FROM orders;\n"}, {"label": "COUNT(*) on a single partition", "code": "SELECT COUNT(*) FROM orders_by_customer WHERE customer_id = 4242;\n"}], "results": [[{"cmd": "SELECT COUNT(*) FROM orders", "table": {"columns": ["count"], "rows": [[80000]], "total": 1}, "warn": ["Aggregation query used without partition key"]}], [{"cmd": "SELECT COUNT(*) FROM orders_by_customer WHERE customer_id = 4242", "table": {"columns": ["count"], "rows": [[6]], "total": 1}}]]}, {"id": "avg-int", "title": "AVG of an int column", "question": "Customer 4242's 6 orders total 58033, an average of 9672.17. What does SELECT AVG(total) (total is an int) return?", "options": ["9672 (the fraction is dropped)", "9672.17", "An error: AVG can't be used on int"], "answer": 0, "explanation": "CQL's AVG returns the same type as its input: the average of ints is an int, with the fraction dropped (PostgreSQL would return numeric).\nFor decimals, CAST to double or decimal first. SUM(int) is an int too and can overflow for large amounts; CAST to bigint / varint first.\n", "setup": null, "scripts": [{"label": "AVG(int)", "code": "SELECT AVG(total) FROM orders_by_customer WHERE customer_id = 4242;\n"}, {"label": "CAST to double first", "code": "SELECT AVG(CAST(total AS double)) FROM orders_by_customer WHERE customer_id = 4242;\n"}], "results": [[{"cmd": "SELECT AVG(total) FROM orders_by_customer WHERE customer_id = 4242", "table": {"columns": ["system.avg(total)"], "rows": [[9672]], "total": 1}}], [{"cmd": "SELECT AVG(CAST(total AS double)) FROM orders_by_customer WHERE customer_id = 4242", "table": {"columns": ["system.avg(cast(total as double))"], "rows": [[9672.166666666666]], "total": 1}}]]}, {"id": "older-timestamp", "title": "Writing with an older timestamp", "question": "First UPDATE products USING TIMESTAMP 1000 SET stock = 999 (timestamp 1000 microseconds, i.e. 1970), then read stock. What is it? The current stock is 11.", "options": ["999: the last statement executed wins", "11: the timestamp is older, so it's treated as a stale write", "An error: the timestamp can't be earlier than the existing data"], "answer": 1, "explanation": "Cassandra decides the winner by \"each cell's timestamp\" (last write wins), not by execution order.\nThe write succeeded, but the read sees two versions, and the one with the newer timestamp, 11, wins; 999 is effectively ignored.\nThe practical consequence: if your application servers' clocks aren't in sync, data written later can \"lose\" to data written earlier.\n", "setup": null, "scripts": [{"label": "Write with a very old timestamp", "code": "UPDATE products USING TIMESTAMP 1000 SET stock = 999 WHERE product_id = 540;\nSELECT stock, WRITETIME(stock) FROM products WHERE product_id = 540;\n"}], "results": [[{"cmd": "UPDATE products USING TIMESTAMP 1000 SET stock = 999 WHERE product_id = 540", "text": "Done (no rows returned)"}, {"cmd": "SELECT stock, WRITETIME(stock) FROM products WHERE product_id = 540", "table": {"columns": ["stock", "writetime(stock)"], "rows": [[11, 1791607978494795]], "total": 1}}]]}, {"id": "ttl-per-cell", "title": "What is the TTL attached to?", "question": "UPDATE customers USING TTL 86400 SET city = '台南市' WHERE customer_id = 4242. What does this customer's data look like a day later?", "options": ["The whole row disappears", "Nothing changes; TTL only works for INSERT", "Only city disappears; the other columns remain"], "answer": 2, "explanation": "A TTL belongs to each cell: only city, written this time, carries the 86400-second TTL; name's TTL is null (never expires).\nWhen the time is up, city becomes a tombstone and the row remains. To expire the whole row, rewrite the whole row with INSERT … USING TTL,\nor set default_time_to_live when creating the table.\n", "setup": null, "scripts": [{"label": "TTL on city only", "code": "UPDATE customers USING TTL 86400 SET city = '台南市' WHERE customer_id = 4242;\nSELECT name, TTL(name), city, TTL(city) FROM customers WHERE customer_id = 4242;\n"}], "results": [[{"cmd": "UPDATE customers USING TTL 86400 SET city = '台南市' WHERE customer_id = 4242", "text": "Done (no rows returned)"}, {"cmd": "SELECT name, TTL(name), city, TTL(city) FROM customers WHERE customer_id = 4242", "table": {"columns": ["name", "ttl(name)", "city", "ttl(city)"], "rows": [["蘇建恩", null, "台南市", 86400]], "total": 1}}]]}, {"id": "null-is-tombstone", "title": "Writing null", "question": "When inserting a customer, the city column is explicitly written as null. How does Cassandra handle it? (Look at tombstone cells in the query trace.)", "options": ["Writing null stores a tombstone", "Both are the same: null is no value, so nothing is stored", "An error: null can't be written"], "answer": 0, "explanation": "In Cassandra, \"setting a column to null\" means \"deleting the column\": it writes a tombstone, which reads have to read and then skip.\nLook at the trace: the null version shows \"Read 1 live rows and 1 tombstone cells\"; the version without city shows 0.\nThis bites especially with ORMs or prepared statements (binding every column, and null for those without a value).\nDriver 4 can leave that parameter unbound (unset), which is how this project loads its data.\n", "setup": null, "scripts": [{"label": "Write city as null", "code": "INSERT INTO customers (customer_id, name, city) VALUES (99999, '測試', null);\nTRACING ON;\nSELECT * FROM customers WHERE customer_id = 99999;\n"}, {"label": "Leave city out (not in the INSERT)", "code": "INSERT INTO customers (customer_id, name) VALUES (99998, '測試');\nTRACING ON;\nSELECT * FROM customers WHERE customer_id = 99998;\n"}], "results": [[{"cmd": "INSERT INTO customers (customer_id, name, city) VALUES (99999, '測試', null)", "text": "Done (no rows returned)"}, {"cmd": "TRACING ON", "text": "Tracing is enabled."}, {"cmd": "SELECT * FROM customers WHERE customer_id = 99999", "table": {"columns": ["customer_id", "birth_date", "city", "email", "gender", "name", "signup_date", "vip_level"], "rows": [[99999, null, null, null, null, "測試", null, null]], "total": 1}}], [{"cmd": "INSERT INTO customers (customer_id, name) VALUES (99998, '測試')", "text": "Done (no rows returned)"}, {"cmd": "TRACING ON", "text": "Tracing is enabled."}, {"cmd": "SELECT * FROM customers WHERE customer_id = 99998", "table": {"columns": ["customer_id", "birth_date", "city", "email", "gender", "name", "signup_date", "vip_level"], "rows": [[99998, null, null, null, null, "測試", null, null]], "total": 1}}]]}, {"id": "counter-insert", "title": "INSERT into a counter table", "question": "product_sales is a counter table. What does INSERT INTO product_sales (product_id, units, orders) VALUES (99999, 1, 1) do?", "options": ["Succeeds, same as UPDATE", "An error: counter tables only accept UPDATE", "Succeeds, but units and orders are both 0"], "answer": 1, "explanation": "A counter can only be incremented or decremented, never set to a value, so no INSERT and no UPDATE … SET units = 5.\nA counter that doesn't exist starts from 0. A counter table can have only counter columns besides the primary key, and no TTL.\n", "setup": null, "scripts": [{"label": "INSERT a counter", "code": "INSERT INTO product_sales (product_id, units, orders) VALUES (99999, 1, 1);\n"}, {"label": "UPDATE a counter", "code": "UPDATE product_sales SET units = units + 1, orders = orders + 1 WHERE product_id = 99999;\nSELECT * FROM product_sales WHERE product_id = 99999;\n"}], "results": [[{"cmd": "INSERT INTO product_sales (product_id, units, orders) VALUES (99999, 1, 1)", "text": "InvalidQueryException：INSERT statements are not allowed on counter tables, use UPDATE instead", "error": true}], [{"cmd": "UPDATE product_sales SET units = units + 1, orders = orders + 1 WHERE product_id = 99999", "text": "Done (no rows returned)"}, {"cmd": "SELECT * FROM product_sales WHERE product_id = 99999", "table": {"columns": ["product_id", "orders", "units"], "rows": [[99999, 1, 1]], "total": 1}}]]}], "steps": [{"id": "partition-key", "title": "With vs without the partition key", "goal": "The same \"customer 4242's orders\", once from a table with customer_id as the partition key and once forced with ALLOW FILTERING.", "question": "Both return 6 rows. Look at the \"rows read\" in the trace: how many rows did B read to get these 6?", "takeaway": "A is \"Executing single-partition query\": it computes the token from the partition key and reads that one partition directly, only 6 rows.\nB is \"Submitting range requests\" + \"seq scan\": it reads all 80,000 rows of the table and throws away the ones that don't match.\nHere there's one node and all the data is in memory, so B takes only a few hundred milliseconds; in production, with data on several machines and hundreds of GB, B would time out and slow down the whole cluster.\nThis is Cassandra's first rule: every query needs the full partition key. To achieve that, the same data is often stored in several tables.\n", "setup": [], "queries": [{"label": "A: orders_by_customer (customer_id is the partition key)", "code": "SELECT order_id, order_time, total FROM orders_by_customer WHERE customer_id = 4242"}, {"label": "B: orders + ALLOW FILTERING", "code": "SELECT order_id, order_time, total FROM orders WHERE customer_id = 4242 ALLOW FILTERING"}]}, {"id": "clustering-slice", "title": "Clustering keys: read only the slice you need", "goal": "Customer 1 has 152 orders (the largest partition). Compare reading the whole partition, LIMIT, and slicing a time range with the clustering key.", "question": "How many rows did B and C each read, compared with A's 152?", "takeaway": "Rows in a partition are stored together sorted by the clustering key, so LIMIT 3 reads only the first 3 rows and a time range reads only that slice, with no need to read the whole partition and filter.\nWhen designing clustering keys, ask: \"which slice do I need most often?\" Newest first (DESC), time ranges and price ranges are typical uses.\n", "setup": [], "queries": [{"label": "A: the whole partition", "code": "SELECT order_id, order_time FROM orders_by_customer WHERE customer_id = 1"}, {"label": "B: the newest 3 (LIMIT 3)", "code": "SELECT order_id, order_time FROM orders_by_customer WHERE customer_id = 1 LIMIT 3"}, {"label": "C: 2025 (a clustering key range)", "code": "SELECT order_id, order_time FROM orders_by_customer\nWHERE customer_id = 1\n  AND order_time >= '2025-01-01 00:00:00+0800'\n  AND order_time <  '2026-01-01 00:00:00+0800'\n"}]}, {"id": "time-bucket", "title": "Time buckets vs time range scans", "goal": "Query \"the orders of 2026-09-01\": either via orders_by_day with one partition per day, or on orders_by_day without the partition key, using only a time range.", "question": "A and B actually read the same number of rows (87). So what's the difference? Look at the \"read path\". How many partitions does C read?", "takeaway": "A is a \"single partition\" read: the token is computed from order_day and that day's partition is found directly.\nB is a \"range scan\": order_time is a clustering key, but clustering keys are only sorted within one partition; without the partition key Cassandra has to walk all 1,728 partitions (one per day),\nslicing the matching section out of each. The rows read are the same, plus the cost of \"walking every partition\".\nWith one node and little data it's only a millisecond or two slower; in a multi-node cluster a range scan has to ask \"every node\", gets slower as data grows, and affects other queries.\nC reads 7 partitions with IN, the right way to query a time span (or send 7 queries in parallel from the application).\nBucket size is a trade-off: partitions that are too big (e.g. a month) become hot spots and read slowly; too small (e.g. a minute) means reading many partitions for a time span.\nA common guideline is under 100 MB and under 100,000 rows per partition.\n", "setup": [], "queries": [{"label": "A: partition key order_day", "code": "SELECT COUNT(*) FROM orders_by_day WHERE order_day = '2026-09-01'"}, {"label": "B: only an order_time range (ALLOW FILTERING)", "code": "SELECT COUNT(*) FROM orders_by_day\nWHERE order_time >= '2026-09-01 00:00:00+0800' AND order_time < '2026-09-02 00:00:00+0800'\nALLOW FILTERING\n"}, {"label": "C: one week (IN over 7 partitions)", "code": "SELECT COUNT(*) FROM orders_by_day\nWHERE order_day IN ('2026-09-01', '2026-09-02', '2026-09-03', '2026-09-04', '2026-09-05', '2026-09-06', '2026-09-07')\n"}]}, {"id": "sai-index", "title": "SAI indexes: query other columns without a new table", "goal": "Cassandra 5.0's SAI (Storage-Attached Index) lets orders be queried by customer_id too. Run it once (it's rejected), then create the index and run it again.", "question": "With the index, how many rows did A read? How does its timing compare with B?", "takeaway": "SAI builds the index alongside each SSTable; a query first finds the matching primary keys in the index and then reads those rows, with no full table scan.\nBut it's still \"a local index on each node\": in a multi-node cluster the coordinator has to ask every node (scatter-gather), which gets more expensive with more nodes.\nSo SAI suits infrequent queries, use together with the partition key, or tables with little data; frequent main queries still deserve a dedicated table (B).\nThe older secondary indexes (2i) and SASI have many limitations; since Cassandra 5.0, SAI is recommended.\n", "setup": ["CREATE INDEX IF NOT EXISTS orders_customer_idx ON orders (customer_id) USING 'sai'"], "queries": [{"label": "A: orders by customer_id (no ALLOW FILTERING)", "code": "SELECT order_id, order_time, total FROM orders WHERE customer_id = 4242"}, {"label": "B: orders_by_customer (for comparison)", "code": "SELECT order_id, order_time, total FROM orders_by_customer WHERE customer_id = 4242"}]}, {"id": "sai-multi", "title": "SAI: collections and multiple conditions", "goal": "The products table has only 1,500 rows, a good fit for SAI. Create indexes on tags and price, and query products \"tagged 熱銷 (best seller) and priced at most 1,000\".", "question": "What happens to these two queries without an index? How many rows does each return once the indexes exist?", "takeaway": "SAI supports collections (CONTAINS / CONTAINS KEY) and ranges (< >), and several SAI conditions can be combined with AND; Cassandra takes the intersection.\nCompare: without indexes the query needs ALLOW FILTERING and is a full table scan.\nA common interview take: \"Cassandra's query flexibility is very low\" has improved since 5.0, but the core principle hasn't changed: main queries rely on table design, and indexes are a supplement.\n", "setup": ["CREATE INDEX IF NOT EXISTS products_tags_idx ON products (tags) USING 'sai'", "CREATE INDEX IF NOT EXISTS products_price_idx ON products (price) USING 'sai'"], "queries": [{"label": "A: tags CONTAINS (an element of a set)", "code": "SELECT product_id, name, price, tags FROM products WHERE tags CONTAINS '熱銷'"}, {"label": "B: tags + a price range (two indexes together)", "code": "SELECT product_id, name, price FROM products WHERE tags CONTAINS '熱銷' AND price < 1000"}]}, {"id": "filter-in-partition", "title": "ALLOW FILTERING isn't always expensive", "goal": "The same filter status = 'returned', once restricted to customer 4242's partition, and once without a partition restriction (with LIMIT 5).", "question": "How many rows did A, B and C each read?", "takeaway": "The cost of ALLOW FILTERING = the number of rows read to find the results.\nA filters within one partition and reads 6 rows; B has no partition key but stops once it has 5, so the rows read depend on how \"dense\" the matching data is; C must scan the whole table.\nSo the point isn't \"never write ALLOW FILTERING\", but knowing how much data it will read.\n", "setup": [], "queries": [{"label": "A: filtering within a partition", "code": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 4242 AND status = 'returned' ALLOW FILTERING"}, {"label": "B: no partition key, but only 5 rows", "code": "SELECT order_id, total FROM orders WHERE status = 'returned' LIMIT 5 ALLOW FILTERING"}, {"label": "C: no partition key, all rows", "code": "SELECT COUNT(*) FROM orders WHERE status = 'returned' ALLOW FILTERING"}]}]}, {"id": "neo4j", "name": "Neo4j", "lang": "cypher", "labName": "PROFILE lab", "labNote": "Every query is prefixed with PROFILE, comparing the first operator of the plan (NodeByLabelScan or IndexSeek) and the total db hits (storage accesses).", "hasResults": true, "exercises": [{"id": "find-customer", "chapter": "Basic MATCH", "title": "Find a customer", "prompt": "Look up customer 4242's name (name) and VIP level (vipLevel).\n", "hints": ["MATCH (var:Label {property: value}) RETURN var.property"], "answer": "MATCH (c:Customer {id: 4242})\nRETURN c.name, c.vipLevel\n", "explanation": "MATCH describes what to find with a \"pattern\": (c:Customer {id: 4242}) is a node labeled Customer with id 4242.\nCustomer.id has a uniqueness constraint (which comes with an index), so this is an index lookup (NodeUniqueIndexSeek), not a scan of every customer.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (c:Customer {id: 4242})\nRETURN c.name, c.vipLevel", "table": {"columns": ["c.name", "c.vipLevel"], "rows": [["蘇建恩", "normal"]], "total": 1}}]}, {"id": "customer-city", "chapter": "Basic MATCH", "title": "Follow one relationship", "prompt": "Which city does customer 4242 live in? Return the city name.\n", "hints": ["The city isn't a property of the customer; it's the node that the (:Customer)-[:LIVES_IN]->(:City) relationship points to."], "answer": "MATCH (:Customer {id: 4242})-[:LIVES_IN]->(city:City)\nRETURN city.name\n", "explanation": "In a graph database, a \"relationship\" is stored, not matched at query time through foreign keys.\nStarting from the customer node, it walks the LIVES_IN relationship straight to the city node (index-free adjacency); the cost depends only on how many relationships this customer has, not on the total number of customers.\nNodes you don't use need no variable name, like (:Customer {id: 4242}) here.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Customer {id: 4242})-[:LIVES_IN]->(city:City)\nRETURN city.name", "table": {"columns": ["city.name"], "rows": [["台北市"]], "total": 1}}]}, {"id": "customer-orders", "chapter": "Basic MATCH", "title": "A customer's orders", "prompt": "List customer 4242's orders: order id and total (total), newest first.\n", "hints": ["(:Customer)-[:PLACED]->(:Order)", "Sort with ORDER BY o.orderDate DESC."], "answer": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order)\nRETURN o.id, o.total\nORDER BY o.orderDate DESC\n", "explanation": "ORDER BY can sort by properties that aren't returned. orderDate is a datetime with a time zone; comparison and sorting use the actual point in time.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order)\nRETURN o.id, o.total\nORDER BY o.orderDate DESC", "table": {"columns": ["o.id", "o.total"], "rows": [[59901, 3098], [42762, 7517], [39226, 36391], [16901, 4596], [15943, 1647], [6116, 4784]], "total": 6}}]}, {"id": "order-items", "chapter": "Basic MATCH", "title": "Properties on relationships", "prompt": "Which products were bought in order 77621? Return the product name and quantity (qty). Any order.\n", "hints": ["The quantity isn't on the product node but on the CONTAINS relationship: -[r:CONTAINS]->"], "answer": "MATCH (:Order {id: 77621})-[r:CONTAINS]->(p:Product)\nRETURN p.name, r.qty\n", "explanation": "Relationships can have properties too. Quantity, unit price and discount describe something \"between this order and this product\", so they live on the relationship,\ncorresponding to the junction table (order_items) in a relational database.\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Order {id: 77621})-[r:CONTAINS]->(p:Product)\nRETURN p.name, r.qty", "table": {"columns": ["p.name", "r.qty"], "rows": [["UNIQLO 男裝 P863", 1]], "total": 1}}]}, {"id": "gold-in-taipei", "chapter": "Basic MATCH", "title": "Combining conditions", "prompt": "How many gold-level customers live in 台北市 (Taipei)? Return a single number.\n", "hints": ["The customer conditions go on one node and the city on another, connected by LIVES_IN."], "answer": "MATCH (c:Customer {vipLevel: 'gold'})-[:LIVES_IN]->(:City {name: '台北市'})\nRETURN count(c)\n", "explanation": "{property: value} in a pattern is an equality condition in WHERE; more complex conditions (ranges, OR, string matching) go in WHERE.\nEquivalent: MATCH (c:Customer)-[:LIVES_IN]->(city:City) WHERE c.vipLevel = 'gold' AND city.name = '台北市'.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (c:Customer {vipLevel: 'gold'})-[:LIVES_IN]->(:City {name: '台北市'})\nRETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[196]], "total": 1}}]}, {"id": "followers", "chapter": "Direction and aggregation", "title": "Follower count (reverse direction)", "prompt": "How many customers follow customer 4242? Return a single number.\n", "hints": ["(a)-[:FOLLOWS]->(b) means a follows b. To find who follows 4242, the arrow must point at 4242."], "answer": "MATCH (:Customer {id: 4242})<-[:FOLLOWS]-(fan:Customer)\nRETURN count(fan)\n", "explanation": "Relationships always have a direction; a query can specify ->, <-, or no direction (-), which counts both ways.\nFollowing is directional: 4242 follows 6 people, but only 4 people follow them.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Customer {id: 4242})<-[:FOLLOWS]-(fan:Customer)\nRETURN count(fan)", "table": {"columns": ["count(fan)"], "rows": [[4]], "total": 1}}]}, {"id": "top-followed", "chapter": "Direction and aggregation", "title": "Customers with the most followers", "prompt": "The 5 customers with the most followers: return customer id, name and follower count, most followers first.\n", "hints": ["Cypher has no GROUP BY: any column in RETURN that isn't an aggregate is a grouping key."], "answer": "MATCH (c:Customer)<-[:FOLLOWS]-(fan:Customer)\nRETURN c.id, c.name, count(fan) AS followers\nORDER BY followers DESC\nLIMIT 5\n", "explanation": "In RETURN c.id, c.name, count(fan), the grouping keys are c.id and c.name (an implicit GROUP BY).\nCustomer 1 has 895 followers, a \"supernode\": traversals through it pass very many relationships, something to watch out for in graph design.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (c:Customer)<-[:FOLLOWS]-(fan:Customer)\nRETURN c.id, c.name, count(fan) AS followers\nORDER BY followers DESC\nLIMIT 5", "table": {"columns": ["c.id", "c.name", "followers"], "rows": [[1, "葉承文", 895], [2, "廖品玲", 248], [3, "楊書君", 138], [4, "高書文", 114], [5, "蔡承翰", 107]], "total": 5}}]}, {"id": "brand-products", "chapter": "Direction and aggregation", "title": "Products per brand", "prompt": "The 5 brands with the most products: return the brand name and product count, highest first, ties by brand name.\n", "hints": ["(:Product)-[:MADE_BY]->(:Brand)"], "answer": "MATCH (b:Brand)<-[:MADE_BY]-(p:Product)\nRETURN b.name, count(p) AS products\nORDER BY products DESC, b.name\nLIMIT 5\n", "explanation": "Adding a second sort key for ties makes the result deterministic; with only ORDER BY products DESC, the order of ties isn't guaranteed.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (b:Brand)<-[:MADE_BY]-(p:Product)\nRETURN b.name, count(p) AS products\nORDER BY products DESC, b.name\nLIMIT 5", "table": {"columns": ["b.name", "products"], "rows": [["IKEA", 69], ["Sony", 59], ["宜得利", 54], ["Adidas", 51], ["Decathlon", 51]], "total": 5}}]}, {"id": "city-revenue", "chapter": "Direction and aggregation", "title": "Revenue per city", "prompt": "For delivered (status = 'delivered') orders in 2026 (Taiwan time), sum total by shipping city,\nand return the top 3 cities by revenue with their revenue.\n", "hints": ["(:Order)-[:SHIPPED_TO]->(:City)", "datetime('2026-01-01T00:00:00+08:00') creates a point in time to compare against."], "answer": "MATCH (o:Order {status: 'delivered'})-[:SHIPPED_TO]->(city:City)\nWHERE o.orderDate >= datetime('2026-01-01T00:00:00+08:00')\nRETURN city.name, sum(o.total) AS revenue\nORDER BY revenue DESC\nLIMIT 3\n", "explanation": "datetime() creates a point in time with a time zone; you can also compare dates with date('2026-01-01') and date(o.orderDate).\nThis kind of \"aggregate the whole table\" report isn't really a graph database's strength (it walks every order); a relational database does it just as well.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (o:Order {status: 'delivered'})-[:SHIPPED_TO]->(city:City)\nWHERE o.orderDate >= datetime('2026-01-01T00:00:00+08:00')\nRETURN city.name, sum(o.total) AS revenue\nORDER BY revenue DESC\nLIMIT 3", "table": {"columns": ["city.name", "revenue"], "rows": [["台北市", 63759988], ["新北市", 34266319], ["台中市", 27197265]], "total": 3}}]}, {"id": "no-orders", "chapter": "Direction and aggregation", "title": "Customers who never ordered", "prompt": "How many customers have never placed an order? Return a single number.\n", "hints": ["WHERE NOT (c)-[:PLACED]->() means \"no such relationship exists\"."], "answer": "MATCH (c:Customer)\nWHERE NOT (c)-[:PLACED]->()\nRETURN count(c)\n", "explanation": "A pattern can be used directly as a condition: it's true if (c)-[:PLACED]->() exists. In Cypher 5 you can also write WHERE NOT EXISTS { (c)-[:PLACED]->() }.\nCompare SQL: LEFT JOIN … WHERE o.id IS NULL, or a NOT EXISTS subquery.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (c:Customer)\nWHERE NOT (c)-[:PLACED]->()\nRETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[1629]], "total": 1}}]}, {"id": "collect-names", "chapter": "Direction and aggregation", "title": "Collect into a list", "prompt": "For the people customer 4242 follows, sorted by customer id ascending, collect their names into \"one list\" (a single row with one column).\n", "hints": ["collect() gathers several rows into one list.", "Sort first, then collect: MATCH … WITH f ORDER BY f.id RETURN collect(f.name)"], "answer": "MATCH (:Customer {id: 4242})-[:FOLLOWS]->(f:Customer)\nWITH f ORDER BY f.id\nRETURN collect(f.name)\n", "explanation": "WITH is like a RETURN in the middle of a query: it passes results to the next part, where you can sort, filter and aggregate.\ncollect() gathers in the order the data flows in, so sort it in WITH first.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Customer {id: 4242})-[:FOLLOWS]->(f:Customer)\nWITH f ORDER BY f.id\nRETURN collect(f.name)", "table": {"columns": ["collect(f.name)"], "rows": [["['邱柏婷', '曾柏樺', '鄭冠廷', '許建萱', '林建廷', '廖宜文']"]], "total": 1}}]}, {"id": "friends-of-friends", "chapter": "Paths and traversal", "title": "Friends of friends", "prompt": "The people followed by the people customer 224 follows, excluding 224 themselves and the people 224 already follows: how many distinct customers?\n", "hints": ["(me)-[:FOLLOWS]->()-[:FOLLOWS]->(fof)", "The same person may be followed by several friends; use count(DISTINCT fof).", "If someone and 224 follow each other, 224 also shows up in the result."], "answer": "MATCH (me:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof:Customer)\nWHERE fof <> me AND NOT (me)-[:FOLLOWS]->(fof)\nRETURN count(DISTINCT fof)\n", "explanation": "This is the basic \"people you may know\", and every condition changes the answer:\nwithout DISTINCT it's 44 (the same person reached via two friends counts twice), with DISTINCT 42, excluding yourself 41, and also excluding people you already follow 40.\nIn a relational database you JOIN the follows table to itself twice; in a graph database it's two steps. The more steps, the bigger the difference (compared in the lab).\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (me:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof:Customer)\nWHERE fof <> me AND NOT (me)-[:FOLLOWS]->(fof)\nRETURN count(DISTINCT fof)", "table": {"columns": ["count(DISTINCT fof)"], "rows": [[40]], "total": 1}}]}, {"id": "reach-in-three", "chapter": "Paths and traversal", "title": "Within three steps", "prompt": "Following the follow direction, how many distinct customers can customer 4242 reach within 1 to 3 steps (excluding 4242 themselves)?\n", "hints": ["Variable-length relationship: -[:FOLLOWS*1..3]->"], "answer": "MATCH (me:Customer {id: 4242})-[:FOLLOWS*1..3]->(x:Customer)\nWHERE x <> me\nRETURN count(DISTINCT x)\n", "explanation": "*1..3 means 1 to 3 relationships. Always give an upper bound: an unbounded * on a large graph can hit millions of paths.\nThe same person may be reachable by several paths, so DISTINCT is needed.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (me:Customer {id: 4242})-[:FOLLOWS*1..3]->(x:Customer)\nWHERE x <> me\nRETURN count(DISTINCT x)", "table": {"columns": ["count(DISTINCT x)"], "rows": [[122]], "total": 1}}]}, {"id": "shortest-path", "chapter": "Paths and traversal", "title": "Shortest path", "prompt": "Following the follow direction, what is the minimum number of steps from customer 4242 to customer 1? Return a single number.\n", "hints": ["shortestPath((a)-[:FOLLOWS*..10]->(b)) finds one shortest path; length(p) is the number of relationships in the path."], "answer": "MATCH p = shortestPath((:Customer {id: 4242})-[:FOLLOWS*..10]->(:Customer {id: 1}))\nRETURN length(p)\n", "explanation": "shortestPath uses a bidirectional breadth-first search and stops when found, without enumerating every path. allShortestPaths returns all paths of the same minimal length.\nThis is \"six degrees of separation\": in a social network most people are only a few steps apart.\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH p = shortestPath((:Customer {id: 4242})-[:FOLLOWS*..10]->(:Customer {id: 1}))\nRETURN length(p)", "table": {"columns": ["length(p)"], "rows": [[4]], "total": 1}}]}, {"id": "category-tree", "chapter": "Paths and traversal", "title": "A whole category subtree", "prompt": "Every category under 「3C電子」 (consumer electronics): subcategories, their subcategories and so on, excluding 3C電子 itself. Return the category names. Any order.\n", "hints": ["(:Category)-[:SUBCATEGORY_OF]->(:Category) points from a subcategory to its parent.", "When you don't know how many levels there are, use *1.. (or a reasonable upper bound)."], "answer": "MATCH (c:Category)-[:SUBCATEGORY_OF*1..]->(:Category {name: '3C電子'})\nRETURN c.name\n", "explanation": "Compare PostgreSQL: you need WITH RECURSIVE to query a whole tree. In a graph database, a variab
