celled\", \"returned\"] } })", "text": "14448"}]}, {"id": "or-condition", "chapter": "クエリ演算子", "title": "東部のゴールド会員", "prompt": "花蓮縣または台東縣に住んでいて、gold レベルの会員。\nname、city（_id を含む）だけを表示し、_id 順に並べます。\n", "hints": ["city: { $in: [...] } でも、$or: [ {…}, {…} ] でも書けます。"], "answer": "db.customers.find({ vipLevel: \"gold\", city: { $in: [\"花蓮縣\", \"台東縣\"] } }, { name: 1, city: 1 }).sort({ _id: 1 })\n", "explanation": "$or は「異なるフィールド」の OR に使います：{ $or: [ { city: \"花蓮縣\" }, { vipLevel: \"gold\" } ] }。\n同じフィールドの OR なら $in で十分です。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.customers.find({ vipLevel: \"gold\", city: { $in: [\"花蓮縣\", \"台東縣\"] } }, { name: 1, city: 1 }).sort({ _id: 1 })", "text": "// 全 59 件（先頭 3 件のみ表示）\n{\n  _id: 14,\n  name: '劉怡傑',\n  city: '台東縣'\n}\n{\n  _id: 15,\n  name: '羅書廷',\n  city: '花蓮縣'\n}\n{\n  _id: 18,\n  name: '何佳誠',\n  city: '台東縣'\n}"}]}, {"id": "exists", "chapter": "クエリ演算子", "title": "誕生日を入力していない会員", "prompt": "birthDate フィールドのない会員は何人ですか？\n", "hints": ["{ birthDate: { $exists: false } }"], "answer": "db.customers.countDocuments({ birthDate: { $exists: false } })\n", "explanation": "ドキュメント型データベースではフィールドが「存在しない」ことがあり、「値が null」とは別物です。\n★ ただし { birthDate: null } は「値が null」と「フィールドがない」の両方のドキュメントを見つけます（落とし穴問題で実演しています）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.customers.countDocuments({ birthDate: { $exists: false } })", "text": "1141"}]}, {"id": "regex", "chapter": "クエリ演算子", "title": "Apple の商品", "prompt": "名称（name）が「Apple」で始まる商品は何件ですか？\n", "hints": ["正規表現を直接書けます：{ name: /^Apple/ }"], "answer": "db.products.countDocuments({ name: /^Apple/ })\n", "explanation": "^ で始まり大文字小文字を区別する正規表現はインデックスを使えます（SQL の LIKE 'Apple%' に相当）。\n/apple/i や /Pro/ のように先頭が固定されていない書き方は全件スキャンになります。全文検索が必要なら text インデックスか Atlas Search を使います。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.countDocuments({ name: /^Apple/ })", "text": "47"}]}, {"id": "array-contains", "chapter": "配列と埋め込みドキュメント", "title": "限定商品は何件か", "prompt": "tags 配列に「限量」（限定）がある商品は何件ですか？\n", "hints": ["{ tags: \"限量\" } と書くだけで、配列の各要素と比較されます。"], "answer": "db.products.countDocuments({ tags: \"限量\" })\n", "explanation": "★ 配列フィールドに等値条件を書くと、「いずれかの要素」が等しければ成立します。わざわざ $in を書く必要はありません。\nただし { tags: [\"限量\"] } は「配列全体が [\"限量\"] と完全に一致」という意味で、まったく別物です（落とし穴問題で実演しています）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.countDocuments({ tags: \"限量\" })", "text": "109"}]}, {"id": "array-all", "chapter": "配列と埋め込みドキュメント", "title": "人気かつ限定（$all）", "prompt": "「熱銷」（人気）と「限量」（限定）の両方のタグが付いた商品。_id だけを表示し、_id 順に並べます。\n", "hints": ["{ tags: { $all: [\"熱銷\", \"限量\"] } }"], "answer": "db.products.find({ tags: { $all: [\"熱銷\", \"限量\"] } }, { _id: 1 }).sort({ _id: 1 })\n", "explanation": "$all：配列が指定した要素をすべて含んでいればよく、順序は問いません。{ tags: [\"熱銷\", \"限量\"] } は配列が「ちょうど」この 2 つで、しかも同じ順序であることを要求します。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.find({ tags: { $all: [\"熱銷\", \"限量\"] } }, { _id: 1 }).sort({ _id: 1 })", "text": "// 全 21 件（先頭 3 件のみ表示）\n{\n  _id: 77\n}\n{\n  _id: 84\n}\n{\n  _id: 100\n}"}]}, {"id": "array-size", "chapter": "配列と埋め込みドキュメント", "title": "タグがちょうど 3 つの商品", "prompt": "tags の要素がちょうど 3 つの商品は何件ですか？\n", "hints": ["{ tags: { $size: 3 } }"], "answer": "db.products.countDocuments({ tags: { $size: 3 } })\n", "explanation": "$size は「ちょうど等しい」しか比較できず、{ $size: { $gt: 2 } } とは書けません。\n大小比較したいなら { \"tags.2\": { $exists: true } }（3 番目の要素が存在 = 3 つ以上）か、$expr と { $size: \"$tags\" } を組み合わせます。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.countDocuments({ tags: { $size: 3 } })", "text": "52"}]}, {"id": "array-dot", "chapter": "配列と埋め込みドキュメント", "title": "商品 540 を買った注文", "prompt": "明細（items）に商品 540 がある注文は何件ですか？\n", "hints": ["{ \"items.productId\": 540 }"], "answer": "db.orders.countDocuments({ \"items.productId\": 540 })\n", "explanation": "ドット記法は配列も通り抜けます：items.productId は items 配列の各要素の productId と比較されます。\nこのフィールドにインデックスを作ると「マルチキーインデックス」（multikey）になり、明細 1 件ごとにインデックス項目が 1 つできます。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.countDocuments({ \"items.productId\": 540 })", "text": "156"}]}, {"id": "elem-match", "chapter": "配列と埋め込みドキュメント", "title": "同じ明細が 2 つの条件を同時に満たす（$elemMatch）", "prompt": "「qty が 3 以上」かつ「unitPrice が 10000 以上」を同時に満たす明細が「1 つ」でもある注文は何件ですか？\n2 つの条件は「同じ」明細で成り立つ必要があります。\n", "hints": ["{ items: { $elemMatch: { qty: { $gte: 3 }, unitPrice: { $gte: 10000 } } } }"], "answer": "db.orders.countDocuments({ items: { $elemMatch: { qty: { $gte: 3 }, unitPrice: { $gte: 10000 } } } })\n", "explanation": "★ 面接頻出：{ \"items.qty\": { $gte: 3 }, \"items.unitPrice\": { $gte: 10000 } } と書くと、\n2 つの条件を「別々の明細」が満たしてもよいことになり（ある明細は安い品を 3 個、別の明細は高い品を 1 個）、結果が多くなります。\n同じ要素が複数の条件を同時に満たすことを求めるなら、必ず $elemMatch を使います。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.countDocuments({ items: { $elemMatch: { qty: { $gte: 3 }, unitPrice: { $gte: 10000 } } } })", "text": "2074"}]}, {"id": "nested-specs", "chapter": "配列と埋め込みドキュメント", "title": "512GB のスマートフォン", "prompt": "仕様 specs.storage_gb が 512 の商品。name（_id を含む）だけを表示し、_id 順に並べます。\n", "hints": ["{ \"specs.storage_gb\": 512 }"], "answer": "db.products.find({ \"specs.storage_gb\": 512 }, { name: 1 }).sort({ _id: 1 })\n", "explanation": "カテゴリごとに specs のフィールドは異なります。これがドキュメント型データベースの「柔軟なスキーマ」の利点で、仕様の種類ごとに列を作る必要がありません。\nPostgreSQL の JSONB では specs->>'storage_gb' ですが、MongoDB ではドット記法で済みます。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.find({ \"specs.storage_gb\": 512 }, { name: 1 }).sort({ _id: 1 })", "text": "// 全 41 件（先頭 3 件のみ表示）\n{\n  _id: 3,\n  name: 'Samsung 手機 I187'\n}\n{\n  _id: 16,\n  name: 'Sony 手機 D738'\n}\n{\n  _id: 17,\n  name: 'MSI 筆電 S469'\n}"}]}, {"id": "agg-status", "chapter": "集約パイプライン", "title": "ステータス別の注文数", "prompt": "aggregate でステータスごとの注文数を集計し、件数の多い順に並べてください。\n出力：_id がステータス、count が件数。\n", "hints": ["[ { $group: { _id: \"$status\", count: { $sum: 1 } } }, { $sort: { count: -1 } } ]"], "answer": "db.orders.aggregate([\n  { $group: { _id: \"$status\", count: { $sum: 1 } } },\n  { $sort: { count: -1 } }\n])\n", "explanation": "$group は SQL の GROUP BY に相当します：_id がグループ化の基準、\"$フィールド\" はフィールドの値、$sum: 1 は count(*) です。\n集約パイプラインのデータは各ステージを上から下へ流れ、各ステージの出力が次のステージの入力になります。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.aggregate([\n  { $group: { _id: \"$status\", count: { $sum: 1 } } },\n  { $sort: { count: -1 } }\n])", "text": "// 全 6 件（先頭 3 件のみ表示）\n{\n  _id: 'delivered',\n  count: 64554\n}\n{\n  _id: 'cancelled',\n  count: 8108\n}\n{\n  _id: 'returned',\n  count: 6340\n}"}]}, {"id": "agg-city-revenue", "chapter": "集約パイプライン", "title": "都市別売上トップ 5", "prompt": "配送済み（delivered）の注文だけを対象に、配送先都市ごとの売上（total の合計）を集計し、上位 5 件を取ります。\n出力：_id が都市、revenue が売上。売上の高い順。\n", "hints": ["$match で絞り込み → $group で合計 → $sort → $limit", "都市は埋め込みフィールドです：\"$shipping.city\""], "answer": "db.orders.aggregate([\n  { $match: { status: \"delivered\" } },\n  { $group: { _id: \"$shipping.city\", revenue: { $sum: \"$total\" } } },\n  { $sort: { revenue: -1 } },\n  { $limit: 5 }\n])\n", "explanation": "★ $match はできるだけ先頭に置きます：先にデータ量を減らせば後のステージが速くなり、しかも先頭の $match はインデックスを使えます。\n（実際にはオプティマイザが前に移動できる $match を自動で前に移しますが、自分で書いておく方が確実です。）\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.aggregate([\n  { $match: { status: \"delivered\" } },\n  { $group: { _id: \"$shipping.city\", revenue: { $sum: \"$total\" } } },\n  { $sort: { revenue: -1 } },\n  { $limit: 5 }\n])", "text": "// 全 5 件（先頭 3 件のみ表示）\n{\n  _id: '台北市',\n  revenue: 206971417\n}\n{\n  _id: '新北市',\n  revenue: 107267944\n}\n{\n  _id: '台中市',\n  revenue: 90333790\n}"}]}, {"id": "agg-unwind", "chapter": "集約パイプライン", "title": "販売数トップ 5 の商品（$unwind）", "prompt": "商品ごとの販売総数（items の qty の合計、すべてのステータスを含む）を集計し、上位 5 件を取ります。\n出力：_id が商品 id、name が商品名、qty が個数。個数の多い順、同数なら _id の昇順。\n", "hints": ["$unwind は items 配列を分解します：明細が 3 件ある注文は 3 つのドキュメントになります。", "$group は \"$items.productId\" でグループ化し、名称は { $first: \"$items.name\" } で取ります。"], "answer": "db.orders.aggregate([\n  { $unwind: \"$items\" },\n  { $group: { _id: \"$items.productId\", name: { $first: \"$items.name\" }, qty: { $sum: \"$items.qty\" } } },\n  { $sort: { qty: -1, _id: 1 } },\n  { $limit: 5 }\n])\n", "explanation": "$unwind は埋め込み配列を扱う鍵です：配列を複数のドキュメントに平らにすることで、明細ごとに集計できるようになります。\nPostgreSQL の unnest()、あるいは orders と order_items の JOIN に相当します。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.aggregate([\n  { $unwind: \"$items\" },\n  { $group: { _id: \"$items.productId\", name: { $first: \"$items.name\" }, qty: { $sum: \"$items.qty\" } } },\n  { $sort: { qty: -1, _id: 1 } },\n  { $limit: 5 }\n])", "text": "// 全 5 件（先頭 3 件のみ表示）\n{\n  _id: 1,\n  name: '雅漾 保養 C693',\n  qty: 1710\n}\n{\n  _id: 2,\n  name: '金車 飲料 F922',\n  qty: 1065\n}\n{\n  _id: 3,\n  name: 'Samsung 手機 I187',\n  qty: 884\n}"}]}, {"id": "agg-monthly", "chapter": "集約パイプライン", "title": "2026 年の月別注文数（タイムゾーン）", "prompt": "2026 年（台湾時間で計算）の月ごとの注文数を集計してください。\n出力：_id が \"2026-01\" のような月の文字列、count が件数。月順に並べます。\n", "hints": ["絞り込み：orderDate が ISODate(\"2026-01-01T00:00:00+08:00\") と ISODate(\"2027-01-01T00:00:00+08:00\") の間。", "グループ化：{ $dateToString: { format: \"%Y-%m\", date: \"$orderDate\", timezone: \"Asia/Taipei\" } }"], "answer": "db.orders.aggregate([\n  { $match: { orderDate: { $gte: ISODate(\"2026-01-01T00:00:00+08:00\"), $lt: ISODate(\"2027-01-01T00:00:00+08:00\") } } },\n  { $group: { _id: { $dateToString: { format: \"%Y-%m\", date: \"$orderDate\", timezone: \"Asia/Taipei\" } }, count: { $sum: 1 } } },\n  { $sort: { _id: 1 } }\n])\n", "explanation": "★ MongoDB の日付は常に UTC で保存されます。台湾時間 9/1 午前 2 時の注文は、UTC では 8/31 午後 6 時です。\n絞り込みではタイムゾーン（+08:00）を書き、グループ化でも timezone を指定しないと、各月の境界が 8 時間ずれます（落とし穴問題で実演しています）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.aggregate([\n  { $match: { orderDate: { $gte: ISODate(\"2026-01-01T00:00:00+08:00\"), $lt: ISODate(\"2027-01-01T00:00:00+08:00\") } } },\n  { $group: { _id: { $dateToString: { format: \"%Y-%m\", date: \"$orderDate\", timezone: \"Asia/Taipei\" } }, count: { $sum: 1 } } },\n  { $sort: { _id: 1 } }\n])", "text": "// 全 9 件（先頭 3 件のみ表示）\n{\n  _id: '2026-01',\n  count: 2668\n}\n{\n  _id: '2026-02',\n  count: 2471\n}\n{\n  _id: '2026-03',\n  count: 2902\n}"}]}, {"id": "agg-lookup", "chapter": "集約パイプライン", "title": "注文に会員名を付ける（$lookup）", "prompt": "会員 1 の最新 3 件の注文に、会員名を付けます。\n出力：_id、total、customerName。注文日時の新しい順。\n", "hints": ["$match → $sort → $limit → customers へ $lookup → $project", "$lookup の結果は配列なので、{ $first: \"$customer.name\" } で名前を取り出します。"], "answer": "db.orders.aggregate([\n  { $match: { customerId: 1 } },\n  { $sort: { orderDate: -1 } },\n  { $limit: 3 },\n  { $lookup: { from: \"customers\", localField: \"customerId\", foreignField: \"_id\", as: \"customer\" } },\n  { $project: { total: 1, customerName: { $first: \"$customer.name\" } } }\n])\n", "explanation": "$lookup は LEFT OUTER JOIN に相当し、結果は配列フィールドに入ります。\n★ $limit してから $lookup：3 件だけを JOIN するのであって、全注文を JOIN してから 3 件取るのではありません。\n$lookup の foreignField にはインデックスが必要です。ないと 1 件ごとにコレクション全体をスキャンします（実験室で差を実演しています）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.aggregate([\n  { $match: { customerId: 1 } },\n  { $sort: { orderDate: -1 } },\n  { $limit: 3 },\n  { $lookup: { from: \"customers\", localField: \"customerId\", foreignField: \"_id\", as: \"customer\" } },\n  { $project: { total: 1, customerName: { $first: \"$customer.name\" } } }\n])", "text": "// 全 3 件\n{\n  _id: 77621,\n  total: 1519,\n  customerName: '葉承文'\n}\n{\n  _id: 75279,\n  total: 1909,\n  customerName: '葉承文'\n}\n{\n  _id: 72474,\n  total: 21018,\n  customerName: '葉承文'\n}"}]}, {"id": "update-set", "chapter": "書き込み", "title": "在庫を更新（$set）", "prompt": "商品 540 の在庫（stock）を 20 に変更し、他のフィールドはそのままにします。\n", "hints": ["db.products.updateOne({ _id: 540 }, { $set: { stock: 20 } })"], "answer": "db.products.updateOne({ _id: 540 }, { $set: { stock: 20 } })\n", "explanation": "★ 更新には必ず更新演算子（$set、$inc、$push…）を使います。replaceOne を使うとドキュメント全体が置き換えられ、他のフィールドはすべて消えます（落とし穴問題で実演しています）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.products.updateOne({ _id: 540 }, { $set: { stock: 20 } })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}], "checks": [{"cmd": "db.products.findOne({ _id: 540 })", "text": "{\n  _id: 540,\n  name: 'Sony 手機 I447',\n  category: {\n    _id: 2,\n    name: '手機',\n    path: [ '3C電子', '手機' ]\n  },\n  price: 29949,\n  cost: 15756,\n  stock: 20,\n  isActive: true,\n  createdAt: ISODate('2021-03-01T00:00:00Z'),\n  tags: [ '特價' ],\n  specs: {\n    '5g': false,\n    color: '白',\n    warranty: {\n      type: '原廠',\n      years: 2\n    },\n    storage_gb: 128,\n    screen_inch: 6.3\n  }\n}"}]}, {"id": "update-inc", "chapter": "書き込み", "title": "飲料を一律 5 元値上げ（$inc）", "prompt": "カテゴリ名（category.name）が「飲料」の商品の価格をすべて 5 元上げます。\n", "hints": ["updateMany に { $inc: { price: 5 } } を指定"], "answer": "db.products.updateMany({ \"category.name\": \"飲料\" }, { $inc: { price: 5 } })\n", "explanation": "$inc はアトミックな操作で、カウンタ、在庫、いいね数に向いています。updateOne は最初に一致したドキュメントだけを更新し、updateMany はすべてを更新します。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.products.updateMany({ \"category.name\": \"飲料\" }, { $inc: { price: 5 } })", "text": "{\n  acknowledged: true,\n  matchedCount: 83,\n  modifiedCount: 83,\n  upsertedId: null\n}"}], "checks": [{"cmd": "db.products.find({}, { price: 1 }).sort({ _id: 1 })", "text": "// 全 83 件（先頭 3 件のみ表示）\n{\n  _id: 2,\n  price: 24\n}\n{\n  _id: 30,\n  price: 64\n}\n{\n  _id: 34,\n  price: 74\n}"}]}, {"id": "update-push", "chapter": "書き込み", "title": "注文に明細を 1 件追加（$push）", "prompt": "注文 77621 の items 配列の末尾に明細を 1 件追加します：\n{ productId: 1, name: \"測試商品\", qty: 1, unitPrice: 100, discount: 0 }\n", "hints": ["{ $push: { items: { … } } }"], "answer": "db.orders.updateOne({ _id: 77621 }, { $push: { items: { productId: 1, name: \"測試商品\", qty: 1, unitPrice: 100, discount: 0 } } })\n", "explanation": "配列の更新演算子：$push は末尾に追加、$addToSet は重複しないときだけ追加、$pull は条件で削除、$pop は先頭か末尾を削除。\n複数を一度に追加するには $push: { items: { $each: [ … ] } } と書き、$slice と組み合わせて最新 N 件だけを残すこともできます。\n注意：items に明細を追加しても total は自動で更新されません。$inc で一緒に変更する必要があります（ドキュメント型データベースには計算してくれるトリガーがありません）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.orders.updateOne({ _id: 77621 }, { $push: { items: { productId: 1, name: \"測試商品\", qty: 1, unitPrice: 100, discount: 0 } } })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}], "checks": [{"cmd": "db.orders.findOne({ _id: 77621 }, { items: 1 })", "text": "{\n  _id: 77621,\n  items: [\n    {\n      productId: 237,\n      name: 'UNIQLO 男裝 P863',\n      qty: 1,\n      unitPrice: 1519,\n      discount: 0.0\n    },\n    {\n      productId: 1,\n      name: '測試商品',\n      qty: 1,\n      unitPrice: 100,\n      discount: 0\n    }\n  ]\n}"}]}, {"id": "update-addtoset", "chapter": "書き込み", "title": "重複なしでタグを追加（$addToSet）", "prompt": "商品 540 に「熱銷」（人気）タグを追加します。既にある場合は重複して追加しません。\n", "hints": ["{ $addToSet: { tags: \"熱銷\" } }"], "answer": "db.products.updateOne({ _id: 540 }, { $addToSet: { tags: \"熱銷\" } })\n", "explanation": "$addToSet は配列を集合として扱います。2 回実行しても結果は同じで、この「繰り返し実行しても問題ない」性質を冪等（idempotent）と呼びます。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.products.updateOne({ _id: 540 }, { $addToSet: { tags: \"熱銷\" } })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}], "checks": [{"cmd": "db.products.findOne({ _id: 540 }, { tags: 1 })", "text": "{\n  _id: 540,\n  tags: [ '特價', '熱銷' ]\n}"}]}, {"id": "upsert", "chapter": "書き込み", "title": "あれば更新、なければ追加（upsert）", "prompt": "email \"new@example.com\" を条件に会員を更新します：name を「新會員」（新規会員）に、vipLevel を \"normal\" に設定します。\nこの email が存在しなければ、新しく追加します。\n", "hints": ["updateOne(条件, { $set: { … } }, { upsert: true })"], "answer": "db.customers.updateOne({ email: \"new@example.com\" }, { $set: { name: \"新會員\", vipLevel: \"normal\" } }, { upsert: true })\n", "explanation": "upsert で追加するとき、「検索条件の等値フィールド」（email）と $set のフィールドを合わせて新しいドキュメントを作ります。\n「追加するときだけ」設定したいフィールドは $setOnInsert を使います（例：作成日時）。\n★ 高い並行性の下で同じ email を同時に upsert すると 2 件追加されることがあるので、条件のフィールドには一意インデックスが必要です（customers.email にはあります）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.customers.updateOne({ email: \"new@example.com\" }, { $set: { name: \"新會員\", vipLevel: \"normal\" } }, { upsert: true })", "text": "{\n  acknowledged: true,\n  matchedCount: 0,\n  modifiedCount: 0,\n  upsertedId: 'BsonObjectId{value=6ac9c4a24a8706423f56cffc}'\n}"}], "checks": [{"cmd": "db.customers.find({ email: \"new@example.com\" }, { _id: 0, email: 1, name: 1, vipLevel: 1 })", "text": "// 全 1 件\n{\n  email: 'new@example.com',\n  name: '新會員',\n  vipLevel: 'normal'\n}"}]}, {"id": "delete-many", "chapter": "書き込み", "title": "古いキャンセル注文を削除", "prompt": "「ステータスが cancelled で、注文日時が台湾時間 2023-01-01 より前」の注文をすべて削除します。\n", "hints": ["deleteMany({ status: \"cancelled\", orderDate: { $lt: ISODate(\"2023-01-01T00:00:00+08:00\") } })"], "answer": "db.orders.deleteMany({ status: \"cancelled\", orderDate: { $lt: ISODate(\"2023-01-01T00:00:00+08:00\") } })\n", "explanation": "deleteMany({}) はすべてのドキュメントを削除しますが、コレクションとインデックスは残ります。drop() はコレクションとインデックスもまとめて削除します。\n期限切れのデータを自動で削除するには TTL インデックスを作ります：createIndex({ createdAt: 1 }, { expireAfterSeconds: 86400 })。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.orders.deleteMany({ status: \"cancelled\", orderDate: { $lt: ISODate(\"2023-01-01T00:00:00+08:00\") } })", "text": "{\n  acknowledged: true,\n  deletedCount: 418\n}"}], "checks": [{"cmd": "db.orders.countDocuments({})", "text": "7690"}, {"cmd": "db.orders.countDocuments({ orderDate: { $lt: ISODate(\"2023-01-01T00:00:00+08:00\") } })", "text": "0"}]}, {"id": "find-one-and-update", "chapter": "書き込み", "title": "更新して新しい値を受け取る（findOneAndUpdate）", "prompt": "商品 540 の在庫を 1 減らし、同じ操作の中で「更新後」のドキュメント（name と stock だけ）を受け取ります。\n", "hints": ["findOneAndUpdate(条件, { $inc: { stock: -1 } }, { returnDocument: \"after\", projection: { name: 1, stock: 1 } })"], "answer": "db.products.findOneAndUpdate({ _id: 540 }, { $inc: { stock: -1 } }, { returnDocument: \"after\", projection: { name: 1, stock: 1 } })\n", "explanation": "findOneAndUpdate はアトミックな「更新して読み取り」で、既定では更新「前」のドキュメントを返すので、returnDocument: \"after\" を付けます。\n条件を { _id: 540, stock: { $gt: 0 } } にすれば、売り越しが起きない在庫の引き当てになります（Redis 実験室の Lua スクリプトと比べてみましょう）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "db.products.findOneAndUpdate({ _id: 540 }, { $inc: { stock: -1 } }, { returnDocument: \"after\", projection: { name: 1, stock: 1 } })", "text": "{\n  _id: 540,\n  name: 'Sony 手機 I447',\n  stock: 10\n}"}]}], "traps": [{"id": "array-equality", "title": "配列の等号", "question": "A と B で数えた商品数は同じですか？", "options": ["同じ", "A の方が多い", "B の方が多い"], "answer": 1, "explanation": "A：条件は単一の値なので、MongoDB は配列の「各要素」と比較し、いずれかが等しければ成立します。\nB：条件自体が配列なので、「配列全体が完全に一致」という意味になり、タグがちょうど [\"特價\"] で他のタグがない商品だけが該当します。\n「これらをすべて含む」なら $all、「いずれかを含む」なら $in を使います。\n", "setup": null, "scripts": [{"label": "A：{ tags: \"特價\" }", "code": "db.products.countDocuments({ tags: \"特價\" })\n"}, {"label": "B：{ tags: [\"特價\"] }", "code": "db.products.countDocuments({ tags: [\"特價\"] })\n"}], "results": [[{"cmd": "db.products.countDocuments({ tags: \"特價\" })", "text": "303"}], [{"cmd": "db.products.countDocuments({ tags: [\"特價\"] })", "text": "140"}]]}, {"id": "elem-match", "title": "配列に対する複数の条件", "question": "A は「同じ明細」が qty ≥ 3 と unitPrice ≥ 10000 を同時に満たすことを求めていますか？", "options": ["はい、B と同じ", "いいえ、A の方が多い", "いいえ、A の方が少ない"], "answer": 1, "explanation": "A の 2 つの条件は、それぞれ独立に items 配列全体と比較されます：「ある明細」の qty ≥ 3 で、「ある明細」の unitPrice ≥ 10000 なら成立し、2 つは別の明細でも構いません。\nB の $elemMatch は「同じ」明細が両方を満たすことを求めます。そのため A には「ある明細で安い品を大量に、別の明細で高い品を 1 つ」買った注文も含まれます。\n", "setup": null, "scripts": [{"label": "A：ドット記法の条件 2 つ", "code": "db.orders.countDocuments({ \"items.qty\": { $gte: 3 }, \"items.unitPrice\": { $gte: 10000 } })\n"}, {"label": "B：$elemMatch", "code": "db.orders.countDocuments({ items: { $elemMatch: { qty: { $gte: 3 }, unitPrice: { $gte: 10000 } } } })\n"}], "results": [[{"cmd": "db.orders.countDocuments({ \"items.qty\": { $gte: 3 }, \"items.unitPrice\": { $gte: 10000 } })", "text": "4876"}], [{"cmd": "db.orders.countDocuments({ items: { $elemMatch: { qty: { $gte: 3 }, unitPrice: { $gte: 10000 } } } })", "text": "2074"}]]}, {"id": "null-matches-missing", "title": "null はフィールドのないドキュメントも見つける", "question": "city フィールドがない会員がいます（null ではなく、フィールド自体が存在しない）。A の { city: null } はそれらを見つけますか？", "options": ["見つける、B と同じ", "見つけない。値が null のものだけなので、結果は 0", "エラー"], "answer": 0, "explanation": "{ フィールド: null } は「値が null」と「そのフィールドがない」の両方のドキュメントを見つけます。\nどちらか一方だけが欲しいなら、フィールドがないものは { $exists: false }、値がちょうど null のものは { $type: \"null\" } を使います。\nSQL と比べると：PostgreSQL の city = NULL は決して成立せず IS NULL と書く必要がありますが、MongoDB の振る舞いはちょうど逆なので、混同しやすい点です。\n", "setup": null, "scripts": [{"label": "A：{ city: null }", "code": "db.customers.countDocuments({ city: null })\n"}, {"label": "B：{ city: { $exists: false } }", "code": "db.customers.countDocuments({ city: { $exists: false } })\n"}], "results": [[{"cmd": "db.customers.countDocuments({ city: null })", "text": "616"}], [{"cmd": "db.customers.countDocuments({ city: { $exists: false } })", "text": "616"}]]}, {"id": "type-mismatch", "title": "型が違うと見つからない", "question": "商品の _id は数値の 540 です。A は文字列 \"540\" で見つけられますか？", "options": ["見つかる。MongoDB が自動で型変換する", "見つからない。結果は 0", "エラー"], "answer": 1, "explanation": "MongoDB の比較では型も一致する必要があり、文字列 \"540\" と数値 540 は別の値です。自動で型変換されず、エラーにもなりません。\nJava で最もよくはまるのは、フロントエンドから来た id が String のまま数値型のフィールドを検索して、永遠に見つからないケースです。\n同様に、ObjectId(\"…\") と文字列 \"…\" も等しくありません。\n", "setup": null, "scripts": [{"label": "A：文字列 \"540\"", "code": "db.products.countDocuments({ _id: \"540\" })\n"}, {"label": "B：数値 540", "code": "db.products.countDocuments({ _id: 540 })\n"}], "results": [[{"cmd": "db.products.countDocuments({ _id: \"540\" })", "text": "0"}], [{"cmd": "db.products.countDocuments({ _id: 540 })", "text": "1"}]]}, {"id": "replace-drops-fields", "title": "replaceOne はドキュメント全体を置き換える", "question": "A は replaceOne で商品 540 の在庫を 20 にします。実行後、このドキュメントにはどのフィールドが残りますか？", "options": ["すべてのフィールドが残り、stock だけが 20 になる", "_id と stock だけが残る", "エラー"], "answer": 1, "explanation": "replaceOne は新しいドキュメントで古いドキュメントを「丸ごと置き換え」ます（_id は保持）。名称、価格、カテゴリはすべて消えます。\n一部のフィールドだけを変更したいなら、必ず updateOne / updateMany と $set を使いましょう。\nSpring Data MongoDB の repository.save(entity) も丸ごと置き換えです：一部のフィールドだけを読み込んだ entity を保存すると、他のフィールドが消えてしまいます。\n", "setup": null, "scripts": [{"label": "A：replaceOne", "code": "db.products.replaceOne({ _id: 540 }, { stock: 20 })\ndb.products.findOne({ _id: 540 })\n"}, {"label": "B：updateOne + $set", "code": "db.products.updateOne({ _id: 540 }, { $set: { stock: 20 } })\ndb.products.findOne({ _id: 540 })\n"}], "results": [[{"cmd": "db.products.replaceOne({ _id: 540 }, { stock: 20 })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}, {"cmd": "db.products.findOne({ _id: 540 })", "text": "{\n  _id: 540,\n  stock: 20\n}"}], [{"cmd": "db.products.updateOne({ _id: 540 }, { $set: { stock: 20 } })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}, {"cmd": "db.products.findOne({ _id: 540 })", "text": "{\n  _id: 540,\n  name: 'Sony 手機 I447',\n  category: {\n    _id: 2,\n    name: '手機',\n    path: [ '3C電子', '手機' ]\n  },\n  price: 29949,\n  cost: 15756,\n  stock: 20,\n  isActive: true,\n  createdAt: ISODate('2021-03-01T00:00:00Z'),\n  tags: [ '特價' ],\n  specs: {\n    '5g': false,\n    color: '白',\n    warranty: {\n      type: '原廠',\n      years: 2\n    },\n    storage_gb: 128,\n    screen_inch: 6.3\n  }\n}"}]]}, {"id": "sort-limit-order", "title": "limit してから sort？", "question": "A は .limit(3) を .sort() の前に書いています。A はまず適当に 3 件取ってから並べ替えますか？", "options": ["はい、結果は B と異なる", "いいえ、結果は B と同じ", "エラー"], "answer": 1, "explanation": "find の sort、skip、limit はどの順でつなげても、MongoDB は常に「sort → skip → limit」の順で実行するので、A と B は同じです。\nただし集約パイプラインは違います：[ { $limit: 3 }, { $sort: … } ] は本当に 3 件取ってから並べ替えます。パイプラインはステージの順に実行されるからです。\n", "setup": null, "scripts": [{"label": "A：.limit(3).sort(…)", "code": "db.orders.find({ status: \"paid\" }, { total: 1 }).limit(3).sort({ total: -1 })\n"}, {"label": "B：.sort(…).limit(3)", "code": "db.orders.find({ status: \"paid\" }, { total: 1 }).sort({ total: -1 }).limit(3)\n"}], "results": [[{"cmd": "db.orders.find({ status: \"paid\" }, { total: 1 }).limit(3).sort({ total: -1 })", "text": "// 全 3 件\n{\n  _id: 79042,\n  total: 194734\n}\n{\n  _id: 78975,\n  total: 147588\n}\n{\n  _id: 79676,\n  total: 143543\n}"}], [{"cmd": "db.orders.find({ status: \"paid\" }, { total: 1 }).sort({ total: -1 }).limit(3)", "text": "// 全 3 件\n{\n  _id: 79042,\n  total: 194734\n}\n{\n  _id: 78975,\n  total: 147588\n}\n{\n  _id: 79676,\n  total: 143543\n}"}]]}, {"id": "timezone", "title": "日付とタイムゾーン", "question": "「台湾時間の 2026 年 9 月」の注文を調べたいとき、A と B の件数は同じですか？", "options": ["同じ", "違う"], "answer": 1, "explanation": "MongoDB の日付は常に UTC で保存されます。ISODate(\"2026-09-01\") は UTC の午前 0 時で、台湾時間では 9/1 午前 8 時です。\nA は 9/1 午前 0〜8 時の注文が漏れ、10/1 午前 0〜8 時の注文が余分に含まれます。\nJava の LocalDate、LocalDateTime にはタイムゾーンがないので、Date に変換するときは必ず ZoneId.of(\"Asia/Taipei\") を明示しましょう。\n", "setup": null, "scripts": [{"label": "A：タイムゾーンなし（UTC）", "code": "db.orders.countDocuments({ orderDate: { $gte: ISODate(\"2026-09-01\"), $lt: ISODate(\"2026-10-01\") } })\n"}, {"label": "B：+08:00 を明記", "code": "db.orders.countDocuments({ orderDate: { $gte: ISODate(\"2026-09-01T00:00:00+08:00\"), $lt: ISODate(\"2026-10-01T00:00:00+08:00\") } })\n"}], "results": [[{"cmd": "db.orders.countDocuments({ orderDate: { $gte: ISODate(\"2026-09-01\"), $lt: ISODate(\"2026-10-01\") } })", "text": "2889"}], [{"cmd": "db.orders.countDocuments({ orderDate: { $gte: ISODate(\"2026-09-01T00:00:00+08:00\"), $lt: ISODate(\"2026-10-01T00:00:00+08:00\") } })", "text": "2919"}]]}, {"id": "update-one-only", "title": "updateOne は 1 件だけ更新する", "question": "pending の注文が 300 件以上あります。A の updateOne は何件更新しますか？", "options": ["1 件", "pending の注文すべて"], "answer": 0, "explanation": "updateOne、deleteOne、replaceOne は条件に合う「最初の 1 件」だけを処理し、どれが最初かは保証されません。\nすべてを処理するなら updateMany、deleteMany を使います。返り値の matchedCount と modifiedCount で、何件に影響したか確認できます。\n", "setup": null, "scripts": [{"label": "A：updateOne", "code": "db.orders.updateOne({ status: \"pending\" }, { $set: { status: \"paid\" } })\ndb.orders.countDocuments({ status: \"pending\" })\n"}, {"label": "B：updateMany", "code": "db.orders.updateMany({ status: \"pending\" }, { $set: { status: \"paid\" } })\ndb.orders.countDocuments({ status: \"pending\" })\n"}], "results": [[{"cmd": "db.orders.updateOne({ status: \"pending\" }, { $set: { status: \"paid\" } })", "text": "{\n  acknowledged: true,\n  matchedCount: 1,\n  modifiedCount: 1,\n  upsertedId: null\n}"}, {"cmd": "db.orders.countDocuments({ status: \"pending\" })", "text": "328"}], [{"cmd": "db.orders.updateMany({ status: \"pending\" }, { $set: { status: \"paid\" } })", "text": "{\n  acknowledged: true,\n  matchedCount: 329,\n  modifiedCount: 329,\n  upsertedId: null\n}"}, {"cmd": "db.orders.countDocuments({ status: \"pending\" })", "text": "0"}]]}], "steps": [{"id": "collscan", "title": "インデックスなし：COLLSCAN", "goal": "orders には _id のインデックスしかありません。会員 4242 の注文を、注文日時の新しい順に検索します。\n", "question": "返されたドキュメントは何件ですか？それを見つけるために MongoDB は何件のドキュメントを見ましたか（docsExamined）？", "takeaway": "COLLSCAN = コレクション全体を先頭から末尾までスキャンすること。PostgreSQL の Seq Scan に相当します。\nexplain で最も重要な 3 つの数値：nReturned（返した件数）、totalKeysExamined（見たインデックス項目の数）、totalDocsExamined（読んだドキュメントの数）。\n理想は 3 つの数値がほぼ同じであること。docsExamined が nReturned よりはるかに大きいなら、インデックスが足りません。\nさらに実行計画には SORT もあります：順序を提供するインデックスがないので、メモリ上で並べ替えるしかありません（ディスクの使用を許可しない限り、100 MB を超えると失敗します）。\n", "setup": [], "queries": [{"label": "会員 4242 の注文", "code": "db.orders.find({ customerId: 4242 }).sort({ orderDate: -1 })"}]}, {"id": "single-field", "title": "単一フィールドインデックス：IXSCAN、ただし並べ替えは残る", "goal": "customerId にインデックスを作成し、同じクエリをもう一度実行します。\n", "question": "実行計画は何に変わりましたか？docsExamined はいくつになりましたか？SORT はまだありますか？", "takeaway": "IXSCAN → FETCH になります：まずインデックスで該当する位置を見つけ、それからドキュメントを読みます。docsExamined は 8 万から nReturned と同じ数になります。\nしかしまだ SORT があります：このインデックスは customerId でしか並んでおらず、同じ会員の注文は時刻順になっていません。\n", "setup": ["db.orders.createIndex({ customerId: 1 })"], "queries": [{"label": "会員 4242 の注文", "code": "db.orders.find({ customerId: 4242 }).sort({ orderDate: -1 })"}]}, {"id": "compound", "title": "複合インデックスで並べ替えも不要に", "goal": "{ customerId: 1, orderDate: -1 } の複合インデックスを作成します（前のステップの customerId_1 を先に削除すると分かりやすくなります）。\n", "question": "SORT はまだありますか？", "takeaway": "複合インデックスは customerId、次に orderDate の順で並んでいるので、4242 を見つけた時点でデータはすでに時刻順になっており、SORT が消えます。\n並び順の向き：単一フィールドインデックスは正順・逆順どちらでも使えます。複合インデックスは「すべて同じ向き」か「すべて逆向き」のときだけ使えます。{ customerId: 1, orderDate: -1 } は\nsort({ customerId: 1, orderDate: -1 }) と sort({ customerId: -1, orderDate: 1 }) には使えますが、sort({ customerId: 1, orderDate: 1 }) には使えません。\n", "setup": ["db.orders.dropIndex(\"customerId_1\")", "db.orders.createIndex({ customerId: 1, orderDate: -1 })"], "queries": [{"label": "会員 4242 の注文", "code": "db.orders.find({ customerId: 4242 }).sort({ orderDate: -1 })"}]}, {"id": "esr", "title": "★ ESR ルール：等値、ソート、範囲", "goal": "配送済みで金額 5 万以上の注文を、時刻の新しい順に最新 10 件取得します（典型的なページングクエリ）。このクエリには 3 種類の条件があります：\n等値（Equality）の status、範囲（Range）の total、ソート（Sort）の orderDate。\nフィールドの順序が異なる 2 つのインデックスを作り、hint でインデックスを指定して両者を比較します。\n", "question": "A と B のどちらに SORT がありますか？それぞれ何個のインデックス項目を見ましたか（keysExamined）？オプティマイザはどちらを選びましたか？", "takeaway": "★ ESR ルール（MongoDB 公式が推奨する複合インデックスのフィールド順）：Equality → Sort → Range。\nA（E-R-S）：範囲の後の orderDate にはもう順序がないので、範囲に合う「すべて」（約 5 千件）を見つけてから並べ替えないと、最新 10 件がどれか分かりません。\nB（E-S-R）：等値の後のデータはすでに時刻順に並んでいるので、最新のものから順に見ながら total で絞り込み、10 件そろった時点で止まります。見たインデックス項目は百数十個だけで、SORT もありません。\n範囲条件が緩いほど差は大きくなります（50000 を 1000 に変えてみましょう）。\nただし limit がなく、範囲条件が非常に厳しい場合は、A の方が速いこともあります。範囲に直接ジャンプでき、見る項目が最も少ないからです。\nつまり ESR は「既定の良い選択」で、特にページングやソートのクエリに向いています。迷ったら explain で比較しましょう。PostgreSQL の複合インデックスも同じ理屈です。\n", "setup": ["db.orders.createIndex({ status: 1, total: 1, orderDate: -1 }, { name: \"idx_ERS\" })", "db.orders.createIndex({ status: 1, orderDate: -1, total: 1 }, { name: \"idx_ESR\" })"], "queries": [{"label": "A：インデックスの順序 E-R-S", "code": "db.orders.find({ status: \"delivered\", total: { $gte: 50000 } }).sort({ orderDate: -1 }).limit(10).hint(\"idx_ERS\")"}, {"label": "B：インデックスの順序 E-S-R", "code": "db.orders.find({ status: \"delivered\", total: { $gte: 50000 } }).sort({ orderDate: -1 }).limit(10).hint(\"idx_ESR\")"}, {"label": "C：インデックスを指定せず、オプティマイザに選ばせる", "code": "db.orders.find({ status: \"delivered\", total: { $gte: 50000 } }).sort({ orderDate: -1 }).limit(10)"}]}, {"id": "multikey", "title": "配列フィールドのインデックス：マルチキーインデックス", "goal": "商品 540 を買った注文を検索します。items は配列なので、items.productId にインデックスを作成します。\n", "question": "インデックス作成前後で docsExamined はどれだけ違いますか？explain の isMultiKey は何ですか？", "takeaway": "配列フィールドに作るインデックスはマルチキーインデックス（multikey index）と呼ばれます：配列の要素ごとにインデックス項目が 1 つでき、明細が 4 件ある注文なら 4 項目になります。\n制限：1 つの複合インデックスに含められる配列フィールドは 1 つまで。配列が大きいとインデックスも大きくなります。\n", "setup": ["db.orders.createIndex({ \"items.productId\": 1 })"], "queries": [{"label": "商品 540 を買った注文", "code": "db.orders.find({ \"items.productId\": 540 })"}]}, {"id": "covered", "title": "カバードクエリ：ドキュメントを読む必要すらない", "goal": "{ customerId: 1, orderDate: -1 } のインデックス（ステップ 3）があることを確認してください。「インデックスにあるフィールドだけ」と「もう 1 つ多いフィールド」を比較します。\n", "question": "A の docsExamined はいくつですか？実行計画に FETCH はありますか？", "takeaway": "A が必要とするフィールドはすべてインデックスにあるので、インデックスから直接返せます。これをカバードクエリ（covered query）と呼び、docsExamined = 0 で FETCH もありません。\n★ 必ず _id: 0 と書きましょう。_id はこのインデックスにないのに、既定で返されるからです。\nB は total も必要なので、ドキュメントを読みに戻るしかありません。PostgreSQL の Index Only Scan と比べてみましょう。\n", "setup": ["db.orders.createIndex({ customerId: 1, orderDate: -1 })"], "queries": [{"label": "A：customerId、orderDate だけ（_id を除外）", "code": "db.orders.find({ customerId: 4242 }, { _id: 0, customerId: 1, orderDate: 1 })"}, {"label": "B：total も取得", "code": "db.orders.find({ customerId: 4242 }, { _id: 0, customerId: 1, orderDate: 1, total: 1 })"}]}]}, {"id": "cassandra", "name": "Cassandra", "lang": "cql", "labName": "テーブル設計実験", "labNote": "すべてのクエリでトレース（TRACING）を有効にし、読み取り方法（単一パーティション、範囲スキャン、SAI インデックス）とサーバーが実際に読んだ行数を比較します。", "hasResults": true, "exercises": [{"id": "by-order-id", "chapter": "主キーでの検索", "title": "注文番号で注文を検索", "prompt": "注文 77621 のステータス（status）と合計金額（total）を調べてください。\n", "hints": ["orders の主キーは order_id で、WHERE order_id = … は「単一パーティション」の読み取りになります。"], "answer": "SELECT status, total FROM orders WHERE order_id = 77621;\n", "explanation": "Cassandra はパーティションキーのハッシュ値（token）でデータを置くノードを決めます。WHERE でパーティションキーを完全に指定すれば、コーディネーターは担当ノードを直接見つけられ、\nクラスタのマシンが何台あっても 1 か所しか読みません。これが Cassandra で最も速く、最も「正しい」検索方法です。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT status, total FROM orders WHERE order_id = 77621", "table": {"columns": ["status", "total"], "rows": [["cancelled", 1519]], "total": 1}}]}, {"id": "customer-orders", "chapter": "主キーでの検索", "title": "会員の注文（新しい順）", "prompt": "会員 4242 のすべての注文を新しい順に一覧にしてください。\norder_time、order_id、status、total の 4 列を返します。\n", "hints": ["orders は customer_id では検索できません（主キーではないため）。「会員ごとに保存した」テーブルを探しましょう。", "orders_by_customer のクラスタリングキーは order_time DESC で、データはパーティション内で既に並んでいるので、ORDER BY は不要です。"], "answer": "SELECT order_time, order_id, status, total\nFROM orders_by_customer\nWHERE customer_id = 4242;\n", "explanation": "同じパーティション内の行は、クラスタリングキーで並べた状態でまとめて保存されます。テーブル作成時に CLUSTERING ORDER BY (order_time DESC) と書いたので、\n読み出すとそのまま新しい順で、並べ替えは不要です。これが Cassandra の「クエリ先行」設計です：まずどう検索するかを決めてから、テーブルの主キーを決めます。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_time, order_id, status, total\nFROM orders_by_customer\nWHERE customer_id = 4242", "table": {"columns": ["order_time", "order_id", "status", "total"], "rows": [["2026-03-06T23:54:08.827Z", 59901, "delivered", 3098], ["2025-07-30T06:01:00.168Z", 42762, "delivered", 7517], ["2025-06-05T16:00:05.487Z", 39226, "returned", 36391], ["2024-03-12T20:25:37.131Z", 16901, "delivered", 4596], ["2024-02-15T13:15:50.591Z", 15943, "delivered", 1647], ["2023-03-26T00:04:57.275Z", 6116, "delivered", 4784]], "total": 6}}]}, {"id": "latest-three", "chapter": "主キーでの検索", "title": "最新 3 件の注文", "prompt": "会員 1 の最新 3 件の注文。order_id、total を新しい順に返します。\n", "hints": ["LIMIT はパーティション内でも有効で、データは既に時刻順なので 3 行目を読んだところで止まります。"], "answer": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 1 LIMIT 3;\n", "explanation": "パーティション内は既に order_time DESC で並んでいるので、LIMIT 3 はパーティションの先頭 3 行を読むだけです。SQL のように全体を並べ替えてから 3 件取る必要はありません。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 1 LIMIT 3", "table": {"columns": ["order_id", "total"], "rows": [[77621, 1519], [75279, 1909], [72474, 21018]], "total": 3}}]}, {"id": "oldest-first", "chapter": "主キーでの検索", "title": "古い順", "prompt": "会員 4242 の注文を古い順に変え、order_time、order_id を返します。\n", "hints": ["ORDER BY にはクラスタリングキーしか使えず、しかもテーブル作成時の順序かその完全な逆順だけです。"], "answer": "SELECT order_time, order_id FROM orders_by_customer\nWHERE customer_id = 4242\nORDER BY order_time ASC;\n", "explanation": "ORDER BY にはクラスタリングキーしか書けません：テーブル作成時と同じ順序か、すべて逆（パーティションを逆向きに読む）かのどちらかです。\nORDER BY order_time ASC はクラスタリング順序全体を逆にすることなので、order_id も一緒に逆になります。total で並べ替えることはできず、アプリケーション側で並べ替えるか、total をクラスタリングキーにした別のテーブルを作るしかありません。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_time, order_id FROM orders_by_customer\nWHERE customer_id = 4242\nORDER BY order_time ASC", "table": {"columns": ["order_time", "order_id"], "rows": [["2023-03-26T00:04:57.275Z", 6116], ["2024-02-15T13:15:50.591Z", 15943], ["2024-03-12T20:25:37.131Z", 16901], ["2025-06-05T16:00:05.487Z", 39226], ["2025-07-30T06:01:00.168Z", 42762], ["2026-03-06T23:54:08.827Z", 59901]], "total": 6}}]}, {"id": "year-count", "chapter": "主キーでの検索", "title": "ある年の注文数", "prompt": "会員 1 は 2025 年（台湾時間）に何件注文しましたか？1 つの数値を返します。\n", "hints": ["パーティションキーには等号を、クラスタリングキー order_time には範囲を使えます。", "時刻の文字列にはタイムゾーンを付けます。例えば '2025-01-01 00:00:00+0800' とすれば、サーバーのタイムゾーンに左右されません。"], "answer": "SELECT COUNT(*) FROM orders_by_customer\nWHERE customer_id = 1\n  AND order_time >= '2025-01-01 00:00:00+0800'\n  AND order_time <  '2026-01-01 00:00:00+0800';\n", "explanation": "パーティションキーの等号 + クラスタリングキーの範囲は、Cassandra の最も典型的な検索方法です：パーティションを見つけたら、並んだデータから一区間を切り出します。\n単一パーティション内に限定した COUNT(*) は安価ですが、パーティションキーなしの COUNT(*) はテーブル全体をスキャンします（落とし穴問題で実演しています）。\n時刻の文字列にタイムゾーンがないと、Cassandra はサーバーのタイムゾーンで解釈します。このコンテナはたまたま Asia/Taipei に設定されていますが、別のマシンでは結果が変わり得るので、明記するのが確実です。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT COUNT(*) FROM orders_by_customer\nWHERE customer_id = 1\n  AND order_time >= '2025-01-01 00:00:00+0800'\n  AND order_time <  '2026-01-01 00:00:00+0800'", "table": {"columns": ["count"], "rows": [[24]], "total": 1}}]}, {"id": "login-by-email", "chapter": "主キーでの検索", "title": "email でログイン", "prompt": "email 'user04242@example.com' で会員番号（customer_id）と氏名（name）を調べてください。\n", "hints": ["customers の主キーは customer_id なので、email で検索するには別のテーブルを探します。"], "answer": "SELECT customer_id, name FROM customers_by_email WHERE email = 'user04242@example.com';\n", "explanation": "同じ会員データを異なるパーティションキーで 2 回保存しており（customers、customers_by_email）、どの検索方法も単一パーティションの読み取りになります。\n代償は書き込みが 2 回になることで、email を変更するときは両方のテーブルを変更する必要があります（通常は logged BATCH で両方の書き込みが最終的に成功することを保証します）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT customer_id, name FROM customers_by_email WHERE email = 'user04242@example.com'", "table": {"columns": ["customer_id", "name"], "rows": [[4242, "蘇建恩"]], "total": 1}}]}, {"id": "multi-get", "chapter": "主キーでの検索", "title": "複数の商品を一度に検索", "prompt": "商品 540、541、542 の product_id、name、price を一度に調べてください。順序は問いません。\n", "hints": ["パーティションキーには IN を使えます。"], "answer": "SELECT product_id, name, price FROM products WHERE product_id IN (540, 541, 542);\n", "explanation": "パーティションキーに IN を使うと、コーディネーターは各パーティション（別々のノードにあるかもしれない）をそれぞれ探しに行く必要があり、IN の値が多いとコーディネーターの負荷が大きくなります。\n実務では数個から数十個なら問題ありません。それ以上なら、アプリケーションから単一パーティションのクエリを並行して複数送る方が、通常は速くて安定します。\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "SELECT product_id, name, price FROM products WHERE product_id IN (540, 541, 542)", "table": {"columns": ["product_id", "name", "price"], "rows": [[540, "Sony 手機 I447", 29949], [541, "MAC 彩妝 M983", 309], [542, "Coleman 露營用品 C299", 3069]], "total": 3}}]}, {"id": "category-top", "chapter": "クラスタリングキーと時間バケット", "title": "カテゴリ内で最も高い 5 件", "prompt": "「手機」（スマートフォン）カテゴリで最も高い 5 件の商品。name、price を価格の高い順に返します。\n", "hints": ["products_by_category のパーティションキーは category、クラスタリングキーは price DESC です。"], "answer": "SELECT name, price FROM products_by_category WHERE category = '手機' LIMIT 5;\n", "explanation": "クラスタリングキー (price DESC, product_id) により、パーティション内の商品は既に価格の高い順に並んでいます。\nproduct_id もクラスタリングキーに入れているのは、「同じ価格の 2 つの商品」の主キーが異なるようにして、互いに上書きしないためです。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT name, price FROM products_by_category WHERE category = '手機' LIMIT 5", "table": {"columns": ["name", "price"], "rows": [["Sony 手機 I447", 29949], ["小米 手機 O256", 28769], ["ASUS 手機 H620", 28659], ["Samsung 手機 D707", 28649], ["Apple 手機 Q137", 28229]], "total": 5}}]}, {"id": "price-range", "chapter": "クラスタリングキーと時間バケット", "title": "価格帯", "prompt": "「筆電」（ノートパソコン）カテゴリで、価格が 20,000 から 30,000 まで（両端を含む）の商品。\nproduct_id、name、price を価格の低い順に返します。\n", "hints": ["クラスタリングキーは >=、<= で範囲を切れます。", "低い順はテーブル作成時の順序と逆なので、ORDER BY を書きます。"], "answer": "SELECT product_id, name, price FROM products_by_category\nWHERE category = '筆電' AND price >= 20000 AND price <= 30000\nORDER BY price ASC;\n", "explanation": "範囲条件はクラスタリングキーにしか置けず、しかもクラスタリングキーの順序に従う必要があります：先に price を限定してから、product_id を限定できます。\nORDER BY price ASC はパーティションを逆向きに読むだけで、追加の並べ替えは不要です。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT product_id, name, price FROM products_by_category\nWHERE category = '筆電' AND price >= 20000 AND price <= 30000\nORDER BY price ASC", "table": {"columns": ["product_id", "name", "price"], "rows": [[417, "MSI 筆電 F301", 20539], [551, "Lenovo 筆電 O625", 21209], [1053, "ASUS 筆電 C956", 21579], [1268, "Lenovo 筆電 J333", 22209], [619, "Lenovo 筆電 U495", 22939], [1086, "MSI 筆電 Z112", 23229], [113, "Apple 筆電 Q541", 24549], [555, "Lenovo 筆電 I383", 24879], [1306, "Lenovo 筆電 Q986", 27049], [1065, "MSI 筆電 E394", 27209]], "total": 13}}]}, {"id": "day-count", "chapter": "クラスタリングキーと時間バケット", "title": "ある日の注文数", "prompt": "2026-09-01（台湾時間）の注文は何件ですか？1 つの数値を返します。\n", "hints": ["orders_by_day は 1 日 1 パーティションで、order_day は台湾時間の日付です。"], "answer": "SELECT COUNT(*) FROM orders_by_day WHERE order_day = '2026-09-01';\n", "explanation": "これを「時間バケット」（bucketing）と呼びます：パーティションキーが「全注文」や「年」だけだと、パーティションは際限なく大きくなります。\n日付をパーティションキーにすれば各パーティションの大きさは一定（1 日数十〜数百件）で、ある期間を検索するときはその日数分のパーティションを読むだけです。\nバケットの粒度は書き込み量で決めます：書き込みが非常に多いシステムでは時間単位、さらには (日付, 0〜9 のハッシュ) でさらに分割することもあります。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT COUNT(*) FROM orders_by_day WHERE order_day = '2026-09-01'", "table": {"columns": ["count"], "rows": [[87]], "total": 1}}]}, {"id": "week-by-day", "chapter": "クラスタリングキーと時間バケット", "title": "1 週間の日別注文数", "prompt": "2026-09-01 から 2026-09-07（台湾時間）までの各日の注文は何件ですか？\norder_day と件数を、日付の古い順に返します。\n", "hints": ["パーティションキーには IN で 7 日分を列挙できます。", "GROUP BY には主キーの列しか使えません。ここではパーティションキー order_day を使います。"], "answer": "SELECT order_day, COUNT(*) FROM orders_by_day\nWHERE order_day IN ('2026-09-01', '2026-09-02', '2026-09-03', '2026-09-04',\n                    '2026-09-05', '2026-09-06', '2026-09-07')\nGROUP BY order_day;\n", "explanation": "GROUP BY には主キーの列しか使えず、しかも主キーの順序（パーティションキー → クラスタリングキーの先頭部分）に従う必要があります。\n実行すると「Aggregation query used on multiple partition keys」という警告が出ます：IN が複数のパーティションにまたがり、コーディネーターはそれらをすべて読み戻してから集計する必要があるからです。\n7 日分なら問題ありませんが、データ量の多いレポートには Spark のようなツールを使うか、書き込み時に別途集計しておく（例えばカウンタテーブル）のが普通です。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_day, COUNT(*) FROM orders_by_day\nWHERE order_day IN ('2026-09-01', '2026-09-02', '2026-09-03', '2026-09-04',\n                    '2026-09-05', '2026-09-06', '2026-09-07')\nGROUP BY order_day", "table": {"columns": ["order_day", "count"], "rows": [["2026-09-01", 87], ["2026-09-02", 102], ["2026-09-03", 95], ["2026-09-04", 87], ["2026-09-05", 98], ["2026-09-06", 82], ["2026-09-07", 90]], "total": 7}, "warn": ["Aggregation query used on multiple partition keys (IN restriction)"]}]}, {"id": "evening-orders", "chapter": "クラスタリングキーと時間バケット", "title": "ある日の夜の注文", "prompt": "2026-09-01 の夜 8 時から 10 時まで（台湾時間、8 時を含み 10 時を含まない）の注文。\norder_time、order_id、total を時刻の早い順に返します。\n", "hints": ["まずパーティションキーでその日を選び、次にクラスタリングキー order_time で範囲を切ります。"], "answer": "SELECT order_time, order_id, total FROM orders_by_day\nWHERE order_day = '2026-09-01'\n  AND order_time >= '2026-09-01 20:00:00+0800'\n  AND order_time <  '2026-09-01 22:00:00+0800';\n", "explanation": "orders_by_day のクラスタリングキー order_time は既定の ASC なので、読み出すとそのまま早い順です。\n返される時刻は UTC です（2026-09-01T12:00:00Z が台湾時間の夜 8 時）。Cassandra は timestamp を常に UTC で保存します。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_time, order_id, total FROM orders_by_day\nWHERE order_day = '2026-09-01'\n  AND order_time >= '2026-09-01 20:00:00+0800'\n  AND order_time <  '2026-09-01 22:00:00+0800'", "table": {"columns": ["order_time", "order_id", "total"], "rows": [["2026-09-01T12:27:40.014Z", 77153, 3207], ["2026-09-01T12:37:18.848Z", 77154, 34664], ["2026-09-01T13:08:33.180Z", 77155, 539], ["2026-09-01T13:21:05.119Z", 77156, 4158], ["2026-09-01T13:24:10.128Z", 77157, 4746], ["2026-09-01T13:27:39.826Z", 77158, 4644]], "total": 6}}]}, {"id": "first-of-each-day", "chapter": "クラスタリングキーと時間バケット", "title": "毎日の最初の注文", "prompt": "2026-09-01、09-02、09-03 の 3 日間について、各日で最も早い注文。\norder_day、order_time、order_id を返します。\n", "hints": ["LIMIT は結果全体の上限です。「パーティションごと」の最大行数を制限する構文があります。"], "answer": "SELECT order_day, order_time, order_id FROM orders_by_day\nWHERE order_day IN ('2026-09-01', '2026-09-02', '2026-09-03')\nPER PARTITION LIMIT 1;\n", "explanation": "PER PARTITION LIMIT n は各パーティションの先頭 n 行だけを返し（クラスタリングキーの順序で）、Cassandra 版の「グループごとの上位 n 件」です。\nSQL では ROW_NUMBER() OVER (PARTITION BY …) を使わないとできません。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_day, order_time, order_id FROM orders_by_day\nWHERE order_day IN ('2026-09-01', '2026-09-02', '2026-09-03')\nPER PARTITION LIMIT 1", "table": {"columns": ["order_day", "order_time", "order_id"], "rows": [["2026-09-01", "2026-08-31T16:02:36.344Z", 77082], ["2026-09-02", "2026-09-01T16:21:32.455Z", 77169], ["2026-09-03", "2026-09-02T16:14:54.562Z", 77271]], "total": 3}}]}, {"id": "latest-buyers", "chapter": "クラスタリングキーと時間バケット", "title": "最近この商品を買った人", "prompt": "商品 540 が最近購入された 5 回分。customer_id、order_time を新しい順に返します。\n", "hints": ["注文明細は商品ごとにもう 1 部保存されています。"], "answer": "SELECT customer_id, order_time FROM items_by_product WHERE product_id = 540 LIMIT 5;\n", "explanation": "同じ明細が orders（注文ごと）と items_by_product（商品ごと）の 2 か所に保存されています。\nCassandra では書き込みが安価で、高くつくのはパーティションをまたぐ読み取りなので、「何部か多く書いて、どの検索も 1 パーティションだけを読むようにする」のが普通です。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT customer_id, order_time FROM items_by_product WHERE product_id = 540 LIMIT 5", "table": {"columns": ["customer_id", "order_time"], "rows": [[9323, "2026-09-10T15:16:18.484Z"], [14300, "2026-09-07T13:01:08.203Z"], [873, "2026-08-16T17:17:27.003Z"], [1421, "2026-08-07T20:29:41.004Z"], [1746, "2026-08-02T13:08:22.507Z"]], "total": 5}}]}, {"id": "filter-in-partition", "chapter": "クラスタリングキーと時間バケット", "title": "パーティション内でさらに絞り込む", "prompt": "会員 4242 の注文のうち、ステータスが returned（返品）のものはどれですか？order_id、total を返します。\n", "hints": ["status は主キーではないので、そのまま書くと拒否されます。", "既に単一パーティションに限定しているので、絞り込みのコストはこのパーティションの大きさだけで決まります。"], "answer": "SELECT order_id, total FROM orders_by_customer\nWHERE customer_id = 4242 AND status = 'returned'\nALLOW FILTERING;\n", "explanation": "ALLOW FILTERING 自体が悪いわけではありません。悪いのは「パーティションを限定していない」ALLOW FILTERING で、これはテーブル全体をスキャンします。\nパーティションキーを限定していれば、1 つのパーティション（この会員の数件の注文）の中で 1 行ずつ絞り込むだけなので、コストは小さいです。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT order_id, total FROM orders_by_customer\nWHERE customer_id = 4242 AND status = 'returned'\nALLOW FILTERING", "table": {"columns": ["order_id", "total"], "rows": [[39226, 36391]], "total": 1}}]}, {"id": "distinct-partitions", "chapter": "クラスタリングキーと時間バケット", "title": "すべてのカテゴリを一覧にする", "prompt": "products_by_category にはどのカテゴリがありますか？カテゴリごとに 1 行で、category だけを返します。順序は問いません。\n", "hints": ["DISTINCT はパーティションキーにしか使えません。"], "answer": "SELECT DISTINCT category FROM products_by_category;\n", "explanation": "DISTINCT はパーティションキー（と static 列）にしか使えず、各パーティションの先頭だけを読み、パーティション内の行は読みません。\nそれでもすべてのパーティションをたどるので、パーティションが多ければやはり全表スキャンです。順序はパーティションキーの token（ハッシュ値）順なので、ばらばらに見えます。\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "SELECT DISTINCT category FROM products_by_category", "table": {"columns": ["category"], "rows": [["運動鞋"], ["有線耳機"], ["彩妝"], ["飲料"], ["筆電"], ["保養"], ["廚房用品"], ["收納"], ["男裝"], ["女裝"]], "total": 19}}]}, {"id": "collections", "chapter": "コレクションと関数", "title": "set と map", "prompt": "商品 540 の tags（set）と、specs の color というキーの値を調べてください。2 つの列を返します。\n", "hints": ["map は 列['key'] で単一の値を取り出せます。"], "answer": "SELECT tags, specs['color'] FROM products WHERE product_id = 540;\n", "explanation": "set、list、map は「少量で、この行と一緒に読む」データ（数十個以内）を保存するのに向いています。\nfrozen でないコレクションは要素を 1 つだけ更新できます。frozen なコレクション（例えば orders.items の list<frozen<order_item>> の各要素）は丸ごと置き換えるしかありません。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT tags, specs['color'] FROM products WHERE product_id = 540", "table": {"columns": ["tags", "specs['color']"], "rows": [["['特價']", "白"]], "total": 1}}]}, {"id": "avg-decimal", "chapter": "コレクションと関数", "title": "平均注文金額", "prompt": "会員 4242 の注文件数、合計金額、平均金額（小数あり）、最大金額。4 つの数値を返します。\n", "hints": ["集約関数：COUNT、SUM、AVG、MIN、MAX。", "total は int で、AVG(int) の結果も int になります（小数は切り捨てられます）。"], "answer": "SELECT COUNT(*), SUM(total), AVG(CAST(total AS double)), MAX(total)\nFROM orders_by_customer WHERE customer_id = 4242;\n", "explanation": "CQL の AVG は列と同じ型を返します：int 列の平均は小数がそのまま切り捨てられます（9672.17 が 9672 になる）。\n小数が必要なら先に double か decimal に CAST します。集約も単一パーティション内でだけ使うことが推奨されています。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT COUNT(*), SUM(total), AVG(CAST(total AS double)), MAX(total)\nFROM orders_by_customer WHERE customer_id = 4242", "table": {"columns": ["count", "system.sum(total)", "system.avg(cast(total as double))", "system.max(total)"], "rows": [[6, 58033, 9672.166666666666, 36391]], "total": 1}}]}, {"id": "writetime", "chapter": "コレクションと関数", "title": "書き込み時刻", "prompt": "会員 4242 の name と、この列の書き込み時刻 WRITETIME（マイクロ秒）を調べてください。2 つの列を返します。\n", "hints": ["WRITETIME(列) はその列が最後に書き込まれたタイムスタンプを返します。"], "answer": "SELECT name, WRITETIME(name) FROM customers WHERE customer_id = 4242;\n", "explanation": "Cassandra では列の値（cell）ごとに、それ自身の書き込みタイムスタンプと TTL を持っています。同じ列が何度も書き込まれたときは、タイムスタンプが最大のものが勝ちます（last write wins）。\nこれがロックなしで、複数のレプリカ間でデータをマージできる理由です。主キーの列には WRITETIME がありません。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SELECT name, WRITETIME(name) FROM customers WHERE customer_id = 4242", "table": {"columns": ["name", "writetime(name)"], "rows": [["蘇建恩", 1791299097900541]], "total": 1}}]}, {"id": "batch-two-tables", "chapter": "書き込み", "title": "新規会員を 2 つのテーブルに書き込む", "prompt": "会員を 1 人追加します：customer_id 99999、name '測試會員'、email 'test99999@example.com'、\nsignup_date '2026-10-06'、vip_level 'normal'。\n会員データは customers と customers_by_email（email、customer_id、name）の両方に書き込む必要があります。\n", "hints": ["両方のテーブルに書き込み、しかも両方が最終的に成功することを保証する必要があります。", "BEGIN BATCH … APPLY BATCH で複数の文をまとめられます。"], "answer": "BEGIN BATCH\n  INSERT INTO customers (customer_id, name, email, signup_date, vip_level)\n  VALUES (99999, '測試會員', 'test99999@example.com', '2026-10-06', 'normal');\n  INSERT INTO customers_by_email (email, customer_id, name)\n  VALUES ('test99999@example.com', 99999, '測試會員');\nAPPLY BATCH;\n", "explanation": "logged BATCH（既定）はまずバッチ全体を batchlog に書き込み、「すべてが最終的に適用される」ことを保証します。非正規化した複数のテーブルの一貫性を保つために使います。\nトランザクションではありません：分離性がなく、他の人が半分だけ書き込まれた状態を読むことがあり、ROLLBACK もできません。\nBATCH は高速化のためのものでもありません：多数のパーティションにまたがるバッチは、かえってコーディネーターを遅くします。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "BEGIN BATCH\n  INSERT INTO customers (customer_id, name, email, signup_date, vip_level)\n  VALUES (99999, '測試會員', 'test99999@example.com', '2026-10-06', 'normal');\nINSERT INTO customers_by_email (email, customer_id, name)\n  VALUES ('test99999@example.com', 99999, '測試會員');\nAPPLY BATCH", "text": "完了（返却データなし）"}], "checks": [{"cmd": "SELECT customer_id, name, email, signup_date, vip_level, city FROM customers WHERE customer_id = 99999", "table": {"columns": ["customer_id", "name", "email", "signup_date", "vip_level", "city"], "rows": [[99999, "測試會員", "test99999@example.com", "2026-10-06", "normal", null]], "total": 1}}, {"cmd": "SELECT email, customer_id, name FROM customers_by_email WHERE email = 'test99999@example.com'", "table": {"columns": ["email", "customer_id", "name"], "rows": [["test99999@example.com", 99999, "測試會員"]], "total": 1}}]}, {"id": "update-set", "chapter": "書き込み", "title": "在庫を変更し、タグを追加", "prompt": "商品 540 が売り切れました：在庫（stock）を 0 にし、tags に '缺貨'（在庫切れ）を追加します（既存のタグは残します）。\n", "hints": ["set は tags = tags + {'…'} で要素を追加できます。"], "answer": "UPDATE products SET stock = 0, tags = tags + {'缺貨'} WHERE product_id = 540;\n", "explanation": "tags = tags + {…} は新しい要素だけを書き込み、set 全体を先に読み出す必要はありません。tags = {'缺貨'} と書くと set 全体が置き換えられ、\n元の「特價」が消えてしまいます。しかも丸ごと置き換えるとトゥームストーン（tombstone）も 1 つ生成されます。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UPDATE products SET stock = 0, tags = tags + {'缺貨'} WHERE product_id = 540", "text": "完了（返却データなし）"}], "checks": [{"cmd": "SELECT product_id, stock, tags FROM products WHERE product_id = 540", "table": {"columns": ["product_id", "stock", "tags"], "rows": [[540, 0, "['特價', '缺貨']"]], "total": 1}}]}, {"id": "map-update", "chapter": "書き込み", "title": "map のキーを 1 つ変更", "prompt": "商品 540 の仕様：specs の color を '黑'（黒）に変更し、'5g' というキーを削除します。他の仕様はそのままにします。\n", "hints": ["map は SET specs['key'] = 値 と書けます。", "キーの削除：DELETE specs['key'] FROM …、または SET specs = specs - {'key'}。"], "answer": "UPDATE products SET specs['color'] = '黑' WHERE product_id = 540;\nDELETE specs['5g'] FROM products WHERE product_id = 540;\n", "explanation": "frozen でない map では各キーが独立した cell なので、単独で更新・削除でき、map 全体を読み出して書き戻す必要はありません。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UPDATE products SET specs['color'] = '黑' WHERE product_id = 540", "text": "完了（返却データなし）"}, {"cmd": "DELETE specs['5g'] FROM products WHERE product_id = 540", "text": "完了（返却データなし）"}], "checks": [{"cmd": "SELECT specs FROM products WHERE product_id = 540", "table": {"columns": ["specs"], "rows": [["{color: '黑', screen_inch: '6.3', storage_gb: '128', warranty.type: '原廠', warranty.years: '2'}"]], "total": 1}}]}, {"id": "counter", "chapter": "書き込み", "title": "カウンタ", "prompt": "商品 540 がまた 1 件の注文で 2 個購入されました：product_sales の units に 2、orders に 1 を足します。\n", "hints": ["カウンタは UPDATE … SET 列 = 列 + n でしか変更できません。"], "answer": "UPDATE product_sales SET units = units + 2, orders = orders + 1 WHERE product_id = 540;\n", "explanation": "counter は分散環境での加減算で、先に読んでから書く必要はありません。ただし冪等ではありません：書き込みがタイムアウトした後に再試行すると、2 回加算されることがあります。\nそのためカウンタは統計（閲覧数、販売数）には向いていますが、正確さが必要な金額や在庫には向いていません。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UPDATE product_sales SET units = units + 2, orders = orders + 1 WHERE product_id = 540", "text": "完了（返却データなし）"}], "checks": [{"cmd": "SELECT product_id, units, orders FROM product_sales WHERE product_id = 540", "table": {"columns": ["product_id", "units", "orders"], "rows": [[540, 217, 141]], "total": 1}}]}, {"id": "lwt-insert", "chapter": "書き込み", "title": "email の重複登録を防ぐ", "prompt": "誰かが email 'user04242@example.com' で新しい会員（customer_id 99999、name '冒用者'、なりすまし）を登録しようとしています。\ncustomers_by_email に書き込みますが、email が既に存在する場合は元のデータを上書きしてはいけません。\n", "hints": ["Cassandra の INSERT は既定でそのまま上書きし（upsert）、主キーの重複を報告しません。", "INSERT … IF NOT EXISTS は軽量トランザクション（LWT）です。"], "answer": "INSERT INTO customers_by_email (email, customer_id, name)\nVALUES ('user04242@example.com', 99999, '冒用者')\nIF NOT EXISTS;\n", "explanation": "IF NOT EXISTS は Paxos でまずこの主キーがまだ存在しないことを確認してから書き込みます。返される [applied] で書き込みに成功したかが分かり、\n失敗したときは現在の値も返されます。代償はノード間の往復が何回も増えること（通常の書き込みの約 4 倍の遅延）で、本当に「確認してから書く」必要がある場所でだけ使います。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "INSERT INTO customers_by_email (email, customer_id, name)\nVALUES ('user04242@example.com', 99999, '冒用者')\nIF NOT EXISTS", "table": {"columns": ["[applied]", "email", "customer_id", "name"], "rows": [[false, "user04242@example.com", 4242, "蘇建恩"]], "total": 1}}], "checks": [{"cmd": "SELECT email, customer_id, name FROM customers_by_email WHERE email = 'user04242@example.com'", "table": {"columns": ["email", "customer_id", "name"], "rows": [["user04242@example.com", 4242, "蘇建恩"]], "total": 1}}]}, {"id": "lwt-update", "chapter": "書き込み", "title": "楽観的ロック", "prompt": "商品 540 の価格を 27999 に変えたいのですが、価格が「まだ 30000」のときだけ変更します\n（以前読んだ値は 30000 でしたが、誰かに変えられているかもしれません）。\n", "hints": ["UPDATE … IF 列 = 値 は、条件が成り立たないときは書き込みません。"], "answer": "UPDATE products SET price = 27999 WHERE product_id = 540 IF price = 30000;\n", "explanation": "現在の価格は 29949 なので条件は成り立たず、[applied] = false で価格は変わりません。返される price 列が現在の値です。\nこれが compare-and-set（楽観的ロック）です：データをロックせず、条件付き書き込みで誰かが先に変更したかを検出します。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UPDATE products SET price = 27999 WHERE product_id = 540 IF price = 30000", "table": {"columns": ["[applied]", "price"], "rows": [[false, 29949]], "total": 1}}], "checks": [{"cmd": "SELECT product_id, price FROM products WHERE product_id = 540", "table": {"columns": ["product_id", "price"], "rows": [[540, 29949]], "total": 1}}]}, {"id": "ttl-update", "chapter": "書き込み", "title": "自動で消える列", "prompt": "会員 4242 がキャンペーンに参加し、vip_level を一時的に 'gold' に上げ、24 時間（86400 秒）後に自動で失効させます。\n", "hints": ["USING TTL 秒数 を、UPDATE テーブル名 の後に書きます。"], "answer": "UPDATE customers USING TTL 86400 SET vip_level = 'gold' WHERE customer_id = 4242;\n", "explanation": "TTL は行全体ではなく「今回書き込んだ列」に設定されます：時間が来ると vip_level だけが消え（トゥームストーンになる）、name、city は残ります。\n行全体を期限切れにしたいなら、INSERT … USING TTL で行全体を書き直すか、テーブル作成時に default_time_to_live を設定します。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UPDATE customers USING TTL 86400 SET vip_level = 'gold' WHERE customer_id = 4242", "text": "完了（返却データなし）"}], "checks": [{"cmd": "SELECT customer_id, vip_level, (TTL(vip_level) + 60) / 3600 AS hours_left, city FROM customers WHERE customer_id = 4242", "table": {"columns": ["customer_id", "vip_level", "hours_left", "city"], "rows": [[4242, "gold", 24, "台北市"]], "total": 1}}]}, {"id": "range-delete", "chapter": "書き込み", "title": "ある期間のデータを削除", "prompt": "会員 1 が 2023 年より前（台湾時間 2023-01-01 より前）の注文記録の削除を求めています。\norders_by_customer からこれらの行を、CQL 1 文で削除してください。\n", "hints": ["DELETE の WHERE ではクラスタリングキーに範囲を使えます。"], "answer": "DELETE FROM orders_by_customer\nWHERE customer_id = 1 AND order_time < '2023-01-01 00:00:00+0800';\n", "explanation": "範囲削除は、範囲に何行あっても「1 つ」の範囲トゥームストーン（range tombstone）しか書き込みません。\n先に 39 件を検索して 1 件ずつ削除すると 39 個のトゥームストーンが生成され、以後このパーティションを読むたびにそれらを飛ばす必要があります（実験室でトゥームストーンの影響を実演しています）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "DELETE FROM orders_by_customer\nWHERE customer_id = 1 AND order_time < '2023-01-01 00:00:00+0800'", "text": "完了（返却データなし）"}], "checks": [{"cmd": "SELECT COUNT(*) FROM orders_by_customer WHERE customer_id = 1", "table": {"columns": ["count"], "rows": [[113]], "total": 1}}, {"cmd": "SELECT order_time, order_id FROM orders_by_customer WHERE customer_id = 1 ORDER BY order_time ASC LIMIT 1", "table": {"columns": ["order_time", "order_id"], "rows": [["2023-01-02T04:21:15.006Z", 4358]], "total": 1}}]}, {"id": "delete-column", "chapter": "書き込み", "title": "列を 1 つ削除", "prompt": "会員 4242 が誕生日データの削除を求めています：birth_date だけを削除し、他の列は残します。\n", "hints": ["DELETE 列名 FROM テーブル WHERE …"], "answer": "DELETE birth_date FROM customers WHERE customer_id = 4242;\n", "explanation": "Cassandra では、列の DELETE と UPDATE … SET birth_date = null の効果は同じで、どちらもトゥームストーンを書き込みます。\nデータはすぐにはディスクから消えず、gc_grace_seconds（既定 10 日）が過ぎた後の compaction で本当に消去されます。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "DELETE birth_date FROM customers WHERE customer_id = 4242", "text": "完了（返却データなし）"}], "checks": [{"cmd": "SELECT customer_id, name, birth_date, city FROM customers WHERE customer_id = 4242", "table": {"columns": ["customer_id", "name", "birth_date", "city"], "rows": [[4242, "蘇建恩", null, "台北市"]], "total": 1}}]}], "traps": [{"id": "insert-is-upsert", "title": "既に存在する主キーを INSERT する", "question": "customers_by_email には既に user04242@example.com の行（customer_id 4242）があります。同じ email でもう一度 INSERT すると何が起きますか？", "options": ["エラー：主キーの重複", "成功し、元の行が 99999 で上書きされる", "成功し、同じ email の行が 2 行になる"], "answer": 1, "explanation": "Cassandra は書き込み前に読まないので、この主キーが「既に存在する」ことを知りません。INSERT も UPDATE も upsert で、新しいバージョンを書き込み、読み取り時にタイムスタンプの新しい方が勝ちます。\n「存在しないときだけ書き込む」には IF NOT EXISTS（軽量トランザクション）が必要で、代償はノード間の往復が何回も増えることです。\n面接でよく聞かれる「なぜ Cassandra の書き込みはこんなに速いのか」の理由の 1 つが、この「書き込み前に読まない」ことです。\n", "setup": null, "scripts": [{"label": "同じ主キーを INSERT", "code": "INSERT INTO customers_by_email (email, customer_id, name)\nVALUES ('user04242@example.com', 99999, '冒用者');\nSELECT * FROM customers_by_email WHERE email = 'user04242@example.com';\n"}], "results": [[{"cmd": "INSERT INTO customers_by_email (email, customer_id, name)\nVALUES ('user04242@example.com', 99999, '冒用者')", "text": "完了（返却データなし）"}, {"cmd": "SELECT * FROM customers_by_email WHERE email = 'user04242@example.com'", "table": {"columns": ["email", "customer_id", "name"], "rows": [["user04242@example.com", 99999, "冒用者"]], "total": 1}}]]}, {"id": "update-creates-row", "title": "存在しない商品を UPDATE する", "question": "products に商品 99999 はありません。UPDATE products SET stock = 5 WHERE product_id = 99999 を実行した後、この商品は見つかりますか？", "options": ["見つかる：stock だけに値がある行が 1 行増える", "見つからない：UPDATE は行を見つけられず、0 行に影響", "エラー：行が存在しない"], "answer": 0, "explanation": "UPDATE も upsert で、行が存在するかを先に確認しないので、stock だけを持つ商品の行が「生えて」きます。\nこれを避けるには UPDATE … IF EXISTS（軽量トランザクション）と書きます。\n細かな違い：INSERT は「行マーカー」（row marker）を書き込みますが、UPDATE は書き込みません。そのため UPDATE で作られた行は、stock を削除すると行全体が消えます。\n", "setup": null, "scripts": [{"label": "存在しない主キーを UPDATE", "code": "UPDATE products SET stock = 5 WHERE product_id = 99999;\nSELECT product_id, name, price, stock FROM products WHERE product_id = 99999;\n"}], "results": [[{"cmd": "UPDATE products SET stock = 5 WHERE product_id = 99999", "text": "完了（返却データなし）"}, {"cmd": "SELECT product_id, name, price, stock FROM products WHERE product_id = 99999", "table": {"columns": ["product_id", "name", "price", "stock"], "rows": [[99999, null, null, 5]], "total": 1}}]]}, {"id": "filter-needs-key", "title": "主キーでない列で検索する", "question": "orders テーブルの主キーは order_id です。WHERE customer_id = 4242 で直接検索すると（ALLOW FILTERING なし）、結果は？", "options": ["どちらも 6 件返るが、1 つ目の方が遅いだけ", "1 つ目は 0 件を返す", "1 つ目は拒否され、ALLOW FILTERING が必要"], "answer": 2, "explanation": "パーティションキーがないと、Cassandra はデータがどのノードにあるか分からず、すべてのノードに問い合わせてテーブル全体をスキャンするしかありません。黙ってスキャンするのではなく、はっきり拒否します。\nALLOW FILTERING を付ければ実行されます（実験室で計測しています：6 行のために 8 万行を読む）。\n正しい解決策は customer_id をパーティションキーにしたテーブル（orders_by_customer）を作ること、あるいは少量のデータなら SAI インデックスを使うことです。\n", "setup": null, "scripts": [{"label": "orders：customer_id は主キーではない", "code": "SELECT order_id, total FROM orders WHERE customer_id = 4242;\n"}, {"label": "orders_by_customer：customer_id はパーティションキー", "code": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 4242;\n"}], "results": [[{"cmd": "SELECT order_id, total FROM orders WHERE customer_id = 4242", "text": "InvalidQueryException：Cannot execute this query as it might involve data filtering and thus may have unpredictable performance. If you want to execute this query despite the performance unpredictability, use ALLOW FILTERING", "error": true}], [{"cmd": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 4242", "table": {"columns": ["order_id", "total"], "rows": [[59901, 3098], [42762, 7517], [39226, 36391], [16901, 4596], [15943, 1647], [6116, 4784]], "total": 6}}]]}, {"id": "order-by-non-clustering", "title": "金額で並べ替える", "question": "会員 4242 の注文を金額の高い順に見たい：SELECT … FROM orders_by_customer WHERE customer_id = 4242 ORDER BY total DESC。結果は？", "options": ["エラー：ORDER BY にはクラスタリングキーしか使えない", "金額の高い順に並ぶ", "成功するが順序は変わらない（ORDER BY は無視される）"], "answer": 0, "explanation": "Cassandra はクエリ時に並べ替えをしません。「保存されている順」か「完全な逆順」でしか読めません。\nパーティション内の順序はクラスタリングキーで決まるので、ORDER BY にはクラスタリングキーしか書けません。\n金額で並べ替えたいなら、この会員の注文を取得してからアプリケーションで並べ替える（1 つのパーティションは通常小さい）か、total をクラスタリングキーにした別のテーブルを作ります。\n", "setup": null, "scripts": [{"label": "クラスタリングキーでない列で ORDER BY", "code": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 4242 ORDER BY total DESC;\n"}], "results": [[{"cmd": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 4242 ORDER BY total DESC", "text": "InvalidQueryException：Order by is currently only supported on the clustered columns of the PRIMARY KEY, got total", "error": true}]]}, {"id": "skip-clustering", "title": "前のクラスタリングキーを飛ばす", "question": "orders_by_day の主キーは ((order_day), order_time, order_id) です。WHERE order_day = '2026-09-01' AND order_id = 77082（order_time を限定しない）の結果は？", "options": ["注文 77082 が返る", "エラー：order_id の前の order_time が限定されていない", "0 件が返る"], "answer": 1, "explanation": "パーティション内の行は (order_time, order_id) で並んでいます。電話帳が「姓、名」で並んでいるようなもので、「名」だけでは正しい位置を引けません。\nクラスタリングキーは左から順にしか限定できず、しかも前の列で範囲（>、<）を使ったら、それ以降の列は限定できません。\nこれは SQL の複合インデックスの「最左プレフィックス」と同じ理屈です。\n", "setup": null, "scripts": [{"label": "order_time を飛ばして order_id を限定", "code": "SELECT order_time, order_id FROM orders_by_day\nWHERE order_day = '2026-09-01' AND order_id = 77082;\n"}], "results": [[{"cmd": "SELECT order_time, order_id FROM orders_by_day\nWHERE order_day = '2026-09-01' AND order_id = 77082", "text": "InvalidQueryException：PRIMARY KEY column \"order_id\" cannot be restricted as preceding column \"order_time\" is not restricted", "error": true}]]}, {"id": "count-star", "title": "テーブル全体の COUNT(*)", "question": "SELECT COUNT(*) FROM orders（WHERE なし）はどうなりますか？", "options": ["エラー：ALLOW FILTERING が必要", "すぐに 80000 を返す（Cassandra は件数を記録している）", "80000 を返すが、テーブル全体を読み、警告も付く"], "answer": 2, "explanation": "Cassandra は「テーブルに何行あるか」を記録していないので、COUNT(*) は実際にすべての行を読んで数えるしかありません（所要時間を見てください：数百ミリ秒 vs 数ミリ秒）。\nサーバーは「Aggregation query used without partition key」という警告も返します。データ量が多いとタイムアウトします。\n件数を知るには：書き込み時にカウンタテーブルで集計する、nodetool tablestats で推定値を見る、Spark のようなツールを使う、などの方法があります。\n", "setup": null, "scripts": [{"label": "パーティションキーなしの COUNT(*)", "code": "SELECT COUNT(*) FROM orders;\n"}, {"label": "単一パーティションの COUNT(*)", "code": "SELECT COUNT(*) FROM orders_by_customer WHERE customer_id = 4242;\n"}], "results": [[{"cmd": "SELECT COUNT(*) FROM orders", "table": {"columns": ["count"], "rows": [[80000]], "total": 1}, "warn": ["Aggregation query used without partition key"]}], [{"cmd": "SELECT COUNT(*) FROM orders_by_customer WHERE customer_id = 4242", "table": {"columns": ["count"], "rows": [[6]], "total": 1}}]]}, {"id": "avg-int", "title": "int 列の AVG", "question": "会員 4242 の 6 件の注文の合計は 58033 で、平均は 9672.17 です。SELECT AVG(total)（total は int）は何を返しますか？", "options": ["9672（小数は切り捨て）", "9672.17", "エラー：AVG は int に使えない"], "answer": 0, "explanation": "CQL の AVG は入力と同じ型を返します。int の平均は int で、小数はそのまま切り捨てられます（PostgreSQL なら numeric を返します）。\n小数が必要なら先に double か decimal に CAST します。SUM(int) も同様に int で、金額が大きいとオーバーフローすることがあるので、先に bigint / varint に CAST できます。\n", "setup": null, "scripts": [{"label": "AVG(int)", "code": "SELECT AVG(total) FROM orders_by_customer WHERE customer_id = 4242;\n"}, {"label": "先に double に CAST", "code": "SELECT AVG(CAST(total AS double)) FROM orders_by_customer WHERE customer_id = 4242;\n"}], "results": [[{"cmd": "SELECT AVG(total) FROM orders_by_customer WHERE customer_id = 4242", "table": {"columns": ["system.avg(total)"], "rows": [[9672]], "total": 1}}], [{"cmd": "SELECT AVG(CAST(total AS double)) FROM orders_by_customer WHERE customer_id = 4242", "table": {"columns": ["system.avg(cast(total as double))"], "rows": [[9672.166666666666]], "total": 1}}]]}, {"id": "older-timestamp", "title": "古いタイムスタンプで書き込む", "question": "まず UPDATE products USING TIMESTAMP 1000 SET stock = 999（タイムスタンプ 1000 マイクロ秒、つまり 1970 年）を実行し、次に stock を読むといくつですか？現在の stock は 11 です。", "options": ["999：最後に実行した文が勝つ", "11：タイムスタンプが古いので、古い書き込みとして扱われる", "エラー：タイムスタンプを既存のデータより前にはできない"], "answer": 1, "explanation": "Cassandra は実行の順序ではなく、「列ごとのタイムスタンプ」で勝者を決めます（last write wins）。\nこの書き込みは成功していますが、読み取り時に 2 つのバージョンがあり、タイムスタンプの新しい 11 が勝つので、999 は無視されたのと同じです。\n実務での影響：アプリケーションサーバーの時計がずれていると、後から書いたデータが先に書いたデータに「負ける」ことがあります。\n", "setup": null, "scripts": [{"label": "とても古いタイムスタンプで書き込む", "code": "UPDATE products USING TIMESTAMP 1000 SET stock = 999 WHERE product_id = 540;\nSELECT stock, WRITETIME(stock) FROM products WHERE product_id = 540;\n"}], "results": [[{"cmd": "UPDATE products USING TIMESTAMP 1000 SET stock = 999 WHERE product_id = 540", "text": "完了（返却データなし）"}, {"cmd": "SELECT stock, WRITETIME(stock) FROM products WHERE product_id = 540", "table": {"columns": ["stock", "writetime(stock)"], "rows": [[11, 1791607978494795]], "total": 1}}]]}, {"id": "ttl-per-cell", "title": "TTL は何に設定される？", "question": "UPDATE customers USING TTL 86400 SET city = '台南市' WHERE customer_id = 4242。1 日後、この会員のデータはどうなりますか？", "options": ["行全体が消える", "何も変わらない。TTL は INSERT にしか効かない", "city だけが消え、他の列は残る"], "answer": 2, "explanation": "TTL は列の値（cell）ごとに属し、今回書き込んだ city だけが 86400 秒の TTL を持ちます。name の TTL は null（期限切れにならない）です。\n時間が来ると city はトゥームストーンになり、行自体は残ります。行全体を期限切れにしたいなら、INSERT … USING TTL で行全体を書き直すか、\nテーブル作成時に default_time_to_live を設定します。\n", "setup": null, "scripts": [{"label": "city だけに TTL を設定", "code": "UPDATE customers USING TTL 86400 SET city = '台南市' WHERE customer_id = 4242;\nSELECT name, TTL(name), city, TTL(city) FROM customers WHERE customer_id = 4242;\n"}], "results": [[{"cmd": "UPDATE customers USING TTL 86400 SET city = '台南市' WHERE customer_id = 4242", "text": "完了（返却データなし）"}, {"cmd": "SELECT name, TTL(name), city, TTL(city) FROM customers WHERE customer_id = 4242", "table": {"columns": ["name", "ttl(name)", "city", "ttl(city)"], "rows": [["蘇建恩", null, "台南市", 86400]], "total": 1}}]]}, {"id": "null-is-tombstone", "title": "null を書き込む", "question": "会員を INSERT するとき、city 列を明示的に null と書きました。Cassandra はどう処理しますか？（クエリトレースの tombstone cells を見てください）", "options": ["null を書くとトゥームストーン（tombstone）が保存される", "両者は同じ：null は値がないので何も保存されない", "エラー：null は書き込めない"], "answer": 0, "explanation": "Cassandra では「列を null にする」ことは「列を削除する」ことと同じで、トゥームストーンが書き込まれ、読み取り時にそれを読んでから飛ばす必要があります。\nトレースを見てください：null を書いた方は「Read 1 live rows and 1 tombstone cells」、書かなかった方は 0 です。\nORM や prepared statement を使うときに特にはまりやすい点です（すべての列をバインドし、値がないものは null をバインドしてしまう）。\ndriver 4 ではそのパラメータをバインドしない（unset）ことができ、このプロジェクトのデータ読み込みもそうしています。\n", "setup": null, "scripts": [{"label": "city に null を書く", "code": "INSERT INTO customers (customer_id, name, city) VALUES (99999, '測試', null);\nTRACING ON;\nSELECT * FROM customers WHERE customer_id = 99999;\n"}, {"label": "city を書かない（INSERT に含めない）", "code": "INSERT INTO customers (customer_id, name) VALUES (99998, '測試');\nTRACING ON;\nSELECT * FROM customers WHERE customer_id = 99998;\n"}], "results": [[{"cmd": "INSERT INTO customers (customer_id, name, city) VALUES (99999, '測試', null)", "text": "完了（返却データなし）"}, {"cmd": "TRACING ON", "text": "Tracing is enabled."}, {"cmd": "SELECT * FROM customers WHERE customer_id = 99999", "table": {"columns": ["customer_id", "birth_date", "city", "email", "gender", "name", "signup_date", "vip_level"], "rows": [[99999, null, null, null, null, "測試", null, null]], "total": 1}}], [{"cmd": "INSERT INTO customers (customer_id, name) VALUES (99998, '測試')", "text": "完了（返却データなし）"}, {"cmd": "TRACING ON", "text": "Tracing is enabled."}, {"cmd": "SELECT * FROM customers WHERE customer_id = 99998", "table": {"columns": ["customer_id", "birth_date", "city", "email", "gender", "name", "signup_date", "vip_level"], "rows": [[99998, null, null, null, null, "測試", null, null]], "total": 1}}]]}, {"id": "counter-insert", "title": "カウンタテーブルへの INSERT", "question": "product_sales はカウンタテーブルです。INSERT INTO product_sales (product_id, units, orders) VALUES (99999, 1, 1) はどうなりますか？", "options": ["成功する。UPDATE と同じ", "エラー：カウンタテーブルには UPDATE しか使えない", "成功するが、units と orders はどちらも 0"], "answer": 1, "explanation": "counter は加減算しかできず、特定の値を直接設定できないので、INSERT も UPDATE … SET units = 5 もできません。\n存在しない counter は 0 から加算されます。カウンタテーブルには主キー以外に counter 列しか置けず、TTL も設定できません。\n", "setup": null, "scripts": [{"label": "カウンタに INSERT", "code": "INSERT INTO product_sales (product_id, units, orders) VALUES (99999, 1, 1);\n"}, {"label": "カウンタを UPDATE", "code": "UPDATE product_sales SET units = units + 1, orders = orders + 1 WHERE product_id = 99999;\nSELECT * FROM product_sales WHERE product_id = 99999;\n"}], "results": [[{"cmd": "INSERT INTO product_sales (product_id, units, orders) VALUES (99999, 1, 1)", "text": "InvalidQueryException：INSERT statements are not allowed on counter tables, use UPDATE instead", "error": true}], [{"cmd": "UPDATE product_sales SET units = units + 1, orders = orders + 1 WHERE product_id = 99999", "text": "完了（返却データなし）"}, {"cmd": "SELECT * FROM product_sales WHERE product_id = 99999", "table": {"columns": ["product_id", "orders", "units"], "rows": [[99999, 1, 1]], "total": 1}}]]}], "steps": [{"id": "partition-key", "title": "パーティションキーあり vs なし", "goal": "同じ「会員 4242 の注文」を、customer_id をパーティションキーにしたテーブルと、ALLOW FILTERING で無理やり検索する方法で比べます。", "question": "どちらも 6 行を返します。トレースの「読み取り行数」を見てください：B はこの 6 行のために何行読みましたか？", "takeaway": "A は「Executing single-partition query」：パーティションキーから token を計算し、その 1 つのパーティションを直接読むので、6 行しか読みません。\nB は「Submitting range requests」+「seq scan」：テーブル全体の 8 万行を読み、条件に合わないものを捨てます。\nここではノードが 1 つでデータもすべてメモリにあるので、B でも数百ミリ秒で済みます。本番環境でデータが複数のマシンに数百 GB あれば、B はタイムアウトし、クラスタ全体も遅くします。\nこれが Cassandra の第一のルールです：すべてのクエリに完全なパーティションキーが必要です。そのために、同じデータを複数のテーブルに保存することがよくあります。\n", "setup": [], "queries": [{"label": "A：orders_by_customer（customer_id がパーティションキー）", "code": "SELECT order_id, order_time, total FROM orders_by_customer WHERE customer_id = 4242"}, {"label": "B：orders + ALLOW FILTERING", "code": "SELECT order_id, order_time, total FROM orders WHERE customer_id = 4242 ALLOW FILTERING"}]}, {"id": "clustering-slice", "title": "クラスタリングキー：必要な区間だけを読む", "goal": "会員 1 には 152 件の注文があります（最大のパーティション）。パーティション全体の読み取り、LIMIT、クラスタリングキーで期間を切り出す方法を比較します。", "question": "B と C はそれぞれ何行読みましたか？A の 152 行と比べるとどうですか？", "takeaway": "パーティション内のデータはクラスタリングキーで並んだ状態でまとめて保存されているので、LIMIT 3 は先頭 3 行だけ、期間指定もその区間だけを読み、パーティション全体を読んでから絞り込む必要はありません。\nクラスタリングキーを設計するときは「最もよく必要になるのはどの区間か」を考えます。新しい順（DESC）、期間、価格帯はどれもクラスタリングキーの典型的な使い方です。\n", "setup": [], "queries": [{"label": "A：パーティション全体", "code": "SELECT order_id, order_time FROM orders_by_customer WHERE customer_id = 1"}, {"label": "B：最新 3 件（LIMIT 3）", "code": "SELECT order_id, order_time FROM orders_by_customer WHERE customer_id = 1 LIMIT 3"}, {"label": "C：2025 年（クラスタリングキーの範囲）", "code": "SELECT order_id, order_time FROM orders_by_customer\nWHERE customer_id = 1\n  AND order_time >= '2025-01-01 00:00:00+0800'\n  AND order_time <  '2026-01-01 00:00:00+0800'\n"}]}, {"id": "time-bucket", "title": "時間バケット vs 時間範囲スキャン", "goal": "「2026-09-01 の注文」を検索します：1 日 1 パーティションの orders_by_day を使う方法と、orders_by_day でパーティションキーを指定せず時間範囲だけを使う方法です。", "question": "A と B が読んだ行数は実は同じ（どちらも 87 行）です。では何が違うのでしょう？「読み取り方法」を見てください。C はいくつのパーティションを読みましたか？", "takeaway": "A は「単一パーティション」：order_day から token を計算し、その日のパーティションを直接見つけます。\nB は「範囲スキャン」：order_time はクラスタリングキーですが、クラスタリングキーは同じパーティション内でしか並んでいません。パーティションキーがないと、Cassandra は 1,728 個すべてのパーティション（1 日 1 つ）をたどり、\n各パーティションで該当する区間を切り出す必要があります。読んだ行数は同じでも、「すべてのパーティションをたどる」コストが加わります。\nここではノードが 1 つでデータ量も少ないので 1〜2 ミリ秒遅いだけですが、複数ノードのクラスタでは範囲スキャンは「すべてのノード」に問い合わせる必要があり、データが多いほど遅くなり、他のクエリにも影響します。\nC は IN で 7 つのパーティションを読みます。これがある期間を検索する正しい方法です（またはアプリケーションから 7 つのクエリを並行して送ります）。\nバケットの粒度はトレードオフです：パーティションが大きすぎる（例えば 1 か月）とホットスポットになり読み取りが遅くなり、小さすぎる（例えば 1 分）とある期間を検索するのに多くのパーティションを読む必要があります。\n一般的には、1 つのパーティションは 100 MB 以下、10 万行以内が推奨されています。\n", "setup": [], "queries": [{"label": "A：パーティションキー order_day", "code": "SELECT COUNT(*) FROM orders_by_day WHERE order_day = '2026-09-01'"}, {"label": "B：order_time の範囲だけ（ALLOW FILTERING）", "code": "SELECT COUNT(*) FROM orders_by_day\nWHERE order_time >= '2026-09-01 00:00:00+0800' AND order_time < '2026-09-02 00:00:00+0800'\nALLOW FILTERING\n"}, {"label": "C：1 週間（IN で 7 パーティション）", "code": "SELECT COUNT(*) FROM orders_by_day\nWHERE order_day IN ('2026-09-01', '2026-09-02', '2026-09-03', '2026-09-04', '2026-09-05', '2026-09-06', '2026-09-07')\n"}]}, {"id": "sai-index", "title": "SAI インデックス：新しいテーブルを作らずに他の列で検索", "goal": "Cassandra 5.0 の SAI（Storage-Attached Index）を使うと、orders も customer_id で検索できます。まず 1 回実行し（拒否されます）、インデックスを作成してからもう一度実行します。", "question": "インデックスがあると、A は何行読みましたか？所要時間は B と比べてどうですか？", "takeaway": "SAI は各 SSTable の隣にインデックスを作り、検索時はまずインデックスで該当する主キーを見つけてからその行を読むので、全表スキャンは不要です。\nしかしそれでも「各ノードのローカルインデックス」です：複数ノードのクラスタでは、コーディネーターがすべてのノードに問い合わせる必要があり（scatter-gather）、ノードが多いほど高くつきます。\nそのため SAI に向いているのは：頻度の低いクエリ、パーティションキーと組み合わせた検索、データ量の多くないテーブルです。頻度の高い主要なクエリには、やはり専用のテーブル（B）を作ります。\n旧来のセカンダリインデックス（2i）や SASI には多くの制限があり、Cassandra 5.0 以降は SAI が推奨されています。\n", "setup": ["CREATE INDEX IF NOT EXISTS orders_customer_idx ON orders (customer_id) USING 'sai'"], "queries": [{"label": "A：orders を customer_id で検索（ALLOW FILTERING なし）", "code": "SELECT order_id, order_time, total FROM orders WHERE customer_id = 4242"}, {"label": "B：orders_by_customer（比較用）", "code": "SELECT order_id, order_time, total FROM orders_by_customer WHERE customer_id = 4242"}]}, {"id": "sai-multi", "title": "SAI：コレクションと複数の条件", "goal": "商品テーブルは 1,500 件だけなので、SAI に向いています。tags と price のインデックスを作り、「熱銷（人気）タグがあり、1,000 元以下」の商品を検索します。", "question": "インデックスがないとき、この 2 つのクエリはどうなりますか？インデックス作成後はそれぞれ何行返しますか？", "takeaway": "SAI はコレクション（CONTAINS / CONTAINS KEY）と範囲（< >）に対応しており、複数の SAI 条件を AND で組み合わせると、Cassandra は積集合を取ります。\n比較：インデックスがないときは ALLOW FILTERING を付けないと検索できず、しかも全表スキャンになります。\n面接でよく聞く「Cassandra のクエリの柔軟性はとても低い」という話は 5.0 以降改善されましたが、核心の原則は変わりません：主要なクエリはテーブル設計に頼り、インデックスは補助です。\n", "setup": ["CREATE INDEX IF NOT EXISTS products_tags_idx ON products (tags) USING 'sai'", "CREATE INDEX IF NOT EXISTS products_price_idx ON products (price) USING 'sai'"], "queries": [{"label": "A：tags CONTAINS（set の要素）", "code": "SELECT product_id, name, price, tags FROM products WHERE tags CONTAINS '熱銷'"}, {"label": "B：tags + price の範囲（2 つのインデックスを併用）", "code": "SELECT product_id, name, price FROM products WHERE tags CONTAINS '熱銷' AND price < 1000"}]}, {"id": "filter-in-partition", "title": "ALLOW FILTERING が高くないこともある", "goal": "同じく status = 'returned' で絞り込みますが、一方は会員 4242 のパーティション内に限定し、もう一方はパーティションを限定しません（LIMIT 5 付き）。", "question": "A、B、C はそれぞれ何行読みましたか？", "takeaway": "ALLOW FILTERING のコスト = 結果を見つけるために読んだ行数です。\nA は 1 つのパーティション内で絞り込むだけで 6 行を読みます。B はパーティションキーがありませんが 5 件見つかった時点で止まるので、読む行数は条件に合うデータがどれだけ「密」かで決まります。C はテーブル全体をスキャンする必要があります。\nつまり大事なのは「ALLOW FILTERING を書いてはいけない」ではなく、それがどれだけのデータを読むかを知っておくことです。\n", "setup": [], "queries": [{"label": "A：パーティション内で絞り込み", "code": "SELECT order_id, total FROM orders_by_customer WHERE customer_id = 4242 AND status = 'returned' ALLOW FILTERING"}, {"label": "B：パーティションキーなし、ただし 5 件だけ", "code": "SELECT order_id, total FROM orders WHERE status = 'returned' LIMIT 5 ALLOW FILTERING"}, {"label": "C：パーティションキーなし、すべて", "code": "SELECT COUNT(*) FROM orders WHERE status = 'returned' ALLOW FILTERING"}]}]}, {"id": "neo4j", "name": "Neo4j", "lang": "cypher", "labName": "PROFILE 実験", "labNote": "各クエリの先頭に PROFILE を付け、実行計画の最初のステップ（NodeByLabelScan か IndexSeek）と合計 db hits（ストレージへのアクセス回数）を比較します。", "hasResults": true, "exercises": [{"id": "find-customer", "chapter": "基本の MATCH", "title": "会員を 1 人探す", "prompt": "会員 4242 の氏名（name）と会員レベル（vipLevel）を調べてください。\n", "hints": ["MATCH (変数:ラベル {プロパティ: 値}) RETURN 変数.プロパティ"], "answer": "MATCH (c:Customer {id: 4242})\nRETURN c.name, c.vipLevel\n", "explanation": "MATCH は探したいものを「パターン」で表します：(c:Customer {id: 4242}) はラベルが Customer で id が 4242 のノードです。\nCustomer.id には一意制約（インデックス付き）があるので、これはインデックス検索（NodeUniqueIndexSeek）になり、全会員をスキャンする必要はありません。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (c:Customer {id: 4242})\nRETURN c.name, c.vipLevel", "table": {"columns": ["c.name", "c.vipLevel"], "rows": [["蘇建恩", "normal"]], "total": 1}}]}, {"id": "customer-city", "chapter": "基本の MATCH", "title": "リレーションシップを 1 歩たどる", "prompt": "会員 4242 はどの都市に住んでいますか？都市名を返してください。\n", "hints": ["都市は会員のプロパティではなく、(:Customer)-[:LIVES_IN]->(:City) というリレーションシップが指すノードです。"], "answer": "MATCH (:Customer {id: 4242})-[:LIVES_IN]->(city:City)\nRETURN city.name\n", "explanation": "グラフデータベースでは、「関連」は保存されたリレーションシップであり、クエリ時に外部キーで突き合わせるものではありません。\n会員ノードから LIVES_IN リレーションシップを直接たどって都市ノードに行くので（index-free adjacency）、コストはこの会員のリレーションシップの数だけで決まり、会員の総数とは関係ありません。\n使わないノードには変数名を付けなくて構いません。例えばここの (:Customer {id: 4242}) です。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Customer {id: 4242})-[:LIVES_IN]->(city:City)\nRETURN city.name", "table": {"columns": ["city.name"], "rows": [["台北市"]], "total": 1}}]}, {"id": "customer-orders", "chapter": "基本の MATCH", "title": "会員の注文", "prompt": "会員 4242 の注文を一覧にしてください：注文 id と合計金額（total）
