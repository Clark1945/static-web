g）を参照でき、行ごとに 1 回ずつ実行されます。"], "answer": "SELECT s.id AS source_id, n.id, n.name\nFROM products s\nCROSS JOIN LATERAL (\n  SELECT p.id, p.name, p.embedding <=> s.embedding AS distance\n  FROM products p\n  WHERE p.id <> s.id\n  ORDER BY p.embedding <=> s.embedding\n  LIMIT 2\n) n\nWHERE s.id IN (806, 469, 1132)\nORDER BY s.id, n.distance;\n", "explanation": "「各行について最も近い k 件」を探すには LATERAL が必要です：通常のサブクエリは外側の行を参照できず、JOIN でも「グループごとの上位 k 件」はできません。\nLATERAL 内の ORDER BY … LIMIT もベクトルインデックスを使えます（行ごとに 1 回インデックス検索）。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["source_id", "id", "name"], "rows": [[469, 1127, "Lenovo 筆電 W749"], [469, 95, "Apple 筆電 J562"], [806, 151, "Sony 無線耳機 N677"], [806, 627, "JBL 無線耳機 V398"], [1132, 388, "SK-II 保養 N785"], [1132, 1117, "雅漾 保養 H933"]], "total": 6}}]}, {"id": "knn-classify", "chapter": "レコメンドと分類", "title": "k-NN 分類：投票でカテゴリを決める", "prompt": "新しい商品の説明は「上班 通勤」（仕事、通勤）です。embed('上班 通勤') に最も近い 15 件の商品を探し、それぞれのカテゴリを調べます：\ncategory と票数を、票数の多い順（同数なら category 順）に返します。\n", "hints": ["まずサブクエリで最も近い 15 件を取り、外側で GROUP BY category します。"], "answer": "SELECT category, count(*) AS votes\nFROM (\n  SELECT category FROM products\n  ORDER BY embedding <=> embed('上班 通勤')\n  LIMIT 15\n) nearest\nGROUP BY category\nORDER BY votes DESC, category;\n", "explanation": "k-NN（k nearest neighbors）分類：最も近い k 個の近傍の多くがどのカテゴリかを見て、そのカテゴリと判定します。\nモデルの学習は不要で、新しいカテゴリはデータを追加するだけです。商品の自動分類、問い合わせチケットの振り分け、スパム検出などに使えます。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["category", "votes"], "rows": [["筆電", 13], ["無線耳機", 2]], "total": 2}}]}, {"id": "customer-taste", "chapter": "レコメンドと分類", "title": "購入履歴からおすすめ", "prompt": "顧客 224 が購入したすべての商品（purchases）のベクトルを平均して、その人の「好み」とします。\nまだ買っていない商品のうち、この好みに最も近い 5 件をおすすめします。id、name を近い順に返します。\n", "hints": ["avg(embedding) でベクトルの平均を計算できます（pgvector は vector の avg、sum 集約関数を提供しています）。", "WITH taste AS (SELECT avg(p.embedding) AS v FROM purchases u JOIN products p ON p.id = u.product_id WHERE u.customer_id = 224)", "購入済みを除く：WHERE id NOT IN (SELECT product_id FROM purchases WHERE customer_id = 224)"], "answer": "WITH taste AS (\n  SELECT avg(p.embedding) AS v\n  FROM purchases u JOIN products p ON p.id = u.product_id\n  WHERE u.customer_id = 224\n)\nSELECT p.id, p.name\nFROM products p, taste\nWHERE p.id NOT IN (SELECT product_id FROM purchases WHERE customer_id = 224)\nORDER BY p.embedding <=> taste.v\nLIMIT 5;\n", "explanation": "最も単純なコンテンツベースのレコメンド（content-based）：ユーザーのベクトル = 関わったアイテムのベクトルの平均。\n★ 欠点：興味がばらばらな人（この顧客は寝具、生鮮食品、服、家電を買っている）では、平均すると「何でも少しずつ」の中間に落ち、おすすめがぼやけます。\n実務ではクラスタに分ける（興味ごとにベクトルを 1 つ）、時間で重み付けする（最近の購入ほど重く）、あるいは協調フィルタリングや Two-Tower モデルに切り替えます。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name"], "rows": [[1293, "GU 女裝 K527"], [579, "宜得利 寢具 K113"], [294, "NET 男裝 S618"], [732, "GU 女裝 G858"], [893, "Anker 手機配件 L381"]], "total": 5}}]}, {"id": "category-centroid", "chapter": "レコメンドと分類", "title": "カテゴリごとの代表商品", "prompt": "各カテゴリで「そのカテゴリの全商品の平均ベクトル」に最も近い商品（最も典型的な商品）。\ncategory、id、name を返し、category 順に並べます。\n", "hints": ["まず GROUP BY category で avg(embedding) を計算し、products に JOIN し直して、DISTINCT ON でカテゴリごとに最も近い 1 件を取ります。"], "answer": "WITH centroid AS (\n  SELECT category, avg(embedding) AS v\n  FROM products\n  GROUP BY category\n)\nSELECT DISTINCT ON (p.category) p.category, p.id, p.name\nFROM products p\nJOIN centroid c ON c.category = p.category\nORDER BY p.category, p.embedding <=> c.v;\n", "explanation": "カテゴリの中心（centroid）はクラスタリング、分類、異常検知で使われます：中心から特に遠いものは、分類を間違えているかデータに問題がある商品かもしれません。\nIVFFlat インデックスも同じ考え方です：まず k-means でベクトルを lists 個のクラスタに分け、検索時は最も近いいくつかのクラスタ（probes）だけを見ます。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["category", "id", "name"], "rows": [["休閒鞋", 751, "Vans 休閒鞋 K575"], ["保養", 1358, "SK-II 保養 C910"], ["健身器材", 527, "Reebok 健身器材 H707"], ["女裝", 350, "Lativ 女裝 O468"], ["寢具", 475, "宜得利 寢具 X178"], ["廚房用品", 35, "虎牌 廚房用品 C958"], ["彩妝", 1043, "Maybelline 彩妝 C708"], ["手機", 173, "Apple 手機 J651"], ["手機配件", 267, "Belkin 手機配件 O285"], ["收納", 840, "天馬 收納 X528"]], "total": 19}}]}, {"id": "near-duplicates", "chapter": "レコメンドと分類", "title": "ほぼ同じ商品を探す", "prompt": "cosine 距離が 0.015 未満の商品の「ペア」は何組ありますか？（同じペアは 1 回だけ数える）1 つの数値を返します。\n", "hints": ["自己結合：products a JOIN products b ON a.id < b.id", "a.id < b.id により (1, 2)、(2, 1) を 1 回だけ数え、自分自身とのペアも除外できます。"], "answer": "SELECT count(*)\nFROM products a\nJOIN products b ON a.id < b.id\nWHERE a.embedding <=> b.embedding < 0.015;\n", "explanation": "重複商品、重複記事、盗用の検出はどれもこの方法です。ここでは 1500 × 1499 / 2 ≈ 112 万ペアを比較し、1 秒もかかりません。\nデータ量が多いときは、すべてのペアを比較する（N² で爆発する）のではなく、「各行についてインデックスで最も近い数件を探す」（LATERAL + LIMIT）方法に切り替えます。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["count"], "rows": [[28]], "total": 1}}]}, {"id": "ann-search", "chapter": "インデックスと量子化", "title": "10 万件の中から最も近い 5 件を探す", "prompt": "questions の第 1 問のベクトルについて、passages の中で最も近い 5 件。id、tenant_id を近い順に返します。\n", "hints": ["passages の embedding 列には HNSW インデックス（vector_cosine_ops）があり、<=> を使ったときに使われます。", "先頭に EXPLAIN を付けると、Index Scan using passages_hnsw が見えます。"], "answer": "SELECT id, tenant_id\nFROM passages\nORDER BY embedding <=> (SELECT embedding FROM questions WHERE id = 1)\nLIMIT 5;\n", "explanation": "HNSW インデックスを使えれば 1 ms もかかりません。使わないと 10 万回の距離計算と並べ替えが必要です（約 15 ms、データが多いほど遅くなる）。\nベクトルインデックスは「近似」最近傍（ANN）です：本当に最も近い数件を見つける保証はなく、正確さは再現率（recall）で測ります（実験室で計測しています）。\n★ インデックスを使うには 3 つの条件がすべて必要です：ORDER BY 距離の小さい順、LIMIT がある、演算子がインデックス作成時の ops と一致する（cosine インデックスには <=>）。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "tenant_id"], "rows": [[27067, 6], [48912, 2], [73913, 4], [46905, 4], [686, 32]], "total": 5}}]}, {"id": "tenant-exact", "chapter": "インデックスと量子化", "title": "マルチテナント：自分のデータだけを検索", "prompt": "テナント 7（tenant_id = 7）のデータの中で、questions の第 1 問に最も近い 5 件。id を近い順に返します。\n注意：WHERE tenant_id = 7 を付けるだけでは 5 件に満たないことがあります。必ず正しい 5 件を返す方法を考えてください。\n", "hints": ["WHERE を付けただけだと、HNSW はまず ef_search（既定 40）個の候補を探してから絞り込みます。テナント 7 は 2% しかないので、候補には 0〜2 件しか残らないことがあります。", "ここでは 1 つのクエリしか送れません（SET は不可）。まずテナント 7 のデータを取り出し、その小さな集合の中で正確に並べ替えます：", "WITH mine AS MATERIALIZED (SELECT id, embedding FROM passages WHERE tenant_id = 7) SELECT id FROM mine ORDER BY …"], "answer": "WITH mine AS MATERIALIZED (\n  SELECT id, embedding FROM passages WHERE tenant_id = 7\n)\nSELECT id\nFROM mine\nORDER BY embedding <=> (SELECT embedding FROM questions WHERE id = 1)\nLIMIT 5;\n", "explanation": "MATERIALIZED にすると CTE が先に実行され（テナント 7 の約 2000 件を取り出す）、外側では HNSW を通らずに正確に並べ替えるので、必ず正しい 5 件になります。\nマルチテナントのベクトル検索は面接でよく出る問題です。他のやり方：\n1. pgvector 0.8 の iterative scan：SET hnsw.iterative_scan = relaxed_order とすると、候補が足りないときにさらに探し続けます（実験室で計測しています）。\n2. 大きなテナントごとに部分インデックスを作る（CREATE INDEX … WHERE tenant_id = 7）、または tenant_id でパーティション分割する。\n3. 絞り込み条件が非常に厳しい（数千件しか残らない）なら、正確な検索でも十分速いので、ベクトルインデックスはそもそも不要です。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id"], "rows": [[26055], [76620], [88174], [2454], [41606]], "total": 5}}]}, {"id": "quantization-size", "chapter": "インデックスと量子化", "title": "ベクトル 1 つはどれだけの容量を使うか", "prompt": "商品 806 のベクトルを 3 種類の型で保存したとき、それぞれ何バイトになりますか？1 行 3 列で返します：\nvector（元の float4）、halfvec（float2）、binary_quantize した後の bit。\n", "hints": ["pg_column_size(値) は値が実際に使うバイト数を返します。", "embedding::halfvec で半精度に変換し、binary_quantize(embedding) は各次元の符号だけを残します（1 bit）。"], "answer": "SELECT pg_column_size(embedding) AS vector_bytes,\n       pg_column_size(embedding::halfvec) AS halfvec_bytes,\n       pg_column_size(binary_quantize(embedding)) AS bit_bytes\nFROM products\nWHERE id = 806;\n", "explanation": "64 次元：vector は 1 次元あたり 4 バイト（256 + 8 バイトのヘッダー = 264）、halfvec は 2 バイト（136）、bit は 1 次元あたり 1 ビット（8 バイト + ヘッダー = 16）。\n1536 次元（OpenAI の埋め込み）なら 1 件で 6 KB、1000 万件ではベクトルだけで 60 GB になり、HNSW インデックスにもう 1 部必要です。\n量子化（quantization）とは精度と容量の交換です：halfvec は再現率をほぼ変えずに容量を半分にし、bit は 32 分の 1 ですが不正確なので、通常は「リランク（rerank）」と組み合わせます。\n実験室の「量子化」で、インデックスのサイズと再現率を実際に計測しています。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["vector_bytes", "halfvec_bytes", "bit_bytes"], "rows": [[264, 136, 16]], "total": 1}}]}, {"id": "insert-with-embedding", "chapter": "書き込み", "title": "商品を追加してベクトルを生成", "prompt": "商品を 1 つ追加します：id 9001、名称「Bose 無線耳機 Z001」（Bose ワイヤレスイヤホン Z001）、カテゴリ「無線耳機」（ワイヤレスイヤホン）、価格 8990、\n説明「Bose 無線耳機 Z001 黑色 主動降噪 續航24小時」（黒、アクティブノイズキャンセリング、24 時間駆動）、ベクトルは embed(説明) で生成します。\n追加した後、それに最も似た 3 件の商品（自分自身を除く）の id を、似ている順に検索します。\n", "hints": ["INSERT INTO products (id, name, category, price, description, embedding) VALUES (…, embed('…'))", "2 つ目の SELECT の結果が採点に使われます。"], "answer": "INSERT INTO products (id, name, category, price, description, embedding)\nVALUES (9001, 'Bose 無線耳機 Z001', '無線耳機', 8990,\n        'Bose 無線耳機 Z001 黑色 主動降噪 續航24小時',\n        embed('Bose 無線耳機 Z001 黑色 主動降噪 續航24小時'));\n\nSELECT id\nFROM products\nWHERE id <> 9001\nORDER BY embedding <=> (SELECT embedding FROM products WHERE id = 9001)\nLIMIT 3;\n", "explanation": "実際のシステムでは通常、アプリケーションが先に埋め込みモデルの API を呼んでベクトルを得てから一緒に INSERT します（またはバックグラウンドジョブに後から埋めさせます）。\n追加後すぐに検索できます：HNSW インデックスは INSERT 時に同期して更新され、再構築は不要です（IVFFlat も更新されますが、クラスタの中心は変わらないので、データ分布が大きく変わったら再構築します）。\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["id"], "rows": [[717], [1077], [580]], "total": 3}}]}, {"id": "update-reembed", "chapter": "書き込み", "title": "説明を変えたらベクトルも再計算", "prompt": "商品 469（ノートパソコン）の説明の末尾に「 打電動」（ゲーム）を追加し、ベクトルも再計算します。\nid、新しい説明、新しいベクトルと embed('打電動') の cosine 距離（小数第 3 位に四捨五入）を返します。\n", "hints": ["UPDATE … SET description = description || ' 打電動', embedding = embed(description || ' 打電動')", "SET の中で参照する description は「更新前」の値なので、両方に新しいテキストを自分でつなげる必要があります。", "RETURNING で更新後の値を返せます。"], "answer": "UPDATE products\nSET description = description || ' 打電動',\n    embedding = embed(description || ' 打電動')\nWHERE id = 469\nRETURNING id, description, round((embedding <=> embed('打電動'))::numeric, 3) AS distance;\n", "explanation": "ベクトルはテキストから計算した「派生データ」で、テキストが変わってもベクトルは自動では更新されません。再計算を忘れると、検索結果が内容と合わなくなります。\nよくあるやり方：アプリケーションがテキストと一緒にベクトルも更新する。またはトリガーで「再埋め込みが必要な」id をキューに書き込み、バックグラウンドジョブがモデルを呼びます。\n★ 埋め込みモデルを変えるときは、すべてのベクトルを再計算する必要があります（異なるモデルのベクトル同士は比較できない）。そのため各ベクトルをどのモデルが生成したかを記録しておきましょう。\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["id", "description", "distance"], "rows": [[469, "Lenovo 筆電 U846 Intel i5 32GB記憶體 1.5公斤 熱銷 打電動", 0.129]], "total": 1}}]}], "traps": [{"id": "self-match", "title": "最も似ている商品はどれ？", "question": "商品 806 に最も似た 3 件の商品を探すと、1 位はどれになりますか？", "options": ["別の Sony のワイヤレスイヤホン", "806 自身、距離 0", "ランダムな 1 件。距離がどれも同じくらいなので"], "answer": 1, "explanation": "自分自身との距離は 0 なので、必ず 1 位になります。「類似商品」「関連記事」では WHERE id <> 806 を忘れずに。\nしかも自分を除くだけでは不十分です：同じ商品の重複データ（別の id で再出品）も距離がほぼ 0 なので、距離のしきい値で除外することもよくあります。\n", "setup": null, "scripts": [{"label": "自分自身を除外していない", "code": "SELECT id, name, round((embedding <=> (SELECT embedding FROM products WHERE id = 806))::numeric, 3) AS distance\nFROM products\nORDER BY embedding <=> (SELECT embedding FROM products WHERE id = 806)\nLIMIT 3;\n"}], "results": [[{"table": {"columns": ["id", "name", "distance"], "rows": [[806, "Sony 無線耳機 F178", 0.0], [151, "Sony 無線耳機 N677", 0.016], [627, "JBL 無線耳機 V398", 0.025]], "total": 3}}]]}, {"id": "negative-inner-product", "title": "<#> を大きい順に並べる", "question": "「内積が最大」（最も似ている）3 件が欲しくて ORDER BY embedding <#> x DESC と書きました。結果は最も似ているものですか？", "options": ["はい、<#> は内積なので、大きいほど似ている", "いいえ、<#> は「負の」内積を返すので、DESC だと逆に最も似ていないものが見つかる", "エラー：<#> では並べ替えられない"], "answer": 1, "explanation": "pgvector の <#> は負の内積を返します：似ているほど値が小さくなります（-1 が最も似ている）。A で見つかるのは飲料やフィットネス器具など、イヤホンとはまったく関係のない商品です。\n理由：PostgreSQL のインデックスは「小さい順」の距離の並べ替えにしか対応していないので、内積の符号を反転して、すべての演算子を「小さいほど近い」にしています。\n★ 3 つの演算子はどれも同じです：ORDER BY 演算子 の小さい順 LIMIT k で、最も似た k 件になります。内積を表示したいときは自分で -1 を掛けます。\n", "setup": null, "scripts": [{"label": "A：<#> … DESC", "code": "SELECT id, name, round((embedding <#> (SELECT embedding FROM products WHERE id = 806))::numeric, 3) AS neg_inner\nFROM products\nORDER BY embedding <#> (SELECT embedding FROM products WHERE id = 806) DESC\nLIMIT 3;\n"}, {"label": "B：<#> の小さい順", "code": "SELECT id, name, round((embedding <#> (SELECT embedding FROM products WHERE id = 806))::numeric, 3) AS neg_inner\nFROM products\nORDER BY embedding <#> (SELECT embedding FROM products WHERE id = 806)\nLIMIT 3;\n"}], "results": [[{"table": {"columns": ["id", "name", "neg_inner"], "rows": [[1412, "統一 飲料 J448", 0.28], [1459, "Reebok 健身器材 N180", 0.27], [1463, "黑松 飲料 Z122", 0.265]], "total": 3}}], [{"table": {"columns": ["id", "name", "neg_inner"], "rows": [[806, "Sony 無線耳機 F178", -1.0], [151, "Sony 無線耳機 N677", -0.984], [627, "JBL 無線耳機 V398", -0.975]], "total": 3}}]]}, {"id": "opclass-mismatch", "title": "L2 距離で cosine インデックスは使える？", "question": "passages のベクトルはすべて長さ 1 で、L2 距離と cosine 距離の順位はまったく同じです。インデックスは vector_cosine_ops です。<->（L2）を使う B はインデックスを使いますか？", "options": ["使う。順位が同じなので、プランナーは使えると分かっている", "使わない。B はテーブル全体をスキャンしてから並べ替える", "使うが、変換に少し余分な時間がかかる"], "answer": 1, "explanation": "ベクトルインデックスは作成時の演算子クラス（operator class）に結び付いています：vector_cosine_ops は <=> だけ、vector_l2_ops は <-> だけ、vector_ip_ops は <#> だけに対応します。\nプランナーは「ベクトルがすべて長さ 1 なので順位が同じ」ことを知らないので、B は Parallel Seq Scan で 10 万回の距離計算をするしかありません。\n★ インデックスを作る前にどの距離を使うかを決め（通常は埋め込みモデルのドキュメントの推奨に従う）、アプリケーションのクエリでは常に同じ演算子を使いましょう。\n", "setup": null, "scripts": [{"label": "A：<=>（cosine）", "code": "EXPLAIN (COSTS OFF)\nSELECT id FROM passages\nORDER BY embedding <=> (SELECT embedding FROM questions WHERE id = 1)\nLIMIT 5;\n"}, {"label": "B：<->（L2）", "code": "EXPLAIN (COSTS OFF)\nSELECT id FROM passages\nORDER BY embedding <-> (SELECT embedding FROM questions WHERE id = 1)\nLIMIT 5;\n"}], "results": [[{"table": {"columns": ["QUERY PLAN"], "rows": [["Limit"], ["  InitPlan 1 (returns $0)"], ["    ->  Index Scan using questions_pkey on questions"], ["          Index Cond: (id = 1)"], ["  ->  Index Scan using passages_hnsw on passages"], ["        Order By: (embedding <=> $0)"]], "total": 6}}], [{"table": {"columns": ["QUERY PLAN"], "rows": [["Limit"], ["  InitPlan 1 (returns $0)"], ["    ->  Index Scan using questions_pkey on questions"], ["          Index Cond: (id = 1)"], ["  ->  Gather Merge"], ["        Workers Planned: 2"], ["        Params Evaluated: $0"], ["        ->  Sort"], ["              Sort Key: ((passages.embedding <-> $0))"], ["              ->  Parallel Seq Scan on passages"]], "total": 10}}]]}, {"id": "similarity-expression", "title": "ORDER BY 類似度 DESC", "question": "A と B の結果はまったく同じです。HNSW インデックスを使えるのはどちらですか？", "options": ["どちらも使える", "A だけ", "B だけ。インデックスに保存されているのは類似度だから"], "answer": 1, "explanation": "インデックスが認識するのは「列 演算子 値」の小さい順という形だけです。外側に演算（1 - …、-1 を掛ける、型変換）を 1 枚かぶせると認識できなくなり、B はテーブル全体のスキャンになります。\n★ ORDER BY には常に元の距離を書き、類似度は人が見るために SELECT で計算するだけにします。\n", "setup": null, "scripts": [{"label": "A：ORDER BY 距離", "code": "EXPLAIN (COSTS OFF)\nSELECT id FROM passages\nORDER BY embedding <=> (SELECT embedding FROM questions WHERE id = 1)\nLIMIT 5;\n"}, {"label": "B：ORDER BY 1 - 距離 DESC（類似度の高い順）", "code": "EXPLAIN (COSTS OFF)\nSELECT id FROM passages\nORDER BY 1 - (embedding <=> (SELECT embedding FROM questions WHERE id = 1)) DESC\nLIMIT 5;\n"}], "results": [[{"table": {"columns": ["QUERY PLAN"], "rows": [["Limit"], ["  InitPlan 1 (returns $0)"], ["    ->  Index Scan using questions_pkey on questions"], ["          Index Cond: (id = 1)"], ["  ->  Index Scan using passages_hnsw on passages"], ["        Order By: (embedding <=> $0)"]], "total": 6}}], [{"table": {"columns": ["QUERY PLAN"], "rows": [["Limit"], ["  InitPlan 1 (returns $0)"], ["    ->  Index Scan using questions_pkey on questions"], ["          Index Cond: (id = 1)"], ["  ->  Gather Merge"], ["        Workers Planned: 2"], ["        Params Evaluated: $0"], ["        ->  Sort"], ["              Sort Key: (('1'::double precision - (passages.embedding <=> $0))) DESC"], ["              ->  Parallel Seq Scan on passages"]], "total": 10}}]]}, {"id": "missing-limit", "title": "LIMIT がない", "question": "すべてを距離順に並べたいので LIMIT を書きませんでした。HNSW インデックスは使われますか？", "options": ["使われる。インデックスはもともと並んでいるから", "使われない。テーブル全体をスキャンしてから並べ替える"], "answer": 1, "explanation": "HNSW や IVFFlat は「最も近い k 件を探す」ために設計されていて、しかも結果は近似です。返すのは最大でも ef_search（既定 40）か probes がカバーする範囲のデータだけです。\nLIMIT がないとプランナーはこれらを使わず（使うとデータが漏れるため）、テーブル全体で距離を計算してから並べ替えます。ベクトル検索には必ず LIMIT を書きましょう。\n", "setup": null, "scripts": [{"label": "LIMIT なし", "code": "EXPLAIN (COSTS OFF)\nSELECT id FROM passages\nORDER BY embedding <=> (SELECT embedding FROM questions WHERE id = 1);\n"}], "results": [[{"table": {"columns": ["QUERY PLAN"], "rows": [["Sort"], ["  Sort Key: ((passages.embedding <=> $0))"], ["  InitPlan 1 (returns $0)"], ["    ->  Index Scan using questions_pkey on questions"], ["          Index Cond: (id = 1)"], ["  ->  Seq Scan on passages"]], "total": 6}}]]}, {"id": "filter-fewer-rows", "title": "絞り込み条件を付けると何件返る？", "question": "テナント 7 は全データの 2%（約 2000 件）しかありません。WHERE tenant_id = 7 を付けて最も近い 10 件を取ると、何件返りますか？", "options": ["10 件。テナント 7 には 2000 件あるので必ず足りる", "10 件に満たない", "0 件。WHERE とベクトルインデックスは併用できない"], "answer": 1, "explanation": "HNSW はまず ef_search（既定 40）個の最も近い候補を探し、それから WHERE を適用します。40 件のうちテナント 7 に属するのは平均 1 件未満なので、返る件数が足りません（この文は 2 件しか返しません）。\nこれは「絞り込んでから k 件取る」（post-filtering）の典型的な問題で、マルチテナントの RAG で最もよくはまるポイントです。解決策：\n1. pgvector 0.8：SET hnsw.iterative_scan = relaxed_order とすると、候補が足りないときに自動でさらに探し続けます。\n2. hnsw.ef_search を上げる（例えば 1000）。代償は遅くなること。\n3. 部分インデックス（WHERE tenant_id = 7）やテナントごとのパーティション分割。絞り込み後のデータが少ないなら、正確な検索を直接行う（練習問題「マルチテナント」）。\n実験室の「フィルタ」で、絞り込みの割合ややり方の違いを計測しています。\n", "setup": null, "scripts": [{"label": "HNSW + WHERE", "code": "SELECT id, tenant_id\nFROM passages\nWHERE tenant_id = 7\nORDER BY embedding <=> (SELECT embedding FROM questions WHERE id = 1)\nLIMIT 10;\n"}], "results": [[{"table": {"columns": ["id", "tenant_id"], "rows": [[26055, 7], [76620, 7]], "total": 2}}]]}, {"id": "unknown-words", "title": "モデルが認識しないテキスト", "question": "語彙には「iPhone」も「15」もありません。embed('iPhone 15') で検索すると何が得られますか？", "options": ["Apple のスマートフォン", "エラー：ベクトルが NULL", "適当な 3 件の商品：距離がすべて NULL なので、並べ替えに意味がない"], "answer": 2, "explanation": "embed() は 1 語も認識できないとき NULL を返し、すべての距離が NULL になり、ORDER BY が効かず、テーブルで「たまたま先頭にある」商品が返ります。しかもエラーになりません。\n本物の埋め込みモデルは NULL を返しませんが、見たことのない固有名詞（型番、新商品名、社内コード）には同様に不正確なベクトルを返し、結果は「答えがある」ように見えて間違っています。\n★ 型番、ブランド、品番のような完全一致が必要なものはキーワード検索（またはハイブリッド検索）で。ベクトル検索は「意味が近い」ものを担当します。\n", "setup": null, "scripts": [{"label": "A：embed('iPhone 15')", "code": "SELECT embed('iPhone 15') IS NULL AS is_null, tokens('iPhone 15') AS tokens;\n"}, {"label": "B：それで検索する", "code": "SELECT id, name\nFROM products\nORDER BY embedding <=> embed('iPhone 15')\nLIMIT 3;\n"}], "results": [[{"table": {"columns": ["is_null", "tokens"], "rows": [[true, "{}"]], "total": 1}}], [{"table": {"columns": ["id", "name"], "rows": [[751, "Vans 休閒鞋 K575"], [190, "UNIQLO 男裝 X909"], [1, "雅漾 保養 C693"]], "total": 3}}]]}, {"id": "avg-not-normalized", "title": "平均ベクトルの長さ", "question": "products の各ベクトルの長さはすべて 1 です。「イヤホン」関連カテゴリ全体の平均ベクトルの長さはいくつですか？", "options": ["1。平均しても長さは変わらない", "1 より小さく、ばらばらなほど短い", "1 より大きい。たくさんのベクトルを足したから"], "answer": 1, "explanation": "向きの異なるベクトルを平均すると一部が打ち消し合い、長さは 1 より小さくなります。ばらばらなほど（2 つのカテゴリを合わせると）短くなります。\nそれで最も近い k 件を探すときの順位には影響しません（cosine は向きしか見ず、長さ 1 のデータに対しては、クエリベクトルを等倍に拡大縮小しても内積や L2 の順位は変わらない）。\nしかし「距離の数値」は変わります：内積や L2 距離はクエリベクトルの長さに依存するので、固定のしきい値（例：内積 > 0.8 なら関連あり）で絞り込むと、除外しすぎてしまいます。\n平均ベクトルをしきい値と比べるときは、先に l2_normalize(avg(…)) します。\n「ユーザーの好みベクトル = 購入した商品の平均」も同じ状況です：興味がばらばらなほど、平均ベクトルは短く、特徴のないものになります。\n", "setup": null, "scripts": [{"label": "平均ベクトルの長さ", "code": "SELECT category, round(vector_norm(avg(embedding))::numeric, 3) AS norm_of_avg\nFROM products\nWHERE category IN ('無線耳機', '有線耳機')\nGROUP BY category\nUNION ALL\nSELECT '兩類合起來', round(vector_norm(avg(embedding))::numeric, 3)\nFROM products\nWHERE category IN ('無線耳機', '有線耳機');\n"}], "results": [[{"table": {"columns": ["category", "norm_of_avg"], "rows": [["有線耳機", 0.689], ["無線耳機", 0.878], ["兩類合起來", 0.716]], "total": 3}}]]}], "steps": []}, {"id": "influxdb", "name": "InfluxDB", "lang": "influx", "labName": "InfluxQL vs Flux", "labNote": "各ステップは同じ問いを 2 通りで書きます：InfluxQL（SQL 風）と Flux（パイプライン）。書き方と返るデータの形を比較します。series 数（tag vs field）とダウンサンプリングの実験はデータを書き込むため、ショーケースアプリの「実験室」で行ってください。", "hasResults": true, "exercises": [{"id": "tag-values", "chapter": "データモデルと基本のクエリ", "title": "どんなホストがあるか：SHOW TAG VALUES", "prompt": "cpu という measurement の host という tag には、どんな値がありますか？\n", "hints": ["SHOW TAG VALUES FROM 測定名 WITH KEY = \"tag 名\"", "InfluxQL の識別子（measurement、tag、field の名前）はダブルクォート、文字列の値はシングルクォートで囲みます。"], "answer": "SHOW TAG VALUES FROM cpu WITH KEY = \"host\"\n", "explanation": "InfluxDB の 1 件のデータ（point）= measurement + tag set + field set + タイムスタンプです。例えば：\ncpu,host=db-01,region=tpe,role=db usage_user=35.8,usage_system=10.2 1790783940\ntag はインデックスが作られ（絞り込みやグループ化に使う）、値は常に文字列です。field はインデックスが作られません（実際の測定値を保存し、数値・文字列・ブール値を取れる）。\nmeasurement + tag set で 1 本の「series」（時系列）が決まります：cpu には 5 本（ホスト 5 台）あり、それぞれ時刻順に並んで保存されています。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "cpu", "table": {"columns": ["key", "value"], "rows": [["host", "cache-01"], ["host", "db-01"], ["host", "web-01"], ["host", "web-02"], ["host", "web-03"]], "total": 5}}]}, {"id": "field-keys", "chapter": "データモデルと基本のクエリ", "title": "フィールドの型：SHOW FIELD KEYS", "prompt": "orders にはどんな field があり、それぞれ何型ですか？\n", "hints": ["SHOW FIELD KEYS FROM 測定名"], "answer": "SHOW FIELD KEYS FROM orders\n", "explanation": "orders の customer_id、order_id、items、total は field（integer）、city、status、vip_level は tag です。\n★ 値の種類が非常に多いデータ（注文番号、顧客番号、ユーザー ID、trace id）を tag にしてはいけません：異なる tag の組み合わせはそれぞれ新しい series になり、\nseries 数（cardinality）が爆発するとメモリを使い果たし、書き込みもクエリも遅くなります。これが InfluxDB のデータモデルで最も重要なルールです。\n同じ field の型は最初の書き込みで決まり（同じ shard 内）、以後違う型を書き込むと拒否されます。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "orders", "table": {"columns": ["fieldKey", "fieldType"], "rows": [["customer_id", "integer"], ["items", "integer"], ["order_id", "integer"], ["total", "integer"]], "total": 4}}]}, {"id": "raw-range", "chapter": "データモデルと基本のクエリ", "title": "時間範囲 + tag の条件", "prompt": "db-01 の 2026-09-18 14:00 から 14:05（台湾時間、14:05 を含まない）の usage_user と usage_system の生データ。\n", "hints": ["時間条件は time >= '2026-09-18T14:00:00+08:00' AND time < '…' と書きます。", "tag の値は文字列なのでシングルクォートで：host = 'db-01'"], "answer": "SELECT usage_user, usage_system FROM cpu\nWHERE host = 'db-01'\n  AND time >= '2026-09-18T14:00:00+08:00' AND time < '2026-09-18T14:05:00+08:00'\n", "explanation": "1 分に 1 件なので 5 行です。結果は必ず時刻順（既定は古い順）で、1 列目は常に time です。\n★ 時間範囲は必ず付けましょう：InfluxDB はデータを時間で shard（shard group）に分けており、時間条件がないとすべての shard をスキャンする必要があります。\nInfluxQL には JOIN がなく、クエリの単位は「1 つの measurement の中の 1 本以上の series」です。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "cpu", "table": {"columns": ["time", "usage_user", "usage_system"], "rows": [["2026-09-18 14:00:00", 94.34, 26.89], ["2026-09-18 14:01:00", 95.8, 29.51], ["2026-09-18 14:02:00", 98.58, 28.04], ["2026-09-18 14:03:00", 93.8, 27.91], ["2026-09-18 14:04:00", 94.1, 28.05]], "total": 5}}]}, {"id": "last-per-host", "chapter": "データモデルと基本のクエリ", "title": "各ホストの最後の報告", "prompt": "各ホスト（host）が最後に報告した時刻と、そのときの usage_user。\n", "hints": ["last() は selector です：最後の 1 件の値を返し、time 列はその 1 件の時刻になります。", "GROUP BY host で、ホストごとに 1 回ずつ計算します。"], "answer": "SELECT last(usage_user) FROM cpu GROUP BY host\n", "explanation": "他のホストの最後の 1 件はすべて 9/30 23:59 ですが、web-03 は 9/20 12:00 で止まっています：オフラインになったのです。監視システムはこのようなクエリで「接続断アラート」（deadman check）を行います。\nselector（first、last、max、min、top、bottom、percentile）は実在する 1 件を返し、time はその 1 件の時刻です。\naggregate（mean、sum、count…）は計算した値を返し、time は区間の開始です（GROUP BY time がないときは 0、つまり 1970-01-01）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "cpu  [host=cache-01]", "table": {"columns": ["time", "last"], "rows": [["2026-09-30 23:59:00", 15.65]], "total": 1}}, {"cmd": "cpu  [host=db-01]", "table": {"columns": ["time", "last"], "rows": [["2026-09-30 23:59:00", 35.84]], "total": 1}}, {"cmd": "cpu  [host=web-01]", "table": {"columns": ["time", "last"], "rows": [["2026-09-30 23:59:00", 29.57]], "total": 1}}, {"cmd": "cpu  [host=web-02]", "table": {"columns": ["time", "last"], "rows": [["2026-09-30 23:59:00", 30.26]], "total": 1}}, {"cmd": "cpu  [host=web-03]", "table": {"columns": ["time", "last"], "rows": [["2026-09-20 11:59:00", 33.36]], "total": 1}}]}, {"id": "latest-orders", "chapter": "データモデルと基本のクエリ", "title": "最新の 3 件の注文", "prompt": "台北市（city = '台北市'）の最新 3 件の注文。すべての列（SELECT *）を新しい順に返します。\n", "hints": ["ORDER BY time DESC LIMIT 3（InfluxQL は time でしか並べ替えられません）"], "answer": "SELECT * FROM orders WHERE city = '台北市' ORDER BY time DESC LIMIT 3\n", "explanation": "SELECT * はすべての tag と field を返し、列は名前順に並びます。\n★ InfluxQL の ORDER BY には time しか使えません。「金額で並べ替える」には top() / bottom() を使うか、Flux で sort() を使います。\n時系列データベースはクエリのほとんどが「ある期間を、時刻順に」だと想定しているので、データは時刻順に保存されており、それ以外の並べ替えは得意ではありません。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "orders", "table": {"columns": ["time", "city", "customer_id", "items", "order_id", "status", "total", "vip_level"], "rows": [["2026-09-30 20:32:31", "台北市", 16593, 3, 79991, "pending", 3771, "normal"], ["2026-09-30 20:09:32", "台北市", 16626, 4, 79989, "paid", 14516, "normal"], ["2026-09-30 18:40:33", "台北市", 15707, 3, 79980, "shipped", 85173, "normal"]], "total": 3}}]}, {"id": "hourly-mean", "chapter": "集約と GROUP BY time", "title": "1 時間ごとの平均 CPU", "prompt": "db-01 の 2026-09-18 12:00 から 17:00（台湾時間）の、1 時間ごとの平均 usage_user。\n", "hints": ["GROUP BY time(1h)：時間を 1 時間ずつに区切ります。", "最後に tz('Asia/Taipei') を付けると、結果の時刻が台湾時間で揃います（時間単位はもともと揃いますが、日や週ではこれが必要です）。"], "answer": "SELECT mean(usage_user) FROM cpu\nWHERE host = 'db-01' AND time >= '2026-09-18T12:00:00+08:00' AND time < '2026-09-18T17:00:00+08:00'\nGROUP BY time(1h) tz('Asia/Taipei')\n", "explanation": "GROUP BY time() ≈ TimescaleDB の time_bucket、Elasticsearch の date_histogram。\n14 時台の平均は 76%：14:00〜14:40 は満杯で、最後の 20 分は正常に戻っています。1 時間平均だけでは障害の深刻さを過小評価してしまうので、max を見るか区間を小さく（5m）すると分かりやすくなります。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "cpu", "table": {"columns": ["time", "mean"], "rows": [["2026-09-18 12:00:00", 40.576], ["2026-09-18 13:00:00", 37.2308], ["2026-09-18 14:00:00", 76.4702], ["2026-09-18 15:00:00", 37.512], ["2026-09-18 16:00:00", 37.3137]], "total": 5}}]}, {"id": "daily-max", "chapter": "集約と GROUP BY time", "title": "各ホストの日ごとの最大 CPU", "prompt": "2026-09-18、09-19 の 2 日間（台湾時間）について、各ホストの日ごとの usage_user の最大値。\n", "hints": ["GROUP BY time(1d), host tz('Asia/Taipei')"], "answer": "SELECT max(usage_user) FROM cpu\nWHERE time >= '2026-09-18T00:00:00+08:00' AND time < '2026-09-20T00:00:00+08:00'\nGROUP BY time(1d), host tz('Asia/Taipei')\n", "explanation": "GROUP BY には time() と tag を同時に指定できます：ホストごとに 1 つの結果（series）があり、その中で 1 日ごとに 1 行です。\n★ 1 日以上の区間には必ず tz() を付けます：ないと UTC で区切られ、台湾の 1 日が午前 8 時から始まってしまいます（落とし穴問題で実演しています）。\nmax は selector で、time 列は区間の開始です（GROUP BY time があると、selector の time も区間の開始になります）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "cpu  [host=cache-01]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 00:00:00", 26.69], ["2026-09-19 00:00:00", 26.8]], "total": 2}}, {"cmd": "cpu  [host=db-01]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 00:00:00", 98.93], ["2026-09-19 00:00:00", 56.72]], "total": 2}}, {"cmd": "cpu  [host=web-01]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 00:00:00", 56.34], ["2026-09-19 00:00:00", 55.59]], "total": 2}}, {"cmd": "cpu  [host=web-02]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 00:00:00", 55.25], ["2026-09-19 00:00:00", 55.37]], "total": 2}}, {"cmd": "cpu  [host=web-03]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 00:00:00", 49.15], ["2026-09-19 00:00:00", 47.22]], "total": 2}}]}, {"id": "sensor-p95", "chapter": "集約と GROUP BY time", "title": "冷蔵センサーの P95 温度", "prompt": "冷蔵（kind = 'cold'）のセンサーについて、sensor_id ごとに 9 月 1 か月間の temperature の 95 パーセンタイル。\n", "hints": ["percentile(temperature, 95)、GROUP BY sensor_id"], "answer": "SELECT percentile(temperature, 95) FROM sensors WHERE kind = 'cold' GROUP BY sensor_id\n", "explanation": "冷蔵は 4 度前後のはずです。2 号の P95 が 1 号や 4 号とほとんど同じなのは、9/18 の温度上昇が 2 時間だけで、1 か月の 0.3% にすぎないからです。\n「何か起きたか」を見るなら max か P99.9、「普段どうか」を見るなら中央値や P95 を使います。InfluxQL の percentile は正確に計算します（すべての値を並べ替える）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "sensors  [sensor_id=1]", "table": {"columns": ["time", "percentile"], "rows": [["2026-09-01 16:30:00", 4.67]], "total": 1}}, {"cmd": "sensors  [sensor_id=2]", "table": {"columns": ["time", "percentile"], "rows": [["2026-09-15 13:45:00", 4.67]], "total": 1}}, {"cmd": "sensors  [sensor_id=4]", "table": {"columns": ["time", "percentile"], "rows": [["2026-09-04 17:20:00", 4.66]], "total": 1}}]}, {"id": "orders-by-city", "chapter": "集約と GROUP BY time", "title": "9 月の都市別の注文数と売上", "prompt": "2026 年 9 月（台湾時間）の都市（city）ごとの注文数（count）と売上（sum）。どちらも total という field で計算します。\n", "hints": ["SELECT count(total), sum(total) FROM orders WHERE … GROUP BY city"], "answer": "SELECT count(total), sum(total) FROM orders\nWHERE time >= '2026-09-01T00:00:00+08:00' AND time < '2026-10-01T00:00:00+08:00'\nGROUP BY city\n", "explanation": "GROUP BY には tag（または time）しか使えません：city は tag なのでグループ化できますが、city が field ならできません（field で GROUP BY した結果は落とし穴問題で実演しています）。\ncount() には必ず field を指定します：InfluxQL には count(*) で「行数」を数えるという概念がなく、field ごとに数えます。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "orders  [city=台中市]", "table": {"columns": ["time", "count", "sum"], "rows": [["2026-09-01 00:00:00", 283, 4061379]], "total": 1}}, {"cmd": "orders  [city=台北市]", "table": {"columns": ["time", "count", "sum"], "rows": [["2026-09-01 00:00:00", 665, 10243795]], "total": 1}}, {"cmd": "orders  [city=台南市]", "table": {"columns": ["time", "count", "sum"], "rows": [["2026-09-01 00:00:00", 199, 3037168]], "t d として使い、内側の GROUP BY の tag も外側で使えます。\nweb ホストは夜 9 時に最も忙しく（トラフィックのピーク）、db-01 は午後 2 時です（障害）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "cpu  [host=cache-01]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 21:00:00", 17.9283]], "total": 1}}, {"cmd": "cpu  [host=db-01]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 14:00:00", 76.4702]], "total": 1}}, {"cmd": "cpu  [host=web-01]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 21:00:00", 50.5785]], "total": 1}}, {"cmd": "cpu  [host=web-02]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 21:00:00", 50.2065]], "total": 1}}, {"cmd": "cpu  [host=web-03]", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 21:00:00", 42.8668]], "total": 1}}]}, {"id": "request-rate", "chapter": "変化率とカウンタ", "title": "累積カウンタ → 1 分あたりのリクエスト数", "prompt": "http の requests は「累積」カウンタです（増える一方）。api サービスの 2026-09-15 02:57 から 03:03（台湾時間）の 1 分ごとのリクエスト数を求めてください。\napi は 03:00 に再起動してカウンタが 0 からやり直しになりましたが、その 1 分を負の値として数えてはいけません。\n", "hints": ["non_negative_derivative(last(requests), 1m) … GROUP BY time(1m)"], "answer": "SELECT non_negative_derivative(last(requests), 1m) FROM http\nWHERE service = 'api' AND time >= '2026-09-15T02:57:00+08:00' AND time < '2026-09-15T03:03:00+08:00'\nGROUP BY time(1m)\n", "explanation": "監視システム（Prometheus、Telegraf）が収集するのはほとんどが累積カウンタです：「これまでの合計回数」だけを報告し、差分はクエリ側で計算します。\n利点は報告が何回か抜けても少なく数えないこと。欠点は、プログラムの再起動でカウンタが 0 に戻ると、単純に引き算すると巨大な負の数になることです（-360 万、落とし穴問題で実演しています）。\nnon_negative_derivative は負の値を捨てます。Prometheus の rate() はリセットを自動で検出して補正します。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "http", "table": {"columns": ["time", "non_negative_derivative"], "rows": [["2026-09-15 02:57:00", 30], ["2026-09-15 02:58:00", 32], ["2026-09-15 02:59:00", 30], ["2026-09-15 03:01:00", 21], ["2026-09-15 03:02:00", 20]], "total": 5}}]}, {"id": "errors-per-10m", "chapter": "変化率とカウンタ", "title": "10 分ごとのエラー数", "prompt": "api サービスで 2026-09-18 13:30 から 15:00（台湾時間）に、10 分ごとに新しく発生したエラーはいくつですか（errors も累積カウンタです）。\n", "hints": ["non_negative_difference(last(errors)) は隣り合う 2 つの区間の差を計算します（時間では割りません）。"], "answer": "SELECT non_negative_difference(last(errors)) FROM http\nWHERE service = 'api' AND time >= '2026-09-18T13:30:00+08:00' AND time < '2026-09-18T15:00:00+08:00'\nGROUP BY time(10m)\n", "explanation": "difference は「後ろの値 − 前の値」、derivative はさらに時間単位で割ります（速度になる）。14:00〜14:40 は 10 分ごとに数百件のエラーがあり、他の時間帯は 1 桁だけです。\n最初の区間には引き算する前の値がないので、結果は区間の数より 1 行少なくなる点に注意しましょう。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "http", "table": {"columns": ["time", "non_negative_difference"], "rows": [["2026-09-18 13:30:00", 8], ["2026-09-18 13:40:00", 7], ["2026-09-18 13:50:00", 9], ["2026-09-18 14:00:00", 673], ["2026-09-18 14:10:00", 637], ["2026-09-18 14:20:00", 602], ["2026-09-18 14:30:00", 744], ["2026-09-18 14:40:00", 9], ["2026-09-18 14:50:00", 9]], "total": 9}}]}, {"id": "moving-average", "chapter": "変化率とカウンタ", "title": "移動平均：moving_average()", "prompt": "2 号センサーの 2026-09-18 12:00 から 16:00（台湾時間）の 30 分ごとの平均温度を求め、さらに「直近 3 区間」の移動平均を取ります。\n", "hints": ["moving_average(mean(temperature), 3) … GROUP BY time(30m) tz('Asia/Taipei')"], "answer": "SELECT moving_average(mean(temperature), 3) FROM sensors\nWHERE sensor_id = '2' AND time >= '2026-09-18T12:00:00+08:00' AND time < '2026-09-18T16:00:00+08:00'\nGROUP BY time(30m) tz('Asia/Taipei')\n", "explanation": "移動平均は曲線をなめらかにし、傾向を見たり誤報を減らしたりするのに使います（温度が一瞬跳ねてもアラートせず、高い状態が続いたときだけアラートする）。代償は反応が遅くなることです。\n最初の 2 区間は 3 つの値がそろわないので、出力されません。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "sensors", "table": {"columns": ["time", "moving_average"], "rows": [["2026-09-18 12:30:00", 4.1072], ["2026-09-18 13:00:00", 4.5839], ["2026-09-18 13:30:00", 6.4628], ["2026-09-18 14:00:00", 9.0744], ["2026-09-18 14:30:00", 11.1656], ["2026-09-18 15:00:00", 9.2694], ["2026-09-18 15:30:00", 6.6244]], "total": 7}}]}, {"id": "memory-leak", "chapter": "変化率とカウンタ", "title": "メモリは 1 日にどれだけ増えるか：derivative()", "prompt": "web-02 の 2026-09-10 から 09-20（台湾時間）の日ごとの平均 used_percent と、前日からの変化量（1 日あたり）。\n", "hints": ["derivative(mean(used_percent), 1d) … GROUP BY time(1d) tz('Asia/Taipei')"], "answer": "SELECT derivative(mean(used_percent), 1d) FROM mem\nWHERE host = 'web-02' AND time >= '2026-09-10T00:00:00+08:00' AND time < '2026-09-20T00:00:00+08:00'\nGROUP BY time(1d) tz('Asia/Taipei')\n", "explanation": "毎日約 1.7% ずつ着実に増えています：典型的なメモリリークです。9/15 に大きく下がっているのは、午前 3 時に再起動したからです（リークしたメモリが解放された）。\n変化率で「予測型アラート」を作れます：このペースなら数日後に使い切る、と分かれば、95% になるまで待つよりも早く警告できます。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "mem", "table": {"columns": ["time", "derivative"], "rows": [["2026-09-10 00:00:00", 1.7161], ["2026-09-11 00:00:00", 1.7251], ["2026-09-12 00:00:00", 1.7156], ["2026-09-13 00:00:00", 1.7332], ["2026-09-14 00:00:00", 1.7279], ["2026-09-15 00:00:00", -19.611], ["2026-09-16 00:00:00", -1.3393], ["2026-09-17 00:00:00", 1.7294], ["2026-09-18 00:00:00", 1.7306], ["2026-09-19 00:00:00", 1.7425]], "total": 10}}]}, {"id": "flux-basic", "chapter": "Flux", "title": "Flux の基本パイプライン", "prompt": "Flux で、db-01 の 2026-09-18 14:00 から 15:00（台湾時間）の usage_user の平均値を計算してください。\n", "hints": ["from(bucket: \"metrics\") |> range(start: …, stop: …) |> filter(fn: (r) => …) |> mean()", "Flux の時刻は 2026-09-18T14:00:00+08:00 とそのまま書けます（引用符なし）。", "filter の中で _measurement、_field、host を同時に比較します。"], "answer": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-18T14:00:00+08:00, stop: 2026-09-18T15:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\" and r.host == \"db-01\")\n  |> mean()\n", "explanation": "Flux はパイプライン（|>）です：データは「テーブル」の形で下へ流れ、各関数が処理して次に渡します。\nfrom の後には必ず range が必要で（時間範囲がないとエラー）、filter には無名関数を使い、r は 1 行を表します。\nFlux のデータモデル：各行には値が 1 つだけ（_value）あり、フィールド名は _field にあります。同じ series（measurement + tags + field）が 1 つのテーブルです。\nFlux は公式には新機能の開発が止まっています（InfluxDB 3 は SQL / InfluxQL に戻った）が、2.x のシステムでは大量に使われています。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "table 0  [host=db-01, region=tpe, role=db]", "table": {"columns": ["_start", "_stop", "_value", "_field", "_measurement", "host", "region", "role"], "rows": [["2026-09-18 14:00:00", "2026-09-18 15:00:00", 76.4702, "usage_user", "cpu", "db-01", "tpe", "db"]], "total": 1}}]}, {"id": "flux-window", "chapter": "Flux", "title": "aggregateWindow：日ごとの最大値", "prompt": "Flux で、db-01 の 2026-09-18、09-19 の 2 日間（台湾時間）の日ごとの usage_user の最大値を計算してください。\n", "hints": ["aggregateWindow(every: 1d, fn: max)", "台湾時間で 1 日ごとに区切るには：import \"timezone\" の後、option location = timezone.location(name: \"Asia/Taipei\") を加えます"], "answer": "import \"timezone\"\noption location = timezone.location(name: \"Asia/Taipei\")\n\nfrom(bucket: \"metrics\")\n  |> range(start: 2026-09-18T00:00:00+08:00, stop: 2026-09-20T00:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\" and r.host == \"db-01\")\n  |> aggregateWindow(every: 1d, fn: max)\n", "explanation": "aggregateWindow ≈ InfluxQL の GROUP BY time()：区間ごとに 1 回計算し、_time は区間の「終了」時刻です（InfluxQL は開始で、両者は違います！）。\noption location で 1d の区間を台湾時間に揃えます。ないと UTC で区切られます。createEmpty（既定 true）で、データのない区間を出力するかどうかを決めます。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "table 0  [host=db-01, region=tpe, role=db]", "table": {"columns": ["_start", "_stop", "_time", "_value", "_field", "_measurement", "host", "region", "role"], "rows": [["2026-09-18 00:00:00", "2026-09-20 00:00:00", "2026-09-19 00:00:00", 98.93, "usage_user", "cpu", "db-01", "tpe", "db"], ["2026-09-18 00:00:00", "2026-09-20 00:00:00", "2026-09-20 00:00:00", 56.72, "usage_user", "cpu", "db-01", "tpe", "db"]], "total": 2}}]}, {"id": "flux-pivot", "chapter": "Flux", "title": "pivot + map：2 つの field を足し合わせる", "prompt": "db-01 の 2026-09-18 14:00 から 14:05（台湾時間）の 1 分ごとの CPU 合計使用率（usage_user + usage_system）。\n結果には _time と total の 2 列だけを残します。\n", "hints": ["Flux の各行には _value が 1 つしかなく、2 つの field は別々のテーブルにあります。まず pivot で同じ行にまとめます：pivot(rowKey: [\"_time\"], columnKey: [\"_field\"], valueColumn: \"_value\")", "次に map で列を追加します：map(fn: (r) => ({ r with total: r.usage_user + r.usage_system }))", "最後に keep(columns: [\"_time\", \"total\"])"], "answer": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-18T14:00:00+08:00, stop: 2026-09-18T14:05:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r.host == \"db-01\")\n  |> filter(fn: (r) => r._field == \"usage_user\" or r._field == \"usage_system\")\n  |> pivot(rowKey: [\"_time\"], columnKey: [\"_field\"], valueColumn: \"_value\")\n  |> map(fn: (r) => ({ r with total: r.usage_user + r.usage_system }))\n  |> keep(columns: [\"_time\", \"total\"])\n", "explanation": "InfluxQL なら SELECT usage_user + usage_system と直接書けますが、Flux は「1 行に 1 つの値」というデータモデルなので、field をまたぐ計算には先に pivot（ピボットテーブルのようなもの）が必要です。\nInfluxDB 3 の SQL は「1 行に複数の field」のワイドテーブルに戻ったので、この問題はありません。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "table 0", "table": {"columns": ["_time", "total"], "rows": [["2026-09-18 14:00:00", 121.23], ["2026-09-18 14:01:00", 125.31], ["2026-09-18 14:02:00", 126.62], ["2026-09-18 14:03:00", 121.71], ["2026-09-18 14:04:00", 122.15]], "total": 5}}]}, {"id": "flux-rank-hosts", "chapter": "Flux", "title": "group + sort：平均 CPU でホストを順位付け", "prompt": "9 月 1 か月間（台湾時間）の各ホストの usage_user の平均値を高い順に並べ、host と _value の 2 列だけを残します。\n", "hints": ["mean() の後もホストごとに別のテーブルなので、一緒に並べ替えるには先に group()（すべてを 1 つのテーブルにまとめる）します。", "sort(columns: [\"_value\"], desc: true) |> keep(columns: [\"host\", \"_value\"])"], "answer": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-01T00:00:00+08:00, stop: 2026-10-01T00:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\")\n  |> mean()\n  |> group()\n  |> sort(columns: [\"_value\"], desc: true)\n  |> keep(columns: [\"host\", \"_value\"])\n", "explanation": "Flux の「グループ」とはテーブルのことです：from で読み出した時点では series ごとに 1 つのテーブルで、group(columns: […]) は指定した列でテーブルを分け直し、group() はすべてを 1 つにまとめます。\n集約関数（mean、sum、count）は「テーブルごとに 1 回」計算し、並べ替えや limit もテーブルごとに行われるので、ホストをまたいで順位を付ける前に必ず group() します。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "table 0", "table": {"columns": ["_value", "host"], "rows": [[36.2103, "db-01"], [33.3995, "web-01"], [33.3775, "web-02"], [29.0059, "web-03"], [12.4766, "cache-01"]], "total": 5}}]}, {"id": "flux-rate", "chapter": "Flux", "title": "Flux の変化率：derivative(nonNegative: true)", "prompt": "Flux で、api サービスの 2026-09-15 02:57 から 03:03（台湾時間）の 1 分ごとのリクエスト数を計算してください（requests は累積カウンタで、再起動した 1 分の負の値は飛ばします）。\n結果には _time と _value だけを残します。\n", "hints": ["derivative(unit: 1m, nonNegative: true)"], "answer": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-15T02:57:00+08:00, stop: 2026-09-15T03:03:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"http\" and r._field == \"requests\" and r.service == \"api\")\n  |> derivative(unit: 1m, nonNegative: true)\n  |> keep(columns: [\"_time\", \"_value\"])\n", "explanation": "InfluxQL の non_negative_derivative と同じく、再起動した 1 分の負の値は飛ばされます。Flux には他に increase()（カウンタのリセットを自動で処理する累積増加量）や\ndifference(nonNegative: true) もあります。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "table 0", "table": {"columns": ["_time", "_value"], "rows": [["2026-09-15 02:58:00", 32.0], ["2026-09-15 02:59:00", 30.0], ["2026-09-15 03:00:00", null], ["2026-09-15 03:01:00", 21.0], ["2026-09-15 03:02:00", 20.0]], "total": 5}}]}, {"id": "write-points", "chapter": "書き込み", "title": "line protocol：測定値を 3 件書き込む", "prompt": "scratch バケットに、9 号センサー（sensor_id=9、kind=cold）の測定値を 3 件書き込みます。measurement は sensors です：\nタイムスタンプ（秒）1790726400、1790726700、1790727000 で、temperature はそれぞれ 4.1、4.3、4.2。\n", "hints": ["形式：measurement,tag1=値,tag2=値 field1=値,field2=値 タイムスタンプ", "measurement と tag の間はカンマ、tag と field の間は空白 1 つ、field と時刻の間も空白 1 つです。", "sensors,kind=cold,sensor_id=9 temperature=4.1 1790726400"], "answer": "sensors,kind=cold,sensor_id=9 temperature=4.1 1790726400\nsensors,kind=cold,sensor_id=9 temperature=4.3 1790726700\nsensors,kind=cold,sensor_id=9 temperature=4.2 1790727000\n", "explanation": "line protocol は InfluxDB の書き込み形式です：1 行に 1 点で、多くの行を一度に送れます（バッチ書き込み。1 バッチ 5,000 行程度が推奨）。\ntag を名前順に並べてから書き込むと、サーバーの処理が速くなります。空白、カンマ、イコールはバックスラッシュでエスケープします。タイムスタンプの単位は precision パラメータで決まります（ここでは秒）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "寫入 scratch", "text": "寫入 3 行（HTTP 204）", "error": false}], "checks": [{"cmd": "sensors", "table": {"columns": ["time", "kind", "sensor_id", "temperature"], "rows": [["2026-09-30 08:00:00", "cold", "9", 4.1], ["2026-09-30 08:05:00", "cold", "9", 4.3], ["2026-09-30 08:10:00", "cold", "9", 4.2]], "total": 3}}]}, {"id": "write-types", "chapter": "書き込み", "title": "field の型：整数には i を付ける", "prompt": "scratch に注文を 1 件書き込みます（measurement は orders）。タイムスタンプは 1790726400：\ntag は city=台北市、status=paid。field は total（整数 1990）、items（整数 2）、coupon（文字列 \"WELCOME\"）、gift（ブール値 true）。\n", "hints": ["整数は数字の後ろに i を付けます（1990i）。i のない数字は浮動小数点数です。", "文字列の field はダブルクォートで囲みます。ブール値は true / false と書きます（tag の値には引用符は不要）。"], "answer": "orders,city=台北市,status=paid total=1990i,items=2i,coupon=\"WELCOME\",gift=true 1790726400\n", "explanation": "field には 4 つの型があります：浮動小数点数（既定）、整数（i で終わる）、文字列（ダブルクォート）、ブール値。tag の値は常に文字列です。\n同じ field の型は最初の書き込みで決まります：以後同じ shard に別の型（例えば total=1.5）を書き込むと拒否されます（落とし穴問題で実演しています）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "寫入 scratch", "text": "寫入 1 行（HTTP 204）", "error": false}], "checks": [{"cmd": "orders", "table": {"columns": ["fieldKey", "fieldType"], "rows": [["coupon", "string"], ["gift", "boolean"], ["items", "integer"], ["total", "integer"]], "total": 4}}, {"cmd": "orders", "table": {"columns": ["time", "city", "coupon", "gift", "items", "status", "total"], "rows": [["2026-09-30 08:00:00", "台北市", "WELCOME", true, 2, "paid", 1990]], "total": 1}}]}, {"id": "write-overwrite", "chapter": "書き込み", "title": "書き間違えた値を修正する", "prompt": "センサー sensors,kind=cold,sensor_id=9 のタイムスタンプ 1790726400 の温度を書き間違えました。\nまず間違った値 temperature=41.0 を書き込み、次に 4.1 に「修正」します。終わった後、この時点のデータは 1 件だけで、値は 4.1 でなければなりません。\n", "hints": ["InfluxDB には UPDATE がありません：同じ series（measurement + tag set）、同じタイムスタンプでもう一度書き込むと、field の値が上書きされます。"], "answer": "sensors,kind=cold,sensor_id=9 temperature=41.0 1790726400\nsensors,kind=cold,sensor_id=9 temperature=4.1 1790726400\n", "explanation": "measurement + tag set + タイムスタンプが同じ点は「同じ点」とみなされ、後から書いた field の値が前の値を上書きします（異なる field はマージされます）。\n★ これは落とし穴でもあります：2 つのイベントがたまたま同じ秒・同じ tag の組み合わせ（例えば同じ顧客が同じ秒に 2 件注文）だと、後の 1 件が前の 1 件を上書きしてしまいます。\n解決策は、タイムスタンプをもっと細かい精度（ms、ns）にするか、区別できる tag を追加することです。データの削除には delete API を使います（時間範囲 + tag の条件で）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "寫入 scratch", "text": "寫入 2 行（HTTP 204）", "error": false}], "checks": [{"cmd": "sensors", "table": {"columns": ["time", "kind", "sensor_id", "temperature"], "rows": [["2026-09-30 08:00:00", "cold", "9", 4.1]], "total": 1}}]}], "traps": [{"id": "double-quotes", "title": "文字列をダブルクォートで囲む", "question": "A は tag の値をダブルクォートで \"db-01\" と書いています。何が返りますか？", "options": ["B と同じく 3 件", "データがなく、エラーにもならない", "構文エラー"], "answer": 1, "explanation": "InfluxQL のダブルクォートは「識別子」（measurement、tag、field の名前）を表し、シングルクォートだけが文字列の値です。\nhost = \"db-01\" は「host という tag が db-01 という tag / field の値に等しい」という意味になり、db-01 という列はないので何も一致せず、しかもエラーになりません。\n★ ルール：値はシングルクォート、名前はダブルクォート（名前に特殊文字や予約語があるときだけ必須）。\n", "setup": null, "scripts": [{"label": "A：host = \"db-01\"", "code": "-- InfluxQL\nSELECT usage_user FROM cpu WHERE host = \"db-01\" LIMIT 3"}, {"label": "B：host = 'db-01'", "code": "-- InfluxQL\nSELECT usage_user FROM cpu WHERE host = 'db-01' LIMIT 3"}], "results": [[{"cmd": "SELECT usage_user FROM cpu WHERE host = \"db-01\" LIMIT 3", "text": "完成，沒有回傳資料", "error": false}], [{"cmd": "cpu", "table": {"columns": ["time", "usage_user"], "rows": [["2026-09-01 00:00:00", 29.5], ["2026-09-01 00:01:00", 29.13], ["2026-09-01 00:02:00", 30.1]], "total": 3}}]]}, {"id": "tag-is-string", "title": "tag の値は数値？", "question": "sensor_id は 2、3、4… と書き込まれています。A は数値で sensor_id = 2 と比較しています。2 号のデータは見つかりますか？", "options": ["見つかる。InfluxDB が自動で型変換する", "見つからない：tag の値は常に文字列", "エラー：型が一致しない"], "answer": 1, "explanation": "tag の値は常に文字列で、\"2\" と数値の 2 は等しくないので、A は何も返しません（エラーにもなりません）。\n同様に、tag では数値の範囲比較ができず（sensor_id > 3 は文字列の比較）、sum や mean もできません。計算が必要な数値は field として保存しましょう。\n", "setup": null, "scripts": [{"label": "A：sensor_id = 2", "code": "-- InfluxQL\nSELECT temperature FROM sensors WHERE sensor_id = 2 LIMIT 2"}, {"label": "B：sensor_id = '2'", "code": "-- InfluxQL\nSELECT temperature FROM sensors WHERE sensor_id = '2' LIMIT 2"}], "results": [[{"cmd": "SELECT temperature FROM sensors WHERE sensor_id = 2 LIMIT 2", "text": "完成，沒有回傳資料", "error": false}], [{"cmd": "sensors", "table": {"columns": ["time", "temperature"], "rows": [["2026-09-01 00:00:00", 3.89], ["2026-09-01 00:05:00", 3.84]], "total": 2}}]]}, {"id": "no-tz", "title": "tz() のない GROUP BY time(1d)", "question": "db-01 の 9/18、9/19 の 2 日間（台湾時間）の日ごとの最大値。A には tz() がありません。何行返りますか？", "options": ["2 行、B と同じ", "3 行：UTC で区切られ、台湾の 1 日が午前 8 時から始まるので、先頭と末尾に 1 区間ずつ増える", "エラー：時間範囲にタイムゾーンがあるなら、GROUP BY にも必要"], "answer": 1, "explanation": "InfluxDB の時刻はすべて UTC で保存され、GROUP BY time(1d) は既定で UTC の午前 0 時で区切ります。台湾時間 9/18 00:00〜08:00 は UTC の 9/17 に属するので、1 行多くなり、毎日の値も正しくありません。\nTimescaleDB の time_bucket、Elasticsearch の date_histogram と同じ落とし穴です。Flux では option location を設定します。\n", "setup": null, "scripts": [{"label": "A：tz() なし", "code": "-- InfluxQL\nSELECT max(usage_user) FROM cpu\nWHERE host = 'db-01' AND time >= '2026-09-18T00:00:00+08:00' AND time < '2026-09-20T00:00:00+08:00'\nGROUP BY time(1d)"}, {"label": "B：tz('Asia/Taipei')", "code": "-- InfluxQL\nSELECT max(usage_user) FROM cpu\nWHERE host = 'db-01' AND time >= '2026-09-18T00:00:00+08:00' AND time < '2026-09-20T00:00:00+08:00'\nGROUP BY time(1d) tz('Asia/Taipei')"}], "results": [[{"cmd": "cpu", "table": {"columns": ["time", "max"], "rows": [["2026-09-17 08:00:00", 36.65], ["2026-09-18 08:00:00", 98.93], ["2026-09-19 08:00:00", 56.72]], "total": 3}}], [{"cmd": "cpu", "table": {"columns": ["time", "max"], "rows": [["2026-09-18 00:00:00", 98.93], ["2026-09-19 00:00:00", 56.72]], "total": 2}}]]}, {"id": "counter-reset", "title": "カウンタのリセット後の derivative", "question": "requests は累積カウンタで、api は 9/15 03:00 に再起動した後 0 から始まりました。A は derivative で 1 分ごとのリクエスト数を計算します。03:00 の行はいくつですか？", "options": ["約 20〜30、前後とほぼ同じ", "0", "非常に大きな負の数"], "answer": 2, "explanation": "derivative は「この点 − 前の点」です：再起動前の累積値は 360 万で、再起動後は最初から数え直すので、引き算すると -360 万になり、ダッシュボードには奇妙な深い谷が現れ、合計も引き下げられます。\n★ 累積カウンタには常に non_negative_derivative / non_negative_difference を使いましょう（Flux：nonNegative: true、または increase()）。\n", "setup": null, "scripts": [{"label": "A：derivative", "code": "-- InfluxQL\nSELECT derivative(last(requests), 1m) FROM http\nWHERE service = 'api' AND time >= '2026-09-15T02:57:00+08:00' AND time < '2026-09-15T03:03:00+08:00'\nGROUP BY time(1m)"}, {"label": "B：non_negative_derivative", "code": "-- InfluxQL\nSELECT non_negative_derivative(last(requests), 1m) FROM http\nWHERE service = 'api' AND time >= '2026-09-15T02:57:00+08:00' AND time < '2026-09-15T03:03:00+08:00'\nGROUP BY time(1m)"}], "results": [[{"cmd": "http", "table": {"columns": ["time", "derivative"], "rows": [["2026-09-15 02:57:00", 30], ["2026-09-15 02:58:00", 32], ["2026-09-15 02:59:00", 30], ["2026-09-15 03:00:00", -3604579], ["2026-09-15 03:01:00", 21], ["2026-09-15 03:02:00", 20]], "total": 6}}], [{"cmd": "http", "table": {"columns": ["time", "non_negative_derivative"], "rows": [["2026-09-15 02:57:00", 30], ["2026-09-15 02:58:00", 32], ["2026-09-15 02:59:00", 30], ["2026-09-15 03:01:00", 21], ["2026-09-15 03:02:00", 20]], "total": 5}}]]}, {"id": "group-by-field", "title": "field で GROUP BY する", "question": "customer_id は tag ではなく field です。A は顧客ごとの注文数を求めたいのですが、何が得られますか？", "options": ["顧客ごとに 1 グループ", "すべてが 1 つのグループにまとまる（customer_id は空）", "エラー：field では GROUP BY できない"], "answer": 1, "explanation": "GROUP BY が認識するのは tag だけです：customer_id という tag が見つからないと、各点のこの tag を空とみなし、すべての注文が同じグループに入ります。しかもエラーになりません。\n★ グループ化が必要な列は tag として設計しますが、顧客番号のように値が非常に多い列を tag にすると series が爆発します。\nこのような「高カーディナリティの列でグループ化する」分析は InfluxDB の得意分野ではなく、PostgreSQL、ClickHouse、あるいは Flux の group()（field でもグループ化できるが遅い）に任せましょう。\n", "setup": null, "scripts": [{"label": "A：GROUP BY customer_id", "code": "-- InfluxQL\nSELECT count(total) FROM orders\nWHERE time >= '2026-09-01T00:00:00+08:00' AND time < '2026-10-01T00:00:00+08:00'\nGROUP BY customer_id"}], "results": [[{"cmd": "orders  [customer_id=]", "table": {"columns": ["time", "count"], "rows": [["2026-09-01 00:00:00", 2919]], "total": 1}}]]}, {"id": "select-only-tags", "title": "tag だけを SELECT する", "question": "A は host という tag だけを検索し、各データがどのホストかを一覧にしたいと考えています。結果は？", "options": ["3 件、それぞれ 1 台のホスト", "データなし", "すべてのホスト名（重複なし）"], "answer": 1, "explanation": "InfluxQL の SELECT には少なくとも 1 つの field が必要で、tag だけでは何も返しません（点は field でできており、tag は説明にすぎない）。\ntag の値を一覧にするには SHOW TAG VALUES を使い、各データの tag を見たいなら field と一緒に SELECT します。\n", "setup": null, "scripts": [{"label": "A：SELECT host", "code": "-- InfluxQL\nSELECT host FROM cpu LIMIT 3"}, {"label": "B：field を 1 つ加える", "code": "-- InfluxQL\nSELECT host, usage_user FROM cpu LIMIT 3"}], "results": [[{"cmd": "SELECT host FROM cpu LIMIT 3", "text": "完成，沒有回傳資料", "error": false}], [{"cmd": "cpu", "table": {"columns": ["time", "host", "usage_user"], "rows": [["2026-09-01 00:00:00", "cache-01", 10.53], ["2026-09-01 00:00:00", "db-01", 29.5], ["2026-09-01 00:00:00", "web-01", 25.19]], "total": 3}}]]}, {"id": "limit-per-series", "title": "GROUP BY host に LIMIT 1 を付ける", "question": "SELECT * FROM cpu GROUP BY host LIMIT 1 は何行返しますか？", "options": ["1 行", "5 行：各ホスト（各 series）に 1 行ずつ", "エラー"], "answer": 1, "explanation": "GROUP BY tag があるとき、LIMIT / OFFSET は「series ごとに」件数を制限します。series の数を制限するには SLIMIT / SOFFSET を使います。\nこの「まず series に分け、series ごとに処理する」という考え方は InfluxDB 全体に通じています（Flux の「テーブルごとに処理する」も同じです）。\n", "setup": null, "scripts": [{"label": "LIMIT 1 + GROUP BY host", "code": "-- InfluxQL\nSELECT * FROM cpu GROUP BY host LIMIT 1"}], "results": [[{"cmd": "cpu  [host=cache-01]", "table": {"columns": ["time", "region", "role", "usage_system", "usage_user"], "rows": [["2026-09-01 00:00:00", "tpe", "cache", 3.72, 10.53]], "total": 1}}, {"cmd": "cpu  [host=db-01]", "table": {"columns": ["time", "region", "role", "usage_system", "usage_user"], "rows": [["2026-09-01 00:00:00", "tpe", "db", 10.02, 29.5]], "total": 1}}, {"cmd": "cpu  [host=web-01]", "table": {"columns": ["time", "region", "role", "usage_system", "usage_user"], "rows": [["2026-09-01 00:00:00", "tpe", "web", 6.15, 25.19]], "total": 1}}, {"cmd": "cpu  [host=web-02]", "table": {"columns": ["time", "region", "role", "usage_system", "usage_user"], "rows": [["2026-09-01 00:00:00", "tpe", "web", 7.14, 23.38]], "total": 1}}, {"cmd": "cpu  [host=web-03]", "table": {"columns": ["time", "region", "role", "usage_system", "usage_user"], "rows": [["2026-09-01 00:00:00", "tch", "web", 8.42, 22.63]], "total": 1}}]]}, {"id": "unbounded-flux", "title": "range のない Flux", "question": "A の Flux には range() がなく、すべての cpu データを読み出そうとしています。結果は？", "options": ["すべてのデータを読み出す（遅い）", "エラー：range で時間を限定する必要がある", "既定で直近 1 時間を読む"], "answer": 1, "explanation": "Flux は「時間範囲のない」読み取りを許しません：from の後には必ず range が必要です（cannot submit unbounded read）。\nストレージエンジンは時間でデータを shard に分けているので、どの shard を読むか決めるには時間範囲が必要です。InfluxQL は時間条件がないとすべて（1677 年から現在まで）を読むので、同じく遅くなります。\n", "setup": null, "scripts": [{"label": "A：from |> filter", "code": "// Flux\nfrom(bucket: \"metrics\")\n  |> filter(fn: (r) => r._measurement == \"cpu\")\n  |> limit(n: 1)"}], "results": [[{"cmd": "Flux", "text": "error in building plan while starting program: cannot submit unbounded read to \"metrics\"; try bounding 'from' with a call to 'range'", "error": true}]]}, {"id": "flux-window-time", "title": "aggregateWindow の _time", "question": "どちらも 1 時間ごとに区切ります。InfluxQL（A）の time は区間の開始です。Flux の aggregateWindow（B）の _time は？", "options": ["同じく区間の開始", "区間の終了", "区間内の最後のデータの時刻"], "answer": 1, "explanation": "aggregateWindow は既定で timeSrc: \"_stop\" です：_time は区間の終了です（13:00〜14:00 の平均は 14:00 に表示される）。InfluxQL は区間の開始（13:00）に表示します。\n2 つのクエリを混ぜて使ったり、InfluxQL を Flux に書き換えたりすると、グラフ全体が 1 区間ずれます。揃えるには timeSrc: \"_start\" を設定します。\n", "setup": null, "scripts": [{"label": "A：InfluxQL GROUP BY time(1h)", "code": "-- InfluxQL\nSELECT mean(usage_user) FROM cpu\nWHERE host = 'db-01' AND time >= '2026-09-18T13:00:00+08:00' AND time < '2026-09-18T15:00:00+08:00'\nGROUP BY time(1h)"}, {"label": "B：Flux aggregateWindow(every: 1h)", "code": "// Flux\nfrom(bucket: \"metrics\")\n  |> range(start: 2026-09-18T13:00:00+08:00, stop: 2026-09-18T15:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\" and r.host == \"db-01\")\n  |> aggregateWindow(every: 1h, fn: mean)\n  |> keep(columns: [\"_time\", \"_value\"])"}], "results": [[{"cmd": "cpu", "table": {"columns": ["time", "mean"], "rows": [["2026-09-18 13:00:00", 37.2308], ["2026-09-18 14:00:00", 76.4702]], "total": 2}}], [{"cmd": "table 0", "table": {"columns": ["_time", "_value"], "rows": [["2026-09-18 14:00:00", 37.2308], ["2026-09-18 15:00:00", 76.4702]], "total": 2}}]]}, {"id": "same-timestamp", "title": "同じ秒に 2 件書き込む", "question": "同じ顧客（同じ tag の組み合わせ）が同じ秒に 2 件注文し、それぞれ 1 点として書き込みました。検索すると何件ありますか？", "options": ["2 件", "1 件：後の 1 件が前の 1 件を上書きした", "書き込み失敗：タイムスタンプが重複"], "answer": 1, "explanation": "measurement + tag set + タイムスタンプが同じなら「同じ点」です：後から書き込んだ field の値がそのまま上書きし、1 件目の注文は消えてしまいます。しかもエラーは一切ありません。\n★ 解決策：タイムスタンプをより細かい精度（ms、µs、ns）にするか、区別できる値を tag に入れます（ただし高カーディナリティの値は不可）。\nこれは InfluxDB でデータを修正する方法でもあります：同じ時点にもう一度書き込むのです。\n", "setup": null, "scripts": [{"label": "2 件書き込んでから検索", "code": "# line protocol（scratch に書き込み）\norders,city=台北市,status=paid order_id=1001i,total=500i 1790726400\norders,city=台北市,status=paid order_id=1002i,total=1200i 1790726400\n\n-- InfluxQL\nSELECT * FROM orders"}], "results": [[{"cmd": "寫入 scratch", "text": "寫入 2 行（HTTP 204）", "error": false}, {"cmd": "orders", "table": {"columns": ["time", "city", "order_id", "status", "total"], "rows": [["2026-09-30 08:00:00", "台北市", 1002, "paid", 1200]], "total": 1}}]]}, {"id": "field-type-conflict", "title": "同じ field に異なる型を書き込む", "question": "最初に total=100i（整数）を書き込み、1 分後に total=1.5（浮動小数点数）を書き込みます。2 回目の書き込みはどうなりますか？", "options": ["成功し、total は自動で浮動小数点数になる", "失敗：field type conflict。データベースには 1 件目だけがある", "成功し、1.5 は 1 に切り捨てられる"], "answer": 1, "explanation": "同じ shard の中では、1 つの field は 1 つの型しか持てません：最初に書き込んだのが整数なら、以後の浮動小数点数は拒否されます（field type conflict）。\n同じバッチ（同じリクエスト）に 1 行でも衝突があると、バッチ全体が拒否されることがあるので、プログラムはレスポンスを確認し、失敗したデータを記録する必要があります。\n★ プログラムから数値を送るときは常に型を明示的に決め（整数には i を付ける）、値が「整数っぽく見えるか」で自動判断しないようにしましょう（例えば 100.0 が 100 とシリアライズされる）。\n", "setup": null, "scripts": [{"label": "2 回書き込んでから検索", "code": "# line protocol（scratch に書き込み）\norders,city=台北市 total=100i 1790726400\n\n# line protocol（scratch に書き込み）\norders,city=台北市 total=1.5 1790726460\n\n-- InfluxQL\nSELECT * FROM orders"}], "results": [[{"cmd": "寫入 scratch", "text": "寫入 1 行（HTTP 204）", "error": false}, {"cmd": "寫入 scratch", "text": "failure writing points to database: partial write: field type conflict: input field \"total\" on measurement \"orders\" is type float, already exists as type integer dropped=1", "error": true}, {"cmd": "orders", "table": {"columns": ["time", "city", "total"], "rows": [["2026-09-30 08:00:00", "台北市", 100]], "total": 1}}]]}], "steps": [{"id": "raw", "title": "生データを読む", "goal": "db-01 の 9/18 14:00〜14:05 の usage_user。", "question": "両方の結果は同じ形をしていますか？", "takeaway": "InfluxQL は「1 つの series、複数の列」のテーブル（time、usage_user）を返し、SQL とよく似ています。\nFlux が返す各行は完全な情報を持っています：_start、_stop（クエリの範囲）、_time、_value、_field、_measurement、そしてすべての tag。\nFlux のデータモデルは「1 行に 1 つの値」です：2 つの field を同時に見るには pivot が必要です（ステップ 4 を参照）。\n", "setup": [], "queries": [{"label": "InfluxQL", "code": "SELECT usage_user FROM cpu\nWHERE host = 'db-01' AND time >= '2026-09-18T14:00:00+08:00' AND time < '2026-09-18T14:05:00+08:00'\n"}, {"label": "Flux", "code": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-18T14:00:00+08:00, stop: 2026-09-18T14:05:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\" and r.host == \"db-01\")\n"}]}, {"id": "group", "title": "ホストごとの平均", "goal": "9/18 の 1 日の各ホストの usage_user の平均。", "question": "Flux には GROUP BY host がないのに、なぜホストごとに 1 つずつ平均が出るのでしょう？", "takeaway": "InfluxQL は既定で measurement 全体をまとめて計算し、GROUP BY tag で分けます。\nFlux はちょうど逆です：from で読み出した時点で series（measurement + tag + field）ごとに 1 つのテーブルになっており、mean() はテーブルごとに 1 回計算するので、既定で「series ごとに 1 つの値」になります。\nすべてをまとめて計算するには先に group()、特定の tag でグループ化するには group(columns: [\"role\"]) を使います。\n", "setup": [], "queries": [{"label": "InfluxQL", "code": "SELECT mean(usage_user) FROM cpu\nWHERE time >= '2026-09-18T00:00:00+08:00' AND time < '2026-09-19T00:00:00+08:00'\nGROUP BY host\n"}, {"label": "Flux", "code": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-18T00:00:00+08:00, stop: 2026-09-19T00:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\")\n  |> mean()\n  |> keep(columns: [\"host\", \"_value\"])\n"}]}, {"id": "timezone", "title": "台湾時間での 1 日ごと", "goal": "db-01 の 9/18、9/19 の日ごとの最大値。", "question": "両方の時刻の列は同じですか？", "takeaway": "値は同じで、時刻が違います：InfluxQL の time は区間の開始（9/18 00:00）、Flux の aggregateWindow は既定で区間の終了（9/19 00:00）に表示します。\nタイムゾーン：InfluxQL は tz()、Flux は option location を使い、どちらも明示的に指定しないと UTC で区切られます。\n", "setup": [], "queries": [{"label": "InfluxQL", "code": "SELECT max(usage_user) FROM cpu\nWHERE host = 'db-01' AND time >= '2026-09-18T00:00:00+08:00' AND time < '2026-09-20T00:00:00+08:00'\nGROUP BY time(1d) tz('Asia/Taipei')\n"}, {"label": "Flux", "code": "import \"timezone\"\noption location = timezone.location(name: \"Asia/Taipei\")\n\nfrom(bucket: \"metrics\")\n  |> range(start: 2026-09-18T00:00:00+08:00, stop: 2026-09-20T00:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\" and r.host == \"db-01\")\n  |> aggregateWindow(every: 1d, fn: max)\n  |> keep(columns: [\"_time\", \"_value\"])\n"}]}, {"id": "arithmetic", "title": "2 つの field を足し合わせる", "goal": "db-01 の 9/18 14:00〜14:05 の usage_user + usage_system。", "question": "なぜ Flux には pivot が 1 つ余分に必要なのでしょう？", "takeaway": "InfluxQL の 1 行には複数の field があるので、直接足し算できます。Flux の 2 つの field は別々のテーブル・別々の行にあるので、まず pivot で同じ行にまとめ（_field の値が列名になる）、それから map で計算します。\nmap は任意の新しい列を作れ、InfluxQL の四則演算より強力です（文字列処理、条件分岐、measurement をまたいだ join）。\n", "setup": [], "queries": [{"label": "InfluxQL", "code": "SELECT usage_user + usage_system AS total FROM cpu\nWHERE host = 'db-01' AND time >= '2026-09-18T14:00:00+08:00' AND time < '2026-09-18T14:05:00+08:00'\n"}, {"label": "Flux", "code": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-18T14:00:00+08:00, stop: 2026-09-18T14:05:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r.host == \"db-01\")\n  |> pivot(rowKey: [\"_time\"], columnKey: [\"_field\"], valueColumn: \"_value\")\n  |> map(fn: (r) => ({ _time: r._time, total: r.usage_user + r.usage_system }))\n"}]}, {"id": "ranking", "title": "series をまたいだ順位付け", "goal": "9 月 1 か月間で、平均 usage_user が最も高い 3 台のホスト。", "question": "2 つの書き方は何が違いますか？", "takeaway": "InfluxQL では値で ORDER BY できず、top(field, tag, N)「tag でグループ化して各グループの最大を取り、上位 N グループを取る」しか使えません。series をまたいだ順位付けにはサブクエリとの組み合わせが必要です。\nFlux は group() で 1 つのテーブルにまとめてから sort、limit するので、SQL と同じ考え方です。\n1 位は db-01 です（データベースは普段から忙しく、さらに 9/18 の障害もあった）。\n", "setup": [], "queries": [{"label": "InfluxQL", "code": "SELECT top(mean, host, 3) FROM (\n  SELECT mean(usage_user) FROM cpu\n  WHERE time >= '2026-09-01T00:00:00+08:00' AND time < '2026-10-01T00:00:00+08:00'\n  GROUP BY host\n)\n"}, {"label": "Flux", "code": "from(bucket: \"metrics\")\n  |> range(start: 2026-09-01T00:00:00+08:00, stop: 2026-10-01T00:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\")\n  |> mean()\n  |> group()\n  |> sort(columns: [\"_value\"], desc: true)\n  |> limit(n: 3)\n  |> keep(columns: [\"host\", \"_value\"])\n"}]}, {"id": "join", "title": "measurement をまたぐ：CPU とメモリ", "goal": "9/30 の 1 日の各ホストの平均 CPU と平均メモリ使用率を、同じ行に並べます。", "question": "InfluxQL で 2 つの measurement を同じ行に並べられますか？", "takeaway": "InfluxQL には JOIN がありません：2 つのクエリに分けて、アプリケーションで結合するしかありません。\nFlux は異なる measurement、異なる bucket、さらには（sql パッケージで）リレーショナルデータベースのデータまで join できます。これが Flux が設計された主な理由の 1 つです。\nweb-03 は 9/20 にオフラインになり 9/30 のデータがないので、結果は 4 台のホストだけです。\n（InfluxDB 3 は SQL に戻りました：JOIN、サブクエリ、ウィンドウ関数はすべて標準 SQL で書きます。）\n", "setup": [], "queries": [{"label": "InfluxQL", "code": "SELECT mean(usage_user) FROM cpu\nWHERE time >= '2026-09-30T00:00:00+08:00' AND time < '2026-10-01T00:00:00+08:00' GROUP BY host;\nSELECT mean(used_percent) FROM mem\nWHERE time >= '2026-09-30T00:00:00+08:00' AND time < '2026-10-01T00:00:00+08:00' GROUP BY host\n"}, {"label": "Flux", "code": "cpu = from(bucket: \"metrics\")\n  |> range(start: 2026-09-30T00:00:00+08:00, stop: 2026-10-01T00:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"cpu\" and r._field == \"usage_user\")\n  |> mean()\nmem = from(bucket: \"metrics\")\n  |> range(start: 2026-09-30T00:00:00+08:00, stop: 2026-10-01T00:00:00+08:00)\n  |> filter(fn: (r) => r._measurement == \"mem\" and r._field == \"used_percent\")\n  |> mean()\njoin(tables: { cpu: cpu, mem: mem }, on: [\"host\"])\n  |> keep(columns: [\"host\", \"_value_cpu\", \"_value_mem\"])\n"}]}]}, {"id": "elasticsearch", "name": "Elasticsearch", "lang": "es", "labName": "関連度実験", "labNote": "各ステップで同じデータを異なるクエリで検索し、上位の結果と _score を比較します：IDF、フィールド長、フィールドの重み、function_score、スコアに影響しない filter。アナライザと書き込み動作（ニアリアルタイム、バージョン競合、mapping、同義語、ディープページング）の実験は操作が必要なため、ショーケースアプリの「実験室」で行ってください。", "hasResults": true, "exercises": [{"id": "get-doc", "chapter": "クエリの基本", "title": "_id でドキュメントを 1 件取得", "prompt": "products インデックスから _id が 806 の商品を取得してください。\n", "hints": ["GET /インデックス/_doc/_id"], "answer": "GET /products/_doc/806\n", "explanation": "_id でのドキュメント取得は「リアルタイム」です（realtime GET）：書き込んだばかりでまだ refresh されていなくても取得できます（_search ではそうとは限りません。実験室を参照）。\nレスポンスの _version、_seq_no、_primary_term は楽観的ロック（if_seq_no / if_primary_term）に使います。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /products/_doc/806  (200)", "text": "{\n  \"_index\": \"products\",\n  \"_id\": \"806\",\n  \"_version\": 1,\n  \"_seq_no\": 805,\n  \"_primary_term\": 1,\n  \"found\": true,\n  \"_source\": {\n    \"name\": \"Sony 無線耳機 F178\",\n    \"brand\": \"Sony\",\n    \"category\": \"無線耳機\",\n    \"category_path\": [\n      \"3C電子\",\n      \"耳機\",\n      \"無線耳機\"\n    ],\n    \"description\": \"Sony 無線耳機：藍色，藍牙無線，主動降噪，續航 10 小時\",\n    \"price\": 3279,\n    \"stock\": 58,\n    \"is_active\": true,\n    \"tags\": [],\n    \"specs\": {\n      \"color\": \"藍\",\n      \"warranty\": {\n        \"type\": \"店家\",\n        \"years\": 2\n      },\n      \"battery_hours\": 10,\n      \"noise_cancelling\": true\n    },\n    \"created_at\": \"2021-09-03\",\n    \"rating\": 3.1,\n    \"review_count\": 13\n  }\n}"}]}, {"id": "match-basic", "chapter": "クエリの基本", "title": "全文検索：match", "prompt": "商品説明（description）で「降噪」（ノイズキャンセリング）に触れている商品を、関連度順に上位 5 件。\n", "hints": ["GET /products/_search、body は { \"size\": 5, \"query\": { \"match\": { フィールド: テキスト } } }"], "answer": "GET /products/_search\n{\n  \"size\": 5,\n  \"query\": { \"match\": { \"description\": \"降噪\" } }\n}\n", "explanation": "match はまずフィールドのアナライザ（description は cjk）で「降噪」を語に分析し、転置インデックスでその語を含むドキュメントを探し、BM25 で関連度スコア（_score）を計算します。\nスコアが同じ場合は、インデックス内のドキュメントの順で並びます。レスポンスの hits.total は一致した総数です（1 万を超えると既定では「≥ 10000」とだけ報告します）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /products/_search  (200)", "table": {"columns": ["_id", "_score", "name", "description", "price", "rating"], "rows": [["127", 2.989, "小米 無線耳機 W381", "小米 無線耳機：銀色，藍牙無線，主動降噪，續航 8 小時", 4119, 4.2], ["151", 2.989, "Sony 無線耳機 N677", "Sony 無線耳機：藍色，藍牙無線，主動降噪，續航 30 小時", 5439, source\": [\"name\", \"rating\", \"review_count\"] でこれらのフィールドだけを返します。"], "answer": "GET /products/_search\n{\n  \"size\": 5,\n  \"_source\": [\"name\", \"rating\", \"review_count\"],\n  \"sort\": [\n    { \"rating\": \"desc\" },\n    { \"review_count\": \"desc\" },\n    { \"price\": \"asc\" }\n  ]\n}\n", "explanation": "sort があると関連度スコアは計算されず（_score は null）、フィールドの値で並べ替えます（列指向ストレージの doc values を使う）。\n★ 評価 5.0 の商品はレビューが 1 件だけかもしれません。実務の「人気順」ではレビュー数も考慮に入れたり（例えばベイズ平均）、function_score でスコアを調整したりします。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /products/_search  (200)", "table": {"columns": ["_id", "_score", "name", "rating", "review_count"], "rows": [["1339", null, "乖乖 零食 H461", 5.0, 5], ["348", null, "Kiehls 保養 Z504", 4.9, 16], ["1335", null, "UNIQLO 男裝 I287", 4.9, 14], ["850", null, "Coleman 露營用品 I954", 4.9, 12], ["1063", null, "金車 飲料 R547", 4.8, 14]], "total": 1500}}]}, {"id": "analyze-cjk", "chapter": "全文検索とアナライザ", "title": "アナライザがどんな語に分けるかを見る", "prompt": "cjk アナライザで「主動降噪耳機」（アクティブノイズキャンセリングイヤホン）を分析し、どんな語に分けられるかを見てください。\n", "hints": ["POST /_analyze { \"analyzer\": \"cjk\", \"text\": \"…\" }"], "answer": "POST /_analyze\n{\n  \"analyzer\": \"cjk\",\n  \"text\": \"主動降噪耳機\"\n}\n", "explanation": "cjk アナライザは中国語・日本語・韓国語の文字を 2 文字ずつ（bigram）にします：主動、動降、降噪、噪耳、耳機。\nstandard アナライザは 1 文字 1 語なので（主、動、降、噪、耳、機）、「降噪」がばらばらになり、検索すると無関係なドキュメントが大量に見つかりがちです。\nどちらも本当の「形態素解析」ではありません：中国語の分かち書きにはプラグイン（IK、smartcn、jieba）が必要で、それで初めて「主動 / 降噪 / 耳機」に分けられます。\nインデックスのフィールドを指定することもできます：POST /products/_analyze { \"field\": \"name\", \"text\": \"…\" } とすると、そのフィールドに設定されたアナライザを使います。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "POST /_analyze  (200)", "text": "{\n  \"tokens\": [\n    {\n      \"token\": \"主動\",\n      \"start_offset\": 0,\n      \"end_offset\": 2,\n      \"type\": \"<DOUBLE>\",\n      \"position\": 0\n    },\n    {\n      \"token\": \"動降\",\n      \"start_offset\": 1,\n      \"end_offset\": 3,\n      \"type\": \"<DOUBLE>\",\n      \"position\": 1\n    },\n    {\n      \"token\": \"降噪\",\n      \"start_offset\": 2,\n      \"end_offset\": 4,\n      \"type\": \"<DOUBLE>\",\n      \"position\": 2\n    },\n    {\n      \"token\": \"噪耳\",\n      \"start_offset\": 3,\n      \"end_offset\": 5,\n      \"type\": \"<DOUBLE>\",\n      \"position\": 3\n    },\n    {\n      \"token\": \"耳機\",\n      \"start_offset\": 4,\n      \"end_offset\": 6,\n      \"type\": \"<DOUBLE>\",\n      \"position\": 4\n    }\n  ]\n}"}]}, {"id": "match-and", "chapter": "全文検索とアナライザ", "title": "すべての語が必要：operator and", "prompt": "レビュー内容（content）で「音質」と「降噪」の両方に触れているレビューは何件ですか？\n", "hints": ["match は既定で OR です：いずれかの語が一致すれば一致とみなします。", "{ \"match\": { \"content\": { \"query\": \"音質 降噪\", \"operator\": \"and\" } } }"], "answer": "GET /reviews/_count\n{\n  \"query\": {\n    \"match\": { \"content\": { \"query\": \"音質 降噪\", \"operator\": \"and\" } }\n  }\n}\n", "explanation": "match の既定の operator は or です：「音質 降噪」は「音質」か「降噪」のどちらかがあれば一致するので、結果がずっと多くなります。\noperator and ではすべての語が必要です。その中間には minimum_should_match（例えば \"75%\"、\"2\"）を使います。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /reviews/_count  (200)", "text": "{\n  \"count\": 93\n}"}]}, {"id": "match-phrase", "chapter": "全文検索とアナライザ", "title": "フレーズ：match_phrase", "prompt": "内容に「通勤戴很舒服」（通勤中に着けてもとても快適）という完全なフレーズがあるレビューは何件ですか？\n", "hints": ["match_phrase：すべての語が出現し、しかも順序と位置が隣り合っている必要があります。"], "answer": "GET /reviews/_count\n{\n  \"query\": { \"match_phrase\": { \"content\": \"通勤戴很舒服\" } }\n}\n", "explanation": "match はいずれかの語（通勤、勤戴、戴很、很舒、舒服）があれば一致するので、2 千件以上見つかります。match_phrase はこれらの語が順に隣り合っていることを求めるので、本当にこの文を含むレビューだけになります。\n転置インデックスは「どのドキュメントにこの語があるか」だけでなく、語がドキュメント内のどの位置（position）にあるかも記録しており、match_phrase はその位置で判断します。\nslop パラメータを使うと、間にいくつかの語が入ることを許容できます。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /reviews/_count  (200)", "text": "{\n  \"count\": 266\n}"}]}, {"id": "multi-match", "chapter": "全文検索とアナライザ", "title": "複数のフィールド + 重み", "prompt": "「Sony 耳機」（Sony イヤホン）を検索します：name と description の両方を検索し、name の重みを description の 3 倍にして、上位 5 件を取ります。\n", "hints": ["multi_match の fields には \"name^3\" と書くと 3 倍になります。"], "answer": "GET /products/_search\n{\n  \"size\": 5,\n  \"query\": {\n    \"multi_match\": {\n      \"query\": \"Sony 耳機\",\n      \"fields\": [\"name^3\", \"description\"]\n    }\n  }\n}\n", "explanation": "multi_match の既定は best_fields です：フィールドごとにスコアを計算し、最も高いものを取ります（さらに他のフィールドの tie_breaker 倍を加える）。\n他の種類：most_fields（各フィールドのスコアを合計）、cross_fields（複数のフィールドを 1 つの大きなフィールドとして扱う。姓と名を別々に保存している場合に向く）、phrase。\n重み（boost）は関連度を調整する最もよく使う道具です：タイトルや名称は通常、本文より重要です。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /products/_search  (200)", "table": {"columns": ["_id", "_score", "name", "description", "price", "rating"], "rows": [["151", 14.75, "Sony 無線耳機 N677", "Sony 無線耳機：藍色，藍牙無線，主動降噪，續航 30 小時", 5439, 4.6], ["159", 14.75, "Sony 無線耳機 U730", "Sony 無線耳機：白色，藍牙無線，續航 24 小時", 3769, 4.3], ["233", 14.75, "Sony 無線耳機 X216", "Sony 無線耳機：白色，藍牙無線，主動降噪，續航 6 小時", 4699, 3.5], ["249", 14.75, "Sony 有線耳機 P576", "Sony 有線耳機：銀色，線長 1.2 公尺", 1579, 3.8], ["274", 14.75, "Sony 有線耳機 J909", "Sony 有線耳機：白色，線長 2.0 公尺", 2279, 3.7]], "total": 178}}]}, {"id": "fuzzy", "chapter": "全文検索とアナライザ", "title": "打ち間違えても見つかる：fuzziness", "prompt": "ユーザーが Samsung を「Samsng」と打ち間違えました。match に fuzziness（\"AUTO\"）を付けて name フィールドを検索すると、商品は何件ですか？\n", "hints": ["{ \"match\": { \"name\": { \"query\": \"Samsng\", \"fuzziness\": \"AUTO\" } } }"], "answer": "GET /products/_count\n{\n  \"query\": {\n    \"match\": { \"name\": { \"query\": \"Samsng\", \"fuzziness\": \"AUTO\" } }\n  }\n}\n", "explanation": "fuzziness は編集距離（Levenshtein）で近い語を探します：samsng → samsung は 1 文字挿入するだけ（距離 1）です。\nAUTO：1〜2 文字は誤りを許さず、3〜5 文字は 1 つまで、それより長ければ 2 つまで許します。\n★ 中国語の bigram にはあまり役立ちません（2 文字の語で 1 文字間違えると別の語になる）。中国語の誤字や同音字は、通常は同義語辞書やピンインのプラグインで対処します。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /products/_count  (200)", "text": "{\n  \"count\": 16\n}"}]}, {"id": "should-minimum", "chapter": "全文検索とアナライザ", "title": "そのうち少なくともいくつか一致：minimum_should_match", "prompt": "レビュー内容が「音質」「續航」（バッテリー持続時間）「降噪」の 3 つの語のうち「少なくとも 2 つ」に触れているレビューは何件ですか？\n", "hints": ["bool の should に 3 つの match_phrase を入れ、\"minimum_should_match\": 2 を加えます"], "answer": "GET /reviews/_count\n{\n  \"query\": {\n    \"bool\": {\n      \"should\": [\n        { \"match_phrase\": { \"content\": \"音質\" } },\n        { \"match_phrase\": { \"content\": \"續航\" } },\n        { \"match_phrase\": { \"content\": \"降噪\" } }\n      ],\n      \"minimum_should_match\": 2\n    }\n  }\n}\n", "explanation": "should は既定では「加点」です：多く一致するほどスコアが高くなります。must / filter がないときは少なくとも 1 つの一致が必要で、minimum_should_match を加えると「少なくともいくつか一致」になります。\nmatch で書いても構いません：「音質」「續航」「降噪」はどれも 2 文字なので、cjk で分析するとちょうど 1 つの語になります。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /reviews/_count  (200)", "text": "{\n  \"count\": 244\n}"}]}, {"id": "terms-agg", "chapter": "集約", "title": "グループごとの件数：terms", "prompt": "商品数が最も多い 5 つのブランド（brand）と、それぞれの商品数。集約の結果だけが必要で、ドキュメントは不要です（size: 0）。\n", "hints": ["\"aggs\": { \"by_brand\": { \"terms\": { \"field\": \"brand\", \"size\": 5 } } }"], "answer": "GET /products/_search\n{\n  \"size\": 0,\n  \"aggs\": {\n    \"by_brand\": { \"terms\": { \"field\": \"brand\", \"size\": 5 } }\n  }\n}\n", "explanation": "terms 集約 ≈ SQL の GROUP BY … ORDER BY count(*) DESC LIMIT 5。既定では doc_count の多い順で、同数なら key 順です。\n★ シャードが多いと terms の件数は近似値です：各シャードがまずそれぞれ上位 shard_size 件を取ってからマージするので、数え漏れが起こり得ます（doc_count_error_upper_bound が起こり得る誤差です）。\nterms は keyword や数値のような doc values のあるフィールドにしか使えません。text フィールドには使えません（その .keyword サブフィールドを使います）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /products/_search  (200)", "text": "hits.total = 1500\naggregations = {\n  \"by_brand\": {\n    \"doc_count_error_upper_bound\": 0,\n    \"sum_other_doc_count\": 1216,\n    \"buckets\": [\n      {\n        \"key\": \"IKEA\",\n        \"doc_count\": 69\n      }
