"doc_count\": 7\n      },\n      {\n        \"key\": \"192.0.2.222\",\n        \"doc_count\": 7\n      }\n    ]\n  }\n}"}]}, {"id": "unique-users", "chapter": "集約", "title": "異なるユーザーは何人いるか：cardinality", "prompt": "logs には異なる user_id がいくつありますか？\n", "hints": ["{ \"cardinality\": { \"field\": \"user_id\" } }"], "answer": "GET /logs/_search\n{\n  \"size\": 0,\n  \"aggs\": {\n    \"users\": { \"cardinality\": { \"field\": \"user_id\" } }\n  }\n}\n", "explanation": "cardinality ≈ count(DISTINCT …) ですが近似値です（HyperLogLog++）：異なる値が何百万あっても、メモリ使用量は一定です。\nprecision_threshold（既定 3000）以下ではほぼ正確で、それを超えると誤差は約 1〜2% です。正確な数値が必要なら、composite 集約ですべての値をめくっていくしかありません。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /logs/_search  (200)", "text": "hits.total = 10000+\naggregations = {\n  \"users\": {\n    \"value\": 19786\n  }\n}"}]}, {"id": "nested-query", "chapter": "ネストしたドキュメント", "title": "同じ明細が同時に一致：nested", "prompt": "orders の items は nested 型です。「カテゴリが手機（スマートフォン）で、数量が 2 以上」の同じ明細を含む注文は何件ありますか？\n", "hints": ["{ \"nested\": { \"path\": \"items\", \"query\": { \"bool\": { \"filter\": [ … ] } } } }", "nested の中のフィールドは完全なパスで書きます：items.category、items.quantity"], "answer": "GET /orders/_count\n{\n  \"query\": {\n    \"nested\": {\n      \"path\": \"items\",\n      \"query\": {\n        \"bool\": {\n          \"filter\": [\n            { \"term\": { \"items.category\": \"手機\" } },\n            { \"range\": { \"items.quantity\": { \"gte\": 2 } } }\n          ]\n        }\n      }\n    }\n  }\n}\n", "explanation": "nested 型では各明細が独立した隠しドキュメントになり、nested クエリは「同じ明細」の中で 2 つの条件を比較します。\n★ items が普通の object（orders_object）だと、明細は items.category = [手機, 男裝]、items.quantity = [1, 3] のように平らにされ、\n「手機」と「数量 3」が別々の明細から来ていても一致してしまいます（落とし穴問題で実演しています）。\n代償：明細 1 件ごとに 1 つの Lucene ドキュメントになり（_cat/indices の docs.count は 8 万ではなく 28 万）、注文を更新するとまるごと書き直しになります。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /orders/_count  (200)", "text": "{\n  \"count\": 3465\n}"}]}, {"id": "nested-agg", "chapter": "ネストしたドキュメント", "title": "明細の集約：nested aggregation", "prompt": "すべての注文明細をカテゴリ（items.category）でグループ化し、カテゴリごとの販売総数（items.quantity の合計）を求め、数量の多い上位 5 カテゴリを取ります。\n", "hints": ["外側で { \"nested\": { \"path\": \"items\" } } 集約を使い、その中で初めて items.* フィールドでグループ化できます。", "terms をサブ集約で並べ替える：\"order\": { \"qty\": \"desc\" }"], "answer": "GET /orders/_search\n{\n  \"size\": 0,\n  \"aggs\": {\n    \"items\": {\n      \"nested\": { \"path\": \"items\" },\n      \"aggs\": {\n        \"by_category\": {\n          \"terms\": { \"field\": \"items.category\", \"size\": 5, \"order\": { \"qty\": \"desc\" } },\n          \"aggs\": {\n            \"qty\": { \"sum\": { \"field\": \"items.quantity\" } }\n          }\n        }\n      }\n    }\n  }\n}\n", "explanation": "nested フィールドを集約するには、必ず先に nested 集約で明細に「入る」必要があります。items.category に直接 terms を使うと空の結果になります。\n明細から注文のレベルに戻る（例えばカテゴリごとの「注文」数）には reverse_nested を使います。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET /orders/_search  (200)", "text": "hits.total = 10000+\naggregations = {\n  \"items\": {\n    \"doc_count\": 200115,\n    \"by_category\": {\n      \"doc_count_error_upper_bound\": -1,\n      \"sum_other_doc_count\": 140094,\n      \"buckets\": [\n        {\n          \"key\": \"寢具\",\n          \"doc_count\": 13374,\n          \"qty\": {\n            \"value\": 19440.0\n          }\n        },\n        {\n          \"key\": \"女裝\",\n          \"doc_count\": 12105,\n          \"qty\": {\n            \"value\": 17690.0\n          }\n        },\n        {\n          \"key\": \"收納\",\n          \"doc_count\": 12120,\n          \"qty\": {\n            \"value\": 17544.0\n          }\n        },\n        {\n          \"key\": \"手機\",\n          \"doc_count\": 11421,\n          \"qty\": {\n            \"value\": 16793.0\n          }\n        },\n        {\n          \"key\": \"有線耳機\",\n          \"doc_count\": 11001,\n          \"qty\": {\n            \"value\": 16107.0\n          }\n        }\n      ]\n    }\n  }\n}"}]}, {"id": "index-doc", "chapter": "書き込み", "title": "ドキュメントを 1 件追加", "prompt": "scratch_reviews にレビューを 1 件追加し、_id を review-1 に指定します：\nproduct_id 806、rating 5、title「很滿意」（とても満足）、content「降噪效果很棒，通勤戴很舒服」（ノイズキャンセリングが素晴らしく、通勤中も快適）、verified true。\n", "hints": ["PUT /scratch_reviews/_doc/review-1 に JSON ドキュメントを付けます（_id を指定するなら PUT、Elasticsearch に _id を自動生成させるなら POST /インデックス/_doc）。"], "answer": "PUT /scratch_reviews/_doc/review-1\n{\n  \"product_id\": 806,\n  \"rating\": 5,\n  \"title\": \"很滿意\",\n  \"content\": \"降噪效果很棒，通勤戴很舒服\",\n  \"verified\": true\n}\n", "explanation": "PUT で _id を指定すると、既に存在すれば丸ごと上書きします（_version + 1）。「存在しないときだけ追加」したいなら PUT /インデックス/_create/review-1 を使います。\n書き込み後は refresh（既定 1 秒）を待たないと検索できませんが、_id での取得はリアルタイムです。大量の書き込みには _bulk を使います。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "PUT /scratch_reviews/_doc/review-1  (201)", "text": "{\n  \"_index\": \"scratch_reviews\",\n  \"_id\": \"review-1\",\n  \"_version\": 1,\n  \"result\": \"created\",\n  \"_seq_no\": 290,\n  \"_primary_term\": 1\n}"}], "checks": [{"cmd": "GET /scratch_reviews/_doc/review-1  (200)", "text": "{\n  \"_index\": \"scratch_reviews\",\n  \"_id\": \"review-1\",\n  \"_version\": 1,\n  \"_seq_no\": 290,\n  \"_primary_term\": 1,\n  \"found\": true,\n  \"_source\": {\n    \"product_id\": 806,\n    \"rating\": 5,\n    \"title\": \"很滿意\",\n    \"content\": \"降噪效果很棒，通勤戴很舒服\",\n    \"verified\": true\n  }\n}"}]}, {"id": "partial-update", "chapter": "書き込み", "title": "部分更新：_update", "prompt": "scratch_products の商品 806 の価格を 2990 に、在庫を 0 に変更し、他のフィールドはそのままにします。\n", "hints": ["POST /scratch_products/_update/806 { \"doc\": { … } }"], "answer": "POST /scratch_products/_update/806\n{\n  \"doc\": { \"price\": 2990, \"stock\": 0 }\n}\n", "explanation": "Elasticsearch のドキュメントは変更できません：_update は実は「全体を読み出す → マージする → 全体を書き直し、古いものに削除マークを付ける」で、PUT で丸ごと上書きするのとコストはほぼ同じです。送るデータが少ないだけです。\n古いバージョンはセグメントのマージで初めて本当に消去されるので、同じドキュメントを頻繁に更新するワークロード（例えばカウンタ）は Elasticsearch に向いていません。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "POST /scratch_products/_update/806  (200)", "text": "{\n  \"_index\": \"scratch_products\",\n  \"_id\": \"806\",\n  \"_version\": 2,\n  \"result\": \"updated\",\n  \"_seq_no\": 59,\n  \"_primary_term\": 1\n}"}], "checks": [{"cmd": "GET /scratch_products/_doc/806  (200)", "text": "{\n  \"_index\": \"scratch_products\",\n  \"_id\": \"806\",\n  \"_version\": 2,\n  \"_seq_no\": 59,\n  \"_primary_term\": 1,\n  \"found\": true,\n  \"_source\": {\n    \"name\": \"Sony 無線耳機 F178\",\n    \"brand\": \"Sony\",\n    \"category\": \"無線耳機\",\n    \"category_path\": [\n      \"3C電子\",\n      \"耳機\",\n      \"無線耳機\"\n    ],\n    \"description\": \"Sony 無線耳機：藍色，藍牙無線，主動降噪，續航 10 小時\",\n    \"price\": 2990,\n    \"stock\": 0,\n    \"is_active\": true,\n    \"tags\": [],\n    \"specs\": {\n      \"color\": \"藍\",\n      \"warranty\": {\n        \"type\": \"店家\",\n        \"years\": 2\n      },\n      \"battery_hours\": 10,\n      \"noise_cancelling\": true\n    },\n    \"created_at\": \"2021-09-03\",\n    \"rating\": 3.1,\n    \"review_count\": 13\n  }\n}"}]}, {"id": "update-by-query", "chapter": "書き込み", "title": "一括更新：_update_by_query", "prompt": "scratch_products でカテゴリが「無線耳機」（ワイヤレスイヤホン）の商品すべての tags に「週年慶」（周年セール）を追加します。\n", "hints": ["POST /scratch_products/_update_by_query。body には query と script を書きます。", "\"script\": { \"source\": \"ctx._source.tags.add(params.tag)\", \"params\": { \"tag\": \"週年慶\" } }"], "answer": "POST /scratch_products/_update_by_query\n{\n  \"query\": { \"term\": { \"category\": \"無線耳機\" } },\n  \"script\": {\n    \"source\": \"ctx._source.tags.add(params.tag)\",\n    \"params\": { \"tag\": \"週年慶\" }\n  }\n}\n", "explanation": "_update_by_query は条件に合う各ドキュメントに painless スクリプトを実行し（ctx._source がドキュメントの内容）、レスポンスの updated が更新した件数です。\n★ 値は params で渡し、スクリプトの文字列に連結しないこと：スクリプトはコンパイルされてキャッシュされるので、内容が変わり続けると毎回再コンパイルされます（コンパイル回数の上限に達することもあります）。\nバージョン競合（他の人が同時に変更している）に出会うと既定では中止します。conflicts=proceed を付けると、競合したドキュメントを飛ばして続行します。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "POST /scratch_products/_update_by_query  (200)", "text": "{\n  \"total\": 19,\n  \"updated\": 19,\n  \"deleted\": 0,\n  \"batches\": 1,\n  \"version_conflicts\": 0,\n  \"noops\": 0,\n  \"retries\": {\n    \"bulk\": 0,\n    \"search\": 0\n  },\n  \"throttled_millis\": 0,\n  \"requests_per_second\": -1.0,\n  \"throttled_until_millis\": 0,\n  \"failures\": []\n}"}], "checks": [{"cmd": "POST /scratch_products/_refresh  (200)", "text": "{}"}, {"cmd": "GET /scratch_products/_count  (200)", "text": "{\n  \"count\": 19\n}"}]}, {"id": "bulk", "chapter": "書き込み", "title": "複数件を一度に書き込む：_bulk", "prompt": "「1 つの」_bulk リクエストで scratch_reviews に 3 つのことを行います：\n_id が b1 のレビュー（rating 5）を追加、_id が b2 のレビュー（rating 1）を追加、そして b1 の helpful を 10 に更新します。\ncontent は自由に書き、product_id は 806 を使います。\n", "hints": ["_bulk は NDJSON です：1 行がアクション（index / create / update / delete）、次の行が内容です（delete には内容がない）。", "{\"index\": {\"_id\": \"b1\"}} の次の行にドキュメント、{\"update\": {\"_id\": \"b1\"}} の次の行に {\"doc\": {…}} を書きます"], "answer": "POST /scratch_reviews/_bulk\n{\"index\": {\"_id\": \"b1\"}}\n{\"product_id\": 806, \"rating\": 5, \"content\": \"音質很好\", \"helpful\": 0}\n{\"index\": {\"_id\": \"b2\"}}\n{\"product_id\": 806, \"rating\": 1, \"content\": \"用沒多久就壞了\", \"helpful\": 0}\n{\"update\": {\"_id\": \"b1\"}}\n{\"doc\": {\"helpful\": 10}}\n", "explanation": "_bulk は多数の書き込みアクションを 1 つのリクエストにまとめ、毎回のネットワーク往復を省きます。大量書き込みの標準的なやり方です（1 バッチ 5〜15 MB 程度）。\n★ _bulk はトランザクションではありません：各アクションがそれぞれ成功・失敗するので、レスポンスの errors が true のときは items を 1 つずつ確認して失敗したものを探す必要があります。\nこの問題の確認は b1 の rating、helpful と b2 の rating だけを見るので、content は何を書いても構いません。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "POST /scratch_reviews/_bulk  (200)", "text": "{\n  \"errors\": false,\n  \"items\": [\n    {\n      \"index\": {\n        \"_index\": \"scratch_reviews\",\n        \"_id\": \"b1\",\n        \"_version\": 1,\n        \"result\": \"created\",\n        \"_shards\": {\n          \"total\": 1,\n          \"successful\": 1,\n          \"failed\": 0\n        },\n        \"_seq_no\": 290,\n        \"_primary_term\": 1,\n        \"status\": 201\n      }\n    },\n    {\n      \"index\": {\n        \"_index\": \"scratch_reviews\",\n        \"_id\": \"b2\",\n        \"_version\": 1,\n        \"result\": \"created\",\n        \"_shards\": {\n          \"total\": 1,\n          \"successful\": 1,\n          \"failed\": 0\n        },\n        \"_seq_no\": 291,\n        \"_primary_term\": 1,\n        \"status\": 201\n      }\n    },\n    {\n      \"update\": {\n        \"_index\": \"scratch_reviews\",\n        \"_id\": \"b1\",\n        \"_version\": 2,\n        \"result\": \"updated\",\n        \"_shards\": {\n          \"total\": 1,\n          \"successful\": 1,\n          \"failed\": 0\n        },\n        \"_seq_no\": 292,\n        \"_primary_term\": 1,\n        \"status\": 200\n      }\n    }\n  ]\n}"}], "checks": [{"cmd": "GET /scratch_reviews/_doc/b1?_source=rating,helpful  (200)", "text": "{\n  \"_index\": \"scratch_reviews\",\n  \"_id\": \"b1\",\n  \"_version\": 2,\n  \"_seq_no\": 292,\n  \"_primary_term\": 1,\n  \"found\": true,\n  \"_source\": {\n    \"rating\": 5,\n    \"helpful\": 10\n  }\n}"}, {"cmd": "GET /scratch_reviews/_doc/b2?_source=rating  (200)", "text": "{\n  \"_index\": \"scratch_reviews\",\n  \"_id\": \"b2\",\n  \"_version\": 1,\n  \"_seq_no\": 291,\n  \"_primary_term\": 1,\n  \"found\": true,\n  \"_source\": {\n    \"rating\": 1\n  }\n}"}]}, {"id": "delete-by-query", "chapter": "書き込み", "title": "条件で削除：_delete_by_query", "prompt": "scratch_reviews のうち、星 1 つ（rating 1）で、検証されていない（verified が false）レビューをすべて削除します。\n", "hints": ["POST /scratch_reviews/_delete_by_query { \"query\": { \"bool\": { \"filter\": [ … ] } } }"], "answer": "POST /scratch_reviews/_delete_by_query\n{\n  \"query\": {\n    \"bool\": {\n      \"filter\": [\n        { \"term\": { \"rating\": 1 } },\n        { \"term\": { \"verified\": false } }\n      ]\n    }\n  }\n}\n", "explanation": "_delete_by_query はまず検索し、それから一括で削除します（スナップショット時点で一致したドキュメント）。削除はマークを付けるだけで、容量はセグメントのマージで初めて回収されます。\n★「ある期間の古いデータをまるごと」（例えば 30 日前のログ）削除するのに delete_by_query を使ってはいけません：時間でインデックスを分け（logs-2026.09、または data stream）、インデックスごと削除すれば、速くてゴミも残りません。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "POST /scratch_reviews/_delete_by_query  (200)", "text": "{\n  \"total\": 2,\n  \"deleted\": 2,\n  \"batches\": 1,\n  \"version_conflicts\": 0,\n  \"noops\": 0,\n  \"retries\": {\n    \"bulk\": 0,\n    \"search\": 0\n  },\n  \"throttled_millis\": 0,\n  \"requests_per_second\": -1.0,\n  \"throttled_until_millis\": 0,\n  \"failures\": []\n}"}], "checks": [{"cmd": "POST /scratch_reviews/_refresh  (200)", "text": "{}"}, {"cmd": "GET /scratch_reviews/_count  (200)", "text": "{\n  \"count\": 288\n}"}]}], "traps": [{"id": "term-on-text", "title": "text フィールドに term を使う", "question": "name は text フィールド（cjk アナライザ）で、内容は「Sony 無線耳機 F178」のようなものです。A は term で「Sony」を探しています。何件見つかりますか？", "options": ["B と同じ 59 件", "0 件", "エラー：text フィールドには term を使えない"], "answer": 1, "explanation": "text フィールドに保存されているのは分析後の語です：アナライザが小文字にするので、転置インデックスにあるのは「Sony」ではなく「sony」です。term はクエリのテキストを分析しないので、「Sony」で探しても当然見つからず、エラーにもなりません。\n★ ルール：text フィールドには match を使い（クエリのテキストが書き込み時と同じアナライザを通る）、keyword、数値、日付には term / range を使います。\n同様に、keyword フィールドの brand で「sony」（小文字）を検索しても 0 件です：keyword は分析されないので、大文字小文字まで完全に一致する必要があります。\n", "setup": null, "scripts": [{"label": "A：text フィールド name に term", "code": "GET /products/_count\n{ \"query\": { \"term\": { \"name\": \"Sony\" } } }\n"}, {"label": "B：keyword フィールド brand に term", "code": "GET /products/_count\n{ \"query\": { \"term\": { \"brand\": \"Sony\" } } }\n"}], "results": [[{"cmd": "GET /products/_count  (200)", "text": "{\n  \"count\": 0\n}"}], [{"cmd": "GET /products/_count  (200)", "text": "{\n  \"count\": 59\n}"}]]}, {"id": "match-is-or", "title": "文全体を match する", "question": "レビューに「通勤戴很舒服」（通勤中に着けてもとても快適）という文が実際に出てくるのは 200 件余りだけです。A は match でこの文を検索します。何件見つかりますか？", "options": ["B とほぼ同じ", "B の何倍も多い", "B より少ない：match はすべての語を要求する"], "answer": 1, "explanation": "cjk アナライザはこの文を「通勤、勤戴、戴很、很舒、舒服」の 5 つの語に分け、match は既定で OR なので、いずれか 1 つの語があれば一致します。\n「舒服」「很舒」（快適）は多くのレビューに出てくるので（着心地がいい、寝心地がいい）、A は 2 千件以上見つけます。\n最も関連するものはやはり上位に来ますが、「一致した総数」は大きく違います。正確さが必要なら match_phrase、または operator and、minimum_should_match を使います。\n", "setup": null, "scripts": [{"label": "A：match", "code": "GET /reviews/_count\n{ \"query\": { \"match\": { \"content\": \"通勤戴很舒服\" } } }\n"}, {"label": "B：match_phrase", "code": "GET /reviews/_count\n{ \"query\": { \"match_phrase\": { \"content\": \"通勤戴很舒服\" } } }\n"}], "results": [[{"cmd": "GET /reviews/_count  (200)", "text": "{\n  \"count\": 2756\n}"}], [{"cmd": "GET /reviews/_count  (200)", "text": "{\n  \"count\": 266\n}"}]]}, {"id": "standard-on-chinese", "title": "standard アナライザで中国語を検索する", "question": "content.std は既定の standard アナライザ（中国語は 1 文字 1 語）を使います。「音質」で検索すると何件見つかりますか？", "options": ["B と同じ", "B よりずっと多く、音質と関係のないレビューも大量に混ざる", "0 件：standard は中国語に対応していない"], "answer": 1, "explanation": "standard は「音質」を「音」「質」の 2 つの語に分け、match は既定で OR なので、「質」を含むレビュー（品質がいい、肉質がいい）も一致し、件数は cjk の何倍にもなります。\n1 位はやはり音質に関するもの（2 文字とも含むものはスコアが高い）ですが、大量のノイズを拾ってしまい、集約や件数も間違ってしまいます。\n★ 中国語のフィールドには必ず正しいアナライザを選びましょう：cjk（bigram、プラグイン不要）、smartcn、IK（本当の分かち書き、プラグインが必要）。アナライザはインデックス作成時に決まり、後から変えるには reindex が必要です。\n", "setup": null, "scripts": [{"label": "A：content.std（standard）", "code": "GET /reviews/_search\n{\n  \"size\": 3, \"_source\": [\"content\"],\n  \"query\": { \"match\": { \"content.std\": \"音質\" } }\n}\n"}, {"label": "B：content（cjk）", "code": "GET /reviews/_search\n{\n  \"size\": 3, \"_source\": [\"content\"],\n  \"query\": { \"match\": { \"content\": \"音質\" } }\n}\n"}], "results": [[{"cmd": "GET /reviews/_search  (200)", "table": {"columns": ["_id", "_score", "content"], "rows": [["361", 6.149, "低音很飽滿，音質很清楚，品質很好。"], ["1636", 6.149, "音質很清楚，低音很飽滿，品質很好。"], ["2880", 6.149, "低音很飽滿，音質很清楚，品質很好。"]], "total": 4509}}], [{"cmd": "GET /reviews/_search  (200)", "table": {"columns": ["_id", "_score", "content"], "rows": [["2013", 4.111, "音質很好，會再回購。"], ["2179", 4.111, "音質很好，品質很好。"], ["2974", 4.111, "音質很好，會再回購。"]], "total": 695}}]]}, {"id": "object-vs-nested", "title": "object 配列の交差一致", "question": "同じ注文、同じ条件（同じ明細がスマートフォンで、数量 ≥ 2）ですが、orders_object の items は普通の object です。A は何件見つけますか？", "options": ["B と同じ", "B より多い", "B より少ない"], "answer": 1, "explanation": "object の配列は平らにされます：ある注文の items.category = [手機, 男裝]、items.quantity = [1, 3] となり、2 つの条件はそれぞれ「配列にあるかどうか」を独立に調べます。\nスマートフォン（数量 1）とメンズ（数量 3）が別々の明細でも一致してしまうので、A の方が多く、しかも増えた分はすべて間違いです。\n★ 配列内のオブジェクトで「同じオブジェクトのフィールドをまとめて比較」する必要があるなら、mapping には nested を使い（クエリも nested query を使う）ます。\n", "setup": null, "scripts": [{"label": "A：orders_object（object）", "code": "GET /orders_object/_count\n{\n  \"query\": { \"bool\": { \"filter\": [\n    { \"term\": { \"items.category\": \"手機\" } },\n    { \"range\": { \"items.quantity\": { \"gte\": 2 } } }\n  ] } }\n}\n"}, {"label": "B：orders（nested）", "code": "GET /orders/_count\n{\n  \"query\": { \"nested\": { \"path\": \"items\", \"query\": { \"bool\": { \"filter\": [\n    { \"term\": { \"items.category\": \"手機\" } },\n    { \"range\": { \"items.quantity\": { \"gte\": 2 } } }\n  ] } } } }\n}\n"}], "results": [[{"cmd": "GET /orders_object/_count  (200)", "text": "{\n  \"count\": 6884\n}"}], [{"cmd": "GET /orders/_count  (200)", "text": "{\n  \"count\": 3465\n}"}]]}, {"id": "nested-doc-count", "title": "orders にはドキュメントが何件あるか", "question": "orders には 8 万件の注文と 20 万件の明細（nested）があります。_cat/indices の docs.count は何を表示しますか？", "options": ["80000、_count と同じ", "280115", "200115"], "answer": 1, "explanation": "nested オブジェクトはそれぞれ Lucene の中で独立した（隠れた）ドキュメントで、親ドキュメントと一緒に保存されています：8 万 + 20 万 = 28 万。\n_count や _search は最上位のドキュメント（8 万）だけを数え、_cat/indices は Lucene レベルの件数を表示します。\nnested は便利ですが、明細 1 件ごとに 1 つのドキュメントです：明細が多いとインデックスが大きくなり、どれか 1 つの明細を更新すると注文全体を書き直すことになります。\n", "setup": null, "scripts": [{"label": "A：_cat/indices", "code": "GET /_cat/indices/orders?v&h=index,docs.count\n"}, {"label": "B：_count", "code": "GET /orders/_count\n"}], "results": [[{"cmd": "GET /_cat/indices/orders?v&h=index,docs.count  (200)", "text": "index  docs.count\norders     280115"}], [{"cmd": "GET /orders/_count  (200)", "text": "{\n  \"count\": 80000\n}"}]]}, {"id": "total-10000", "title": "hits.total はいくつか", "question": "reviews には 2 万件以上のレビューがあります。条件なしで検索すると、hits.total.value はいくつですか？", "options": ["21556", "10000 で、relation は gte", "10。size の既定が 10 だから"], "answer": 1, "explanation": "性能のため、Elasticsearch は既定で 10,000 件までしか正確に数えません：それを超えると total は { \"value\": 10000, \"relation\": \"gte\" }（少なくとも 1 万）になります。\nこうすれば「上位いくつか」を見つけた時点で早めに終われ、一致するドキュメントをすべて数え切る必要がありません。\n正確な数が必要なら：track_total_hits: true、または _count を直接使います。ページングで「全 N ページ」は、通常「10,000+」と表示すれば十分です。\n", "setup": null, "scripts": [{"label": "A：既定", "code": "GET /reviews/_search\n{ \"size\": 0 }\n"}, {"label": "B：track_total_hits: true", "code": "GET /reviews/_search\n{ \"size\": 0, \"track_total_hits\": true }\n"}], "results": [[{"cmd": "GET /reviews/_search  (200)", "text": "hits.total = 10000+"}], [{"cmd": "GET /reviews/_search  (200)", "text": "hits.total = 21556"}]]}, {"id": "no-time-zone", "title": "タイムゾーンを指定しない date_histogram", "question": "9/1〜9/7（台湾時間）の日ごとの注文数。A には time_zone がありません。バケットはいくつ返りますか？", "options": ["7 個、B と同じ", "8 個：UTC で区切られ、台湾の 1 日が午前 8 時から始まるので、先頭と末尾に 1 区間ずつ増える", "エラー"], "answer": 1, "explanation": "date フィールドは UTC で保存され、date_histogram も既定で UTC で区切ります：台湾時間 9/1 00:00〜08:00 は UTC の 8/31 に属するので、バケットが 1 つ増え、しかも毎日の数値が正しくありません。\nTimescaleDB の time_bucket と同じ落とし穴です。Kibana はブラウザのタイムゾーンを自動で付けますが、自分でクエリを書くときは忘れずに付けましょう。\n", "setup": null, "scripts": [{"label": "A：time_zone なし", "code": "GET /orders/_search\n{\n  \"size\": 0,\n  \"query\": { \"range\": { \"order_date\": { \"gte\": \"2026-09-01T00:00:00+08:00\", \"lt\": \"2026-09-08T00:00:00+08:00\" } } },\n  \"aggs\": { \"per_day\": { \"date_histogram\": { \"field\": \"order_date\", \"calendar_interval\": \"day\" } } }\n}\n"}, {"label": "B：time_zone +08:00", "code": "GET /orders/_search\n{\n  \"size\": 0,\n  \"query\": { \"range\": { \"order_date\": { \"gte\": \"2026-09-01T00:00:00+08:00\", \"lt\": \"2026-09-08T00:00:00+08:00\" } } },\n  \"aggs\": { \"per_day\": { \"date_histogram\": { \"field\": \"order_date\", \"calendar_interval\": \"day\", \"time_zone\": \"+08:00\" } } }\n}\n"}], "results": [[{"cmd": "GET /orders/_search  (200)", "text": "hits.total = 641\naggregations = {\n  \"per_day\": {\n    \"buckets\": [\n      {\n        \"key_as_string\": \"2026-08-31T00:00:00.000Z\",\n        \"key\": 1788134400000,\n        \"doc_count\": 30\n      },\n      {\n        \"key_as_string\": \"2026-09-01T00:00:00.000Z\",\n        \"key\": 1788220800000,\n        \"doc_count\": 92\n      },\n      {\n        \"key_as_string\": \"2026-09-02T00:00:00.000Z\",\n        \"key\": 1788307200000,\n        \"doc_count\": 98\n      },\n      {\n        \"key_as_string\": \"2026-09-03T00:00:00.000Z\",\n        \"key\": 1788393600000,\n        \"doc_count\": 94\n      },\n      {\n        \"key_as_string\": \"2026-09-04T00:00:00.000Z\",\n        \"key\": 1788480000000,\n        \"doc_count\": 95\n      },\n      {\n        \"key_as_string\": \"2026-09-05T00:00:00.000Z\",\n        \"key\": 1788566400000,\n        \"doc_count\": 93\n      },\n      {\n        \"key_as_string\": \"2026-09-06T00:00:00.000Z\",\n        \"key\": 1788652800000,\n        \"doc_count\": 85\n      },\n      {\n        \"key_as_string\": \"2026-09-07T00:00:00.000Z\",\n        \"key\": 1788739200000,\n        \"doc_count\": 54\n      }\n    ]\n  }\n}"}], [{"cmd": "GET /orders/_search  (200)", "text": "hits.total = 641\naggregations = {\n  \"per_day\": {\n    \"buckets\": [\n      {\n        \"key_as_string\": \"2026-09-01T00:00:00.000+08:00\",\n        \"key\": 1788192000000,\n        \"doc_count\": 87\n      },\n      {\n        \"key_as_string\": \"2026-09-02T00:00:00.000+08:00\",\n        \"key\": 1788278400000,\n        \"doc_count\": 102\n      },\n      {\n        \"key_as_string\": \"2026-09-03T00:00:00.000+08:00\",\n        \"key\": 1788364800000,\n        \"doc_count\": 95\n      },\n      {\n        \"key_as_string\": \"2026-09-04T00:00:00.000+08:00\",\n        \"key\": 1788451200000,\n        \"doc_count\": 87\n      },\n      {\n        \"key_as_string\": \"2026-09-05T00:00:00.000+08:00\",\n        \"key\": 1788537600000,\n        \"doc_count\": 98\n      },\n      {\n        \"key_as_string\": \"2026-09-06T00:00:00.000+08:00\",\n        \"key\": 1788624000000,\n        \"doc_count\": 82\n      },\n      {\n        \"key_as_string\": \"2026-09-07T00:00:00.000+08:00\",\n        \"key\": 1788710400000,\n        \"doc_count\": 90\n      }\n    ]\n  }\n}"}]]}, {"id": "terms-on-text", "title": "text フィールドに terms 集約を使う", "question": "レビューで最もよく出てくるタイトルを集計しようと、title（text フィールド）に terms 集約を使いました。結果は？", "options": ["タイトルごとにグループ化された上位 10 件", "分析後の語（很、滿意、不…）ごとにグループ化される", "エラー：text フィールドは既定では集約できない"], "answer": 2, "explanation": "集約や並べ替えには doc values（フィールドごとに保存されたデータ）が必要ですが、text フィールドには doc values がありません。fielddata でメモリ上に作れますが、既定では無効です（ヒープを大量に使う）。\n★ 集約したい文字列フィールドには keyword を使うか、text フィールドの下に keyword のサブフィールドを追加し（fields: { keyword: { type: keyword } }）、title.keyword を集約します。\nfielddata を有効にしても、集約されるのは分析後の「語」であって、完全なタイトルではありません。\n", "setup": null, "scripts": [{"label": "text フィールドに terms 集約", "code": "GET /reviews/_search\n{\n  \"size\": 0,\n  \"aggs\": { \"titles\": { \"terms\": { \"field\": \"title\" } } }\n}\n"}], "results": [[{"cmd": "GET /reviews/_search  (400)", "text": "Fielddata is disabled on [title] in [reviews]. Text fields are not optimised for operations that require per-document field data like aggregations and sorting, so these operations are disabled by default. Please use a keyword field instead. Alternatively, set fielddata=true on [title] in order to load field data by uninverting the inverted index. Note that this can use significant memory.", "error": true}]]}, {"id": "deep-paging", "title": "1001 ページ目へ飛ぶ", "question": "1 ページ 10 件で、1001 ページ目を見たいので from 10000、size 10 にしました。結果は？", "options": ["10001〜10010 件目", "エラー：Result window is too large", "空の結果"], "answer": 1, "explanation": "from + size は index.max_result_window（既定 10,000）を超えられません。理由：各シャードが上位 from + size 件を並べてからマージする必要があり、後ろのページほど高くつくからです（ディープページングの問題）。\n★ 解決策：search_after（前のページの最後の 1 件の並べ替え値をカーソルにし、PIT でスナップショットを固定する）、または scroll（大量エクスポート用、現在は非推奨）。\nユーザーインターフェースでも普通は「1000 ページ目へ飛ぶ」機能は提供せず、「次のページ」か検索条件を絞り込むだけです。\n", "setup": null, "scripts": [{"label": "from 10000", "code": "GET /logs/_search\n{ \"from\": 10000, \"size\": 10 }\n"}], "results": [[{"cmd": "GET /logs/_search  (400)", "text": "Result window is too large, from + size must be less than or equal to: [10000] but was [10010]. See the scroll api for a more efficient way to request large data sets. This limit can be set by changing the [index.max_result_window] index level setting.", "error": true}]]}, {"id": "dynamic-mapping", "title": "動的 mapping が型を決める", "question": "新しいインデックスには mapping が定義されていません。1 つ目のドキュメントの zip は数値の 100、2 つ目の zip は文字列の \"10A\" です。2 つ目は書き込めますか？", "options": ["書き込める。Elasticsearch はスキーマレスだから", "書き込めない：zip は既に long と推定されている", "書き込める。zip は自動で text に変わる"], "answer": 1, "explanation": "mapping のないフィールドは、最初に現れたときに動的 mapping で型が推定され（数値 → long、文字列 → text + keyword サブフィールド、日付形式の文字列 → date）、以後は固定されます。\n2 つ目の「10A」は long に変換できないので、ドキュメント全体が拒否されます（mapper_parsing_exception）。フィールドの型は一度決まると変えられず、新しいインデックスを作って _reindex するしかありません。\n★ 本番環境では必ず事前に mapping を定義し（または index template を使い）、必要なら \"dynamic\": \"strict\" で未定義のフィールドを拒否して、フィールド数の爆発（mapping explosion）を防ぎましょう。\n", "setup": null, "scripts": [{"label": "2 つのドキュメントを順に書き込む", "code": "PUT /scratch_dynamic/_doc/1\n{ \"zip\": 100 }\n\nPUT /scratch_dynamic/_doc/2\n{ \"zip\": \"10A\" }\n\nGET /scratch_dynamic/_mapping\n"}], "results": [[{"cmd": "PUT /scratch_dynamic/_doc/1  (201)", "text": "{\n  \"_index\": \"scratch_dynamic\",\n  \"_id\": \"1\",\n  \"_version\": 1,\n  \"result\": \"created\",\n  \"_seq_no\": 0,\n  \"_primary_term\": 1\n}"}, {"cmd": "PUT /scratch_dynamic/_doc/2  (400)", "text": "[1:10] failed to parse field [zip] of type [long] in document with id '2'. Preview of field's value: '10A'", "error": true}, {"cmd": "GET /scratch_dynamic/_mapping  (200)", "text": "{\n  \"scratch_dynamic\": {\n    \"mappings\": {\n      \"properties\": {\n        \"zip\": {\n          \"type\": \"long\"\n        }\n      }\n    }\n  }\n}"}]]}, {"id": "near-real-time", "title": "書き込んですぐに検索する", "question": "インデックスの refresh_interval は 30 秒です。ドキュメントを書き込んですぐに _search すると見つかりますか？_id で GET するとどうですか？", "options": ["どちらも取得できる", "検索では見つからず、GET では取得できる", "どちらも取得できず、30 秒待つ必要がある"], "answer": 1, "explanation": "Elasticsearch は「ニアリアルタイム」（near real-time）です：書き込みはまずメモリ上のバッファに入り（失われないよう translog にも書く）、refresh のときに初めて検索可能なセグメントになります。\n既定では 1 秒ごとに refresh します（しばらく検索されていないインデックスでは一時停止する）。ここでは 30 秒に設定しているので、すぐに検索しても見つかりません。\nGET /_doc/1 はリアルタイムです：まだ refresh されていなければ translog / バッファから読み出します。\n「書いたらすぐに検索できる」必要があるなら、書き込みに ?refresh=wait_for（次の refresh を待つ）を付けます。毎回 ?refresh=true を使うのはやめましょう（小さなセグメントが大量にできる）。\n", "setup": null, "scripts": [{"label": "書き込んですぐに検索と GET", "code": "PUT /scratch_nrt\n{ \"settings\": { \"refresh_interval\": \"30s\" } }\n\nPUT /scratch_nrt/_doc/1\n{ \"content\": \"降噪效果很棒\" }\n\nGET /scratch_nrt/_search\n{ \"query\": { \"match\": { \"content\": \"降噪\" } } }\n\nGET /scratch_nrt/_doc/1\n"}], "results": [[{"cmd": "PUT /scratch_nrt  (200)", "text": "{\n  \"acknowledged\": true,\n  \"shards_acknowledged\": true,\n  \"index\": \"scratch_nrt\"\n}"}, {"cmd": "PUT /scratch_nrt/_doc/1  (201)", "text": "{\n  \"_index\": \"scratch_nrt\",\n  \"_id\": \"1\",\n  \"_version\": 1,\n  \"result\": \"created\",\n  \"_seq_no\": 0,\n  \"_primary_term\": 1\n}"}, {"cmd": "GET /scratch_nrt/_search  (200)", "text": "hits.total = 0"}, {"cmd": "GET /scratch_nrt/_doc/1  (200)", "text": "{\n  \"_index\": \"scratch_nrt\",\n  \"_id\": \"1\",\n  \"_version\": 1,\n  \"_seq_no\": 0,\n  \"_primary_term\": 1,\n  \"found\": true,\n  \"_source\": {\n    \"content\": \"降噪效果很棒\"\n  }\n}"}]]}], "steps": [{"id": "idf", "title": "珍しい語ほどスコアが高い（IDF）", "goal": "どちらも 1 語だけで検索します：「降噪」（ノイズキャンセリング）は一部のレビューにしか出てこず、「很好」（とても良い）はほぼどこにでもあります。2 つのクエリの 1 位のスコアを比較します。", "question": "どちらのクエリのスコアが高いですか？それはなぜですか？", "takeaway": "BM25 のスコア ≈ IDF × TF の部分 × フィールド長による調整。\nIDF（inverse document frequency）：出現するドキュメントが少ない語ほど識別力があり、スコアが高くなります。「降噪」は数百件のレビューにしか出てこず、「很好」は数千件に出てくるので、「降噪」のスコアの方がずっと高くなります。\n複数の語のクエリでは、珍しい語がスコアの大部分を担います。「的、很、了」のようにどこにでもある語は順位にほとんど影響しません（以前はストップワードを設定していましたが、BM25 は自然にそれらを抑えます）。\n", "setup": [], "queries": [{"label": "リクエスト", "code": "GET /reviews/_search\n{ \"size\": 3, \"_source\": [\"content\"], \"query\": { \"match\": { \"content\": \"降噪\" } } }\n\nGET /reviews/_search\n{ \"size\": 3, \"_source\": [\"content\"], \"query\": { \"match\": { \"content\": \"很好\" } } }\n"}]}, {"id": "field-length", "title": "フィールドが短いほどスコアが高い", "goal": "「音質」で検索します：A はスコアが最も高い 3 件、B はスコアの低い順に並べた、スコアが最も低い 3 件です。どれも「音質」を 1 回だけ含んでいます。", "question": "同じく「音質」が 1 回出てくるのに、なぜスコアが違うのでしょう？", "takeaway": "BM25 はフィールドの長さで調整します（パラメータ b、既定 0.75）：短いレビューに「音質」が出てくるなら、それがレビューの要点なのでスコアが高くなります。\n長いレビューに 1 回だけ出てくるなら、ついでに触れただけかもしれないので、スコアが低くなります。\nもう 1 つのパラメータ k1（既定 1.2）は語の頻度（TF）の飽和を制御します：同じ語が 1 回と 2 回では大きく違いますが、10 回と 11 回ではほとんど違わないので、キーワードの詰め込みを防げます。\nA で「1 位のスコアの計算方法」を押すと、idf、tf、dl（このドキュメントの長さ、語数）、avgdl（平均の長さ）の実際の数値を見られます。\n", "setup": [], "queries": [{"label": "リクエスト", "code": "GET /reviews/_search\n{ \"size\": 3, \"_source\": [\"content\"], \"query\": { \"match\": { \"content\": \"音質\" } } }\n\nGET /reviews/_search\n{ \"size\": 3, \"_source\": [\"content\"], \"query\": { \"match\": { \"content\": \"音質\" } },\n  \"sort\": [{ \"_score\": \"asc\" }] }\n"}]}, {"id": "boost", "title": "フィールドの重み（boost）", "goal": "「Sony 耳機」（Sony イヤホン）で検索します：A は name と description が同じ重要度、B は name を 3 倍にします。", "question": "上位 5 件とスコアはどう変わりましたか？", "takeaway": "multi_match の既定は best_fields です：フィールドごとにスコアを計算し、最も高いものを取ります。\nA：上位は Sony の「有線」イヤホンです。それらの description はとても短く（色とケーブル長だけ）、BM25 の長さ調整によって description のスコアが高くなります。\nB：name のスコアを 3 倍にすると name が支配的になり、name に Sony と 耳機 の両方がある商品（ワイヤレスも有線も）が同じスコアになって並びます。\n★ フィールドの重み（boost）は関連度を調整する最もよく使う道具です：名称やタイトルは通常、本文より重要です。\n★ スコアは同じクエリ内で順位を比べることにしか使えず、異なるクエリのスコアの大小には意味がありません（「スコア > 5 なら関連あり」のようなしきい値には使えません）。\n", "setup": [], "queries": [{"label": "リクエスト", "code": "GET /products/_search\n{ \"size\": 5, \"_source\": [\"name\", \"description\"],\n  \"query\": { \"multi_match\": { \"query\": \"Sony 耳機\", \"fields\": [\"name\", \"description\"] } } }\n\nGET /products/_search\n{ \"size\": 5, \"_source\": [\"name\", \"description\"],\n  \"query\": { \"multi_match\": { \"query\": \"Sony 耳機\", \"fields\": [\"name^3\", \"description\"] } } }\n"}]}, {"id": "function-score", "title": "関連度にビジネスルールを加える：function_score", "goal": "説明に「降噪」があるイヤホンはどれもスコアが同じです（説明が同じテンプレートだから）。A は関連度だけを見て、B はさらに評価（rating）を掛けます。", "question": "B の上位 5 件は何で並んでいますか？", "takeaway": "EC の検索がテキストの関連度だけを見ることはまれです：評価、販売数、在庫、出品日、広告も考慮します。function_score は関数でスコアを調整します：\nfield_value_factor（フィールドの値による）、gauss / exp / linear（ある値から遠いほどスコアが下がる。例：価格、時刻、場所）、script_score、random_score（ランダムだが安定した並び順）。\nmodifier: log1p で評価 5 と 4 の差が大げさになりすぎないようにし、boost_mode で元のスコアと関数のスコアの組み合わせ方を決めます（multiply、sum、replace…）。\n", "setup": [], "queries": [{"label": "リクエスト", "code": "GET /products/_search\n{ \"size\": 5, \"_source\": [\"name\", \"rating\", \"review_count\"],\n  \"query\": { \"match\": { \"description\": \"降噪\" } } }\n\nGET /products/_search\n{ \"size\": 5, \"_source\": [\"name\", \"rating\", \"review_count\"],\n  \"query\": {\n    \"function_score\": {\n      \"query\": { \"match\": { \"description\": \"降噪\" } },\n      \"field_value_factor\": { \"field\": \"rating\", \"modifier\": \"log1p\", \"missing\": 3 },\n      \"boost_mode\": \"multiply\"\n    }\n  } }\n"}]}, {"id": "filter-no-score", "title": "filter はスコアを計算しない", "goal": "同じ条件を、A は must に、B は filter に入れます。スコアを見てください。", "question": "2 つのクエリが見つけたドキュメントは同じですか？スコアはどうですか？", "takeaway": "見つかるドキュメントはまったく同じですが、must はスコアを計算し（term にも IDF がある）、filter のスコアはすべて 0 です。\nfilter はスコアを計算する必要がなく、よく使う filter の結果は bitset としてキャッシュされ、次回はそのまま再利用されます。\n★「はい／いいえ」の条件（カテゴリ、価格帯、ステータス、権限、時刻）は filter に、順位に影響させたい全文の条件だけを must / should に入れます。\n", "setup": [], "queries": [{"label": "リクエスト", "code": "GET /products/_search\n{ \"size\": 3, \"_source\": [\"name\", \"price\"],\n  \"query\": { \"bool\": { \"must\": [\n    { \"term\": { \"category\": \"無線耳機\" } },\n    { \"range\": { \"price\": { \"lte\": 3000 } } }\n  ] } } }\n\nGET /products/_search\n{ \"size\": 3, \"_source\": [\"name\", \"price\"],\n  \"query\": { \"bool\": { \"filter\": [\n    { \"term\": { \"category\": \"無線耳機\" } },\n    { \"range\": { \"price\": { \"lte\": 3000 } } }\n  ] } } }\n"}]}, {"id": "should-bonus", "title": "should を加点として使う", "goal": "説明に「降噪」がある商品を検索します。B はさらに should で「熱銷」（人気）タグのある商品に加点します。", "question": "B が見つけた総数は変わりましたか？上位 5 件はどうですか？", "takeaway": "must があると should は必須条件ではなくなり、「一致すれば加点」になるだけです：総数は変わりませんが、人気タグのある商品が上位に来ます。\nこれが「ソフトな条件」の標準的な書き方です：あるブランド、ある地域、在庫のあるものを優先しつつ、それ以外も除外しません。\n", "setup": [], "queries": [{"label": "リクエスト", "code": "GET /products/_search\n{ \"size\": 5, \"_source\": [\"name\", \"tags\"],\n  \"query\": { \"bool\": { \"must\": [{ \"match\": { \"description\": \"降噪\" } }] } } }\n\nGET /products/_search\n{ \"size\": 5, \"_source\": [\"name\", \"tags\"],\n  \"query\": { \"bool\": {\n    \"must\": [{ \"match\": { \"description\": \"降噪\" } }],\n    \"should\": [{ \"term\": { \"tags\": { \"value\": \"熱銷\", \"boost\": 2 } } }]\n  } } }\n"}]}]}], "built": "2026-10-10"}</script>

const UI = {"locale": "ja-JP", "lang.aria": "言語を切り替え", "star": "面接頻出", "nav.dbs": "データベース", "nav.toc": "目次", "search": "検索", "site.title": "データベース学習ノート", "site.sub": "面接対策 · shop 練習用データベース", "home.lead": "台湾の EC サイト「shop」の模擬データ（会員・注文・明細・商品・カテゴリ、約 30 万件）を題材に、PostgreSQL、Redis、MongoDB、Cassandra、Neo4j、TimescaleDB、pgvector、Elasticsearch、InfluxDB の 9 種類のデータベースで、クエリ・データモデル・面接でよく問われる概念を練習します。", "home.cheatsheet": "PostgreSQL：SQL の実行順序、JOIN、NULL、ウィンドウ関数、トランザクション、JSONB / UPSERT、各種インデックス（Partial、Expression、GIN、GiST、BRIN）。 Redis：データ構造、トランザクションと Lua、キャッシュ貫通 / 破壊 / 雪崩、分散ロック、永続化、クラスタ。 MongoDB：クエリと集約パイプライン、埋め込み vs 参照、インデックスと ESR、トランザクションとシャーディング。 Cassandra：パーティションキーとクラスタリングキー、クエリ先行のテーブル設計、トゥームストーン、一貫性レベル、LWT。 Neo4j：Cypher のパターン、パスと最短経路、MERGE、グラフのデータモデル、PROFILE。 TimescaleDB：hypertable と chunk、time_bucket、gapfill、連続集約、圧縮、データ保持。 pgvector：距離演算子、セマンティック検索とレコメンド、HNSW vs IVFFlat、フィルタとマルチテナント、量子化、ハイブリッド検索。 Elasticsearch：転置インデックスとアナライザ、Query DSL、BM25 の関連度、集約、nested、書き込みとニアリアルタイム、シャード。 InfluxDB：line protocol、tag vs field と cardinality、InfluxQL、Flux、カウンタと変化率、保持期間とダウンサンプリング。", "home.bank.item": "{name}：練習 {e} 問、落とし穴 {t} 問", "home.bank.steps": "、実験 {s} ステップ", "home.bank.sep": "、", "home.bank.tail": "。ヒント・解答・解説と、正解を実際に実行した結果つき。", "updated": "更新日 {d}", "cs.sub": "データベース面接チートシート · {n} 種類 · 更新日 {d}", "cs.placeholder": "全データベースを検索（例：JSONB、Lua、NULL…）", "cs.hits": "「{q}」は全データベースで {n} 節見つかりました。タブの数字はデータベースごとの節数です。", "cs.none": "「{q}」を含む節はありません。", "copy": "コピー", "copied": "コピーしました", "copy.select": "選択済み、Ctrl+C を押してください", "copy.manual": "手動で選択してコピーしてください", "bank.title": "問題集", "bank.search": "問題を検索", "bank.placeholder": "問題・コマンド・解説を検索…（/ キーで移動）", "bank.sub": "データベース面接問題集 · {dbs} 種類 · 練習 {ex} 問 · 落とし穴 {traps} 問 · 更新日 {built}", "bank.doctitle": "{db} · 問題集", "kind.aria": "問題の種類", "kind.practice": "練習問題", "kind.traps": "落とし穴", "rows.zero": "0 行", "rows.total": "全 {n} 行", "rows.more": "（先頭 {k} 行のみ表示）", "run.title": "正解の実行結果", "run.warn": "⚠ サーバーの警告：", "note.offline": "オフライン復習版：問題・ヒント・解答・正解の実行結果を閲覧できます{missing}。自分で書いて自動採点するには、ショーケースアプリを起動して {link} を開いてください。", "note.missing": "（このページの生成時にショーケースアプリが起動していなかったため、実行結果は含まれていません）", "chap.all": "すべて", "chap.aria": "章", "progress": "習得済み <b>{n}</b> / {total}", "showAnswers": "すべての解答を表示", "hideKnown": "習得済みを隠す", "chap.count": "{n} 問", "tag.write": "書き込み", "tag.unordered": "順序不問", "known": "習得済み", "setup.ran": "この問題の前に実行済み", "hints": "ヒント（{n}）", "seeAnswer": "解答を見る", "checks.title": "実行後、これらのコマンドでデータを確認", "empty": "条件に合う問題はありません。", "empty.steps": "条件に合うステップはありません。", "trap.setup": "各スクリプトの前に実行", "trap.right": "✓ 正解！", "trap.wrong": "✗ 正解は「{a}」", "trap.result": "{label} の実行結果", "retry": "もう一度", "step.n": "ステップ {n}", "step.indexes": "このステップで使うインデックス", "step.think": "考えてみよう：{q}", "step.explain": "解説を見る", "step.request": "リクエスト", "out.clip": "\n…（以下省略）", "out.docs": "// 全 {n} 件", "out.docs.more": "（先頭 {k} 件のみ表示）", "out.done": "完了（返却データなし）", "out.empty": "（内容なし）", "out.notime": "1970-01-01（時刻なし）", "out.list.sep": "、", "counter.nodesCreated": "作成したノード", "counter.nodesDeleted": "削除したノード", "counter.relationshipsCreated": "作成したリレーションシップ", "counter.relationshipsDeleted": "削除したリレーションシップ", "counter.propertiesSet": "設定したプロパティ", "counter.labelsAdded": "追加したラベル", "step.write": "# line protocol（scratch に書き込み）"};
// 兩份靜態頁共用：SQL 上色、複製按鈕、HTML 跳脫、介面文字、語言切換
// LANG、UI 由 build_static.py 依語言放在這段程式前面
const t = (key, vars = {}) => String(UI[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const SQL_KEYWORDS = new Set(`
  select from where group by having order limit offset join left right full inner outer cross on using as and or not
  in is null exists distinct union all intersect except case when then else end with recursive insert into values
  update set delete returning conflict do nothing create index unique table drop alter add column primary key
  references foreign check default constraint cascade begin commit rollback over partition window rows range
  between preceding following current row asc desc nulls first last filter lateral explain analyze true false
  interval date timestamp timestamptz int integer bigint numeric text boolean jsonb serial unbound include brin
  gin btree hash concurrently if only like ilike any array for share zone at time cast varchar char smallint
  identity generated always schema role grant usage to owner vacuum`.trim().split(/\s+/));

// CQL：SQL 的關鍵字再加上 Cassandra 特有的
const CQL_KEYWORDS = new Set([...SQL_KEYWORDS, ...`
  keyspace keyspaces allow filtering ttl writetime token clustering frozen counter batch apply logged unlogged
  static list map type contains key per describe consistency tracing materialized view custom timeuuid uuid
  double float decimal varint tinyint blob inet replication quorum serial truncate expand copy`.trim().split(/\s+/)]);

const SQL_TOKEN = /(--[^\n]*)|(\/\*[\s\S]*?\*\/)|('(?:[^']|'')*')|("(?:[^"]|"")*")|(->>|->|#>>|#>|@>|<@|&&|\|\||::|\?\||\?&)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)/g;

function highlightSQL(text, keywords = SQL_KEYWORDS) {
  let out = "", last = 0, m;
  SQL_TOKEN.lastIndex = 0;
  while ((m = SQL_TOKEN.exec(text))) {
    out += esc(text.slice(last, m.index));
    const [tok, cmt1, cmt2, str, ident, op, num, word] = m;
    if (cmt1 || cmt2) out += `<span class="hl-cmt">${esc(tok)}</span>`;
    else if (str) out += `<span class="hl-str">${esc(tok)}</span>`;
    else if (ident) out += esc(tok);
    else if (op) out += `<span class="hl-op">${esc(tok)}</span>`;
    else if (num) out += `<span class="hl-num">${esc(tok)}</span>`;
    else if (word) {
      const isCall = /^\s*\(/.test(text.slice(m.index + tok.length));
      if (keywords.has(word.toLowerCase()) && !(isCall && !/^(in|exists|any|values|over|filter|on|using|as|array|interval)$/i.test(word))) {
        out += `<span class="hl-kw">${esc(tok)}</span>`;
      } else if (isCall) out += `<span class="hl-fn">${esc(tok)}</span>`;
      else out += esc(tok);
    }
    last = m.index + tok.length;
  }
  return out + esc(text.slice(last));
}

/** Redis 指令：每行第一個字是指令（上色），-- 之後是註解。 */
function highlightRedis(text) {
  return text.split("\n").map((line) => {
    const c = line.indexOf("--");
    const body = c >= 0 ? line.slice(0, c) : line;
    const comment = c >= 0 ? `<span class="hl-cmt">${esc(line.slice(c))}</span>` : "";
    const html = esc(body)
      .replace(/^(\s*)([A-Za-z][A-Za-z.]*)/, '$1<span class="hl-kw">$2</span>')
      .replace(/(&quot;[^&]*&quot;|'[^']*')/g, '<span class="hl-str">$1</span>')
      .replace(/(\s)(-?\d+(?:\.\d+)?)(?=\s|$)/g, '$1<span class="hl-num">$2</span>');
    return html + comment;
  }).join("\n");
}

/** mongosh：字串、數字、$運算子、// 註解、db.集合.方法。 */
function highlightMongo(text) {
  const TOKEN = /(\/\/[^\n]*)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|(\$[A-Za-z]+)|(\b(?:db|ISODate|ObjectId|NumberDecimal|true|false|null)\b)|(\b\d+(?:\.\d+)?\b)|(\.[a-zA-Z]+(?=\())/g;
  let out = "", last = 0, m;
  while ((m = TOKEN.exec(text))) {
    out += esc(text.slice(last, m.index));
    const [tok, cmt, str, op, word, num, method] = m;
    const cls = cmt ? "hl-cmt" : str ? "hl-str" : op ? "hl-op" : word ? "hl-kw" : num ? "hl-num" : method ? "hl-fn" : "";
    out += `<span class="${cls}">${esc(tok)}</span>`;
    last = m.index + tok.length;
  }
  return out + esc(text.slice(last));
}

/** Cypher：關鍵字、// 註解、字串、:標籤 / :關係型別、$參數。 */
const CYPHER_KEYWORDS = new Set(`
  match optional where return with order by skip limit create merge set remove delete detach on unwind as and or not
  xor in is null exists count call yield distinct case when then else end asc desc union all profile explain index
  constraint for require unique drop if show indexes constraints transactions true false starts ends contains
  shortestpath allshortestpaths collect`.trim().split(/\s+/));

function highlightCypher(text) {
  const TOKEN = /(\/\/[^\n]*)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|(:[A-Za-z_][A-Za-z0-9_]*)|(\$[A-Za-z_][A-Za-z0-9_]*)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
  let out = "", last = 0, m;
  while ((m = TOKEN.exec(text))) {
    out += esc(text.slice(last, m.index));
    const [tok, cmt, str, label, param, num, word] = m;
    if (cmt) out += `<span class="hl-cmt">${esc(tok)}</span>`;
    else if (str) out += `<span class="hl-str">${esc(tok)}</span>`;
    else if (label) out += `<span class="hl-fn">${esc(tok)}</span>`;
    else if (param) out += `<span class="hl-op">${esc(tok)}</span>`;
    else if (num) out += `<span class="hl-num">${esc(tok)}</span>`;
    else if (CYPHER_KEYWORDS.has(word.toLowerCase())) out += `<span class="hl-kw">${esc(tok)}</span>`;
    else out += esc(tok);
    last = m.index + tok.length;
  }
  return out + esc(text.slice(last));
}

/** Elasticsearch（Kibana Dev Tools 寫法）：方法 + 路徑、# 註解、JSON 的 key / 字串 / 數字。 */
function highlightES(text) {
  const TOKEN = /^(\s*)(GET|POST|PUT|DELETE|HEAD)(\s+)(\S+)|(^\s*#[^\n]*)|("(?:[^"\\]|\\.)*")(\s*:)?|(\b(?:true|false|null)\b)|(-?\b\d+(?:\.\d+)?\b)/gm;
  let out = "", last = 0, m;
  while ((m = TOKEN.exec(text))) {
    out += esc(text.slice(last, m.index));
    const [tok, indent, method, gap, path, cmt, str, colon, lit, num] = m;
    if (method) out += `${esc(indent)}<span class="hl-kw">${method}</span>${esc(gap)}<span class="hl-fn">${esc(path)}</span>`;
    else if (cmt) out += `<span class="hl-cmt">${esc(tok)}</span>`;
    else if (str) out += colon ? `<span class="hl-op">${esc(str)}</span>${esc(colon)}` : `<span class="hl-str">${esc(str)}</span>`;
    else if (lit) out += `<span class="hl-kw">${esc(tok)}</span>`;
    else if (num) out += `<span class="hl-num">${esc(tok)}</span>`;
    last = m.index + tok.length;
  }
  return out + esc(text.slice(last));
}

/** Flux：// 註解、字串、時間（2026-09-18T14:00:00+08:00）、數字、|> 管線、函式名稱。 */
function highlightFlux(text) {
  const TOKEN = /(\/\/[^\n]*)|("(?:[^"\\]|\\.)*")|(\b\d{4}-\d\d-\d\dT[\d:.]+(?:Z|[+-]\d\d:\d\d)?)|(\|>)|(\b\d+(?:\.\d+)?(?:ms|s|m|h|d|w|mo|y)?\b)|(\b(?:import|option|and|or|not|true|false|return|if|then|else|with)\b)|([A-Za-z_][A-Za-z0-9_.]*(?=\())/g;
  let out = "", last = 0, m;
  while ((m = TOKEN.exec(text))) {
    out += esc(text.slice(last, m.index));
    const [tok, cmt, str, time, pipe, num, kw, fn] = m;
    const cls = cmt ? "hl-cmt" : str ? "hl-str" : time ? "hl-num" : pipe ? "hl-op" : num ? "hl-num" : kw ? "hl-kw" : fn ? "hl-fn" : "";
    out += `<span class="${cls}">${esc(tok)}</span>`;
    last = m.index + tok.length;
  }
  return out + esc(text.slice(last));
}

/** InfluxDB：有 |> 的是 Flux；其他（InfluxQL、line protocol、混合的陷阱題腳本）用 SQL 的上色，# 開頭的行當註解。 */
function highlightInflux(text) {
  if (/\|>/.test(text)) return highlightFlux(text);
  return text.split("\n").map((line) => /^\s*#/.test(line) ? `<span class="hl-cmt">${esc(line)}</span>` : highlightSQL(line)).join("\n");
}

/** 把 root 底下的 pre.code 上色並加上「複製」按鈕。 */
function enhanceCode(root) {
  root.querySelectorAll("pre.code").forEach((pre) => {
    if (pre.dataset.ready) return;
    pre.dataset.ready = "1";
    const code = pre.querySelector("code") ?? pre;
    const raw = code.textContent;
    if (pre.dataset.lang === "redis") code.innerHTML = highlightRedis(raw);
    else if (pre.dataset.lang === "mongo") code.innerHTML = highlightMongo(raw);
    else if (pre.dataset.lang === "cql") code.innerHTML = highlightSQL(raw, CQL_KEYWORDS);
    else if (pre.dataset.lang === "cypher") code.innerHTML = highlightCypher(raw);
    else if (pre.dataset.lang === "es") code.innerHTML = highlightES(raw);
    else if (pre.dataset.lang === "influx" || pre.dataset.lang === "flux") code.innerHTML = highlightInflux(raw);
    else if (pre.dataset.lang === "sql" || pre.dataset.lang === undefined && !pre.closest(".doc")) code.innerHTML = highlightSQL(raw);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "copy";
    btn.textContent = t("copy");
    btn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(raw);
        btn.textContent = t("copied");
      } catch {
        const sel = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(code);
        sel.removeAllRanges();
        sel.addRange(range);
        btn.textContent = t("copy.select");
      }
      setTimeout(() => (btn.textContent = t("copy")), 1600);
    });
    pre.appendChild(btn);
  });
}

const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* 無法儲存就算了 */ } },
};

// 右上角的語言切換：記住選擇（之後不再依瀏覽器語言自動切換），換頁時保留 #位置
document.addEventListener("click", (e) => {
  const a = e.target.closest(".lang-switch a[data-lang]");
  if (!a) return;
  e.preventDefault();
  try { localStorage.setItem("site-lang", a.dataset.lang); } catch { /* 無法儲存：這次照樣切換 */ }
  location.href = a.getAttribute("href") + location.hash;
});

// 題庫：上方一個資料庫一個分頁，分頁裡再分「練習題 / 陷阱題 / 實驗」；資料來自頁面裡嵌入的 JSON
(() => {
  const data = JSON.parse(document.getElementById("data").textContent);
  const bank = document.getElementById("bank");
  const input = document.getElementById("q");
  const tabsNav = document.getElementById("dbtabs");
  const KNOWN_KEY = "bank-known";            // { "redis:str-get": true, … }
  const LAST_KEY = "bank-last";
  const SHOWCASE = { postgresql: "postgres", redis: "redis", mongodb: "mongodb", cassandra: "cassandra", neo4j: "neo4j", timescaledb: "timescaledb", pgvector: "pgvector", elasticsearch: "elasticsearch", influxdb: "influxdb" };
  const known = store.get(KNOWN_KEY, {});
  // 舊版只有 PostgreSQL，標記沒有加前綴：搬過來
  const legacy = store.get("pg-bank-known", null);
  if (legacy) {
    for (const id of Object.keys(legacy)) known[`postgresql:${id}`] = true;
    store.set(KNOWN_KEY, known);
    try { localStorage.removeItem("pg-bank-known"); } catch { /* 無法存取就算了 */ }
  }
  const state = { db: data.dbs[0].id, kind: "practice", chapter: "*", showAnswers: false, hideKnown: false };
  const dbOf = (id) => data.dbs.find((d) => d.id === id) ?? data.dbs[0];
  const kinds = (db) => [
    { id: "practice", label: t("kind.practice"), n: db.exercises.length },
    { id: "traps", label: t("kind.traps"), n: db.traps.length },
    ...(db.steps.length ? [{ id: "lab", label: db.labName, n: db.steps.length }] : []),
  ];
  const total = (k) => data.dbs.reduce((s, d) => s + d[k].length, 0);
  document.getElementById("sub").textContent =
    t("bank.sub", { dbs: data.dbs.length, ex: total("exercises"), traps: total("traps"), built: data.built });

  // ---------- 共用片段 ----------
  const fmtNum = (n) => Number(n).toLocaleString(t("locale"));
  const code = (text, lang) => `<pre class="code" data-lang="${esc(lang)}"><code>${esc(String(text).trim())}</code></pre>`;
  const matches = (q, ...texts) => !q || texts.some((t) => String(t ?? "").toLowerCase().includes(q));

  function table(tb) {
    if (tb.rows.length === 0) return `<p class="result-head">${t("rows.zero")}</p>`;
    const head = tb.columns.map((c) => `<th>${esc(c)}</th>`).join("");
    const body = tb.rows.map((row) => "<tr>" + row.map((v) =>
      v === null ? '<td class="nul">null</td>'
      : typeof v === "number" ? `<td class="num">${v.toLocaleString(t("locale"))}</td>`
      : `<td>${esc(v)}</td>`).join("") + "</tr>").join("");
    const more = tb.total > tb.rows.length ? t("rows.more", { k: tb.rows.length }) : "";
    return `<p class="result-head">${t("rows.total", { n: fmtNum(tb.total) })}${more}</p>
      <div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  /**
   * 執行結果。連續的文字結果（Redis、MongoDB、cqlsh 訊息）合成一段終端機紀錄：› 指令、下一行是回應；
   * 表格結果（PostgreSQL、Cassandra 的查詢）單獨顯示。
   */
  function blocks(list, title = t("run.title")) {
    if (!list || !list.length) return "";
    const parts = [];
    let lines = [];
    const flush = () => { if (lines.length) { parts.push(`<pre class="blk-out">${lines.join("\n")}</pre>`); lines = []; } };
    for (const b of list) {
      const warn = (b.warn ?? []).map((w) => `<p class="blk-warn">${esc(t("run.warn"))}${esc(w)}</p>`).join("");
      if (b.table) {
        flush();
        parts.push(`<div class="blk">${b.cmd ? `<div class="blk-cmd"><span class="prompt-mark">›</span><code>${esc(b.cmd)}</code></div>` : ""}${table(b.table)}${warn}</div>`);
      } else {
        if (b.cmd) lines.push(`<span class="prompt-mark">›</span> <span class="tr-cmd">${esc(b.cmd)}</span>`);
        lines.push(`<span class="${b.error ? "tr-err" : ""}">${esc(b.text)}</span>`);
        if (warn) { flush(); parts.push(warn); }
      }
    }
    flush();
    return `<div class="run"><div class="run-title">${esc(title)}</div>${parts.join("")}</div>`;
  }

  // ---------- 分頁 ----------
  function searchHits(db, q) {
    if (!q) return null;
    return db.exercises.filter((e) => exerciseMatch(e, q)).length
      + db.traps.filter((t) => trapMatch(t, q)).length
      + db.steps.filter((s) => stepMatch(s, q)).length;
  }

  function renderTabs(q) {
    tabsNav.innerHTML = data.dbs.map((d) => {
      const n = searchHits(d, q);
      return `<a href="#${d.id}" data-tab="${d.id}" aria-current="${d.id === state.db ? "page" : "false"}"
        class="${n === 0 ? "no-hit" : ""}">${esc(d.name)}<span class="n">${n === null ? "" : n}</span></a>`;
    }).join("");
  }

  function render() {
    const q = input.value.trim().toLowerCase();
    const db = dbOf(state.db);
    if (!kinds(db).some((k) => k.id === state.kind)) state.kind = "practice";
    renderTabs(q);
    const kindTabs = `<div class="kinds" role="tablist" aria-label="${esc(t("kind.aria"))}">${kinds(db).map((k) => {
      const n = q ? (k.id === "practice" ? db.exercises.filter((e) => exerciseMatch(e, q)).length
        : k.id === "traps" ? db.traps.filter((t) => trapMatch(t, q)).length : db.steps.filter((s) => stepMatch(s, q)).length) : k.n;
      return `<button type="button" role="tab" data-kind="${k.id}" aria-selected="${k.id === state.kind}">${esc(k.label)}<span>${n}</span></button>`;
    }).join("")}</div>`;
    const url = `http://localhost:8081/#/${SHOWCASE[db.id]}`;
    const note = `<p class="note">${t("note.offline", { missing: db.hasResults ? "" : esc(t("note.missing")), link: `<a href="${url}">${url}</a>` })}</p>`;
    const body = state.kind === "practice" ? renderPractice(db, q) : state.kind === "traps" ? renderTraps(db, q) : renderLab(db, q);
    bank.innerHTML = kindTabs + note + body;
    bank.dataset.db = db.id;
    document.title = t("bank.doctitle", { db: db.name });
    enhanceCode(bank);
  }

  // ---------- 練習題 ----------
  const exerciseMatch = (e, q) => matches(q, e.title, e.prompt, e.answer, e.explanation, e.chapter, ...e.hints);

  function renderPractice(db, q) {
    const chapters = [...new Set(db.exercises.map((e) => e.chapter))];
    if (state.chapter !== "*" && !chapters.includes(state.chapter)) state.chapter = "*";
    const doneCount = db.exercises.filter((e) => known[`${db.id}:${e.id}`]).length;
    const filters = `
      <div class="filters">
        <div class="chips" role="group" aria-label="${esc(t("chap.aria"))}">
          ${["*", ...chapters].map((c) =>
            `<button type="button" class="chip-btn" data-chapter="${esc(c)}" aria-pressed="${state.chapter === c}">${esc(c === "*" ? t("chap.all") : c)}</button>`).join("")}
        </div>
        <div class="toggles">
          <span class="progress">${t("progress", { n: doneCount, total: db.exercises.length })}</span>
          <label><input type="checkbox" data-toggle="showAnswers" ${state.showAnswers ? "checked" : ""}> ${esc(t("showAnswers"))}</label>
          <label><input type="checkbox" data-toggle="hideKnown" ${state.hideKnown ? "checked" : ""}> ${esc(t("hideKnown"))}</label>
        </div>
      </div>`;
    let html = "", chapter = null, shown = 0;
    db.exercises.forEach((e, i) => {
      const key = `${db.id}:${e.id}`;
      if (state.chapter !== "*" && e.chapter !== state.chapter) return;
      if (state.hideKnown && known[key]) return;
      if (!exerciseMatch(e, q)) return;
      if (e.chapter !== chapter) {
        chapter = e.chapter;
        html += `<h2 class="chapter-head">${esc(chapter)}<span>${esc(t("chap.count", { n: db.exercises.filter((x) => x.chapter === chapter).length }))}</span></h2>`;
      }
      shown++;
      html += `
        <article class="card ${known[key] ? "known" : ""}">
          <div class="card-head">
            <span class="num">#${i + 1}</span>
            <h3>${esc(e.title)}</h3>
            ${e.write ? `<span class="tag write">${esc(t("tag.write"))}</span>` : ""}
            ${e.ordered ? "" : `<span class="tag">${esc(t("tag.unordered"))}</span>`}
            <label class="known-box"><input type="checkbox" data-known="${esc(key)}" ${known[key] ? "checked" : ""}> ${esc(t("known"))}</label>
          </div>
          <p class="prompt">${esc(e.prompt.trim())}</p>
          ${e.setup ? `<div class="step-label">${esc(t("setup.ran"))}</div>${code(e.setup, db.lang)}` : ""}
          ${e.hints.length ? `<details class="hint"><summary>${esc(t("hints", { n: e.hints.length }))}</summary>
            <ol>${e.hints.map((h) => `<li>${esc(h)}</li>`).join("")}</ol></details>` : ""}
          <details class="ans" ${state.showAnswers ? "open" : ""}><summary>${esc(t("seeAnswer"))}</summary>
            ${code(e.answer, db.lang)}
            ${e.explanation ? `<div class="explain">${esc(e.explanation.trim())}</div>` : ""}
            ${blocks(e.result)}
            ${blocks(e.checks, t("checks.title"))}
          </details>
        </article>`;
    });
    return filters + (shown ? html : `<p class="empty">${esc(t("empty"))}</p>`);
  }

  // ---------- 陷阱題 ----------
  const trapMatch = (tr, q) => matches(q, tr.title, tr.question, tr.explanation, tr.setup, ...tr.options, ...tr.scripts.map((s) => s.code));

  function renderTraps(db, q) {
    const list = db.traps.filter((tr) => trapMatch(tr, q));
    if (!list.length) return `<p class="empty">${esc(t("empty"))}</p>`;
    return list.map((tr) => `
      <article class="card" data-trap="${esc(tr.id)}">
        <div class="card-head"><span class="num">#${db.traps.indexOf(tr) + 1}</span><h3>${esc(tr.title)}</h3></div>
        ${tr.setup ? `<div class="step-label">${esc(t("trap.setup"))}</div>${code(tr.setup, db.lang)}` : ""}
        <div class="pair ${tr.scripts.length === 1 ? "single" : ""}">
          ${tr.scripts.map((s) => `<div><div class="pair-label">${esc(s.label)}</div>${code(s.code, db.lang)}</div>`).join("")}
        </div>
        <p class="question">${esc(tr.question)}</p>
        <div class="options">
          ${tr.options.map((o, i) => `<button type="button" class="option" data-choice="${i}">${esc(o)}</button>`).join("")}
        </div>
        <div class="reveal" hidden></div>
      </article>`).join("");
  }

  function answerTrap(card, choice) {
    const db = dbOf(state.db);
    const tr = db.traps.find((x) => x.id === card.dataset.trap);
    const buttons = [...card.querySelectorAll("[data-choice]")];
    buttons.forEach((b) => (b.disabled = true));
    buttons[tr.answer].classList.add("correct");
    if (choice !== tr.answer) buttons[choice].classList.add("wrong");
    const reveal = card.querySelector(".reveal");
    reveal.hidden = false;
    reveal.innerHTML = `
      <p class="verdict ${choice === tr.answer ? "ok" : "bad"}">${choice === tr.answer ? esc(t("trap.right")) : esc(t("trap.wrong", { a: tr.options[tr.answer] }))}</p>
      <div class="explain">${esc(tr.explanation.trim())}</div>
      ${tr.results ? `<div class="pair ${tr.results.length === 1 ? "single" : ""}">${tr.results.map((r, i) =>
        `<div>${blocks(r, t("trap.result", { label: tr.scripts[i].label }))}</div>`).join("")}</div>` : ""}
      <button type="button" class="retry">${esc(t("retry"))}</button>`;
  }

  // ---------- 實驗 ----------
  const stepMatch = (s, q) => matches(q, s.title, s.goal, s.question, s.takeaway, ...s.setup, ...s.queries.map((x) => x.code));

  function renderLab(db, q) {
    const list = db.steps.filter((s) => stepMatch(s, q));
    if (!list.length) return `<p class="empty">${esc(t("empty.steps"))}</p>`;
    return `<p class="note">${esc(db.labNote)}</p>` + list.map((s) => `
      <article class="card">
        <div class="card-head"><span class="num">${esc(t("step.n", { n: db.steps.indexOf(s) + 1 }))}</span><h3>${esc(s.title)}</h3></div>
        <p class="goal">${esc(s.goal.trim())}</p>
        ${s.setup.length ? `<div class="step-label">${esc(t("step.indexes"))}</div>${code(s.setup.join("\n"), db.lang)}` : ""}
        ${s.queries.map((x) => `<div class="step-label">${esc(x.label)}</div>${code(x.code, db.lang)}`).join("")}
        ${s.question ? `<p class="question">${esc(t("step.think", { q: s.question }))}</p>` : ""}
        <details ${state.showAnswers ? "open" : ""}><summary>${esc(t("step.explain"))}</summary><div class="explain">${esc(s.takeaway.trim())}</div></details>
      </article>`).join("");
  }

  // ---------- 事件 ----------
  bank.addEventListener("click", (e) => {
    const kind = e.target.closest("[data-kind]");
    if (kind) { go(state.db, kind.dataset.kind); return; }
    const chap = e.target.closest("[data-chapter]");
    if (chap) { state.chapter = chap.dataset.chapter; render(); return; }
    const opt = e.target.closest("[data-choice]");
    if (opt && !opt.disabled) { answerTrap(opt.closest("[data-trap]"), Number(opt.dataset.choice)); return; }
    const retry = e.target.closest(".retry");
    if (retry) {
      const card = retry.closest("[data-trap]");
      card.querySelectorAll("[data-choice]").forEach((b) => { b.disabled = false; b.className = "option"; });
      const reveal = card.querySelector(".reveal");
      reveal.hidden = true; reveal.innerHTML = "";
    }
  });
  bank.addEventListener("change", (e) => {
    const k = e.target.closest("[data-known]");
    if (k) {
      if (k.checked) known[k.dataset.known] = true; else delete known[k.dataset.known];
      store.set(KNOWN_KEY, known);
      k.closest(".card").classList.toggle("known", k.checked);
      const db = dbOf(state.db);
      const p = bank.querySelector(".progress b");
      if (p) p.textContent = db.exercises.filter((x) => known[`${db.id}:${x.id}`]).length;
      return;
    }
    const t = e.target.closest("[data-toggle]");
    if (t) { state[t.dataset.toggle] = t.checked; render(); }
  });

  let timer = null;
  input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(render, 150); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== input) { e.preventDefault(); input.focus(); }
  });

  // 網址：#資料庫/題型，例如 #cassandra/traps（方便分享或重新整理後回到同一頁）
  function go(db, kind, push = true) {
    const changedDb = db !== state.db;
    state.db = dbOf(db).id;
    state.kind = kind || "practice";
    if (changedDb) state.chapter = "*";
    store.set(LAST_KEY, `${state.db}/${state.kind}`);
    if (push) { try { history.replaceState(null, "", `#${state.db}/${state.kind}`); } catch { /* 有些環境不允許改網址 */ } }
    render();
    window.scrollTo(0, 0);
  }
  tabsNav.addEventListener("click", (e) => {
    const a = e.target.closest("[data-tab]");
    if (!a) return;
    e.preventDefault();
    go(a.dataset.tab, state.kind);
  });
  const fromHash = () => {
    const [db, kind] = (location.hash.slice(1) || store.get(LAST_KEY, "")).split("/");
    // 舊網址 #practice / #traps / #lab 是 PostgreSQL 的題庫
    if (["practice", "traps", "lab"].includes(db)) return go("postgresql", db, false);
    go(db || data.dbs[0].id, kind, false);
  };
  window.addEventListener("hashchange", fromHash);
  fromHash();
})();

</script>
</body>
</html>
