<script type="application/json" id="data">{"dbs": [{"id": "postgresql", "name": "PostgreSQL", "lang": "sql", "labName": "インデックス実験", "labNote": "対象は perf スキーマの 200 万行の大きなテーブル 2 つ：perf.orders_big（ランダムな順序で挿入）と perf.order_events（時刻順に挿入）。各ステップでまずインデックスなしで EXPLAIN ANALYZE を実行し、インデックスを作成して再実行し、実行計画と時間を比較します。", "hasResults": true, "exercises": [{"id": "status-count", "chapter": "基本の集計", "title": "ステータス別の注文数", "prompt": "注文ステータスごとの注文数を集計してください。\n表示：status、注文数。\n並び順：注文数の多い順。\n", "hints": ["GROUP BY status で同じステータスの注文を 1 つのグループにまとめます。", "count(*) で各グループの件数を数えます。ORDER BY では SELECT で付けた別名をそのまま使えます。"], "answer": "SELECT status, count(*) AS orders\nFROM orders\nGROUP BY status\nORDER BY orders DESC;\n", "explanation": "最も基本的なグループ集計です。ORDER BY では SELECT の別名 orders を使えますが、WHERE では使えません：\nWHERE が実行される時点では SELECT はまだ実行されておらず、別名が存在しないからです。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["status", "orders"], "rows": [["delivered", 64554], ["cancelled", 8108], ["returned", 6340], ["shipped", 351], ["pending", 329], ["paid", 318]], "total": 6}}]}, {"id": "having", "chapter": "基本の集計", "title": "注文が 50 回を超える会員", "prompt": "注文回数が 50 回を超える会員を探してください。\n表示：会員 id、注文回数。\n並び順：注文回数の多い順。同数なら会員 id の昇順。\n", "hints": ["まず GROUP BY customer_id で会員ごとの注文回数を数えます。", "「グループ化した後」の条件は HAVING に書きます。WHERE には書けません。"], "answer": "SELECT customer_id, count(*) AS orders\nFROM orders\nGROUP BY customer_id\nHAVING count(*) > 50\nORDER BY orders DESC, customer_id;\n", "explanation": "★ 面接頻出：WHERE はグループ化の「前」に行を絞り込み、HAVING はグループ化の「後」にグループを絞り込みます。\n集約関数（count、sum…）は HAVING にしか書けず、WHERE に書くとエラーになります。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["customer_id", "orders"], "rows": [[1, 152], [2, 94], [3, 73], [4, 62], [5, 62], [8, 57], [10, 52]], "total": 7}}]}, {"id": "distinct-city", "chapter": "基本の集計", "title": "重複のない配送先都市", "prompt": "全注文に登場する配送先都市（shipping_city）を重複なしで一覧にしてください。\n表示：都市。\n並び順：都市名。\n", "hints": ["SELECT DISTINCT は完全に同じ行を 1 行にまとめます。"], "answer": "SELECT DISTINCT shipping_city\nFROM orders\nORDER BY shipping_city;\n", "explanation": "DISTINCT と GROUP BY shipping_city の結果は同じです。重複を除くだけなら DISTINCT の方が直感的で、\n件数も同時に数えたいときに GROUP BY を使います。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["shipping_city"], "rows": [["台中市"], ["台北市"], ["台南市"], ["台東縣"], ["嘉義市"], ["基隆市"], ["宜蘭縣"], ["屏東縣"], ["彰化縣"], ["新北市"]], "total": 15}}]}, {"id": "vip-count", "chapter": "基本の集計", "title": "VIP レベル別の会員数", "prompt": "VIP レベル（vip_level）ごとの会員数を集計してください。\n表示：vip_level、会員数。\n並び順：問わない。\n", "hints": ["1 問目と同じ書き方で、テーブルを customers に変えるだけです。"], "answer": "SELECT vip_level, count(*) AS members\nFROM customers\nGROUP BY vip_level;\n", "explanation": "この問題は順序を問わないので、ORDER BY がなくても正解です。\nただし覚えておきましょう：ORDER BY がないとき、データベースは返す順序を「保証しません」。実行のたびに変わる可能性があります。\n", "ordered": false, "write": false, "setup": null, "result": [{"table": {"columns": ["vip_level", "members"], "rows": [["silver", 2670], ["gold", 891], ["normal", 16439]], "total": 3}}]}, {"id": "never-ordered", "chapter": "JOIN", "title": "一度も注文していない会員", "prompt": "一度も注文したことのない会員を一覧にしてください。\n表示：会員 id、氏名、登録日。\n並び順：登録日の古い順。同じ日なら id の昇順。先頭 10 件のみ。\n", "hints": ["INNER JOIN では注文のない会員が除外されます。LEFT JOIN で全会員を残しましょう。", "LEFT JOIN で注文が見つからないとき、注文側の列はすべて NULL になります。WHERE o.id IS NULL でそれらを取り出します。"], "answer": "SELECT c.id, c.name, c.signup_date\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.id IS NULL\nORDER BY c.signup_date, c.id\nLIMIT 10;\n", "explanation": "「対応するデータがない行を探す」には 2 つの定番の書き方があります：\nLEFT JOIN … WHERE 右表.id IS NULL、または WHERE NOT EXISTS (サブクエリ)。\n結果は同じで、PostgreSQL は通常どちらも同じ実行計画（Anti Join）に最適化します。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "signup_date"], "rows": [[2469, "鄭子廷", "2022-07-22"], [2941, "徐子婷", "2022-08-30"], [2961, "蕭欣萱", "2022-08-31"], [2987, "莊家涵", "2022-09-03"], [3215, "吳宇瑋", "2022-09-21"], [3751, "呂書瑋", "2022-11-04"], [3887, "林俊樺", "2022-11-15"], [3964, "王宜文", "2022-11-22"], [4451, "周明安", "2023-01-01"], [4473, "郭詩廷", "2023-01-02"]], "total": 10}}]}, {"id": "products-per-category", "chapter": "JOIN", "title": "カテゴリ別の商品数（0 を含む）", "prompt": "カテゴリごとの商品数を集計してください。商品のないカテゴリも 0 として表示します。\n表示：カテゴリ id、カテゴリ名、商品数。\n並び順：カテゴリ id。\n", "hints": ["categories を主表にして products を LEFT JOIN します。", "count(*) は「NULL で埋められた行」も 1 と数えてしまうので、count(p.id) を使います。"], "answer": "SELECT c.id, c.name, count(p.id) AS products\nFROM categories c\nLEFT JOIN products p ON p.category_id = c.id\nGROUP BY c.id, c.name\nORDER BY c.id;\n", "explanation": "★ 落とし穴：LEFT JOIN の後に count(*) を使うと、商品のないカテゴリが 0 ではなく 1 になります。\nLEFT JOIN でも 1 行（右側がすべて NULL）は生成されるからです。count(列) は NULL を数えないので 0 になります。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "products"], "rows": [[1, "3C電子", 0], [2, "手機", 78], [3, "筆電", 76], [4, "耳機", 0], [5, "無線耳機", 69], [6, "有線耳機", 92], [7, "手機配件", 80], [8, "居家生活", 0], [9, "廚房用品", 71], [10, "寢具", 95]], "total": 27}}]}, {"id": "category-parent", "chapter": "JOIN", "title": "カテゴリと親カテゴリ（SELF JOIN）", "prompt": "各カテゴリとその親カテゴリ名を一覧にしてください。最上位のカテゴリには親がないので「無」（なし）と表示します。\n表示：カテゴリ id、カテゴリ名、親カテゴリ名。\n並び順：カテゴリ id。\n", "hints": ["categories を自分自身と JOIN するので、同じテーブルに c と p のような別々の別名を付けます。", "最上位カテゴリの parent_id は NULL です。LEFT JOIN で除外されないようにし、COALESCE で NULL を「無」に置き換えます。"], "answer": "SELECT c.id, c.name, COALESCE(p.name, '無') AS parent\nFROM categories c\nLEFT JOIN categories p ON p.id = c.parent_id\nORDER BY c.id;\n", "explanation": "SELF JOIN は同じテーブルを 2 つのテーブルとして使うことです。よくある例：社員と上司、カテゴリと親カテゴリ、紹介者と被紹介者。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "parent"], "rows": [[1, "3C電子", "無"], [2, "手機", "3C電子"], [3, "筆電", "3C電子"], [4, "耳機", "3C電子"], [5, "無線耳機", "耳機"], [6, "有線耳機", "耳機"], [7, "手機配件", "3C電子"], [8, "居家生活", "無"], [9, "廚房用品", "居家生活"], [10, "寢具", "居家生活"]], "total": 27}}]}, {"id": "top-categories-2026", "chapter": "JOIN", "title": "2026 年に最も売れたカテゴリ", "prompt": "2026 年に注文され、ステータスが delivered の注文について、カテゴリごとの販売数量（quantity の合計）を集計してください。\n表示：カテゴリ名、数量。\n並び順：数量の多い順、上位 5 件。\n", "hints": ["4 つのテーブルをつなぎます：orders → order_items → products → categories。", "日付範囲は order_date >= '2026-01-01' AND order_date < '2027-01-01' と書くのがおすすめです。"], "answer": "SELECT c.name, sum(oi.quantity) AS qty\nFROM orders o\nJOIN order_items oi ON oi.order_id = o.id\nJOIN products p     ON p.id = oi.product_id\nJOIN categories c   ON c.id = p.category_id\nWHERE o.status = 'delivered'\n  AND o.order_date >= '2026-01-01' AND o.order_date < '2027-01-01'\nGROUP BY c.name\nORDER BY qty DESC\nLIMIT 5;\n", "explanation": "日付範囲は「>= 開始 AND < 次の開始」が最も安全です。最終日の午後を取りこぼさず、インデックスも使えます。\nextract(year FROM order_date) = 2026 でも結果は同じですが、列を関数で包むと通常のインデックスは使えなくなります。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["name", "qty"], "rows": [["寢具", 5126], ["女裝", 4475], ["收納", 4444], ["手機", 4294], ["露營用品", 4157]], "total": 5}}]}, {"id": "profile-completeness", "chapter": "NULL", "title": "会員情報の充足度", "prompt": "会員情報の充足度を集計してください。結果は 1 行だけです。\n表示：会員総数、誕生日を入力済みの人数、都市を入力済みの人数。\n", "hints": ["count(*) は行数を数え、count(列) はその列が「NULL でない」行だけを数えます。"], "answer": "SELECT count(*)          AS total,\n       count(birth_date) AS has_birth_date,\n       count(city)       AS has_city\nFROM customers;\n", "explanation": "★ count(*) と count(列) の違いは面接の定番です。sum、avg、max、min も NULL を無視するので、\navg(列) は「値がある行」の平均であって、全員の平均ではありません。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["total", "has_birth_date", "has_city"], "rows": [[20000, 18859, 19384]], "total": 1}}]}, {"id": "city-with-unknown", "chapter": "NULL", "title": "都市別の会員数（未入力を含む）", "prompt": "都市ごとの会員数を集計してください。都市が未入力の会員は「未填寫」（未入力）にまとめます。\n表示：都市、人数。\n並び順：人数の多い順。同数なら都市名順。\n", "hints": ["COALESCE(city, '未填寫') で NULL を「未填寫」に置き換えます。", "GROUP BY にも同じ COALESCE の式を使います（または GROUP BY 1）。"], "answer": "SELECT COALESCE(city, '未填寫') AS city, count(*) AS members\nFROM customers\nGROUP BY COALESCE(city, '未填寫')\nORDER BY members DESC, city;\n", "explanation": "実は COALESCE がなくても、GROUP BY city はすべての NULL を 1 つのグループにまとめます。\nCOALESCE はレポートを見やすくするためのものです。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["city", "members"], "rows": [["台北市", 4330], ["新北市", 2039], ["台中市", 1638], ["高雄市", 1370], ["桃園市", 1216], ["台南市", 1088], ["新竹市", 1028], ["新竹縣", 976], ["基隆市", 905], ["彰化縣", 887]], "total": 16}}]}, {"id": "phones-above-avg", "chapter": "サブクエリ", "title": "全体平均より高いスマートフォン", "prompt": "「手機」（スマートフォン）カテゴリのうち、価格が「全商品の平均価格」より高い商品を一覧にしてください。\n表示：商品 id、名称、価格。\n並び順：価格の高い順。同じ価格なら id の昇順。\n", "hints": ["全商品の平均価格はサブクエリで求められます：(SELECT avg(price) FROM products)。", "カテゴリ名「手機」で絞り込むには categories を JOIN します。"], "answer": "SELECT p.id, p.name, p.price\nFROM products p\nJOIN categories c ON c.id = p.category_id\nWHERE c.name = '手機'\n  AND p.price > (SELECT avg(price) FROM products)\nORDER BY p.price DESC, p.id;\n", "explanation": "単一の値を返すサブクエリを「スカラーサブクエリ」と呼び、値が必要な場所ならどこにでも書けます。\n外側のクエリに依存しないので、実行は 1 回だけです。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "price"], "rows": [[540, "Sony 手機 I447", 29949.0], [395, "小米 手機 O256", 28769.0], [1122, "ASUS 手機 H620", 28659.0], [465, "Samsung 手機 D707", 28649.0], [115, "Apple 手機 Q137", 28229.0], [410, "小米 手機 L473", 28119.0], [952, "小米 手機 R209", 27849.0], [876, "ASUS 手機 X745", 27839.0], [844, "Apple 手機 B600", 26799.0], [216, "Samsung 手機 V578", 26739.0]], "total": 78}}]}, {"id": "never-sold", "chapter": "サブクエリ", "title": "一度も売れていない商品（NOT EXISTS）", "prompt": "どの注文明細にも一度も登場していない商品を探してください。\n表示：商品 id、名称、登録日（created_at）。\n並び順：商品 id。\n", "hints": ["WHERE NOT EXISTS (SELECT 1 FROM order_items oi WHERE oi.product_id = p.id)"], "answer": "SELECT p.id, p.name, p.created_at\nFROM products p\nWHERE NOT EXISTS (\n    SELECT 1 FROM order_items oi WHERE oi.product_id = p.id\n)\nORDER BY p.id;\n", "explanation": "EXISTS は「あるかどうか」だけを見て、1 件見つかれば止まります。そのためサブクエリは慣習的に SELECT 1 と書きます。\n★「存在しない」ものを探すときは NOT IN ではなく NOT EXISTS を優先しましょう。サブクエリに NULL が 1 つでもあると NOT IN は 1 件も返しません（落とし穴問題で実演しています）。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "created_at"], "rows": [[1401, "ESR 手機配件 B485", "2026-09-14"], [1402, "Kiehls 保養 N117", "2026-09-25"], [1403, "無印良品 寢具 I961", "2026-09-19"], [1404, "黑松 飲料 S360", "2026-08-26"], [1405, "大成 生鮮 R623", "2026-08-26"], [1406, "MAC 彩妝 C382", "2026-07-22"], [1407, "ESR 手機配件 Q355", "2026-07-12"], [1408, "UNIQLO 男裝 N750", "2026-08-27"], [1409, "Coleman 露營用品 M690", "2026-07-09"], [1410, "無印良品 收納 I355", "2026-08-07"]], "total": 100}}]}, {"id": "gold-returned", "chapter": "サブクエリ", "title": "返品履歴のあるゴールド会員", "prompt": "VIP レベルが gold で、返品（status = 'returned'）された注文がある会員は何人ですか？\n結果は 1 つの数値です。\n", "hints": ["EXISTS で「この会員に返品注文があるか」を確認します。", "JOIN で書く場合、1 人の会員に複数の返品があり得るので count(DISTINCT c.id) にします。"], "answer": "SELECT count(*) AS members\nFROM customers c\nWHERE c.vip_level = 'gold'\n  AND EXISTS (\n      SELECT 1 FROM orders o\n      WHERE o.customer_id = c.id AND o.status = 'returned'\n  );\n", "explanation": "★ JOIN で書くと数え間違えやすいです：返品が 3 件ある会員は JOIN 後に 3 行になり、count(*) が重複して数えます。\nEXISTS はもともと重複しないので、「あるかどうか」の判定には JOIN より向いています。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["members"], "rows": [[344]], "total": 1}}]}, {"id": "price-level", "chapter": "CASE WHEN", "title": "商品の価格帯", "prompt": "商品を価格で 3 段階に分けます：10000 以上は「高價」（高価格）、1000 以上は「中價」（中価格）、それ以外は「平價」（低価格）。\n各段階の商品数を集計してください。\n表示：価格帯、商品数。\n並び順：問わない。\n", "hints": ["CASE WHEN price >= 10000 THEN '高價' WHEN price >= 1000 THEN '中價' ELSE '平價' END", "GROUP BY 1 と書くと、SELECT の 1 番目の列でグループ化するという意味になります。"], "answer": "SELECT CASE WHEN price >= 10000 THEN '高價'\n            WHEN price >= 1000  THEN '中價'\n            ELSE '平價' END AS level,\n       count(*) AS products\nFROM products\nGROUP BY 1;\n", "explanation": "CASE WHEN は上から順に判定し、最初に成立した時点で止まるので、条件の順序が重要です。\n先に price >= 1000 と書くと、高価格の商品も「中價」に分類されてしまいます。\n", "ordered": false, "write": false, "setup": null, "result": [{"table": {"columns": ["level", "products"], "rows": [["中價", 677], ["高價", 143], ["平價", 680]], "total": 3}}]}, {"id": "cancel-rate-by-year", "chapter": "CASE WHEN", "title": "年ごとのキャンセル率", "prompt": "年ごと（注文日時ベース）の注文数、キャンセル数（status = 'cancelled'）、キャンセル率を集計してください。\nキャンセル率はパーセントで、小数第 1 位に四捨五入します（例：9.8）。\n表示：年、注文数、キャンセル数、キャンセル率。\n並び順：年。\n", "hints": ["extract(year FROM order_date) で年を取り出します。", "キャンセル数は count(*) FILTER (WHERE status = 'cancelled') か、sum(CASE WHEN … THEN 1 ELSE 0 END) で数えられます。", "★ 整数 ÷ 整数は整数になります（9 / 100 = 0）。小数を得るには 100.0 * … と書きます。"], "answer": "SELECT extract(year FROM order_date)::int AS year,\n       count(*) AS orders,\n       count(*) FILTER (WHERE status = 'cancelled') AS cancelled,\n       round(100.0 * count(*) FILTER (WHERE status = 'cancelled') / count(*), 1) AS cancel_pct\nFROM orders\nGROUP BY 1\nORDER BY 1;\n", "explanation": "「条件付き集計」はレポートで最もよく使うテクニックで、1 回のスキャンで複数の条件の件数を求められます。\nFILTER は PostgreSQL の書き方、sum(CASE WHEN …) はどのデータベースでも使える書き方です。両方覚えましょう。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["year", "orders", "cancelled", "cancel_pct"], "rows": [[2022, 4324, 418, 9.7], [2023, 9907, 1000, 10.1], [2024, 15934, 1636, 10.3], [2025, 24005, 2435, 10.1], [2026, 25830, 2619, 10.1]], "total": 5}}]}, {"id": "union-members", "chapter": "集合演算", "title": "キャンセルまたは返品した会員（UNION）", "prompt": "「キャンセル」または「返品」の注文履歴がある会員は全部で何人ですか？\n結果は 1 つの数値です。UNION で書いてみましょう。\n", "hints": ["まず 2 つのクエリを書きます：キャンセルしたことのある customer_id と、返品したことのある customer_id。それを UNION で結合します（UNION は重複を除きます）。", "結合した結果を FROM ( … ) t に入れ、外側で count(*) します。"], "answer": "SELECT count(*) AS members\nFROM (\n    SELECT customer_id FROM orders WHERE status = 'cancelled'\n    UNION\n    SELECT customer_id FROM orders WHERE status = 'returned'\n) t;\n", "explanation": "★ UNION は重複を除き、UNION ALL は除きません。この問題は「会員の人数」なので、両方ある人も 1 回だけ数える必要があり、UNION を使います。\nもっと簡単な書き方：count(DISTINCT customer_id) … WHERE status IN ('cancelled', 'returned')。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["members"], "rows": [[9556]], "total": 1}}]}, {"id": "except-churned", "chapter": "集合演算", "title": "2025 年に購入、2026 年は購入なし（EXCEPT）", "prompt": "2025 年に注文があり、2026 年には一度も注文していない会員は何人ですか？\n結果は 1 つの数値です。\n", "hints": ["A EXCEPT B：A にあって B にないデータ。", "A = 2025 年に注文した customer_id、B = 2026 年に注文した customer_id。"], "answer": "SELECT count(*) AS members\nFROM (\n    SELECT customer_id FROM orders\n    WHERE order_date >= '2025-01-01' AND order_date < '2026-01-01'\n    EXCEPT\n    SELECT customer_id FROM orders\n    WHERE order_date >= '2026-01-01' AND order_date < '2027-01-01'\n) t;\n", "explanation": "これが「離脱会員」の求め方です。EXCEPT も重複を除きます。\n同じことは NOT EXISTS でも書け、大量データでは通常そちらの方が最適化しやすいです。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["members"], "rows": [[3985]], "total": 1}}]}, {"id": "first-order", "chapter": "ウィンドウ関数", "title": "会員ごとの最初の注文（DISTINCT ON）", "prompt": "会員 id 1〜10 の、それぞれの最初の注文（注文日時が最も早いもの）。\n表示：会員 id、注文 id、注文日時。\n並び順：会員 id。\n", "hints": ["PostgreSQL 専用の書き方：SELECT DISTINCT ON (customer_id) … ORDER BY customer_id, order_date", "汎用的な書き方：row_number() OVER (PARTITION BY customer_id ORDER BY order_date) で番号を振り、外側で 1 番を取ります。"], "answer": "SELECT DISTINCT ON (customer_id)\n       customer_id, id AS order_id, order_date\nFROM orders\nWHERE customer_id BETWEEN 1 AND 10\nORDER BY customer_id, order_date;\n", "explanation": "DISTINCT ON (列) は各グループで ORDER BY の並びの先頭行を残します。PostgreSQL で「グループごとに最初の 1 件」を取る最も簡潔な書き方です。\nORDER BY の先頭は DISTINCT ON の列と同じでなければなりません。面接で相手が PostgreSQL を使っていなければ row_number() で書きましょう。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["customer_id", "order_id", "order_date"], "rows": [[1, 10, "2022-01-09 01:25:07"], [2, 116, "2022-02-12 16:48:46"], [3, 1, "2022-01-01 04:41:30"], [4, 84, "2022-02-03 18:43:27"], [5, 12, "2022-01-09 03:49:33"], [6, 417, "2022-04-01 17:22:43"], [7, 2, "2022-01-01 23:46:36"], [8, 6, "2022-01-08 08:22:20"], [9, 16, "2022-01-11 07:02:51"], [10, 40, "2022-01-22 05:54:25"]], "total": 10}}]}, {"id": "top-product-per-category", "chapter": "ウィンドウ関数", "title": "カテゴリごとの最も高い商品", "prompt": "各カテゴリで価格が最も高い商品を探してください（同じ価格なら商品 id の小さい方）。商品のあるカテゴリだけを表示します。\n表示：カテゴリ id、商品 id、商品名、価格。\n並び順：カテゴリ id。\n", "hints": ["row_number() OVER (PARTITION BY category_id ORDER BY price DESC, id) でカテゴリ内の商品に番号を振ります。", "ウィンドウ関数は WHERE に直接書けないので、サブクエリか CTE で包み、外側で rn = 1 に絞ります。"], "answer": "SELECT category_id, id, name, price\nFROM (\n    SELECT p.*,\n           row_number() OVER (PARTITION BY category_id ORDER BY price DESC, id) AS rn\n    FROM products p\n) t\nWHERE rn = 1\nORDER BY category_id;\n", "explanation": "★「グループごとの上位 N 件」は面接で最もよく出るウィンドウ関数の問題です。\n上位 3 件なら rn <= 3 に。同点を同順位にしたいなら rank() か dense_rank() を使います。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["category_id", "id", "name", "price"], "rows": [[2, 540, "Sony 手機 I447", 29949.0], [3, 1277, "Apple 筆電 N731", 59249.0], [5, 627, "JBL 無線耳機 V398", 6779.0], [6, 559, "Audio-Technica 有線耳機 C203", 2349.0], [7, 626, "ESR 手機配件 V682", 969.0], [9, 911, "膳魔師 廚房用品 S292", 1579.0], [10, 1294, "IKEA 寢具 Z619", 2999.0], [11, 114, "天馬 收納 H542", 789.0], [13, 118, "UNIQLO 男裝 C928", 1589.0], [14, 1129, "GU 女裝 O406", 1799.0]], "total": 19}}]}, {"id": "monthly-revenue-diff", "chapter": "ウィンドウ関数", "title": "月次売上と前月差（LAG）", "prompt": "2026 年 1〜9 月の、配送済み（delivered）注文の月次売上と、前月からの増加額。\n売上 = quantity × unit_price × (1 − discount) の合計を整数に四捨五入します。差額は四捨五入後の売上同士の差です。\n最初の月には前月がないので、差額は NULL と表示します。\n表示：月（日付、例：2026-01-01）、売上、差額。\n並び順：月。\n", "hints": ["date_trunc('month', order_date)::date で日時をその月の 1 日に切り捨てます。", "まず CTE で月次売上を求め、外側で lag(revenue) OVER (ORDER BY month) を使って前月の値を取ります。"], "answer": "WITH monthly AS (\n    SELECT date_trunc('month', o.order_date)::date AS month,\n           round(sum(oi.quantity * oi.unit_price * (1 - oi.discount))) AS revenue\n    FROM orders o\n    JOIN order_items oi ON oi.order_id = o.id\n    WHERE o.status = 'delivered'\n      AND o.order_date >= '2026-01-01' AND o.order_date < '2026-10-01'\n    GROUP BY 1\n)\nSELECT month, revenue,\n       revenue - lag(revenue) OVER (ORDER BY month) AS diff\nFROM monthly\nORDER BY month;\n", "explanation": "lag() は前の行、lead() は次の行を取り、前月比・前年比・間隔日数の計算によく使われます。\n月次売上を先に CTE に入れておくと、外側のウィンドウ関数がずっと読みやすくなります。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["month", "revenue", "diff"], "rows": [["2026-01-01", 34018789, null], ["2026-02-01", 29021196, -4997593], ["2026-03-01", 33809671, 4788475], ["2026-04-01", 34632714, 823043], ["2026-05-01", 36308874, 1676160], ["2026-06-01", 36198308, -110566], ["2026-07-01", 36746481, 548173], ["2026-08-01", 36347356, -399125], ["2026-09-01", 22410672, -13936684]], "total": 9}}]}, {"id": "cumulative-signups", "chapter": "ウィンドウ関数", "title": "累計登録者数", "prompt": "2026 年 1〜6 月の、月ごとの新規会員数と、2026 年 1 月からその月までの累計人数。\n表示：月（日付、例：2026-01-01）、新規会員数、累計人数。\n並び順：月。\n", "hints": ["累計：sum(…) OVER (ORDER BY month)。", "先に CTE で月ごとの人数を求めてから外側で累計すると、間違えにくくなります。"], "answer": "WITH m AS (\n    SELECT date_trunc('month', signup_date)::date AS month, count(*) AS new_members\n    FROM customers\n    WHERE signup_date >= '2026-01-01' AND signup_date < '2026-07-01'\n    GROUP BY 1\n)\nSELECT month, new_members,\n       sum(new_members) OVER (ORDER BY month) AS cumulative\nFROM m\nORDER BY month;\n", "explanation": "sum() に OVER (ORDER BY …) を付けると累計になります。ウィンドウの既定値は「最初の行から現在の行まで」です。\nORDER BY を外すと、すべての行が全体の合計になります。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["month", "new_members", "cumulative"], "rows": [["2026-01-01", 378, 378], ["2026-02-01", 341, 719], ["2026-03-01", 378, 1097], ["2026-04-01", 365, 1462], ["2026-05-01", 378, 1840], ["2026-06-01", 353, 2193]], "total": 6}}]}, {"id": "order-gap-days", "chapter": "ウィンドウ関数", "title": "注文の間隔日数", "prompt": "会員 id 1 の注文を注文日時順に並べた先頭 10 件と、それぞれ「直前の注文」から何日空いたか。\n間隔日数 = この注文の日付 − 直前の注文の日付（日付のみで比較）。最初の行は NULL を表示します。\n表示：注文 id、注文日（date）、間隔日数。\n並び順：注文日時。\n", "hints": ["order_date::date で日時を日付に変換します。date − date は整数の日数になります。", "lag(order_date::date) OVER (ORDER BY order_date) で直前の注文の日付を取ります。"], "answer": "SELECT id,\n       order_date::date AS order_day,\n       order_date::date - lag(order_date::date) OVER (ORDER BY order_date) AS gap_days\nFROM orders\nWHERE customer_id = 1\nORDER BY order_date\nLIMIT 10;\n", "explanation": "実行順序に注意：WHERE → ウィンドウ関数 → ORDER BY → LIMIT。\nつまり lag() は WHERE を通過したすべての行を参照でき、LIMIT 10 は最後に表示を切り詰めるだけです。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "order_day", "gap_days"], "rows": [[10, "2022-01-09", null], [17, "2022-01-11", 2], [49, "2022-01-26", 15], [55, "2022-01-27", 1], [68, "2022-01-30", 3], [79, "2022-02-02", 3], [148, "2022-02-18", 16], [207, "2022-03-01", 11], [237, "2022-03-07", 6], [333, "2022-03-21", 14]], "total": 10}}]}, {"id": "category-descendants", "chapter": "再帰 CTE", "title": "3C電子 配下のすべてのカテゴリ", "prompt": "「3C電子」（家電・デジタル製品）配下のすべての子孫カテゴリを一覧にしてください（3C電子 自身は含みません）。\n階層：直接の子カテゴリが 1、その下が 2。\n表示：カテゴリ id、名称、階層。\n並び順：カテゴリ id。\n", "hints": ["WITH RECURSIVE t AS ( 起点 UNION ALL 再帰部分 ) SELECT … FROM t", "起点：parent_id が 3C電子 の id に等しいカテゴリ、階層 1。", "再帰部分：categories JOIN t ON categories.parent_id = t.id、階層 + 1。"], "answer": "WITH RECURSIVE t AS (\n    SELECT id, name, 1 AS depth\n    FROM categories\n    WHERE parent_id = (SELECT id FROM categories WHERE name = '3C電子')\n    UNION ALL\n    SELECT c.id, c.name, t.depth + 1\n    FROM categories c\n    JOIN t ON c.parent_id = t.id\n)\nSELECT id, name, depth\nFROM t\nORDER BY id;\n", "explanation": "再帰 CTE は 2 つの部分からなります：起点（anchor）は 1 回だけ実行され、再帰部分は前回の結果を使って新しい行が見つからなくなるまで下へたどります。\nよくある用途：組織図、カテゴリツリー、コメントスレッド、部品表（BOM）。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "depth"], "rows": [[2, "手機", 1], [3, "筆電", 1], [4, "耳機", 1], [5, "無線耳機", 2], [6, "有線耳機", 2], [7, "手機配件", 1]], "total": 6}}]}, {"id": "jsonb-storage", "chapter": "JSONB", "title": "256GB のスマートフォン", "prompt": "products.specs は JSONB です。スマートフォンカテゴリ（category_id = 2）のうち、仕様の storage_gb が 256 の商品を一覧にしてください。\n表示：商品 id、名称、色（specs 内の color）。\n並び順：商品 id。\n", "hints": ["->> はテキストを取り出します：specs->>'color'。-> は JSONB を取り出します：specs->'warranty'。", "絞り込みは (specs->>'storage_gb')::int = 256、または包含演算子 specs @> '{\"storage_gb\": 256}' で書けます。"], "answer": "SELECT id, name, specs->>'color' AS color\nFROM products\nWHERE category_id = 2\n  AND specs @> '{\"storage_gb\": 256}'\nORDER BY id;\n", "explanation": "-> は JSONB、->> は text を返します。数値として比較するときは ->> の結果を先に型変換します：(specs->>'storage_gb')::int。\n@> は「包含」で、左の JSON が右の断片を含むかどうかを判定します。GIN インデックスを使えるのが利点です（インデックス実験で実演しています）。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "color"], "rows": [[62, "ASUS 手機 V121", "黑"], [76, "Apple 手機 B948", "藍"], [126, "Sony 手機 C992", "銀"], [395, "小米 手機 O256", "白"], [665, "小米 手機 S110", "銀"], [688, "ASUS 手機 W417", "黑"], [729, "ASUS 手機 Q952", "銀"], [783, "Sony 手機 K167", "白"], [867, "Samsung 手機 M403", "黑"], [906, "Apple 手機 A113", "白"]], "total": 17}}]}, {"id": "jsonb-color-count", "chapter": "JSONB", "title": "衣料品の色別商品数", "prompt": "メンズ・レディース（category_id 13、14）の色ごとの商品数を集計してください。仕様のない商品（specs が NULL）は数えません。\n表示：色、商品数。\n並び順：商品数の多い順。同数なら色の順。\n", "hints": ["GROUP BY specs->>'color' で JSON 内の値ごとにグループ化できます。"], "answer": "SELECT specs->>'color' AS color, count(*) AS products\nFROM products\nWHERE category_id IN (13, 14) AND specs IS NOT NULL\nGROUP BY 1\nORDER BY products DESC, color;\n", "explanation": "JSONB 内の値は、通常の列と同じように SELECT、WHERE、GROUP BY、ORDER BY で使えます。\n柔軟な属性（カテゴリごとに仕様が異なる）は JSONB に向いており、仕様の種類ごとに列を作る必要がありません。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["color", "products"], "rows": [["黑", 35], ["綠", 34], ["藍", 29], ["白", 25], ["灰", 24], ["紅", 14]], "total": 6}}]}, {"id": "jsonb-noise-cancelling", "chapter": "JSONB", "title": "ノイズキャンセリング商品の平均価格", "prompt": "仕様の noise_cancelling が true の商品の平均価格はいくらですか？整数に四捨五入してください。\n結果は 1 つの数値です。\n", "hints": ["(specs->>'noise_cancelling')::boolean、または specs @> '{\"noise_cancelling\": true}' と書けます。"], "answer": "SELECT round(avg(price)) AS avg_price\nFROM products\nWHERE specs @> '{\"noise_cancelling\": true}';\n", "explanation": "JSON の true はブール値で、文字列の \"true\" とは別物です：'{\"noise_cancelling\": \"true\"}' では何も見つかりません。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["avg_price"], "rows": [[3939]], "total": 1}}]}, {"id": "jsonb-nested", "chapter": "JSONB", "title": "保証 2 年の商品（ネストした JSON）", "prompt": "仕様の warranty.years が 2 の商品を、カテゴリごとに数えてください。（warranty はネストしたオブジェクトで、例えば {\"years\": 2, \"type\": \"原廠\"}）\n表示：カテゴリ名、商品数。\n並び順：商品数の多い順。同数ならカテゴリ名順。\n", "hints": ["1 段ずつ取り出す：specs->'warranty'->>'years'、またはパスで：specs #>> '{warranty,years}'。"], "answer": "SELECT c.name, count(*) AS products\nFROM products p\nJOIN categories c ON c.id = p.category_id\nWHERE (p.specs->'warranty'->>'years')::int = 2\nGROUP BY c.name\nORDER BY products DESC, c.name;\n", "explanation": "途中の階層では ->（JSONB のままなのでさらに下へたどれる）を使い、最後の階層だけ ->> でテキストを取り出します。\n#> と #>> はパス全体を一度に指定できます。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["name", "products"], "rows": [["有線耳機", 43], ["無線耳機", 36], ["手機", 35], ["筆電", 34]], "total": 4}}]}, {"id": "jsonb-key-exists", "chapter": "JSONB", "title": "バッテリー持続時間の仕様がある商品", "prompt": "仕様に battery_hours というキーがある商品は何件ですか？\n結果は 1 つの数値です。\n", "hints": ["? 演算子で JSONB にキーがあるかを判定します：specs ? 'battery_hours'。"], "answer": "SELECT count(*) AS products\nFROM products\nWHERE specs ? 'battery_hours';\n", "explanation": "? は単一のキー、?| は「いずれかのキーが存在」、?& は「すべてのキーが存在」を判定します。\n★ JDBC の PreparedStatement では ? がパラメータのプレースホルダとして扱われるので、Java では ?? と書くか jsonb_exists() 関数を使う必要があります。実務でよくはまるポイントです。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["products"], "rows": [[69]], "total": 1}}]}, {"id": "jsonb-array-elements", "chapter": "JSONB", "title": "サイズ別の衣料品数（JSON 配列の展開）", "prompt": "メンズ・レディース（category_id 13、14）の specs.sizes は JSON 配列です。例：[\"M\", \"L\", \"XL\"]。\n各サイズを提供している商品数を集計してください。\n表示：サイズ、商品数。\n並び順：問わない。\n", "hints": ["jsonb_array_elements_text(specs->'sizes') は配列を複数の行に展開します。", "FROM に書きます：FROM products p, jsonb_array_elements_text(p.specs->'sizes') AS s(size)。"], "answer": "SELECT s.size, count(*) AS products\nFROM products p,\n     jsonb_array_elements_text(p.specs->'sizes') AS s(size)\nWHERE p.category_id IN (13, 14)\nGROUP BY s.size;\n", "explanation": "FROM 内の関数は前に書いたテーブルの列を参照できます（暗黙の LATERAL）。各商品は「サイズの数だけの行」に展開されます。\nspecs が NULL の商品は展開しても行がないので、自然と数えられません。\n", "ordered": false, "write": false, "setup": null, "result": [{"table": {"columns": ["size", "products"], "rows": [["XXL", 46], ["M", 161], ["XL", 108], ["S", 86], ["L", 161]], "total": 5}}]}, {"id": "array-any", "chapter": "Array", "title": "セール商品の数（ANY）", "prompt": "products.tags は text[] です。「特價」（セール）タグが付いた商品は何件ですか？\n結果は 1 つの数値です。\n", "hints": ["'特價' = ANY(tags)：配列のいずれかの要素が「特價」に等しければ成立します。"], "answer": "SELECT count(*) AS products\nFROM products\nWHERE '特價' = ANY(tags);\n", "explanation": "ANY(配列) は「いずれか 1 つ」の意味です。tags @> ARRAY['特價'] とも書け、こちらは GIN インデックスを使えます。\nJava では = ANY(?) と setArray を組み合わせて id の一覧を渡すのが定番で、IN (…) の文字列を自分で組み立てる必要がなくなります。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["products"], "rows": [[303]], "total": 1}}]}, {"id": "array-contains", "chapter": "Array", "title": "人気かつ限定（@>）", "prompt": "「熱銷」（人気）と「限量」（限定）の両方のタグが付いた商品。\n表示：商品 id、名称。\n並び順：商品 id。\n", "hints": ["tags @> ARRAY['熱銷', '限量']：左の配列が右の要素をすべて「含む」。"], "answer": "SELECT id, name\nFROM products\nWHERE tags @> ARRAY['熱銷', '限量']\nORDER BY id;\n", "explanation": "@> は包含（すべて必要）、<@ は被包含、&& は重なり（いずれか 1 つが共通）です。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name"], "rows": [[77, "卡迪那 零食 A757"], [84, "ESR 手機配件 I142"], [100, "Belkin 手機配件 Y235"], [112, "華元 零食 I789"], [116, "UNIQLO 男裝 L278"], [215, "宜得利 寢具 Y998"], [251, "Lativ 男裝 N182"], [270, "Skechers 休閒鞋 L248"], [472, "1028 彩妝 S547"], [488, "IKEA 寢具 S227"]], "total": 21}}]}, {"id": "array-overlap", "chapter": "Array", "title": "エコまたは独占（&&）", "prompt": "「環保」（エコ）か「獨家」（独占販売）のどちらかのタグが付いた商品は何件ですか？\n結果は 1 つの数値です。\n", "hints": ["&& は「重なり」：2 つの配列に共通の要素が 1 つでもあれば成立します。"], "answer": "SELECT count(*) AS products\nFROM products\nWHERE tags && ARRAY['環保', '獨家'];\n", "explanation": "'環保' = ANY(tags) OR '獨家' = ANY(tags) と同じですが、&& の方が簡潔で、GIN インデックスも使えます。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["products"], "rows": [[231]], "total": 1}}]}, {"id": "array-unnest", "chapter": "Array", "title": "タグ別の商品数（unnest）", "prompt": "タグごとの商品数を集計してください。\n表示：タグ、商品数。\n並び順：商品数の多い順。同数ならタグ順。\n", "hints": ["unnest(tags) は配列を要素 1 つにつき 1 行に展開します。"], "answer": "SELECT tag, count(*) AS products\nFROM products, unnest(tags) AS tag\nGROUP BY tag\nORDER BY products DESC, tag;\n", "explanation": "unnest は配列版の「展開」で、JSONB の jsonb_array_elements に相当します。\n逆に複数行を配列にまとめるには array_agg() を使います。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["tag", "products"], "rows": [["熱銷", 381], ["特價", 303], ["團購", 203], ["環保", 142], ["限量", 109], ["新品", 100], ["獨家", 93]], "total": 7}}]}, {"id": "array-empty", "chapter": "Array", "title": "タグが 1 つもない商品", "prompt": "タグが 1 つもない（空配列の）商品は何件ですか？\n結果は 1 つの数値です。\n", "hints": ["cardinality(tags) は配列の要素数を返します。", "直接比較もできます：tags = '{}'。"], "answer": "SELECT count(*) AS products\nFROM products\nWHERE cardinality(tags) = 0;\n", "explanation": "★ array_length(tags, 1) に注意：空配列では 0 ではなく NULL を返すので、array_length(tags, 1) = 0 では 1 件も見つかりません。\ncardinality() は空配列に 0 を返すので、間違いが起きにくいです。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["products"], "rows": [[554]], "total": 1}}]}, {"id": "gs-daily-zero", "chapter": "generate_series", "title": "日ごとの注文数（注文のない日も 0 を表示）", "prompt": "2026 年 9 月の毎日について、「台東縣」（台東県）宛ての注文は何件ですか？注文のない日も 0 として表示します。\n表示：日付（date）、注文数。\n並び順：日付。\n", "hints": ["注文日で直接 GROUP BY すると、注文のない日はそもそも現れません。まず完全な日付の一覧を「生成」する必要があります。", "generate_series('2026-09-01'::date, '2026-09-30'::date, interval '1 day') は 30 行を生成します。", "そこに注文を LEFT JOIN すれば、count(o.id) は注文がないとき 0 になります。"], "answer": "SELECT d::date AS day, count(o.id) AS orders\nFROM generate_series('2026-09-01'::date, '2026-09-30'::date, interval '1 day') AS d\nLEFT JOIN orders o\n       ON o.shipping_city = '台東縣'\n      AND o.order_date >= d\n      AND o.order_date <  d + interval '1 day'\nGROUP BY d\nORDER BY d;\n", "explanation": "レポートで「0 を埋める」定番の方法：generate_series で完全な時間軸を作り、実データを LEFT JOIN します。\n都市の条件は ON に書く点に注意：WHERE に書くと注文のない日が除外されます（落とし穴問題 1 問目と同じ理屈）。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["day", "orders"], "rows": [["2026-09-01", 4], ["2026-09-02", 5], ["2026-09-03", 0], ["2026-09-04", 2], ["2026-09-05", 2], ["2026-09-06", 1], ["2026-09-07", 5], ["2026-09-08", 4], ["2026-09-09", 5], ["2026-09-10", 7]], "total": 30}}]}, {"id": "gs-monthly-signups", "chapter": "generate_series", "title": "2026 年の月別新規会員（0 を含む）", "prompt": "2026 年 1〜12 月の各月に新規登録した会員は何人ですか？登録のなかった月は 0 と表示します。\n表示：月（date、例：2026-01-01）、新規会員数。\n並び順：月。\n", "hints": ["generate_series('2026-01-01'::date, '2026-12-01'::date, interval '1 month')"], "answer": "SELECT m::date AS month, count(c.id) AS new_members\nFROM generate_series('2026-01-01'::date, '2026-12-01'::date, interval '1 month') AS m\nLEFT JOIN customers c\n       ON c.signup_date >= m\n      AND c.signup_date <  m + interval '1 month'\nGROUP BY m\nORDER BY m;\n", "explanation": "データは 2026 年 6 月までしかないので、7〜12 月はすべて 0 です。customers を直接 GROUP BY すると 6 行しか得られません。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["month", "new_members"], "rows": [["2026-01-01", 378], ["2026-02-01", 341], ["2026-03-01", 378], ["2026-04-01", 365], ["2026-05-01", 378], ["2026-06-01", 353], ["2026-07-01", 0], ["2026-08-01", 0], ["2026-09-01", 0], ["2026-10-01", 0]], "total": 12}}]}, {"id": "write-insert-returning", "chapter": "書き込み（RETURNING / UPSERT）", "title": "会員を追加してデータを受け取る（INSERT … RETURNING）", "prompt": "会員を 1 人追加します：氏名「王小明」、email「xiaoming@example.com」、登録日 2026-10-01。\nRETURNING で返す項目：氏名、email、vip_level（指定していないので、既定値が何かを確認しましょう）。\n", "hints": ["INSERT INTO customers (name, email, signup_date) VALUES (…) RETURNING …"], "answer": "INSERT INTO customers (name, email, signup_date)\nVALUES ('王小明', 'xiaoming@example.com', '2026-10-01')\nRETURNING name, email, vip_level;\n", "explanation": "RETURNING を使うと INSERT / UPDATE / DELETE が影響を受けた行をそのまま返すので、再度クエリする手間が省けます。最もよくある用途は自動採番された id を受け取ることです。\n★ この問題ではあえて id を比較しません：シーケンス（serial）はトランザクションの制御を受けず、ROLLBACK しても使った番号は戻らないため、実行のたびに id が変わります。\n本番環境の id がよく「飛ぶ」理由もこれです。面接で聞かれたらこう説明できます。\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["name", "email", "vip_level"], "rows": [["王小明", "xiaoming@example.com", "normal"]], "total": 1}}]}, {"id": "write-update-returning", "chapter": "書き込み（RETURNING / UPSERT）", "title": "飲料を 10% 値上げ（UPDATE … RETURNING）", "prompt": "「飲料」カテゴリの商品をすべて 10% 値上げし、新価格は整数に四捨五入します。\nRETURNING で返す項目：商品 id、新価格。\n並び順：問わない。\n", "hints": ["UPDATE products SET price = round(price * 1.1) WHERE … RETURNING id, price", "カテゴリはサブクエリで探せます：category_id = (SELECT id FROM categories WHERE name = '飲料')"], "answer": "UPDATE products\nSET price = round(price * 1.1)\nWHERE category_id = (SELECT id FROM categories WHERE name = '飲料')\nRETURNING id, price;\n", "explanation": "RETURNING が返すのは「更新後」の値です。PostgreSQL 18 からは RETURNING old.price, new.price と書いて新旧両方を取得できます。\nサンドボックスは複数の文を一度に実行できます。後ろに SELECT を 1 文追加すると、トランザクション内で変更済みのデータを確認できます（ただし採点は最後に返された結果で行うので、提出時は外してください）。\n", "ordered": false, "write": true, "setup": null, "result": [{"table": {"columns": ["id", "price"], "rows": [[352, 76.0], [484, 65.0], [1133, 76.0], [1142, 43.0], [1257, 76.0], [2, 21.0], [30, 65.0], [34, 76.0], [79, 43.0], [87, 76.0]], "total": 83}}]}, {"id": "write-delete-returning", "chapter": "書き込み（RETURNING / UPSERT）", "title": "保留中の注文を削除（DELETE … RETURNING）", "prompt": "ステータスが pending の注文をすべて削除します。RETURNING で返す項目：注文 id、会員 id。\n並び順：問わない。\n", "hints": ["order_items の外部キーには ON DELETE CASCADE が設定されているので、注文を削除すると明細も自動的に削除されます。"], "answer": "DELETE FROM orders\nWHERE status = 'pending'\nRETURNING id, customer_id;\n", "explanation": "DELETE … RETURNING は「データの移動」によく使われます：WITH moved AS (DELETE … RETURNING *) INSERT INTO archive SELECT * FROM moved;\n1 文で削除とアーカイブを行い、しかも同じトランザクション内で完結します。\n", "ordered": false, "write": true, "setup": null, "result": [{"table": {"columns": ["id", "customer_id"], "rows": [[78907, 17631], [78911, 18042], [78912, 18476], [78915, 17006], [78917, 15373], [78920, 11999], [78923, 15926], [78928, 15820], [78937, 1954], [78938, 16233]], "total": 329}}]}, {"id": "write-upsert-update", "chapter": "書き込み（RETURNING / UPSERT）", "title": "あれば更新、なければ追加（UPSERT）", "prompt": "2 つのカテゴリを一度に書き込みます：\n(2, '智慧型手機', 親 1)：id 2 は既に存在するので、名称を「智慧型手機」（スマートフォン）に更新\n(28, '寵物用品', 親なし)：id 28 は存在しないので、新規追加\nRETURNING で返す項目：id、name、parent_id。\n並び順：問わない。\n", "hints": ["INSERT … ON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name", "EXCLUDED は「今回挿入しようとして衝突した行」を表します。"], "answer": "INSERT INTO categories (id, name, parent_id)\nVALUES (2, '智慧型手機', 1),\n       (28, '寵物用品', NULL)\nON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name\nRETURNING id, name, parent_id;\n", "explanation": "★ UPSERT はアトミックな操作です：「存在するか確認してから INSERT か UPDATE かを決める」間に他の処理が割り込む競合状態（race condition）が起きません。\nON CONFLICT の後には UNIQUE または主キー制約のある列を指定します。JPA の save() ではこれができないので、実務ではネイティブ SQL を書くことがよくあります。\n", "ordered": false, "write": true, "setup": null, "result": [{"table": {"columns": ["id", "name", "parent_id"], "rows": [[2, "智慧型手機", 1], [28, "寵物用品", null]], "total": 2}}]}, {"id": "write-upsert-nothing", "chapter": "書き込み（RETURNING / UPSERT）", "title": "重複はスキップ（ON CONFLICT DO NOTHING）", "prompt": "会員を 2 人一度に追加します（登録日はどちらも 2026-10-01）：\n「舊會員」（既存会員）email user00001@example.com（この email は既に存在）\n「新會員」（新規会員）email new0001@example.com\nemail が重複する行はエラーにせずスキップします。RETURNING で返す項目：氏名、email。\n", "hints": ["ON CONFLICT (email) DO NOTHING"], "answer": "INSERT INTO customers (name, email, signup_date)\nVALUES ('舊會員', 'user00001@example.com', '2026-10-01'),\n       ('新會員', 'new0001@example.com', '2026-10-01')\nON CONFLICT (email) DO NOTHING\nRETURNING name, email;\n", "explanation": "DO NOTHING でスキップされた行は RETURNING に現れないので、返るのは 1 行だけです。\nデータのインポートや、重複送信されたリクエストの処理（冪等性）でよく使う書き方です。\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["name", "email"], "rows": [["新會員", "new0001@example.com"]], "total": 1}}]}, {"id": "write-update-from", "chapter": "書き込み（RETURNING / UPSERT）", "title": "返品のあるゴールド会員を降格（UPDATE … FROM）", "prompt": "「返品（returned）された注文がある」gold 会員のレベルを silver に下げます。\nRETURNING で返す項目：会員 id。\n並び順：問わない。\n", "hints": ["UPDATE customers c SET … FROM orders o WHERE o.customer_id = c.id AND …", "WHERE EXISTS (…) でも書けます。"], "answer": "UPDATE customers c\nSET vip_level = 'silver'\nFROM orders o\nWHERE o.customer_id = c.id\n  AND o.status = 'returned'\n  AND c.vip_level = 'gold'\nRETURNING c.id;\n", "explanation": "UPDATE … FROM は PostgreSQL で他のテーブルのデータを使って更新する書き方です（MySQL では UPDATE … JOIN）。\n返品が複数ある会員でも、更新されるのも返されるのも 1 回だけです。\n★ ただし SET で FROM 側テーブルの列を使い、複数の行が対応する場合、「どの行の値が使われるか」は不定です。その場合は先に集計してから更新しましょう。\n", "ordered": false, "write": true, "setup": null, "result": [{"table": {"columns": ["id"], "rows": [[13], [10], [8], [81], [30], [2], [1], [75], [455], [124]], "total": 344}}]}, {"id": "write-jsonb-merge", "chapter": "書き込み（RETURNING / UPSERT）", "title": "JSONB にフィールドを追加", "prompt": "「特價」（セール）タグがあり、仕様がある（specs が NULL でない）商品の specs に \"on_sale\": true を追加します。\nRETURNING で返す項目：商品 id、specs 内の on_sale の値（テキスト）。\n並び順：問わない。\n", "hints": ["JSONB は || で結合します：specs || '{\"on_sale\": true}'。同じキーは右側で上書きされます。", "jsonb_set(specs, '{on_sale}', 'true') でも書けます。"], "answer": "UPDATE products\nSET specs = specs || '{\"on_sale\": true}'\nWHERE '特價' = ANY(tags) AND specs IS NOT NULL\nRETURNING id, specs->>'on_sale';\n", "explanation": "★ 落とし穴：NULL || '{\"on_sale\": true}' の結果は NULL です（落とし穴問題で実演しています）。\n仕様のない商品もまとめて処理したいなら、COALESCE(specs, '{}') || '{\"on_sale\": true}' と書きます。\nキーの削除はマイナスで：specs - 'on_sale'。\n", "ordered": false, "write": true, "setup": null, "result": [{"table": {"columns": ["id", "?column?"], "rows": [[7, "true"], [10, "true"], [24, "true"], [14, "true"], [15, "true"], [26, "true"], [32, "true"], [40, "true"], [43, "true"], [50, "true"]], "total": 288}}]}], "traps": [{"id": "left-join-where", "title": "LEFT JOIN の条件は ON か WHERE か", "question": "この 2 つの SQL で数えた会員数は同じですか？", "options": ["同じ", "違う、A の方が多い", "違う、B の方が多い"], "answer": 1, "explanation": "A は条件が ON の中：条件で突き合わせ、対応しない会員もそのまま残る（注文の列は NULL で埋まる）ので、2 万人の会員が全員残ります。\nB は条件が WHERE：LEFT JOIN の後で絞り込みます。返品のない会員は o.status が NULL で、NULL = 'returned' は成立しないため、すべて除外されます。\n結果として B の LEFT JOIN は INNER JOIN と同じになってしまいます。\n覚え方：「左表を残したい」なら右表の条件は ON に、「データを絞り込みたい」ときだけ WHERE に書きます。\n", "setup": null, "scripts": [{"label": "A：条件を ON に書く", "code": "SELECT count(DISTINCT c.id) AS members\nFROM customers c\nLEFT JOIN orders o\n       ON o.customer_id = c.id\n      AND o.status = 'returned';\n"}, {"label": "B：条件を WHERE に書く", "code": "SELECT count(DISTINCT c.id) AS members\nFROM customers c\nLEFT JOIN orders o\n       ON o.customer_id = c.id\nWHERE o.status = 'returned';\n"}], "results": [[{"table": {"columns": ["members"], "rows": [[20000]], "total": 1}}], [{"table": {"columns": ["members"], "rows": [[5141]], "total": 1}}]]}, {"id": "not-in-null", "title": "NOT IN と NULL", "question": "「子カテゴリを持たない」カテゴリ（葉ノード）を探したいとき、A は何件返しますか？", "options": ["B と同じ件数", "0 件", "27 件（全カテゴリ）", "エラー"], "answer": 1, "explanation": "最上位カテゴリの parent_id は NULL なので、サブクエリの結果に NULL が含まれます。\nid NOT IN (2, 4, NULL) は id <> 2 AND id <> 4 AND id <> NULL に展開されます。\nどんな値も NULL との比較は「不明」であり true ではないので、すべての行が不成立になり、結果は 0 件。しかもエラーになりません。\n★「存在しない」ものは NOT EXISTS で探しましょう。どうしても NOT IN を使うなら、サブクエリに WHERE parent_id IS NOT NULL を付けます。\n", "setup": null, "scripts": [{"label": "A：NOT IN", "code": "SELECT id, name\nFROM categories\nWHERE id NOT IN (SELECT parent_id FROM categories);\n"}, {"label": "B：NOT EXISTS", "code": "SELECT id, name\nFROM categories c\nWHERE NOT EXISTS (\n    SELECT 1 FROM categories ch WHERE ch.parent_id = c.id\n);\n"}], "results": [[{"table": {"columns": ["id", "name"], "rows": [], "total": 0}}], [{"table": {"columns": ["id", "name"], "rows": [[20, "飲料"], [26, "健身器材"], [27, "露營用品"], [11, "收納"], [17, "休閒鞋"], [10, "寢具"], [2, "手機"], [13, "男裝"], [21, "生鮮"], [5, "無線耳機"]], "total": 19}}]]}, {"id": "count-star-left-join", "title": "LEFT JOIN 後の count(*)", "question": "会員 19999 は一度も注文したことがありません。A の count(*) はいくつになりますか？", "options": ["0", "1", "NULL"], "answer": 1, "explanation": "LEFT JOIN で注文が見つからなくても「1 行」は生成されます：会員の列には値があり、注文の列はすべて NULL です。\ncount(*) は行数を数えるので 1、count(o.id) は NULL を数えないので正しく 0 になります。\n「X ごとの Y の数、なければ 0 を表示」というレポートを作るときは必ず注意しましょう。\n", "setup": null, "scripts": [{"label": "A：count(*)", "code": "SELECT c.id, count(*) AS orders\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE c.id = 19999\nGROUP BY c.id;\n"}, {"label": "B：count(o.id)", "code": "SELECT c.id, count(o.id) AS orders\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE c.id = 19999\nGROUP BY c.id;\n"}], "results": [[{"table": {"columns": ["id", "orders"], "rows": [[19999, 1]], "total": 1}}], [{"table": {"columns": ["id", "orders"], "rows": [[19999, 0]], "total": 1}}]]}, {"id": "count-column-null", "title": "count(*) と count(列)", "question": "count(*) と count(birth_date) の結果は？", "options": ["同じ", "count(birth_date) の方が少ない", "count(birth_date) の方が多い"], "answer": 1, "explanation": "count(*) は「行数」を、count(列) はその列が NULL でない行だけを数えます。\n誕生日を入力していない（NULL の）会員がいるので、B の方が少なくなります。\nsum、avg、max、min も同様に NULL を飛ばします。\n", "setup": null, "scripts": [{"label": "A：count(*)", "code": "SELECT count(*) AS cnt FROM customers;\n"}, {"label": "B：count(birth_date)", "code": "SELECT count(birth_date) AS cnt FROM customers;\n"}], "results": [[{"table": {"columns": ["cnt"], "rows": [[20000]], "total": 1}}], [{"table": {"columns": ["cnt"], "rows": [[18859]], "total": 1}}]]}, {"id": "equals-null", "title": "= NULL", "question": "「都市を入力していない」会員を探したいとき、A は何を返しますか？", "options": ["B と同じ", "0", "エラー"], "answer": 1, "explanation": "NULL は「不明」を意味し、どんな値も NULL と =、<>、> で比較した結果は不明（true ではない）なので、WHERE を通過する行は 1 つもありません。\nNULL の判定には IS NULL / IS NOT NULL しか使えません。\n", "setup": null, "scripts": [{"label": "A：= NULL", "code": "SELECT count(*) AS members FROM customers WHERE city = NULL;\n"}, {"label": "B：IS NULL", "code": "SELECT count(*) AS members FROM customers WHERE city IS NULL;\n"}], "results": [[{"table": {"columns": ["members"], "rows": [[0]], "total": 1}}], [{"table": {"columns": ["members"], "rows": [[616]], "total": 1}}]]}, {"id": "integer-division", "title": "整数の割り算", "question": "A で計算したキャンセル率はいくつですか？", "options": ["約 0.1", "0", "約 10", "エラー"], "answer": 1, "explanation": "count(*) の型は整数（bigint）で、整数 ÷ 整数の結果も整数になり、小数は切り捨てられます：8000 / 80000 = 0。\nどちらか一方が小数なら結果も小数になります。よくある書き方は 100.0 * a / b、または a::numeric / b です。\nJava の int / int も同じ理屈です。\n", "setup": null, "scripts": [{"label": "A：整数同士の割り算", "code": "SELECT count(*) FILTER (WHERE status = 'cancelled') / count(*) AS cancel_rate\nFROM orders;\n"}, {"label": "B：先に 100.0 を掛ける", "code": "SELECT round(100.0 * count(*) FILTER (WHERE status = 'cancelled') / count(*), 2) AS cancel_pct\nFROM orders;\n"}], "results": [[{"table": {"columns": ["cancel_rate"], "rows": [[0]], "total": 1}}], [{"table": {"columns": ["cancel_pct"], "rows": [[10.14]], "total": 1}}]]}, {"id": "and-or-precedence", "title": "AND と OR の優先順位", "question": "A で見つかるのは「台北市のキャンセルまたは返品の注文」ですか？", "options": ["はい、B と同じ", "いいえ、A の方が多い", "いいえ、A の方が少ない"], "answer": 1, "explanation": "AND は OR より優先順位が高いので、A は実際には次の意味になります：\nstatus = 'cancelled' OR (status = 'returned' AND shipping_city = '台北市')\nつまり「全都市のキャンセル注文」＋「台北市の返品注文」なので、多くなります。\nOR と AND を混ぜるときは必ず括弧を付けましょう。status IN ('cancelled', 'returned') と書いてもこの問題を避けられます。\n", "setup": null, "scripts": [{"label": "A：括弧なし", "code": "SELECT count(*) AS orders\nFROM orders\nWHERE status = 'cancelled' OR status = 'returned'\n  AND shipping_city = '台北市';\n"}, {"label": "B：括弧あり", "code": "SELECT count(*) AS orders\nFROM orders\nWHERE (status = 'cancelled' OR status = 'returned')\n  AND shipping_city = '台北市';\n"}], "results": [[{"table": {"columns": ["orders"], "rows": [[9482]], "total": 1}}], [{"table": {"columns": ["orders"], "rows": [[3124]], "total": 1}}]]}, {"id": "between-timestamp", "title": "BETWEEN と日時", "question": "2026 年 1 月の注文を調べたいとき、A の件数は B と同じですか？", "options": ["同じ", "A の方が少ない", "A の方が多い"], "answer": 1, "explanation": "order_date はタイムスタンプです。'2026-01-31' は 2026-01-31 00:00:00 として扱われるので、\n1/31 の 00:00 以降の注文はすべて漏れてしまいます。\n時間の範囲は常に「>= 開始 AND < 次の期間の開始」と書きましょう。列が date でも timestamp でも間違いません。\n", "setup": null, "scripts": [{"label": "A：BETWEEN", "code": "SELECT count(*) AS orders\nFROM orders\nWHERE order_date BETWEEN '2026-01-01' AND '2026-01-31';\n"}, {"label": "B：>= と <", "code": "SELECT count(*) AS orders\nFROM orders\nWHERE order_date >= '2026-01-01' AND order_date < '2026-02-01';\n"}], "results": [[{"table": {"columns": ["orders"], "rows": [[2564]], "total": 1}}], [{"table": {"columns": ["orders"], "rows": [[2668]], "total": 1}}]]}, {"id": "jsonb-text-compare", "title": "JSONB から取り出した値はテキスト", "question": "容量が 64GB より大きいスマートフォンを探したいとき、A の件数は B と同じですか？", "options": ["同じ", "A の方が少ない", "A の方が多い"], "answer": 1, "explanation": "->> で取り出すのは text で、text の大小比較は先頭の文字から 1 文字ずつ行われます：\n'128' > '64' はまず '1' と '6' を比べ、'1' の方が小さいので false。'256'、'512' も同様に '6' に負けます。\n結果として A は 1 件も見つからず、エラーメッセージも出ません。\nJSONB 内の数値を大小比較するときは、必ず先に型変換しましょう：(specs->>'storage_gb')::int。\n", "setup": null, "scripts": [{"label": "A：->> の結果を直接比較", "code": "SELECT count(*) AS phones\nFROM products\nWHERE category_id = 2 AND specs->>'storage_gb' > '64';\n"}, {"label": "B：先に数値に変換", "code": "SELECT count(*) AS phones\nFROM products\nWHERE category_id = 2 AND (specs->>'storage_gb')::int > 64;\n"}], "results": [[{"table": {"columns": ["phones"], "rows": [[0]], "total": 1}}], [{"table": {"columns": ["phones"], "rows": [[52]], "total": 1}}]]}, {"id": "jsonb-null-concat", "title": "NULL と JSONB の結合", "question": "specs が NULL の商品があります。A がそれらに specs || '{\"on_sale\": true}' を実行した結果は？", "options": ["{\"on_sale\": true}", "NULL", "エラー"], "answer": 1, "explanation": "SQL では、NULL が関わるほとんどの演算の結果は NULL です：NULL || 何か = NULL、NULL + 1 = NULL。\nそのため UPDATE … SET specs = specs || '{…}' では、元が NULL の商品に新しいフィールドは追加されず、エラーメッセージも出ません。\n先に COALESCE(specs, '{}') で空オブジェクトにしておきましょう。\n", "setup": null, "scripts": [{"label": "A：そのまま結合", "code": "SELECT id, specs || '{\"on_sale\": true}' AS merged\nFROM products\nWHERE specs IS NULL\nORDER BY id\nLIMIT 5;\n"}, {"label": "B：先に COALESCE で空オブジェクトにする", "code": "SELECT id, COALESCE(specs, '{}') || '{\"on_sale\": true}' AS merged\nFROM products\nWHERE specs IS NULL\nORDER BY id\nLIMIT 5;\n"}], "results": [[{"table": {"columns": ["id", "merged"], "rows": [[1, null], [5, null], [25, null], [54, null], [60, null]], "total": 5}}], [{"table": {"columns": ["id", "merged"], "rows": [[1, "{\"on_sale\": true}"], [5, "{\"on_sale\": true}"], [25, "{\"on_sale\": true}"], [54, "{\"on_sale\": true}"], [60, "{\"on_sale\": true}"]], "total": 5}}]]}], "steps": [{"id": "seq-scan", "title": "インデックスのないクエリ", "goal": "perf.orders_big には 200 万件の注文があり、主キー以外のインデックスはありません。\nまず「会員 4242 の最新 5 件の注文」を探して、PostgreSQL がどう実行するかを見てみましょう。\n", "question": "結果はたった 5 件なのに、なぜ数十ミリ秒もかかるのでしょう？実行計画の Seq Scan と Rows Removed by Filter に注目してください。", "takeaway": "Seq Scan = 先頭の行から最後の行まで読むこと。インデックスがないと、データベースは 4242 の注文がどこにあるか分からないので、200 万件すべてを読んでから絞り込むしかありません。\nRows Removed by Filter は無駄に読んだ件数です。Parallel は PostgreSQL が複数の worker で並行してスキャンしたことを示しますが、全表スキャンであることに変わりはありません。\n", "setup": [], "queries": [{"label": "会員 4242 の最新 5 件の注文", "code": "EXPLAIN ANALYZE\nSELECT id, order_date, status, amount\nFROM perf.orders_big\nWHERE customer_id = 4242\nORDER BY order_date DESC\nLIMIT 5;\n"}]}, {"id": "single-index", "title": "単一列インデックスを作成", "goal": "customer_id に B-tree インデックスを作成し、同じクエリをもう一度実行して実行時間を比較します。\n", "question": "スキャン方法は何に変わりましたか？実行計画にまだ Sort はありますか？", "takeaway": "Bitmap Index Scan + Bitmap Heap Scan になります：まずインデックスで該当データの位置を探し、テーブルに戻ってその行を読みます。通常は数百倍速くなります。\nただしまだ Sort があります：インデックスは customer_id でしか並んでおらず、同じ会員の注文はインデックス内で order_date 順になっていません。\nそのため、この会員の注文をすべて読み出して並べ替えてからでないと、最新の 5 件がどれか分かりません。\nインデックスの作成自体にも時間がかかります。「作成時間」とインデックスのサイズも見てみましょう。\n", "setup": ["CREATE INDEX idx_customer ON perf.orders_big (customer_id);"], "queries": [{"label": "会員 4242 の最新 5 件の注文", "code": "EXPLAIN ANALYZE\nSELECT id, order_date, status, amount\nFROM perf.orders_big\nWHERE customer_id = 4242\nORDER BY order_date DESC\nLIMIT 5;\n"}]}, {"id": "composite-index", "title": "複合インデックスで並べ替えも不要に", "goal": "(customer_id, order_date) の複合インデックスを作成して、もう一度実行します。\n先に idx_customer を削除しておくと、どのインデックスが効いているかが分かりやすくなります。\n", "question": "Sort ノードはまだありますか？", "takeaway": "複合インデックスはまず customer_id で並び、customer_id が同じなら order_date で並びます。\n4242 を見つけた時点でデータはすでに時刻順に並んでいるので、末尾から 5 件読んで（Index Scan Backward）止まるだけ。Sort も、他の注文を読むことも不要です。\n★ インデックスを設計するときは、WHERE の等値条件を前に、ORDER BY の列を後ろに置きます。\n補足：LIMIT を外し、しかも該当データが非常に少ない（この会員は 6 件だけ）場合、オプティマイザはそれでも Bitmap Scan と並べ替えを選ぶことがあります。\n6 件の並べ替えにはほとんど時間がかからないからです。データが多いほど、または LIMIT があるほど、複合インデックスの利点ははっきりします。\n", "setup": ["DROP INDEX perf.idx_customer;", "CREATE INDEX idx_customer_date ON perf.orders_big (customer_id, order_date);"], "queries": [{"label": "会員 4242 の最新 5 件の注文", "code": "EXPLAIN ANALYZE\nSELECT id, order_date, status, amount\nFROM perf.orders_big\nWHERE customer_id = 4242\nORDER BY order_date DESC\nLIMIT 5;\n"}]}, {"id": "leftmost-prefix", "title": "列の順序が重要（最左プレフィックス）", "goal": "(customer_id, order_date) のインデックスだけがある状態で、「日付だけ」で特定の日の注文を検索します。\n", "question": "まだ idx_date を作らずにそのまま実行してください。複合インデックスには order_date があるのに、なぜ使えないのでしょう？", "takeaway": "★ 最左プレフィックスの原則：(customer_id, order_date) のインデックスは「姓、次に名」で並んだ電話帳のようなもので、名前だけでは引けません。\n検索条件に customer_id がないので、このインデックスの並びを利用できず、全表スキャンするしかありません。\nidx_date を作成してからもう一度実行すると、Index Scan か Bitmap Scan になります。\n", "setup": ["CREATE INDEX idx_date ON perf.orders_big (order_date);"], "queries": [{"label": "2026-09-01 の 1 日分の注文", "code": "EXPLAIN ANALYZE\nSELECT id, customer_id, amount\nFROM perf.orders_big\nWHERE order_date >= '2026-09-01' AND order_date < '2026-09-02';\n"}]}, {"id": "function-on-column", "title": "列に関数をかけるとインデックスが効かなくなる", "goal": "idx_date（前のステップで作成）があることを確認してください。「特定の日を検索する」2 つの書き方を比較します。\n", "question": "どちらも同じ日を検索しています。実行計画は同じですか？", "takeaway": "インデックスには order_date の元の値が保存されています。A は列を変換してから比較するので、データベースはすべての行を計算し直す必要があり、インデックスは役に立ちません（Seq Scan）。\nB は列を範囲と直接比較するので、インデックス内ですばやく位置を特定できます。しかも count(*) は件数だけ分かればよいので、テーブルすら読みません（Index Only Scan）。\n★ 原則：関数や演算は「定数の側」に置き、列を包まないこと。同様に、WHERE amount * 2 > 1000 は amount > 500 と書き換えます。\n", "setup": ["CREATE INDEX idx_date ON perf.orders_big (order_date);"], "queries": [{"label": "A：列を日付に変換してから比較", "code": "EXPLAIN ANALYZE\nSELECT count(*)\nFROM perf.orders_big\nWHERE (order_date AT TIME ZONE 'Asia/Taipei')::date = '2026-09-01';\n"}, {"label": "B：範囲で比較", "code": "EXPLAIN ANALYZE\nSELECT count(*)\nFROM perf.orders_big\nWHERE order_date >= '2026-09-01' AND order_date < '2026-09-02';\n"}]}, {"id": "low-selectivity", "title": "選択性が低すぎるとインデックスは使われない", "goal": "status にインデックスを作成します。status の値は 4 種類だけ：delivered が 82%、pending はわずか 3% です。\n", "question": "どちらのクエリにも使えるインデックスがあります。PostgreSQL は両方で使いましたか？", "takeaway": "delivered を検索すると 8 割のデータが該当し、インデックス経由で 1 件ずつテーブルを読む方がかえって遅いので、オプティマイザは全表スキャンを選びます。\npending は 3% だけなので、インデックスを使う価値があります（Bitmap Scan）。ただし 3% でも 6 万件あり、テーブルからの読み出しに時間がかかるので、前のステップほど劇的には速くなりません。\n★「インデックスがあっても使われるとは限らない」。オプティマイザは統計情報からコストを見積もり、最も速いと考える方法を選びます。選択性の低い列（性別、ステータス）だけにインデックスを作っても、たいてい効果はありません。\n", "setup": ["CREATE INDEX idx_status ON perf.orders_big (status);"], "queries": [{"label": "A：delivered を検索（82%）", "code": "EXPLAIN ANALYZE\nSELECT sum(amount)\nFROM perf.orders_big\nWHERE status = 'delivered';\n"}, {"label": "B：pending を検索（3%）", "code": "EXPLAIN ANALYZE\nSELECT sum(amount)\nFROM perf.orders_big\nWHERE status = 'pending';\n"}]}, {"id": "index-only-scan", "title": "Index Only Scan：テーブルを読む必要すらない", "goal": "(customer_id, order_date) の複合インデックスがあることを確認してください。「インデックスにある列だけを取得」と「もう 1 列多く取得」を比較します。\n", "question": "A と B のスキャン方法はどう違いますか？Heap Fetches はいくつですか？", "takeaway": "A が必要とする列はすべてインデックスにあるので、インデックスから直接読めば済みます。これが Index Only Scan で、テーブルに戻る必要がありません。\nB は amount も必要ですが、インデックスにないのでテーブルに戻って読むしかありません。\nこれが SELECT * がよくない理由の 1 つでもあります：Index Only Scan がほぼ不可能になるのです。\nPostgreSQL 11 からは INCLUDE で列をインデックスに「添付」できます：CREATE INDEX … (customer_id, order_date) INCLUDE (amount)。\n★ 最後にインデックス一覧のサイズを見てみましょう：インデックスは容量を使い、INSERT / UPDATE / DELETE のたびに同期して更新されるので、書き込みが遅くなります。すべての列にインデックスを作れないのはこのためです。\n", "setup": ["CREATE INDEX idx_customer_date ON perf.orders_big (customer_id, order_date);"], "queries": [{"label": "A：customer_id、order_date だけを取得", "code": "EXPLAIN ANALYZE\nSELECT customer_id, order_date\nFROM perf.orders_big\nWHERE customer_id BETWEEN 1000 AND 1200;\n"}, {"label": "B：amount も取得", "code": "EXPLAIN ANALYZE\nSELECT customer_id, order_date, amount\nFROM perf.orders_big\nWHERE customer_id BETWEEN 1000 AND 1200;\n"}]}, {"id": "partial-index", "title": "Partial Index：必要なデータだけにインデックスを作る", "goal": "カスタマーサポートはよく「最新の処理待ち（pending）の注文」を検索します。pending は 3% だけで、残り 97% の注文はこの条件で検索されることがありません。\n2 種類のインデックスを比較します：通常の status インデックスと、「pending の注文だけを含む」部分インデックスです。\n", "question": "まずインデックスなしで 1 回実行し、次に 2 つのインデックスをそれぞれ作成します。どちらが速いですか？2 つのインデックスのサイズはどれくらい違いますか？", "takeaway": "部分インデックス（Partial Index）は WHERE 条件に合う行だけを含みます。idx_pending は 6 万件だけで、サイズは完全なインデックスの約 10 分の 1 です。\norder_date で並んでいるので、「最新 20 件」は末尾から 20 件読むだけ（Index Scan Backward）で、並べ替えは不要です。\n★ オプティマイザがこれを使うには、クエリの WHERE がインデックスの条件（ここでは status = 'pending'）を「含意」していなければなりません。\nよくある用途：削除されていないデータだけをインデックス化（WHERE deleted_at IS NULL）、未処理のジョブだけをインデックス化（WHERE done = false）。\n", "setup": ["CREATE INDEX idx_status ON perf.orders_big (status);", "CREATE INDEX idx_pending ON perf.orders_big (order_date) WHERE status = 'pending';"], "queries": [{"label": "最新 20 件の pending 注文", "code": "EXPLAIN ANALYZE\nSELECT id, customer_id, order_date\nFROM perf.orders_big\nWHERE status = 'pending'\nORDER BY order_date DESC\nLIMIT 20;\n"}]}, {"id": "expression-index", "title": "Expression Index：演算結果にインデックスを作る", "goal": "ステップ 5 で「列を関数で包むとインデックスが効かなくなる」と説明しました。しかしクエリを書き換えられない場合（例えばアプリでこの形に固定されている）、別の手があります：\n「関数の結果」に直接インデックスを作るのです。\n", "question": "式インデックスの作成前後で、実行計画はどう変わりますか？", "takeaway": "式インデックス（Expression Index）は演算後の値を保存し、クエリが「まったく同じ」式を書けば使われます。\n最も典型的な例は大文字小文字を区別しない email 検索です：CREATE INDEX ON users (lower(email)) と WHERE lower(email) = lower(?) の組み合わせ。\n★ 式には IMMUTABLE（入力が同じなら結果は常に同じ）な関数しか使えません。now() やタイムゾーン設定に依存する変換は使えないので、\nここでは AT TIME ZONE 'Asia/Taipei' を明示しています。\n", "setup": ["CREATE INDEX idx_order_day ON perf.orders_big (((order_date AT TIME ZONE 'Asia/Taipei')::date));"], "queries": [{"label": "「台湾の日付」で特定の日を検索", "code": "EXPLAIN ANALYZE\nSELECT count(*)\nFROM perf.orders_big\nWHERE (order_date AT TIME ZONE 'Asia/Taipei')::date = '2026-09-01';\n"}]}, {"id": "brin-index", "title": "BRIN：非常に小さいインデックス、ただし前提あり", "goal": "perf.order_events は時刻順に書き込まれたイベント記録（ログのようなもの）で、ディスク上の順序が event_time と一致しています。\n一方 perf.orders_big の order_date はランダムな順序で書き込まれています。両方のテーブルに BRIN インデックスを作り、効果を比較します。\n", "question": "両方のテーブルに BRIN インデックスがあります。A と B は両方ともそれを使いましたか？さらに B-tree を作ってサイズを比べてみましょう。", "takeaway": "BRIN（Block Range Index）は 1 行ずつ記録せず、「ディスクブロックの範囲ごとの最小値と最大値」だけを記録するので、驚くほど小さくなります（数十 KB。B-tree なら数十 MB）。\norder_events は時刻順に書き込まれているので、各ブロック範囲の時刻の幅が狭く、特定の日を検索しても数個の範囲を読むだけで済みます（Heap Blocks: lossy の行）。\norders_big はランダムな順序なので、どのブロック範囲も数年分にまたがり、BRIN ではどのブロックも除外できません。オプティマイザはそれを使わず、全表スキャンします。\n★ BRIN は「追記のみで、時刻と相関がある」大きなテーブルに向いています：ログ、IoT センサーデータ、取引記録。TimescaleDB もこの性質を大いに活用しています。\n", "setup": ["CREATE INDEX idx_events_brin ON perf.order_events USING brin (event_time);", "CREATE INDEX idx_orders_brin ON perf.orders_big USING brin (order_date);", "CREATE INDEX idx_events_btree ON perf.order_events (event_time);"], "queries": [{"label": "A：order_events の特定の日", "code": "EXPLAIN ANALYZE\nSELECT count(*)\nFROM perf.order_events\nWHERE event_time >= '2026-01-01' AND event_time < '2026-01-02';\n"}, {"label": "B：orders_big の特定の日", "code": "EXPLAIN ANALYZE\nSELECT count(*)\nFROM perf.orders_big\nWHERE order_date >= '2026-01-01' AND order_date < '2026-01-02';\n"}]}, {"id": "gin-jsonb", "title": "GIN：JSONB にインデックスを作る", "goal": "order_events.meta は JSONB で、例えば {\"channel\": \"app\", \"device\": \"ios\", \"coupon\": \"VIP2026\"} です。\nVIP2026 クーポンを使ったイベントは約 1000 分の 1 だけです。GIN インデックス作成前後で、2 つのクエリの書き方の違いを比較します。\n", "question": "GIN インデックスを作成した後、A と B は両方とも速くなりましたか？", "takeaway": "GIN（Generalized Inverted Index）は「転置インデックス」です：JSON 内の各キーと値、配列の各要素を分解し、それらがどの行に現れるかを記録します。\n@>、?、?|、?& の演算子に対応しているので、A は Bitmap Index Scan になります。B の ->> と = は対象外なので、全表スキャンのままです。\n★ GIN を使うには @> と書きます。特定のキーがよく検索されるなら、そのキーだけに B-tree の式インデックスを作ることもできます：CREATE INDEX ON … ((meta->>'coupon'))。\ntext[] 配列の @>、&& も GIN を使います。全文検索や pg_trgm のあいまい検索も GIN の応用です（Elasticsearch の核心も転置インデックスです）。\n", "setup": ["CREATE INDEX idx_events_meta ON perf.order_events USING gin (meta);"], "queries": [{"label": "A：@> で包含", "code": "EXPLAIN ANALYZE\nSELECT count(*)\nFROM perf.order_events\nWHERE meta @> '{\"coupon\": \"VIP2026\"}';\n"}, {"label": "B：->> で値を取り出して比較", "code": "EXPLAIN ANALYZE\nSELECT count(*)\nFROM perf.order_events\nWHERE meta->>'coupon' = 'VIP2026';\n"}]}]}, {"id": "redis", "name": "Redis", "lang": "redis", "labName": null, "labNote": null, "hasResults": true, "exercises": [{"id": "str-get", "chapter": "String", "title": "注文総数を読み出す", "prompt": "注文総数は stats:orders:total という String に保存されています。それを読み出してください。\n", "hints": ["GET key"], "answer": "GET stats:orders:total\n", "explanation": "String は Redis の最も基本的な型で、値にはテキスト、数値、シリアライズした JSON を入れられます。最大 512 MB です。\nRedis のキーはコロンで階層化するのが慣例です：オブジェクト種別:id:フィールド。例：stats:orders:total、product:540。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GET stats:orders:total", "text": "\"80000\"", "error": false}]}, {"id": "str-incr", "chapter": "String", "title": "カウンタを 1 増やす（INCR）", "prompt": "新しい注文が 1 件入りました。stats:orders:total に 1 を足し、足した後の値を取得してください。\nコマンド 1 つで行います。\n", "hints": ["INCR key は数値に 1 を足し、新しい値を返します。"], "answer": "INCR stats:orders:total\n", "explanation": "★ INCR はアトミックな操作です：1000 件のリクエストが同時に加算しても、結果は必ず正しくなります。\nGET → プログラムで +1 → SET と書くと、2 つのリクエストが同じ値を同時に読み、最終的に 1 しか増えないことがあります（実験室の「在庫の引き当て」で実演しています）。\n関連コマンド：INCRBY key 10、DECR、INCRBYFLOAT。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "INCR stats:orders:total", "text": "(integer) 80001", "error": false}]}, {"id": "str-session", "chapter": "String", "title": "30 分後に期限切れになるセッションを作る", "prompt": "ユーザーがログインしました。値が customer:42 の session:zz9 を作成し、30 分後に自動で期限切れになるようにします。\nコマンド 1 つで行います（SET と EXPIRE の 2 つに分けないこと）。\n", "hints": ["SET key value EX 秒数"], "answer": "SET session:zz9 customer:42 EX 1800\n", "explanation": "SET の EX（秒）/ PX（ミリ秒）オプションを使うと、書き込みと同時に有効期限を設定でき、しかも 1 つのアトミックな操作になります。\nSET + EXPIRE の 2 つのコマンドに分けると、途中でプログラムが落ちたときに、永遠に期限切れにならないキーが残ってしまいます。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "SET session:zz9 customer:42 EX 1800", "text": "\"OK\"", "error": false}], "checks": [{"cmd": "GET session:zz9", "text": "\"customer:42\"", "error": false}, {"cmd": "TTL session:zz9", "text": "(integer) 1800", "error": false}]}, {"id": "str-lock", "chapter": "String", "title": "ロックの取得（SET NX）", "prompt": "注文 1 のロック lock:order:1 は現在 worker-b が保持しています（問題側で設定済み、30 秒後に期限切れ）。\n今度は worker-a もこのロックを取りたい：キーが存在しないときだけ worker-a を書き込み、10 秒後に期限切れにします。\n注意：worker-b の既存のロックに影響を与えてはいけません。\n", "hints": ["SET key value NX EX 秒数：NX = キーが存在しないときだけ書き込む。", "ロックを取れなかったときは nil が返ります。"], "answer": "SET lock:order:1 worker-a NX EX 10\n", "explanation": "★ 分散ロックの基本形：SET key token NX EX/PX。\nよくある間違いは SETNX の後に EXPIRE を書くことです：SETNX が失敗しても、続く EXPIRE が worker-b のロックの有効期限を 10 秒に変えてしまい、他人のロックに手を出すことになります。\n（SETNX + EXPIRE で一度提出して、採点結果を見てみましょう。）\nロックの解放にも落とし穴があります：いきなり DEL してはいけません。まず値がまだ自分の token かを確認する必要があります（実験室で実演しています）。\n", "ordered": true, "write": true, "setup": "SET lock:order:1 worker-b EX 30\n", "result": [{"cmd": "SET lock:order:1 worker-a NX EX 10", "text": "(nil)", "error": false}], "checks": [{"cmd": "GET lock:order:1", "text": "\"worker-b\"", "error": false}, {"cmd": "TTL lock:order:1", "text": "(integer) 30", "error": false}]}, {"id": "hash-getall", "chapter": "Hash", "title": "商品 540 のすべてのフィールド", "prompt": "商品データは Hash として product:{id} に保存されています。product:540 のすべてのフィールドと値を読み出してください。\n", "hints": ["HGETALL key"], "answer": "HGETALL product:540\n", "explanation": "HGETALL は「フィールド、値、フィールド、値…」が交互に並んだ配列を返します。\n★ フィールドが非常に多い Hash（数万個）に HGETALL を使うと Redis がブロックされます。HSCAN で分割して読むか、必要なフィールドだけを読みましょう。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "HGETALL product:540", "text": "1) \"name\"\n2) \"Sony 手機 I447\"\n3) \"price\"\n4) \"29949.00\"\n5) \"stock\"\n6) \"11\"\n7) \"category\"\n8) \"手機\"", "error": false}]}, {"id": "hash-hmget", "chapter": "Hash", "title": "必要なフィールドだけを読む", "prompt": "会員 1 の氏名（name）と都市（city）だけが必要です。コマンド 1 つでこの 2 つのフィールドを読み出してください。\n", "hints": ["HMGET key field1 field2"], "answer": "HMGET customer:1 name city\n", "explanation": "HMGET は指定したフィールドの順に値を返し、存在しないフィールドの位置は nil になります。\nオブジェクトのキャッシュに JSON の String 丸ごとではなく Hash を使う利点：一部のフィールドだけを読んだり変更したりできます。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "HMGET customer:1 name city", "text": "1) \"葉承文\"\n2) \"台中市\"", "error": false}]}, {"id": "hash-hincrby", "chapter": "Hash", "title": "在庫を減らす（HINCRBY）", "prompt": "商品 540 が 2 個売れました。stock フィールドから 2 を引き、新しい在庫数を返してください。\n", "hints": ["HINCRBY key field 増分。増分は負の数でも構いません。"], "answer": "HINCRBY product:540 stock -2\n", "explanation": "HINCRBY は INCR と同じくアトミックな操作で、カウンタ系のフィールド（在庫、いいね数、閲覧数）に向いています。\nただし「マイナスになる」ことはチェックしません。「在庫が足りるときだけ減らす」には Lua スクリプトか WATCH が必要です（実験室の在庫の引き当てで実演しています）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "HINCRBY product:540 stock -2", "text": "(integer) 9", "error": false}], "checks": [{"cmd": "HGET product:540 stock", "text": "\"9\"", "error": false}]}, {"id": "hash-hset-new-field", "chapter": "Hash", "title": "新しいフィールドを追加", "prompt": "会員 1 に phone フィールドを追加します。値は 0912345678 です。\n", "hints": ["HSET key field value。返り値は「追加されたフィールドの数」です。"], "answer": "HSET customer:1 phone 0912345678\n", "explanation": "HSET は新しく追加されたフィールドの数を返します。フィールドが既に存在し、値を更新しただけなら 0 が返ります。\nRedis 7.4 からは個別のフィールドに有効期限を設定できます：HEXPIRE key 秒数 FIELDS 1 field。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "HSET customer:1 phone 0912345678", "text": "(integer) 1", "error": false}], "checks": [{"cmd": "HGET customer:1 phone", "text": "\"0912345678\"", "error": false}, {"cmd": "HLEN customer:1", "text": "(integer) 4", "error": false}]}, {"id": "list-lrange", "chapter": "List", "title": "最新 3 件の注文", "prompt": "customer:1:recent_orders は会員 1 の最近の注文 id で、インデックス 0 が最新です。\n最新の 3 件を読み出してください。\n", "hints": ["LRANGE key start stop。stop は範囲に含まれます。"], "answer": "LRANGE customer:1:recent_orders 0 2\n", "explanation": "★ LRANGE の stop は「含む」：0 2 で 3 件です（Java の subList は含みません）。\n-1 は最後の要素を意味するので、LRANGE key 0 -1 はすべてになります。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "LRANGE customer:1:recent_orders 0 2", "text": "1) \"77621\"\n2) \"75279\"\n3) \"72474\"", "error": false}]}, {"id": "list-push-trim", "chapter": "List", "title": "新しい注文を先頭に、10 件だけ残す", "prompt": "会員 1 が注文 90001 をしたところです。それを customer:1:recent_orders の先頭に入れ、\nList 全体で最新の 10 件だけを残してください。\n", "hints": ["LPUSH は左側（先頭）から入れます。", "LTRIM key 0 9 でインデックス 0〜9 だけを残します。"], "answer": "LPUSH customer:1:recent_orders 90001\nLTRIM customer:1:recent_orders 0 9\n", "explanation": "LPUSH + LTRIM は「固定長の最新リスト」の定番の書き方です：最新のアクティビティ、最近見た商品、最新 N 件のログ。\n2 つのコマンドを一緒に成功させたいなら、MULTI / EXEC で包むか、パイプラインで一度に送ります。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "LPUSH customer:1:recent_orders 90001", "text": "(integer) 11", "error": false}, {"cmd": "LTRIM customer:1:recent_orders 0 9", "text": "\"OK\"", "error": false}], "checks": [{"cmd": "LLEN customer:1:recent_orders", "text": "(integer) 10", "error": false}, {"cmd": "LRANGE customer:1:recent_orders 0 -1", "text": " 1) \"90001\"\n 2) \"77621\"\n 3) \"75279\"\n 4) \"72474\"\n 5) \"71990\"\n 6) \"69841\"\n 7) \"68384\"\n 8) \"67888\"\n 9) \"67758\"\n10) \"67315\"", "error": false}]}, {"id": "set-scard", "chapter": "Set", "title": "セール商品は何件か", "prompt": "tag:特價 は「特價」（セール）タグの付いた商品 id を入れた Set です。何件ありますか？\n", "hints": ["SCARD key は Set の要素数を返します。"], "answer": "SCARD tag:特價\n", "explanation": "SCARD は O(1) です。Set 全体を読み出してから数える必要はありません。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "SCARD tag:特價", "text": "(integer) 303", "error": false}]}, {"id": "set-sinter", "chapter": "Set", "title": "人気かつ限定（SINTER）", "prompt": "「熱銷」（人気）と「限量」（限定）の両方のタグが付いた商品 id はどれですか？\n", "hints": ["SINTER key1 key2 で積集合を取ります。"], "answer": "SINTER tag:熱銷 tag:限量\n", "explanation": "Set には順序がないので、この問題では順序を比較しません。SINTER は積集合、SUNION は和集合、SDIFF は差集合です。\n件数だけが必要なら SINTERCARD 2 key1 key2 を使えば、結果を送り返す必要がありません。\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "SINTER tag:熱銷 tag:限量", "text": " 1) \"77\"\n 2) \"84\"\n 3) \"100\"\n 4) \"112\"\n 5) \"116\"\n 6) \"215\"\n 7) \"251\"\n 8) \"270\"\n 9) \"472\"\n10) \"488\"\n11) \"588\"\n12) \"681\"\n13) \"696\"\n14) \"705\"\n15) \"980\"\n16) \"1007\"\n17) \"1014\"\n18) \"1038\"\n19) \"1190\"\n20) \"1445\"\n21) \"1457\"", "error": false}]}, {"id": "set-sismember", "chapter": "Set", "title": "商品 540 は人気商品か", "prompt": "商品 540 に「熱銷」（人気）タグがあるかを判定してください。\n", "hints": ["SISMEMBER key member：あれ お店」はこうして検索しています。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "GEOSEARCH store:locations FROMMEMBER 台北市 BYRADIUS 60 km ASC", "text": "1) \"台北市\"\n2) \"新北市\"\n3) \"基隆市\"\n4) \"桃園市\"\n5) \"宜蘭縣\"\n6) \"新竹縣\"", "error": false}]}, {"id": "multi-exec", "chapter": "トランザクション", "title": "2 つの処理を一緒に行う（MULTI / EXEC）", "prompt": "会員 1 が注文 90001 をしました。トランザクションを使って、次の 2 つを一緒に実行してください：\n1. stats:orders:total に 1 を足す\n2. 90001 を customer:1:recent_orders の先頭に入れる\n", "hints": ["MULTI でトランザクションを開始すると、続くコマンドはキューに入り（QUEUED が返る）、EXEC のときにまとめて実行されます。"], "answer": "MULTI\nINCR stats:orders:total\nLPUSH customer:1:recent_orders 90001\nEXEC\n", "explanation": "★ Redis のトランザクションは「途中に他のクライアントのコマンドが割り込まない」ことは保証しますが、オール・オア・ナッシングは保証しません：\nEXEC のときにある文が失敗しても、他の文はそのまま反映され、ROLLBACK はありません（落とし穴問題で実演しています）。\n「条件が成り立つときだけ実行」したいなら WATCH（楽観的ロック）か Lua スクリプトを使います。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MULTI", "text": "\"OK\"", "error": false}, {"cmd": "INCR stats:orders:total", "text": "\"QUEUED\"", "error": false}, {"cmd": "LPUSH customer:1:recent_orders 90001", "text": "\"QUEUED\"", "error": false}, {"cmd": "EXEC", "text": "1) (integer) 80001\n2) (integer) 11", "error": false}], "checks": [{"cmd": "GET stats:orders:total", "text": "\"80001\"", "error": false}, {"cmd": "LINDEX customer:1:recent_orders 0", "text": "\"90001\"", "error": false}]}], "traps": [{"id": "multi-no-rollback", "title": "トランザクションが失敗すると ROLLBACK される？", "question": "A のトランザクションでは HSET の文が失敗します（a は Hash ではなく String）。EXEC の後、a はいくつですか？", "options": ["1：トランザクション全体が元に戻る", "2：他のコマンドはそのまま反映される", "EXEC 全体が拒否され、何も実行されない"], "answer": 1, "explanation": "★ Redis のトランザクションには ROLLBACK がありません。2 つのケースがあります：\nA：コマンドの形式は正しく、実行時にエラーになる（例：型が違う）：その文だけが失敗し、他の文はそのまま反映されるので、a = 2、b = 3。\nB：キューに入れる時点で構文エラーが見つかる：EXEC は EXECABORT を返し、トランザクション全体が実行されず、a は 1 のままです。\n公式の理由は「実行時のエラーはプログラムの誤りであり、開発中に見つけるべき」というものです。オール・オア・ナッシングが必要なら Lua スクリプトを使います。\n", "setup": "SET a 1\n", "scripts": [{"label": "A：実行時にエラー（型の誤り）", "code": "MULTI\nSET a 2\nHSET a field value\nSET b 3\nEXEC\nGET a\nGET b\n"}, {"label": "B：キューに入れる時点でエラー（構文エラー）", "code": "MULTI\nSET a 2\nSET\nSET b 3\nEXEC\nGET a\nGET b\n"}], "results": [[{"cmd": "MULTI", "text": "\"OK\"", "error": false}, {"cmd": "SET a 2", "text": "\"QUEUED\"", "error": false}, {"cmd": "HSET a field value", "text": "\"QUEUED\"", "error": false}, {"cmd": "SET b 3", "text": "\"QUEUED\"", "error": false}, {"cmd": "EXEC", "text": "1) \"OK\"\n2) (error) WRONGTYPE Operation against a key holding the wrong kind of value\n3) \"OK\"", "error": false}, {"cmd": "GET a", "text": "\"2\"", "error": false}, {"cmd": "GET b", "text": "\"3\"", "error": false}], [{"cmd": "MULTI", "text": "\"OK\"", "error": false}, {"cmd": "SET a 2", "text": "\"QUEUED\"", "error": false}, {"cmd": "SET", "text": "(error) ERR wrong number of arguments for 'set' command", "error": true}, {"cmd": "SET b 3", "text": "\"QUEUED\"", "error": false}, {"cmd": "EXEC", "text": "(error) EXECABORT Transaction discarded because of previous errors.", "error": true}, {"cmd": "GET a", "text": "\"1\"", "error": false}, {"cmd": "GET b", "text": "(nil)", "error": false}]]}, {"id": "set-drops-ttl", "title": "SET は有効期限を消してしまう", "question": "A はまず 100 秒後に期限切れになるキーを SET し、もう一度新しい値を SET します。最終的な TTL はいくつですか？", "options": ["約 100", "-1（有効期限なし）", "-2（キーが存在しない）"], "answer": 1, "explanation": "★ SET はキー全体を上書きし、元の有効期限も一緒に消してしまいます。キャッシュの更新でとてもはまりやすい点です：\n30 分後に期限切れになるはずのキャッシュが、1 回の「SET 新しい値」で永遠に期限切れにならなくなり、最終的にメモリを使い果たします。\n更新時は EX を付け直すか、KEEPTTL（Redis 6.0+）で元の有効期限を保持します。\nINCR、HSET、LPUSH のような「変更」コマンドは TTL に影響しません。値全体を上書きする SET、GETSET だけが影響します。\n", "setup": null, "scripts": [{"label": "A：そのままもう一度 SET", "code": "SET k v1 EX 100\nSET k v2\nTTL k\n"}, {"label": "B：KEEPTTL を付ける", "code": "SET k v1 EX 100\nSET k v2 KEEPTTL\nTTL k\n"}], "results": [[{"cmd": "SET k v1 EX 100", "text": "\"OK\"", "error": false}, {"cmd": "SET k v2", "text": "\"OK\"", "error": false}, {"cmd": "TTL k", "text": "(integer) -1", "error": false}], [{"cmd": "SET k v1 EX 100", "text": "\"OK\"", "error": false}, {"cmd": "SET k v2 KEEPTTL", "text": "\"OK\"", "error": false}, {"cmd": "TTL k", "text": "(integer) 100", "error": false}]]}, {"id": "ttl-codes", "title": "TTL の -1 と -2", "question": "「存在しない」キーに TTL を実行すると何が返りますか？", "options": ["-1", "-2", "0", "nil"], "answer": 1, "explanation": "-2：キーが存在しない（または期限切れで削除済み）。\n-1：キーは存在するが、有効期限がない。\n正の数：残り秒数。PTTL はミリ秒版で、ルールは同じです。\n", "setup": null, "scripts": [{"label": "A：存在しないキー", "code": "TTL no-such-key\n"}, {"label": "B：存在するが有効期限が設定されていない", "code": "SET k v\nTTL k\n"}], "results": [[{"cmd": "TTL no-such-key", "text": "(integer) -2", "error": false}], [{"cmd": "SET k v", "text": "\"OK\"", "error": false}, {"cmd": "TTL k", "text": "(integer) -1", "error": false}]]}, {"id": "list-range-inclusive", "title": "LRANGE の終端は含まれる", "question": "List に 12 個の要素があります。LRANGE list 0 10 は何個返しますか？", "options": ["10", "11", "12"], "answer": 1, "explanation": "LRANGE、ZRANGE、GETRANGE の終端はすべて「含まれる」ので、0 10 は 11 個です。\nJava の subList(0, 10) や Python の list[0:10]（終端を含まない）とはちょうど逆で、ページングで 1 つずれやすいポイントです。\n-1 は最後の要素を表すので、0 -1 はすべてになります。\n", "setup": "RPUSH list a b c d e f g h i j k l\n", "scripts": [{"label": "A：LRANGE list 0 10", "code": "LRANGE list 0 10\n"}, {"label": "B：LRANGE list 0 -1", "code": "LRANGE list 0 -1\n"}], "results": [[{"cmd": "LRANGE list 0 10", "text": " 1) \"a\"\n 2) \"b\"\n 3) \"c\"\n 4) \"d\"\n 5) \"e\"\n 6) \"f\"\n 7) \"g\"\n 8) \"h\"\n 9) \"i\"\n10) \"j\"\n11) \"k\"", "error": false}], [{"cmd": "LRANGE list 0 -1", "text": " 1) \"a\"\n 2) \"b\"\n 3) \"c\"\n 4) \"d\"\n 5) \"e\"\n 6) \"f\"\n 7) \"g\"\n 8) \"h\"\n 9) \"i\"\n10) \"j\"\n11) \"k\"\n12) \"l\"", "error": false}]]}, {"id": "zset-tie-order", "title": "同点のときの並び順", "question": "alice、bob、carol はいずれも 100 点です。A は高い順（REV）に並べます。同点の 3 人の順序は？", "options": ["追加した順：alice、bob、carol", "名前の逆順：carol、bob、alice", "実行のたびに変わる"], "answer": 1, "explanation": "Sorted Set は同点のとき member の辞書順に並びます。REV を付けると全体が逆になるので、carol、bob、alice になります。\nランキングで「同点なら先に到達した人を上位にしたい」場合、よくあるのは時刻をスコアに組み込む方法です：スコア = ポイント × 10^10 + (大きな数 − タイムスタンプ)。\n", "setup": "ZADD board 100 alice 100 bob 100 carol 90 dave\n", "scripts": [{"label": "A：高い順（REV）", "code": "ZRANGE board 0 -1 REV WITHSCORES\n"}, {"label": "B：低い順", "code": "ZRANGE board 0 -1 WITHSCORES\n"}], "results": [[{"cmd": "ZRANGE board 0 -1 REV WITHSCORES", "text": "1) \"carol\"\n2) \"100\"\n3) \"bob\"\n4) \"100\"\n5) \"alice\"\n6) \"100\"\n7) \"dave\"\n8) \"90\"", "error": false}], [{"cmd": "ZRANGE board 0 -1 WITHSCORES", "text": "1) \"dave\"\n2) \"90\"\n3) \"alice\"\n4) \"100\"\n5) \"bob\"\n6) \"100\"\n7) \"carol\"\n8) \"100\"", "error": false}]]}, {"id": "get-wrong-type", "title": "型に合わないコマンドで読む", "question": "product:540 は Hash です。これに GET を実行すると何が返りますか？", "options": ["nil", "WRONGTYPE エラー", "Hash 全体の内容"], "answer": 1, "explanation": "すべてのキーには決まった型があり、型に合わないコマンドを使うと WRONGTYPE エラーになります。分からないときはまず TYPE key で確認しましょう。\nJava で最もよくあるケース：同じキーを opsForValue() と opsForHash() の両方で操作してしまうことです。\n", "setup": null, "scripts": [{"label": "A：GET", "code": "GET product:540\nTYPE product:540\n"}, {"label": "B：HGETALL", "code": "HGETALL product:540\n"}], "results": [[{"cmd": "GET product:540", "text": "(error) WRONGTYPE Operation against a key holding the wrong kind of value", "error": true}, {"cmd": "TYPE product:540", "text": "\"hash\"", "error": false}], [{"cmd": "HGETALL product:540", "text": "1) \"name\"\n2) \"Sony 手機 I447\"\n3) \"price\"\n4) \"29949.00\"\n5) \"stock\"\n6) \"11\"\n7) \"category\"\n8) \"手機\"", "error": false}]]}, {"id": "hll-is-estimate", "title": "HyperLogLog は推定値", "question": "HyperLogLog で 9 月の 30 日分を合わせて「9 月のユニーク注文者数」を推定します。Bitmap で求めた正確な値と同じですか？", "options": ["完全に同じ", "とても近いが、少し誤差がある", "大きくずれる"], "answer": 1, "explanation": "HyperLogLog は確率的アルゴリズムで、標準誤差は約 0.81% です。データが少ないときはちょうど一致することも多く、量が増えるほど誤差が見えてきます。\nその代わりメモリは一定です：1 千人を数えても 1 億人を数えても、1 つの HyperLogLog は最大 12 KB です。\nBitmap は正確ですが、サイズは「最大の id」に比例します：id が 1 億まであれば 12 MB 必要です。\n面接でよく聞かれる「毎日の U -09-02 active:2026-09-03 active:2026-09-04 active:2026-09-05 active:2026-09-06 active:2026-09-07 active:2026-09-08 active:2026-09-09 active:2026-09-10 active:2026-09-11 active:2026-09-12 active:2026-09-13 active:2026-09-14 active:2026-09-15 active:2026-09-16 active:2026-09-17 active:2026-09-18 active:2026-09-19 active:2026-09-20 active:2026-09-21 active:2026-09-22 active:2026-09-23 active:2026-09-24 active:2026-09-25 active:2026-09-26 active:2026-09-27 active:2026-09-28 active:2026-09-29 active:2026-09-30", "text": "(integer) 2375", "error": false}, {"cmd": "BITCOUNT active:2026-09", "text": "(integer) 2660", "error": false}, {"cmd": "MEMORY USAGE active:2026-09", "text": "(integer) 2616", "error": false}]]}, {"id": "keys-vs-scan", "title": "KEYS と SCAN", "question": "A と B はどちらも product:99 で始まるキーを探しています。B の SCAN は 1 回で該当するキーをすべて返しますか？", "options": ["はい、KEYS と同じ結果", "とは限らない。返されたカーソルで続けてスキャンし、カーソルが 0 に戻るまで繰り返す", "エラーになる"], "answer": 1, "explanation": "★ KEYS はすべてのキー（ここでは約 4 万個）を一度にスキャンします。Redis はコマンドをシングルスレッドで実行するので、KEYS の実行中は他のリクエストがすべて待たされます。\n本番環境でキーが数百万個あると、KEYS 1 回でサービスが数秒止まることがあるため、ショーケースの learner アカウントでは KEYS をまったく使えません。\nSCAN は毎回少しずつだけ見ます（COUNT は「だいたい何個見るか」であって、返す件数ではありません）。返り値は [次のカーソル, この回で該当したキー] です。\nこの回に該当するキーが 1 つもないこともあるので、カーソルが 0 に戻るまで新しいカーソルで呼び続けて、ようやくスキャン完了です。\nSCAN は重複したキーを返すことがあるので、プログラム側で重複を除く必要があります。\n", "setup": null, "scripts": [{"label": "A：KEYS（データベース全体をスキャン）", "code": "KEYS product:99*\nDBSIZE\n"}, {"label": "B：SCAN（カーソル 0 から、1 回に約 100 個）", "code": "SCAN 0 MATCH product:99* COUNT 100\n"}], "results": [[{"cmd": "KEYS product:99*", "text": " 1) \"product:999\"\n 2) \"product:993\"\n 3) \"product:996\"\n 4) \"product:997\"\n 5) \"product:998\"\n 6) \"product:99\"\n 7) \"product:994\"\n 8) \"product:990\"\n 9) \"product:995\"\n10) \"product:992\"\n11) \"product:991\"", "error": false}, {"cmd": "DBSIZE", "text": "(integer) 39964", "error": false}], [{"cmd": "SCAN 0 MATCH product:99* COUNT 100", "text": "1) \"28928\"\n2) (empty array)", "error": false}]]}], "steps": []}, {"id": "mongodb", "name": "MongoDB", "lang": "mongo", "labName": "インデックス実験", "labNote": "対象は shop.orders（8 万件の注文）。各ステップでまずインデックスなしの explain(\"executionStats\") を見て、推奨インデックスを作成して再実行し、COLLSCAN / IXSCAN、docsExamined、SORT を比較します。", "hasResults": true, "exercises": [{"id": "find-pending", "chapter": "クエリの基本", "title": "処理待ちの注文", "prompt": "ステータス（status）が pending の注文を探し、_id、customerId、total だけを表示してください。\n_id の昇順で、先頭 5 件を取ります。\n", "hints": ["db.orders.find(フィルタ, 射影)：射影は { customerId: 1, total: 1 } と書きます。_id は既定で表示されます。", "続けて .sort({ _id: 1 }).limit(5) をつなげます"], "answer": "db.orders.find({ status: \"pending\" }, { customerId: 1, total: 1 }).sort({ _id: 1 }).limit(5)\n", "explanation": "find の第 2 引数は「射影」（projection）で、どのフィールドを返すかを決めます。SQL の SELECT の列指定に相当します。\n1 は含める、0 は除外。_id は既定で返されるので、不要なら _id: 0 と書きます。_id 以外では、同じ射影の中で 1 と 0 を混在できません。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.find({ status: \"pending\" }, { customerId: 1, total: 1 }).sort({ _id: 1 }).limit(5)", "text": "// 全 5 件（先頭 3 件のみ表示）\n{\n  _id: 78907,\n  customerId: 17631,\n  total: 38\n}\n{\n  _id: 78911,\n  customerId: 18042,\n  total: 4317\n}\n{\n  _id: 78912,\n  customerId: 18476,\n  total: 38580\n}"}]}, {"id": "count-gold", "chapter": "クエリの基本", "title": "ゴールド会員は何人か", "prompt": "vipLevel が gold の会員は何人ですか？\n", "hints": ["db.customers.countDocuments(フィルタ)"], "answer": "db.customers.countDocuments({ vipLevel: \"gold\" })\n", "explanation": "countDocuments は条件に従って実際に数えます。estimatedDocumentCount() は条件を付けられませんが、コレクションの統計情報を直接読むので非常に高速です。\n古い count() は現在推奨されていません。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.customers.countDocuments({ vipLevel: \"gold\" })", "text": "891"}]}, {"id": "distinct-city", "chapter": "クエリの基本", "title": "配送先の都市一覧", "prompt": "全注文に登場する配送先都市（shipping.city）を重複なしで一覧にしてください。\n", "hints": ["db.orders.distinct(\"フィールド\")。埋め込みフィールドはドット記法で：\"shipping.city\""], "answer": "db.orders.distinct(\"shipping.city\")\n", "explanation": "埋め込みドキュメントのフィールドには「ドット記法」でアクセスします：shipping.city。find の条件、射影、ソートでも同じです。引用符を忘れずに。\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "db.orders.distinct(\"shipping.city\")", "text": "// 全 15 件（先頭 3 件のみ表示）\n'台中市'\n'台北市'\n'台南市'"}]}, {"id": "find-nested-projection", "chapter": "クエリの基本", "title": "商品のカテゴリパス", "prompt": "商品 540 の名称（name）とカテゴリパス（category.path）を調べてください。_id は表示しません。\n", "hints": ["findOne({ _id: 540 }, { _id: 0, name: 1, \"category.path\": 1 })"], "answer": "db.products.findOne({ _id: 540 }, { _id: 0, name: 1, \"category.path\": 1 })\n", "explanation": "商品ドキュメントにはカテゴリ名と完全なパスが直接保存されている（非正規化）ので、categories を検索し直す必要はありません。\n代償として、カテゴリ名が変わったときはすべての商品も更新する必要があります（updateMany）。読み取りが多く書き込みが少ないデータに向いた方法です。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.findOne({ _id: 540 }, { _id: 0, name: 1, \"category.path\": 1 })", "text": "{\n  name: 'Sony 手機 I447',\n  category: {\n    path: [ '3C電子', '手機' ]\n  }\n}"}]}, {"id": "price-range", "chapter": "クエリ演算子", "title": "価格 1000〜2000 の商品数", "prompt": "価格（price）が 1000 から 2000 まで（1000 と 2000 を含む）の商品は何件ですか？\n", "hints": ["{ price: { $gte: 1000, $lte: 2000 } }"], "answer": "db.products.countDocuments({ price: { $gte: 1000, $lte: 2000 } })\n", "explanation": "比較演算子：$eq、$ne、$gt、$gte、$lt、$lte、$in、$nin。同じフィールドの複数の条件を同じオブジェクトに書くと AND になります。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.products.countDocuments({ price: { $gte: 1000, $lte: 2000 } })", "text": "349"}]}, {"id": "status-in", "chapter": "クエリ演算子", "title": "キャンセルまたは返品の注文数", "prompt": "ステータスが cancelled または returned の注文は何件ですか？\n", "hints": ["{ status: { $in: [\"cancelled\", \"returned\"] } }"], "answer": "db.orders.countDocuments({ status: { $in: [\"cancelled\", \"returned\"] } })\n", "explanation": "同じフィールドを複数の値と比較するなら、$or より $in の方が簡潔で、インデックスも使われやすくなります。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "db.orders.countDocuments({ status: { $in: [\"can
