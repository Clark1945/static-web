を新しい順に。\n", "hints": ["(:Customer)-[:PLACED]->(:Order)", "並べ替えは ORDER BY o.orderDate DESC。"], "answer": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order)\nRETURN o.id, o.total\nORDER BY o.orderDate DESC\n", "explanation": "ORDER BY では RETURN していないプロパティでも並べ替えられます。orderDate はタイムゾーン付きの datetime で、比較も並べ替えも実際の時点に基づきます。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order)\nRETURN o.id, o.total\nORDER BY o.orderDate DESC", "table": {"columns": ["o.id", "o.total"], "rows": [[59901, 3098], [42762, 7517], [39226, 36391], [16901, 4596], [15943, 1647], [6116, 4784]], "total": 6}}]}, {"id": "order-items", "chapter": "基本の MATCH", "title": "リレーションシップのプロパティ", "prompt": "注文 77621 ではどの商品を買いましたか？商品名と数量（qty）を返してください。順序は問いません。\n", "hints": ["数量は商品ノードではなく、CONTAINS リレーションシップにあります：-[r:CONTAINS]->"], "answer": "MATCH (:Order {id: 77621})-[r:CONTAINS]->(p:Product)\nRETURN p.name, r.qty\n", "explanation": "リレーションシップにもプロパティを持たせられます。注文明細の数量・単価・割引は「この注文とこの商品の間」のことを表すので、リレーションシップに置きます。\nリレーショナルデータベースの中間テーブル（order_items）に相当します。\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Order {id: 77621})-[r:CONTAINS]->(p:Product)\nRETURN p.name, r.qty", "table": {"columns": ["p.name", "r.qty"], "rows": [["UNIQLO 男裝 P863", 1]], "total": 1}}]}, {"id": "gold-in-taipei", "chapter": "基本の MATCH", "title": "条件の組み合わせ", "prompt": "台北市に住んでいて、会員レベルが gold の会員は何人ですか？1 つの数値を返します。\n", "hints": ["会員の条件はノードに、都市は別のノードに書き、2 つを LIVES_IN でつなぎます。"], "answer": "MATCH (c:Customer {vipLevel: 'gold'})-[:LIVES_IN]->(:City {name: '台北市'})\nRETURN count(c)\n", "explanation": "パターン内の {プロパティ: 値} は WHERE の等号条件と同じです。より複雑な条件（範囲、OR、文字列の比較）は WHERE に書きます。\n同等の書き方：MATCH (c:Customer)-[:LIVES_IN]->(city:City) WHERE c.vipLevel = 'gold' AND city.name = '台北市'。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (c:Customer {vipLevel: 'gold'})-[:LIVES_IN]->(:City {name: '台北市'})\nRETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[196]], "total": 1}}]}, {"id": "followers", "chapter": "方向と集約", "title": "フォロワー数（逆方向）", "prompt": "会員 4242 をフォローしている会員は何人ですか？1 つの数値を返します。\n", "hints": ["(a)-[:FOLLOWS]->(b) は a が b をフォローしているという意味です。4242 をフォローしている人を探すなら、矢印は 4242 を向きます。"], "answer": "MATCH (:Customer {id: 4242})<-[:FOLLOWS]-(fan:Customer)\nRETURN count(fan)\n", "explanation": "リレーションシップには必ず方向があり、クエリでは ->、<- を指定するか、方向を書かない（-）こともできます。方向を書かないと両方向とも数えます。\nフォローは方向のあるリレーションシップです：4242 は 6 人をフォローしていますが、4242 をフォローしているのは 4 人だけです。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Customer {id: 4242})<-[:FOLLOWS]-(fan:Customer)\nRETURN count(fan)", "table": {"columns": ["count(fan)"], "rows": [[4]], "total": 1}}]}, {"id": "top-followed", "chapter": "方向と集約", "title": "フォロワーが最も多い会員", "prompt": "フォロワーが最も多い 5 人の会員：会員 id、氏名、フォロワー数をフォロワー数の多い順に返します。\n", "hints": ["Cypher には GROUP BY がありません：RETURN の中で集約関数でない列が、グループ化の基準になります。"], "answer": "MATCH (c:Customer)<-[:FOLLOWS]-(fan:Customer)\nRETURN c.id, c.name, count(fan) AS followers\nORDER BY followers DESC\nLIMIT 5\n", "explanation": "RETURN c.id, c.name, count(fan) のグループ化の基準は c.id、c.name です（暗黙の GROUP BY）。\n会員 1 には 895 人のフォロワーがいる「スーパーノード」（supernode）です：そこから始まる走査は非常に多くのリレーションシップを通るので、グラフデータベースの設計で注意すべき点です。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (c:Customer)<-[:FOLLOWS]-(fan:Customer)\nRETURN c.id, c.name, count(fan) AS followers\nORDER BY followers DESC\nLIMIT 5", "table": {"columns": ["c.id", "c.name", "followers"], "rows": [[1, "葉承文", 895], [2, "廖品玲", 248], [3, "楊書君", 138], [4, "高書文", 114], [5, "蔡承翰", 107]], "total": 5}}]}, {"id": "brand-products", "chapter": "方向と集約", "title": "ブランド別の商品数", "prompt": "商品数が最も多い 5 つのブランド：ブランド名と商品数を商品数の多い順に、同数ならブランド名順に返します。\n", "hints": ["(:Product)-[:MADE_BY]->(:Brand)"], "answer": "MATCH (b:Brand)<-[:MADE_BY]-(p:Product)\nRETURN b.name, count(p) AS products\nORDER BY products DESC, b.name\nLIMIT 5\n", "explanation": "同数のときのために 2 つ目の並べ替え列を加えると、結果が一定になります。ORDER BY products DESC だけだと、同数の順序は保証されません。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (b:Brand)<-[:MADE_BY]-(p:Product)\nRETURN b.name, count(p) AS products\nORDER BY products DESC, b.name\nLIMIT 5", "table": {"columns": ["b.name", "products"], "rows": [["IKEA", 69], ["Sony", 59], ["宜得利", 54], ["Adidas", 51], ["Decathlon", 51]], "total": 5}}]}, {"id": "city-revenue", "chapter": "方向と集約", "title": "都市別売上", "prompt": "2026 年（台湾時間）の配送済み（status = 'delivered'）の注文について、配送先都市ごとに total を合計し、\n売上上位 3 都市の都市名と売上を返します。\n", "hints": ["(:Order)-[:SHIPPED_TO]->(:City)", "datetime('2026-01-01T00:00:00+08:00') で比較用の時点を作れます。"], "answer": "MATCH (o:Order {status: 'delivered'})-[:SHIPPED_TO]->(city:City)\nWHERE o.orderDate >= datetime('2026-01-01T00:00:00+08:00')\nRETURN city.name, sum(o.total) AS revenue\nORDER BY revenue DESC\nLIMIT 3\n", "explanation": "datetime() はタイムゾーン付きの時点を作ります。date('2026-01-01') と date(o.orderDate) で日付を比較することもできます。\nこのような「テーブル全体の集計」レポートは、実はグラフデータベースの得意分野ではなく（すべての注文をたどる必要がある）、リレーショナルデータベースでも同じようにうまくできます。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (o:Order {status: 'delivered'})-[:SHIPPED_TO]->(city:City)\nWHERE o.orderDate >= datetime('2026-01-01T00:00:00+08:00')\nRETURN city.name, sum(o.total) AS revenue\nORDER BY revenue DESC\nLIMIT 3", "table": {"columns": ["city.name", "revenue"], "rows": [["台北市", 63759988], ["新北市", 34266319], ["台中市", 27197265]], "total": 3}}]}, {"id": "no-orders", "chapter": "方向と集約", "title": "一度も注文していない会員", "prompt": "一度も注文したことがない会員は何人ですか？1 つの数値を返します。\n", "hints": ["WHERE NOT (c)-[:PLACED]->() は「そのようなリレーションシップが存在しない」という意味です。"], "answer": "MATCH (c:Customer)\nWHERE NOT (c)-[:PLACED]->()\nRETURN count(c)\n", "explanation": "パターンはそのまま条件として使えます：(c)-[:PLACED]->() が存在すれば true です。Cypher 5 では WHERE NOT EXISTS { (c)-[:PLACED]->() } とも書けます。\nSQL と比べると：LEFT JOIN … WHERE o.id IS NULL、または NOT EXISTS サブクエリです。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (c:Customer)\nWHERE NOT (c)-[:PLACED]->()\nRETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[1629]], "total": 1}}]}, {"id": "collect-names", "chapter": "方向と集約", "title": "リストにまとめる", "prompt": "会員 4242 がフォローしている人の氏名を、会員 id の昇順で「1 つのリスト」にまとめて返してください（1 行 1 列だけ）。\n", "hints": ["collect() は複数の行を 1 つの list にまとめます。", "先に並べ替えてからまとめます：MATCH … WITH f ORDER BY f.id RETURN collect(f.name)"], "answer": "MATCH (:Customer {id: 4242})-[:FOLLOWS]->(f:Customer)\nWITH f ORDER BY f.id\nRETURN collect(f.name)\n", "explanation": "WITH はクエリの途中の RETURN のようなもので、結果を次の部分に渡し、そこで並べ替え・絞り込み・集約ができます。\ncollect() がまとめる順序はデータが流れてきた順序なので、WITH で先に並べておく必要があります。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Customer {id: 4242})-[:FOLLOWS]->(f:Customer)\nWITH f ORDER BY f.id\nRETURN collect(f.name)", "table": {"columns": ["collect(f.name)"], "rows": [["['邱柏婷', '曾柏樺', '鄭冠廷', '許建萱', '林建廷', '廖宜文']"]], "total": 1}}]}, {"id": "friends-of-friends", "chapter": "パスと走査", "title": "友達の友達", "prompt": "会員 224 がフォローしている人が「さらにフォローしている人」のうち、224 自身と 224 が既にフォローしている人を除くと、異なる会員は何人ですか？\n", "hints": ["(me)-[:FOLLOWS]->()-[:FOLLOWS]->(fof)", "同じ人が何人もの友達からフォローされていることがあるので、count(DISTINCT fof) を使います。", "224 と相互フォローしている人がいると、224 自身も結果に現れます。"], "answer": "MATCH (me:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof:Customer)\nWHERE fof <> me AND NOT (me)-[:FOLLOWS]->(fof)\nRETURN count(DISTINCT fof)\n", "explanation": "これは「知り合いかも」の基本的な作り方で、条件の 1 つ 1 つが答えを変えます：\nDISTINCT なしだと 44（2 人の友達経由で同じ人にたどり着くと 2 回数える）、DISTINCT ありで 42、自分を除くと 41、さらに既にフォローしている人を除くと 40。\nリレーショナルデータベースでは follows テーブルを自分自身と 2 回 JOIN する必要がありますが、グラフデータベースでは 2 歩たどるだけです。歩数が多いほど差がはっきりします（実験室で比較しています）。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (me:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof:Customer)\nWHERE fof <> me AND NOT (me)-[:FOLLOWS]->(fof)\nRETURN count(DISTINCT fof)", "table": {"columns": ["count(DISTINCT fof)"], "rows": [[40]], "total": 1}}]}, {"id": "reach-in-three", "chapter": "パスと走査", "title": "3 歩以内", "prompt": "フォローの方向に沿って、会員 4242 が 1〜3 歩以内でたどり着ける異なる会員は何人ですか（4242 自身は除く）？\n", "hints": ["可変長リレーションシップ：-[:FOLLOWS*1..3]->"], "answer": "MATCH (me:Customer {id: 4242})-[:FOLLOWS*1..3]->(x:Customer)\nWHERE x <> me\nRETURN count(DISTINCT x)\n", "explanation": "*1..3 は 1〜3 本のリレーションシップを意味します。上限は必ず指定しましょう：上限のない * は、大きなグラフでは数百万本のパスをたどることがあります。\n同じ人に複数のパスでたどり着けることがあるので、DISTINCT が必要です。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (me:Customer {id: 4242})-[:FOLLOWS*1..3]->(x:Customer)\nWHERE x <> me\nRETURN count(DISTINCT x)", "table": {"columns": ["count(DISTINCT x)"], "rows": [[122]], "total": 1}}]}, {"id": "shortest-path", "chapter": "パスと走査", "title": "最短経路", "prompt": "フォローの方向に沿って、会員 4242 から会員 1 まで最少で何歩かかりますか？1 つの数値を返します。\n", "hints": ["shortestPath((a)-[:FOLLOWS*..10]->(b)) で最短経路を 1 本見つけます。length(p) はパスのリレーションシップの数です。"], "answer": "MATCH p = shortestPath((:Customer {id: 4242})-[:FOLLOWS*..10]->(:Customer {id: 1}))\nRETURN length(p)\n", "explanation": "shortestPath は双方向の幅優先探索を使い、見つかった時点で止まり、すべてのパスを列挙することはありません。allShortestPaths は同じ長さの最短パスをすべて返します。\nこれが「6 次の隔たり」です：ソーシャルネットワークでは、ほとんどの人の間は数歩しか離れていません。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH p = shortestPath((:Customer {id: 4242})-[:FOLLOWS*..10]->(:Customer {id: 1}))\nRETURN length(p)", "table": {"columns": ["length(p)"], "rows": [[4]], "total": 1}}]}, {"id": "category-tree", "chapter": "パスと走査", "title": "カテゴリのサブツリー全体", "prompt": "「3C電子」（家電・デジタル製品）配下のすべてのカテゴリ（子カテゴリ、子カテゴリの子カテゴリ…。3C電子 自身は除く）のカテゴリ名を返します。順序は問いません。\n", "hints": ["(:Category)-[:SUBCATEGORY_OF]->(:Category) は子カテゴリから親カテゴリへ向かいます。", "何階層あるか分からないときは *1..（または妥当な上限）を使います。"], "answer": "MATCH (c:Category)-[:SUBCATEGORY_OF*1..]->(:Category {name: '3C電子'})\nRETURN c.name\n", "explanation": "PostgreSQL と比べると：ツリー全体を検索するには WITH RECURSIVE が必要です。グラフデータベースでは、可変長リレーションシップがそのまま再帰になります。\nカテゴリツリーは小さい（27 ノード）ので上限なしでも問題ありませんが、ソーシャルな関係のような大きなグラフでは必ず上限を指定します。\n", "ordered": false, "write": false, "setup": null, "result": [{"cmd": "MATCH (c:Category)-[:SUBCATEGORY_OF*1..]->(:Category {name: '3C電子'})\nRETURN c.name", "table": {"columns": ["c.name"], "rows": [["手機"], ["筆電"], ["耳機"], ["無線耳機"], ["有線耳機"], ["手機配件"]], "total": 6}}]}, {"id": "path-nodes", "chapter": "パスと走査", "title": "パス上のノード", "prompt": "商品 540 が属するカテゴリから、最上位カテゴリまでの「完全なパス」：\n商品が属するカテゴリ名、親カテゴリ名…最上位まで、順に並んだリストを 1 つ返します。\n", "hints": ["MATCH p = (:Product {id: 540})-[:IN_CATEGORY]->(:Category)-[:SUBCATEGORY_OF*0..]->(top:Category)", "最上位カテゴリにはさらに上への SUBCATEGORY_OF がありません：WHERE NOT (top)-[:SUBCATEGORY_OF]->()", "nodes(p) でパス上のノードを取り出します。[n IN リスト WHERE … | n.name] はリスト内包表記です。"], "answer": "MATCH p = (:Product {id: 540})-[:IN_CATEGORY]->(:Category)-[:SUBCATEGORY_OF*0..]->(top:Category)\nWHERE NOT (top)-[:SUBCATEGORY_OF]->()\nRETURN [n IN nodes(p) WHERE n:Category | n.name]\n", "explanation": "*0.. は 0 歩を許します（商品が最上位カテゴリに直接属している場合も見つかります）。nodes(p)、relationships(p) でパス上のノードとリレーションシップを取り出します。\nリスト内包表記 [x IN list WHERE 条件 | 式] は、プログラミング言語の filter + map に似ています。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH p = (:Product {id: 540})-[:IN_CATEGORY]->(:Category)-[:SUBCATEGORY_OF*0..]->(top:Category)\nWHERE NOT (top)-[:SUBCATEGORY_OF]->()\nRETURN [n IN nodes(p) WHERE n:Category | n.name]", "table": {"columns": ["[n IN nodes(p) WHERE n:Category | n.name]"], "rows": [["['手機', '3C電子']"]], "total": 1}}]}, {"id": "also-bought", "chapter": "レコメンド", "title": "この商品を買った人はこんな商品も買っています", "prompt": "商品 540 を買った会員は、他にどの商品を買いましたか？（同じ注文で一緒に買ったものも含む）\n商品名と「買った会員数」（同じ会員は 1 回だけ数える）を返し、会員数の多い順、同数なら商品名順で上位 5 件を取ります。\n", "hints": ["まず 540 を買った会員を探します：MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)", "次にこれらの会員が買ったすべての商品を探します：MATCH (c)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product)", "★ なぜ 2 つの MATCH に分けるのか？1 本の長いパスで書くと、同じリレーションシップは 2 回たどられないので、2 つの PLACED は別々の注文でなければならなくなります。"], "answer": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)\nMATCH (c)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product)\nWHERE other.id <> 540\nRETURN other.name, count(DISTINCT c) AS buyers\nORDER BY buyers DESC, other.name\nLIMIT 5\n", "explanation": "これは協調フィルタリング（collaborative filtering）の最も単純な形です：商品 → 買った人 → その人たちが買った他の商品。\n★「同じ MATCH パターン」の中では、同じリレーションシップは 2 回たどられません（relationship isomorphism）。\n1 本のパス (:Product)<-[:CONTAINS]-(:Order)<-[:PLACED]-(c)-[:PLACED]->(:Order)-[:CONTAINS]->(other) として書くと、\n2 つの PLACED は別のリレーションシップ、つまり別の注文でなければならず、「同じ注文で一緒に買った」会員が漏れてしまいます（アベンヌの商品は 16 人から 14 人になります）。\n2 つの MATCH に分ければ、一意性はそれぞれのパターン内でしかチェックされないので、漏れません。SQL なら order_items、orders、orders、order_items、products の 5 つのテーブルを JOIN する必要があります。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)\nMATCH (c)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product)\nWHERE other.id <> 540\nRETURN other.name, count(DISTINCT c) AS buyers\nORDER BY buyers DESC, other.name\nLIMIT 5", "table": {"columns": ["other.name", "buyers"], "rows": [["雅漾 保養 C693", 16], ["Samsung 手機 I187", 8], ["Sony 手機 D738", 8], ["Adidas 運動鞋 U237", 7], ["Nike 運動鞋 W498", 7]], "total": 5}}]}, {"id": "friends-bought", "chapter": "レコメンド", "title": "友達は買ったが、自分はまだ買っていない", "prompt": "会員 4242 がフォローしている人が買っていて、4242 自身はまだ買っていない商品。\n商品 id と「買った友達の人数」を返し、人数の多い順、同数なら商品 id の昇順で上位 5 件を取ります。\n", "hints": ["まず友達が買った商品を探し、WHERE NOT (me)-[:PLACED]->(:Order)-[:CONTAINS]->(p) で自分が買ったものを除きます。"], "answer": "MATCH (me:Customer {id: 4242})-[:FOLLOWS]->(f:Customer)-[:PLACED]->(:Order)-[:CONTAINS]->(p:Product)\nWHERE NOT (me)-[:PLACED]->(:Order)-[:CONTAINS]->(p)\nRETURN p.id, count(DISTINCT f) AS friends\nORDER BY friends DESC, p.id\nLIMIT 5\n", "explanation": "ソーシャルレコメンド：「関係」（フォロー）と「行動」（購入）の 2 種類のデータを組み合わせる、まさにグラフデータベースが最も得意とするクエリです。\nWHERE NOT (パターン) は候補の商品ごとに 1 回チェックし、4242 自身の注文だけをたどるので高速です。\n", "ordered": true, "write": false, "setup": null, "result": [{"cmd": "MATCH (me:Customer {id: 4242})-[:FOLLOWS]->(f:Customer)-[:PLACED]->(:Order)-[:CONTAINS]->(p:Product)\nWHERE NOT (me)-[:PLACED]->(:Order)-[:CONTAINS]->(p)\nRETURN p.id, count(DISTINCT f) AS friends\nORDER BY friends DESC, p.id\nLIMIT 5", "table": {"columns": ["p.id", "friends"], "rows": [[173, 2], [1306, 2], [3, 1], [4, 1], [6, 1]], "total": 5}}]}, {"id": "create-customer", "chapter": "書き込み", "title": "ノードとリレーションシップの作成", "prompt": "会員を 1 人追加します：id 99999、name '測試會員'、vipLevel 'normal'。\nさらに既存の「台北市」に住むようにします（LIVES_IN リレーションシップを作成）。\n", "hints": ["先に MATCH で都市を見つけてから、会員とリレーションシップを CREATE します：MATCH (city:City {name: '台北市'}) CREATE (c:Customer {…})-[:LIVES_IN]->(city)"], "answer": "MATCH (city:City {name: '台北市'})\nCREATE (:Customer {id: 99999, name: '測試會員', vipLevel: 'normal'})-[:LIVES_IN]->(city)\n", "explanation": "CREATE (c)-[:LIVES_IN]->(city) のとき、city は前の MATCH で見つけた既存のノードです。\nCREATE (:Customer {…})-[:LIVES_IN]->(:City {name: '台北市'}) と書くと、新しい「台北市」ノードがもう 1 つ作られてしまいます（ここでは一意制約があるので、そのままエラーになります）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MATCH (city:City {name: '台北市'})\nCREATE (:Customer {id: 99999, name: '測試會員', vipLevel: 'normal'})-[:LIVES_IN]->(city)", "text": "作成したノード 1、作成したリレーションシップ 1、設定したプロパティ 3、追加したラベル 1"}], "checks": [{"cmd": "MATCH (c:Customer {id: 99999})-[:LIVES_IN]->(city:City) RETURN c.name, c.vipLevel, city.name", "table": {"columns": ["c.name", "c.vipLevel", "city.name"], "rows": [["測試會員", "normal", "台北市"]], "total": 1}}, {"cmd": "MATCH (city:City {name: '台北市'}) RETURN count(city)", "table": {"columns": ["count(city)"], "rows": [[1]], "total": 1}}]}, {"id": "merge-follow", "chapter": "書き込み", "title": "重複なしでリレーションシップを作る（MERGE）", "prompt": "会員 4242 に会員 15084 と会員 1 をフォローさせます。\n4242 は実は既に 15084 をフォローしているので、重複したリレーションシップが増えてはいけません。\n", "hints": ["MERGE はまず探し、見つからないときだけ作成します。", "両端のノードを先に MATCH してから、リレーションシップを MERGE します：MATCH (a …), (b …) MERGE (a)-[:FOLLOWS]->(b)"], "answer": "MATCH (me:Customer {id: 4242}), (other:Customer)\nWHERE other.id IN [15084, 1]\nMERGE (me)-[:FOLLOWS]->(other)\n", "explanation": "MERGE = 「あればそれを使い、なければ作る」。CREATE を使うと 4242 と 15084 の間にもう 1 本 FOLLOWS ができてしまい（リレーションシップには一意制約がない）、\n以後フォロワー数を数えるときに重複して数えてしまいます。\n★ MERGE では必ず両端を先に MATCH し、リレーションシップだけを MERGE しましょう。パターン全体を直接 MERGE した結果は落とし穴問題で実演しています。\n実行すると「cartesian product」というサーバーの通知が表示されます：つながっていない 2 つのパターン (me), (other) はすべての組み合わせを生成しますが、\nここでは 1 × 2 = 2 通りだけで、まさに欲しいものなので無視して構いません。組み合わせ数が大きいときだけ注意が必要です（落とし穴問題で実演しています）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MATCH (me:Customer {id: 4242}), (other:Customer)\nWHERE other.id IN [15084, 1]\nMERGE (me)-[:FOLLOWS]->(other)", "text": "作成したリレーションシップ 1", "warn": ["This query builds a cartesian product between disconnected patterns.：If a part of a query contains multiple disconnected patterns, this will build a cartesian product between all those parts. This may produce a large amount of data and slow down query processing. While occasionally intended, it may often be possible to reformulate the query that avoids the use of this cross product, perhaps by adding a relationship between the different parts or by using OPTIONAL MATCH (identifier is: (other))"]}], "checks": [{"cmd": "MATCH (:Customer {id: 4242})-[r:FOLLOWS]->(other:Customer) WHERE other.id IN [15084, 1]\nRETURN other.id, count(r) ORDER BY other.id", "table": {"columns": ["other.id", "count(r)"], "rows": [[1, 1], [15084, 1]], "total": 2}}]}, {"id": "set-props", "chapter": "書き込み", "title": "プロパティとリストの変更", "prompt": "商品 540 が売り切れました：stock を 0 にし、tags リストに '缺貨'（在庫切れ）を追加します（既存のタグは残します）。\n", "hints": ["SET p.プロパティ = 値。リストは + で連結できます：p.tags + '缺貨'"], "answer": "MATCH (p:Product {id: 540})\nSET p.stock = 0, p.tags = p.tags + '缺貨'\n", "explanation": "list + 要素 はリストの末尾に要素を 1 つ追加します。SET p.tags = ['缺貨'] だとリスト全体が置き換えられます。\nSET p += {stock: 0} は複数のプロパティを一度に更新し、他のプロパティは残します。SET p = {…} はすべてのプロパティを置き換えます（注意）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MATCH (p:Product {id: 540})\nSET p.stock = 0, p.tags = p.tags + '缺貨'", "text": "設定したプロパティ 2"}], "checks": [{"cmd": "MATCH (p:Product {id: 540}) RETURN p.stock, p.tags", "table": {"columns": ["p.stock", "p.tags"], "rows": [[0, "['特價', '缺貨']"]], "total": 1}}]}, {"id": "merge-on-create", "chapter": "書き込み", "title": "MERGE の ON CREATE / ON MATCH", "prompt": "会員のログインを記録します：会員 4242 と会員 99999 についてそれぞれ「ログイン」を 1 回実行します：\n会員が既に存在すれば lastLogin = date('2026-10-07') を設定し、存在しなければ会員を作成して name を '新會員'（新規会員）に、lastLogin も同じ日に設定します。\n", "hints": ["MERGE (c:Customer {id: …}) ON CREATE SET … ON MATCH SET …", "2 人の会員は UNWIND [4242, 99999] AS id で一度に処理できます。"], "answer": "UNWIND [4242, 99999] AS id\nMERGE (c:Customer {id: id})\nON CREATE SET c.name = '新會員', c.lastLogin = date('2026-10-07')\nON MATCH SET c.lastLogin = date('2026-10-07')\n", "explanation": "ON CREATE SET はこの MERGE が新しいノードを作成したときだけ、ON MATCH SET は既存のノードを見つけたときだけ実行されるので、\n4242 の氏名が「新會員」に変わることはありません。UNWIND はリストを複数の行に展開し、バッチ書き込みによく使います（データの読み込みもこの方法です）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "UNWIND [4242, 99999] AS id\nMERGE (c:Customer {id: id})\nON CREATE SET c.name = '新會員', c.lastLogin = date('2026-10-07')\nON MATCH SET c.lastLogin = date('2026-10-07')", "text": "作成したノード 1、設定したプロパティ 4、追加したラベル 1"}], "checks": [{"cmd": "MATCH (c:Customer) WHERE c.id IN [4242, 99999] RETURN c.id, c.name, c.lastLogin ORDER BY c.id", "table": {"columns": ["c.id", "c.name", "c.lastLogin"], "rows": [[4242, "蘇建恩", "2026-10-07"], [99999, "新會員", "2026-10-07"]], "total": 2}}]}, {"id": "unfollow", "chapter": "書き込み", "title": "リレーションシップの削除", "prompt": "会員 4242 が会員 15084 のフォローを解除します（このリレーションシップだけを削除し、2 人の会員は残します）。\n", "hints": ["リレーションシップに変数を付けてから DELETE します：MATCH (…)-[r:FOLLOWS]->(…) DELETE r"], "answer": "MATCH (:Customer {id: 4242})-[r:FOLLOWS]->(:Customer {id: 15084})\nDELETE r\n", "explanation": "DELETE はノードもリレーションシップも削除できます。ノードを削除する前には、そのすべてのリレーションシップを先に削除するか、DETACH DELETE で一緒に削除する必要があります（次の問題）。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MATCH (:Customer {id: 4242})-[r:FOLLOWS]->(:Customer {id: 15084})\nDELETE r", "text": "削除したリレーションシップ 1"}], "checks": [{"cmd": "MATCH (:Customer {id: 4242})-[:FOLLOWS]->(f:Customer) RETURN f.id ORDER BY f.id", "table": {"columns": ["f.id"], "rows": [[4428], [4477], [5514], [6339], [12218]], "total": 5}}, {"cmd": "MATCH (c:Customer) WHERE c.id IN [4242, 15084] RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[2]], "total": 1}}]}, {"id": "detach-delete", "chapter": "書き込み", "title": "ノードの削除（DETACH DELETE）", "prompt": "データの整理：「一度も注文したことがない」会員をすべて削除します。\nこれらの会員にはまだ、フォロー、フォロワー、住んでいる都市のリレーションシップがあるかもしれません。\n", "hints": ["リレーションシップを持つノードは直接 DELETE できません。", "DETACH DELETE はノードのすべてのリレーションシップを先に削除してから、ノードを削除します。"], "answer": "MATCH (c:Customer)\nWHERE NOT (c)-[:PLACED]->()\nDETACH DELETE c\n", "explanation": "DETACH DELETE は 1,629 人の会員と、そのすべてのリレーションシップ（フォロー、フォロワー、LIVES_IN）を一度に削除します。\nDELETE c とだけ書くと、トランザクション内では成功したように見えますが、それらの会員のリレーションシップは残っています（3 つ目の確認クエリの LIVES_IN の数が減っていません）。\ncommit 時に Neo4j は「宙に浮いたリレーションシップ」を許さないのでエラーで拒否します。ショーケースは常に ROLLBACK するので、確認クエリでこの違いを捉えています。\n", "ordered": true, "write": true, "setup": null, "result": [{"cmd": "MATCH (c:Customer)\nWHERE NOT (c)-[:PLACED]->()\nDETACH DELETE c", "text": "削除したノード 1629、削除したリレーションシップ 13032"}], "checks": [{"cmd": "MATCH (c:Customer) RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[18371]], "total": 1}}, {"cmd": "MATCH (c:Customer) WHERE NOT (c)-[:PLACED]->() RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[0]], "total": 1}}, {"cmd": "MATCH ()-[r:LIVES_IN]->(:City) RETURN count(r)", "table": {"columns": ["count(r)"], "rows": [[17805]], "total": 1}}]}], "traps": [{"id": "merge-whole-pattern", "title": "パターン全体を MERGE する", "question": "A と B の 2 つのノードは既に存在しますが、間にリレーションシップはありません。MERGE (a:Person {name: 'A'})-[:KNOWS]->(b:Person {name: 'B'}) を直接実行した後、Person ノードは全部で何個ですか？", "options": ["2 個：MERGE は既存の A と B を使う", "4 個：パターン全体が見つからないので、パターン全体（2 つのノードを含む）をまとめて作成する", "エラー：A と B は既に存在する"], "answer": 1, "explanation": "MERGE は「パターン全体」がすべて見つかるか、すべて作成されるかのどちらかです。A と B は存在しますが、A-[:KNOWS]->B という完全なパターンは存在しないので、\nMERGE は 2 つのノードとリレーションシップをすべて新しく作成し、A と B が 1 つずつ増えてしまいます。\n正しい書き方：両端のノードを先に MATCH（またはそれぞれ MERGE）してから、リレーションシップを MERGE します。一意制約があれば A はそのままエラーになり、かえって気づきやすくなります。\n", "setup": null, "scripts": [{"label": "A：パターン全体を直接 MERGE", "code": "CREATE (:Person {name: 'A'}), (:Person {name: 'B'});\nMERGE (a:Person {name: 'A'})-[:KNOWS]->(b:Person {name: 'B'});\nMATCH (p:Person) RETURN p.name, count(*) AS nodes ORDER BY p.name\n"}, {"label": "B：両端を先に MATCH してから、リレーションシップを MERGE", "code": "CREATE (:Person {name: 'A'}), (:Person {name: 'B'});\nMATCH (a:Person {name: 'A'}), (b:Person {name: 'B'})\nMERGE (a)-[:KNOWS]->(b);\nMATCH (p:Person) RETURN p.name, count(*) AS nodes ORDER BY p.name\n"}], "results": [[{"cmd": "CREATE (:Person {name: 'A'}), (:Person {name: 'B'})", "text": "作成したノード 2、設定したプロパティ 2、追加したラベル 2"}, {"cmd": "MERGE (a:Person {name: 'A'})-[:KNOWS]->(b:Person {name: 'B'})", "text": "作成したノード 2、作成したリレーションシップ 1、設定したプロパティ 2、追加したラベル 2"}, {"cmd": "MATCH (p:Person) RETURN p.name, count(*) AS nodes ORDER BY p.name", "table": {"columns": ["p.name", "nodes"], "rows": [["A", 2], ["B", 2]], "total": 2}}], [{"cmd": "CREATE (:Person {name: 'A'}), (:Person {name: 'B'})", "text": "作成したノード 2、設定したプロパティ 2、追加したラベル 2"}, {"cmd": "MATCH (a:Person {name: 'A'}), (b:Person {name: 'B'})\nMERGE (a)-[:KNOWS]->(b)", "text": "作成したリレーションシップ 1", "warn": ["This query builds a cartesian product between disconnected patterns.：If a part of a query contains multiple disconnected patterns, this will build a cartesian product between all those parts. This may produce a large amount of data and slow down query processing. While occasionally intended, it may often be possible to reformulate the query that avoids the use of this cross product, perhaps by adding a relationship between the different parts or by using OPTIONAL MATCH (identifier is: (b))"]}, {"cmd": "MATCH (p:Person) RETURN p.name, count(*) AS nodes ORDER BY p.name", "table": {"columns": ["p.name", "nodes"], "rows": [["A", 1], ["B", 1]], "total": 2}}]]}, {"id": "direction", "title": "方向を書かない", "question": "会員 4242 は 6 人をフォローし、フォロワーは 4 人です（相互フォローはなし）。矢印を書かずに MATCH (:Customer {id: 4242})-[:FOLLOWS]-(x) とすると、何行返りますか？", "options": ["10：両方向とも数える", "6：既定は外向きの方向", "エラー：リレーションシップには必ず方向を書く"], "answer": 0, "explanation": "保存されるリレーションシップには必ず方向がありますが、クエリでは方向を書かなくてもよく、その場合は両方向のリレーションシップが一致します。\n「フォロー」は方向のある関係なので、方向を書かないと「自分がフォローしている人」と「自分をフォローしている人」が混ざってしまいます。「知り合い」「友達」のような対称な関係でこそ、方向を書かない検索がよく使われます。\n", "setup": null, "scripts": [{"label": "A：方向を書かない", "code": "MATCH (:Customer {id: 4242})-[:FOLLOWS]-(x) RETURN count(x)\n"}, {"label": "B：フォローしている人だけを見る", "code": "MATCH (:Customer {id: 4242})-[:FOLLOWS]->(x) RETURN count(x)\n"}], "results": [[{"cmd": "MATCH (:Customer {id: 4242})-[:FOLLOWS]-(x) RETURN count(x)", "table": {"columns": ["count(x)"], "rows": [[10]], "total": 1}}], [{"cmd": "MATCH (:Customer {id: 4242})-[:FOLLOWS]->(x) RETURN count(x)", "table": {"columns": ["count(x)"], "rows": [[6]], "total": 1}}]]}, {"id": "null-equals", "title": "= null で誕生日のない会員を探す", "question": "1,141 人の会員が誕生日を入力していません（birthDate プロパティがない）。WHERE c.birthDate = null では何人見つかりますか？", "options": ["1,141", "20,000（全員）", "0"], "answer": 2, "explanation": "SQL と同じく、どんな値も null と比較した結果は null（true ではない）なので、= null では決して何も見つかりません。IS NULL / IS NOT NULL を使います。\nNeo4j では「プロパティが null」は「そのプロパティがない」ことと同じです：SET c.birthDate = null はこのプロパティを削除することになります。\n", "setup": null, "scripts": [{"label": "A：= null", "code": "MATCH (c:Customer) WHERE c.birthDate = null RETURN count(c)\n"}, {"label": "B：IS NULL", "code": "MATCH (c:Customer) WHERE c.birthDate IS NULL RETURN count(c)\n"}], "results": [[{"cmd": "MATCH (c:Customer) WHERE c.birthDate = null RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[0]], "total": 1}}], [{"cmd": "MATCH (c:Customer) WHERE c.birthDate IS NULL RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[1141]], "total": 1}}]]}, {"id": "optional-match-where", "title": "OPTIONAL MATCH の WHERE", "question": "会員 1、2、4242 には 5 万元以上の注文がそれぞれ何件ありますか？（4242 にはなし）A は条件を OPTIONAL MATCH の WHERE に書き、B は MATCH を使います。A は何行返しますか？", "options": ["3 行：大口注文のない会員も現れ、件数は 0", "3 行より少ない：大口注文のない会員は除外される", "エラー：OPTIONAL MATCH には WHERE を書けない"], "answer": 0, "explanation": "OPTIONAL MATCH の WHERE は「マッチ条件」の一部です。一致しないときはその変数が null になりますが、会員の行は残ります（count(null) = 0）。\nSQL の LEFT JOIN … ON o.total >= 50000 と同じです。\n条件を後ろの WITH … WHERE o.total >= 50000 に書くと、null の行が除外されて、普通の MATCH（INNER JOIN）に戻ってしまいます。\n", "setup": null, "scripts": [{"label": "A：OPTIONAL MATCH … WHERE", "code": "MATCH (c:Customer) WHERE c.id IN [1, 2, 4242]\nOPTIONAL MATCH (c)-[:PLACED]->(o:Order) WHERE o.total >= 50000\nRETURN c.id, count(o) AS bigOrders ORDER BY c.id\n"}, {"label": "B：MATCH … WHERE", "code": "MATCH (c:Customer)-[:PLACED]->(o:Order) WHERE c.id IN [1, 2, 4242] AND o.total >= 50000\nRETURN c.id, count(o) AS bigOrders ORDER BY c.id\n"}], "results": [[{"cmd": "MATCH (c:Customer) WHERE c.id IN [1, 2, 4242]\nOPTIONAL MATCH (c)-[:PLACED]->(o:Order) WHERE o.total >= 50000\nRETURN c.id, count(o) AS bigOrders ORDER BY c.id", "table": {"columns": ["c.id", "bigOrders"], "rows": [[1, 14], [2, 5], [4242, 0]], "total": 3}}], [{"cmd": "MATCH (c:Customer)-[:PLACED]->(o:Order) WHERE c.id IN [1, 2, 4242] AND o.total >= 50000\nRETURN c.id, count(o) AS bigOrders ORDER BY c.id", "table": {"columns": ["c.id", "bigOrders"], "rows": [[1, 14], [2, 5]], "total": 2}}]]}, {"id": "cartesian", "title": "関係のない 2 つのパターンをカンマでつなぐ", "question": "gold 会員は 891 人、販売終了の商品は 83 件です。MATCH (c:Customer {vipLevel: 'gold'}), (p:Product {isActive: false}) RETURN count(*) はいくつですか？", "options": ["73,953（891 × 83）で、デカルト積の警告が出る", "974（891 + 83）", "0：両者の間にはリレーションシップがない"], "answer": 0, "explanation": "カンマで区切られ、互いにリレーションシップでつながっていないパターンは、両側のすべての組み合わせ（デカルト積）になります。SQL の CROSS JOIN と同じです。\nサーバーは「This query builds a cartesian product between disconnected patterns」という通知を返します。\nクエリを書くときにリレーションシップを書き忘れる（例えば (c), (o) の間の -[:PLACED]-> を忘れる）と起こり、データ量が多いと終わりません。\n", "setup": null, "scripts": [{"label": "つながっていない 2 つのパターン", "code": "MATCH (c:Customer {vipLevel: 'gold'}), (p:Product {isActive: false})\nRETURN count(*)\n"}], "results": [[{"cmd": "MATCH (c:Customer {vipLevel: 'gold'}), (p:Product {isActive: false})\nRETURN count(*)", "table": {"columns": ["count(*)"], "rows": [[73953]], "total": 1}, "warn": ["This query builds a cartesian product between disconnected patterns.：If a part of a query contains multiple disconnected patterns, this will build a cartesian product between all those parts. This may produce a large amount of data and slow down query processing. While occasionally intended, it may often be possible to reformulate the query that avoids the use of this cross product, perhaps by adding a relationship between the different parts or by using OPTIONAL MATCH (identifier is: (p))"]}]]}, {"id": "duplicate-paths", "title": "友達の友達に DISTINCT は必要か", "question": "会員 224 の「友達の友達」：count(fof) と count(DISTINCT fof) の結果は同じですか？", "options": ["同じ：MATCH は重複したノードを返さない", "B の方が多い", "A の方が多い：同じ人に別々の友達経由でたどり着けるので、パスごとに 1 行になる"], "answer": 2, "explanation": "MATCH が返すのは「マッチのしかたすべて」、つまりすべてのパスです。2 人の友達が同じ人をフォローしていれば、その人は 2 回現れます（44 vs 42）。\n「人数」を数えるなら DISTINCT を付け、「たどり着けるパスが何本あるか」（例えばレコメンドの強さ）を数えるときだけ DISTINCT なしの count を使います。\n", "setup": null, "scripts": [{"label": "A：count(fof)", "code": "MATCH (:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof) RETURN count(fof)\n"}, {"label": "B：count(DISTINCT fof)", "code": "MATCH (:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof) RETURN count(DISTINCT fof)\n"}], "results": [[{"cmd": "MATCH (:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof) RETURN count(fof)", "table": {"columns": ["count(fof)"], "rows": [[44]], "total": 1}}], [{"cmd": "MATCH (:Customer {id: 224})-[:FOLLOWS]->()-[:FOLLOWS]->(fof) RETURN count(DISTINCT fof)", "table": {"columns": ["count(DISTINCT fof)"], "rows": [[42]], "total": 1}}]]}, {"id": "fof-includes-me", "title": "友達の友達が自分自身になることは？", "question": "会員 6 と会員 10127 は相互フォローしています。(me {id: 6})-[:FOLLOWS]->()-[:FOLLOWS]->(fof) の結果に、6 自身は現れますか？", "options": ["現れる：6 → 10127 → 6 は 2 本の異なるリレーションシップなので、有効なパス", "現れない：Cypher は出発点に戻らない"], "answer": 0, "explanation": "Cypher は 1 つのパターンの中で「同じリレーションシップを 2 回たどらない」（relationship isomorphism）ものの、「同じノード」は何度でも現れ得ます。\n6 → 10127 と 10127 → 6 は 2 本の異なるリレーションシップなので、6 自身も「友達の友達」になります。\nレコメンドのクエリを書くときは WHERE fof <> me と、既にフォローしている人の除外を忘れずに。\n", "setup": null, "scripts": [{"label": "A：自分を除外していない", "code": "MATCH (me:Customer {id: 6})-[:FOLLOWS]->()-[:FOLLOWS]->(fof)\nRETURN count(fof) AS total, sum(CASE WHEN fof = me THEN 1 ELSE 0 END) AS includesMe\n"}, {"label": "B：WHERE fof <> me", "code": "MATCH (me:Customer {id: 6})-[:FOLLOWS]->()-[:FOLLOWS]->(fof)\nWHERE fof <> me\nRETURN count(fof) AS total\n"}], "results": [[{"cmd": "MATCH (me:Customer {id: 6})-[:FOLLOWS]->()-[:FOLLOWS]->(fof)\nRETURN count(fof) AS total, sum(CASE WHEN fof = me THEN 1 ELSE 0 END) AS includesMe", "table": {"columns": ["total", "includesMe"], "rows": [[30, 1]], "total": 1}}], [{"cmd": "MATCH (me:Customer {id: 6})-[:FOLLOWS]->()-[:FOLLOWS]->(fof)\nWHERE fof <> me\nRETURN count(fof) AS total", "table": {"columns": ["total"], "rows": [[29]], "total": 1}}]]}, {"id": "delete-with-relationships", "title": "まだリレーションシップがあるノードを DELETE する", "question": "4242 には注文とフォローのリレーションシップがあります。トランザクション内で MATCH (c:Customer {id: 4242}) DELETE c を実行すると、いつエラーになりますか？", "options": ["DELETE の文ですぐにエラーになる", "DELETE は成功したように見え、リレーションシップは残る。commit 時に初めてエラーになる", "決してエラーにならず、始点のないリレーションシップが残る"], "answer": 1, "explanation": "Neo4j は「宙に浮いたリレーションシップ」を許しませんが、このチェックは commit 時にしか行われません：トランザクション内の DELETE c は成功したように見え（nodesDeleted: 1）、\n注文を指す PLACED リレーションシップもまだ残っています。commit して初めて Neo.ClientError.Schema.ConstraintValidationFailed\n（Cannot delete node … because it still has relationships）というエラーになり、トランザクション全体が失敗します。ショーケースは常に ROLLBACK するので、ここではそのエラーは見えません。\nDETACH DELETE はノードのすべてのリレーションシップを先に削除してから、ノードを削除します。反対側のノードは削除しない点に注意：4242 の注文は残り、誰も PLACED していない孤児になります。\n", "setup": null, "scripts": [{"label": "A：DELETE（トランザクション内）", "code": "MATCH (c:Customer {id: 4242}) DELETE c;\nMATCH ()-[r:PLACED]->(:Order {id: 59901}) RETURN count(r) AS placedStillThere\n"}, {"label": "B：DETACH DELETE", "code": "MATCH (c:Customer {id: 4242}) DETACH DELETE c;\nMATCH ()-[r:PLACED]->(:Order {id: 59901}) RETURN count(r) AS placedStillThere;\nMATCH (o:Order {id: 59901}) RETURN count(o) AS orderStillThere\n"}], "results": [[{"cmd": "MATCH (c:Customer {id: 4242}) DELETE c", "text": "削除したノード 1"}, {"cmd": "MATCH ()-[r:PLACED]->(:Order {id: 59901}) RETURN count(r) AS placedStillThere", "table": {"columns": ["placedStillThere"], "rows": [[1]], "total": 1}}], [{"cmd": "MATCH (c:Customer {id: 4242}) DETACH DELETE c", "text": "削除したノード 1、削除したリレーションシップ 17"}, {"cmd": "MATCH ()-[r:PLACED]->(:Order {id: 59901}) RETURN count(r) AS placedStillThere", "table": {"columns": ["placedStillThere"], "rows": [[0]], "total": 1}}, {"cmd": "MATCH (o:Order {id: 59901}) RETURN count(o) AS orderStillThere", "table": {"columns": ["orderStillThere"], "rows": [[1]], "total": 1}}]]}, {"id": "match-nothing-create", "title": "MATCH で見つからないと、その後の CREATE は？", "question": "会員 999999 は存在しません。MATCH (c:Customer {id: 999999}) CREATE (c)-[:PLACED]->(:Order {id: 900001}) はどうなりますか？", "options": ["エラー：会員が存在しない", "会員のいない注文が 1 件作成される", "何も起こらず、エラーにもならない"], "answer": 2, "explanation": "Cypher は 1 行ずつ処理します：MATCH が 0 行なら、後ろの CREATE は 0 回実行されるだけで、エラーも通知もありません。\nアプリケーションでよくあるバグ：間違った id（例えば文字列 '999'）で「注文の追加」を呼ぶと、何も書き込まれていないのに成功が返ってきます。\n書き込まれたことを確認するには、返された行や書き込みの統計（nodesCreated）を見るか、MERGE や OPTIONAL MATCH とチェックを組み合わせます。\n", "setup": null, "scripts": [{"label": "MATCH で見つからなかった後の CREATE", "code": "MATCH (c:Customer {id: 999999})\nCREATE (c)-[:PLACED]->(o:Order {id: 900001})\nRETURN o;\nMATCH (o:Order {id: 900001}) RETURN count(o) AS created\n"}], "results": [[{"cmd": "MATCH (c:Customer {id: 999999})\nCREATE (c)-[:PLACED]->(o:Order {id: 900001})\nRETURN o", "table": {"columns": ["o"], "rows": [], "total": 0}}, {"cmd": "MATCH (o:Order {id: 900001}) RETURN count(o) AS created", "table": {"columns": ["created"], "rows": [[0]], "total": 1}}]]}, {"id": "integer-division", "title": "整数同士の割り算", "question": "会員 4242 の 6 件の注文の合計は 58,033 です。sum(o.total) / count(o) は何を返しますか？", "options": ["9672（整数の割り算で、小数は切り捨て）", "9672.17", "エラー：型が違う"], "answer": 0, "explanation": "2 つの整数を割った結果は整数で（Java と同じ）、小数はそのまま切り捨てられます。avg() は常に浮動小数点数を返します。\n小数が必要なら toFloat(sum(o.total)) / count(o) と書きます。\n", "setup": null, "scripts": [{"label": "A：sum / count", "code": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order) RETURN sum(o.total) / count(o)\n"}, {"label": "B：avg()", "code": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order) RETURN avg(o.total)\n"}], "results": [[{"cmd": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order) RETURN sum(o.total) / count(o)", "table": {"columns": ["sum(o.total) / count(o)"], "rows": [[9672]], "total": 1}}], [{"cmd": "MATCH (:Customer {id: 4242})-[:PLACED]->(o:Order) RETURN avg(o.total)", "table": {"columns": ["avg(o.total)"], "rows": [[9672.166666666666]], "total": 1}}]]}, {"id": "type-mismatch", "title": "id を文字列で検索する", "question": "会員の id は整数で保存されています。MATCH (c:Customer {id: '4242'})（文字列）では何人見つかりますか？", "options": ["0：文字列と整数は等しくなく、エラーにもならない", "1：Cypher が自動で型変換する", "エラー：型が一致しない"], "answer": 0, "explanation": "Neo4j にはプロパティの型を強制するスキーマがなく（コミュニティ版には型制約もありません）、比較時に自動で型変換もしません：'4242' と 4242 は等しくないので見つからず、エラーにもなりません。\nよくある原因：URL パラメータや JSON から受け取った値が文字列のまま、クエリのパラメータに渡されることです。toInteger($id) で変換するか、書き込み時に型を統一しましょう。\n", "setup": null, "scripts": [{"label": "A：文字列 '4242'", "code": "MATCH (c:Customer {id: '4242'}) RETURN count(c)\n"}, {"label": "B：整数 4242", "code": "MATCH (c:Customer {id: 4242}) RETURN count(c)\n"}], "results": [[{"cmd": "MATCH (c:Customer {id: '4242'}) RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[0]], "total": 1}}], [{"cmd": "MATCH (c:Customer {id: 4242}) RETURN count(c)", "table": {"columns": ["count(c)"], "rows": [[1]], "total": 1}}]]}, {"id": "same-order-missing", "title": "1 本の長いパスで同じ注文が漏れる", "question": "「商品 540 を買った人は 雅漾 保養 C693（アベンヌのスキンケア）も買った」のは何人ですか？A は 1 本の長いパス、B は 2 つの MATCH に分けています。A の数は少なくなりますか？", "options": ["同じ：2 つの書き方は同じ意味", "A の方が少ない：1 本のパスの中の 2 つの PLACED は同じリレーションシップにできないので、同じ注文で一緒に買った人が除外される", "A の方が多い：1 本のパスだと重複して数える"], "answer": 1, "explanation": "Cypher は 1 つの MATCH パターンの中で同じリレーションシップを 1 回しか使いません（relationship isomorphism）。これはグラフ上をぐるぐる回って無限のパスが生まれるのを防ぐためです。\nその副作用：A の 2 つの -[:PLACED]-> は 2 本の異なるリレーションシップ、つまり 2 つの異なる注文でなければなりません。\n同じ注文で 540 とアベンヌを一緒に買った人（そのような注文が 3 件ある）は A ではマッチしないので、16 人ではなく 14 人になります。\n2 つの MATCH に分けると、一意性はそれぞれのパターン内でしかチェックされず、両側で同じ PLACED を使えます。\n", "setup": null, "scripts": [{"label": "A：1 本のパス", "code": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product {name: '雅漾 保養 C693'})\nRETURN count(DISTINCT c) AS buyers\n"}, {"label": "B：2 つの MATCH", "code": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)\nMATCH (c)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product {name: '雅漾 保養 C693'})\nRETURN count(DISTINCT c) AS buyers\n"}], "results": [[{"cmd": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product {name: '雅漾 保養 C693'})\nRETURN count(DISTINCT c) AS buyers", "table": {"columns": ["buyers"], "rows": [[14]], "total": 1}}], [{"cmd": "MATCH (:Product {id: 540})<-[:CONTAINS]-(:Order)<-[:PLACED]-(c:Customer)\nMATCH (c)-[:PLACED]->(:Order)-[:CONTAINS]->(other:Product {name: '雅漾 保養 C693'})\nRETURN count(DISTINCT c) AS buyers", "table": {"columns": ["buyers"], "rows": [[16]], "total": 1}}]]}], "steps": [{"id": "label-scan", "title": "インデックスなし：NodeByLabelScan", "goal": "email で会員を探します。Customer には id の一意制約（インデックス付き）しかなく、email にはインデックスがありません。まず 1 回実行し、インデックスを作成してから再実行します。", "question": "インデックスがないときの実行計画は？db hits はおよそいくつですか？インデックスを作成した後は？", "takeaway": "インデックスなし：NodeByLabelScan が 20,000 人の会員をすべて読み（20,001 db hits）、Filter で email を 1 人ずつ比較し（さらに 20,000）、合計約 40,000 db hits。\nインデックス作成後：NodeIndexSeek でその 1 人を直接見つけ、合計 4 db hits。\ndb hits は Neo4j がストレージ層にアクセスした回数（ノード、プロパティ、リレーションシップの読み取り）で、クエリのコストを比べる最も安定した指標です。ミリ秒はキャッシュの影響を受けます。\n★ グラフデータベースのインデックスは「起点」を見つけるためだけに使います。起点を見つけた後はリレーションシップをたどるだけで、インデックスは不要です（index-free adjacency）。\n", "setup": ["CREATE INDEX customer_email IF NOT EXISTS FOR (c:Customer) ON (c.email)"], "queries": [{"label": "email で会員を探す", "code": "MATCH (c:Customer) WHERE c.email = 'user04242@example.com' RETURN c.id, c.name"}]}, {"id": "index-defeated", "title": "プロパティに演算をするとインデックスが使えない", "goal": "id には一意制約のインデックスがあります。c.id = 4242 と c.id + 0 = 4242（結果は同じ）を比較します。", "question": "3 つの文の結果は同じですが、実行計画も同じですか？", "takeaway": "A：NodeUniqueIndexSeek、3 db hits。B、C：NodeByLabelScan + Filter、約 40,000 db hits。\nプロパティに演算をする（c.id + 0、toString(c.id)）と、クエリプランナーはインデックスを使えず、各ノードのプロパティを計算してから比較するしかありません。\nSQL と同じ理屈です：WHERE id + 0 = 4242、WHERE lower(email) = … もインデックスを無効にします。\n正しいやり方は演算を「値」の側に置くことです：WHERE c.id = toInteger($id)。\n", "setup": [], "queries": [{"label": "A：c.id = 4242", "code": "MATCH (c:Customer) WHERE c.id = 4242 RETURN c.name"}, {"label": "B：c.id + 0 = 4242", "code": "MATCH (c:Customer) WHERE c.id + 0 = 4242 RETURN c.name"}, {"label": "C：toString(c.id) = '4242'", "code": "MATCH (c:Customer) WHERE toString(c.id) = '4242' RETURN c.name"}]}, {"id": "range-index", "title": "範囲検索：期間", "goal": "2026 年 9 月の注文は何件ですか？まずインデックスなしで実行し、次に Order.orderDate に RANGE インデックスを作成します。", "question": "インデックス作成前後で、実行計画の最初のステップはそれぞれ何ですか？db hits はどれだけ違いますか？", "takeaway": "インデックスなし：NodeByLabelScan で 8 万件の注文を読み、Filter で時刻を比較し、約 160,000 db hits。\nRANGE インデックスあり：NodeIndexSeekByRange がインデックスから 9 月の区間を直接切り出し、2,919 件、約 2,900 db hits。\nRANGE インデックス（Neo4j 5 の既定）は、等号、範囲（< > >= <=）、STARTS WITH、IS NOT NULL に対応しています。\n", "setup": ["CREATE INDEX order_date IF NOT EXISTS FOR (o:Order) ON (o.orderDate)"], "queries": [{"label": "2026 年 9 月の注文", "code": "MATCH (o:Order)\nWHERE o.orderDate >= datetime('2026-09-01T00:00:00+08:00') AND o.orderDate < datetime('2026-10-01T00:00:00+08:00')\nRETURN count(o)\n"}]}, {"id": "text-index", "title": "文字列の部分一致：TEXT インデックス", "goal": "商品名に「Sony」を含む商品。RANGE インデックスは等号、範囲、STARTS WITH にしか使えず、CONTAINS / ENDS WITH には TEXT インデックスが必要です。", "question": "TEXT インデックスを作成した後、A と B の実行計画はそれぞれ何ですか？", "takeaway": "インデックスなし：どちらも NodeByLabelScan + Filter で、約 3,000 db hits。\nTEXT インデックス作成後：A は NodeIndexContainsScan、B は NodeIndexSeekByRange になり、どちらも 60 db hits で済みます。\nRANGE インデックスは CONTAINS / ENDS WITH に使えないので、TEXT インデックスを使います。本格的な全文検索（分かち書き、関連度スコア）には FULLTEXT インデックスを使います：\nCREATE FULLTEXT INDEX … の後、db.index.fulltext.queryNodes() で検索します。\n", "setup": ["CREATE TEXT INDEX product_name_text IF NOT EXISTS FOR (p:Product) ON (p.name)"], "queries": [{"label": "A：CONTAINS 'Sony'", "code": "MATCH (p:Product) WHERE p.name CONTAINS 'Sony' RETURN count(p)"}, {"label": "B：STARTS WITH 'Sony'", "code": "MATCH (p:Product) WHERE p.name STARTS WITH 'Sony' RETURN count(p)"}]}, {"id": "supernode", "title": "スーパーノードから出発する", "goal": "「自分のフォロワーは何件注文したか」：会員 4242 のフォロワーは 4 人、会員 1 は 895 人です。同じクエリで起点だけを変えます。", "question": "2 つの文の実行計画は同じです。db hits は何倍違いますか？", "takeaway": "2 つの実行計画はまったく同じです：一意インデックスで起点を見つける → フォロワーを Expand → 注文を Expand。\n違いはデータにあります：4242 はフォロワーが 4 人で合計 106 db hits、会員 1 はフォロワーが 895 人で合計約 18,700 db hits と、170 倍以上になります。\nグラフの走査コストは「何本のリレーションシップをたどるか」で決まり、データベース全体の大きさとは関係ありません。しかしスーパーノード（supernode。有名人のアカウント、人気のタグなど）に出会うと、\nそこから出発したりそこを通過したりするクエリは高くつきます。よくある対策：方向とリレーションシップの型で制限する、時期でリレーションシップを分割する（例：FOLLOWED_2026）、\nスーパーノードに統計値を事前計算しておく、などです。\n", "setup": [], "queries": [{"label": "A：会員 4242 から出発", "code": "MATCH (:Customer {id: 4242})<-[:FOLLOWS]-(fan:Customer)-[:PLACED]->(o:Order) RETURN count(o)"}, {"label": "B：会員 1 から出発", "code": "MATCH (:Customer {id: 1})<-[:FOLLOWS]-(fan:Customer)-[:PLACED]->(o:Order) RETURN count(o)"}]}]}, {"id": "timescaledb", "name": "TimescaleDB", "lang": "sql", "labName": "chunk 実験", "labNote": "各クエリを EXPLAIN ANALYZE で実行し、読んだ chunk の数（page_views は全 27 個、各 7 日）と実行時間を比較します。圧縮・連続集約の実験は操作が必要なため、ショーケースアプリの「実験室」で行ってください。", "hasResults": true, "exercises": [{"id": "daily-views", "chapter": "time_bucket の基本", "title": "日ごとの閲覧数（台湾時間）", "prompt": "2026-09-08 から 2026-09-10（台湾時間、3 日間）の各日の閲覧数はいくつですか？\n「その日の開始時刻」と件数を返し、日付順に並べます。\n", "hints": ["time_bucket('1 day', view_time, 'Asia/Taipei') で台湾時間の 1 日ごとに区切ります。", "第 3 引数を付けないと time_bucket は UTC で区切るので、1 日が台湾時間の午前 8 時から始まってしまいます。"], "answer": "SELECT time_bucket('1 day', view_time, 'Asia/Taipei') AS day, count(*) AS views\nFROM page_views\nWHERE view_time >= '2026-09-08 00:00+08' AND view_time < '2026-09-11 00:00+08'\nGROUP BY day\nORDER BY day;\n", "explanation": "time_bucket は TimescaleDB で最もよく使う関数です：時間を固定長の区間に区切ります（date_trunc に似ていますが、5 分、15 分など任意の長さにできます）。\n★ timestamptz は既定で UTC で区切られます。台湾の「1 日」にはタイムゾーンの引数が必要です。9/9 は買い物祭りで、閲覧数は普段の 3 倍です。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["day", "views"], "rows": [["2026-09-08 00:00:00", 9550], ["2026-09-09 00:00:00", 28650], ["2026-09-10 00:00:00", 9550]], "total": 3}}]}, {"id": "peak-hours", "chapter": "time_bucket の基本", "title": "1 日で最も人気の時間帯", "prompt": "2026-09-01（台湾時間）の 1 日で、閲覧数が最も多い 3 つの時間帯：\nその時間の開始時刻と閲覧数を、閲覧数の多い順に返します。\n", "hints": ["time_bucket('1 hour', view_time)：1 時間ごとの区間。正時は UTC でも台湾時間でも同じです。"], "answer": "SELECT time_bucket('1 hour', view_time) AS hour, count(*) AS views\nFROM page_views\nWHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-09-02 00:00+08'\nGROUP BY hour\nORDER BY views DESC\nLIMIT 3;\n", "explanation": "夜 8〜10 時は EC のトラフィックのピークです。1 時間や 1 分のような「日をまたがない」区間は、UTC と台湾時間の境界が同じなので、タイムゾーンの引数は不要です。\n1 日、1 週間、1 か月のように日をまたぐ区間で必要になります。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["hour", "views"], "rows": [["2026-09-01 20:00:00", 900], ["2026-09-01 21:00:00", 860], ["2026-09-01 19:00:00", 820]], "total": 3}}]}, {"id": "monthly-views", "chapter": "time_bucket の基本", "title": "月ごとの閲覧数", "prompt": "page_views の月ごと（台湾時間）の件数はいくつですか？月の開始時刻と件数を返し、月順に並べます。\n", "hints": ["time_bucket には '1 month'（暦の月で区切る）も指定できます。"], "answer": "SELECT time_bucket('1 month', view_time, 'Asia/Taipei') AS month, count(*) AS views\nFROM page_views\nGROUP BY month\nORDER BY month;\n", "explanation": "'1 month' は暦の月で区切り（区間ごとに長さが違う）、'30 days' は固定の 30 日なので月とは揃いません（落とし穴問題で実演しています）。\nこのクエリは 190 万件すべてを読む必要があります。連続集約（後の問題）は、このようなレポートを毎回計算し直さずに済むようにするためのものです。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["month", "views"], "rows": [["2026-04-01 00:00:00", 309420], ["2026-05-01 00:00:00", 324700], ["2026-06-01 00:00:00", 309420], ["2026-07-01 00:00:00", 318970], ["2026-08-01 00:00:00", 324700], ["2026-09-01 00:00:00", 328520]], "total": 6}}]}, {"id": "device-share", "chapter": "time_bucket の基本", "title": "デバイス別の閲覧比率", "prompt": "2026 年 9 月（台湾時間）のデバイス（device）ごとの閲覧数と、その月の総閲覧数に占める割合（小数第 1 位に四捨五入）を、\n閲覧数の多い順に返します。\n", "hints": ["割合にはウィンドウ関数を使えます：count(*) * 100.0 / sum(count(*)) OVER ()"], "answer": "SELECT device, count(*) AS views,\n       round(count(*) * 100.0 / sum(count(*)) OVER (), 1) AS pct\nFROM page_views\nWHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-10-01 00:00+08'\nGROUP BY device\nORDER BY views DESC;\n", "explanation": "TimescaleDB は完全に PostgreSQL です：ウィンドウ関数、JOIN、CTE もそのまま使えます。利用者にとって hypertable はただの普通のテーブルです。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["device", "views", "pct"], "rows": [["mobile", 197237, 60.0], ["desktop", 98701, 30.0], ["tablet", 32582, 9.9]], "total": 3}}]}, {"id": "weekly-orders", "chapter": "time_bucket の基本", "title": "週ごとの注文数と売上", "prompt": "2026 年第 3 四半期（7/1〜9/30、台湾時間）の週ごとの注文数と売上（total の合計）を、週順に返します。\n週は月曜日から始まります。\n", "hints": ["time_bucket('1 week', …) は既定で月曜日から始まります。"], "answer": "SELECT time_bucket('1 week', order_time, 'Asia/Taipei') AS week, count(*) AS orders, sum(total) AS revenue\nFROM orders\nWHERE order_time >= '2026-07-01 00:00+08' AND order_time < '2026-10-01 00:00+08'\nGROUP BY week\nORDER BY week;\n", "explanation": "time_bucket の起点（origin）は既定で 2000-01-03（月曜日）なので、週の区間は月曜日から始まります。\n最初の週の開始は 6/29 です：7/1 は水曜日なので、その週には 7/1 以降の注文しかありません（最初の 2 日は WHERE で除外されています）。\n日曜日から始めたいなら origin を指定します：time_bucket('1 week', order_time, 'Asia/Taipei', origin => '2000-01-02')。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["week", "orders", "revenue"], "rows": [["2026-06-29 00:00:00", 497, 7037900], ["2026-07-06 00:00:00", 660, 10048032], ["2026-07-13 00:00:00", 687, 10374992], ["2026-07-20 00:00:00", 665, 9827545], ["2026-07-27 00:00:00", 647, 10090420], ["2026-08-03 00:00:00", 613, 9751145], ["2026-08-10 00:00:00", 684, 10624697], ["2026-08-17 00:00:00", 734, 10048670], ["2026-08-24 00:00:00", 691, 9484081], ["2026-08-31 00:00:00", 651, 10521553]], "total": 14}}]}, {"id": "last-reading", "chapter": "時系列分析", "title": "各センサーの最後の測定値", "prompt": "各センサーの 2026-09-30（台湾時間）の最後の温度。\nsensor_id と温度を返し、sensor_id 順に並べます。\n", "hints": ["last(値, 時刻)：時刻順に並べた最後の行の値を取ります。first() は最初の行です。"], "answer": "SELECT sensor_id, last(temperature, time) AS temperature\nFROM sensor_readings\nWHERE time >= '2026-09-30 00:00+08' AND time < '2026-10-01 00:00+08'\nGROUP BY sensor_id\nORDER BY sensor_id;\n", "explanation": "first() / last() は TimescaleDB の集約関数で、「各デバイスの最新の値」のようなクエリが 1 行で書けます。\n純粋な PostgreSQL では DISTINCT ON (sensor_id) … ORDER BY sensor_id, time DESC、またはウィンドウ関数 ROW_NUMBER() で書きます。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["sensor_id", "temperature"], "rows": [[1, 4.81], [2, 4.93], [3, 27.06], [4, 27.14], [5, 5.04], [6, 4.91], [7, 26.98], [8, 26.84], [9, 4.67], [10, 4.9]], "total": 12}}]}, {"id": "cold-alarm", "chapter": "時系列分析", "title": "冷蔵室の温度異常", "prompt": "冷蔵エリア（sensors.kind = '冷藏'）のセンサーで、温度が 8°C を超えた測定値：\nセンサーごとにまとめ、sensor_id、倉庫、最初に超えた時刻、最後に超えた時刻、超えた件数、最高温度を返します。\n", "hints": ["sensor_readings JOIN sensors USING (sensor_id)", "min(time)、max(time)、count(*)、max(temperature)"], "answer": "SELECT r.sensor_id, s.warehouse, min(r.time) AS first_alarm, max(r.time) AS last_alarm,\n       count(*) AS readings, max(r.temperature) AS max_temp\nFROM sensor_readings r\nJOIN sensors s USING (sensor_id)\nWHERE s.kind = '冷藏' AND r.temperature > 8\nGROUP BY r.sensor_id, s.warehouse\nORDER BY r.sensor_id;\n", "explanation": "hypertable は普通のテーブルと JOIN できます（センサーの基本情報は普通のテーブル sensors にあります）。\n9/18 の午前 2:10〜2:30、桃園倉庫 B 区画の冷蔵温度が一時 12.5°C まで上がりました。おそらくドアがきちんと閉まっていなかったのでしょう。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["sensor_id", "warehouse", "first_alarm", "last_alarm", "readings", "max_temp"], "rows": [[2, "桃園倉", "2026-09-18 02:10:00", "2026-09-18 02:30:00", 21, 12.53]], "total": 1}}]}, {"id": "gapfill", "chapter": "時系列分析", "title": "データのない時間帯を埋める", "prompt": "センサー 7 の 2026-09-10 08:00〜16:00（台湾時間）の 1 時間ごとの平均温度。\nデータのない時間も表示し（平均温度は NULL）、時刻順に全 8 行を返します。\n", "hints": ["普通の time_bucket は「データがある」区間しか表示しません。", "time_bucket_gapfill は範囲内のすべての区間を表示します。範囲は WHERE の条件から推定されます。"], "answer": "SELECT time_bucket_gapfill('1 hour', time) AS hour, avg(temperature) AS avg_temp\nFROM sensor_readings\nWHERE sensor_id = 7\n  AND time >= '2026-09-10 08:00+08' AND time < '2026-09-10 16:00+08'\nGROUP BY hour\nORDER BY hour;\n", "explanation": "センサー 7 は 10:00〜14:00 にオフラインだったので、普通の time_bucket では 4 行しか返らず、グラフにすると途中の空白が「消えて」しまいます。\ntime_bucket_gapfill は空の区間を NULL で埋めるので、フロントエンドのグラフやその後の計算が誤解されません。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["hour", "avg_temp"], "rows": [["2026-09-10 08:00:00", 21.637333333333338], ["2026-09-10 09:00:00", 21.26016666666668], ["2026-09-10 10:00:00", null], ["2026-09-10 11:00:00", null], ["2026-09-10 12:00:00", null], ["2026-09-10 13:00:00", null], ["2026-09-10 14:00:00", 22.157000000000004], ["2026-09-10 15:00:00", 22.87932203389831]], "total": 8}}]}, {"id": "locf", "chapter": "時系列分析", "title": "前の値で欠損を埋める（LOCF）", "prompt": "前の問題と同じ（センサー 7、9/10 08:00〜16:00 の 1 時間ごとの平均温度）ですが、\nデータのない時間は「直前のデータがある値」で埋めます。時刻と埋めた温度を全 8 行返します。\n", "hints": ["locf(avg(temperature))：Last Observation Carried Forward。"], "answer": "SELECT time_bucket_gapfill('1 hour', time) AS hour, locf(avg(temperature)) AS avg_temp\nFROM sensor_readings\nWHERE sensor_id = 7\n  AND time >= '2026-09-10 08:00+08' AND time < '2026-09-10 16:00+08'\nGROUP BY hour\nORDER BY hour;\n", "explanation": "locf() は最後に観測した値を後ろに引き継ぎ、「状態」系のデータ（温度設定、在庫量、オン／オフの状態）に向いています。\nもう 1 つの選択肢は interpolate() で、前後 2 つの値で線形補間するので、連続的に変化する量に向いています。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["hour", "avg_temp"], "rows": [["2026-09-10 08:00:00", 21.637333333333338], ["2026-09-10 09:00:00", 21.26016666666668], ["2026-09-10 10:00:00", 21.26016666666668], ["2026-09-10 11:00:00", 21.26016666666668], ["2026-09-10 12:00:00", 21.26016666666668], ["2026-09-10 13:00:00", 21.26016666666668], ["2026-09-10 14:00:00", 22.157000000000004], ["2026-09-10 15:00:00", 22.87932203389831]], "total": 8}}]}, {"id": "moving-average", "chapter": "時系列分析", "title": "3 日移動平均", "prompt": "2026-09-01 から 2026-09-14（台湾時間）の日ごとの閲覧数と、「その日を含む直近 3 日」の平均閲覧数（整数に四捨五入）。\n日の開始時刻、その日の閲覧数、3 日平均を、日付順に返します。\n", "hints": ["まず time_bucket で日ごとの件数を求め、ウィンドウ関数 avg(…) OVER (ORDER BY day ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) を使います。"], "answer": "SELECT day, views,\n       round(avg(views) OVER (ORDER BY day ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)) AS avg_3d\nFROM (\n  SELECT time_bucket('1 day', view_time, 'Asia/Taipei') AS day, count(*) AS views\n  FROM page_views\n  WHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-09-15 00:00+08'\n  GROUP BY day\n) d\nORDER BY day;\n", "explanation": "移動平均を使うと、1 日だけの山（9/9 の買い物祭り）をならして、傾向を読み取れます。最初の 2 日は 3 日分に満たないので、それぞれ 1 日分、2 日分の平均になります。\nウィンドウ関数と time_bucket の組み合わせは、時系列分析で最もよく使われます。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["day", "views", "avg_3d"], "rows": [["2026-09-01 00:00:00", 9550, 9550], ["2026-09-02 00:00:00", 9550, 9550], ["2026-09-03 00:00:00", 9550, 9550], ["2026-09-04 00:00:00", 9550, 9550], ["2026-09-05 00:00:00", 12415, 10505], ["2026-09-06 00:00:00", 12415, 11460], ["2026-09-07 00:00:00", 9550, 11460], ["2026-09-08 00:00:00", 9550, 10505], ["2026-09-09 00:00:00", 28650, 15917], ["2026-09-10 00:00:00", 9550, 15917]], "total": 14}}]}, {"id": "day-over-day", "chapter": "時系列分析", "title": "前日との比較", "prompt": "2026-09-08 から 2026-09-11（台湾時間）の日ごとの閲覧数と、前日からの増加数（最初の日は NULL）。\n日の開始時刻、閲覧数、差分を、日付順に返します。\n", "hints": ["lag(views) OVER (ORDER BY day)"], "answer": "SELECT day, views, views - lag(views) OVER (ORDER BY day) AS diff\nFROM (\n  SELECT time_bucket('1 day', view_time, 'Asia/Taipei') AS day, count(*) AS views\n  FROM page_views\n  WHERE view_time >= '2026-09-08 00:00+08' AND view_time < '2026-09-12 00:00+08'\n  GROUP BY day\n) d\nORDER BY day;\n", "explanation": "lag() は前の行の値を取ります。最初の日には「前日」がないので NULL になります。範囲外の 9/7 と比べたいなら、検索範囲を 1 日多く取ってから除外します。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["day", "views", "diff"], "rows": [["2026-09-08 00:00:00", 9550, null], ["2026-09-09 00:00:00", 28650, 19100], ["2026-09-10 00:00:00", 9550, -19100], ["2026-09-11 00:00:00", 9550, 0]], "total": 4}}]}, {"id": "cagg-hourly", "chapter": "連続集約", "title": "連続集約から 1 時間ごとの統計を検索", "prompt": "連続集約 sensor_hourly には、各センサーの 1 時間ごとの平均・最低・最高温度が既に計算されています。\nこれを使って、センサー 2 の 2026-09-18 00:00〜06:00（台湾時間）の 1 時間ごとの最高温度を、時刻順に検索します。\n", "hints": ["連続集約はビューと同じように使えます：SELECT hour, max_temp FROM sensor_hourly WHERE …"], "answer": "SELECT hour, max_temp\nFROM sensor_hourly\nWHERE sensor_id = 2 AND hour >= '2026-09-18 00:00+08' AND hour < '2026-09-18 06:00+08'\nORDER BY hour;\n", "explanation": "連続集約（continuous aggregate）は「自動で増分更新されるマテリアライズドビュー」です：元データは 1 分に 1 行、集約後は 1 時間に 1 行なので、\nクエリは 6 行を読むだけで済み、360 行の元データをスキャンする必要はありません。データ量が多く、レポートを頻繁に検索するほど差ははっきりします（実験室で比較しています）。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["hour", "max_temp"], "rows": [["2026-09-18 00:00:00", 5.04], ["2026-09-18 01:00:00", 4.91], ["2026-09-18 02:00:00", 12.53], ["2026-09-18 03:00:00", 4.69], ["2026-09-18 04:00:00", 4.49], ["2026-09-18 05:00:00", 4.24]], "total": 6}}]}, {"id": "cagg-top-products", "chapter": "連続集約", "title": "人気商品（日次集約から）", "prompt": "連続集約 page_views_daily を使って、2026-09-01 から 2026-09-22（台湾時間、両端を含む）で閲覧回数が最も多い 5 つの商品を検索します：\nproduct_id と総閲覧数を、閲覧数の多い順に返します。\n", "hints": ["page_views_daily は「日 × 商品」ごとに 1 行なので、さらに sum(views) します。"], "answer": "SELECT product_id, sum(views) AS views\nFROM page_views_daily\nWHERE day >= '2026-09-01 00:00+08' AND day < '2026-09-23 00:00+08'\nGROUP BY product_id\nORDER BY views DESC\nLIMIT 5;\n", "explanation": "日次集約からさらに上位へ集計する（日次 → 月次、商品ごと → カテゴリごと）のは安価です。\n★ 再度 sum できるのは count と sum です。平均値はそのまま再平均できない（日ごとに件数が違う）ので、sum と count を保存しておき、最後に割り算します。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["product_id", "views"], "rows": [[1, 6378], [2, 2676], [3, 1995], [4, 1668], [5, 1516]], "total": 5}}]}, {"id": "chunk-count", "chapter": "hypertable と chunk", "title": "chunk はいくつあるか", "prompt": "page_views という hypertable はいくつの chunk に分割されていますか？1 つの数値を返します。\n", "hints": ["show_chunks('page_views') ですべての chunk を一覧にできます。timescaledb_information.chunks を検索してもかまいません。"], "answer": "SELECT count(*) FROM show_chunks('page_views');\n", "explanation": "hypertable の内部は多数の小さなテーブル（chunk）で、各 chunk はある期間のデータ（ここでは 7 日分）を保存しています。\n検索時は時間範囲に関係する chunk だけを読み（chunk exclusion）、古いデータを削除するときは chunk ごと丸ごと捨てるので（drop_chunks）、1 行ずつ DELETE する必要はありません。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["count"], "rows": [[27]], "total": 1}}]}, {"id": "chunk-range", "chapter": "hypertable と chunk", "title": "ある時点はどの chunk にあるか", "prompt": "2026-09-01 12:00（台湾時間）の閲覧記録は、page_views のどの chunk に保存されていますか？\nその chunk の時間範囲（range_start、range_end）を返します。\n", "hints": ["timescaledb_information.chunks には各 chunk の hypertable_name、range_start、range_end があります。"], "answer": "SELECT range_start, range_end\nFROM timescaledb_information.chunks\nWHERE hypertable_name = 'page_views'\n  AND range_start <= '2026-09-01 12:00+08' AND range_end > '2026-09-01 12:00+08';\n", "explanation": "chunk の境界は「UTC の固定間隔」に揃えられているので、範囲は 8/27 08:00〜9/3 08:00（台湾時間、木曜日の午前 8 時）となり、\n月初や月曜日から始まるわけではありません。chunk の大きさの目安：最近のデータ（書き込み中の chunk とそのインデックス）がメモリの 25% 程度に収まること。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["range_start", "range_end"], "rows": [["2026-08-27 08:00:00", "2026-09-03 08:00:00"]], "total": 1}}]}, {"id": "insert-reading", "chapter": "書き込み", "title": "新しい測定値を 1 件書き込む", "prompt": "センサー 2 が 2026-10-01 00:00（台湾時間）に報告しました：温度 4.2、湿度 85.0。\nsensor_readings に書き込み、RETURNING で time、sensor_id、temperature、humidity を返します。\n", "hints": ["INSERT INTO sensor_readings (time, sensor_id, temperature, humidity) VALUES (…) RETURNING …"], "answer": "INSERT INTO sensor_readings (time, sensor_id, temperature, humidity)\nVALUES ('2026-10-01 00:00+08', 2, 4.2, 85.0)\nRETURNING time, sensor_id, temperature, humidity;\n", "explanation": "hypertable への書き込みは普通のテーブルへの書き込みとまったく同じです。このデータの時刻は既存の chunk の範囲を超えているので、TimescaleDB が自動で新しい chunk を作成します\n（このトランザクション内で。サンドボックスは最後に ROLLBACK します）。時系列の書き込みはほとんどが「末尾への追加」で、書き込み中の chunk は小さくインデックスもメモリにあるので、書き込みは高速です。\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["time", "sensor_id", "temperature", "humidity"], "rows": [["2026-10-01 00:00:00", 2, 4.2, 85.0]], "total": 1}}]}, {"id": "late-data", "chapter": "書き込み", "title": "遅れて届いたデータを書き込む", "prompt": "センサー 7 は接続が回復した後、2026-09-10 11:00（台湾時間）の測定値を送ってきました：温度 21.5、湿度 61.0。\n書き込んだ後、センサー 7 の 9/10（台湾時間）の測定値が全部で何件あるかを検索します。\n", "hints": ["先に INSERT し、次に SELECT count(*) …（サンドボックスは複数の文を一度に実行できます）"], "answer": "INSERT INTO sensor_readings (time, sensor_id, temperature, humidity)\nVALUES ('2026-09-10 11:00+08', 7, 21.5, 61.0);\n\nSELECT count(*)\nFROM sensor_readings\nWHERE sensor_id = 7 AND time >= '2026-09-10 00:00+08' AND time < '2026-09-11 00:00+08';\n", "explanation": "遅れて届いたデータ（late data）は古い chunk に書き込まれます。その期間が既に連続集約でマテリアライズされていても、集約は自動では気づきません：\n次の refresh を待つ必要があります（refresh は「データが変更された区間」を再計算し、TimescaleDB は変更された時間範囲を記録しています）。\n古い chunk が既に圧縮されていれば、書き込みのコストも高くなります。\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["count"], "rows": [[1194]], "total": 1}}]}, {"id": "retention-delete", "chapter": "書き込み", "title": "古いデータを削除", "prompt": "最も古い 1 週間分のデータはもう不要です：2026-04-08（台湾時間）より前の page_views を削除し、\n削除した件数を返します（1 行、1 つの数値）。\n", "hints": ["WITH removed AS (DELETE … RETURNING 1) SELECT count(*) FROM removed"], "answer": "WITH removed AS (\n  DELETE FROM page_views\n  WHERE view_time < '2026-04-08 00:00+08'\n  RETURNING 1\n)\nSELECT count(*) FROM removed;\n", "explanation": "この問題には数秒かかります：DELETE は 1 行ずつ削除し、インデックスを更新し、WAL を書き、後で VACUUM も必要です。実測で 7 万件の削除に約 5 秒かかり、\n1 か月分（30 万件）を削除するとショーケースの 15 秒の上限を超えます。\n★ TimescaleDB のやり方は chunk を丸ごと捨てることです：SELECT drop_chunks('page_views', older_than => '2026-05-01'::timestamptz)。\n実測で 5 つの chunk を捨てるのに数ミリ秒しかかからず（DROP TABLE と同じ）、VACUUM が必要な不要データも残りません。\n自動の保持ポリシーも設定できます：add_retention_policy('page_views', INTERVAL '5 months')。\ndrop_chunks が捨てるのは「範囲全体が条件より古い」chunk だけで、境界の chunk は残る点に注意しましょう。\n", "ordered": true, "write": true, "setup": null, "result": [{"table": {"columns": ["count"], "rows": [[72580]], "total": 1}}]}], "traps": [{"id": "utc-bucket", "title": "time_bucket の「1 日」は何時から始まる？", "question": "9/8〜9/10（台湾時間）の 3 日間の日ごとの閲覧数を検索します。A はタイムゾーンの引数を渡していません。何行返りますか？", "options": ["3 行、B と同じ", "4 行：UTC で区切られ、各日が台湾時間の午前 8 時から始まるので、先頭と末尾にそれぞれ区間ができる", "エラー：timestamptz には必ずタイムゾーンが必要"], "answer": 1, "explanation": "timestamptz に対する time_bucket は既定で UTC で区切ります：台湾時間の「1 日」が 2 つに分かれてしまいます（00:00〜08:00 は前の UTC の日に属する）。\n結果は 1 行多くなり、しかも毎日の数値が正しくありません（9/9 の買い物祭りの 3 倍のトラフィックが 2 日に分かれてしまう）。\n区間が「日、週、月」なら、必ずタイムゾーンの引数を付けましょう。データベースの timezone 設定は time_bucket に影響しません。\n", "setup": null, "scripts": [{"label": "A：time_bucket('1 day', view_time)", "code": "SELECT time_bucket('1 day', view_time) AS day, count(*)\nFROM page_views\nWHERE view_time >= '2026-09-08 00:00+08' AND view_time < '2026-09-11 00:00+08'\nGROUP BY day ORDER BY day;\n"}, {"label": "B：'Asia/Taipei' を付ける", "code": "SELECT time_bucket('1 day', view_time, 'Asia/Taipei') AS day, count(*)\nFROM page_views\nWHERE view_time >= '2026-09-08 00:00+08' AND view_time < '2026-09-11 00:00+08'\nGROUP BY day ORDER BY day;\n"}], "results": [[{"table": {"columns": ["day", "count"], "rows": [["2026-09-07 08:00:00", 670], ["2026-09-08 08:00:00", 10890], ["2026-09-09 08:00:00", 27310], ["2026-09-10 08:00:00", 8880]], "total": 4}}], [{"table": {"columns": ["day", "count"], "rows": [["2026-09-08 00:00:00", 9550], ["2026-09-09 00:00:00", 28650], ["2026-09-10 00:00:00", 9550]], "total": 3}}]]}, {"id": "thirty-days", "title": "'30 days' は 1 か月？", "question": "time_bucket('30 days', view_time, 'Asia/Taipei') の各区間の開始日は、毎月 1 日ですか？", "options": ["いいえ：固定の起点から 30 日ごとに区切るので、開始日は 3/17、4/16… となり、7 つの区間に分かれる", "はい、30 days は自動で各月に揃う"], "answer": 0, "explanation": "固定長の区間（'30 days'）は起点（origin、既定は 2000-01-03）から 30 日ごとに区切るので、暦の月とは揃わず、\n先頭と末尾にも半端な区間ができます。月ごとに集計するなら '1 month' を使います（time_bucket は月・年単位の区間に対応しています）。\n", "setup": null, "scripts": [{"label": "A：'30 days'", "code": "SELECT time_bucket('30 days', view_time, 'Asia/Taipei') AS bucket, count(*)\nFROM page_views GROUP BY bucket ORDER BY bucket;\n"}, {"label": "B：'1 month'", "code": "SELECT time_bucket('1 month', view_time, 'Asia/Taipei') AS bucket, count(*)\nFROM page_views GROUP BY bucket ORDER BY bucket;\n"}], "results": [[{"table": {"columns": ["bucket", "count"], "rows": [["2026-03-17 00:00:00", 154710], ["2026-04-16 00:00:00", 309420], ["2026-05-16 00:00:00", 315150], ["2026-06-15 00:00:00", 309420], ["2026-07-15 00:00:00", 309420], ["2026-08-14 00:00:00", 331385], ["2026-09-13 00:00:00", 186225]], "total": 7}}], [{"table": {"columns": ["bucket", "count"], "rows": [["2026-04-01 00:00:00", 309420], ["2026-05-01 00:00:00", 324700], ["2026-06-01 00:00:00", 309420], ["2026-07-01 00:00:00", 318970], ["2026-08-01 00:00:00", 324700], ["2026-09-01 00:00:00", 328520]], "total": 6}}]]}, {"id": "chunk-exclusion", "title": "時刻の列を型変換する", "question": "どちらの文も 9/1 の 1 日分のデータだけが必要です。B は view_time を ::date に型変換しています。B の実行計画はいくつの chunk を読みますか？", "options": ["1 個、A と同じ", "2 個（2 つの chunk にまたがる）", "27 個すべて：型変換した後は chunk の範囲を判断できないので、すべての chunk を読む必要がある"], "answer": 2, "explanation": "chunk exclusion（関係する chunk だけを読む）は「時刻の列そのもの」に対する範囲条件に頼っています。列に型変換や関数（::date、date_trunc(…)、AT TIME ZONE）を使うと、\nプランナーは chunk の時間範囲で除外できず、すべての chunk を読むしかありません。普通のインデックスが効かなくなるのと同じ理屈です。\n★ 常に time >= 開始 AND time < 終了 という半開区間で書きましょう。\n", "setup": null, "scripts": [{"label": "A：時間範囲", "code": "EXPLAIN (COSTS OFF)\nSELECT count(*) FROM page_views\nWHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-09-02 00:00+08';\n"}, {"label": "B：view_time::date =", "code": "EXPLAIN (COSTS OFF)\nSELECT count(*) FROM page_views\nWHERE view_time::date = '2026-09-01';\n"}], "results": [[{"table": {"columns": ["QUERY PLAN"], "rows": [["Aggregate"], ["  ->  Index Only Scan using _hyper_2_262_chunk_page_views_view_time_idx on _hyper_2_262_chunk"], ["        Index Cond: ((view_time >= '2026-09-01 00:00:00+08'::timestamp with time zone) AND (view_time < '2026-09-02 00:00:00+08'::timestamp with time zone))"]], "total": 3}}], [{"table": {"columns": ["QUERY PLAN"], "rows": [["Finalize Aggregate"], ["  ->  Gather"], ["        Workers Planned: 5"], ["        ->  Parallel Custom Scan (ChunkAppend) on page_views"], ["              Chunks excluded during startup: 0"], ["              ->  Partial Aggregate"], ["                    ->  Parallel Index Only Scan using _hyper_2_263_chunk_page_views_view_time_idx on _hyper_2_263_chunk"], ["                          Filter: ((view_time)::date = '2026-09-01'::date)"], ["              ->  Partial Aggregate"], ["                    ->  Parallel Index Only Scan using _hyper_2_254_chunk_page_views_view_time_idx on _hyper_2_254_chunk"]], "total": 86}}]]}, {"id": "gapfill-range", "title": "範囲を指定しない time_bucket_gapfill", "question": "WHERE に時間範囲がないと、time_bucket_gapfill はどうなりますか？", "options": ["データの最も早い時刻と最も遅い時刻を自動で範囲にする", "データのある時間帯だけを返す。time_bucket と同じ", "エラー：WHERE から開始と終了を推定する必要があり、推定できなければ失敗する"], "answer": 2, "explanation": "gapfill は「どこからどこまで埋めるか」を知る必要があるので、WHERE には時刻の列の開始と終了の条件が必ず必要です（または関数の引数に start、finish を直接渡します）。\nエラーメッセージ：missing time_bucket_gapfill argument: could not infer start from WHERE clause。\n", "setup": null, "scripts": [{"label": "時間範囲のない gapfill", "code": "SELECT time_bucket_gapfill('1 hour', time) AS hour, avg(temperature)\nFROM sensor_readings\nWHERE sensor_id = 7\nGROUP BY hour;\n"}], "results": [[{"table": {"columns": ["錯誤"], "rows": [["ERROR: missing time_bucket_gapfill argument: could not infer start from WHERE clause\n  建議：Specify start and finish as arguments or in the WHERE clause."]], "total": 1}}]]}, {"id": "cagg-stale", "title": "連続集約に最新のデータがない", "question": "page_views には 9/24 以降にも 7 万件以上の閲覧があります。連続集約 page_views_daily から 9/24 以降の閲覧数を検索すると、いくつになりますか？", "options": ["B と同じ：連続集約は最新のデータを自動で含む", "0：まだ refresh されていない区間は連続集約に含まれない", "エラー"], "answer": 1, "explanation": "page_views_daily は 9/24 までしか refresh されていません。TimescaleDB 2.13 以降、新しく作成した連続集約は既定で materialized_only = true で、マテリアライズ済みのデータしか返しません。\n実務では refresh ポリシーを追加します：add_continuous_aggregate_policy('page_views_daily', start_offset => …, end_offset => …, schedule_interval => …)。\nまたはリアルタイム集約を有効にします：ALTER MATERIALIZED VIEW page_views_daily SET (timescaledb.materialized_only = false)\n（検索時に「まだマテリアライズされていない部分」を元データからその場で計算して合わせます。実験室で実演しています）。\n", "setup": null, "scripts": [{"label": "A：連続集約から検索", "code": "SELECT coalesce(sum(views), 0) AS views\nFROM page_views_daily\nWHERE day >= '2026-09-24 00:00+08';\n"}, {"label": "B：元データから検索", "code": "SELECT count(*) AS views\nFROM page_views\nWHERE view_time >= '2026-09-24 00:00+08';\n"}], "results": [[{"table": {"columns": ["views"], "rows": [[0]], "total": 1}}], [{"table": {"columns": ["views"], "rows": [[72580]], "total": 1}}]]}, {"id": "cagg-count-rows", "title": "連続集約の count(*)", "question": "page_views_daily は「日 × 商品」ごとに 1 行です。9/1〜9/22 の count(*) と sum(views) のどちらが、この期間の閲覧数に等しいですか？", "options": ["sum(views)", "count(*)", "どちらも同じ"], "answer": 0, "explanation": "集約テーブルの 1 行は既に「1 グループ」の結果なので、count(*) が数えるのはグループ数（3 万以上：日数 × 閲覧された商品）であって、元の閲覧数ではありません。\n集約後の数値をさらに集計するには sum(views) を使います。同様に、平均値をさらに平均することはできません：sum と count を保存しておき、最後に割り算します。\n", "setup": null, "scripts": [{"label": "連続集約から検索", "code": "SELECT count(*) AS rows, sum(views) AS views\nFROM page_views_daily\nWHERE day >= '2026-09-01 00:00+08' AND day < '2026-09-23 00:00+08';\n"}, {"label": "元データから検索（正解）", "code": "SELECT count(*) AS views\nFROM page_views\nWHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-09-23 00:00+08';\n"}], "results": [[{"table": {"columns": ["rows", "views"], "rows": [[32653, 246390]], "total": 1}}], [{"table": {"columns": ["views"], "rows": [[246390]], "total": 1}}]]}], "steps": [{"id": "time-range", "title": "時間条件あり vs なし", "goal": "page_views には 27 個の chunk（各 7 日）があります。どちらも閲覧数を数えますが、一方は 9/1 の 1 日だけ、もう一方はすべてです。", "question": "A と B はそれぞれいくつの chunk を読みましたか？", "takeaway": "A は 1 つの chunk しか読まず（0.6 ms）、B は 27 個すべてを読みました（約 30 ms）。\nhypertable は時間で chunk に区切られ、各 chunk は自分の時間範囲を記録しています。クエリに時間条件があると、プランナーは範囲外の chunk を直接飛ばします（chunk exclusion）。\nインデックスを見る必要すらありません。これが時系列データベースで「データが増え続けても、最近のデータの検索は同じように速い」理由です。\n", "setup": [], "queries": [{"label": "A：9/1 の 1 日", "code": "SELECT count(*) FROM page_views WHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-09-02 00:00+08'"}, {"label": "B：すべて", "code": "SELECT count(*) FROM page_views"}]}, {"id": "cast-defeats", "title": "時刻の列を型変換する", "goal": "結果が同じになる 2 つの書き方：時間範囲、または view_time を日付に変換してから比較。", "question": "3 つの文の結果は同じですが、読んだ chunk の数も同じですか？", "takeaway": "A は 1 つの chunk を読み（0.6 ms）、B、C は結果は同じなのに 27 個すべての chunk を読みました（約 60 ms、100 倍遅い）。\n時刻の列に型変換や関数（::date、date_trunc、AT TIME ZONE）を使うと、プランナーは chunk の時間範囲と比較できず、すべてを読むしかありません。\n★ 常に time >= 開始 AND time < 終了 という半開区間で書き、演算は「値」の側に置きましょう。\n", "setup": [], "queries": [{"label": "A：view_time >= … AND view_time < …", "code": "SELECT count(*) FROM page_views WHERE view_time >= '2026-09-01 00:00+08' AND view_time < '2026-09-02 00:00+08'"}, {"label": "B：view_time::date = '2026-09-01'", "code": "SELECT count(*) FROM page_views WHERE view_time::date = '2026-09-01'"}, {"label": "C：date_trunc('day', view_time) = …", "code": "SELECT count(*) FROM page_views WHERE date_trunc('day', view_time) = '2026-09-01 00:00+08'"}]}, {"id": "now-relative", "title": "相対時間：now() - interval", "goal": "ダッシュボードで最もよくある「直近 N 日」。now() は定数ではありませんが、TimescaleDB はそれでも chunk を除外できるのか確かめます。", "question": "B は now() を使っています。読む chunk は減りましたか？実行計画を展開して、Index Cond にどんな条件が追加されているか見てください。", "takeaway": "A の時刻は定数なので、計画時に chunk が除外されます。\nB も関係する chunk しか読みません：TimescaleDB は計画の段階で now() - interval '30 days' を先に定数として計算し、\n実行計画の Index Cond には元の条件と計算済みの時刻（例：view_time > '2026-09-08 …'）の両方が現れるので、chunk は同じように除外されます。\n（純粋な PostgreSQL のパーティションテーブルでは、now() があると実行開始まで待ってからパーティションを除外し、実行計画に「Subplans Removed」が表示されます。）\nデータは 9/30 までなので、B の結果は今日の日付によって変わります：今日が 9/30 から 30 日以上離れていれば、すべての chunk が除外されて 0 が返ります。\n結論：ダッシュボードでよくある「直近 N 日」の書き方はまったく問題なく、定数に書き換える必要はありません。\n", "setup": [], "queries": [{"label": "A：固定の時刻（9/30 から 30 日前まで）", "code": "SELECT count(*) FROM page_views WHERE view_time > '2026-10-01 00:00+08'::timestamptz - interval '30 days'"}, {"label": "B：now() - interval '30 days'（今日の日付によって結果が変わる）", "code": "SELECT count(*) FROM page_views WHERE view_time > now() - interval '30 days'"}]}, {"id": "other-column", "title": "時刻以外の列の条件だけ", "goal": "商品 540 の閲覧数だけを見ます。page_views には (product_id, view_time DESC) のインデックスがありますが、時間条件はありません。", "question": "A はいくつの chunk を読みましたか？各 chunk はどうやって商品 540 を見つけましたか？", "takeaway": "A には時間条件がないので 27 個すべての chunk を見る必要がありますが、各 chunk には自分の (product_id, view_time) インデックスがあり、1 回ずつインデックスを引くだけなので、やはり高速です（1 ms 未満）。\nB は時間範囲を加えたので、5 つの chunk しか見ません。\nhypertable に作成したインデックスは自動で各 chunk に作成され、クエリでは「chunk ごとに 1 回ずつインデックスを引く」ことになります。\nchunk が多いほど、時間条件のないクエリはインデックスを引く回数が増えるので、chunk を細かくしすぎないようにしましょう（最新の chunk とそのインデックスがメモリの 25% に収まるのが目安）。\n", "setup": [], "queries": [{"label": "A：product_id だけ", "code": "SELECT count(*) FROM page_views WHERE product_id = 540"}, {"label": "B：product_id ＋ 時間範囲", "code": "SELECT count(*) FROM page_views WHERE product_id = 540 AND view_time >= '2026-09-01 00:00+08'"}]}]}, {"id": "pgvector", "name": "pgvector", "lang": "sql", "labName": null, "labNote": null, "hasResults": true, "exercises": [{"id": "dims-norm", "chapter": "ベクトルと距離", "title": "ベクトルの次元数と長さ", "prompt": "商品 806 のベクトルは何次元ですか？長さ（L2 ノルム）はいくつですか？\n2 列を返します：次元数、長さ（小数第 3 位に四捨五入）。\n", "hints": ["vector_dims(embedding) は次元数を、vector_norm(embedding) は長さを返します。", "vector_norm は double precision を返すので、小数第 3 位に round するには先に numeric に変換します。"], "answer": "SELECT vector_dims(embedding) AS dims,\n       round(vector_norm(embedding)::numeric, 3) AS norm\nFROM products\nWHERE id = 806;\n", "explanation": "ここのベクトルはすべて長さ 1 に正規化（l2_normalize）されています。本物の埋め込みモデル（例：OpenAI text-embedding-3）が出力するベクトルも通常は長さ 1 です。\n長さがすべて 1 なら、cosine 距離、L2 距離、内積の順位はまったく同じになるので、最も速い内積（<#>）を選べます。\n★ 列を vector(64) と宣言すると、次元数の違うベクトルは書き込めません。1 つの列には同じモデルが生成したベクトルだけを入れます。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["dims", "norm"], "rows": [[64, 1.0]], "total": 1}}]}, {"id": "operators", "chapter": "ベクトルと距離", "title": "4 種類の距離演算子", "prompt": "'[3,4]' と '[6,8]' の 2 つのベクトルの間の 4 種類の距離を計算し、1 行 4 列で返します：\nL2 距離、cosine 距離（この 2 つは小数第 3 位に四捨五入）、負の内積、L1 距離。\n", "hints": ["<-> は L2（ユークリッド）距離、<=> は cosine 距離、<#> は負の内積、<+> は L1（マンハッタン）距離です。", "文字列は先に型変換します：'[3,4]'::vector"], "answer": "SELECT round(('[3,4]'::vector <-> '[6,8]')::numeric, 3) AS l2,\n       round(('[3,4]'::vector <=> '[6,8]')::numeric, 3) AS cosine,\n       '[3,4]'::vector <#> '[6,8]' AS neg_inner_product,\n       '[3,4]'::vector <+> '[6,8]' AS l1;\n", "explanation": "2 つのベクトルは同じ方向で、長さが 2 倍違います：L2 距離は 5（長さを見る）、cosine 距離は 0（方向だけを見る）、内積は 50。\n★ <#> が返すのは「負の」内積（-50）です。PostgreSQL のインデックスは「小さい順」にしか並べないので、符号を反転すれば ORDER BY の小さい順が内積の大きい順になります。\ncosine 距離 = 1 - cosine 類似度で、範囲は 0〜2：0 は完全に同じ向き、1 は直交、2 は完全に逆向きです。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["l2", "cosine", "neg_inner_product", "l1"], "rows": [[5.0, 0.0, -50.0, 7.0]], "total": 1}}]}, {"id": "similar-products", "chapter": "ベクトルと距離", "title": "ある商品に最も似た商品", "prompt": "商品 806 に最も似た 5 件の商品（806 自身を除く）を、類似度の高い順に。\nid、name、cosine 類似度（= 1 - cosine 距離、小数第 3 位に四捨五入）を返します。\n", "hints": ["ORDER BY embedding <=> (SELECT embedding FROM products WHERE id = 806) LIMIT 5", "806 自身を除くのを忘れずに：自分との距離は 0 なので、必ず 1 位になります。"], "answer": "SELECT id, name,\n       round((1 - (embedding <=> (SELECT embedding FROM products WHERE id = 806)))::numeric, 3) AS similarity\nFROM products\nWHERE id <> 806\nORDER BY embedding <=> (SELECT embedding FROM products WHERE id = 806)\nLIMIT 5;\n", "explanation": "「この商品を見た人はこんな商品も見ています」の最も簡単な作り方：商品自身のベクトルで最近傍を探します。\n★ ORDER BY には「距離」の小さい順（embedding <=> x）を書き、1 - 距離 DESC とは書かないこと：結果は同じですが、後者ではベクトルインデックスを使えません（落とし穴問題で実演しています）。\n類似度は人が見るために SELECT で計算するだけで十分です。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "similarity"], "rows": [[151, "Sony 無線耳機 N677", 0.984], [627, "JBL 無線耳機 V398", 0.975], [616, "Bose 無線耳機 F988", 0.935], [1168, "Sony 無線耳機 X684", 0.926], [580, "Apple 無線耳機 A375", 0.892]], "total": 5}}]}, {"id": "pairwise", "chapter": "ベクトルと距離", "title": "2 つずつ類似度を比べる", "prompt": "商品 806（Sony のワイヤレスイヤホン）と、537、469、1132 の 3 つの商品それぞれとの cosine 類似度はいくつですか？\nid、name、類似度（小数第 3 位に四捨五入）を、類似度の高い順に返します。\n", "hints": ["806 を a、残りの 3 つを b とします：FROM products a, products b WHERE a.id = 806 AND b.id IN (…)"], "answer": "SELECT b.id, b.name,\n       round((1 - (a.embedding <=> b.embedding))::numeric, 3) AS similarity\nFROM products a, products b\nWHERE a.id = 806 AND b.id IN (537, 469, 1132)\nORDER BY similarity DESC;\n", "explanation": "同じくワイヤレスイヤホンの 537 は類似度 0.66、スキンケア用品やノートパソコンは 0 に近く、負にさえなります（ほぼ直交）。\n高次元空間では関係のないもの同士は「直交」し、類似度は 0 付近になります。そのため類似度のしきい値を決めるとき、0.3 と 0.6 では意味が大きく違い、実際のデータを見て決める必要があります。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "similarity"], "rows": [[537, "小米 無線耳機 R870", 0.662], [1132, "SK-II 保養 S942", -0.05], [469, "Lenovo 筆電 U846", -0.137]], "total": 3}}]}, {"id": "semantic-search", "chapter": "セマンティック検索", "title": "テキストで商品を探す", "prompt": "embed() で「通勤 安靜」（通勤、静か）をベクトルに変換し、最も合う 5 件の商品を探します。id、name を最も合う順に返します。\n", "hints": ["embed('通勤 安靜') は vector(64) を返すので、embedding との距離を比べるだけです。", "SELECT tokens('通勤 安靜') で、embed() がどの語を認識するか確認できます。"], "answer": "SELECT id, name\nFROM products\nORDER BY embedding <=> embed('通勤 安靜')\nLIMIT 5;\n", "explanation": "見つかるのはすべてアクティブノイズキャンセリングのワイヤレスイヤホンですが、商品説明には「通勤」「安靜」という語はまったくありません：\n語彙の中で「通勤」のベクトルは「降噪」（ノイズキャンセリング）「無線」（ワイヤレス）に近いので、意味の近い商品が上位に来るのです。これがセマンティック検索とキーワード検索の最大の違いです。\n実際のシステムでは embed() は埋め込みモデルの API 呼び出しです（アプリケーション側でベクトルを計算して SQL に渡します）。ここでは語彙で作ったミニモデルで代用しています。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name"], "rows": [[552, "Bose 無線耳機 V350"], [233, "Sony 無線耳機 X216"], [330, "Sony 無線耳機 E910"], [252, "JBL 無線耳機 O984"], [192, "Bose 無線耳機 H452"]], "total": 5}}]}, {"id": "similar-words", "chapter": "セマンティック検索", "title": "語彙の中の類義語", "prompt": "語彙（vocab）の中で「露營」（キャンプ）に最も近い 5 つの語（「露營」自身を除く）。\nword、cosine 距離（小数第 3 位に四捨五入）を近い順に返します。\n", "hints": ["vocab の embedding もベクトルです：ORDER BY embedding <=> (SELECT embedding FROM vocab WHERE word = '露營')"], "answer": "SELECT word, round((embedding <=> (SELECT embedding FROM vocab WHERE word = '露營'))::numeric, 3) AS distance\nFROM vocab\nWHERE word <> '露營'\nORDER BY embedding <=> (SELECT embedding FROM vocab WHERE word = '露營')\nLIMIT 5;\n", "explanation": "「戶外」（アウトドア）「帳篷」（テント）は「露營」とほとんど同じで、「登山」「野餐」（ピクニック）も近いです。recipe 列を見れば理由が分かります：どれも「アウトドア」というトピックを含んでいます。\n本物の埋め込みモデルも同じ理屈ですが、「トピック」はモデルが大量のテキストから自分で学んだ数百〜数千の次元で、人間には各次元の意味が分かりません。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["word", "distance"], "rows": [["戶外", 0.077], ["帳篷", 0.077], ["野餐", 0.246], ["登山", 0.256], ["烤肉", 0.453]], "total": 5}}]}, {"id": "filtered-search", "chapter": "セマンティック検索", "title": "セマンティック検索に通常の条件を加える", "prompt": "予算 1000 元以内（price <= 1000）のメンズ・レディースのうち、「冬天 保暖」（冬、暖かい）に最も合う 5 件。\nid、name、price を最も合う順に返します。\n", "hints": ["通常の WHERE 条件はそのまま書き、ベクトルの距離で ORDER BY します。"], "answer": "SELECT id, name, price\nFROM products\nWHERE price <= 1000 AND category IN ('男裝', '女裝')\nORDER BY embedding <=> embed('冬天 保暖')\nLIMIT 5;\n", "explanation": "ベクトルを PostgreSQL に置く最大の利点：ベクトル検索を価格、カテゴリ、在庫、権限などの通常の条件と同じ SQL 文に書け、JOIN もできることです。\n専用のベクトルデータベース（Pinecone、Milvus）では、絞り込むためにこれらのフィールド（metadata）を別途保存する必要があります。\n見つかるのはすべてウール素材の服です：「羊毛」（ウール）のベクトルには「暖かさ」のトピックが含まれています。\n★ データ量が多く、ベクトルインデックスを使う場合、絞り込み条件のせいで結果が 5 件に満たないことがあります（実験室の「フィルタ」で実演しています）。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name", "price"], "rows": [[708, "UNIQLO 女裝 Y562", 639], [1214, "ZARA 女裝 X436", 659], [1314, "GU 女裝 K648", 359], [1149, "UNIQLO 男裝 C650", 819], [1169, "GU 男裝 H730", 639]], "total": 5}}]}, {"id": "threshold", "chapter": "セマンティック検索", "title": "距離のしきい値で絞り込む", "prompt": "「露營 輕量」（キャンプ、軽量）との cosine 距離が 0.35 未満の商品は何件ですか？1 つの数値を返します。\n", "hints": ["WHERE embedding <=> embed('露營 輕量') < 0.35"], "answer": "SELECT count(*)\nFROM products\nWHERE embedding <=> embed('露營 輕量') < 0.35;\n", "explanation": "RAG でよくあるやり方：「十分に関連する」データだけを LLM に渡し、遠すぎるものは渡さない（無関係な内容でモデルが誤解しないように）。\n★ 距離のしきい値だけで ORDER BY … LIMIT のないクエリは HNSW / IVFFlat インデックスを使えず（これらは「最も近い k 件を探す」ことしかできない）、テーブル全体を計算します。\n大きなテーブルでは「ORDER BY 距離 LIMIT k」と書き、その結果から遠すぎるものを除きます。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["count"], "rows": [[10]], "total": 1}}]}, {"id": "keyword-and-semantic", "chapter": "セマンティック検索", "title": "ブランドを限定したセマンティック検索", "prompt": "名称が「Sony 」で始まる商品のうち、「通勤 安靜」（通勤、静か）に最も合う 3 件。id、name を最も合う順に返します。\n", "hints": ["WHERE name LIKE 'Sony %'"], "answer": "SELECT id, name\nFROM products\nWHERE name LIKE 'Sony %'\nORDER BY embedding <=> embed('通勤 安靜')\nLIMIT 3;\n", "explanation": "ブランドや型番のような「固有名詞」はセマンティックモデルが苦手なことが多いので（ここの語彙は Sony をまったく知りません）、キーワード条件の方が確実です。\n「通勤、静か」のようなニーズの記述にはセマンティック検索の方が強いです。両者を組み合わせたものがハイブリッド検索（hybrid search）で、実験室では RRF で順位を合わせる方法を紹介しています。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["id", "name"], "rows": [[233, "Sony 無線耳機 X216"], [330, "Sony 無線耳機 E910"], [806, "Sony 無線耳機 F178"]], "total": 3}}]}, {"id": "best-per-category", "chapter": "セマンティック検索", "title": "カテゴリごとに最も合う 1 件", "prompt": "各カテゴリ（category）で「送禮」（贈り物）に最も合う商品を 1 件ずつ。\ncategory、id、name を返し、category 順に並べます。\n", "hints": ["DISTINCT ON (category) … ORDER BY category, 距離"], "answer": "SELECT DISTINCT ON (category) category, id, name\nFROM products\nORDER BY category, embedding <=> embed('送禮');\n", "explanation": "DISTINCT ON は PostgreSQL の「グループごとに最初の 1 件」です：ORDER BY で並べた後、各 category の最初の行だけを残します。\n検索結果ページで「カテゴリごとに 1 件ずつおすすめ」して、結果が 1 つのカテゴリに偏らないようにするときに使えます（多様化 diversification）。\n", "ordered": true, "write": false, "setup": null, "result": [{"table": {"columns": ["category", "id", "name"], "rows": [["休閒鞋", 588, "Skechers 休閒鞋 H408"], ["保養", 833, "SK-II 保養 T770"], ["健身器材", 199, "Reebok 健身器材 J177"], ["女裝", 875, "Lativ 女裝 L594"], ["寢具", 215, "宜得利 寢具 Y998"], ["廚房用品", 185, "Tefal 廚房用品 Q671"], ["彩妝", 1003, "KATE 彩妝 V126"], ["手機", 783, "Sony 手機 K167"], ["手機配件", 131, "小米 手機配件 X318"], ["收納", 1070, "宜得利 收納 I645"]], "total": 19}}]}, {"id": "neighbors-lateral", "chapter": "レコメンドと分類", "title": "各商品について近傍を 2 件ずつ", "prompt": "商品 806、469、1132 のそれぞれに最も似た 2 件の商品（自分自身を除く）。\nsource_id（元の商品）、id、name を返し、source_id 順、同じ商品の中では似ている順に並べます。\n", "hints": ["FROM products s CROSS JOIN LATERAL (SELECT … ORDER BY p.embedding <=> s.embedding LIMIT 2) n", "LATERAL サブクエリは左側のテーブルの列（s.embeddin
